    let h = `<div class="s3-result s3-bars">`;
    h += MB.board({ items: it, rows, cols, estValues: upto > e.testEnd ? MB.sim.estimates(e, e.testEnd) : undefined,
      highlight: decided ? e.winner : null, brackets, aria: `Estimate then exploit's season with n = ${n}: one row per product` });
    let line = "";
    if (e.winner < 0) line = upto >= T ? `With n = ${n} the test fills the whole season: no morning is left to exploit.` : "";
    else if (decided) {
      const w = it[e.winner];
      line = e.tied.length > 1 ? `After the test, a tie: ${MB.join(e.tied.map((i) => it[i].emo))}. The mirror picks the ${low(w.name)} ${w.emo} at random.`
        : `After the test, the highest estimate: the ${low(w.name)} ${w.emo}.`;
    }
    h += `<p class="say s3-line">${line || "&nbsp;"}</p>`;
    const series = [{ key: "queen", v: MB.sim.rateSoFar(s.queen) }, { key: "random", v: MB.sim.rateSoFar(s.random) }, { key: "ete", v: MB.sim.rateSoFar(e) }];
    const marks = e.testEnd < T ? [{ x: e.testEnd, label: e.testEnd >= 10 ? "end of the test" : "" }] : [];
    h += MB.rateChart({ series, upto, values: true, marks, aria: `The rates of the Queen's mirror, Random and estimate then exploit with n = ${n}, morning by morning` });
    return h + `</div>`;
  }
  function record(col, C) {
    if (!C.runs.length) return "";
    const it = col.items, shown = C.runs.slice(0, 10);
    const sw = (key) => `<span class="sw" style="--sw:var(${MB.STRAT[key].color})"></span>`;
    let h = `<div class="s3-rec"><table class="s3-runs"><caption>Your seasons, the newest first</caption>
      <thead><tr><th>n</th><th>Picked</th><th>${sw("ete")}${MB.STRAT.ete.name}</th><th>${sw("queen")}${MB.STRAT.queen.name}</th><th>${sw("random")}${MB.STRAT.random.name}</th></tr></thead><tbody>`;
    shown.forEach((r, j) => {
      const pick = r.pick < 0 ? `<span class="s3-none">none</span>` : `<span title="${it[r.pick].name}">${it[r.pick].emo}</span>${r.tied ? `<span class="s3-tie">tie</span>` : ""}`;
      const f = (x) => x.toFixed(2); // two decimals, so the column lines up
      h += `<tr${j === 0 ? ` class="last"` : ""}><td>${r.n}</td><td class="pk">${pick}</td><td>${f(r.ete)}</td><td>${f(r.queen)}</td><td>${f(r.random)}</td></tr>`;
    });
    h += `</tbody></table>${C.runs.length > shown.length ? `<p class="muted small">The last ${shown.length} of your ${C.runs.length} seasons.</p>` : ""}</div>`;
    h += `<div class="row"><button type="button" class="quiet" id="s3rev">${C.reveal ? "Hide what the Queen's mirror knows" : "What the Queen's mirror knows"}</button></div>`;
    if (C.reveal) h += `<div class="box"><strong>What the Queen's mirror knows</strong><p>The probability ${MB.pp} that ${custOf(col).name} taps each product. The Queen's mirror shows the one with the highest ${MB.pp} every morning.</p>${items(col, true)}</div>`;
    return h;
  }
  function challengeScene(col) {
    const cust = custOf(col);
    return {
      key: `ete-${col.id}`, title: col.title, steps: 2,
      render(el, step) {
        const C = CH[col.id];
        if (MB.isFresh() && C.playing) finish(C); // the reader left during a season: show it whole
        let h = `<div class="stack${MB.cls(step, 0)}">${MB.face(cust.id, "lg")}<p class="say">${STORY[col.id] || `${cust.name}'s mirror has five new products.`}</p></div>
          <div class="${MB.cls(step, 0)}">${items(col, false)}</div>`;
        if (step >= 1) {
          h += `<div class="stack s3-pickn s3-sm${MB.cls(step, 1)}"><p class="say">Choose n, then play a season. Play each n a few times: one season can be lucky.</p>
            <div class="s3-nrow"><span class="s3-nlab">n =</span><div class="opts" role="group" aria-label="n, the showings of each product in the test">${NS.map((n) => `<button type="button" class="s3-n" data-n="${n}" aria-pressed="${C.n === n}">${n}</button>`).join("")}</div></div>
            <div class="row"><button type="button" class="act" id="s3go"${C.n ? "" : " disabled"}>${C.n ? `Play a season with n = ${C.n}` : "Choose n first"}</button>
              ${C.playing ? `<span class="muted">Morning ${C.upto} of ${T}</span>` : ""}</div></div>`;
          if (C.cur) h += result(col, C);
          h += record(col, C);
        }
        el.innerHTML = h;
        el.querySelectorAll(".s3-n").forEach((b) => b.addEventListener("click", () => { C.n = parseInt(b.dataset.n, 10); MB.redraw(); }));
        MB.on(el, "#s3go", () => playSeason(col));
        MB.on(el, "#s3rev", () => { C.reveal = !C.reveal; MB.redraw(); });
      }
    };
  }

  // The average rate for every n from 1 to 20, exact (MB.sim.eteExact), for both collections.
  function averages() {
    if (AVG) return AVG;
    AVG = MB.COLLECTIONS.map((c) => {
      const p = c.items.map((it) => it.p), v = [];
      for (let n = 1; n <= 20; n++) v.push(MB.sim.eteExact(p, n, T).rate);
      const mx = Math.max(...v), best = [];
      v.forEach((x, k) => { if (x > mx - 0.0005) best.push(k + 1); }); // equal to three decimals: 5 and 6 for the ball
      return { c, v, best };
    });
    return AVG;
  }
  const AVG_COL = ["--accent", "--fg"];
  function averagesChart() {
    const A = averages(), lines = [];
    // Averages only: the Queen's mirror is compared on played seasons (the challenge), never as an average line (Carlos).
    A.forEach((a, j) => {
      lines.push({ pts: a.v.map((y, k) => [k + 1, y]), color: AVG_COL[j % AVG_COL.length] });
      a.best.forEach((n) => lines.push({ pts: [[n, a.v[n - 1]]], color: AVG_COL[j % AVG_COL.length], dot: true }));
    });
    const svg = MB.lineChart({ x0: 1, x1: 20, y0: 0, y1: 1, xTicks: NS.concat([15]).sort((a, b) => a - b), yTicks: [0, 0.2, 0.4, 0.6, 0.8, 1],
      xLabel: "n", yLabel: "average rate", lines, aria: "The average rate of estimate then exploit for every n from 1 to 20, for both collections" });
    const lg = A.map((a, j) => `<span class="mb-lg"><span class="sw" style="--sw:var(${AVG_COL[j % AVG_COL.length]})"></span>${MB.face(custOf(a.c).id, "xs")}${a.c.title}, best n: <b>${a.best.join(" or ")}</b></span>`).join("");
    return `<div class="mb-chart">${svg}<div class="mb-legend">${lg}</div></div>`;
  }

  // The movie (round 10, anim.js): the race season with n = 5. Chapter 1, the test: round 1 one morning at a time
  // (initialize), then rounds 2 to 5 faster, the products in turn from the top row down. Chapter 2: a medal flies from
  // the end of the test to the highest estimate, the other rows go quiet, and the remaining mornings show the winner.
  // Above the board, the season as a line: the test, then the remaining mornings.
  const CHIPS = PARTS.map((p) => p[0]);
  const pc = (x) => `${(100 * x / T).toFixed(2)}%`;
  const timeline = (done) => `<div class="mv-tl" role="img" aria-label="Morning ${done} of ${T}: the test is mornings 1 to ${TEST}, then the remaining mornings">
      <div class="mv-tlbar"><i class="mv-tlx" style="left:${pc(TEST)};width:${pc(EX)}"></i><b class="mv-tlf" data-mk="tl" style="width:${pc(done)}"></b><span class="mv-tlcut" style="left:${pc(TEST)}"></span></div>
      <div class="mv-tllab"><span class="${done <= TEST ? "on" : ""}" style="width:${pc(TEST)}">Test</span><span class="${done > TEST ? "on" : ""}" style="width:${pc(EX)}">Exploit</span></div></div>`;
  const WIN_T = taps(MB.sim.rows(E, TEST)[WIN]);
  // long: the board of the whole season (chapter 2); o.decided: the medal is on the winner and the other rows are quiet.
  const mctx = (long) => ({
    M: E.mornings, cols: long ? LONGEST : N, rowsAt: (u) => MB.sim.rows(E, u),
    board: (upto, o) => MB.board({ rows: MB.sim.rows(E, upto), estFormat: "both", cols: long ? LONGEST : N, slots: long ? 0 : N,
      pick: o.pick, highlight: o.decided ? WIN : o.pick, dim: !!o.decided, fresh: o.fresh || null,
      badges: o.decided ? { [WIN]: o.medal ? `<span class="mv-medal">🥇</span>` : "🥇" } : null,
      estValues: long && upto > TEST ? FROZEN : undefined, cls: o.glow ? "mv-estglow" : "",
      aria: "Cinderella's board with estimate then exploit: one row per product, one dot per showing" }),
    dev: (t, ph) => timeline(ph === "choose" ? t : t + 1),
    chips: (t) => MB.mvChips(CHIPS, t < K ? 0 : t < TEST ? 1 : 3),
    src: (t) => `.mb-row[data-k="${E.mornings[t].i}"] .mb-prod`,
    chooseOpt: (t) => ({ pick: E.mornings[t].i, decided: t >= TEST })
  });
  const MOVIE = MB.movie({
    key: "ete",
    frames(step) {
      if (step === 0) {
        const c = mctx(false);
        const F = [{ ms: 900, p: { parts: MB.mvChips(CHIPS, 0), dev: timeline(0), mid: "Morning 1", cin: MB.mvCin(null), board: c.board(0, {}),
          line: `First a test: every product n = ${N} times, in turn.` } }];
        ["slow", "slow", "mid", "mid", "mid"].forEach((mode, t) => F.push(...MB.mvMorning(c, t, mode)));
        for (let t = K; t < TEST; t++) F.push(...MB.mvMorning(c, t, "fast", MB.mvPace(t - K, 300, 150, 0.95)));
        return F;
      }
      const c = mctx(true), D = (o) => Object.assign({ decided: true }, o);
      const pick = E.tied.length > 1 ? `A tie: ${MB.join(E.tied.map(the))}. The mirror picks ${the(WIN)} at random.`
        : `The highest estimate after the test: ${the(WIN)}, ${WIN_T}/${N}.`;
      const F = [
        { ms: 1500, p: { parts: MB.mvChips(CHIPS, 2), dev: timeline(TEST), mid: `After morning ${TEST}`, cin: MB.mvCin(null), board: c.board(TEST, { glow: true }), line: pick } },
        { ms: 1050, fx: (A) => A.fly(".mv-tl .mv-tlcut", `.mb-row[data-k="${WIN}"] .mb-prod`, `<span class="mv-medalfly">🥇</span>`, { ms: 1000, s0: 0.6, s1: 1.5, s2: 0.7 }) },
        { ms: 1300, p: { board: c.board(TEST, D({ medal: true })), line: `Then ${the(WIN)} on every remaining morning, ${TEST + 1} to ${T}.` } }
      ];
      F.push(...MB.mvMorning(Object.assign({}, c, { board: (u, o) => c.board(u, D(o)) }), TEST, "mid"));
      for (let t = TEST + 1; t < T; t++) F.push(...MB.mvMorning(Object.assign({}, c, { board: (u, o) => c.board(u, D(o)) }), t, "fast", MB.mvPace(t - TEST - 1, 260, 45, 0.92)));
      F.push({ ms: 400, p: { parts: MB.mvChips(CHIPS, 3), board: c.board(T, D({})) } });
      return F;
    }
  });

  const scenes = [
    {
      key: "ete-idea", title: "First a test", steps: 2,
      render(el, step) { MOVIE.render(el, step); }
    },
    {
      key: "ete-walk", title: `Cinderella's season, n = ${N}`, steps: W_STEPS,
      render(el, step) {
        if (MB.isFresh()) {
          W.pop = false;
          W.playing = false;
          const r = roundOf(step);
          if (r) {
            // The round's dots arrive one by one, from the top row down.
            const a = K * (r - 1);
            if (MB.still) W.upto = a + K;
            else {
              W.upto = a;
              MB.later(() => MB.animate(K, 340, (k) => { W.upto = a + k; W.pop = true; MB.redraw(); }), 300);
            }
          } else W.upto = step === 0 ? 0 : step === 2 ? K : TEST;
        }
        const expl = step === W_EXPL, decided = step >= W_PICK;
        const upto = expl ? TEST + W.ex : W.upto, rows = MB.sim.rows(E, upto);
        const m = upto > 0 ? E.mornings[upto - 1] : null;
        const brackets = [{ from: 0, to: N - 1, label: `n = ${N}` }];
        if (expl) brackets.push({ from: N, to: LONGEST - 1, label: "remaining mornings", cls: "muted" });
        const board = MB.board({
          rows, estFormat: "both", cols: expl ? LONGEST : N, slots: expl ? 0 : N,
          estValues: step === 1 ? rows.map(() => null) : expl ? FROZEN : undefined,
          highlight: decided ? WIN : null, dim: decided, brackets,
          fresh: W.pop && m ? { row: m.i, col: rows[m.i].length - 1 } : null,
          aria: "Cinderella's board: one row per product, one dot per showing"
        });
        W.pop = false;
        const part = partOf(step);
        // Board, then the record of rounds, then the caption: the board keeps its place from step to step, and the
        // last new part (s3-sm) is scrolled into view clear of the sticky nav bar.
        let h = `<ol class="steps s3-parts" aria-label="The four parts">${PARTS.map((p, j) => `<li${j === part ? ` class="on" aria-current="step"` : ""}>${p[0]}</li>`).join("")}</ol>
          <div class="s3-walk s3-bars${step === 2 && MB.isFresh() ? " s3-estin" : ""}${expl ? " s3-frozen" : ""}">${board}</div>`;
        if (step >= 2) h += `<div class="${MB.cls(step, 2)}">${leaders(Math.min(N, Math.floor(Math.min(upto, TEST) / K)), decided)}</div>`;
        h += `<p class="say s3-cap s3-sm${MB.cls(step, step)}">${caption(step)}</p>`;
        if (step === 0) h += `<p class="say s3-sm${MB.cls(step, 0)}">One dot per showing: ${MB.KEY}</p>`;
        if (expl) {
          const done = W.ex >= EX;
          h += `<div class="row s3-sm${MB.cls(step, W_EXPL)}"><button type="button" class="act" id="s3play"${done ? " disabled" : ""}>${done ? "Season played" : W.ex ? `Morning ${TEST + W.ex} of ${T}` : `Play mornings ${TEST + 1} to ${T}`}</button></div>`;
          if (done) h += MB.totalRate("ete", E);
        }
        el.innerHTML = h;
        MB.on(el, "#s3play", () => {
          if (W.playing || W.ex >= EX) return;
          W.playing = true;
          const start = W.ex;
          MB.animate(EX - start, 40, (k) => { W.ex = start + k; W.pop = true; MB.redraw(); }, () => { W.playing = false; MB.redraw(); MB.showTotal(); });
        });
      }
    },
    {
      key: "ete-rate", title: "Against the Queen's mirror", steps: 2,
      render(el, step) {
        const s = R.other || RACE, w = s.ete.winner;
        const series = [{ key: "queen", v: MB.sim.rateSoFar(s.queen) }, { key: "random", v: MB.sim.rateSoFar(s.random) }, { key: "ete", v: MB.sim.rateSoFar(s.ete) }];
        let h = `<p class="say${MB.cls(step, 0)}">The same season, the same Cinderella: the rate so far after each morning.</p>
          <div class="${MB.cls(step, 0)}">${MB.rateChart({ series, values: true, marks: [{ x: TEST, label: "end of the test" }], aria: "The rates of the Queen's mirror, Random and estimate then exploit, morning by morning" })}</div>
          <div class="row"><button type="button" class="quiet" id="s3again">Another season</button>
            ${R.other ? `<button type="button" class="quiet" id="s3race">Back to the race season</button>` : ""}</div>`;
        if (step >= 1) {
          const after = R.other ? `After the test it shows only ${the(w)}${w === BEST ? ", Cinderella's favourite" : ""}.`
            : `After the test it shows only ${the(w)}${w === BEST ? ", Cinderella's favourite," : ""} and its rate climbs.`;
          h += `<p class="say s3-sm${MB.cls(step, 1)}">During the test, estimate then exploit shows every product equally often, as Random does. ${after}</p>`;
        }
        el.innerHTML = h;
        MB.on(el, "#s3again", () => { R.other = race(true); MB.redraw(); });
        MB.on(el, "#s3race", () => { R.other = null; MB.redraw(); });
      }
    },
    {
      key: "ete-challenge", title: "The challenge round", steps: 2,
      render(el, step) {
        let h = `<ul class="rules${MB.cls(step, 0)}"><li>Two new collections, one for each customer.</li><li>You choose n.</li>
            <li>Estimate then exploit plays a season with your n. The Queen's mirror and Random play the same season.</li></ul>
          <div class="s3-cols${MB.cls(step, 0)}">${MB.COLLECTIONS.map((c) => `<div class="card">${MB.face(custOf(c).id, "md")}<div class="name">${c.title}</div><div class="s3-emos">${c.items.map((it) => MB.tile(it, "sm")).join("")}</div></div>`).join("")}</div>`;
        if (step >= 1) h += `<div class="box keybox s3-sm${MB.cls(step, 1)}"><p><strong>Your goal:</strong> for each collection, the n with the highest rate.</p><p>A single season can be lucky, so play each n a few times.</p></div>`;
        el.innerHTML = h;
      }
    },
    ...MB.COLLECTIONS.map(challengeScene),
    {
      key: "ete-hard", title: "Choosing n is hard", steps: 4,
      render(el, step) {
        const ball = MB.COLLECTIONS.find((c) => c.id === "ball"), hair = MB.COLLECTIONS.find((c) => c.id === "hair");
        const fav = (c) => c.items.reduce((b, it) => (it.p > b.p ? it : b), c.items[0]);
        let h = `<p class="say s3-sm${MB.cls(step, 0)}"><b>A large n</b> wastes mornings on exploration: the test keeps showing products the customer rarely taps.${hair ? ` For ${low(hair.title)}, n = 20 spends the whole season on the test.` : ""}</p>`;
        if (step >= 1) h += `<p class="say s3-sm${MB.cls(step, 1)}"><b>A small n</b> risks not exploring enough: after a few showings, a weaker product can have the highest estimate.${ball ? ` For the ball, n = 1 usually misses the ${low(fav(ball).name)}.` : ""}</p>`;
        if (step >= 2) h += `<div class="box keybox s3-sm${MB.cls(step, 2)}"><p class="formula">The best n depends on the probabilities, and the mirror does not know them.</p></div>`;
        if (step >= 3) {
          h += `<div class="stack s3-sm${MB.cls(step, 3)}"><p class="say">The average rate over many seasons, for every n from 1 to 20:</p>${averagesChart()}
            <p class="say">Section 4: a strategy that never stops exploring.</p></div>`;
        }
        el.innerHTML = h;
      }
    },
    MB.pythonScene(3)
  ];
  MB.section(3, "Estimate then exploit", scenes);
})();
</script>
<script>
/* Section 4, epsilon-greedy. Written by agent S4 on 2026-11-05 from Carlos's request (REQUEST.md) and his sketch
   (sketch-2026-11-05-epsilon-greedy.jpg): the roulette and its two slices, the four steps (initialize, spin the
   roulette, sample, update the estimate), the race season of MB.sim.eg on the board morning by morning, the rest of
   the season, and the rate against the Queen's mirror and Random. Every number on screen comes from the season.
   Round 9 (2026-11-06, main session): the heads drawn by the engine; the roulette, the morning and Cinderella's
   mirror in one row above the board; the words above or below the pictures.
   Round 10 (2026-11-06, main session): the first scene is a movie (anim.js) and the reader's own spins; the list of
   the four steps is gone, their names light up in the movie and on the board's scenes. */
(function () {
  "use strict";
  const MB = window.MB, P = MB.P, PR = MB.PRODUCTS, T = MB.SEASON, K = PR.length, EPS = MB.EPS;
  const BEST = P.indexOf(Math.max(...P));
  const GOLD = "🥇", HAT = "🎩";
  const IN_N = Math.round(1 / EPS);                       // one spin in five (eps 0.2)
  const ONE_IN = `one spin in ${MB.words[IN_N] || IN_N}`;
  const low = (s) => s.charAt(0).toLowerCase() + s.slice(1);
  const up = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const the = (i) => `the ${low(PR[i].short)}`;
  const taps = (row) => row.filter(Boolean).length;
  const fr = (row) => `${taps(row)}/${row.length} = ${MB.dec(taps(row) / row.length)}`;
  const card = (i) => `<span class="s4-card" title="${PR[i].name}">${PR[i].emo}</span>`;

  // The race season (MB.RACE): the same moods and streams as every comparison of the game; fresh: another season.
  function race(fresh) {
    const u = MB.sim.moods(fresh ? MB.newSeed() : MB.raceSeed("moods"), T);
    return { u, queen: MB.sim.queen(P, u), random: MB.sim.random(P, u, fresh ? MB.newSeed() : MB.raceSeed("random")),
      ete: MB.sim.ete(P, u, fresh ? MB.newSeed() : MB.raceSeed("ete"), MB.ETE_N),
      eg: MB.sim.eg(P, u, fresh ? MB.newSeed() : MB.raceSeed("eg"), EPS) };
  }
  const RACE = race(false), E = RACE.eg, M = E.mornings;

  // The mornings that carry the story, found in the season (t counts from 0; it is morning t + 1).
  const firstFrom = (t0, f) => { for (let t = Math.max(t0, K); t < T; t++) if (f(M[t])) return t; return -1; };
  const explore = (m) => m.phase === "explore";
  let HAT1 = firstFrom(K, explore);                                        // morning 8: the first card from the hat
  if (HAT1 < 0) HAT1 = Math.min(K + 2, T - 1);
  let FIND = firstFrom(HAT1 + 1, (m) => explore(m) && m.i === BEST);      // morning 18: the hat finds the vacuum
  if (FIND < 0) FIND = Math.min(HAT1 + 10, T - 2);
  let FAST_END = firstFrom(FIND + 1, explore);                            // morning 23: the next card from the hat
  if (FAST_END < 0) FAST_END = Math.min(FIND + 5, T - 1);
  let lastOff = -1;                                                        // the last exploit morning off the favourite
  M.forEach((m, t) => { if (m.phase === "exploit" && m.i !== BEST) lastOff = t; });
  const LOCK = firstFrom(lastOff + 1, (m) => m.phase === "exploit");      // from morning 19 on, 🥇 is the vacuum
  const HATS = M.filter(explore).length, SPINS = T - K;
  // Greedy alone (no hat) on the same moods: after the initialization it shows one product every morning.
  const G = MB.sim.eg(P, RACE.u, MB.raceSeed("eg"), 0).mornings.slice(K);
  const STUCK = G[0].i, STUCK_ALL = G.every((m) => m.i === STUCK);
  const COLS = Math.max(...MB.sim.rows(E, FAST_END + 1).map((r) => r.length)) + 1; // the board up to morning 23: 14
  const LONGEST = Math.max(...MB.sim.rows(E).map((r) => r.length));                 // the vacuum's row at the end: 71

  // The four steps, lit one at a time in the movie and on the board's scenes.
  const SHORT = ["Initialize", "Spin", "Sample", "Update"];
  const partsLine = (on) => `<ol class="steps s4-parts" aria-label="The four steps">${SHORT.map((p, j) =>
    `<li${j === on ? ` class="on" aria-current="step"` : ""}>${p}</li>`).join("")}</ol>`;

  // The roulette, the morning and the scene's buttons, and Cinderella's mirror with the product of the morning; the
  // roulette is dim before the first spin. o.mirror: { i (the product), tap (true, false, or null before the sample),
  // late (the product shows when the needle lands), pop (the badge pops) }.
  const panel = (head, spin, o) => {
    o = o || {};
    const mi = o.mirror, mir = MB.mirror(mi && mi.i !== undefined && mi.i !== null ? PR[mi.i] : null,
      mi && mi.tap !== undefined && mi.tap !== null ? MB.badge(mi.tap).replace(" bump", mi.pop ? " bump" : "") : "",
      { size: "xs", cap: false, late: !!(mi && mi.late), label: mi && mi.i !== undefined && mi.i !== null ? `Cinderella's mirror shows the ${PR[mi.i].name.toLowerCase()}` : "Cinderella's mirror" });
    return `<div class="s4-panel"><div class="s4-wheel${o.dim ? " dim" : ""}">${MB.wheel(EPS, spin, { spin: !!o.anim })}</div>
    <div class="s4-pstack"><div class="s4-morning">${head}</div>${o.ctrl ? `<div class="row s4-ctrl">${o.ctrl}</div>` : ""}</div>${mir}</div>`;
  };
  // The board of the race season after upto mornings. o: { upto, cols, pick, staleAt (the estimates before that
  // morning), hideEst, pop, landing (the pick shows when the needle lands), upd, flash, estin, reveal, wide }.
  function board(o) {
    const rows = MB.sim.rows(E, o.upto);
    const estValues = o.hideEst ? rows.map(() => null)
      : o.staleAt !== undefined ? MB.sim.rows(E, o.staleAt).map((r) => MB.estText(r, "both")) : undefined;
    const cls = ["s4-board", o.wide ? "s4-bars" : "", o.landing ? "s4-landing" : "", o.staleAt !== undefined ? "s4-stale" : "",
      o.upd ? "s4-upd" : "", o.flash ? "s4-flash" : "", o.estin ? "s4-estin" : ""].filter(Boolean).join(" ");
    return `<div class="${cls}">${MB.board({ rows, cols: o.cols, estFormat: "both", estValues, pick: o.pick, highlight: o.pick,
      fresh: o.pop || null, left: o.reveal ? [{ head: MB.pp, cells: P.map(MB.dec), width: 40, cls: "s4-p" }] : undefined,
      aria: "Cinderella's board with epsilon-greedy: one row per product, one dot per showing" })}</div>`;
  }
  const popOf = (upto) => { const m = M[upto - 1], r = MB.sim.rows(E, upto)[m.i]; return { row: m.i, col: r.length - 1 }; };

  // What happens on morning t, in the words of the steps.
  function spinText(t) {
    const m = M[t], before = MB.sim.rows(E, t);
    if (explore(m)) return `<b>Spin:</b> the needle stops on ${HAT}, the small slice. A card from the hat, any of the five at random: ${the(m.i)} ${card(m.i)}.`;
    if (m.tied && m.tied.length > 1) return `<b>Spin:</b> the needle stops on ${GOLD}. A tie for the highest estimate: ${MB.join(m.tied.map(the))}. The mirror picks ${the(m.i)} at random.`;
    return `<b>Spin:</b> the needle stops on ${GOLD}, the highest estimate: ${the(m.i)}, ${fr(before[m.i])}.`;
  }
  const sampleText = (t) => `<b>Sample:</b> the mirror shows ${the(M[t].i)}. ${M[t].tap ? `Tap: an orange dot ${MB.TAP}` : `No tap: a white dot ${MB.NOTAP}`}.`;
  function updateText(t) {
    const i = M[t].i;
    return `<b>Update:</b> the estimate of ${the(i)} was ${fr(MB.sim.rows(E, t)[i])}. Now it is ${fr(MB.sim.rows(E, t + 1)[i])}.`;
  }
  // A morning told in one go: the three steps, one after the other (sub 0, 1, 2).
  function wholeText(t, sub) {
    const m = M[t], i = m.i;
    let s = `The same three steps. <b>Spin:</b> ${explore(m) ? HAT : GOLD}, ${the(i)}.`;
    if (sub >= 1) s += ` <b>Sample:</b> ${m.tap ? "tap" : "no tap"}.`;
    if (sub >= 2) s += ` <b>Update:</b> ${fr(MB.sim.rows(E, t)[i])} becomes ${fr(MB.sim.rows(E, t + 1)[i])}.`;
    return s;
  }
  function firstText() {
    const rows = MB.sim.rows(E, K), top = MB.sim.argmaxAll(rows.map(MB.estimate));
    const lead = top.length > 1 ? `A tie for the highest estimate: ${MB.join(top.map(the))}.` : `${up(the(top[0]))} has the highest estimate, ${fr(rows[top[0]])}.`;
    return `One dot each, so each estimate is 0 or 1. ${lead}`;
  }

  // The walkthrough on the board: the empty board, initialize, the first estimates, then morning K + 1 in three steps,
  // the mornings before the first card from the hat in one step each, and that morning in three steps.
  const WALK = [{ kind: "empty" }, { kind: "init" }, { kind: "first" }];
  const three = (t) => ["spin", "sample", "update"].forEach((kind) => WALK.push({ kind, t }));
  three(K);
  for (let t = K + 1; t < HAT1; t++) WALK.push({ kind: "whole", t });
  if (HAT1 > K) three(HAT1);

  const I = { spins: [], spin: 0.8, anim: false };                                  // the first scene's roulette
  const W = { upto: 0, pop: false, sub: 0, anim: false, flash: false };             // the walkthrough
  const F = { upto: HAT1 + 1, phase: "done", anim: false, pop: false, flash: false };  // one morning per click
  const R = { upto: FAST_END + 1, playing: false, reveal: false };                  // the rest of the season
  const C = { other: null };                                                         // the rate chart's other season

  function spinIt(n) {
    for (let j = 0; j < n; j++) I.spins.push(MB.rand());
    I.spin = I.spins[I.spins.length - 1];
    I.anim = true;
    MB.redraw();
  }

  // One click, one whole morning: the needle turns, then the dot, then the estimate.
  function nextMorning() {
    if (F.upto > FAST_END) return;
    MB.stopTimers(); // a morning still running ends now
    F.upto += 1;
    if (MB.still) { F.phase = "done"; F.pop = true; MB.redraw(); return; }
    F.phase = "spin";
    F.anim = true;
    MB.redraw();
    MB.later(() => { F.phase = "sample"; F.pop = true; MB.redraw(); }, 1350);
    MB.later(() => { F.phase = "done"; F.flash = true; MB.redraw(); }, 2050);
  }
  function fastText(t, ph) {
    const m = M[t];
    let s = `${explore(m) ? `${HAT} A card from the hat` : `${GOLD} The highest estimate`}: ${the(m.i)}${explore(m) ? ` ${card(m.i)}` : ""}.`;
    if (ph === "spin") return s;
    s += m.tap ? " Tap!" : " No tap.";
    if (ph !== "done") return s;
    const before = MB.sim.estimates(E, t), after = MB.sim.estimates(E, t + 1);
    const othersZero = before.every((e, k) => k === m.i || !e);
    const top = MB.sim.argmaxAll(after.map((e) => (e === null ? -1 : e)));
    if (t === FIND && top.length === 1 && top[0] === BEST) s += ` Its estimate, ${fr(MB.sim.rows(E, t + 1)[BEST])}, is now the highest.`;
    else if (t < FIND && m.phase === "exploit" && othersZero) s += ` The other estimates are all 0, so ${GOLD} keeps picking ${the(m.i)}.`;
    else if (t > FIND && t < FAST_END && m.phase === "exploit" && m.i === BEST) s += ` ${GOLD} now picks ${the(BEST)}.`;
    else if (t === FAST_END && explore(m)) s += ` The hat keeps showing other products now and then, all season.`;
    return s;
  }

  // The movie (round 10, anim.js). Chapter 1, the roulette alone: the needle spins five times, the spins of
  // Cinderella's mornings 6 to 10, and the slice it stops on lights its name. Chapter 2, on the board: initialize,
  // then mornings 6 to 8. On the large slice the product with the highest estimate (the medal on its row) flies to
  // the mirror; on the small slice a card from the hat does.
  const lgs = (lit) => `<div class="mv-lgs"><span class="mv-lg${lit === "gold" ? " on" : ""}"><span class="ic">${GOLD}</span>the highest estimate</span><span class="mv-lg${lit === "hat" ? " on" : ""}"><span class="ic">${HAT}</span>a card from the hat</span></div>`;
  const slice = (t) => (explore(M[t]) ? "hat" : "gold");
  const TRY = [K, K + 1, K + 2, K + 3, K + 4];
  const bigWheel = (spin, lit, done) => `<div class="mv-wheelbox">${MB.wheel(EPS, spin, { label: spin === null ? "the roulette" : undefined })}
      <div class="mv-trail" role="img" aria-label="${done ? `the spins so far: ${TRY.slice(0, done).map((t) => (explore(M[t]) ? "the hat" : "the medal")).join(", ")}` : "no spin yet"}">${TRY.slice(0, done).map((t, j) => `<span class="${j === done - 1 && lit ? "nw" : ""}">${explore(M[t]) ? HAT : GOLD}</span>`).join("")}</div></div>${lgs(lit)}`;
  // The medal on the rows with the highest estimate, once every product has a dot.
  const medals = (upto, pop) => {
    if (upto < K) return null;
    const b = {};
    MB.sim.argmaxAll(MB.sim.estimates(E, upto).map((e) => (e === null ? -1 : e))).forEach((k) => { b[k] = pop ? `<span class="mv-medal">${GOLD}</span>` : GOLD; });
    return b;
  };
  const smallDev = (t, ph) => {
    if (t < K) return `<div class="mv-wheelbox s4-wheel dim">${MB.wheel(EPS, null, {})}</div>${lgs(null)}`;
    const m = M[t], lit = ph === "choose" ? null : slice(t);
    return `<div class="mv-wheelbox">${MB.wheel(EPS, m.spin, {})}</div>${lgs(lit)}${lit === "hat" ? MB.mvHat(m.i, true) : ""}`;
  };
  const BEAT = { choose: 1, show: 2, dot: 3 };
  const ectx = {
    M, cols: COLS, rowsAt: (u) => MB.sim.rows(E, u),
    board: (upto, o) => MB.board({ rows: MB.sim.rows(E, upto), cols: COLS, estFormat: "both", pick: o.pick, highlight: o.pick, fresh: o.fresh || null,
      badges: medals(upto, !!o.pop), aria: "Cinderella's board with epsilon-greedy: one row per product, one dot per showing" }),
    dev: smallDev,
    chips: (t, beat) => MB.mvChips(SHORT, t < K ? 0 : BEAT[beat] === undefined ? -1 : BEAT[beat]),
    src: (t) => (explore(M[t]) ? `.mv-hat .mv-card[data-i="${M[t].i}"]` : `.mb-row[data-k="${M[t].i}"] .mb-prod`),
    chooseFx: (A, t) => { if (t >= K) A.spin(".mv-dev .mb-needle"); },
    chooseMs: (t) => (t < K ? 300 : 1450),
    tie: (t) => (M[t].phase === "exploit" && M[t].tied && M[t].tied.length > 1 ? M[t].tied : null)
  };
  const MOVIE = MB.movie({
    key: "eg",
    cls: (step) => (step === 0 ? "mv-big" : ""),
    frames(step) {
      if (step === 0) {
        const F = [{ ms: 900, p: { dev: bigWheel(null, null, 0), line: `The small slice is ε = ${EPS} of the wheel: ${ONE_IN}.` } }];
        TRY.forEach((t, j) => {
          F.push({ ms: 1450, p: { dev: bigWheel(M[t].spin, null, j), mid: `Spin ${j + 1}` }, fx: (A) => A.spin(".mv-dev .mb-needle") });
          F.push({ ms: 1000, p: { dev: bigWheel(M[t].spin, slice(t), j + 1) } });
        });
        return F;
      }
      const F = [{ ms: 800, p: { parts: MB.mvChips(SHORT, 0), dev: smallDev(0, "chosen"), mid: "Morning 1", cin: MB.mvCin(null), board: ectx.board(0, {}),
        line: "" } }];
      for (let t = 0; t < K; t++) F.push(...MB.mvMorning(ectx, t, "quick"));
      F.push({ ms: 1300, p: { mid: `After morning ${K}`, board: ectx.board(K, { pop: true }) } });
      F.push(...MB.mvMorning(ectx, K, "slow"));
      for (let t = K + 1; t < HAT1; t++) F.push(...MB.mvMorning(ectx, t, "mid"));
      if (HAT1 > K) F.push(...MB.mvMorning(ectx, HAT1, "slow"));
      return F;
    }
  });

  const scenes = [
    {
      key: "eg-idea", title: "The roulette", steps: 3,
      render(el, step) {
        if (step < 2) { MOVIE.render(el, step); return; }
        // The reader's own spins (Carlos, round 5: "You show the roulette. I like it very much.").
        const n = I.spins.length, hats = I.spins.filter((x) => x < EPS).length, last = n ? (I.spins[n - 1] < EPS ? "hat" : "gold") : null;
        el.innerHTML = `<div class="mv mv-eg mv-big"><div class="mv-scene"><div class="mv-dev"><div class="mv-wheelbox">${MB.wheel(EPS, I.spin, { spin: I.anim })}</div>${lgs(I.anim ? null : last)}</div></div>
            <p class="say${MB.cls(step, 2)}">Spin it yourself.</p>
            <div class="row s4-btns"><button type="button" class="act" id="s4spin">Spin</button><button type="button" class="quiet" id="s4spin10">Spin 10 times</button></div>
            <p class="muted s4-tally">${n ? `${n} ${n === 1 ? "spin" : "spins"}: ${n - hats} ${GOLD} and ${hats} ${HAT}` : "No spins yet."}</p>
            ${n ? `<div class="s4-hist" role="img" aria-label="The last ${Math.min(10, n)} spins">${I.spins.slice(-10).map((x) => (x < EPS ? HAT : GOLD)).join("")}</div>` : ""}</div>`;
        if (I.lgT) clearTimeout(I.lgT);
        I.lgT = I.anim ? MB.later(() => { const l = el.querySelector(".mv-lgs"); if (l) l.outerHTML = lgs(last); }, 1250) : null;
        I.anim = false;
        MB.on(el, "#s4spin", () => spinIt(1));
        MB.on(el, "#s4spin10", () => spinIt(10));
      }
    },
    {
      key: "eg-walk", title: `Cinderella's season, ε = ${EPS}`, steps: WALK.length,
      render(el, step) {
        const w = WALK[step], fresh = MB.isFresh();
        if (fresh) {
          W.pop = false; W.sub = 0; W.anim = false; W.flash = false;
          if (w.kind === "init") {
            // The five dots arrive one by one, from the top row down.
            if (MB.still) W.upto = K;
            else {
              W.upto = 0;
              MB.later(() => MB.animate(K, 340, (k) => { W.upto = k; W.pop = true; MB.redraw(); }), 300);
            }
          } else if (w.kind === "whole") {
            if (MB.still) W.sub = 2;
            else {
              W.anim = true;
              MB.later(() => { W.sub = 1; W.pop = true; MB.redraw(); }, 1400);
              MB.later(() => { W.sub = 2; W.flash = true; MB.redraw(); }, 2250);
            }
          }
        }
        const o = { cols: COLS, upto: 0 };
        let part = -1, head, spin = null, anim = false, cap, mirror = null;
        if (w.kind === "empty") {
          head = "A new season";
          cap = `A new season at Cinderella's. No dots yet, so every estimate is unknown. One dot per showing: ${MB.KEY}`;
        } else if (w.kind === "init") {
          part = 0; head = `Mornings 1 to ${K}`;
          o.upto = W.upto; o.hideEst = true;
          if (W.pop && W.upto) o.pop = popOf(W.upto);
          if (W.upto) mirror = { i: M[W.upto - 1].i, tap: M[W.upto - 1].tap, pop: W.pop };
          cap = `<b>Initialize:</b> mornings 1 to ${K} show each product once, from the top row down.`;
        } else if (w.kind === "first") {
          part = 0; head = `After morning ${K}`;
          o.upto = K; o.estin = fresh;
          cap = firstText();
        } else {
          const t = w.t, m = M[t];
          const sub = w.kind === "whole" ? W.sub : ["spin", "sample", "update"].indexOf(w.kind);
          part = 1 + sub; head = `Morning ${t + 1}`; spin = m.spin; o.pick = m.i;
          o.upto = sub === 0 ? t : t + 1;
          if (sub === 0) { anim = w.kind === "whole" ? W.anim : fresh; o.landing = anim; }
          if (sub === 1) { o.staleAt = t; if (w.kind === "whole" ? W.pop : fresh) o.pop = popOf(t + 1); }
          if (sub === 2) { o.upd = true; o.flash = w.kind === "whole" ? W.flash : fresh; }
          mirror = { i: m.i, tap: sub >= 1 ? m.tap : null, late: sub === 0 && anim, pop: sub === 1 && !!o.pop };
          cap = w.kind === "whole" ? wholeText(t, sub) : [spinText, sampleText, updateText][sub](t);
        }
        const late = anim ? " s4-late" : "";
        el.innerHTML = `${partsLine(part)}
          <div class="s4-play">${panel(head, spin, { dim: spin === null, anim, mirror })}${board(o)}
            <p class="say s4-cap s4-sm${late}${MB.cls(step, step)}">${cap}</p></div>`;
        W.anim = false; W.pop = false; W.flash = false;
      }
    },
    {
      key: "eg-faster", title: "Morning after morning", steps: 2,
      render(el, step) {
        if (MB.isFresh()) {
          F.phase = "done"; F.anim = false; F.pop = false; F.flash = false;
          if (step === 1 && F.upto <= FAST_END) F.upto = FAST_END + 1; // the lesson needs every morning up to the next hat
        }
        const started = F.upto > HAT1 + 1, done = F.upto > FAST_END;
        const t = F.upto - 1, m = M[t], ph = F.phase;
        const o = { cols: COLS, upto: ph === "spin" ? t : F.upto };
        if (started) {
          o.pick = m.i;
          o.landing = ph === "spin" && F.anim;
          if (ph === "sample") o.staleAt = t;
          if (ph === "done") o.upd = true;
          if (F.pop && ph !== "spin") o.pop = popOf(F.upto);
          o.flash = F.flash;
        }
        const part = !started ? -1 : ph === "spin" ? 1 : ph === "sample" ? 2 : 3;
        const cap = started ? fastText(t, ph) : `Mornings ${HAT1 + 2} to ${FAST_END + 1}. Each click plays one whole morning: spin, sample, update.`;
        const ctrl = step === 0 ? `<button type="button" class="act" id="s4next"${done ? " disabled" : ""}>${done ? `Morning ${FAST_END + 1} played` : "Next morning"}</button>` : "";
        const fm = started ? { i: m.i, tap: ph === "spin" ? null : m.tap, late: ph === "spin" && F.anim, pop: ph === "sample" && F.pop } : null;
        let h = `${partsLine(part)}
          <div class="s4-play">${panel(`Morning ${F.upto}`, m.spin === undefined ? null : m.spin, { anim: F.anim, ctrl, mirror: fm })}${board(o)}
            <p class="say s4-cap${ph === "spin" && F.anim ? " s4-late" : ""}">${cap}</p></div>`;
        if (step === 1) {
          const lesson = STUCK_ALL && STUCK !== BEST
            ? `<p>Without the hat, ${GOLD} would have shown ${the(STUCK)} on every morning of the season: the other estimates were 0, and an estimate changes only when its product is shown.</p>`
            : "";
          h += `<div class="box keybox s4-sm${MB.cls(step, 1)}">${lesson}<p>On morning ${FIND + 1}, the hat found ${the(BEST)}, Cinderella's favourite. From morning ${LOCK + 1} on, ${GOLD} picks it.</p></div>`;
        }
        el.innerHTML = h;
        F.anim = false; F.pop = false; F.flash = false;
        MB.on(el, "#s4next", nextMorning);
      }
    },
    {
      key: "eg-season", title: "The whole season", steps: 1,
      render(el, step) {
        if (MB.isFresh() && R.playing) { R.playing = false; R.upto = T; } // the reader left during the season: show it whole
        const t = R.upto - 1, m = M[t], done = R.upto >= T, started = R.upto > FAST_END + 1;
        const o = { cols: LONGEST, upto: R.upto, wide: true, reveal: done && R.reveal };
        if (R.playing) { o.pick = m.i; o.pop = popOf(R.upto); }
        let cap;
        if (done) cap = `Season played. The needle stopped on ${HAT} ${HATS} times in ${SPINS} spins. From morning ${LOCK + 1} on, ${GOLD} always picked ${the(BEST)}.`;
        else if (started) cap = `${explore(m) ? `${HAT} A card from the hat` : `${GOLD} The highest estimate`}: ${the(m.i)}.${m.tap ? " Tap!" : " No tap."}`;
        else cap = `Mornings ${FAST_END + 2} to ${T}: the same three steps every morning.`;
        const ctrl = done ? `<button type="button" class="quiet" id="s4rev">${R.reveal ? "Hide what the Queen's mirror knows" : "What the Queen's mirror knows"}</button>`
          : `<button type="button" class="act" id="s4rest"${R.playing ? " disabled" : ""}>${R.playing ? `Morning ${R.upto} of ${T}` : `Play mornings ${FAST_END + 2} to ${T}`}</button>`;
        const rm = { i: m.i, tap: m.tap }; // before the play: morning 23, as the previous scene ended
        let h = `<div class="s4-play s4-wide">${panel(`Morning ${R.upto}`, m.spin === undefined ? null : m.spin, { ctrl, mirror: rm })}${board(o)}
            <p class="say s4-cap">${cap}</p></div>`;
        if (done) h += MB.totalRate("eg", E);
        if (done && R.reveal) h += `<div class="box"><strong>What the Queen's mirror knows</strong><p>The column ${MB.pp}: the probability that Cinderella taps each product, beside the mirror's estimate ${MB.phat}.</p></div>`;
        el.innerHTML = h;
        MB.on(el, "#s4rest", () => {
          if (R.playing || R.upto >= T) return;
          MB.stopTimers();
          R.playing = true;
          const start = R.upto;
          MB.animate(T - start, 60, (k) => { R.upto = start + k; MB.redraw(); }, () => { R.playing = false; MB.redraw(); MB.showTotal(); });
        });
        MB.on(el, "#s4rev", () => { R.reveal = !R.reveal; MB.redraw(); });
      }
    },
    {
      key: "eg-rate", title: "Against the Queen's mirror", steps: 2,
      render(el, step) {
        const s = C.other || RACE;
        // Every mirror so far (Carlos, 2026-11-06: "every strategy must be compared against the queen's mirror and all
        // previous strategies", estimate then exploit included).
        const series = ["queen", "random", "ete", "eg"].map((k) => ({ key: k, v: MB.sim.rateSoFar(s[k]) }));
        let h = `<p class="say${MB.cls(step, 0)}">The same season, the same Cinderella: the rate so far after each morning.</p>
          <div class="${MB.cls(step, 0)}">${MB.rateChart({ series, values: true, aria: "The rates of the Queen's mirror, Random, estimate then exploit and epsilon-greedy, morning by morning" })}</div>
          <div class="row"><button type="button" class="quiet" id="s4again">Another season</button>
            ${C.other ? `<button type="button" class="quiet" id="s4race">Back to the race season</button>` : ""}</div>`;
        if (step >= 1) {
          const n = MB.sim.rows(s.eg).map((r) => r.length), top = n.indexOf(Math.max(...n));
          const read = top === BEST
            ? `Epsilon-greedy first has to find Cinderella's favourite, ${the(BEST)}. Then ${GOLD} shows it on most mornings, and its line climbs towards the Queen's mirror.`
            : `On this season, epsilon-greedy showed ${the(top)} more often than Cinderella's favourite, ${the(BEST)}.`;
          h += `<div class="stack s4-sm${MB.cls(step, 1)}"><p class="say">${read}</p><p class="say">Section 5: a mirror that explores the products it knows least.</p></div>`;
        }
        el.innerHTML = h;
        MB.on(el, "#s4again", () => { C.other = race(true); MB.redraw(); });
        MB.on(el, "#s4race", () => { C.other = null; MB.redraw(); });
      }
    },
    MB.pythonScene(4)
  ];
  MB.section(4, "Epsilon-greedy", scenes);
})();
</script>
<script>
/* Section 5, UCB. Written by agent S5 on 2026-11-05 and 2026-11-06 from Carlos's request (REQUEST.md, "The final one
   is UCB"): the overview, the board with a new column between the estimate and the product (the exploration bonus,
   1 / square root of n) and the plot of how the bonus decays, estimate + bonus on the far left, the procedure played
   on the race season (initialize, show the highest estimate + bonus, update, repeat), and the rate chart of every
   mirror on the same season. Carlos: "there is no challenge round". The main session added on 2026-11-06 the season's
   total rate (round 7), the scene "The real UCB" (round 8) and moved the final race to Rapunzel's (round 8).
   Round 9 (2026-11-06, main session): the heads drawn by the engine, the words above or below the pictures, and on a
   wide screen the column estimate + bonus drawn as a bar, the estimate solid and the bonus light.
   Round 10 (2026-11-06, main session): the first scene is a movie (anim.js), the bars race; the sum's bars line up. */
(function () {
  "use strict";
  const MB = window.MB, P = MB.P, PR = MB.PRODUCTS, T = MB.SEASON, K = PR.length;
  const low = (s) => s.charAt(0).toLowerCase() + s.slice(1);
  const up = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const the = (i) => `the ${low(PR[i].short)}`;
  const count = (row) => row.filter(Boolean).length;
  const dec = MB.dec;
  const hund = (x) => Math.round(x * 100); // a number in hundredths, as the board shows it
  const eq = (s) => `<span class="s5-nw">${s}</span>`; // a small equation stays on one line

  // The walkthrough: UCB on Cinderella's race season (MB.RACE).
  const U = MB.sim.ucb(P, MB.sim.moods(MB.raceSeed("moods"), T), MB.raceSeed("ucb"));
  // The final race is at Rapunzel's (Carlos, 2026-11-06, round 8: "Race on Rapunzel"). Her ladder, 0.8, stands far above
  // her other products, so UCB soon stops exploring them: UCB is first of the four learners in 80% of her seasons and
  // in 42% of Cinderella's (PLAN.md, section Round 8). On the race season: Queen 78, UCB 70, epsilon-greedy 67, estimate
  // then exploit 62, Random 32. Every mirror on one season: the race season, or another one with fresh seeds.
  const ORDER = ["queen", "random", "ete", "eg", "ucb"], RAP = MB.CUSTOMERS[1], RP = RAP.p;
  const LADDER = RP.indexOf(Math.max(...RP));
  function race(fresh) {
    const seed = (k) => (fresh ? MB.newSeed() : MB.raceSeed(k));
    const u = MB.sim.moods(seed("moods"), T);
    return { queen: MB.sim.queen(RP, u), random: MB.sim.random(RP, u, seed("random")),
      ete: MB.sim.ete(RP, u, seed("ete"), MB.ETE_N), eg: MB.sim.eg(RP, u, seed("eg"), MB.EPS), ucb: MB.sim.ucb(RP, u, seed("ucb")) };
  }
  const RACE = race(false);
  const rowsAt = (upto) => MB.sim.rows(U, upto);
  // TWICE: the first moment every product has two dots or more (after morning 18 of the race season). The walkthrough
  // plays the mornings up to it one by one; the scenes on the bonus show the board at that moment.
  const TWICE = (() => { for (let t = K; t < T; t++) if (rowsAt(t).every((r) => r.length >= 2)) return t; return T; })();
  const COLS = Math.max(...rowsAt(TWICE).map((r) => r.length)); // the longest row at that moment (9 dots)
  const LONGEST = Math.max(...rowsAt(T).map((r) => r.length));  // the longest row at the end of the season (78)
  const STEPPED = 3; // the first mornings after initialize, played one part at a time (mornings 6, 7 and 8)

  // The board's numbers for each row: dots n, taps t, the estimate t / n, the bonus 1 / square root of n, and their sum
  // as shown (the two shown numbers added in hundredths, so the column adds up on screen). null before the first dot.
  function nums(rows) {
    return rows.map((r) => {
      const n = r.length;
      if (!n) return null;
      const t = count(r), e = hund(t / n), b = hund(1 / Math.sqrt(n));
      return { n, t, e: e / 100, b: b / 100, s: (e + b) / 100 };
    });
  }
  const Q = `<span class="mb-unknown">?</span>`;
  const estCell = (x) => `<span class="mb-frac">${x.t}/${x.n}</span><span class="mb-decv">${dec(x.e)}</span>`;
  const bonCell = (x) => `<span class="s5-frac">1/√${x.n}</span><span class="s5-decv">${dec(x.b)}</span>`;
  const narrow = () => !!(window.matchMedia && window.matchMedia("(max-width: 560px)").matches);

  // UCB's board. Carlos's columns from the product leftwards: the product, the bonus, the estimate; estimate + bonus on
  // the far left. o: rows, cols, sum and bonus (show those columns), hide (every number as ?), top (rows whose sum is
  // lit), hl, pick and fresh (as in MB.board), chg (the row whose numbers just changed), flash (they flash), cls.
  function board(o) {
    const N = nums(o.rows), sm = narrow(), top = o.top === undefined || o.top === null ? [] : [].concat(o.top);
    const cell = (k, html) => {
      if (o.hide || !N[k]) return Q;
      return o.chg === k ? `<span class="s5-chg${o.flash ? " s5-flash" : ""}">${html}</span>` : html;
    };
    const left = [];
    if (o.sum) {
      // On a wide screen the sum is also a bar: the estimate solid, the bonus light, 2 the longest possible.
      const bar = (x) => (sm ? "" : `<span class="s5-bar" aria-hidden="true"><i class="e" style="width:${(x.e * 50).toFixed(1)}%"></i><i class="b" style="width:${(x.b * 50).toFixed(1)}%"></i></span>`);
      left.push({ head: `<span class="s5-hs">${MB.phat} + bonus</span>`, width: sm ? 46 : 112, cls: "s5-sum",
        cells: N.map((x, k) => cell(k, x && `<span class="s5-sumc${sm ? " nb" : ""}">${bar(x)}<span class="s5-s${top.includes(k) ? " s5-top" : ""}">${dec(x.s)}</span></span>`)) });
    }
    left.push({ head: MB.phat, width: sm ? 42 : 56, cls: "mb-est s5-est", cells: N.map((x, k) => cell(k, x && estCell(x))) });
    if (o.bonus) left.push({ head: `<span class="s5-hb">bonus</span>`, width: sm ? 46 : 60, cls: "s5-bon", cells: N.map((x, k) => cell(k, x && bonCell(x))) });
    return MB.board({ rows: o.rows, cols: o.cols, est: false, left, highlight: o.hl, pick: o.pick, fresh: o.fresh,
      cls: `s5-board${o.cls ? " " + o.cls : ""}`,
      aria: `UCB's board: ${o.sum ? "estimate + bonus, " : ""}the estimate${o.bonus ? " and the bonus" : ""} left of each product, one dot per showing` });
  }

  // The four steps (Carlos: initialize; the highest estimate + bonus, ties broken at random; tap or no tap, update the
  // estimate and the bonus; repeat every morning). The walkthrough shows the short names in one line, the current one lit.
  const PARTS = [
    ["Initialize", "show each product once: its first estimate and its first bonus."],
    ["Show the highest", "the product with the highest estimate + bonus. A tie is broken at random."],
    ["Update", "tap or no tap, its estimate and its bonus change."],
    ["Repeat", "every morning, to the end of the season."]
  ];
  const partsLine = (on) => `<ol class="steps s5-parts" aria-label="The four steps">${PARTS.map((p, j) => `<li${j === on ? ` class="on" aria-current="step"` : ""}>${p[0]}</li>`).join("")}</ol>`;

  // The bonus of the board after TWICE mornings: two worked examples, the row with the most dots and one with the fewest.
  function bonusExamples(N) {
    const ks = N.map((x, k) => k);
    const most = ks.reduce((b, k) => (N[k].n > N[b].n ? k : b), 0), few = ks.reduce((b, k) => (N[k].n < N[b].n ? k : b), 0);
    const ex = (k) => { const n = N[k].n, r = Math.sqrt(n); return `<span class="s5-nw">1/√${n} = ${Number.isInteger(r) && r > 1 ? `1/${r} = ` : ""}${dec(N[k].b)}</span>`; };
    return `n is the number of dots in the row. ${up(the(most))} has ${N[most].n}: ${ex(most)}. ${up(the(few))} has ${N[few].n}: ${ex(few)}.`;
  }
  // The plot of 1 / square root of n for n from 1 to 30 (Carlos: "a plot of 1 divided by the square root of n, showing
  // how it decays"), with the board's rows as points on the curve.
  function decayChart(N) {
    const X = 30, pts = [], at = {};
    for (let x = 1; x <= X + 1e-9; x += 0.25) pts.push([x, 1 / Math.sqrt(x)]);
    N.forEach((x, k) => { if (x) (at[x.n] = at[x.n] || []).push(k); });
    const ns = Object.keys(at).map(Number).sort((a, b) => a - b);
    const lines = [{ pts, color: "--c-ucb", width: 3 }].concat(ns.map((n) => ({ pts: [[n, 1 / Math.sqrt(n)]], color: "--fg", dot: true })));
    const svg = MB.lineChart({ x0: 1, x1: X, y0: 0, y1: 1, xTicks: [1, 5, 10, 15, 20, 25, 30], yTicks: [0, 0.2, 0.4, 0.6, 0.8, 1],
      xLabel: "n, the dots", yLabel: "bonus", lines, height: 280,
      aria: "The bonus 1 / square root of n for n from 1 to 30, with the rows of the board on the curve" });
    const lg = ns.map((n) => `<span class="mb-lg"><span class="s5-pt"></span><span class="s5-emos">${at[n].map((k) => `<span title="${PR[k].name}">${PR[k].emo}</span>`).join("")}</span>${n} dots: <b>${dec(1 / Math.sqrt(n))}</b></span>`).join("");
    return `<div class="mb-chart s5-decay">${svg}<div class="mb-legend">${lg}</div></div>`;
  }

  // The captions of the walkthrough, from the race season (t counts the mornings from 0).
  function chooseText(t) {
    const m = U.mornings[t], N = nums(rowsAt(t)), x = N[m.i], prev = U.mornings[t - 1];
    if (m.tied.length > 1) {
      const drop = prev && prev.phase === "ucb" && !m.tied.includes(prev.i) ? `${up(the(prev.i))} has dropped to ${dec(N[prev.i].s)}. ` : "";
      return `${drop}${up(MB.words[m.tied.length] || String(m.tied.length))} products tie at ${dec(x.s)}. A tie is broken at random: ${the(m.i)}.`;
    }
    if (prev && prev.phase === "ucb" && prev.i === m.i) return `${up(the(m.i))} is still the highest: ${eq(`${dec(x.e)} + ${dec(x.b)} = ${dec(x.s)}`)}.`;
    return `The highest estimate + bonus: ${the(m.i)}, ${eq(`${dec(x.e)} + ${dec(x.b)} = ${dec(x.s)}`)}. The mirror shows it.`;
  }
  function updateText(t) {
    const m = U.mornings[t], x = nums(rowsAt(t + 1))[m.i];
    return `${m.tap ? "Tap!" : "No tap."} ${up(the(m.i))} now has ${x.n} dots: its estimate becomes ${eq(`${x.t}/${x.n} = ${dec(x.e)}`)} and its bonus ${eq(`1/√${x.n} = ${dec(x.b)}`)}.`;
  }
  // One whole morning of the repeat step: the choice, and once done the tap or no tap with the row's new numbers.
  function morningText(t, done) {
    const m = U.mornings[t], x = nums(rowsAt(t))[m.i], k = m.tied.length;
    let s = `<b>Morning ${t + 1}.</b> `;
    if (k > 1) s += `${up(MB.words[k] || String(k))} products ${done ? "tied" : "tie"} at ${dec(x.s)}. Drawn at random: ${the(m.i)}${x.n === 1 ? ", its second showing" : ""}.`;
    else s += done ? `The highest estimate + bonus was ${the(m.i)}'s, ${dec(x.s)}.` : `${up(the(m.i))} has the highest estimate + bonus, ${dec(x.s)}.`;
    if (done) {
      const y = nums(rowsAt(t + 1))[m.i];
      s += ` ${m.tap ? "Tap!" : "No tap."} Now ${eq(`${dec(y.e)} + ${dec(y.b)} = ${dec(y.s)}`)}.`;
    }
    return s;
  }
  const leadOf = (N) => N.reduce((b, x, k) => (x && (N[b] === null || x.s > N[b].s) ? k : b), 0);
  // The end of the season: the dots of each row, and why the products with the fewest dots stopped being shown.
  function endText() {
    const rows = rowsAt(T), N = nums(rows), n = rows.map((r) => r.length);
    const by = n.map((v, k) => k).sort((a, b) => n[b] - n[a] || a - b), least = n[by[by.length - 1]];
    const few = by.filter((k) => n[k] === least), rest = by.filter((k) => n[k] !== least), lead = leadOf(N);
    const items = rest.map((k, j) => `${n[k]}${j === 0 ? " dots" : ""} for ${the(k)}`);
    items.push(few.length > 1 && rest.length ? `${least} for each of the other ${MB.words[few.length] || few.length}` : `${least}${rest.length ? "" : " dots"} for ${MB.join(few.map(the))}`);
    let s = `After ${T} mornings: ${MB.join(items)}.`;
    const same = few.every((k) => N[k].s === N[few[0]].s && N[k].e === N[few[0]].e);
    if (few.length > 1 && same && !few.includes(lead)) {
      const x = N[few[0]];
      s += ` Their bonus is still ${dec(x.b)}, but their estimate is ${dec(x.e)}: ${eq(`${dec(x.e)} + ${dec(x.b)} = ${dec(x.s)}`)} stays below ${the(lead)}'s ${dec(N[lead].s)}.`;
    }
    return s;
  }
  // Cinderella's probabilities, behind a secondary button (the answer stays hidden by default).
  function pCards() {
    const mx = Math.max(...P);
    return `<div class="s5-pcards">${PR.map((q, i) => `<div class="s5-pc${P[i] === mx ? " best" : ""}" title="${q.name}">${MB.tile(q, "sm")}<div class="s5-pv">${MB.pp} = ${dec(P[i])}</div></div>`).join("")}</div>`;
  }

  // The walkthrough's steps: 0 the empty board; 1 initialize (the dots arrive one by one, the numbers still hidden);
  // 2 the first estimates and bonuses; then for each of the STEPPED mornings, the highest estimate + bonus, then the
  // update; then the mornings up to TWICE, one per click; then the rest of the season.
  const STEPS = [{ part: -1 }, { part: 0, init: true }, { part: 0, first: true }];
  for (let j = 0; j < STEPPED; j++) STEPS.push({ part: 1, choose: K + j }, { part: 2, upd: K + j });
  STEPS.push({ part: 3, repeat: true }, { part: 3, rest: true });
  const W = { upto: 0, pop: false, day: K + STEPPED, choosing: null, busy: false, rest: 0, playing: false, reveal: false };

  // One morning of the repeat step: first the choice (the highest estimate + bonus lit), then the tap or no tap and the
  // update. A click during a morning finishes it at once.
  function playMorning() {
    if (W.busy) { MB.stopTimers(); W.day = W.choosing + 1; W.choosing = null; W.busy = false; W.pop = true; MB.redraw(); return; }
    if (W.day >= TWICE) return;
    const t = W.day;
    W.busy = true;
    MB.animate(2, 1000, (k) => {
      if (k === 1) W.choosing = t;
      else { W.choosing = null; W.day = t + 1; W.busy = false; W.pop = true; }
      MB.redraw();
    });
  }
  function playRest() {
    if (W.playing || TWICE + W.rest >= T) return;
    W.playing = true;
    const start = W.rest, n = T - TWICE - start;
    MB.animate(n, 45, (k) => { W.rest = start + k; W.pop = true; if (k >= n) W.playing = false; MB.redraw(); }, MB.showTotal);
  }

  // The last scene: every mirror on one season.
  const R = { other: null, upto: T, playing: false };
  function playAnother() {
    MB.stopTimers();
    R.other = race(true);
    R.upto = 0;
    R.playing = true;
    MB.animate(T, 25, (k) => { R.upto = k; if (k >= T) R.playing = false; MB.redraw(); });
  }

  // The movie (round 10, anim.js): the bars race on Cinderella's race season. Each row has one bar, its estimate solid
  // and its bonus light, and each morning the longest bar is shown. Chapter 1, initialize. Chapter 2, mornings 6 to 8
  // one beat at a time (four bars tie on morning 8). Chapter 3, mornings 9 to 19: the vacuum, then the products left
  // aside come back while their bonus is still large.
  const REPEAT = K + STEPPED;                                       // morning 9, the first of chapter 3
  const LAST = 19;                                                  // the movie ends after morning 19
  const MCOLS = Math.max(...rowsAt(LAST).map((r) => r.length));     // the vacuum's 10 dots
  const UCHIPS = PARTS.map((p) => p[0]);
  const KEY = `<span class="mv-ukey"><i class="e"></i>estimate<i class="b"></i>bonus</span>`;
  const ubar = (x, k, lit) => (x ? `<span class="mv-ubar${lit ? " top" : ""}"><i class="e" data-mk="e${k}" style="width:${(x.e * 50).toFixed(1)}%"></i><i class="b" data-mk="b${k}" style="width:${(x.b * 50).toFixed(1)}%"></i></span>`
    : `<span class="mv-ubar"></span>`) + `<span class="mv-uspark${lit ? " on" : ""}" aria-hidden="true">${lit ? "✨" : ""}</span>`;
  const uctx = {
    M: U.mornings, cols: MCOLS, rowsAt,
    board: (upto, o) => {
      const N = nums(rowsAt(upto)), lit = [].concat(o.lit || []), ring = o.hop !== undefined ? o.hop : o.pick;
      return MB.board({ rows: rowsAt(upto), cols: MCOLS, est: false, pick: ring, highlight: ring, fresh: o.fresh || null,
        left: [{ head: "", width: narrow() ? 96 : 168, cls: "mv-ucbcol", cells: N.map((x, k) => ubar(x, k, lit.includes(k))) }],
        aria: "UCB's board: one bar per product, the estimate solid and the bonus light, then one dot per showing" });
    },
    dev: () => KEY,
    chips: (t, beat) => MB.mvChips(UCHIPS, t < K ? 0 : t >= REPEAT ? 3 : beat === "dot" ? 2 : beat === "choose" || beat === "show" ? 1 : -1),
    src: (t) => `.mb-row[data-k="${U.mornings[t].i}"] .mb-prod`,
    chooseOpt: (t) => { const m = U.mornings[t]; return m.tied ? { lit: m.tied, pick: m.tied.length === 1 ? m.i : undefined } : { pick: m.i }; },
    tie: (t) => (U.mornings[t].tied && U.mornings[t].tied.length > 1 ? U.mornings[t].tied : null)
  };
  const LINES = ["Few dots, a big bonus.", "The longest bar is shown. Its bonus shrinks.", "A product left aside keeps its bonus, so its turn comes back."];
  const MOVIE = MB.movie({
    key: "ucb",
    frames(step) {
      const t0 = [0, K, REPEAT][step], prev = t0 ? U.mornings[t0 - 1] : null;
      const F = [{ ms: step ? 900 : 1000, p: { parts: MB.mvChips(UCHIPS, step === 2 ? 3 : step), dev: KEY, mid: `Morning ${t0 + 1}`,
        cin: prev ? MB.mvCin(prev.i, prev.tap, false) : MB.mvCin(null), board: uctx.board(t0, {}), line: LINES[step] } }];
      if (step === 0) {
        F.push(...MB.mvMorning(uctx, 0, "mid"));
        for (let t = 1; t < K; t++) F.push(...MB.mvMorning(uctx, t, "quick", 650));
      } else if (step === 1) {
        for (let t = K; t < REPEAT; t++) F.push(...MB.mvMorning(uctx, t, "slow"));
      } else {
        for (let t = REPEAT; t < LAST; t++) {
          const m = U.mornings[t], back = m.tied && m.tied.length > 1;
          F.push(...MB.mvMorning(uctx, t, back || t === LAST - 1 ? "mid" : "fast", 700));
        }
      }
      return F;
    }
  });

  const scenes = [
    {
      key: "ucb-idea", title: "A bonus for exploring", steps: 3,
      render(el, step) { MOVIE.render(el, step); }
    },
    {
      key: "ucb-bonus", title: "The exploration bonus", steps: 4,
      render(el, step) {
        const rows = rowsAt(TWICE), N = nums(rows);
        const top = `<p class="say${MB.cls(step, 0)}">Cinderella's board after ${TWICE} mornings with UCB: the estimate left of each product, one dot per showing.</p>`;
        let right = "";
        if (step >= 1) right += `<p class="say s5-sm${MB.cls(step, 1)}">A new column between the estimate and the product: the exploration <b>bonus</b>. It favours the products the mirror has not explored enough.</p>`;
        if (step >= 2) right += `<div class="box keybox s5-sm${MB.cls(step, 2)}"><p class="formula big">bonus = 1 / √n</p><p>${bonusExamples(N)}</p></div>`;
        if (step >= 3) right += `<div class="s5-col s5-sm${MB.cls(step, 3)}">${decayChart(N)}<p class="say">The more dots, the smaller the bonus. It drops fast over the first dots, then slowly.</p></div>`;
        el.innerHTML = `${top}
          <div class="s5-left${step === 1 && MB.isFresh() ? " s5-bonin" : ""}">${board({ rows, cols: COLS, bonus: step >= 1 })}</div>
          ${right}`;
      }
    },
    {
      key: "ucb-score", title: "Estimate + bonus", steps: 2,
      render(el, step) {
        const rows = rowsAt(TWICE), m = U.mornings[TWICE], x = nums(rows)[m.i], lit = step >= 1;
        let h = `<div class="s5-walk${step === 0 && MB.isFresh() ? " s5-sumin" : ""}">${board({ rows, cols: COLS, bonus: true, sum: true,
            hl: lit ? m.tied : null, top: lit ? m.tied : null, pick: lit ? m.i : null })}</div>
          <p class="say s5-sm${MB.cls(step, 0)}">A third column, on the far left: estimate + bonus, row by row.</p>`;
        if (lit) {
          const which = m.tied.length > 1 ? `a tie, broken at random: ${the(m.i)}` : `${the(m.i)}, ${eq(`${dec(x.e)} + ${dec(x.b)} = ${dec(x.s)}`)}`;
          h += `<p class="say s5-sm${MB.cls(step, 1)}">Each morning the mirror shows the product with the highest estimate + bonus. On morning ${TWICE + 1}: ${which}.</p>`;
        }
        el.innerHTML = h;
      }
    },
    {
      key: "ucb-walk", title: "Cinderella's season", steps: STEPS.length,
      render(el, step) {
        const s = STEPS[step], fresh = MB.isFresh();
        if (fresh) {
          W.pop = false;
          W.busy = false;
          W.choosing = null;
          W.playing = false;
          if (s.init) {
            // The five dots of initialize arrive one by one, from the top row down.
            if (MB.still) W.upto = K;
            else {
              W.upto = 0;
              MB.later(() => MB.animate(K, 340, (k) => { W.upto = k; W.pop = true; MB.redraw(); }), 300);
            }
          }
        }
        let o, cap, extra = "";
        if (step === 0) {
          o = { rows: rowsAt(0), hide: true };
          cap = "Cinderella's board before the first morning. No dots yet, so no estimate and no bonus.";
        } else if (s.init) {
          const m = W.upto > 0 ? U.mornings[W.upto - 1] : null;
          o = { rows: rowsAt(W.upto), hide: true, fresh: W.pop && m ? { row: m.i, col: 0 } : null };
          cap = `Initialize: mornings 1 to ${K} show each product once, from the top row down.`;
        } else if (s.first) {
          o = { rows: rowsAt(K), cls: fresh ? "s5-numin" : "" };
          cap = "One dot each: every estimate is 0 or 1, and every bonus is 1/√1 = 1.";
        } else if (s.choose !== undefined) {
          const m = U.mornings[s.choose];
          o = { rows: rowsAt(s.choose), hl: m.tied, top: m.tied, pick: m.i };
          cap = `<b>Morning ${s.choose + 1}.</b> ${chooseText(s.choose)}`;
        } else if (s.upd !== undefined) {
          const m = U.mornings[s.upd];
          o = { rows: rowsAt(s.upd + 1), hl: m.i, pick: m.i, fresh, chg: m.i, flash: fresh };
          cap = `<b>Morning ${s.upd + 1}.</b> ${updateText(s.upd)}`;
        } else if (s.repeat) {
          if (W.choosing !== null) {
            const m = U.mornings[W.choosing];
            o = { rows: rowsAt(W.choosing), hl: m.tied, top: m.tied, pick: m.i };
            cap = morningText(W.choosing, false);
          } else if (W.day > K + STEPPED) {
            const m = U.mornings[W.day - 1];
            o = { rows: rowsAt(W.day), hl: m.i, pick: m.i, fresh: W.pop, chg: m.i, flash: W.pop };
            cap = morningText(W.day - 1, true) + (W.day >= TWICE ? " Every product now has two dots or more." : "");
          } else {
            o = { rows: rowsAt(W.day) };
            cap = "Repeat, morning after morning. Each click plays one morning: the highest estimate + bonus, then the update.";
          }
          const over = W.day >= TWICE;
          extra = `<div class="row s5-sm${MB.cls(step, step)}"><button type="button" class="act" id="s5day"${over ? " disabled" : ""}>${over ? `Played up to morning ${TWICE}` : `Play morning ${W.day + 1}`}</button></div>`;
        } else {
          const upto = TWICE + W.rest, done = upto >= T, m = upto > TWICE ? U.mornings[upto - 1] : null, rows = rowsAt(upto);
          o = { rows, cols: LONGEST, hl: !done && m ? m.i : null, pick: !done && m ? m.i : null,
            fresh: W.pop && m ? { row: m.i, col: rows[m.i].length - 1 } : null, top: done ? leadOf(nums(rows)) : null };
          cap = done ? endText() : `Repeat to the end of the season, mornings ${TWICE + 1} to ${T}.`;
          extra = `<div class="row s5-sm${MB.cls(step, step)}"><button type="button" class="act" id="s5rest"${done ? " disabled" : ""}>${done ? "Season played" : W.rest ? `Morning ${upto} of ${T}` : `Play mornings ${TWICE + 1} to ${T}`}</button></div>`;
          if (done) {
            extra += MB.totalRate("ucb", U);
            extra += `<div class="row"><button type="button" class="quiet" id="s5rev">${W.reveal ? "Hide what the Queen's mirror knows" : "What the Queen's mirror knows"}</button></div>`;
            if (W.reveal) extra += `<div class="box s5-sm s5-reveal"><strong>What the Queen's mirror knows</strong><p>Cinderella's probability ${MB.pp} of a tap, for each product. Compare it with the estimates on the board.</p>${pCards()}</div>`;
          }
        }
        let h = `${partsLine(s.part)}
          <div class="s5-walk${s.rest ? " s5-long" : ""}">${board(Object.assign({ cols: COLS, sum: true, bonus: true }, o))}</div>
          <p class="say s5-cap s5-sm${MB.cls(step, step)}">${cap}</p>`;
        if (step === 0) h += `<p class="say s5-sm${MB.cls(step, 0)}">One dot per showing: ${MB.KEY}</p>`;
        el.innerHTML = h + extra;
        W.pop = false;
        MB.on(el, "#s5day", playMorning);
        MB.on(el, "#s5rest", playRest);
        MB.on(el, "#s5rev", () => {
          W.reveal = !W.reveal;
          MB.redraw();
          const box = el.querySelector(".s5-reveal"); // the box opens below the board: bring it into view
          if (box && box.scrollIntoView) box.scrollIntoView({ block: "nearest", behavior: MB.still ? "auto" : "smooth" });
        });
      }
    },
    {
      // The real UCB's bound, one scene (Carlos, 2026-11-06: "show after the simplified UCB the actual UCB with the
      // actual upper bound, but only one slide. I don't want a lot of fuss about the upper bound").
      key: "ucb-real", title: "The real UCB", steps: 1, center: true,
      render(el, step) {
        el.innerHTML = `<p class="say${MB.cls(step, 0)}">Each morning the real UCB shows the product with the highest</p>
          <div class="box keybox${MB.cls(step, 0)}"><p class="formula big">${MB.phat} + √(2 ln <i>t</i> / <i>n</i>)</p>
            <p><i>n</i>: the dots of the row. <i>t</i>: the mornings so far. ln: the natural logarithm.</p></div>
          <p class="say${MB.cls(step, 0)}">With high confidence, the probability ${MB.pp} of a tap is below this number: an upper confidence bound, the name of the strategy.</p>
          <p class="say${MB.cls(step, 0)}">Its bonus grows slowly with <i>t</i>, so a product left aside long enough is shown again. The game's bonus, 1 / √<i>n</i>, leaves <i>t</i> out.</p>`;
      }
    },
    {
      key: "ucb-race", title: "All the mirrors", steps: 1,
      render(el, step) {
        if (MB.isFresh() && R.playing) { R.playing = false; R.upto = T; } // the reader left during a season: show it whole
        const s = R.other || RACE;
        const series = ORDER.map((k) => ({ key: k, v: MB.sim.rateSoFar(s[k]) }));
        el.innerHTML = `<div class="row s5-who${MB.cls(step, 0)}">${MB.face(RAP.id, "md")}${MB.tile(PR[LADDER], "md")}</div>
          <p class="say${MB.cls(step, 0)}">The last race is at ${RAP.name}'s ${RAP.emo}. Her favourite, ${the(LADDER)} ${PR[LADDER].emo} (${MB.pp} = ${dec(RP[LADDER])}), stands far above her other products.</p>
          <p class="say${MB.cls(step, 0)}">Every mirror on the same season: the rate so far after each morning.</p>
          <div class="${MB.cls(step, 0)}">${MB.rateChart({ series, upto: R.upto, values: true,
            aria: `The rates of the Queen's mirror, Random, estimate then exploit, epsilon-greedy and UCB at ${RAP.name}'s, morning by morning` })}</div>
          <div class="row"><button type="button" class="quiet" id="s5again">Another season</button>
            ${R.other ? `<button type="button" class="quiet" id="s5race">Back to the race season</button>` : ""}
            ${R.playing ? `<span class="muted">Morning ${R.upto} of ${T}</span>` : ""}</div>`;
        MB.on(el, "#s5again", playAnother);
        MB.on(el, "#s5race", () => { MB.stopTimers(); R.other = null; R.upto = T; R.playing = false; MB.redraw(); });
      }
    },
    MB.pythonScene(5)
  ];
  MB.section(5, "UCB", scenes);
})();
</script>
<script>MB.start();</script>
</body>
</html>
