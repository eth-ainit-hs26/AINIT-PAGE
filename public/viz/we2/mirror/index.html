<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Once Upon a Mirror</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style>
/* Once Upon a Mirror, the shared style: the tokens (both themes), the frame, the shared parts, the board, the charts,
   the roulette. Owned by the main session. Section files add their own classes in sec<N>.css with the prefix s<N>-.
   Round 9 (2026-11-06): the frame of the Video Store and the Matchmaker (a leaf with a fine double rule, EB Garamond
   throughout, violet section cards, Ge'ez numerals in the pager), the words centred above or below the pictures. */
:root {
  --bg: #F9F4E3;
  --leaf: #FFFBF0;
  --panel: #F7F0DE;
  --fg: #2A2432;
  --muted: #6B6275;
  --line: #D8CBA9;
  --accent: #58409A;
  --accent-soft: #ECE5F8;
  --ochre: #8F5A06;
  --gold: #D9A21B;
  --urn: #E1813A;
  --urn-dark: #A4521A;
  --urn-band: #F3C552;
  --urn-window: #FFF6E6;
  --tap: #F28A1E;
  --tap-edge: #B85C0C;
  --tap-hi: #FFD9A8;
  --notap: #FFFFFF;
  --notap-hi: #FFFFFF;
  --notap-edge: #ADA291;
  --hat: #FFC94D;
  --yes: #2F7A4D;
  --no: #9B3A3A;
  --c-queen: #B98209;
  --c-random: #8A8195;
  --c-ete: #58409A;
  --c-eg: #148A72;
  --c-ucb: #CC3466;
  --card: #58409A;
  --card-rule: #7A64BC;
  --card-ink: #FFFBF0;
  --card-soft: #D8CDF4;
  --serif: "EB Garamond", Garamond, "Iowan Old Style", Georgia, "Times New Roman", serif;
  --display: var(--serif);
  --ui: var(--serif);
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --geez: "Kefa", "Noto Sans Ethiopic", "Nyala", "Ebrima", serif;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1720; --leaf: #231E2A; --panel: #2C2634; --fg: #EEE7D8; --muted: #A99FB3; --line: #3D3548;
    --accent: #B9A6F3; --accent-soft: #352C4B; --ochre: #E3AA4C; --gold: #F0C150;
    --urn-window: #3A2F26; --tap: #FF9C40; --tap-edge: #FFC58A; --tap-hi: #FFE2BF; --notap: #2E2935; --notap-hi: #2E2935; --notap-edge: #CFC6B8;
    --yes: #73D19A; --no: #EE9393;
    --c-queen: #F0C150; --c-random: #A49BB0; --c-ete: #B9A6F3; --c-eg: #5FD0BC; --c-ucb: #F28DB0;
    --card: #2F2552; --card-rule: #4C3F7E; --card-ink: #EEE7D8; --card-soft: #B9A6F3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1720; --leaf: #231E2A; --panel: #2C2634; --fg: #EEE7D8; --muted: #A99FB3; --line: #3D3548;
  --accent: #B9A6F3; --accent-soft: #352C4B; --ochre: #E3AA4C; --gold: #F0C150;
  --urn-window: #3A2F26; --tap: #FF9C40; --tap-edge: #FFC58A; --tap-hi: #FFE2BF; --notap: #2E2935; --notap-hi: #2E2935; --notap-edge: #CFC6B8;
  --yes: #73D19A; --no: #EE9393;
  --c-queen: #F0C150; --c-random: #A49BB0; --c-ete: #B9A6F3; --c-eg: #5FD0BC; --c-ucb: #F28DB0;
  --card: #2F2552; --card-rule: #4C3F7E; --card-ink: #EEE7D8; --card-soft: #B9A6F3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--serif); font-size: 18px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
p { margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.geez { font-family: var(--geez); color: var(--accent); line-height: 1; }
.em { font-family: var(--emoji); font-style: normal; line-height: 1; }
.sc { font-variant-caps: all-small-caps; letter-spacing: .09em; }

/* The frame: the top bar with the pager, one leaf at a time, Back and Next with the steps of the scene between them. */
.app { height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 8px var(--gut-r) 8px var(--gut); border-bottom: 1px solid var(--line); min-width: 0; overflow: hidden; }
.brand { font-size: 21px; font-weight: 500; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.brand em { color: var(--accent); }
.pager { margin-left: auto; display: flex; align-items: center; gap: 4px; min-width: 0; }
.pager .grp { display: flex; align-items: center; gap: 4px; }
.pager .grp + .grp { margin-left: 5px; padding-left: 9px; border-left: 1px solid var(--line); }
.pager button { flex: none; padding: 0; cursor: pointer; line-height: 1; }
.pager .sec { width: 28px; height: 28px; border-radius: 7px; border: 1.5px solid var(--ochre); background: transparent; color: var(--ochre); font-family: var(--geez); font-size: 14px; }
.pager .grp.here .sec { background: var(--panel); }
.pager .grp .sec[aria-current="step"] { background: var(--ochre); color: var(--leaf); }
.pager .sc { width: 27px; height: 27px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--leaf); color: var(--accent); font-family: var(--geez); font-size: 14px; }
.pager .sc[aria-current="step"] { background: var(--accent); border-color: var(--accent); color: var(--leaf); }
.pager .py { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--ochre); background: transparent; margin: 0 3px; }
.pager .py[aria-current="step"] { background: var(--ochre); }
.themebtn { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; padding: 0; cursor: pointer; display: grid; place-items: center; color: var(--muted); flex: none; }
.themebtn svg { width: 18px; height: 18px; }
.scroller { overflow: auto; padding: 12px var(--gut-r) 12px var(--gut); overscroll-behavior: contain; }
.foot { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px var(--gut-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gut); border-top: 1px solid var(--line); }
.navbtn { border: 1.5px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 5px 20px 7px; font-size: 17px; cursor: pointer; min-width: 104px; }
.navbtn.next { background: var(--accent); color: var(--leaf); }
.navbtn:disabled { opacity: .3; cursor: default; }
.stepdots { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; }
.stepdots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: transform .2s ease; }
.stepdots i.past { background: var(--muted); }
.stepdots i.on { background: var(--accent); transform: scale(1.25); }

/* A scene is one leaf of the codex: a fine double rule around one screen. */
.leaf { min-height: 100%; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; background: var(--leaf); border: 3px double var(--line); border-radius: 4px; padding: 16px 26px 24px; }
.leaf.enter { animation: enter .35s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.scene-head { display: flex; align-items: center; gap: 14px; min-width: 0; }
.scene-head .geez { font-size: 32px; flex: none; }
.scene-head h2 { font-size: 27px; line-height: 1.1; font-weight: 600; margin: 0; text-wrap: balance; min-width: 0; }
.scene-head .secname { margin-left: auto; color: var(--muted); font-variant-caps: all-small-caps; letter-spacing: .09em; font-size: 15px; white-space: nowrap; }
.stage { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 16px; text-align: center; min-width: 0; }
.stage > * { max-width: 100%; }
.leaf.center .stage { justify-content: center; }
.leaf.cover .scene-head, .leaf.intro .scene-head { display: none; }
.leaf.cover .stage, .leaf.intro .stage { justify-content: center; padding-top: 4px; }
.scene-error { padding: 12px; border: 2px dashed var(--no); color: var(--no); border-radius: 10px; }

/* Section cards: a leaf of its own before sections 2 to 5. The leaf turns violet with a wipe like a turning page, then
   the section's numeral, a kicker, the title, one line and a motif come in one after another (as in the Video Store). */
.leaf.intro { background: var(--card); border-color: var(--card-rule); color: var(--card-ink); }
.leaf.intro.enter { animation: card-wipe .7s cubic-bezier(.65, 0, .35, 1) both; }
@keyframes card-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.sec-card { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 8px 0; }
.sec-geez { font-family: var(--geez); font-size: clamp(64px, 15vh, 128px); line-height: 1; color: var(--card-soft); }
.sec-kicker { font-variant-caps: all-small-caps; letter-spacing: .24em; font-size: 19px; color: var(--card-soft); }
.sec-title { font-style: italic; font-weight: 500; font-size: clamp(42px, 9vh, 76px); line-height: 1.04; text-wrap: balance; }
.sec-line { max-width: 36ch; font-size: 22px; line-height: 1.38; text-wrap: balance; }
.sec-motif { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; margin-top: 12px; }
.sec-card.play > * { animation: card-in .7s cubic-bezier(.2, .7, .2, 1) both; }
.sec-card.play .sec-geez { animation-name: card-geez; animation-duration: .9s; animation-delay: .45s; }
.sec-card.play .sec-kicker { animation-delay: .75s; }
.sec-card.play .sec-title { animation-delay: .9s; }
.sec-card.play .sec-line { animation-delay: 1.2s; }
.sec-card.play .sec-motif { animation: none; }
.sec-card.play .sec-motif > * { animation: card-pop .5s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: calc(1.5s + var(--j, 0) * .14s); }
@keyframes card-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes card-geez { from { opacity: 0; transform: scale(.55) rotate(-10deg); } to { opacity: 1; transform: none; } }
@keyframes card-pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }

/* Type and common parts. Words stand above or below a picture, centred (Carlos, 2026-11-06). */
h1.display, h2.display { font-family: var(--display); font-weight: 600; line-height: 1.1; margin: 0; text-wrap: balance; }
h1.display { font-size: clamp(2.1rem, 6vw, 3rem); }
h2.display { font-size: clamp(1.5rem, 4.5vw, 2rem); }
.lead { font-style: italic; font-size: 1.45rem; line-height: 1.3; margin: 0 auto; max-width: 36ch; text-wrap: balance; }
.say { font-size: 1.12rem; margin: 0 auto; max-width: 58ch; text-wrap: pretty; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.new { animation: fadein .4s ease; scroll-margin-bottom: 14px; }
.mb-total { scroll-margin-bottom: 14px; }
@keyframes fadein { from { opacity: .15; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.row { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: center; }
.stack { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); width: 100%; max-width: 980px; }
.card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.card .emo { font-family: var(--emoji); font-size: 2.4rem; line-height: 1.15; }
.card .name { font-weight: 600; font-size: 1.08rem; }
.card .slogan { font-style: italic; font-size: 1.02rem; color: var(--muted); line-height: 1.3; }
.card ul { margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 1rem; }
.box { background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 680px; }
.box p { margin: 0; }
.box ul, .box ol { text-align: left; }
.keybox { background: var(--accent-soft); border-color: var(--accent); }
.rules { margin: 0 auto; padding-left: 1.3em; font-size: 1.08rem; display: flex; flex-direction: column; gap: 4px; max-width: 58ch; text-align: left; }
.formula { font-family: var(--display); font-size: 1.35rem; margin: 0; font-variant-numeric: lining-nums; }
.formula.big { font-size: 1.75rem; }
sub, sup { font-size: .65em; line-height: 0; }
.act { font: inherit; font-size: 17px; line-height: 1.2; padding: 6px 18px 8px; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--leaf); cursor: pointer; text-decoration: none; display: inline-block; }
.act:disabled { opacity: .45; cursor: default; }
.quiet { font: inherit; font-size: 16px; line-height: 1.2; padding: 6px 16px 8px; border-radius: 999px; border: 1.5px dashed var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
.res { font-weight: 600; font-size: 1.08rem; }
.res.yes { color: var(--yes); }
.res.no { color: var(--no); }
.opts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.opts button { font: inherit; min-width: 48px; padding: 6px 12px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--leaf); color: var(--fg); cursor: pointer; font-variant-numeric: lining-nums; }
.opts button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1.5px var(--accent); }
.opts button.right { border: 2px solid var(--yes); }
.opts button.wrong { border: 2px solid var(--no); }
.mb-seclabel { font-size: .85rem; letter-spacing: .14em; font-variant-caps: all-small-caps; text-transform: lowercase; color: var(--ochre); font-weight: 600; }
.mb-phat { font-family: var(--display); font-size: 1.12em; }
.steps { margin: 0 auto; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; max-width: 620px; counter-reset: st; text-align: left; }
.steps li { display: flex; gap: 12px; align-items: baseline; font-size: 1.08rem; color: var(--muted); }
.steps li::before { counter-increment: st; content: counter(st); flex: none; width: 27px; height: 27px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-grid; place-items: center; font-weight: 600; font-size: .95rem; font-variant-numeric: lining-nums; transform: translateY(-2px); }
.steps li.on { color: var(--fg); }
.steps li.on::before { background: var(--accent); border-color: var(--accent); color: var(--leaf); }
.steps li b { color: var(--fg); font-weight: 600; }

/* The magic mirror (art.js draws the frame) and its badge. */
.mb-mirror { --w: 150px; width: var(--w); aspect-ratio: 160 / 212; flex: none; position: relative; display: block; }
.mb-mirror > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.mb-mirror .glass { position: absolute; left: 18%; right: 18%; top: 22%; bottom: 13%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.mb-mirror .emo { font-family: var(--emoji); font-size: calc(var(--w) * .3); line-height: 1.05; }
.mb-mirror .cap { font-size: max(9.5px, calc(var(--w) * .085)); line-height: 1.1; color: #5C5368; font-variant-caps: all-small-caps; letter-spacing: .05em; }
.mb-mirror.xs { --w: 70px; }
.mb-mirror.sm { --w: 84px; }
.mb-mirror.md { --w: 120px; }
.mb-mirror.lg { --w: 176px; }
.mb-mirror.show .emo { animation: mbshow .55s cubic-bezier(.3, 1.4, .5, 1) both; }
@keyframes mbshow { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
.mb-mirror.late .glass { animation: mblate 1.35s ease both; }
@keyframes mblate { 0%, 86% { opacity: 0; } 100% { opacity: 1; } }
.mb-badge { position: absolute; right: -14%; top: 12%; z-index: 2; background: var(--tap); color: #2A1300; font-weight: 700; border-radius: 999px; padding: 3px 11px 5px; font-size: 1rem; white-space: nowrap; box-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
.mb-badge.no { background: #E9E4EC; color: #4B4357; }
.mb-badge.bump { animation: bump .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { from { transform: scale(.3); } to { transform: none; } }
.mb-spark { position: absolute; inset: -8%; pointer-events: none; }
.mb-spark i { position: absolute; width: 14px; height: 14px; background: radial-gradient(circle, #FFE9A8 0 30%, transparent 32%), conic-gradient(from 45deg, transparent 0 20%, #FFD04D 20% 30%, transparent 30% 45%, #FFD04D 45% 55%, transparent 55% 70%, #FFD04D 70% 80%, transparent 80% 95%, #FFD04D 95%); border-radius: 50%; opacity: 0; animation: spark .9s ease-out both; }
@keyframes spark { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: scale(.6) translateY(-12px); } }

/* A character's portrait (art.js) and a product's tile. */
.mb-face { display: inline-block; flex: none; width: var(--s, 56px); height: var(--s, 56px); vertical-align: middle; }
.mb-face svg { width: 100%; height: 100%; display: block; overflow: visible; }
.mb-face.xs { --s: 28px; } .mb-face.sm { --s: 40px; } .mb-face.md { --s: 64px; } .mb-face.lg { --s: 96px; } .mb-face.xl { --s: 132px; }
.mb-tile { --s: 44px; width: var(--s); height: var(--s); flex: none; display: inline-grid; place-items: center; border-radius: 24%; background: var(--t, #EEE); font-family: var(--emoji); font-size: calc(var(--s) * .56); line-height: 1; box-shadow: inset 0 0 0 1px rgba(42, 36, 50, .08); vertical-align: middle; }
.mb-tile.sm { --s: 34px; } .mb-tile.md { --s: 52px; } .mb-tile.lg { --s: 68px; } .mb-tile.xl { --s: 88px; }
.mb-who { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.mb-lg .mb-face.xs { --s: 22px; }

/* The board: one row per product, one dot per showing (board.js). */
/* The board's width does not depend on its parent's, so it keeps its size inside a part that shrinks to fit. */
.mb-board { display: flex; flex-direction: column; gap: 5px; width: calc(var(--mb-lw) + 53px + var(--mb-cols) * 28px); max-width: 100%; text-align: left; margin-inline: auto; }
.mb-row { display: grid; grid-template-columns: var(--mb-tmpl); column-gap: 9px; align-items: center; position: relative; min-height: 46px; }
.mb-row > * { position: relative; z-index: 1; min-width: 0; }
.mb-headrow { min-height: 26px; align-items: end; }
.mb-h { font-size: 1.2rem; text-align: right; color: var(--fg); line-height: 1.1; font-style: italic; }
.mb-est, .mb-extra { font-size: 1.22rem; text-align: right; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; line-height: 1.05; }
.mb-est .mb-frac { display: block; font-size: .8rem; color: var(--muted); line-height: 1.1; }
.mb-est .mb-decv { display: block; line-height: 1.1; }
.mb-unknown { color: var(--muted); }
.mb-prod { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-family: var(--emoji); font-size: 1.45rem; line-height: 1; background: var(--t, var(--panel)); box-shadow: inset 0 0 0 1px rgba(42, 36, 50, .1); transition: box-shadow .2s ease, transform .2s ease; }
.mb-pbadge { position: absolute; right: -14px; top: -15px; font-family: var(--emoji); font-size: 1.6rem; line-height: 1; filter: drop-shadow(0 1px 1px rgba(42, 36, 50, .3)); }
.mb-prod.pick { box-shadow: 0 0 0 3px var(--accent), 0 3px 10px rgba(88, 64, 154, .25); transform: scale(1.06); }
.mb-cells { display: grid; grid-template-columns: repeat(var(--mb-cols), minmax(0, 1fr)); align-items: center; height: 34px; }
.mb-cell { display: flex; justify-content: center; align-items: center; min-width: 0; height: 100%; }
.mb-dot { display: block; width: min(19px, 84%); aspect-ratio: 1; border-radius: 50%; flex: none; background: radial-gradient(circle at 34% 30%, var(--notap-hi) 0 22%, var(--notap) 60%); box-shadow: inset 0 0 0 1.5px var(--notap-edge); }
.mb-dot.on { background: radial-gradient(circle at 34% 30%, var(--tap-hi) 0 14%, var(--tap) 46%, var(--tap-edge) 100%); box-shadow: inset 0 0 0 1px var(--tap-edge), 0 1px 2px rgba(184, 92, 12, .35); }
.mb-dot.slot { background: transparent; box-shadow: none; border: 1.5px dashed var(--line); }
.mb-dot.fresh { animation: mbpop .55s ease-out; }
@keyframes mbpop { from { transform: scale(.2) translateY(-14px); opacity: .3; } 60% { transform: scale(1.3); opacity: 1; } to { transform: none; } }
.mb-dot.inl { display: inline-block; width: .95em; height: .95em; vertical-align: -.12em; }
.mb-tiny .mb-dot { width: 82%; }
.mb-tiny .mb-dot.off { background: var(--line); box-shadow: none; }

<script>
/* MB.sim: the seasons of Once Upon a Mirror. Owned by the main session; every section and every check uses it.
   Loads in the page (as MB.sim) and in node (require("./sim.js")).

   How a season is played (PLAN.md, "The simulation"):
   - A season has T mornings. Each morning the customer has a mood u[t], a number in [0, 1) from the season's mood
     stream, and taps the product shown if and only if u[t] < p[i]. Strategies played on the same moods face the same
     customer: the Queen's mirror taps on every morning on which any mirror could have had a tap. Each strategy alone
     still sees exactly the probabilities p (common random numbers, standard in simulation).
   - A strategy's own choices (the hat's card, the roulette, the tie breaks) come from a second stream, its own seed.
   - Initialize: estimate then exploit, epsilon-greedy and UCB first show each product once, in the order of the
     board (morning 1 the first row, morning 2 the second, and so on). Carlos, 2026-11-05: "For all the strategies,
     the first step is to initialize. You show all the ads at once."
   - Ties are broken at random, with the strategy's stream; when there is no tie, no random number is drawn.

   A season is { kind, p, T, mornings, taps } and a morning is { t, i, tap, phase, ... }: t counts from 0, i is the
   product shown (its row), tap is true or false, phase is "init", "test", "exploit", "explore", "ucb", "random" or
   "queen", and some strategies add fields (see each function). */
(function (root) {
  "use strict";

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const TOL = 1e-9; // two scores closer than this are a tie

  // The rows with the largest value (a tie gives several).
  function argmaxAll(v) {
    let mx = -Infinity;
    v.forEach((x) => { if (x > mx + TOL) mx = x; });
    const out = [];
    v.forEach((x, k) => { if (Math.abs(x - mx) <= TOL) out.push(k); });
    return out;
  }
  const pickTie = (tied, r) => (tied.length > 1 ? tied[Math.floor(r() * tied.length)] : tied[0]);

  // The moods of a season: T numbers in [0, 1).
  function moods(seed, T) {
    const r = mulberry32(seed), u = new Array(T);
    for (let t = 0; t < T; t++) u[t] = r();
    return u;
  }

  // The common loop. choose(t, book) returns { i, phase, ... } from what the mirror has seen so far:
  // book.shown[k] and book.taps[k], the showings and taps of row k before morning t.
  function play(kind, p, u, choose) {
    const K = p.length, T = u.length, book = { shown: new Array(K).fill(0), taps: new Array(K).fill(0) };
    const mornings = [];
    let taps = 0;
    for (let t = 0; t < T; t++) {
      const m = choose(t, book);
      m.t = t;
      m.tap = u[t] < p[m.i];
      book.shown[m.i] += 1;
      if (m.tap) { book.taps[m.i] += 1; taps += 1; }
      mornings.push(m);
    }
    return { kind, p: p.slice(), T, mornings, taps };
  }
  const estOf = (book) => book.shown.map((s, k) => (s ? book.taps[k] / s : 0));

  // The Queen's mirror: the product with the highest probability, every morning.
  function queen(p, u) {
    const best = p.indexOf(Math.max(...p));
    return play("queen", p, u, () => ({ i: best, phase: "queen" }));
  }

  // Random: each morning a card from the hat, every product with the same chance.
  function random(p, u, seed) {
    const r = mulberry32(seed), K = p.length;
    return play("random", p, u, () => ({ i: Math.floor(r() * K), phase: "random" }));
  }

  // Estimate then exploit with n: n rounds of round robin (round 1 is the initialization), then the highest estimate
  // every morning (a tie broken at random). The first exploit morning carries tied (the rows with the highest
  // estimate) and the season carries winner, tied and testEnd (the first exploit morning, K * n). When K * n is at
  // least T, every morning is round robin and winner is -1.
  function ete(p, u, seed, n) {
    const r = mulberry32(seed), K = p.length;
    let winner = -1, tied = [];
    const s = play("ete", p, u, (t, book) => {
      if (t < K) return { i: t, phase: "init" };
      if (t < K * n) return { i: t % K, phase: "test" };
      if (winner < 0) {
        tied = argmaxAll(estOf(book));
        winner = pickTie(tied, r);
        return { i: winner, phase: "exploit", tied: tied.slice() };
      }
      return { i: winner, phase: "exploit" };
    });
    s.n = n; s.winner = winner; s.tied = tied; s.testEnd = Math.min(K * n, u.length);
    return s;
  }

  // Epsilon-greedy with eps: initialize, then each morning spin the roulette (spin, a number in [0, 1)). If
  // spin < eps, explore: a card from the hat (every product, the best one too, with the same chance). Otherwise
  // exploit: the highest estimate, a tie broken at random. Mornings after the initialization carry spin, and the
  // exploit mornings carry tied.
  function eg(p, u, seed, eps) {
    const r = mulberry32(seed), K = p.length;
    const s = play("eg", p, u, (t, book) => {
      if (t < K) return { i: t, phase: "init" };
      const spin = r();
      if (spin < eps) return { i: Math.floor(r() * K), phase: "explore", spin };
      const tied = argmaxAll(estOf(book));
      return { i: pickTie(tied, r), phase: "exploit", spin, tied };
    });

  }

  // UCB with Carlos's exploration bonus 1 / sqrt(n), n the showings of the row: initialize, then each morning the
  // highest estimate + bonus, a tie broken at random. Mornings after the initialization carry est, bonus and score
  // (the five values before the choice) and tied.
  function ucb(p, u, seed) {
    const r = mulberry32(seed);
    return play("ucb", p, u, (t, book) => {
      if (t < p.length) return { i: t, phase: "init" };
      const est = estOf(book), bonus = book.shown.map((n) => 1 / Math.sqrt(n));
      const score = est.map((e, k) => e + bonus[k]), tied = argmaxAll(score);
      return { i: pickTie(tied, r), phase: "ucb", est, bonus, score, tied };
    });
  }

  // Estimate then exploit's average over all seasons, computed exactly (no simulation): in the test each product's
  // taps are a binomial count of n showings; the winner has the highest count, a tie broken at random. Returns
  // { rate, right }: the average rate of a season of T mornings, and the chance that the winner is the best product
  // (right is null when the test fills the season). Section 3's lesson and tools/ete_exact.js use it.
  function eteExact(p, n, T) {
    const K = p.length, test = K * n, avg = p.reduce((s, v) => s + v, 0) / K;
    if (test >= T) return { rate: avg, right: null };
    const pmf = p.map((q) => { const v = []; let c = 1; for (let k = 0; k <= n; k++) { if (k > 0) c = (c * (n - k + 1)) / k; v.push(c * q ** k * (1 - q) ** (n - k)); } return v; });
    const below = pmf.map((v) => { const c = [0]; for (let s = 0; s < v.length; s++) c.push(c[s] + v[s]); return c; });
    const win = new Array(K).fill(0);
    for (let k = 0; k < K; k++) {
      for (let s = 0; s <= n; s++) {
        let dp = [1]; // dp[m]: the chance that m other products also have s taps and none has more
        for (let j = 0; j < K; j++) {
          if (j === k) continue;
          const nd = new Array(dp.length + 1).fill(0);
          dp.forEach((v, m) => { nd[m] += v * below[j][s]; nd[m + 1] += v * pmf[j][s]; });
          dp = nd;
        }
        win[k] += pmf[k][s] * dp.reduce((acc, v, m) => acc + v / (m + 1), 0);
      }
    }
    const best = p.indexOf(Math.max(...p));
    return { rate: (test * avg + (T - test) * win.reduce((s, w, k) => s + w * p[k], 0)) / T, right: win[best] };
  }

  // Reading a season.
  // Each row's showings in order, true for a tap, over the mornings before upto (all by default).
  function rows(season, upto) {
    const K = season.p.length, out = [];
    for (let k = 0; k < K; k++) out.push([]);
    season.mornings.slice(0, upto === undefined ? season.T : upto).forEach((m) => out[m.i].push(m.tap));
    return out;
  }

  }

  function rateSoFar(season) {
    let s = 0;
    return season.mornings.map((m, t) => { s += m.tap ? 1 : 0; return s / (t + 1); });
  }

  const sim = { mulberry32, TOL, argmaxAll, moods, queen, random, ete, eg, ucb, eteExact, rows, estimates, rateSoFar, rate };

    sections.forEach((s) => {
      if (MB.CARDS[s.no]) SC.push(Object.assign({ sec: s.no, secTitle: s.title }, cardScene(s.no, s.title)));
      let num = 0;
      s.scenes.forEach((x) => {
        const n = x.python ? 0 : ++num;
        SC.push(Object.assign({ sec: s.no, secTitle: s.title, num: n }, x));
      });
    });
    stage = document.getElementById("stage");
    leaf = document.getElementById("leaf");
    scroller = document.getElementById("scroller");
    sno = document.getElementById("sno");
    stitle = document.getElementById("stitle");
    sname = document.getElementById("sname");
    pager = document.getElementById("pager");
    backBtn = document.getElementById("back");
    nextBtn = document.getElementById("next");
    stepsEl = document.getElementById("steps");
    nextBtn.addEventListener("click", MB.next);
    backBtn.addEventListener("click", MB.prev);
    document.getElementById("themebtn").addEventListener("click", flipTheme);
    document.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); MB.next(); }

    });

    render();
  };
})();

<script>
/* MB.board: Carlos's table (his sketches of 2026-11-05, ../sketch-2026-11-05-*.jpg). One row per product, one
   column per showing of that product. Left of each product box: its estimate p-hat (and, for UCB, more columns).
   Right: one dot per showing, orange for a tap, white for no tap. Product names appear only as tooltips ("you don't
   put the names anymore, only the symbol"). RULES.md, "The board", documents every option. Owned by the main session.
   Round 9: each product on its pastel tile (MB.PRODUCTS tile), the dots drawn as beads (core.css).
   Round 10: each row carries data-k (its index) for the movies of anim.js, and badges (HTML per row, a medal) sit on
   the corner of the product box. */
(function () {
  "use strict";
  const MB = window.MB;

  // The two symbols. MB.dot(true) a tap, MB.dot(false) no tap, MB.dot(null) an empty place still to fill.
  MB.dot = (tap, cls) => `<span class="mb-dot ${tap === null ? "slot" : tap ? "on" : "off"}${cls ? " " + cls : ""}"></span>`;
  // The symbols inside a sentence, and the key that explains them.
  MB.TAP = `<span class="mb-dot on inl" role="img" aria-label="a tap"></span>`;
  MB.NOTAP = `<span class="mb-dot off inl" role="img" aria-label="no tap"></span>`;
  MB.KEY = `<span class="mb-key"><span>${MB.TAP} tap</span><span>${MB.NOTAP} no tap</span></span>`;

  // The estimate of a row of showings: taps / showings; null when the product has not been shown.
  MB.estimate = (row) => (row.length ? row.filter(Boolean).length / row.length : null);
  // The estimate as text: "dec" 0.67 (default), "frac" 2/3, "both" 2/3 over 0.67; "?" when not shown yet.
  MB.estText = (row, fmt) => {
    if (!row.length) return `<span class="mb-unknown">?</span>`;
    const t = row.filter(Boolean).length, n = row.length;
    if (fmt === "frac") return `${t}/${n}`;
    if (fmt === "both") return `<span class="mb-frac">${t}/${n}</span><span class="mb-decv">${MB.dec(t / n)}</span>`;
    return MB.dec(t / n);
  };

  MB.board = function (o) {
    o = o || {};
    const items = o.items || MB.PRODUCTS, K = items.length;
    const rows = o.rows || items.map(() => []);
    const longest = Math.max(0, ...rows.map((r) => r.length));
    const C = Math.max(1, o.cols || 0, o.slots || 0, longest);
    const hl = o.highlight === undefined || o.highlight === null ? [] : [].concat(o.highlight);
    // The columns left of the product box: the estimate, then the caller's extra columns.
    const left = [];
    if (o.est !== false) {
      left.push({
        head: o.estHead || MB.phat, width: o.estWidth || (o.estFormat === "both" ? 58 : 52), cls: "mb-est",
        cells: rows.map((r, k) => (o.estValues ? (o.estValues[k] === null || o.estValues[k] === undefined
          ? `<span class="mb-unknown">?</span>` : (typeof o.estValues[k] === "number" ? MB.dec(o.estValues[k]) : o.estValues[k]))
          : MB.estText(r, o.estFormat)))
      });
    }
    (o.left || []).forEach((c) => left.push({ head: c.head || "", width: c.width || 56, cls: "mb-extra " + (c.cls || ""), cells: c.cells }));
    const lw = left.reduce((s, c) => s + c.width + 9, 0);
    const tmpl = left.map((c) => `${c.width}px`).concat(["44px", "minmax(0, 1fr)"]).join(" ");

    const style = `--mb-cols:${C};--mb-tmpl:${tmpl};--mb-lw:${lw}px${o.minCell ? `;min-width:${lw + 53 + C * o.minCell}px` : ""}`;
    let h = `<div class="mb-board${tiny}${o.dim && hl.length ? " dimmed" : ""}${o.cls ? " " + o.cls : ""}" style="${style}" role="group" aria-label="${o.aria || "The board: one row per product, one dot per showing"}">`;
    // The header row: the names of the left columns, the brackets over the dots.
    const hasHead = left.some((c) => c.head) || (o.brackets && o.brackets.length);
    if (hasHead) {
      h += `<div class="mb-row mb-headrow">${left.map((c) => `<div class="mb-h">${c.head}</div>`).join("")}<div></div><div class="mb-cells mb-brk">`;
      (o.brackets || []).forEach((b) => {
        const a = Math.max(0, b.from), z = Math.min(C - 1, b.to);
        if (z < a) return;
        h += `<div class="mb-bk${b.cls ? " " + b.cls : ""}" style="grid-column:${a + 1} / ${z + 2}"><span>${b.label}</span></div>`;
      });
      h += `</div></div>`;
    }
    items.forEach((it, k) => {
      const r = rows[k] || [], isHl = hl.includes(k);
      const fresh = o.fresh && o.pick === k ? (o.fresh === true ? r.length - 1 : o.fresh.col) : (o.fresh && o.fresh.row === k ? o.fresh.col : -1);
      let cells = "";
      for (let j = 0; j < C; j++) {
        if (j < r.length) cells += `<span class="mb-cell">${MB.dot(r[j], j === fresh ? "fresh" : "")}</span>`;
        else if (o.slots && j < o.slots) cells += `<span class="mb-cell">${MB.dot(null)}</span>`;
        else cells += `<span class="mb-cell"></span>`;
      }
      const rowCls = `mb-row${isHl ? " hl" : ""}${o.dim && hl.length && !isHl ? " dim" : ""}${o.pick === k ? " picked" : ""}`;
      h += `<div class="${rowCls}" data-k="${k}">${left.map((c) => `<div class="${c.cls}">${c.cells[k] === undefined ? "" : c.cells[k]}</div>`).join("")}`;
      h += `<div class="mb-prod${o.pick === k ? " pick" : ""}" style="--t:${it.tile || "var(--panel)"}" title="${it.name}" role="img" aria-label="${it.name}">${it.emo}${o.badges && o.badges[k] ? `<span class="mb-pbadge" aria-hidden="true">${o.badges[k]}</span>` : ""}</div>`;
      h += `<div class="mb-cells">${cells}</div></div>`;
    });
    if (o.caption) h += `<div class="mb-caption">${o.caption}</div>`;
    h += `</div>`;
    return o.scroll ? `<div class="mb-scroll">${h}</div>` : h;

<script>
/* MB.rateChart and MB.lineChart: the charts of Once Upon a Mirror. Owned by the main session.
   The rate chart is the only chart of the comparisons (Carlos: "only show the plot on the rate"): the rate so far
   after each morning, one line per strategy, colours, names and icons from MB.STRAT, a legend in HTML below the
   drawing so it stays readable on a phone. RULES.md, "The charts", documents the options.
   Round 9: the strategy's icon at the end of its line, the legend as chips, and the lines drawn from left to right
   when a chart first appears (the class reveal, set below; none with reduced motion). */
(function () {
  "use strict";
  const MB = window.MB;

  // A generic line chart. o: { x0, x1, y0, y1, xTicks, yTicks, xLabel, yLabel, lines: [{ pts: [[x, y], ...],
  // color: "--token", width, dash, opacity, dot, icon }], marks: [{ x, label }], aria, height }. A line with an icon
  // ends in a dot and the icon on its right. Returns an SVG string.
  MB.lineChart = function (o) {
    const ends = (o.lines || []).some((ln) => ln.icon);
    const W = 640, H = o.height || 300, L = 46, R = ends ? 42 : 18, T = 26, B = 40;
    const x = (v) => L + ((v - o.x0) / (o.x1 - o.x0)) * (W - L - R);
    const y = (v) => H - B - ((v - o.y0) / (o.y1 - o.y0)) * (H - T - B);
    const txt = (a, b, s, anchor, cls) => `<text x="${a.toFixed(1)}" y="${b.toFixed(1)}" text-anchor="${anchor || "start"}" class="${cls || "mb-ax"}">${s}</text>`;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria || "chart"}">`;
    (o.yTicks || []).forEach((v) => {
      s += `<line x1="${x(o.x0)}" x2="${x(o.x1)}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="${v === o.y0 ? "mb-base" : "mb-grid"}"/>`;
      s += txt(L - 9, y(v) + 5, MB.dec(v), "end");
    });
    (o.xTicks || []).forEach((v) => { s += txt(x(v), H - B + 23, v, "middle"); });
    if (o.xLabel) s += txt(W - R, H - 3, o.xLabel, "end", "mb-axl");
    if (o.yLabel) s += txt(4, 15, o.yLabel, "start", "mb-axl");
    (o.marks || []).forEach((m) => {
      s += `<line x1="${x(m.x).toFixed(1)}" x2="${x(m.x).toFixed(1)}" y1="${y(o.y1)}" y2="${y(o.y0)}" class="mb-mark"/>`;
      if (m.label) s += txt(x(m.x) + 6, T - 9, m.label, "start", "mb-axl");
    });
    s += `<g class="mb-lines">`;
    const tags = [];
    (o.lines || []).forEach((ln) => {
      if (!ln.pts.length) return;
      const d = ln.pts.map((p, j) => `${j ? "L" : "M"}${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`).join(" ");
      if (ln.pts.length > 1) s += `<path d="${d}" style="fill:none;stroke:var(${ln.color});stroke-width:${ln.width || 3};opacity:${ln.opacity || 1};stroke-linejoin:round;stroke-linecap:round${ln.dash ? ";stroke-dasharray:7 7" : ""}"/>`;
      const p = ln.pts[ln.pts.length - 1];
      if (ln.dot || ln.icon) s += `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${ln.icon ? 5.5 : 4.5}" style="fill:var(${ln.color});stroke:var(--leaf);stroke-width:2"/>`;
      if (ln.icon) tags.push({ x: x(p[0]), y: y(p[1]), icon: ln.icon });
    });
    s += `</g>`;
    // The icons at the line ends, pushed apart so they never overlap, kept inside the plot.
    if (tags.length) {
      tags.sort((a, b) => a.y - b.y);
      const gap = 21, top = T + 4, bot = H - B;
      tags.forEach((t, j) => { t.ty = Math.max(t.y, j ? tags[j - 1].ty + gap : top); });
      for (let j = tags.length - 1; j >= 0; j--) {
        const lim = j === tags.length - 1 ? bot : tags[j + 1].ty - gap;
        if (tags[j].ty > lim) tags[j].ty = lim;
      }
      s += `<g class="mb-ends">${tags.map((t) => `<text x="${(t.x + 11).toFixed(1)}" y="${(t.ty + 7).toFixed(1)}" class="mb-icon">${t.icon}</text>`).join("")}</g>`;
    }
    return s + `</svg>`;
  };

  // The rate chart. o: { series: [{ key, v, name }], T, upto, values, marks, aria }. key picks the colour, the name
  // and the icon in MB.STRAT (name overrides it); v is the rate so far after each morning (MB.sim.rateSoFar). upto
  // draws only the first upto mornings (for a season that is being played). values: true adds each line's last rate
  // to the legend.
  MB.rateChart = function (o) {
    const X = o.T || MB.SEASON, upto = Math.min(o.upto === undefined ? X : o.upto, X);
    const lines = o.series.map((s) => {
      const st = MB.STRAT[s.key] || { color: "--fg" };
      const pts = [];
      for (let t = 0; t < Math.min(upto, s.v.length); t++) pts.push([t + 1, s.v[t]]);
      return { pts, color: st.color, dash: st.dash, width: s.key === "queen" ? 3.6 : 3, icon: upto > 0 ? st.icon : null, opacity: s.opacity };
    });
    const ticks = X === 100 ? [1, 25, 50, 75, 100] : [1, Math.round(X / 2), X];
    const svg = MB.lineChart({ x0: 1, x1: X, y0: 0, y1: 1, xTicks: ticks, yTicks: [0, 0.2, 0.4, 0.6, 0.8, 1],
      xLabel: "morning", yLabel: "rate so far", lines, marks: o.marks, aria: o.aria || "The rate so far, morning by morning" });
    const legend = o.series.map((s) => {
      const st = MB.STRAT[s.key] || { color: "--fg", name: s.key };
      const last = upto > 0 && s.v.length ? s.v[Math.min(upto, s.v.length) - 1] : null;
      return `<span class="mb-lg"><span class="sw${st.dash ? " dash" : ""}" style="--sw:var(${st.color})"></span>${st.icon ? `<span class="ic" aria-hidden="true">${st.icon}</span>` : ""}${s.name || st.name}${o.values && last !== null ? `<b>${MB.dec(last)}</b>` : ""}</span>`;
    }).join("");

  };

  MB.afterRender((stage) => {
    if (MB.still || !MB.isFresh()) return;
    stage.querySelectorAll(".mb-chart").forEach((c) => { if (c.closest(".new")) c.classList.add("reveal"); });
  });
})();
</script>
<script>
/* MB.wheel: the roulette of epsilon-greedy, from round 5 of the sketch (Carlos, 2026-11-05: "You show the roulette.
   I like it very much."). The hat's slice, eps of the wheel, runs clockwise from the top and stands for a card from
   the hat (a product at random, as in section 2); the large slice stands for the highest estimate. The needle points
   at spin, a number in [0, 1): spin < eps lands on the hat's slice. Owned by the main session; section 4 uses it.
   Round 9: a gold rim with studs, the two slices in fixed colours, a pointed needle on a gold hub. */
(function () {
  "use strict";
  const MB = window.MB;

  // eps: the hat's share; spin: the needle (null: no needle); opts: { small, card, spin (animate the needle), label }.
  MB.wheel = function (eps, spin, opts) {
    const o = opts || {}, c = 60, R = 47;
    const at = (f, r) => [c + r * Math.sin(2 * Math.PI * f), c - r * Math.cos(2 * Math.PI * f)];
    const [x1, y1] = at(eps, R), [hx, hy] = at(eps / 2, R * 0.64), [gx, gy] = at(eps + (1 - eps) / 2, R * 0.5);
    const aria = o.label || (spin === null || spin === undefined ? "the roulette"
      : spin < eps ? "the needle on the hat's slice" : "the needle on the large slice");
    let s = `<svg class="mb-wheel${o.small ? " sm" : ""}${o.card ? " oncard" : ""}" viewBox="0 0 120 120" role="img" aria-label="${aria}">`;
    s += `<circle cx="${c}" cy="${c + 2.5}" r="57" fill="#2A2432" opacity=".12"/>`;
    s += `<circle cx="${c}" cy="${c}" r="57" fill="url(#mb-gold)" stroke="#8F5A06" stroke-width="2"/>`;
    for (let k = 0; k < 16; k++) {
      const [sx, sy] = at(k / 16, 52.5);
      s += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="1.7" fill="#FFF3C2"/>`;
    }
    s += `<circle cx="${c}" cy="${c}" r="${R}" fill="#E4D7F2" stroke="#8F5A06" stroke-width="1.6"/>`;
    if (eps > 0) {
      s += `<path d="M${c} ${c} L${c} ${c - R} A${R} ${R} 0 ${eps > 0.5 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="#FFD45C" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>`;
      s += `<text x="${hx.toFixed(1)}" y="${(hy + 6).toFixed(1)}" text-anchor="middle" style="font-size:${eps < 0.15 ? 13 : 18}px;font-family:var(--emoji)">🎩</text>`;
    }
    s += `<text x="${gx.toFixed(1)}" y="${(gy + 9).toFixed(1)}" text-anchor="middle" style="font-size:25px;font-family:var(--emoji)">🥇</text>`;
    if (spin !== null && spin !== undefined) {
      const deg = (spin * 360).toFixed(1);
      s += `<g class="mb-needle${o.spin ? " spin" : ""}" data-a="${deg}" style="transform:rotate(${deg}deg)"><path d="M${c - 4.6} ${c + 3} L${c} ${c - R + 5} L${c + 4.6} ${c + 3} Z" fill="#2A2432" stroke="#2A2432" stroke-width="1.5" stroke-linejoin="round"/></g>`;
    }
    s += `<circle cx="${c}" cy="${c}" r="7.5" fill="url(#mb-gold)" stroke="#8F5A06" stroke-width="1.6"/><circle cx="${c - 2}" cy="${c - 2}" r="2.2" fill="#FFF3C2"/>`;
    return s + `</svg>`;
  };

  // After every render, needles drawn with spin: true turn twice and land on their place.
  MB.afterRender((stage) => {
    if (MB.still) return;
    stage.querySelectorAll(".mb-needle.spin").forEach((g) => {
      if (g.animate) g.animate([{ transform: "rotate(0deg)" }, { transform: `rotate(${parseFloat(g.dataset.a) + 720}deg)` }],
        { duration: 1200, easing: "cubic-bezier(.12,.75,.2,1)" });
    });
  });
})();

<script>
/* Once Upon a Mirror, the movies: the animated explanation of each strategy (round 10, 2026-11-06). Carlos: "for each
   strategy I want you to come up with an animated way of explaining the strategy. I don't like that you put so much
   text in the explanation." Every movie plays the race season, morning by morning, with one choreography: the
   strategy chooses (a card from the hat, the next row in turn, the roulette, the longest bar), the product flies to
   Cinderella's mirror, she taps or not, and a bead flies from the mirror to the product's row. A step of the scene is
   a chapter of the movie; it plays by itself when it opens, with Pause, Play and Again. Owned by the main session.

   MB.movie(spec) returns a movie; spec: { key, frames(step), cls(step) }. A frame is { ms, p, fx, done }: p sets
   parts of the movie (parts, dev, mid, cin, board, line, after: HTML), and a part keeps its HTML until a later frame
   sets it again, so a frame names only what changes. A part is replaced only when its HTML changes, so the other
   parts keep their animations, and the width of an element marked data-mk glides from its old value. fx(A) starts
   the short effects of a frame (A.fly, A.pop, A.shake, A.wiggle, A.hearts, A.spin); done() runs after it. With
   reduced motion a chapter shows its last frame and the effects are skipped. MB.movies[key].seek(k) shows frame k
   (the shots of check.py use it). */
(function () {
  "use strict";
  const MB = window.MB;
  const PARTS = ["parts", "dev", "mid", "cin", "board", "line", "after"];
  MB.movies = {};

  // A box inside the movie, relative to the movie's own box.

    return { x: r.left - c.left, y: r.top - c.top, w: r.width, h: r.height };

  function effects(root) {
    const layer = root.querySelector(".mv-fx");
    const q = (s) => (typeof s === "string" ? root.querySelector(s) : s);
    const first = (s) => [].concat(s).map(q).find(Boolean) || null;
    const add = (html, cls) => {
      const n = document.createElement("div");
      n.className = `mv-fly${cls ? " " + cls : ""}`;
      n.innerHTML = html;
      layer.appendChild(n);
      return n;
    };
    const ease = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
    return {
      q,
      // html leaves the centre of `from` and lands on the centre of `to` along an arc. o: { ms, delay, arc, s0, s1, s2,
      // cls }; from and to are selectors inside the movie (or lists of them: the first one found).
      fly(from, to, html, o) {

        const x0 = A0.x + A0.w / 2 - w / 2, y0 = A0.y + A0.h / 2 - h / 2, x1 = B0.x + B0.w / 2 - w / 2, y1 = B0.y + B0.h / 2 - h / 2;
        const lift = o.arc === undefined ? Math.min(110, 26 + Math.hypot(x1 - x0, y1 - y0) * 0.2) : o.arc;
        const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - lift;
        const s0 = o.s0 === undefined ? 1 : o.s0, s1 = o.s1 === undefined ? 1.2 : o.s1, s2 = o.s2 === undefined ? 0.9 : o.s2;

          const u = ease(j / 12), v = 1 - u;
          const x = v * v * x0 + 2 * v * u * cx + u * u * x1, y = v * v * y0 + 2 * v * u * cy + u * u * y1;
          const s = u < 0.5 ? s0 + (s1 - s0) * (u / 0.5) : s1 + (s2 - s1) * ((u - 0.5) / 0.5);
          K.push({ transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${s.toFixed(3)})`, offset: j / 12 });
        }
        const an = n.animate(K, { duration: o.ms || 700, delay: o.delay || 0, easing: "linear", fill: "both" });
        an.onfinish = () => n.remove();

        if (can() && e) e.animate([{ transform: "scale(1)" }, { transform: `scale(${k || 1.22})` }, { transform: "scale(1)" }], { duration: 480, easing: "ease-out" });
      },
      // No tap: the head shakes.
      shake(sel) {
        const e = q(sel);
        if (can() && e) e.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-10deg)" }, { transform: "rotate(8deg)" }, { transform: "rotate(-5deg)" }, { transform: "rotate(0deg)" }], { duration: 640, easing: "ease-in-out" });
      },
      // The hat before a draw: it rocks and its cards shuffle.
      wiggle(sel) {
        const e = q(sel);
        if (can() && e) e.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-9deg) translateY(-3px)" }, { transform: "rotate(8deg)" }, { transform: "rotate(-5deg) translateY(-2px)" }, { transform: "rotate(0deg)" }], { duration: 620, easing: "ease-in-out" });
      },
      // A tap: hearts rise from Cinderella.
      hearts(sel) {
        const e = q(sel);
        if (!can() || !e || !layer) return;
        const B = box(root, e);
        [[-0.3, 0, "💖"], [0.06, 0.12, "💗"], [0.34, 0.05, "💖"], [-0.04, 0.24, "💕"]].forEach((h) => {
          const n = add(h[2], "mv-heart"), x = B.x + B.w / 2 + h[0] * B.w - 10, y = B.y + B.h * 0.2;
          const an = n.animate([
            { transform: `translate(${x}px, ${y}px) scale(.4)`, opacity: 0 },
            { transform: `translate(${x}px, ${y - 16}px) scale(1.1)`, opacity: 1, offset: 0.3 },
            { transform: `translate(${x + h[0] * 22}px, ${y - 60}px) scale(.8)`, opacity: 0 }
          ], { duration: 1100, delay: h[1] * 1000, easing: "ease-out", fill: "both" });
          an.onfinish = () => n.remove();
          an.oncancel = () => n.remove();
        });
      },
      // The needle of a roulette (wheel.js draws it at its place): two turns, then it stops there.
      spin(sel, ms) {
        const g = q(sel);
        if (can() && g) g.animate([{ transform: "rotate(0deg)" }, { transform: `rotate(${parseFloat(g.dataset.a) + 720}deg)` }], { duration: ms || 1200, easing: "cubic-bezier(.12,.75,.2,1)" });
      }
    };
  }

  MB.movie = function (spec) {
    const M = { key: spec.key, step: -1, k: 0, playing: false, timer: null, cache: {}, el: null, shown: {} };
    MB.movies[spec.key] = M;
    // The frames of a chapter, each with the whole state of its parts (a part is carried until a frame changes it).
    const framesOf = (step) => {
      if (!M.cache[step]) {
        const acc = {};
        M.cache[step] = spec.frames(step).map((f) => {
          Object.assign(acc, f.p || {});
          return { ms: f.ms || 600, s: Object.assign({}, acc), fx: f.fx, done: f.done };
        });
      }
      return M.cache[step];
    };
    const stop = () => { if (M.timer !== null) clearTimeout(M.timer); M.timer = null; };
    function ctl() {
      const root = M.el;
      if (!root) return;
      const F = framesOf(M.step), end = M.k >= F.length - 1, bar = root.querySelector(".mv-ctl");
      if (bar) bar.hidden = MB.still || F.length < 2;
      const tg = root.querySelector('[data-a="toggle"]');
      if (!tg) return;
      tg.hidden = end && !M.playing;
      const lab = M.playing ? "Pause" : "Play";
      if (tg.textContent !== lab) tg.textContent = lab;
      tg.className = `${M.playing ? "quiet" : "act"} mv-btn`;
    }
    function paint(k, live) {
      const root = M.el;
      if (!root || !root.isConnected) return;
      const f = framesOf(M.step)[k], glide = live && can();
      PARTS.forEach((name) => {
        const html = f.s[name] === undefined ? "" : f.s[name];
        if (M.shown[name] === html) return;
        const node = root.querySelector(`[data-p="${name}"]`);
        if (!node) return;
        const old = {};
        if (glide) node.querySelectorAll("[data-mk]").forEach((e) => { old[e.dataset.mk] = e.getBoundingClientRect().width; });
        node.innerHTML = html;
        M.shown[name] = html;
        if (glide) node.querySelectorAll("[data-mk]").forEach((e) => {
          const w0 = old[e.dataset.mk];
          if (w0 === undefined) return;
          const w1 = e.getBoundingClientRect().width;
          if (Math.abs(w1 - w0) > 0.5) e.animate([{ width: `${w0}px` }, { width: `${w1}px` }], { duration: 650, easing: "cubic-bezier(.3,.7,.3,1)" });
        });
      });
      if (live && f.fx) { try { f.fx(effects(root)); } catch (e) { if (window.console) console.error(e); } }
      if (live && f.done) f.done();
      ctl();
    }
    function tick() {
      M.timer = null;
      const F = framesOf(M.step);
      if (!M.playing || M.k >= F.length - 1) { M.playing = false; ctl(); return; }
      M.k += 1;
      if (M.k >= F.length - 1) M.playing = false;
      paint(M.k, true);
      if (M.playing) M.timer = MB.later(tick, F[M.k].ms);
    }
    function play() {
      const F = framesOf(M.step);
      if (M.k >= F.length - 1) { again(); return; }
      stop();
      M.playing = true;
      ctl();
      M.timer = MB.later(tick, 200);
    }
    function pause() { stop(); M.playing = false; ctl(); }
    function again() {
      stop();
      const F = framesOf(M.step);
      M.k = 0;
      M.playing = F.length > 1 && !MB.still;
      paint(0, true);
      if (M.playing) M.timer = MB.later(tick, F[0].ms);
    }
    M.render = (el, step) => {
      const fresh = MB.isFresh() || M.step !== step;
      stop();
      if (fresh) {
        M.step = step;
        const F = framesOf(step);
        M.k = MB.still ? F.length - 1 : 0;
        M.playing = !MB.still && F.length > 1;
      }
      el.innerHTML = `<div class="mv mv-${spec.key}${spec.cls ? " " + spec.cls(step) : ""}" aria-live="off">
        <div class="mv-parts" data-p="parts"></div>
        <div class="mv-scene"><div class="mv-dev" data-p="dev"></div><div class="mv-mid" data-p="mid"></div><div class="mv-cin" data-p="cin"></div></div>
        <div class="mv-board" data-p="board"></div>
        <p class="say mv-line" data-p="line"></p>
        <div class="row mv-ctl"><button type="button" class="quiet mv-btn" data-a="toggle">Pause</button><button type="button" class="quiet mv-btn" data-a="again">Again</button></div>
        <div class="mv-after" data-p="after"></div>
        <div class="mv-fx" aria-hidden="true"></div></div>`;
      M.el = el.querySelector(".mv");
      M.shown = {};
      M.el.querySelector(".mv-ctl").addEventListener("click", (e) => {
        const b = e.target.closest("[data-a]");
        if (!b) return;
        if (b.dataset.a === "again") again();
        else if (M.playing) pause();
        else play();
      });
      paint(M.k, fresh && M.playing);
      if (M.playing) M.timer = MB.later(tick, framesOf(step)[M.k].ms);
    };
    M.seek = (k) => {
      stop();
      M.playing = false;
      const F = framesOf(M.step);
      M.k = Math.max(0, Math.min(F.length - 1, k));
      M.shown = {};
      paint(M.k, false);
    };
    M.count = () => framesOf(M.step).length;
    M.fx = () => (M.el ? effects(M.el) : null); // the effects on their own, for the checks
    return M;
  };

  // The pieces every movie shares.
  // The steps of the strategy in one line, the current one lit (on: its index, -1 none).
  MB.mvChips = (names, on) => `<ol class="steps mv-steps" aria-label="The steps">${names.map((nm, j) => `<li${j === on ? ` class="on" aria-current="step"` : ""}>${nm}</li>`).join("")}</ol>`;
  // Cinderella and her mirror: the product i (null: an empty glass), tap (true, false or null before she decides),
  // show (the product pops in).
  MB.mvCin = (i, tap, show) => {
    const p = i === null || i === undefined ? null : MB.PRODUCTS[i];
    const badge = p && tap !== null && tap !== undefined ? MB.badge(tap) : "";
    return `<span class="mv-face">${MB.face("cin", "md")}</span>${MB.mirror(p, badge, { size: "md", cap: false, show: !!show,
      label: p ? `Cinderella's mirror shows the ${p.name.toLowerCase()}` : "Cinderella's mirror" })}`;
  };
  // The hat: a card for each product fanned above a top hat; lift: the card drawn (-1: none).
  MB.mvHat = (lift, small) => `<div class="mv-hat${small ? " sm" : ""}" role="img" aria-label="${lift >= 0 ? `a card from the hat: the ${MB.PRODUCTS[lift].name.toLowerCase()}` : "a top hat with a card for each product"}"><div class="mv-cards">${MB.PRODUCTS.map((p, j) =>
    `<span class="mv-card${j === lift ? " up" : ""}" data-i="${j}" style="--r:${(j - 2) * 11}deg;--y:${Math.abs(j - 2) * 6}px">${MB.tile(p, small ? "sm" : "md")}</span>`).join("")}</div><span class="mv-hatic" aria-hidden="true">🎩</span></div>`;
  // The time of the j-th fast morning: from start, a little shorter each morning, never below floor.
  MB.mvPace = (j, start, floor, k) => Math.max(floor, Math.round(start * Math.pow(k || 0.9, j)));

  // The frames of morning t (counted from 0) of a movie's season. c, the movie's context: { M (the mornings), rowsAt
  // (the board's rows after upto mornings), cols, board(upto, o) (o: pick, hop, lit, fresh, upd), dev(t, ph) (ph:
  // "choose", "chosen" or "fast"), chips(t, beat) (beat: "choose", "show", "dot" or "fast"), src(t) (where the product
  // leaves from), and optional chooseOpt(t), chooseFx(A, t, mode), chooseMs(t, mode), tie(t) (the rows tied before a
  // draw at random), mid(t) }. mode: "slow" (every beat), "mid" (shorter beats), "quick" (no bead) or "fast" (one beat).
  MB.mvMorning = function (c, t, mode, fastMs) {
    const m = c.M[t], i = m.i, n = c.rowsAt(t)[i].length;
    const cell = [`.mb-row[data-k="${i}"] .mb-cell:nth-child(${n + 1})`, `.mb-row[data-k="${i}"] .mb-cells`];
    const mid = c.mid ? c.mid(t) : `Morning ${t + 1}`;
    const tile = MB.tile(MB.PRODUCTS[i], "md");
    const land = (ms) => ({ ms, p: { board: c.board(t + 1, { pick: i, fresh: { row: i, col: n }, upd: true }) } });
    if (mode === "fast") {
      return [{ ms: fastMs || 120, p: { mid, parts: c.chips(t, "fast"), dev: c.dev(t, "fast"), cin: MB.mvCin(i, m.tap, false),
        board: c.board(t + 1, { pick: i, fresh: { row: i, col: n } }) } }];
    }
    if (mode === "quick") {
      return [
        { ms: 520, p: { mid, parts: c.chips(t, "choose"), dev: c.dev(t, "chosen"), cin: MB.mvCin(null), board: c.board(t, { pick: i }) },
          fx: (A) => A.fly(c.src(t), ".mv-cin .glass", tile, { ms: 480, s2: 0.75 }) },
        { ms: 520, p: { parts: c.chips(t, "show"), cin: MB.mvCin(i, m.tap, true) }, fx: (A) => { if (m.tap) A.hearts(".mv-cin .mv-face"); } },
        land(fastMs || 420)
      ];
    }
    const slow = mode === "slow", F = [];
    F.push({ ms: c.chooseMs ? c.chooseMs(t, mode) : (slow ? 900 : 380),
      p: { mid, parts: c.chips(t, "choose"), dev: c.dev(t, "choose"), cin: MB.mvCin(null), board: c.board(t, c.chooseOpt ? c.chooseOpt(t) : {}) },
      fx: c.chooseFx ? (A) => c.chooseFx(A, t, mode) : null });
    const tie = c.tie ? c.tie(t) : null;
    if (tie && tie.length > 1) tie.concat(tie, [i]).forEach((k) => F.push({ ms: 200, p: { board: c.board(t, { hop: k, lit: tie }) } }));
    F.push({ ms: slow ? 850 : 560, p: { dev: c.dev(t, "chosen"), board: c.board(t, { pick: i, lit: tie && tie.length > 1 ? [i] : (c.chooseOpt ? c.chooseOpt(t).lit : null) }) },
      fx: (A) => A.fly(c.src(t), ".mv-cin .glass", tile, { ms: slow ? 780 : 520, s2: 0.75 }) });
    if (slow) {
      F.push({ ms: 600, p: { parts: c.chips(t, "show"), cin: MB.mvCin(i, null, true) } });
      F.push({ ms: 900, p: { cin: MB.mvCin(i, m.tap, false) }, fx: (A) => (m.tap ? A.hearts(".mv-cin .mv-face") : A.shake(".mv-cin .mv-face")) });
    } else {
      F.push({ ms: 650, p: { parts: c.chips(t, "show"), cin: MB.mvCin(i, m.tap, true) }, fx: (A) => { if (m.tap) A.hearts(".mv-cin .mv-face"); } });
    }
    F.push({ ms: slow ? 650 : 420, p: { parts: c.chips(t, "dot") },
      fx: (A) => A.fly(".mv-cin .mb-badge", cell, MB.dot(m.tap), { ms: slow ? 600 : 380, s0: 0.8, s1: 1.5, s2: 1 }) });
    F.push(land(slow ? 1000 : 520));
    return F;
  };
})();
</script>
<script>
/* Section 1, the Enchanted Forest: the characters, the urn, the estimate, the Queen's mirror, the four strategies.
   The main session's, rebuilt on 2026-11-05 from round 5 of the sketch: two customers, no law of large numbers,
   the board instead of the ledgers (REQUEST.md). Round 9 (2026-11-06): the cover, the portraits, the mirrors and the
   tiles of art.js; the words above or below every picture. */
(function () {
  "use strict";
  const MB = window.MB, P = MB.P, PR = MB.PRODUCTS, CUST = MB.CUSTOMERS;
  const BEST = P.indexOf(Math.max(...P));
  const URN_W = 2, URN_N = 5; // the urn of Cinderella and the mattress: 2 orange balls of 5
  const PLAY_N = 15;
  const EXCUSES = ["She lost a slipper.", "She was busy with the stepsisters.", "The pumpkin needed watering.",
    "She was feeding the mice.", "She was scrubbing the stairs.", "Not today, thank you."];
  const TAPS = ["She taps!", "She taps the glass.", "Tap! She wants it."];

  const S = { guesses: {}, draws: [], last: null, play: { seq: [], last: null }, queen: null, queenRuns: 0 };
  const rand = MB.rand;

  const BALL_POS = [[43, 70], [64, 86], [36, 86], [57, 70], [50, 96]];
  function urnSVG(orange, o) {
    o = o || {};
    let s = `<svg class="s1-urn${o.shake ? " shake" : ""}${o.small ? " sm" : ""}" viewBox="0 0 100 124" role="img" aria-label="${o.label || "urn"}">`;
    s += `<rect x="38" y="106" width="24" height="12" rx="2" style="fill:var(--urn-dark)"/>`;
    s += `<path d="M36 13 L64 13 L66 24 C86 32 92 52 90 72 C88 94 72 110 50 110 C28 110 12 94 10 72 C8 52 14 32 34 24 Z" style="fill:var(--urn);stroke:var(--urn-dark);stroke-width:2"/>`;
    s += `<rect x="30" y="4" width="40" height="10" rx="3" style="fill:var(--urn-dark)"/>`;
    s += `<path d="M15 46 C38 54 62 54 85 46" style="fill:none;stroke:var(--urn-band);stroke-width:4"/>`;
    if (o.open) {
      s += `<ellipse cx="50" cy="82" rx="31" ry="23" style="fill:var(--urn-window);stroke:var(--urn-dark);stroke-width:1.5"/>`;
      for (let i = 0; i < URN_N; i++) {
        const g = i < orange;
        s += `<circle cx="${BALL_POS[i][0]}" cy="${BALL_POS[i][1]}" r="8" style="fill:${g ? "var(--tap)" : "var(--notap)"};stroke:${g ? "var(--tap-edge)" : "var(--notap-edge)"};stroke-width:1.5"/>`;
      }
    } else {
      s += `<text x="50" y="92" text-anchor="middle" style="fill:var(--urn-window);font:700 34px var(--ui)">?</text>`;
    }
    return s + `</svg>`;
  }
  const probCards = (c) => `<div class="s1-probs">${PR.map((q, i) => {
    const best = c.p[i] === Math.max(...c.p);
    return `<div class="s1-pc${best ? " best" : ""}">${best ? `<span class="s1-crown" aria-hidden="true">👑</span>` : ""}${MB.tile(q, "sm")}<div class="small">${q.short}</div><div class="formula small">${MB.pp} = ${MB.dec(c.p[i])}</div></div>`;
  }).join("")}</div>`;
  // The Queen's season: the race season's moods, so its line is the same in every chart of the game.
  function queenSeason(fresh) {
    const seed = fresh ? MB.newSeed() : MB.raceSeed("moods");
    return MB.sim.queen(P, MB.sim.moods(seed, MB.SEASON));
  }

  const scenes = [
    {
      key: "once", title: "Once upon a time", steps: 2, cover: true,
      render(el, step) {
        el.innerHTML = `
          <div class="s1-cover${MB.cls(step, 0)}"><p class="s1-kicker">Once Upon a Mirror</p>
            <h1 class="display s1-title">Once upon a time</h1>
            <p class="lead">every home in the Enchanted Forest got a magic mirror.</p>
            ${MB.cover()}</div>
          ${step >= 1 ? `<div class="stack${MB.cls(step, 1)}">${MB.mirror(PR[3], "", { size: "sm", show: MB.isFresh() })}<p class="say">Each morning, the mirror shows its owner one ad.</p></div>` : ""}`;
      }
    },
    {
      key: "shop", title: "The Mirror Shop", steps: 1, center: true,
      render(el, step) {
        el.innerHTML = `
          <p class="say">Five products. Each morning, the mirror can show one of them.</p>
          <div class="grid s1-shop${MB.cls(step, 0)}">${PR.map((p, j) => `
            <div class="card" style="--j:${j}">${MB.tile(p, "xl")}<div class="name">${p.name}</div><div class="slogan">${p.slogan}</div></div>`).join("")}
          </div>`;
      }
    },
    {
      key: "residents", title: "The residents", steps: 1, center: true,
      render(el, step) {
        el.innerHTML = `
          <p class="say">Two homes, two mirrors.</p>
          <div class="grid s1-two${MB.cls(step, 0)}">${CUST.map((r) => `
            <div class="card"><div class="s1-pair">${MB.face(r.id, "xl")}${MB.mirror(null, "", { size: "xs", label: `${r.name}'s mirror` })}</div><div class="name">${r.name}</div><ul>${r.bio.map((b) => `<li>${b}</li>`).join("")}</ul></div>`).join("")}
          </div>`;
      }
    },
    {
      key: "morning", title: "One morning", steps: 4,
      render(el, step) {
        const lines = [
          "Cinderella looks into her mirror.",
          "The mirror shows her one ad: the memory-foam mattress.",
          "She taps the glass. A tap is a click, and advertisers count clicks."
        ];
        let h = `<div class="row s1-scene">${MB.face("cin", "xl")}
          ${MB.mirror(step >= 1 ? PR[3] : null, step >= 2 ? `<span class="mb-badge${MB.cls(step, 2)}">Tap!</span>` : "", { size: "lg", show: step === 1 && MB.isFresh(), spark: step === 2 && MB.isFresh() })}</div>`;
        for (let k = 0; k <= Math.min(step, 2); k++) h += `<p class="say${MB.cls(step, k)}">${lines[k]}</p>`;
        if (step >= 3) {
          h += `<div class="box${MB.cls(step, 3)}"><strong>The game</strong><ul class="rules">
            <li>A season: 100 mornings.</li><li>Each morning, one ad for each resident.</li><li>As many taps as possible.</li></ul></div>`;
        }
        el.innerHTML = h;
      }
    },
    {
      key: "guess", title: "The mirror knows nobody", steps: 2,
      render(el, step) {
        let h = `<div class="${MB.cls(step, 0)}">${MB.mirror({ emo: "❓", name: "a question mark" }, "", { size: "xs", cap: false, label: "a magic mirror with a question mark" })}</div>
          <p class="say${MB.cls(step, 0)}">The mirror has never read a fairy tale. It knows nothing about anyone in the forest.</p>`;
        if (step >= 1) {
          h += `<p class="say${MB.cls(step, 1)}">You have read them. Which product will each resident tap most often? Tap your guess.</p>
            <div class="s1-guesses${MB.cls(step, 1)}">${CUST.map((r) => `
              <div class="s1-gcard"><div class="s1-who">${MB.who(r, "md")}</div><div class="s1-picks">${PR.map((p) => `
                <button type="button" class="s1-pick" style="--t:${p.tile}" data-r="${r.id}" data-p="${p.id}" aria-pressed="${S.guesses[r.id] === p.id}" title="${p.name}" aria-label="${r.name}: ${p.name}">${p.emo}</button>`).join("")}
              </div></div>`).join("")}
            </div>
            <p class="muted small">The Queen's mirror will tell you who was right.</p>`;
        }
        el.innerHTML = h;
        el.querySelectorAll(".s1-pick").forEach((b) => b.addEventListener("click", () => { S.guesses[b.dataset.r] = b.dataset.p; MB.redraw(); }));
      }
    },
    {
      key: "urn", title: "Showing an ad is drawing a ball", steps: 2,
      render(el, step) {
        const n = S.draws.length, g = S.draws.filter(Boolean).length;
        let h = `<p class="say${MB.cls(step, 0)}">Even a favourite is not tapped every morning. Some mornings Cinderella is busy with the stepsisters.</p>
          <p class="say${MB.cls(step, 0)}">Picture an urn for Cinderella and the mattress, with five balls. Orange means a tap. White means no tap.</p>
          <div class="stack${MB.cls(step, 0)}">
            <div class="s1-urnrow">${MB.face("cin", "md")}<div class="s1-urnwrap">${urnSVG(URN_W, { open: true, shake: S.shake, label: "Cinderella's urn for the mattress: 2 orange balls and 3 white balls" })}${step >= 1 && S.last !== null ? `<div class="s1-ball${S.last ? " on" : ""}"></div>` : ""}</div>${MB.tile(PR[3], "md")}</div>
            <p class="formula">${MB.pp} = 2 / 5 = 0.4</p>
            <p class="muted small">${MB.pp}: the probability that she taps the mattress, the share of orange balls.</p>
          </div>`;
        if (step >= 1) {
          const res = S.last === null ? "" : S.last ? `<span class="res yes">Orange: a tap.</span>` : `<span class="res no">White: no tap.</span>`;
          h += `<p class="say${MB.cls(step, 1)}">Showing the ad means drawing one ball. Orange: she taps. White: she does not. Then the ball goes back in.</p>
            <div class="row${MB.cls(step, 1)}"><button type="button" class="act" id="s1draw">Draw a ball</button>${res}
              <span class="muted">${n ? `${n} ${n === 1 ? "draw" : "draws"}: ${g} orange, ${n - g} white` : "No draws yet"}</span></div>`;
        }
        el.innerHTML = h;
        S.shake = false;
        MB.on(el, "#s1draw", () => { const t = rand() < URN_W / URN_N; S.draws.push(t); S.last = t; S.shake = true; MB.redraw(); });
      }
    },
    {
      key: "estimate", title: "The estimate", titleHtml: `The estimate ${MB.phat}`, steps: 3,

(function () {

  const NS = [1, 2, 3, 5, 10, 20];    // the n a participant can choose in the challenge round
