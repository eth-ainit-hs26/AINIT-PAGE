                       { transform: "scale(1)", opacity: 1 }], { duration: ms || TEMPO.pop, easing: "cubic-bezier(.3,.75,.3,1.25)" });
  }
  function rise(node, ms) {
    return anim(node, [{ transform: "translateY(10px)", opacity: 0 }, { transform: "none", opacity: 1 }],
                { duration: ms || TEMPO.enter, easing: "cubic-bezier(.2,.7,.2,1)" });
  }
  // A copy of a number travels from one element to another inside the layer, then goes.
  function fly(layer, from, to, dur, o) {
    o = o || {};
    if (!MOTION || !layer || !from || !to) return null;
    var base = layer.getBoundingClientRect(), a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    if (!a.width || !b.width) return null;
    var g = from.cloneNode(true);
    g.classList.remove("nt-hot", "nt-ask", "nt-off", "g-focus", "g-moved", "mx-xbody");
    g.classList.add("g-ghost");
    g.removeAttribute("role");
    g.removeAttribute("aria-label");
    g.setAttribute("aria-hidden", "true");
    g.style.left = (a.left - base.left) + "px";
    g.style.top = (a.top - base.top) + "px";
    g.style.width = a.width + "px";
    g.style.height = a.height + "px";
    g.style.fontSize = getComputedStyle(from).fontSize;
    layer.appendChild(g);
    var dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    var sc = (b.height / a.height) || 1, arc = o.arc || 0;
    anim(g, [{ transform: "translate(0px,0px) scale(1)" },
             { transform: "translate(" + dx / 2 + "px," + (dy / 2 - arc) + "px) scale(" + (1 + (sc - 1) / 2) + ")", offset: 0.5 },
             { transform: "translate(" + dx + "px," + dy + "px) scale(" + sc + ")" }],
         { duration: dur, delay: o.delay || 0, easing: "cubic-bezier(.45,.05,.3,1)", fill: "both" });
    setTimeout(function () { if (g.parentNode) g.parentNode.removeChild(g); }, dur + (o.delay || 0) + 40);
    return g;
  }
  // A number cell that lives as long as the diagram: a number, or "?" while it is unknown.
  function paintNum(c, x) {
    c.classList.remove("nt-slot", "nt-draft", "nt-wrong", "nt-right", "nt-ask", "nt-hot");
    if (known(x)) return N.setCell(c, x);
    c.classList.add("nt-slot");
    c.textContent = "?";
    c.dataset.t = "q";
    delete c.dataset.v;
    c.setAttribute("aria-label", "a number to guess");
    return c;
  }
  function newNum(x, cls) {
    var c = el("span", "nt-n" + (cls ? " " + cls : ""));
    c.setAttribute("role", "img");
    return paintNum(c, x);
  }
  // A cell of an MF.M matrix takes one of the diagram's own number cells.
  function seat(td, c) { if (!td) return; td.textContent = ""; td.appendChild(c); }

  /* THE SMALL CROSS */
  function diagram(o) {
    o = o || {};
    var M = MF.M;
    var corner = (MF.S2 && MF.S2.corner) || ["ida", "paddington"];
    var who = o.customer || corner[0], film = o.film || corner[1];
    var y = o.rating !== undefined ? o.rating : MF.rating(who, film);
    var dims = (MF.S2 && MF.S2.dims) || ["d1", "d2"];
    var size = o.size === "lg" || o.size === "sm" ? o.size : "md";
    var basePace = o.pace || 1, pace = basePace;
    var st = { c: (o.c || [undefined, undefined]).slice(0, 2), f: (o.f || [undefined, undefined]).slice(0, 2) };
    var parts = PARTS.slice();
    var shown = 0, aim = 0, token = 0, focus = null;
    var seq = Seq();

    var room = o.room === "c" || o.room === "f" ? " g-room g-room" + o.room : (o.room ? " g-room g-roomc g-roomf" : "");
    var root = el("div", "g-dia g-" + size + room + (o.work === false ? " g-nowork" : ""));
    var note = el("div", "g-note");
    var layer = el("div", "g-layer");
    function mat(extra) {
      var r = { size: size, fill: "empty" };
      Object.keys(extra).forEach(function (k) { r[k] = extra[k]; });
      return M.matrix(r);
    }
    // The customer's row; the film's column (drawn turned, its name on its left); the prediction and the rating, one
    // cell each.
    var mc = mat({ rows: [who], cols: dims, rowHeads: "chip", colHeads: "pic", cls: "g-mc" });
    var mf = mat({ rows: [film], cols: dims, transpose: true, rowHeads: "pic", colHeads: "pic", caption: MF.get(film).n, cls: "g-mf" });
    var mp = mat({ rows: [who], cols: [film], rowHeads: "none", colHeads: "none", caption: "prediction", cls: "g-mp" });
    var mr = mat({ rows: [who], cols: [film], rowHeads: "none", colHeads: "none", caption: "rating", cls: "g-mr" });
    [mc.colHead(0), mc.colHead(1), mf.colHead(0), mf.colHead(1)].forEach(function (th, k) {
      if (th) th.title = MF.get(dims[k % 2]).t;
    });

    // The four guessed numbers, the prediction, the rating and the loss keep their elements for the life of the diagram.
    var cells = { c: [], f: [] };
    ["c", "f"].forEach(function (w) {
      for (var i = 0; i < 2; i++) {
        var c = newNum(st[w][i], "g-guess");
        c.dataset.which = w;
        c.dataset.i = String(i);
        cells[w].push(c);
        seat((w === "c" ? mc : mf).td(0, i), c);
      }
    });
    var predCell = newNum(undefined, "g-predn"), rateCell = newNum(y, "g-raten");
    seat(mp.td(0, 0), predCell);
    seat(mr.td(0, 0), rateCell);
    var lossBox = el("div", "g-loss");
    var lossCell = newNum(undefined, "g-lossn mx-xbody");
    lossBox.appendChild(el("p", "mx-cap g-cap", "loss"));
    lossBox.appendChild(lossCell);
    var workBox = el("div", "g-work");
    var X = M.cross({ c: mc.el, f: mf.el, p: mp.el, r: mr.el, s: lossBox, note: workBox, layout: "textbook", cls: "g-x" });
    root.appendChild(X.el);
    root.appendChild(note);
    root.appendChild(layer);
    var wl = null;

    function vals() {
      var ok = known(st.c[0]) && known(st.c[1]) && known(st.f[0]) && known(st.f[1]);
      var p = ok ? predict(st.c, st.f) : null, d = ok ? p - y : null;
      return { ok: ok, c: st.c.slice(), f: st.f.slice(), y: y, prediction: p, difference: d,
               square: ok ? d * d : null, loss: ok ? d * d : null };
    }
    function on(name) { var k = parts.indexOf(name); return k >= 0 && k < shown; }

    // The worked line, the prediction and the loss for the numbers of the moment.
    function refresh() {
      var v = vals();
      paintNum(predCell, v.ok ? v.prediction : undefined);
      paintNum(lossCell, v.ok ? v.loss : undefined);
      workBox.textContent = "";
      wl = null;
      if (v.ok) {
        wl = M.workLine([[st.c[0], st.f[0]], [st.c[1], st.f[1]]], { sum: v.prediction, cls: "g-wl" });
        workBox.appendChild(wl.el);
      }
      root.classList.toggle("g-open", !v.ok);
    }
    function paintFocus() {
      ["c", "f"].forEach(function (w) {
        cells[w].forEach(function (c, i) { c.classList.toggle("g-focus", !!focus && focus[0] === w && focus[1] === i); });
      });
    }
    // On a phone the prediction and the rating stand too close for the line between them: it would read as a dot.
    var narrow = window.matchMedia ? window.matchMedia("(max-width: 560px)") : null;
    function arrows() {
      var pr = on("prediction") && on("rating") && !(narrow && narrow.matches);
      X.arrows({ cp: on("prediction"), fp: on("prediction"), pr: pr, rs: on("loss"), ps: on("loss") });
    }
    if (narrow && narrow.addEventListener) narrow.addEventListener("change", function () { arrows(); });
    // The state of `shown` parts, at once.
    function paint() {
      parts.forEach(function (name, k) { root.classList.toggle("g-on-" + name, k < shown); });
      root.classList.remove("g-pwait", "g-lwait");
      if (wl) wl.parts.forEach(function (p) { p.classList.remove("mx-cwait"); });
      arrows();
      paintFocus();
    }
    function settle() {
      token++;
      seq.stop();
      layer.textContent = "";
      shown = aim;
      paint();
    }

    // The motion of one part; resolves true when it has landed.
    function play(name) {
      var T = function (ms) { return ms * pace; };
      function add(n) { root.classList.add("g-on-" + n); }
      var v = vals();
      if (name === "guesses") {
        add("guesses");
        rise(mc.el, T(TEMPO.enter));
        rise(mf.el, T(TEMPO.enter));
        return seq.wait(T(TEMPO.enter));
      }
      if (name === "rating") {
        add("rating");
        arrows();
        pop(rateCell, T(TEMPO.pop));
        return seq.wait(T(TEMPO.pop));
      }
      if (name === "prediction") {
        add("prediction");
        arrows();
        if (!v.ok || !wl) return seq.wait(T(TEMPO.settle));
        // the worked line plays, one piece at a time, then its sum flies into the prediction
        root.classList.add("g-pwait");
        var ps = wl.parts, acts = [];
        ps.forEach(function (p) { p.classList.add("mx-cwait"); });
        ps.forEach(function (p, k) {
          acts.push([T(TEMPO.first + k * TEMPO.beat), function () { p.classList.remove("mx-cwait"); rise(p, T(TEMPO.settle)); }]);
        });
        var tFly = T(TEMPO.first + ps.length * TEMPO.beat + 120);
        acts.push([tFly, function () { fly(layer, D.result("sum"), predCell, T(TEMPO.fly), { arc: 28 }); }]);
        acts.push([tFly + T(TEMPO.fly), function () { root.classList.remove("g-pwait"); pop(predCell, T(TEMPO.pop)); }]);
        return seq.run(acts, tFly + T(TEMPO.fly + TEMPO.settle));
      }
      if (name === "loss") {
        add("loss");
        arrows();
        if (!v.ok) return seq.wait(T(TEMPO.settle));
        // the prediction, then the rating, straight into the loss
        root.classList.add("g-lwait");
        fly(layer, predCell, lossCell, T(TEMPO.fly), { arc: 18 });
        fly(layer, rateCell, lossCell, T(TEMPO.fly), { arc: 18, delay: T(160) });
        return seq.run([[T(TEMPO.fly + 160), function () { root.classList.remove("g-lwait"); pop(lossCell, T(TEMPO.pop)); }]],
                       T(TEMPO.fly + 160 + TEMPO.pop));
      }
      add(name);
      return seq.wait(T(TEMPO.settle));
    }

    var D = {
      el: root, note: note, layer: layer, PARTS: parts,
      show: function (k) {
        token++;
        seq.stop();
        layer.textContent = "";
        pace = basePace;
        shown = aim = Math.max(0, Math.min(parts.length, k | 0));
        paint();
        X.redraw();
        return D;
      },
      reveal: function (k, ro) {
        ro = ro || {};
        k = Math.max(0, Math.min(parts.length - 1, k | 0));
        if (aim !== shown) settle();
        var my = ++token;
        seq.stop();
        layer.textContent = "";
        if (shown > k) return Promise.resolve(true);
        pace = ro.pace || basePace;
        shown = k;
        aim = k + 1;
        paint();
        X.redraw();
        if (!MOTION) { shown = aim; paint(); return Promise.resolve(true); }
        return play(parts[k]).then(function (ok) {
          if (my !== token) return false;
          if (ok) { shown = aim; paint(); }
          return ok;
        });
      },
      set: function (which, i, x, so) {
        if (aim !== shown) settle();
        if (!cells[which] || (i !== 0 && i !== 1)) return D;
        st[which][i] = known(x) ? x : undefined;
        paintNum(cells[which][i], st[which][i]);
        refresh();
        paint();
        if (so && so.pop && MOTION) {
          var c = cells[which][i];
          anim(c, [{ transform: "scale(1)" }, { transform: "scale(1.32)", offset: 0.4 }, { transform: "scale(1)" }],
               { duration: 420, easing: "cubic-bezier(.3,.75,.3,1.25)" });
          c.classList.add("g-moved");
          setTimeout(function () { c.classList.remove("g-moved"); }, 900);
        }
        return D;
      },
      setRows: function (c, f) {
        if (aim !== shown) settle();
        for (var i = 0; i < 2; i++) {
          st.c[i] = c && known(c[i]) ? c[i] : undefined;
          st.f[i] = f && known(f[i]) ? f[i] : undefined;
          paintNum(cells.c[i], st.c[i]);
          paintNum(cells.f[i], st.f[i]);
        }
        refresh();
        paint();
        return D;
      },
      values: function () { var v = vals(); delete v.ok; return v; },
      focus: function (which, i) { focus = which ? [which, i] : null; paintFocus(); return D; },
      cell: function (which, i) { return cells[which] ? cells[which][i] || null : null; },
      stop: function () { settle(); return D; },
      redraw: function () { X.redraw(); return D; },
      part: function (name) {
        return { customer: mc.el, film: mf.el, prediction: mp.el, rating: mr.el, work: workBox, loss: lossBox }[name] || null;
      },
      matrix: function (name) { return { c: mc, f: mf, p: mp, r: mr }[name] || null; },
      result: function (name) {
        if (name === "rating") return rateCell;
        if (name === "prediction" || name === "pair") return predCell;
        if (name === "loss") return lossCell;
        if (name === "sum") return wl ? wl.parts[wl.parts.length - 1].querySelector(".nt-n") : null;
        return null;
      },
      product: function (j) {
        if (!wl) return null;
        var hs = wl.parts[wl.parts.length - 2].querySelectorAll(".nt-n");
        return hs[j] || null;
      },
      work: function () { return wl; },
      state: function () { return { shown: shown, aim: aim, size: size, values: D.values() }; }
    };
    refresh();
    D.show(o.parts === undefined ? PARTS.length : o.parts);
    return D;
  }

  /* POPPER'S SCHEMA
     The cold intro of AML and the CSCS workshop as a component (the frame "Popper, 1934: the tetradic schema",
     ~/Documents/git_aml/aml-hs26/docs/slides/popper-cold-intro/): Popper's sentence and its source, four boxes P1,
     TT, EE, P2 with Popper's words under them, arrows between them and one back over the top ("and again"), the
     four beats in the rubric, the source of the schema, and a closing line.
       var S = G.schema({ line: "We use the same method.", parts: 0 });   box.appendChild(S.el);
       S.PARTS        ["quote", "boxes", "again", "beats", "line"] (the source of the schema comes with the boxes)
       S.show(k), S.reveal(k), S.stop()   as for the diagram; a box cascade plays inside "boxes" and "beats"
       S.write(i, x, { pop })   one line under box i (0 to 3): text or an element; "" clears it. Section 5 writes
                      the method onto the schema with it. S.writeAll(list) writes the four at once.
       S.box(i), S.beat(i), S.noteEl(i), S.el
     o.line: the closing line (default "We use the same method."); o.size: "sm" for a small copy. */
  var SCHEMA = ["quote", "boxes", "again", "beats", "line"];
  var BOXES = [
    { id: "p1", sym: ["P", "1"], label: "Problem", beat: "You cannot compute it" },
    { id: "tt", sym: ["TT"], label: "Tentative theory", beat: "Guess", strong: true },
    { id: "ee", sym: ["EE"], label: "Error elimination", beat: "Estimate, then a verdict" },
    { id: "p2", sym: ["P", "2"], label: "A better problem", beat: "Update, and go again" }
  ];
  function schema(o) {
    o = o || {};
    var parts = SCHEMA.slice();
    var shown = 0, aim = 0, token = 0, seq = Seq();
    var root = el("div", "g-sch" + (o.size === "sm" ? " g-sch-sm" : ""));
    var quote = el("div", "g-quote");
    var q = el("p", "g-qt");
    q.appendChild(document.createTextNode("We do not know: "));
    q.appendChild(el("span", "g-qr", "we can only guess."));
    var qc = el("p", "g-src");
    qc.appendChild(document.createTextNode("Karl Popper, "));
    qc.appendChild(el("i", "", "The Logic of Scientific Discovery"));
    qc.appendChild(document.createTextNode(", chapter 10, section 85 (1959)."));
    quote.appendChild(q);
    quote.appendChild(qc);
    var flow = el("div", "g-flow");
    var again = el("div", "g-again");
    again.setAttribute("aria-hidden", "true");
    again.appendChild(el("span", "g-againl", "and again"));
    flow.appendChild(again);
    var cols = BOXES.map(function (b, i) {
      var col = el("div", "g-fcol g-fcol-" + b.id);
      var box = el("div", "g-fbox" + (b.strong ? " g-strong" : ""));
      var sym = el("span", "g-fsym");
      sym.appendChild(el("i", "", b.sym[0]));
      if (b.sym[1]) sym.appendChild(el("sub", "", b.sym[1]));
      box.appendChild(sym);
      box.setAttribute("role", "img");
      box.setAttribute("aria-label", b.label);
      col.appendChild(box);
      if (i < BOXES.length - 1) {
        var ar = el("span", "g-farrow");
        ar.setAttribute("aria-hidden", "true");
        col.appendChild(ar);
      }
      col.appendChild(el("p", "g-flab", b.label));
      col.appendChild(el("p", "g-fbeat", b.beat));
      var nt = el("div", "g-fnote");
      col.appendChild(nt);
      flow.appendChild(col);
      return { col: col, box: box, lab: col.querySelector(".g-flab"), beat: col.querySelector(".g-fbeat"), note: nt, arrow: ar || null };
    });
    var src = el("p", "g-src g-ssrc");
    src.appendChild(document.createTextNode("Schema after Karl Popper, "));
    src.appendChild(el("i", "", "Objective Knowledge"));
    src.appendChild(document.createTextNode(", chapter 8 (1972)."));
    var line = el("p", "g-sline", o.line || "We use the same method.");
    root.appendChild(quote);
    root.appendChild(flow);
    root.appendChild(src);
    root.appendChild(line);

    function paint() {
      parts.forEach(function (name, k) { root.classList.toggle("g-on-" + name, k < shown); });
      cols.forEach(function (c) { c.note.classList.toggle("g-empty", !c.note.firstChild); });
    }
    function settle() { token++; seq.stop(); shown = aim; paint(); }
    function play(name, my) {
      root.classList.add("g-on-" + name);
      if (name === "quote") { rise(quote, 600); return seq.wait(600); }
      if (name === "boxes") {
        var acts = [];
        cols.forEach(function (c, i) {
          acts.push([i * 300, function () {
            pop(c.box, 480);
            rise(c.lab, 480);
            if (i > 0 && cols[i - 1].arrow) anim(cols[i - 1].arrow, [{ transform: "scaleX(0)", opacity: 0 }, { transform: "scaleX(1)", opacity: 1 }], { duration: 260, easing: "ease-out" });
          }]);
          c.box.style.opacity = c.lab.style.opacity = "0";
          if (i > 0 && cols[i - 1].arrow) cols[i - 1].arrow.style.opacity = "0";
          acts.push([i * 300, function () { c.box.style.opacity = c.lab.style.opacity = ""; if (i > 0 && cols[i - 1].arrow) cols[i - 1].arrow.style.opacity = ""; }]);
        });
        rise(src, 500);
        return seq.run(acts, 3 * 300 + 500).then(function (ok) {
          cols.forEach(function (c) { c.box.style.opacity = c.lab.style.opacity = ""; if (c.arrow) c.arrow.style.opacity = ""; });
          return ok && my === token;
        });
      }
      if (name === "again") {
        anim(again, [{ clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0)" }], { duration: 900, easing: "cubic-bezier(.4,0,.2,1)" });
        return seq.wait(900);
      }
      if (name === "beats") {
        var bs = [];
        cols.forEach(function (c, i) {
          c.beat.style.opacity = "0";
          bs.push([i * 260, function () { c.beat.style.opacity = ""; rise(c.beat, 460); }]);
        });
        return seq.run(bs, 3 * 260 + 460).then(function (ok) {
          cols.forEach(function (c) { c.beat.style.opacity = ""; });
          return ok && my === token;
        });
      }
      if (name === "line") { rise(line, 600); return seq.wait(600); }
      return seq.wait(0);
    }
    function clearInline() {
      cols.forEach(function (c) {
        c.box.style.opacity = c.lab.style.opacity = c.beat.style.opacity = "";
        if (c.arrow) c.arrow.style.opacity = "";
      });
    }
    var S = {
      el: root, PARTS: parts,
      show: function (k) { token++; seq.stop(); clearInline(); shown = aim = Math.max(0, Math.min(parts.length, k | 0)); paint(); return S; },
      reveal: function (k) {
        k = Math.max(0, Math.min(parts.length - 1, k | 0));
        if (aim !== shown) settle();
        var my = ++token;
        seq.stop();
        clearInline();
        if (shown > k) return Promise.resolve(true);
        shown = k;
        aim = k + 1;
        paint();
        if (!MOTION) { shown = aim; paint(); return Promise.resolve(true); }
        return play(parts[k], my).then(function (ok) {
          if (my !== token) return false;
          clearInline();
          if (ok) { shown = aim; paint(); }
          return ok;
        });
      },
      stop: function () { settle(); clearInline(); return S; },
      write: function (i, x, wo) {
        var c = cols[i];
        if (!c) return S;
        c.note.textContent = "";
        if (x !== undefined && x !== null && x !== "") c.note.appendChild(typeof x === "string" ? document.createTextNode(x) : x);
        paint();
        if (wo && wo.pop && c.note.firstChild) rise(c.note, 520);
        return S;
      },
      writeAll: function (list) { (list || []).forEach(function (x, i) { S.write(i, x); }); return S; },
      box: function (i) { return cols[i] ? cols[i].box : null; },
      beat: function (i) { return cols[i] ? cols[i].beat : null; },
      noteEl: function (i) { return cols[i] ? cols[i].note : null; }
    };
    S.show(o.parts === undefined ? parts.length : o.parts);
    return S;
  }

  MF.G = { diagram: diagram, schema: schema, loss: loss, predict: predict, PARTS: PARTS.slice(), SCHEMA: SCHEMA.slice(), TEMPO: TEMPO };
})();
</script>
<script>
/* The arithmetic of section 4, many customers and many films: the total loss of a whole table, the slope of every
   number, one step of all of them at once, and the loop. The loss of a table is the TOTAL of its ratings' losses since
   2026-11-11 (Carlos: "replace ... the average loss with the total loss so that we stay consistent with the
   literature"; Koren, Bell and Volinsky 2009, equation 2); it was their average until then, and every slope with it. MF.T in the browser and a module that node can require().
   Written by the main session from notebook/data.py (table_loss, rating_slopes, table_slopes, table_step, factorize
   and _section4_checks, which assert the numbers below exactly). Owned by S4-B from 2026-11-03 (BRIEF-s4d.md): it may
   add to it, and its check script (../tools/check_table.js) asserts every number the section 4 scenes show. Keep the

        ["Their product gives each of them within ", num(recWithin()), ". Where the rating is unknown it gives a number too: the prediction, ringed."]);
      if (live) {

      } else V.showParts(["guesses", "predictions", "ratings"]);

    }
    if (st === "embed") {
      V.set(end.c, end.f);

      words(S, [rub("Rows and columns are the embeddings:"), " a row for every customer, a column for every film."],
        [who + "'s row with " + what + "'s column gives the prediction of the unknown rating: their inner product, as in part one."]);

    words(S, [rub("And we find them by gradient descent:"), " " + REC.run.steps + " steps, every number moving at once."],
      ["Guess, predict, add up the " + count(REC.known) + " known losses, move every number a little, and again: the ringed prediction settles at ",

  }
  MF.define("recap", {

    enter: function () { RC.last = null; },

      RC.V.cross.redraw();                            // the arrows at once, without waiting for the next frame

  });

  /* SCENE 2: POPPER'S DIAGRAM, introduced here, with the method written under its boxes */
  var PO = null;
  var PO_STEPS = ["schema", "write", "again"];
  var PO_NOTES = ["the ratings", "a guess of the two matrices", "the total loss", "every number moved a little to lower the loss"];
  function poStep(k, live) {
    var S = PO, st = PO_STEPS[k];
    S.k = k;
    S.Sc.stop();
    S.Sc.show(4);                                   // the quote, the boxes, the loop and the beats; our own lines below
    S.root.classList.toggle("s5-again", st === "again");
    if (st === "schema") {
      S.Sc.writeAll(["", "", "", ""]);
      words(S, ["A schema of Karl Popper's. Our method fits it, box by box."], []);
      return;
    }
    if (live && st === "write") {
      S.Sc.writeAll(["", "", "", ""]);
      PO_NOTES.forEach(function (x, i) { S.t.later(250 + i * 650, function () { S.Sc.write(i, x, { pop: true }); }); });
    } else S.Sc.writeAll(PO_NOTES);
    if (st === "write") {
      words(S, ["The method, written under the boxes."],
        ["Each number moves a little, up or down, whichever lowers the total loss."]);
      return;
    }
    words(S, [rub("And again:"), " round and round the loop, " + REC.run.steps + " times on the table of part two."],
      ["That is gradient descent. Now on real ratings."]);
  }
  MF.define("schema", {
    act: 5,
    title: "Popper's diagram",

    build: function (inner, api) {

    }

  /* SCENES 3 AND 4 SHARE THE RUN: a strip with the step count, Play and the curve, in the board's top-right corner; the
     ring of the total loss stands in the cross, on the right of the losses */
  function strip(S, d, total) {
    S.strip = el("div", "s5-strip");
    S.count = counter();
    S.ring = ring();
    S.curve = curve({ losses: d.losses });
    S.ctl = el("div", "s5-ctl");
    S.play = button("Play", "primary s5-play", function () { S.player.toggle(); });
    S.ctl.appendChild(S.play);
    S.player = player({ steps: d.steps, total: total, draw: function (j) { runDraw(S, d, j); },
      state: function (P) {
        S.play.textContent = P.playing ? "Pause" : (P.j >= P.steps ? "Replay" : (P.j > 0 ? "Play on" : "Play"));
        if (P.playing && S.during) S.during();
      },
      done: function () { if (S.after) S.after(); } });
  }
  function runDraw(S, d, j) {
    var st = d.states[j];
    S.P = T.predict(st.c, st.f);
    S.count.set(j);
    S.ring.set(st.loss);
    S.curve.draw(j);
    S.st = st;
    if (S.drawP) S.drawP(S.P, st);
  }

  /* The users' and films' numbers of one state of a run, on their maps. */
  function embed(S, st) {
    S.st = st;
    if (S.pU) S.pU.set(function (i, j) { return st.c[i][j]; });
    if (S.pF) S.pF.set(function (i, j) { return st.f[i][j]; });
  }
  // the loss of every rating, (prediction - rating) squared: the squares of the losses' map; a hidden rating has none
  function lossesOf(d, P) { return function (i, j) { return d.R[i][j] === null ? NONE : lossOf(P[i][j], d.R[i][j]); }; }
  // The ring keeps the width of the widest total loss of the run (the hold above).
  function ringHold(S, d) {
    if (!S.ringTexts) S.ringTexts = d.losses.map(avg);
    hold([[S.ring.cell, S.ring.cell]], S.ringTexts);
  }
  function holdOnResize(S, d) {
    ringHold(S, d);
    if (S.held) return;
    S.held = true;
    onHold(function () { if (S.root.getClientRects().length) { ringHold(S, d); S.X.redraw(); } });
  }

  /* THE TEXTBOOK CROSS OF SCENES 3 AND 4 (M.cross with layout "textbook" in matrix.js, as part two since 2026-11-06,
     Carlos's seventh message; part two's stack from 2026-11-05, the cross of 2026-11-04 before): maps of squares. The
     users' numbers on the left of the predictions, one row per user; the films' numbers turned, one column per film,
     above the predictions, their columns over the predictions' columns, so a prediction stands where its user's row
     meets its film's column; the ratings on the right of the predictions, the losses under the predictions and the
     ratings, the total loss in its ring on the right of the losses; arrows show who makes what. The words stand above
     the board on every screen (Carlos, 2026-11-06: "the text must go above or below but not on the side"); the step
     count, Play and the curve in the board's top-right corner (the slot nb, on the right of the films' numbers, above
     the ratings), under the board on a phone; a tapped square's line floats over the square (under the board on a
     phone). W5.shapes(n) gives the five maps' sizes as drawn. */
  function shapes(n) {
    var r = S5.runs[n];
    return { users: [r.users, r.k], films: [r.k, r.films], predictions: [r.users, r.films], ratings: [r.users, r.films],
             losses: [r.users, r.films] };
  }
  function crossOf(S, d, total) {
    var r = d.run, sh = shapes(d.n);
    // map() takes the logical rows and columns; the films' map is drawn turned, so its logical rows are the films
    S.pR = map({ rows: sh.ratings[0], cols: sh.ratings[1], films: d.films, caption: "Ratings", board: "R" });
    S.pU = map({ rows: sh.users[0], cols: sh.users[1], caption: "Users' numbers", cut: 5, board: "U" });
    S.pF = map({ rows: sh.films[1], cols: sh.films[0], turn: true, caption: "Films' numbers", cut: 5, board: "F" });
    S.pP = map({ rows: sh.predictions[0], cols: sh.predictions[1], caption: "Predictions", fwd: true, board: "P" });
    S.pS = map({ rows: sh.losses[0], cols: sh.losses[1], caption: "Losses", fwd: true, board: "S" });
    S.pR.set(ratingsOf(d));
    strip(S, d, total);
    [S.count.el, S.ctl, S.curve.el].forEach(function (x) { S.strip.appendChild(x); });
    S.X = M.cross({ c: S.pU.el, f: S.pF.el, r: S.pR.el, p: S.pP.el, s: S.pS.el, avg: S.ring.el, nb: S.strip, layout: "textbook", cls: "s5-x" });
    S.ringSlot = S.ring.el.parentNode;
    S.stripSlot = S.strip.parentNode;
    S.words = h("div", "s5-words", [S.lead, S.say]);
    S.read = el("p", "s5-read");
    S.drawP = function (P, st) {
      S.pP.set(function (i, j) { return P[i][j]; });
      S.pS.set(lossesOf(d, P));
      embed(S, st);
    };
  }
  // The predictions, the losses and the total loss with their arrows: shown, or kept in their place unseen.
  function outputs(S, on) {
    [S.pP.el, S.pS.el, S.ring.el].forEach(function (e) { e.classList.toggle("s5-later", !on); });
    S.X.arrows({ cp: on, fp: on, pr: on, rs: on, ps: on, sa: on });
  }
  // Squares come in one by one (the first guess); returns the time the last one shows.
  function appear(S, maps, t0, gap) {
    var q = 0;
    maps.forEach(function (m) {
      for (var i = 0; i < m.rows; i++) for (var j = 0; j < m.cols; j++) (function (c, n) {
        c.style.visibility = "hidden";
        S.t.later(t0 + n * gap, function () { c.style.visibility = ""; });
      })(m.cell(i, j), q++);
    });
    return t0 + q * gap;
  }
  // Squares come in along the diagonals (the predictions, the losses); returns the time the last diagonal shows.
  function wave(S, m, t0, gap) {
    var R = m.rows, C = m.cols;
    for (var i = 0; i < R; i++) for (var j = 0; j < C; j++) m.cell(i, j).style.visibility = "hidden";
    for (var dg = 0; dg < R + C - 1; dg++) (function (dg) {
      S.t.later(t0 + dg * gap, function () {
        for (var i = 0; i < R; i++) { var j = dg - i; if (j >= 0 && j < C) m.cell(i, j).style.visibility = ""; }
      });
    })(dg);
    return t0 + (R + C - 1) * gap;
  }
  // The forward pass, played: the predictions with the arrows from the two matrices, then the losses with the
  // arrows from the predictions and the ratings, then the total loss.
  function forward(S, t0) {
    outputs(S, false);
    var gap = Math.max(12, Math.round(700 / (S.pP.rows + S.pP.cols)));
    S.t.later(t0, function () { S.pP.el.classList.remove("s5-later"); S.X.arrows({ cp: true, fp: true, pr: true }); });
    var t1 = wave(S, S.pP, t0, gap) + 200;
    S.t.later(t1, function () { S.pS.el.classList.remove("s5-later"); S.X.arrows({ rs: true, ps: true }); });
    var t2 = wave(S, S.pS, t1, gap) + 200;
    S.t.later(t2, function () { S.ring.el.classList.remove("s5-later"); S.X.arrows({ sa: true }); pop(S.ring.cell); });
    return t2;
  }
  function unhideSquares(S) {
    Array.prototype.forEach.call(S.root.querySelectorAll(".s5-mg i"), function (c) { c.style.visibility = ""; });
  }

  /* SCENE 3: REAL RATINGS, runs[0]: the ratings as a table of digits first, then the cross of maps. Three ratings are
     hidden (Carlos, 2026-11-10: "hide maybe 2 or 3 ratings and you mark them visibly as unknown, and then show how we
     can then predict them using matrix factorization"): a "?" in the table and in the ratings' map, no loss, left out
     of the run (null in d.R); their predictions ringed in ochre from the first product on; on the last step each hidden
     rating beside its prediction. Until 2026-11-10 every rating was known, five numbers per row, and the last step was
     the best possible (scene larger had it until 2026-11-11; it needs every rating). */
  var RE = null;
  var RE_STEPS = ["stars", "numbers", "guess", "predict", "run", "result", "reveal"];
  function reStep(k, live) {
    var S = RE, d = S.d, r = d.run, st = RE_STEPS[k], nh = d.hid.length;
    var cross = k >= 2 && st !== "reveal";
    S.k = k;
    S.player.pause();
    S.after = S.during = null;
    clearRead(S);
    S.root.classList.toggle("s5-titles", k <= 1);
    S.root.classList.toggle("s5-xon", cross);
    S.root.classList.toggle("s5-revon", st === "reveal");
    S.mR.el.hidden = k >= 2;
    S.src.hidden = k >= 2;
    S.X.el.hidden = !cross;
    S.cards.hidden = st !== "reveal";
    S.strip.classList.toggle("s5-later", k < 3);         // in its corner from the first guess on, unseen until the predictions
    S.predOn = k >= 3;
    S.pP.mark(k >= 3 ? d.hid : null, "s5-hid");
    var shift = S5.shift, top = topStar();
    if (st === "stars" || st === "numbers") {
      if (st === "stars") {
        S.mR.paint(starsOf(d), 1);
        starStyle(true);
        var uf = counts(r.users, r.films);
        words(S, [uf[0] + " MovieLens users and " + uf[1] + " films: " + d.ratings + " ratings. We hide " + count(nh) + " of them."],
          ["Real ratings, in stars, as MovieLens gives them. The method never sees the " + count(nh) + " marked ", qmark(),
           ". Tap a number to read it."]);
        return;
      }
      words(S, [rub("As the game's numbers:"), " the stars minus " + shift + "."],
        [String(top) + " stars becomes ", num(top - shift), ", " + shift + " stars becomes ", num(0), ". " + d.above + " of the " +
         d.known + " known ratings are above ", num(0), ": these films are well liked."]);
      if (live) {
        starStyle(true);
        S.mR.paint(starsOf(d), 1);
        for (var dg = 0; dg < r.users + r.films - 1; dg++) (function (dg) {
          S.t.later(300 + dg * 55, function () {
            for (var i = 0; i < r.users; i++) {
              var j = dg - i;
              if (j < 0 || j >= r.films || d.isHid(i, j)) continue;
              var c = S.mR.item(i, j);
              c.classList.remove("s5-st");
              paint(c, d.R[i][j], 1);
              pop(c);
            }
          });
        })(dg);
      } else {
        starStyle(false);
        S.mR.paint(ratingsOf(d), 1);
      }
      return;
    }
    starStyle(false);
    S.mR.paint(ratingsOf(d), 1);
    if (st === "reveal") {
      reveal(S, d, live, ["The method never saw these " + count(nh) + " ratings. A recommender is judged this way: on ratings it never saw."]);
      return;
    }
    if (!(live && st === "predict")) outputs(S, k >= 3);
    if (st === "guess") {
      S.player.reset();
      var gr = guessRange();
      words(S, [cap(count(r.k)) + " numbers per user and per film: the first guess."],
        ["Drawn at random between ", num(gr[0]), " and ", num(gr[1]), ". Every number is now a coloured square: tap one to read it."]);
      if (live) appear(S, [S.pU, S.pF], 200, 5);
      return;
    }
    if (st === "predict") {
      S.player.reset();
      words(S, [rub("Their product:"), " a prediction for every rating, the hidden ones too."],
        ["The ringed squares predict the hidden ratings, which have no loss. The total loss of the " + d.known + " known ratings is ",
         lossCell(d.losses[0]), "."]);
      if (live) forward(S, 150);
      return;
    }
    if (st === "run") {
      // while the run plays, what a step does; at its end (or reached at rest) what to do with the result
      var during = ["At every step each of the " + d.numbers + " numbers moves a little, the way that makes the total loss smaller. The hidden ratings play no part."];
      var after = ["Every prediction has settled, the " + count(nh) + " ringed ones too. Tap a square to compare it with its rating."];
      S.during = function () { put(S.say, during); };
      S.after = function () { put(S.say, after); };
      words(S, [rub("Gradient descent:"), " " + d.steps + " steps."], live ? during : after);
      if (live) { S.player.reset(); S.player.play(400); }
      else S.player.end();
      return;
    }
    S.player.end();
    words(S, ["After " + d.steps + " steps the total loss is ", lossCell(d.losses[d.steps]), "."],
      [d.within + " of the " + d.known + " known ratings are predicted within half a star. And the " + count(nh) + " hidden ones?"]);
  }
  function starStyle(on) {
    var S = RE, d = S.d;
    for (var i = 0; i < S.mR.R; i++) for (var j = 0; j < S.mR.C; j++) {
      var c = S.mR.item(i, j);
      if (c && !d.isHid(i, j)) c.classList.toggle("s5-st", on);
    }
  }
  /* The last step of scenes real and larger: each hidden rating beside its prediction (the prediction first, as on the
     board), how far apart they are, in reading order. Played, the cards come in one by one, each rating after its
     prediction. */
  function revealCard(x) {
    var c = el("div", "s5-rcard"), head = el("div", "s5-rhead"), who = el("div", "s5-rwho");
    head.appendChild(tile(x.film));
    who.appendChild(el("p", "s5-rfilm", x.film.short));
    who.appendChild(el("p", "s5-ruser", "User " + x.user));
    head.appendChild(who);
    c.appendChild(head);
    var pair = el("div", "s5-rpair"), a = el("div", "s5-rp"), b = el("div", "s5-rv s5-late");
    a.appendChild(el("span", "s5-cl", "prediction"));
    a.appendChild(num(x.prediction, 2));
    b.appendChild(el("span", "s5-cl", "rating"));
    b.appendChild(num(x.rating, 1));
    b.appendChild(el("span", "s5-rs", x.stars + " stars"));
    pair.appendChild(a);
    pair.appendChild(b);
    c.appendChild(pair);
    c.appendChild(h("p", "s5-rmiss s5-late", ["missed by ", num(x.miss, 2)]));
    return c;
  }
  function cardsOf(d) {
    var box = el("div", "s5-reveal");
    d.reveal.forEach(function (x) { box.appendChild(revealCard(x)); });
    return box;
  }
  function reveal(S, d, live, say) {
    S.player.end();
    words(S, [rub("The hidden ratings,"), " beside their predictions."], say);
    var cards = S.cards.querySelectorAll(".s5-rcard");
    S.cards.querySelectorAll(".s5-rcard, .s5-late").forEach(function (c) { c.style.visibility = ""; });
    if (!live) return;
    Array.prototype.forEach.call(cards, function (c, q) {
      var late = c.querySelectorAll(".s5-late"), t0 = 250 + q * 1000;
      c.style.visibility = "hidden";
      late.forEach(function (x) { x.style.visibility = "hidden"; });
      S.t.later(t0, function () { c.style.visibility = ""; pop(c); });
      S.t.later(t0 + 500, function () { late.forEach(function (x) { x.style.visibility = ""; }); pop(late[0].querySelector(".nt-n")); });
    });
  }
  MF.define("real", {
    act: 5,
    title: "Real ratings",
    steps: RE_STEPS.length,
    build: function (inner, api) {
      var d = data(0), S = frame(inner, "real");
      RE = S;
      S.api = api;
      S.d = d;
      S.mR = mtable({ rows: d.users.map(String), corner: "user", films: d.films, values: starsOf(d), hidden: d.isHid, places: 1,
                      caption: "Ratings", board: "R" });
      crossOf(S, d, REPLAY[0]);
      S.boards = h("div", "s5-boards", [S.mR.el, S.X.el]);
      S.src = h("p", "s5-src", sourceLine());                // under the table of the first two steps
      S.cards = cardsOf(d);
      [S.words, S.boards, S.cards, S.src, S.read].forEach(function (x) { S.root.appendChild(x); });
      embed(S, d.states[0]);
      reader(S, d);
    },
    enter: function () { RE.last = null; },
    leave: function () { RE.t.stop(); if (RE.player.playing) RE.player.end(); RE.player.pause(); },
    step: function (k) {
      var live = isLive(RE, k);
      RE.t.stop();
      Array.prototype.forEach.call(RE.root.querySelectorAll(".mx-c > .nt-n"), function (c) { c.style.visibility = ""; });
      unhideSquares(RE);
      reStep(k, live);
      holdOnResize(RE, RE.d);
      RE.X.redraw();                                  // the arrows at once, without waiting for the next frame
      RE.last = k;
    },
    onkey: function (e) {
      var st = RE_STEPS[RE.api.step];
      if (RE.api.step >= 3 && st !== "reveal" && (e.key === "p" || e.key === "P")) { RE.player.toggle(); return true; }
      return false;
    }
  });

  /* SCENE 4: A LARGER TABLE, runs[1]: the ratings alone as a map of coloured squares, then the cross. Three ratings
     are hidden, as in scene real (Carlos, 2026-11-11: "Could you do the same when you do the gradient descent for the
     larger matrix?"): a "?" in the map, no loss, left out of the run (null in d.R), their predictions ringed in ochre
     from the first product on, and on the last step each beside its rating on a card. Until 2026-11-11 every rating
     was known, eight numbers per row, 500 steps, the misses ringed, and the last step showed the best possible (the
     singular value decomposition), which needs every rating. */
  var LG = null;
  var LG_STEPS = ["table", "guess", "run", "result", "reveal"];
  function lgStep(k, live) {
    var S = LG, d = S.d, r = d.run, st = LG_STEPS[k], nh = d.hid.length, rev = st === "reveal";
    S.k = k;
    S.player.pause();
    S.after = S.during = null;
    clearRead(S);
    S.predOn = k >= 1;
    S.pP.mark(k >= 1 ? d.hid : null, "s5-hid");
    S.root.classList.toggle("s5-k0", k === 0);           // the ratings alone, centred, with the key of the colours
    S.root.classList.toggle("s5-xon", k >= 1 && !rev);
    S.root.classList.toggle("s5-revon", rev);
    S.X.el.classList.toggle("s5-solo", k === 0);
    S.X.el.hidden = rev;
    S.cards.hidden = !rev;
    S.strip.classList.toggle("s5-later", k === 0);
    S.key.hidden = k !== 0;
    if (rev) {
      reveal(S, d, live, ["The method never saw these " + count(nh) + " ratings either: each prediction comes from the other " + d.known + "."]);
      return;
    }
    if (!(live && st === "guess")) outputs(S, k >= 1);
    if (st === "table") {
      var uf = counts(r.users, r.films);
      words(S, [uf[0] + " users and " + uf[1] + " films: " + d.ratings + " ratings. Again we hide " + count(nh) + " of them."],
        ["A larger table from MovieLens, one square per rating. The method never sees the " + count(nh) + " marked ", qmark(),
         ". Tap a square to read it."]);
      S.player.reset();
      return;
    }
    if (st === "guess") {
      S.player.reset();
      words(S, [cap(count(r.k)) + " numbers per user and per film, guessed at random."],
        ["Their product gives the predictions, the ringed ones for the hidden ratings. With the " + d.known + " known ratings, the losses: the total loss is ",
         lossCell(d.losses[0]), "."]);
      if (live) forward(S, appear(S, [S.pU, S.pF], 150, 6) + 150);
      return;
    }
    if (st === "run") {
      words(S, [rub("Gradient descent:"), " " + d.steps + " steps."],
        ["At every step each of the " + d.numbers + " numbers moves a little; the hidden ratings play no part. The predictions take on the pattern of the ratings, and the losses fade."]);
      if (live) { S.player.reset(); S.player.play(400); }
      else S.player.end();
      return;
    }
    S.player.end();
    words(S, ["After " + d.steps + " steps the total loss is ", lossCell(d.losses[d.steps]), "."],
      [d.within + " of the " + d.known + " known ratings are predicted within half a star. And the " + count(nh) + " hidden ones?"]);
  }
  MF.define("larger", {
    act: 5,
    title: "A larger table",
    steps: LG_STEPS.length,
    build: function (inner, api) {
      var d = data(1), S = frame(inner, "larger");
      LG = S;
      S.api = api;
      S.d = d;
      crossOf(S, d, REPLAY[1]);
      S.boards = h("div", "s5-boards", [S.X.el]);
      // the key of the colours: the five marks' numbers
      S.key = el("div", "s5-key");
      MF.LEVELS.slice().reverse().forEach(function (v) {
        var q = el("span", "s5-kq"), sq = el("i");
        sq.dataset.c = quant(v);
        var g = el("span", "s5-mg");
        g.style.padding = "0";
        g.style.background = "transparent";
        g.style.display = "inline-block";
        g.appendChild(sq);
        q.appendChild(g);
        q.appendChild(num(v, 0));
        S.key.appendChild(q);
      });
      S.cards = cardsOf(d);
      [S.words, S.boards, S.key, S.cards, S.read].forEach(function (x) { S.root.appendChild(x); });
      embed(S, d.states[0]);
      reader(S, d);
    },
    enter: function () { LG.last = null; },
    leave: function () { LG.t.stop(); if (LG.player.playing) LG.player.end(); LG.player.pause(); },
    step: function (k) {
      var live = isLive(LG, k);
      LG.t.stop();
      unhideSquares(LG);
      lgStep(k, live);
      holdOnResize(LG, LG.d);
      LG.X.redraw();                                  // the arrows at once, without waiting for the next frame
      LG.last = k;
    },
    onkey: function (e) {
      if (LG.api.step >= 1 && LG_STEPS[LG.api.step] !== "reveal" && (e.key === "p" || e.key === "P")) { LG.player.toggle(); return true; }
      return false;
    }
  });

  /* SCENE 5: THE WHOLE PICTURE: the method in one line of four cards, drawn from the larger table's run, and the
     dataset's lines. One step since 2026-11-10 (Carlos: scene real's hidden ratings replace the steps "unknown" and
     "judge" that hid ratings of the larger table here; scene larger hides three since 2026-11-11, and the first card
     shows them as the run saw them). */
  var EN = null;
  var EN_STEPS = ["method"];
  function enStep(k, live) {
    var S = EN;
    S.k = k;
    words(S, [rub("The whole method:")], ["the ratings, factorized into two matrices, the embeddings, found by gradient descent."],
      ["Nobody filled in these profiles. Their numbers have no names: any other numbers whose product fits the ratings as well would do."]);
    if (live) S.chain.querySelectorAll(".s5-card, .s5-arrow").forEach(function (c, q) {
      c.style.visibility = "hidden";
      S.t.later(200 + q * 260, function () { c.style.visibility = ""; pop(c); });
    });
  }
  function card(pics, text) {
    var c = el("div", "s5-card"), p = el("div", "s5-cardpic");
    pics.forEach(function (x) { p.appendChild(x); });
    c.appendChild(p);
    c.appendChild(h("p", "", text));
    return c;
  }
  MF.define("end", {
    act: 5,
    title: "The whole picture",
    steps: EN_STEPS.length,
    build: function (inner, api) {
      var d = data(1), r = d.run, S = frame(inner, "end");
      EN = S;
      S.api = api;
      S.d = d;
      S.root.appendChild(S.lead);
      S.root.appendChild(S.say);
      var e = d.states[d.steps];
      // the users' matrix one row per user, the films' matrix turned, one column per film (the textbook cross)
      var mR = map({ rows: r.users, cols: r.films }), mC = map({ rows: r.users, cols: r.k }), mF = map({ rows: r.films, cols: r.k, turn: true });
      var mE = map({ rows: r.users, cols: r.k }), mG = map({ rows: r.films, cols: r.k, turn: true });
      mR.set(function (i, j) { return d.R[i][j]; });
      mC.set(function (i, j) { return e.c[i][j]; });
      mF.set(function (i, j) { return e.f[i][j]; });
      mE.set(function (i, j) { return e.c[i][j]; });
      mG.set(function (i, j) { return e.f[i][j]; });
      mE.grid.appendChild(el("span", "s5-rowbox"));         // a violet frame round the first user's row: one embedding
      mG.grid.appendChild(el("span", "s5-colbox"));         // and round the first film's column: another
      var cv = curve({ losses: d.losses, small: true, cls: "s5-mini", xlabel: "", ylabel: "" });
      S.cv = cv;
      S.chain = el("div", "s5-chain");
      var arrow = function () { var a = el("span", "s5-arrow", "→"); a.setAttribute("aria-hidden", "true"); return a; };
      [card([mR.el], [rub("The ratings")]), arrow(),
       card([mC.el, mF.el], ["factorized into ", rub("two matrices")]), arrow(),
       card([mE.el, mG.el], ["whose rows and columns are the ", rub("embeddings")]), arrow(),
       card([cv.el], ["found by ", rub("gradient descent")])].forEach(function (x) { S.chain.appendChild(x); });
      S.root.appendChild(S.chain);
      S.aside = el("p", "s5-aside");
      S.root.appendChild(S.aside);
      var lic = el("div", "s5-lic");
      S5.source.licence.forEach(function (line) { lic.appendChild(el("p", "", line)); });
      S.root.appendChild(lic);
    },
    enter: function () { EN.last = null; },
    leave: function () {
      EN.t.stop();
      EN.chain.querySelectorAll(".s5-card, .s5-arrow").forEach(function (c) { c.style.visibility = ""; });
    },
    step: function (k) {
      var live = isLive(EN, k);
      EN.t.stop();
      EN.chain.querySelectorAll(".s5-card, .s5-arrow").forEach(function (c) { c.style.visibility = ""; });
      enStep(k, live);
      EN.cv.draw();
      EN.last = k;
    }
  });

  MF.W5 = { player: player, curve: curve, map: map, mtable: mtable, ring: ring, tile: tile, PICS: PICS, data: data,
            quant: quant, avg: avg, REPLAY: REPLAY, shapes: shapes, readOf: readOf, lossOf: lossOf, lossesOf: lossesOf,
            NONE: NONE, rec: REC, recWithin: recWithin, forms: forms, hold: hold };
})();
</script>
<script>
/* fullscreen.js: the full-screen button of the AINIT games (2026-11-11; Carlos shows the games from his iPad).
   The same file in every game. The button goes after the light or dark switch (.themebtn) and takes its look; a
   page without that switch marks the place with data-fullscreen. One tap and the page fills the whole screen, with
   no address bar or tabs, in Safari and Chrome on an iPad and on a computer. The button is left out where the
   browser cannot do that (an iPhone, a frame that does not allow it), and hidden on screens under 561 px and while
   the page is full screen. The browser's own exit button, a swipe down on an iPad, or Escape leave full screen. */
(function () {
  var doc = document, root = doc.documentElement;
  var request = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!request || !(doc.fullscreenEnabled || doc.webkitFullscreenEnabled)) return;
  var host = doc.querySelector("[data-fullscreen]"), twin = host ? null : doc.querySelector(".themebtn");
  if (!host && !twin) return;

  var btn = doc.createElement("button");
  btn.type = "button";
  btn.className = twin ? twin.className + " fullbtn" : "fullbtn";
  btn.title = "Full screen";
  btn.setAttribute("aria-label", "Full screen");
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" style="display:block; margin:auto" aria-hidden="true"' +
    ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';

  var narrow = window.matchMedia ? window.matchMedia("(max-width: 560px)") : null;
  function isFull() { return !!(doc.fullscreenElement || doc.webkitFullscreenElement); }
  function sync() { btn.style.display = isFull() || (narrow && narrow.matches) ? "none" : ""; }

  btn.addEventListener("click", function () {
    btn.blur();
    var p = request.call(root);
    if (p && typeof p.catch === "function") p.catch(function () {});
  });
  doc.addEventListener("fullscreenchange", sync);
  doc.addEventListener("webkitfullscreenchange", sync);
  if (narrow && narrow.addEventListener) narrow.addEventListener("change", sync);
  else if (narrow && narrow.addListener) narrow.addListener(sync);

  if (twin) twin.parentNode.insertBefore(btn, twin.nextSibling);
  else host.appendChild(btn);
  sync();
})();
</script>
