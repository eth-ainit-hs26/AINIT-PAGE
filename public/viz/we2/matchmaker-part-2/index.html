<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streaming Service: Matrix Factorization</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style>
/* Once Upon a Matchmaker (frame copied from Once Upon a Video Store): the shared frame, owned by the main session. Each agent adds its own rules in
   its own stylesheet (sec1.css, ...), with class names that start with its prefix (s1-, ...).
   Codex plates: vellum, a fine double rule, violet rubric, ochre accent. Blue for ticks, orange for crosses,
   grey for the wavy line of neutral. Two marks are drawn stronger than one. */
:root{
  --bg:#F9F4E3;
  --leaf:#FFFBF0;
  --ink:#2A2432;
  --muted:#6B6275;
  --rule:#D8CBA9;
  --rubric:#58409A;
  --ochre:#8F5A06;
  --like:#1E6AAE;
  --like-bg:#E9F1FA;
  --like-bg2:#C9DDF3;
  --dislike:#AE4E18;
  --dislike-bg:#FAEDE3;
  --dislike-bg2:#F2D3BC;
  --serif:"EB Garamond", Garamond, "Iowan Old Style", "Times New Roman", serif;
  --emoji:"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  /* The colours of the guessing diagram and of section 3 (GUESS.md, HOPPER.md), defined once here: the forward pass
     and the loss violet, a move or update ochre, a slope green. */
  --g-fwd:var(--rubric); --g-move:var(--ochre); --g-slope:#2F7D62;
}
/* Text scale (2026-11-11). Carlos shows the games from his iPad on the projector and asked for words the size of the
   slides' words; the matrices keep their sizes. On a screen at least 1080 x 740 px, the size of every word of 18 px or
   less is multiplied by --tx; larger type grows by a share that falls to nothing at 44 px. The sizes are written as
   calc(V * var(--tx)) or calc(V * (1 + (var(--tx) - 1) * w)). The tables, stacks, badges, pictures, the top bar and
   Back and Next keep their sizes, and so does a phone (--tx is 1 there). */
:root{--tx:1}
@media (min-width: 1080px) and (min-height: 740px){ :root{--tx:1.4} }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1720; --leaf:#231E2A; --ink:#EEE7D8; --muted:#A99FB3; --rule:#3D3548;
    --rubric:#B9A6F3; --ochre:#E3AA4C;
    --like:#86BDEE; --like-bg:#1A2633; --like-bg2:#22405E; --dislike:#F0A06D; --dislike-bg:#33231A; --dislike-bg2:#5A3520;
    --g-slope:#7CCFAE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1720; --leaf:#231E2A; --ink:#EEE7D8; --muted:#A99FB3; --rule:#3D3548;
  --rubric:#B9A6F3; --ochre:#E3AA4C;
  --like:#86BDEE; --like-bg:#1A2633; --like-bg2:#22405E; --dislike:#F0A06D; --dislike-bg:#33231A; --dislike-bg2:#5A3520;
  --g-slope:#7CCFAE;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%; margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--serif); font-size:18px; line-height:1.45; -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600}
p{margin:0}
ol,ul{margin:0; padding:0; list-style:none}
button{font:inherit; color:inherit}
button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--rubric); outline-offset:2px}
.scene-no{color:var(--rubric); line-height:1; font-variant-numeric:lining-nums tabular-nums}
.sprite{position:absolute; width:0; height:0; overflow:hidden}
.em{font-family:var(--emoji); font-style:normal; line-height:1}
.sc{font-variant-caps:all-small-caps; letter-spacing:.09em}

/* App shell: top bar, one scene at a time, Back and Next with the steps of the scene between them */
.app{height:100vh; height:100dvh; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto}
.topbar{display:flex; align-items:center; gap:14px; padding:8px var(--gut-r) 8px var(--gut); border-bottom:1px solid var(--rule); min-width:0; overflow:hidden}
.brand{font-size:21px; font-weight:500; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis}
.brand em{color:var(--rubric)}
.brand .part{margin-left:14px; font-size:15px; font-style:italic; color:var(--muted)}
.pager{margin-left:auto; display:flex; align-items:center; gap:4px; min-width:0}
.pager .act{display:flex; align-items:center; gap:4px}
.pager .act + .act{margin-left:6px; padding-left:10px; border-left:1px solid var(--rule)}
.pager button{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--rule); background:var(--leaf); color:var(--rubric);
  font-size:15px; font-variant-numeric:lining-nums tabular-nums; line-height:1; padding:0; cursor:pointer; flex:none}
.pager button[aria-current="step"]{background:var(--rubric); border-color:var(--rubric); color:var(--leaf)}
.pager.fold .act:not(.here) button:not(:first-child){display:none}
.themebtn{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--rule); background:transparent; padding:0; cursor:pointer;
  display:grid; place-items:center; color:var(--muted); flex:none}
.themebtn svg{width:18px; height:18px}
.stage{overflow:auto; padding:12px var(--gut-r) 12px var(--gut)}
.foot{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; padding:8px var(--gut-r) 10px var(--gut); border-top:1px solid var(--rule)}
.navbtn{border:1.5px solid var(--rubric); color:var(--rubric); background:transparent; border-radius:999px; padding:5px 20px 7px;
  font-size:17px; cursor:pointer; min-width:104px}
.navbtn.next{background:var(--rubric); color:var(--leaf)}
.navbtn:disabled{opacity:.3; cursor:default}
.steps{display:flex; justify-content:center; flex-wrap:wrap; gap:6px}
.steps i{width:8px; height:8px; border-radius:50%; background:var(--rule)}
.steps i.past{background:var(--muted)}
.steps i.on{background:var(--rubric); transform:scale(1.25)}

/* A scene is one leaf of the codex: a fine double rule around one screen */
.scene{display:none; min-height:100%; max-width:1180px; margin:0 auto; flex-direction:column;
  background:var(--leaf); border:3px double var(--rule); border-radius:4px; padding:16px 24px 18px}
.scene.active{display:flex; animation:enter .35s ease both}
@keyframes enter{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ .scene.active{animation:none} }
.scene-head{display:flex; align-items:center; gap:14px}
.scene-head .scene-no{font-size:calc(34px * (1 + (var(--tx) - 1) * 0.385))}
.scene-head h2{font-size:calc(28px * (1 + (var(--tx) - 1) * 0.615)); line-height:1.1}
.scene-head .actname{margin-left:auto; color:var(--muted); font-variant-caps:all-small-caps; letter-spacing:.09em; font-size:calc(15px * var(--tx)); white-space:nowrap}
/* The leaves of an optional section (3 and 4) carry this tag beside their title. */
.scene-head .opt-tag{flex:none; color:var(--ochre); border:1.5px solid var(--ochre); border-radius:999px; padding:0 10px 2px;
  font-variant-caps:all-small-caps; letter-spacing:.09em; font-size:calc(15px * var(--tx)); line-height:1.3; white-space:nowrap}
.scene-body{flex:1; display:flex; flex-direction:column; min-height:0}
.scene-inner{margin:auto 0; padding-top:12px; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; width:100%}
.scene-error{border:1.5px dashed var(--dislike); color:var(--dislike); border-radius:10px; padding:8px 12px; font-size:calc(15px * var(--tx))}
.say{text-align:center; color:var(--muted); font-style:italic; font-size:calc(17px * var(--tx))}
.bubble{justify-self:center; max-width:62ch; text-align:center; background:var(--bg); border:1.5px solid var(--rule); border-radius:16px; padding:9px 18px; font-size:calc(18px * var(--tx))}
.btn{border:1.5px solid var(--rubric); color:var(--rubric); background:transparent; border-radius:999px; padding:4px 16px 6px;
  font-size:calc(16px * var(--tx)); line-height:1.2; cursor:pointer}
.btn.primary{background:var(--rubric); color:var(--leaf)}
.btn.quiet{border-style:dashed}
.btn:disabled{opacity:.4; cursor:default}

/* The five marks: two ticks, a tick, neutral (a wavy line), a cross, two crosses.
   A badge holds one mark; data-r is the rating from 2 to -2. Two marks get the stronger tint. */
.mk{display:inline-block; width:1em; height:1em; vertical-align:-.14em; overflow:visible; flex:none}
.mk.tick2, .mk.cross2{width:1.25em}
.mk.tick, .mk.tick2{color:var(--like)}
.mk.cross, .mk.cross2{color:var(--dislike)}
.mk.wave{color:var(--muted)}
.vote{display:inline-flex; align-items:center; justify-content:center; gap:3px; min-width:44px; padding:4px 6px; border-radius:9px;
  border:1.5px solid var(--rule); background:transparent; flex:none; line-height:1; vertical-align:middle}
.vote .mk{width:20px; height:20px}
.vote .mk.tick2, .vote .mk.cross2{width:25px}
.vote[data-r="1"]{background:var(--like-bg); border-color:var(--like)}
.vote[data-r="2"]{background:var(--like-bg2); border-color:var(--like); border-width:2px}
.vote[data-r="-1"]{background:var(--dislike-bg); border-color:var(--dislike)}
.vote[data-r="-2"]{background:var(--dislike-bg2); border-color:var(--dislike); border-width:2px}
.vote .n{font-size:15px; min-width:1.7em; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); font-weight:600}

/* Pictures: an emoji tile for a film, an initial for a person */
.pic{--s:44px; position:relative; flex:none; width:var(--s); height:var(--s); display:grid; place-items:center; line-height:1}
.pic.film{border-radius:24%; font-family:var(--emoji); font-style:normal; font-size:calc(var(--s) * .56); color:#2A2432}
.pic.person{border-radius:50%; font-family:var(--serif); font-weight:600; font-size:calc(var(--s) * .5); color:#2A2432;
  box-shadow:inset 0 0 0 1.5px rgba(42,36,50,.25)}
.pic.xl{--s:clamp(76px, 15vh, 120px)}
.pic.lg{--s:clamp(60px, 11vh, 88px)}
.pic.md{--s:44px}
.pic.sm{--s:34px}
.pic.xs{--s:26px}

/* Chips: a small picture and a name */
.chip{display:inline-flex; align-items:center; gap:6px; padding:2px 10px 2px 2px; border:1.5px solid var(--rule); border-radius:999px;
  background:var(--leaf); font-size:calc(15.5px * var(--tx)); line-height:1.1; white-space:nowrap; max-width:100%; min-width:0; vertical-align:middle}
.chip .pic{--s:26px}
.chip .chip-n{overflow:hidden; text-overflow:ellipsis}
.chip .chip-tag{font-size:calc(12px * var(--tx)); color:var(--ochre); font-variant-caps:all-small-caps; letter-spacing:.08em; font-weight:600}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--rubric)}
.chip.on{border-color:var(--rubric); box-shadow:0 0 0 2px var(--rubric)}
.chip.dim{opacity:.32}

/* A film card: picture, title, year, summary */
.fcard{display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:16px; row-gap:2px; align-items:center; align-content:center;
  padding:14px 16px; border:1.5px solid var(--rule); border-radius:14px; background:var(--bg); text-align:left}
.fcard .pic{grid-row:1 / span 2}
.fcard h3{font-size:calc(22px * (1 + (var(--tx) - 1) * 0.846)); line-height:1.15}
.fcard h3 .yr{color:var(--muted); font-weight:400; font-size:.8em; margin-left:6px}
.fcard .sum{font-size:calc(16.5px * var(--tx)); line-height:1.38}

/* The ratings table: customers in rows, films in columns, one badge per cell.
   .on and .dim work on rows (tr) and on cells (td); .rt-new is the newcomer below a gap; .q is a "?" cell. */
.rt{border-collapse:separate; border-spacing:6px 5px; margin:0 auto}
.rt th, .rt td{padding:0; text-align:center; vertical-align:middle}
.rt-film{font-weight:500; font-size:14.5px; line-height:1.15; padding:0 2px 2px}
.rt-film .pic{margin:0 auto 3px}
.rt-ft{display:block; max-width:8.5em; margin:0 auto; text-wrap:balance}
.rt.pic-heads .rt-ft{display:none}
.rt-who{text-align:left; white-space:nowrap; padding-right:6px; font-weight:500}
.rt-who .pic{display:inline-grid; vertical-align:middle; margin-right:7px}
.rt-n{vertical-align:middle}
.rt-c .vote{min-width:52px}
.rt-gap td{height:6px; border-bottom:1.5px dashed var(--rule)}
.rt-new .rt-who{color:var(--rubric)}
.rt tr, .rt td, .rt th{transition:opacity .25s ease}
.rt tr.dim, .rt td.dim, .rt th.dim{opacity:.3}
.rt td.on .vote, .rt tr.on td .vote{box-shadow:0 0 0 2.5px var(--rubric)}
.rt tr.on .rt-who{color:var(--rubric)}
.q{display:inline-grid; place-items:center; min-width:52px; height:32px; border:1.5px dashed var(--rubric); border-radius:9px;
  color:var(--rubric); font-weight:700; font-size:18px}
@media (prefers-reduced-motion: reduce){ .rt tr, .rt td, .rt th{transition:none} }

/* Section cards: a leaf of its own before acts 2, 3 and 4. The leaf turns violet with a wipe like a turning page,
   then the act's numeral, a kicker, the act's name, one line and a motif come in one after another. */
:root{--card:#58409A; --card-rule:#7A64BC; --card-ink:#FFFBF0; --card-soft:#D8CDF4}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--card:#2F2552; --card-rule:#4C3F7E; --card-ink:#EEE7D8; --card-soft:#B9A6F3} }
:root[data-theme="dark"]{--card:#2F2552; --card-rule:#4C3F7E; --card-ink:#EEE7D8; --card-soft:#B9A6F3}
.scene.intro{background:var(--card); border-color:var(--card-rule); color:var(--card-ink)}
.scene.intro.active{animation:card-wipe .7s cubic-bezier(.65,0,.35,1) both}
@keyframes card-wipe{from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)}}
.scene.intro .scene-head{display:none}
.act-card{display:grid; justify-items:center; text-align:center; gap:10px; padding:8px 0}
.act-no{font-size:clamp(64px, 15vh, 128px); line-height:1; color:var(--card-soft); font-variant-numeric:lining-nums}
.act-kicker{font-variant-caps:all-small-caps; letter-spacing:.24em; font-size:calc(19px * (1 + (var(--tx) - 1) * 0.962)); color:var(--card-soft)}
.act-title{font-style:italic; font-weight:500; font-size:clamp(42px, 9vh, 76px); line-height:1.04; text-wrap:balance}
.act-line{max-width:36ch; font-size:calc(22px * (1 + (var(--tx) - 1) * 0.846)); line-height:1.38; text-wrap:balance}
.act-motif{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px; margin-top:10px}
.act-motif .vote{min-width:66px; padding:9px 10px}
.act-motif .vote[data-r="0"]{background:var(--leaf)}
.act-motif .vote .mk{width:28px; height:28px}
.act-motif .vote .mk.tick2, .act-motif .vote .mk.cross2{width:35px}
.act-op{width:66px; height:66px; border-radius:50%; border:2px solid var(--card-soft); display:grid; place-items:center;
  font-size:40px; line-height:1; color:var(--card-ink)}
.act-motif .chip{background:var(--leaf); color:var(--ink); font-size:21px; padding:3px 16px 3px 3px; border-color:var(--card-soft)}
.act-motif .chip .pic{--s:36px}
.act-link{width:96px; border-top:3px dotted var(--card-soft)}
.act-q{width:44px; height:44px; border-radius:50%; border:2px dashed var(--card-soft); display:grid; place-items:center;
  font-size:24px; font-weight:700; color:var(--card-ink)}
.act-card.play > *{animation:act-in .7s cubic-bezier(.2,.7,.2,1) both}
.act-card.play .act-no{animation-name:act-no; animation-duration:.9s; animation-delay:.45s}
.act-card.play .act-kicker{animation-delay:.75s}
.act-card.play .act-title{animation-delay:.9s}
.act-card.play .act-line{animation-delay:1.2s}
.act-card.play .act-motif{animation:none}
.act-card.play .act-motif > *{animation:act-pop .5s cubic-bezier(.3,1.5,.5,1) both; animation-delay:calc(1.5s + var(--j) * .14s)}
@keyframes act-in{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
@keyframes act-no{from{opacity:0; transform:scale(.55) rotate(-10deg)} to{opacity:1; transform:none}}
@keyframes act-pop{from{opacity:0; transform:scale(.4)} to{opacity:1; transform:none}}
.pager button.intro{width:11px; height:11px; border-radius:2px; transform:rotate(45deg); background:var(--rule); border:none; margin:0 4px}
.pager button.intro[aria-current="step"]{background:var(--rubric)}
@media (prefers-reduced-motion: reduce){
  .scene.intro.active, .act-card.play > *, .act-card.play .act-motif > *{animation:none}
}

/* Short screens: a laptop browser or the projector at 720p */
@media (max-height: 760px){
  .scene{padding:12px 22px 14px}
  .scene-head .scene-no{font-size:calc(30px * (1 + (var(--tx) - 1) * 0.538))}
  .scene-head h2{font-size:calc(25px * (1 + (var(--tx) - 1) * 0.731))}
  .scene-inner{gap:10px; padding-top:8px}
  .fcard{padding:10px 14px}
  .fcard h3{font-size:calc(20px * (1 + (var(--tx) - 1) * 0.923))}
  .fcard .sum{font-size:calc(15.5px * var(--tx))}
  .bubble{font-size:calc(17px * var(--tx)); padding:7px 16px}
  .rt{border-spacing:6px 4px}
}
@media (max-width: 760px){
  .scene-head .actname{display:none}
  .scene-head .opt-tag{margin-left:auto; font-size:13px; padding:0 7px 1px}
}
@media (max-width: 560px){
  body{font-size:16.5px}
  .brand{font-size:17px}
  .topbar{gap:8px; padding-top:6px; padding-bottom:6px}
  .pager{gap:3px}
  .pager .act{gap:3px}
  .pager .act + .act{margin-left:2px; padding-left:5px}
  .pager button{width:11px; height:11px; font-size:0; border-width:1.5px}
  .brand .pre{display:none}
  .brand .part{display:none}
  .themebtn{width:28px; height:28px}
  .stage{padding:8px}
  .foot{padding-top:6px; padding-bottom:8px; gap:8px}
  .navbtn{min-width:84px; font-size:16px; padding:4px 14px 6px}
  .steps{gap:4px}
  .steps i{width:6px; height:6px}
  .scene{padding:10px 10px 12px}
  .scene-head{gap:10px}
  .scene-head .scene-no{font-size:24px}
  .scene-head h2{font-size:21px}
  .scene-inner{gap:10px; padding-top:8px}
  .say{font-size:14.5px}
  .bubble{font-size:15.5px; padding:7px 12px}
  .btn{font-size:15px; padding:3px 13px 5px}
  .vote{padding:3px 4px; min-width:36px}
  .vote .mk{width:17px; height:17px}
  .vote .mk.tick2, .vote .mk.cross2{width:21px}
  .vote .n{font-size:13.5px}
  .chip{font-size:13.5px; gap:4px; padding:2px 8px 2px 2px}
  .chip .pic{--s:22px}
  .fcard{column-gap:12px; padding:10px 12px}
  .fcard h3{font-size:18.5px}
  .fcard .sum{font-size:14.5px; line-height:1.34}
  .rt{border-spacing:3px 4px}
  .rt-film{font-size:12.5px}
  .rt-ft{display:none}
  .rt-who{padding-right:2px; font-size:15px}
  .rt-who .pic{margin-right:4px}
  .rt-c .vote, .q{min-width:40px}
  .q{height:28px}
  .act-card{gap:8px}
  .act-kicker{font-size:16px}
  .act-title{font-size:38px}
  .act-line{font-size:17px}
  .act-motif{gap:8px}
  .act-motif .vote{min-width:48px; padding:6px 6px}
  .act-motif .vote .mk{width:22px; height:22px}
  .act-motif .vote .mk.tick2, .act-motif .vote .mk.cross2{width:27px}
  .act-op{width:52px; height:52px; font-size:32px}
  .act-motif .chip{font-size:18px}
  .act-link{width:56px}
  .pager button.intro{width:8px; height:8px; margin:0 2px}
  /* Five sections do not fit 390 px as dots: the current section shows all of its dots, every other section
     folds to its first marker, and the pager clips rather than run under the theme button. */
  .pager{overflow:hidden; flex-shrink:0; max-width:calc(100vw - 112px)}
  .pager .act:not(.here) button:not(:first-child){display:none}
}

/* Matchmaker additions (main session): the optional section's skip button, word motifs on a section card,
   and the leaf "Your turn in Python" that closes sections 1 to 4. */
.act-op.act-word{width:auto; min-width:66px; padding:0 14px; border-radius:12px; font-style:italic; font-size:26px}
.act-motif .nt-n{min-width:52px; min-height:40px; background:var(--leaf)}
/* An unknown number on a section card: notation.css draws a slot violet on transparent, which vanishes on the
   violet card, so here it takes the card's own light colours (dashed, as everything unknown in the game). */
.act-motif .nt-n.nt-slot{background:transparent; border-color:var(--card-soft); color:var(--card-ink)}

<style>
/* The notation of Once Upon a Video Store, copied into Once Upon a Matchmaker (owned by the notation agent; see NOTATION.md).
   A number keeps the colour of its mark: the blue tint above 0, the orange tint below 0, grey for 0, and the
   stronger tint from 2 and from -2 on. A vector is a row. An inner product stacks two rows, film by film; a

     --nt-w  width of a number cell     --nt-h  its height       --nt-fs  its font size
     --nt-sx gap between columns        --nt-sy gap between rows --nt-xg  room for the × between the two rows

.nt-n[data-t="-1"]{background:var(--dislike-bg); border-color:var(--dislike); color:var(--dislike)}
.nt-n[data-t="-2"]{background:var(--dislike-bg2); border-color:var(--dislike); border-width:2px; color:var(--dislike)}
/* a slot: a number to work out */
.nt-n.nt-slot{border:2px dashed var(--rubric); background:transparent; color:var(--rubric)}

.nt-n.nt-hot, .vote.nt-hot{box-shadow:0 0 0 3px var(--rubric)}

/* 2. THE CONVERSION: the mark folds away like the flap of a station board and its number unfolds with a ring

.nt-n.nt-flip-in{position:relative; z-index:2}

.nt-tab, .nt-wrap{--nt-w:64px; --nt-h:48px; --nt-fs:28px; --nt-sx:24px; --nt-sy:6px; --nt-xg:24px; --nt-rg:12px; --nt-eqw:30px;

   under the losses, in the row of the total (the phone's rules below). */
.s2-x > .s2-xline{grid-area:note; position:relative; justify-self:stretch; align-self:stretch}
@media (min-width: 740px){ .s2-xline > .s2-wlb{position:absolute; left:0; top:0} }
@media (min-width: 1120px){ .s2-xline > .s2-wlb{left:50%; transform:translateX(-50%)} }
@media (min-width: 1120px){
  .mx-cross.mx-x-tb.s2-x:not(.s2-one):not(.s2-bd){grid-template-columns:repeat(5, auto); grid-template-areas:"f f nb nb nb" "c p r s avg" "note note plot plot upd"}
  .mx-cross.mx-x-tb.s2-x.s2-bd{grid-template-columns:repeat(5, auto); grid-template-areas:"f f nb nb nb" "c p r s avg" ". note note note ."}
  .mx-cross.mx-x-tb.s2-x.s2-wl{grid-template-areas:"f f nb nb nb" "c p r s avg" ". note note note ."}
  /* the corner of Your turn: its loss on the right of its rating */
  .mx-cross.mx-x-tb.s2-x.s2-one{grid-template-columns:repeat(5, auto); grid-template-areas:"f f nb nb nb" "c p r s avg" "note note . . ."}
  .s2-x.mx-x-tb > .mx-xs{justify-self:start; align-self:end; margin-top:0}
  .s2-x.mx-x-tb > .mx-xa{align-self:end}
  .s2-x:not(.s2-one) > .mx-xnote{min-height:var(--s2-r3, 155px)}
  .s2-bd .s2-note{max-width:none; justify-items:center}
}
.s2-x .mx{--nt-w:58px; --nt-h:34px; --nt-fs:19px}
/* every number cell keeps one width, so the run never shifts the picture */
.s2-x td.mx-c > .nt-n{width:var(--nt-w)}
.s2-x .mx-cap{font-size:16.5px}
.s2-x .s2-fwd > .mx-cap, .s2-fwdc{color:var(--g-fwd)}
.s2-x .mx-cap{white-space:nowrap}
.s2-off{visibility:hidden}
.s2-short{display:none}
.s2-rise{animation:s2-rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes s2-rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
/* a number in focus: the one changed (ochre), the three cells of the worked loss (violet) */
.s2-x td.mx-c.s2-tgt > .nt-n{box-shadow:0 0 0 3px var(--leaf), 0 0 0 6px var(--g-move); position:relative; z-index:3}
.s2-x td.mx-c.s2-moved > .nt-n{animation:s2-moved 1s ease-out}
@keyframes s2-moved{0%{box-shadow:0 0 0 3px var(--leaf), 0 0 0 11px color-mix(in srgb, var(--g-move) 70%, transparent)}
  100%{box-shadow:0 0 0 3px var(--leaf), 0 0 0 6px var(--g-move)}}
.s2-x td.mx-c.s2-ring > .nt-n{box-shadow:0 0 0 3px var(--leaf), 0 0 0 5.5px var(--g-fwd)}
.s2-x .mx-xarr{transition:opacity .35s ease}
.s2-x.s2-quiet .mx-xarr{opacity:.32}

/* BEFORE AND AFTER: one number's (above the ratings) and the average's (beside the losses) */
.s2-ba{display:grid; grid-template-columns:auto auto auto; align-items:end; column-gap:8px}
.s2-bx{display:grid; justify-items:center; gap:3px; position:relative}
.s2-bl{font-size:13.5px; font-variant-caps:all-small-caps; letter-spacing:.09em; font-weight:600; color:var(--muted); line-height:1}
.s2-x .nt-n.s2-bn{--nt-w:70px; --nt-h:40px; --nt-fs:21px; width:var(--nt-w)}
.s2-arw{display:grid; justify-items:center; gap:1px; padding-bottom:10px; line-height:1}
.s2-ah{font-size:22px; color:var(--g-fwd)}
.s2-plus{font-size:14px; font-weight:700; color:var(--g-move); min-height:1em}
.s2-nba .s2-ah{color:var(--g-move)}
.s2-tag{position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:5px; white-space:nowrap; font-size:15px;
  font-weight:700; color:var(--g-fwd)}
.s2-tag:empty{display:none}
.s2-tag[data-k="down"]::before{content:"↓ "}
.s2-tag[data-k="up"]::before{content:"↑ "}
.s2-avg{display:grid; justify-items:start; gap:3px}
.s2-avg .nt-n.s2-avgn{box-shadow:0 0 0 2px var(--leaf), 0 0 0 4.5px var(--g-fwd)}
.s2-avg:not(.s2-ba-on) .s2-bl, .s2-avg:not(.s2-ba-on) .s2-arw, .s2-avg:not(.s2-ba-aft) .s2-aft{visibility:hidden}
.s2-nb{display:grid; justify-items:start; gap:4px}
.s2-nb:not(.s2-nb-on){visibility:hidden}
.s2-nb:not(.s2-nb-aft) .s2-aft, .s2-nb:not(.s2-nb-aft) .s2-arw{visibility:hidden}
.s2-nbcap{display:flex; align-items:center; gap:6px; color:var(--g-move); font-weight:600}
.s2-nbcap .pic{--s:24px}
.s2-nba .nt-n.s2-bn{border-color:var(--g-move)}
.s2-nba .s2-bef .nt-n.s2-bn{box-shadow:0 0 0 2px var(--leaf), 0 0 0 4.5px var(--g-move)}
/* a number that rolls to its next value */
.s2-drum{position:relative; display:inline-grid; overflow:hidden; line-height:1.2; padding:0 1px}
.s2-dr{grid-area:1 / 1; text-align:center}

/* THE OVERLAY: the zoom from a number into its Before box, the flow from its After to the average's, the update */
.s2-ov{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:-1}
.s2-ov.s2-ovh{z-index:2}
/* the lines pass behind the tables: the board is a layer of its own, and a cell of 0 (no tint) gets the leaf's colour */
.s2-x{isolation:isolate}
:where(.s2-x td.mx-c) > .nt-n{background-color:var(--leaf)}
.s2-cone{fill:color-mix(in srgb, var(--g-move) 13%, transparent); stroke:color-mix(in srgb, var(--g-move) 60%, transparent);
  stroke-width:1.5; stroke-dasharray:5 4; stroke-linejoin:round}
.s2-flow{fill:none; stroke:var(--g-fwd); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; opacity:.85}
.s2-flowh{fill:var(--g-fwd); opacity:.9}
.s2-upd{fill:none; stroke:var(--g-move); stroke-width:3.2; stroke-linejoin:round; stroke-linecap:round}
.s2-updh{fill:var(--g-move)}
.s2-fly{position:absolute; left:0; top:0; width:0; height:0; overflow:visible; pointer-events:none; z-index:6}
.s2-ghost{position:absolute; margin:0; box-sizing:border-box; z-index:6; pointer-events:none; box-shadow:0 6px 16px rgba(42,36,50,.22)}

/* THE NOTE under the customers: the worked loss, the tools, the participant's keys */
.s2-note{display:grid; justify-items:start; align-content:start; gap:10px; max-width:31ch}
.s2-lf{display:flex; align-items:flex-end; gap:5px}
/* hidden, the worked loss keeps its room, so the board does not move when it comes */
.s2-lf[hidden]{display:flex; visibility:hidden}
.s2-lq{display:grid; justify-items:center; gap:3px}
.s2-lab{font-size:13px; font-variant-caps:all-small-caps; letter-spacing:.08em; font-weight:600; line-height:1}
.s2-ink .s2-lab{color:var(--ink)}
.s2-fw .s2-lab{color:var(--g-fwd)}
.s2-lcell .nt-n{--nt-w:46px; --nt-h:36px; --nt-fs:20px}
.s2-qs .nt-n{box-shadow:0 0 0 2px var(--leaf), 0 0 0 4px var(--g-fwd)}
.s2-op{font-size:23px; line-height:1; padding-bottom:7px; color:var(--ink)}
.s2-sq{margin-left:-2px}
.s2-tools{display:flex; flex-wrap:wrap; gap:8px}
.s2-tools:not(:has(button:not([hidden]))){display:none}
.s2-count{font-size:calc(17px * var(--tx)); font-weight:600; color:var(--g-move); min-height:1.3em; margin:0}
/* again: one row above the board, the counter, the lead in the middle, the buttons; the side columns keep their width,
   so the lead and the buttons stay in place while the counter changes */
.s2-head{display:grid; grid-template-columns:1fr minmax(0, 54ch) 1fr; align-items:center; column-gap:22px; width:100%}
.s2-head > .s2-count{justify-self:end; text-align:right; max-width:15em; line-height:1.3}
.s2-head > .s2-tools{justify-self:start; flex-wrap:nowrap}
/* again: the averages carry up to five decimals ("6.33557"), so their boxes are wider */
.s2-ag .s2-ava .nt-n.s2-bn{--nt-w:86px}
.s2-msg{font-size:calc(17px * var(--tx)); line-height:1.35; margin:0}
.s2-keys{display:flex; flex-wrap:wrap; gap:6px}
.s2-keys[hidden], .s2-ud[hidden]{display:none}
.s2-key{min-width:48px; font-size:19px; font-weight:600; padding:4px 10px 6px}
.s2-yt[data-phase="type"] .s2-mc td.mx-c, .s2-yt[data-phase="type"] .s2-mf td.mx-c{cursor:pointer}
.s2-yt .s2-note{max-width:33ch}

/* THE PLAN (2026-11-10, Carlos's twelfth message): a lit part of the board stands on a tinted panel (ochre, the numbers
   that change; violet, the forward pass), the other parts dim; one number gets two small arrows, up and down */
.s2-x .s2-m, .s2-x .s2-avg{transition:opacity .45s ease}
.s2-x.s2-hl .s2-m:not(.s2-lit), .s2-x.s2-hl .s2-avg:not(.s2-lit){opacity:.26}
.s2-x.s2-hl .mx-xarr{opacity:.26}
.s2-hlr{stroke-width:2}
.s2-hlr.s2-hm{fill:color-mix(in srgb, var(--g-move) 15%, transparent); stroke:color-mix(in srgb, var(--g-move) 70%, transparent)}
.s2-hlr.s2-hf{fill:color-mix(in srgb, var(--g-fwd) 11%, transparent); stroke:color-mix(in srgb, var(--g-fwd) 55%, transparent)}
.s2-udm{fill:var(--g-move)}

/* THE SLOPE IN A PICTURE (2026-11-10): One small change's step 6, under the ratings and the losses. The look of the
   optional game's close view (hopper.css): the curve violet, the triangle green, Before hollow, After filled. */
.s2-xplot{justify-self:start; align-self:start}
.s2-plot{position:relative; width:var(--s2-pw, 340px); height:var(--s2-ph, 150px)}
/* out of the picture before its step, keeping its room; a part of it before its step */
.s2-pout, .s2-pno{visibility:hidden}
.s2-psvg{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible}
.s2-pax{stroke:var(--ink); stroke-width:1.5; opacity:.75; fill:none}
.s2-pgd{stroke:var(--muted); stroke-width:1.2; stroke-dasharray:4 4}
.s2-ptk{fill:var(--muted); font-family:var(--serif); font-size:15px; font-variant-numeric:lining-nums tabular-nums}
.s2-ptx{text-anchor:middle}
.s2-pty{text-anchor:end}
.s2-pti{fill:var(--ink); font-family:var(--serif); font-style:italic; font-size:16px}
.s2-ptiy{fill:var(--g-fwd); font-weight:600}
.s2-pcv{fill:none; stroke:var(--g-fwd); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.s2-ptr line{stroke:var(--g-slope); stroke-width:2.6; stroke-linecap:round}
.s2-ptr .s2-phyp{stroke-width:3.2}
.s2-ptf{fill:var(--g-slope); opacity:.13}
.s2-ppt{stroke:var(--g-fwd); stroke-width:2.4; fill:var(--g-fwd)}
.s2-ppt.s2-pold{fill:var(--leaf)}
.s2-plab{position:absolute; white-space:nowrap; color:var(--g-slope); font-weight:700; font-size:16px; line-height:1;
  font-variant-numeric:lining-nums tabular-nums}
.s2-plab .s2-nab-g{width:.78em; height:.7em}
.s2-plab-g{font-size:18px}
/* THE LINKS (2026-11-11, Carlos's sixteenth message): green, the colour of the triangle, from the +0.01 of the number
   and the change of the total to the legs they give; the two numbers lit while they are linked */
.s2-lk{fill:none; stroke:var(--g-slope); stroke-width:2.4; stroke-linecap:round; opacity:.9}
.s2-lkh{fill:var(--g-slope)}
.s2-ava .s2-plus{color:var(--g-fwd); white-space:nowrap}
.s2-plus.s2-hot{color:var(--g-slope); background:color-mix(in srgb, var(--g-slope) 15%, transparent); border-radius:6px;
  padding:1px 5px 2px; margin-bottom:-3px; box-shadow:0 0 0 1.5px color-mix(in srgb, var(--g-slope) 55%, transparent)}
/* Screens from 740 to 1119 px keep the textbook layout, the losses under the predictions and the ratings: from its step
   on the picture stands in the place of the losses, beside the total, and the update in the note, under the customers
   (a row of their own ran below the leaf at 1024 x 768). The board scene's real line is narrower there. */
@media (max-width: 1119px){
  .s2-x > .s2-xplot{grid-area:s; justify-self:center}
  .s2-x > .s2-xupd{grid-area:note; justify-self:start; align-self:start}
  .s2-x:has(.s2-plot:not(.s2-pout)) > .mx-xs, .s2-x:has(.s2-plot:not(.s2-pout)) .s2-ms{visibility:hidden}
  .s2-x{--s2-rh:58px; --s2-rw:320px}
  .s2-rlq .nt-n{--nt-w:42px; --nt-h:27px; --nt-fs:17px}
  .s2-lcell .nt-n{--nt-h:30px; --nt-fs:17px; --nt-w:40px}
  .s2-rld{font-size:21px}
  .s2-wlb{gap:3px}
}
/* Screens from 740 to 979 px (an iPad upright, a narrow window; 2026-11-10): the four columns of the textbook layout
   need 843 px of leaf (875 in Again and again) and ran past the leaf's left edge, so the average stands under the
   losses, as on a phone, and three columns need 631. The picture, on its step, takes the place of the losses and the
   average, centred under the predictions and the ratings; the fraction, wider than the customers, leaves that step
   to it, as on a phone */
@media (min-width: 740px) and (max-width: 979px){
  .mx-cross.mx-x-tb.s2-x, .mx-cross.mx-x-tb.s2-x:not(.s2-one):not(.s2-bd){grid-template-columns:repeat(3, auto);
    grid-template-areas:"f f nb" "c p r" "note s s" "note avg avg"}
  .s2-x.mx-x-tb > .mx-xa{justify-self:center}
}

/* The projector at 720p */
@media (max-height: 760px){
  .s2-sc{gap:6px}
  .s2-lead{font-size:calc(18.5px * (1 + (var(--tx) - 1) * 0.981)); min-height:2.6em}
  .s2-x{--mx-xrg:8px}
  .s2-x{--mx-xjoin:14px}
  .s2-x .mx{--nt-w:54px; --nt-h:27px; --nt-fs:17px; --mx-py:1.5px}
  .s2-x .mx td.mx-c{line-height:1}
  /* the losses keep only their numbers: their rows and columns are the ratings' */
  .s2-x .s2-ms thead{display:none}
  .s2-x .mx-cap{font-size:15px}
  .s2-x .mx-ch .pic{--s:24px}
  .s2-x .nt-n.s2-bn{--nt-h:34px; --nt-fs:19px; --nt-w:64px}
  .s2-lcell .nt-n{--nt-h:31px; --nt-fs:18px; --nt-w:44px}
  .s2-msg, .s2-count{font-size:calc(16px * var(--tx))}
  .s2-ag .s2-ava .nt-n.s2-bn{--nt-w:78px}
  .s2-x{--s2-r3:125px; --s2-ph:125px; --s2-rh:58px}
  .s2-ptk{font-size:14px}
  .s2-pti{font-size:15px}
  .s2-plab{font-size:15px}
  .s2-plab-g{font-size:16.5px}
}
/* Phones, and screens up to 739 px (since 2026-11-10; the three columns of the desk need 631 px and Again and again's
   fraction 378 more beside the losses): the note on top, three columns, the average under the losses */
@media (max-width: 739px){
  .mx-cross.mx-x-tb.s2-x, .mx-cross.mx-x-tb.s2-x:not(.s2-one):not(.s2-bd){grid-template-columns:repeat(3, auto);
    grid-template-areas:"note note note" "f f nb" "c p r" ". s s" ". avg avg"}
  .s2-x.mx-x-tb > .mx-xa{justify-self:center}
  .s2-lead{font-size:16px; min-height:0}
  .s2-x{--mx-xcg:12px; --mx-xrg:8px}
  .s2-x .mx{--nt-w:43px; --nt-h:24px; --nt-fs:14px; --mx-bw:4px; --mx-px:1px}
  .s2-x .s2-ms thead{display:none}
  .s2-avg:not(.s2-ba-on) .s2-bl{display:none}
  .s2-x .mx-cap{font-size:13px}
  .s2-long{display:none}
  .s2-short{display:inline}
  .s2-x .mx-ch .pic, .s2-x .mx-rh .pic{--s:20px}
  /* no row heads on the predictions, ratings and losses: the header's corner goes too, or the column heads
     shift one column left */
  .s2-x .s2-mp .mx-rh, .s2-x .s2-mr .mx-rh, .s2-x .s2-ms .mx-rh,
  .s2-x .s2-mp .mx-corner, .s2-x .s2-mr .mx-corner, .s2-x .s2-ms .mx-corner{display:none}
  .s2-x .nt-n.s2-bn{--nt-w:52px; --nt-h:30px; --nt-fs:15.5px}
  .s2-bl{font-size:12px}
  /* one number's Before and After stands above the ratings, one column wide: Before, the arrow down, After */
  .s2-nba{grid-template-columns:auto; justify-items:center; row-gap:1px}
  .s2-nba .s2-bl{display:none}
  .s2-nba .s2-arw{grid-auto-flow:column; align-items:center; column-gap:3px; padding-bottom:0}
  .s2-nba .s2-ah{display:inline-block; transform:rotate(90deg); font-size:18px}
  .s2-nba .s2-plus{font-size:12px}
  .s2-nbn{display:none}
  .s2-nb{justify-items:center}
  .s2-note{max-width:none; justify-items:center; text-align:center}
  .s2-lcell .nt-n{--nt-w:38px; --nt-h:28px; --nt-fs:15px}
  .s2-msg, .s2-count{font-size:15px}
  .s2-key{min-width:42px; font-size:17px}
  /* again: the counter without its words, the buttons and the counter under the lead */
  .s2-head{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 12px}
  .s2-head > .s2-lead{flex-basis:100%; order:0}
  .s2-head > .s2-tools{order:1}
  .s2-head > .s2-count{order:2; min-height:0; min-width:5em; justify-self:auto; text-align:left}
  .s2-ag .s2-cx{display:none}
  .s2-ag[data-ph="calc"] .s2-tag{display:none}
  .s2-ag .s2-ava .nt-n.s2-bn{--nt-w:64px}
}

/* THE UPDATE (2026-11-06, Carlos's eighth message; since 2026-11-11, his sixteenth, on the right of the picture under the
   total, in three lines): w = w - α∇, then the same with numbers, then the new number, whose ochre ring starts the
   update arrow. In Again and again its numbers carry up to six decimals: on a wide screen the block stands out of the
   grid's flow, at the left of its place, so a longer number widens no column and the board keeps its place. */
.s2-xupd{justify-self:start; align-self:start; position:relative}
.s2-upf{display:grid; grid-template-columns:auto auto; column-gap:6px; row-gap:9px; align-items:center; justify-items:start;
  width:max-content}
.s2-ag .s2-upf{position:absolute; left:0; top:0}
.s2-ag .s2-xupd{width:var(--s2-uw, 210px); height:var(--s2-uh, 120px)}
.s2-fq{display:flex; align-items:center; gap:4px}
.s2-sym{font-size:22px; font-style:italic; line-height:1; color:var(--ink); padding:0 1px}
.s2-al, .s2-gk{color:var(--g-move)}
/* ∇ drawn (EB Garamond has none): cap height, a serif nabla's strokes; the text ∇ beside it is for screen readers */
.s2-nab-g{display:inline-block; position:relative; width:.72em; height:.66em; vertical-align:-.01em; margin:0 .05em}
.s2-nab-g svg{display:block; width:100%; height:100%; fill:currentColor; overflow:visible}
.s2-sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.s2-var{font-style:italic}
.s2-symg{font-style:normal; margin-right:3px}
.s2-gk{font-size:19px; font-weight:600; line-height:1}
.s2-gop{font-size:19px; line-height:1; color:var(--ink)}
.s2-upf .nt-n.s2-gn{--nt-w:40px; --nt-h:30px; --nt-fs:17px; padding:0 .22em}
.s2-upf .nt-n.s2-w1{box-shadow:0 0 0 2px var(--leaf), 0 0 0 4.5px var(--g-move)}
@media (max-height: 760px){
  .s2-upf{row-gap:6px}
  .s2-upf .nt-n.s2-gn{--nt-w:38px; --nt-h:27px; --nt-fs:16px}
  .s2-fq{gap:3px}
  .s2-ag .s2-xupd{--s2-uh:105px}
}
@media (max-width: 739px){
  /* the picture, from its step on, in the row of the losses, across the board; the update in the same place, in the
     picture's stead, once it is written (One small change) and while a move is updated (Again and again). Room for it
     above the board ran the board past the foot of a 390 x 700 phone (2026-11-11). */
  .s2-x > .s2-xplot, .s2-x > .s2-xupd{grid-row:4; grid-column:1 / -1; justify-self:center; align-self:center}
  .s2-upon .s2-x > .s2-xplot, .s2-ag:not(.s2-upon) .s2-x > .s2-xupd{visibility:hidden}
  /* the board scene's real line under the losses, in the row of the total, which comes after the worked losses */
  .s2-x.s2-wl > .s2-xline{grid-row:5; grid-column:1 / -1; justify-self:center; align-self:start}
  .s2-x.s2-wl > .mx-xa{align-self:start}
  .s2-x:has(.s2-plot:not(.s2-pout)) > .mx-xs, .s2-x:has(.s2-plot:not(.s2-pout)) .s2-ms{visibility:hidden}
  .s2-ag .s2-upf{position:static}

<style>

<style>
/* MF.L, the table view of section 4 (loss.js). Owned by S4-A (BRIEF-s4.md, LOSS.md). Classes start with lv-.
   Since 2026-11-06 the parts stand in part two's textbook cross (M.cross, layout "textbook", MATRIX.md): the films'
   matrix turned above the predictions, the customers on their left, the ratings on the right of the predictions, the
   losses under those two, the total loss in its double violet ring on the right of the losses; the desk and the
   words beside or under it. One prediction as part one shows a score: the customer's row and the film's column
   outlined (an SVG over the cross), its worked line on the desk. Captions: the model in ink, the forward pass in
   violet (--g-fwd); the update in ochre (--g-move). */
.lv{position:relative; display:grid; justify-items:center; gap:8px; width:100%; min-width:0}

.lv:not([data-desk]):not(.lv-keep) > .lv-side:has(> .lv-note:empty){display:none}

  .lv-sided > .mx-prod{grid-column:1}

}

  .lv.lv-sided-short{grid-template-columns:max-content minmax(0, 430px); justify-content:center; align-items:center; column-gap:30px}

.lv-dec.lv-md .lv-guesses .mx, .lv-dec.lv-md .lv-predictions, .lv-dec.lv-md .lv-ratings, .lv-dec.lv-md .lv-losses{--nt-w:70px; --nt-fs:22px}

   its number cell), and under the heads for the first row; the predictions and the ratings beside the customers take
   the same room, so their rows stay level with the customers' rows */

.s5-x.mx-x-tb > .mx-xf, .s5-x.mx-x-tb > .mx-xnb{margin-bottom:calc(23px - var(--mx-xrg, 8px))}
/* the turned map's caption on its left, level with its first row, in the corner above the users' numbers (part two
   puts the turned films' caption on its left too) */
.s5-x .s5-map.s5-tr{position:relative}
.s5-x .s5-tr > .s5-mcap{position:absolute; right:calc(100% + 10px); top:2px}
/* a tapped square's line: on a desk screen a small label over the square (sec5.js, float()), pointing at it; on a phone
   a line under the board. In scene real the source line stands under the table of the first two steps. */
@media (min-width: 561px){
  .s5-real, .s5-larger{position:relative}
  .s5 > .s5-read{position:absolute; left:0; top:0; z-index:8; width:max-content; max-width:min(54ch, 100%); min-height:0; margin:0;
    padding:5px 12px 6px; text-align:left; background:var(--leaf); border:1.5px solid var(--rule); border-radius:10px;
    box-shadow:0 8px 22px rgba(42,36,50,.18); pointer-events:none}
  .s5 > .s5-read:empty{display:none}
  /* the pointer: a turned square whose outer half shows under the label (over it with .s5-below) */
  .s5 > .s5-read::after{content:""; position:absolute; left:var(--px, 50%); bottom:-7.5px; width:12px; height:12px;
    background:var(--leaf); border-right:1.5px solid var(--rule); border-bottom:1.5px solid var(--rule);
    transform:translateX(-50%) rotate(45deg)}
  .s5 > .s5-read.s5-below::after{bottom:auto; top:-7.5px; border:0; border-left:1.5px solid var(--rule);
    border-top:1.5px solid var(--rule)}
}
.s5-src[hidden]{display:none}
/* block-level maps: an inline map would sit on a line box and add the space under its baseline */
.s5-x .s5-map{display:grid}
.s5-x .s5-mh{display:none}
.s5-x.s5-solo{grid-template-columns:auto; grid-template-areas:"r"}
.s5-x.s5-solo > .mx-xslot:not(.mx-xr){display:none}
.s5-x.s5-solo .s5-mh{display:grid}
.s5-later{visibility:hidden}
.s5-x .s5-ring{padding:3px}
.s5-x .nt-n.s5-big{--nt-w:84px; --nt-h:44px; --nt-fs:26px; box-shadow:0 0 0 2.5px var(--leaf), 0 0 0 4.5px var(--g-fwd)}
.s5-real .s5-x .s5-map{--sq:14px}
.s5-real .s5-strip{--s5-ch:80px}
.s5-larger .s5-x .s5-map{--sq:5px}
.s5-larger .s5-strip{--s5-ch:76px}
.s5-larger .s5-x.s5-solo .s5-map{--sq:12px}
.s5-larger .s5-x:not(.s5-solo) .s5-mg i{border-radius:1px}
/* scene larger's board, three ratings hidden (2026-11-11): its squares are too small for the "?", so a hidden rating
   is a violet square ringed in violet; the hidden ratings' predictions ringed a little thinner */
.s5-larger .s5-x:not(.s5-solo) .s5-mg i[data-c="q"]{background:var(--rubric); box-shadow:0 0 0 1px var(--leaf), 0 0 0 3px var(--rubric);
  position:relative; z-index:1}
.s5-larger .s5-x:not(.s5-solo) .s5-mg i[data-c="q"]::after{content:none}
.s5-larger .s5-x:not(.s5-solo) .s5-mg i.s5-hid{box-shadow:0 0 0 1px var(--leaf), 0 0 0 3px var(--g-move)}

/* the last step of scenes real and larger: each hidden rating beside its prediction, one card per rating; the
   prediction ringed in ochre as on the board. The cards of a row are as tall as the tallest, and the room a shorter
   head leaves goes to its own row (1fr), so the predictions and the ratings stand level across the cards when a film's
   name takes two lines (The Silence of the Lambs, scene larger) */
.s5-reveal{display:flex; flex-wrap:wrap; justify-content:center; align-items:stretch; gap:18px; width:100%; margin-top:10px}
.s5-reveal[hidden]{display:none}
.s5-rcard{display:grid; grid-template-rows:1fr auto auto; justify-items:center; gap:12px; width:236px; padding:14px 12px 12px;
  border:1.5px solid var(--rule); border-radius:14px; background:var(--bg)}
.s5-rhead{display:flex; align-items:center; gap:10px; align-self:center}
.s5-rwho p{margin:0; text-align:left}
.s5-rfilm{font-size:calc(19px * (1 + (var(--tx) - 1) * 0.962)); font-weight:600; line-height:1.15; color:var(--ink)}
.s5-ruser{font-size:calc(16px * var(--tx)); line-height:1.2; color:var(--muted)}
.s5-rcard .pic.s5-tile{--s:46px}
.s5-rpair{display:flex; justify-content:center; align-items:flex-start; gap:20px}
.s5-rp, .s5-rv{display:grid; justify-items:center; gap:5px}
.s5-rp .s5-cl{color:var(--g-fwd)}
.s5 .s5-rcard .nt-n.s5-in{--nt-w:68px; --nt-h:44px; --nt-fs:26px; margin:0; vertical-align:middle}
.s5 .s5-rp .nt-n.s5-in{box-shadow:0 0 0 2.5px var(--leaf), 0 0 0 5px var(--g-move)}
.s5-rs{font-size:calc(14px * var(--tx)); color:var(--muted)}
.s5-rmiss{margin:0; font-size:calc(17px * var(--tx)); color:var(--muted)}
.s5 .s5-rmiss .nt-n.s5-in{--nt-w:40px; --nt-h:28px; --nt-fs:17px; margin-left:.2em}
.s5-rcard.s5-pop, .s5 .s5-rcard .nt-n.s5-pop{animation:s5-pop .5s cubic-bezier(.3,.75,.3,1.25) both}

/* scene end: the method as four cards, the dataset's lines */
.s5-chain{display:flex; flex-wrap:nowrap; align-items:center; justify-content:center; gap:10px}
.s5-card{display:grid; justify-items:center; align-content:start; gap:8px; width:190px; padding:12px 10px 10px; border:1.5px solid var(--rule);
  border-radius:14px; background:var(--bg); text-align:center}
.s5-card p{margin:0; font-size:calc(18px * var(--tx)); line-height:1.2; text-wrap:balance}
.s5-card .s5-cardpic{display:flex; gap:6px; align-items:flex-start; justify-content:center; min-height:110px}
.s5-card .s5-map{--sq:4px; --gap:0px}
.s5-card .s5-mg{padding:2px; position:relative}
.s5-rowbox{position:absolute; left:-1px; right:-1px; top:0; height:calc(var(--sq) + 4px); border:2px solid var(--rubric); border-radius:3px;
  pointer-events:none}
/* the first film's column of the turned films' map (the films' embeddings are columns) */
.s5-colbox{position:absolute; top:-1px; bottom:-1px; left:0; width:calc(var(--sq) + 4px); border:2px solid var(--rubric); border-radius:3px;
  pointer-events:none}
.s5-card .s5-curve{width:150px; height:96px}
.s5-card .s5-ct text{font-size:11px}
.s5-card .s5-cti{font-size:11.5px}
.s5-arrow{font-size:28px; color:var(--rubric); flex:none}
.s5-lic{display:grid; gap:2px; max-width:110ch; margin-top:4px; padding-top:6px; border-top:1px solid var(--rule)}
.s5-lic p{font-size:calc(12.5px * var(--tx)); line-height:1.3; color:var(--muted); text-align:center; margin:0}

/* Short screens: the projector at 720p */
@media (max-height: 760px){
  .s5{gap:6px}
  .s5-lead{font-size:calc(21px * (1 + (var(--tx) - 1) * 0.885)); max-width:76ch}
  .s5-say{font-size:calc(17.5px * var(--tx)); max-width:96ch}
  .s5-words .s5-lead{max-width:92ch}
  .s5-words .s5-say{max-width:118ch}
  .s5-end > .s5-say{max-width:118ch}

  .s5-read{font-size:calc(15px * var(--tx))}
  .s5 .nt-n.s5-in{--nt-w:32px; --nt-h:24px; --nt-fs:16.5px}
  .s5-strip{gap:4px 12px; width:300px}
  .s5 .mx.s5-mx{--nt-w:36px; --nt-h:22px; --nt-fs:14.5px; --mx-py:1px; --mx-px:1px}
  .s5 .mx.s5-mx .mx-cap{font-size:14px}
  .s5 .pic.s5-tile{--s:21px}
  .s5-ft{font-size:10.5px}
  .s5-cn{font-size:24px}
  .s5-ring{padding:3px}
  .s5 .nt-n.s5-big{--nt-w:92px; --nt-h:42px; --nt-fs:27px}
  .s5-curve{height:66px}
  .s5-reveal{gap:14px; margin-top:6px}
  .s5-rcard{width:216px; gap:9px; padding:11px 10px 10px}
  .s5-rfilm{font-size:calc(17.5px * var(--tx))}
  .s5-ruser{font-size:calc(15px * var(--tx))}
  .s5-rcard .pic.s5-tile{--s:40px}
  .s5 .s5-rcard .nt-n.s5-in{--nt-w:60px; --nt-h:38px; --nt-fs:23px}
  .s5 .s5-rmiss .nt-n.s5-in{--nt-w:36px; --nt-h:25px; --nt-fs:15.5px}
  .s5-rmiss{font-size:calc(15.5px * var(--tx))}
  .s5-read .nt-n.s5-in{--nt-w:26px; --nt-h:19px; --nt-fs:13.5px}
  .s5-runrow{gap:2px 12px; width:270px}
  .s5-runrow > .s5-curve{height:46px}
  .s5-x{--mx-xcg:20px; --mx-xrg:6px}
  .s5-x .s5-mcap{font-size:13.5px}
  .s5-x .nt-n.s5-big{--nt-w:72px; --nt-h:36px; --nt-fs:22px}
  .s5-real .s5-x .s5-map{--sq:9px}
  .s5-real .s5-strip{--s5-ch:64px}
  .s5-larger .s5-x{--mx-xrg:4px; --mx-xjoin:12px}
  .s5-larger .s5-x .s5-map{--sq:3px; gap:1px}
  .s5-larger .s5-strip{--s5-ch:64px}
  .s5-larger .s5-x .s5-mcap{line-height:1}
  .s5-larger .s5-x .s5-mg{padding:1px}
  .s5-larger .s5-x.s5-solo .s5-map{--sq:9px}
  .s5-larger .s5-x.s5-solo .s5-mg{padding:3px}
  .s5-pop .g-fnote{font-size:calc(16px * var(--tx))}
  .s5-card{width:178px; padding:10px 8px 8px}
  .s5-card p{font-size:calc(16.5px * var(--tx))}
  .s5-card .s5-cardpic{min-height:96px}
  .s5-card .s5-map{--sq:3.5px}
  .s5-card .s5-curve{height:84px}
  .s5-lic p{font-size:calc(12px * var(--tx))}
}
/* 720p on a desk only (the phone frame also matches max-height 760px): the recap's board (MF.L.view, agent c's
   loss.css) pinned here, its cells, the films' pictures, the gaps of its cross, so that it fits under the words; its
   curve in the board's corner as tall as the films' numbers beside it allow, so the board does not grow */
@media (min-width: 561px) and (max-height: 760px){
  .s5-recap .lv-cross{--mx-xrg:4px; --mx-xjoin:14px}
  .s5-recap .lv-cross .mx-sm{--nt-h:26px; --mx-py:1.5px}
  /* a row as tall as its cell: no line box of the td's font (the cell sets its own line height) */
  .s5-recap .lv-cross td.mx-c{line-height:0}
  .s5-recap .lv-cross .mx-ch .pic{--s:24px}
  .s5-recap .s5-runrow > .s5-curve{height:52px}
}
/* Phones */
@media (max-width: 560px){
  .s5{gap:6px}
  .s5-lead{font-size:18px}
  .s5-say{font-size:15.5px}
  .s5-aside{font-size:14px}
  .s5-src{font-size:12px}
  .s5-read{font-size:13.5px}
  .s5 .nt-n.s5-in{--nt-w:28px; --nt-h:23px; --nt-fs:14.5px; padding:0 4px}
  .s5-read .nt-n.s5-in{--nt-w:26px; --nt-h:20px; --nt-fs:13px}
  .s5 .mx.s5-mx{--nt-w:25px; --nt-h:21px; --nt-fs:11.5px; --mx-py:1px; --mx-px:0px; --mx-bw:5px}
  .s5 .mx.s5-mx .mx-c > .nt-n{border-radius:5px; padding:0 1px; border-width:1px}
  .s5 .mx.s5-mx .mx-t th.mx-rh, .s5 .mx.s5-mx .mx-corner{display:none}
  .s5 .pic.s5-tile{--s:20px; border-radius:22%}
  .s5-titles .s5-ft{display:none}
  .s5-map{--sq:12px}
  .s5-mcap{font-size:13px}
  .s5-strip{grid-template-columns:auto minmax(0, 1fr) auto; grid-template-areas:"count curve ctl"; gap:2px 10px; width:100%}
  .s5-strip > .s5-count, .s5-strip > .s5-ctl{align-self:center}
  .s5-strip > .s5-curve{height:58px}
  .s5-x .s5-count, .s5-runrow .s5-count{display:grid; justify-items:center; gap:0}
  .s5-cl{font-size:13px}
  .s5-cn{font-size:21px}
  .s5 .nt-n.s5-big{--nt-w:74px; --nt-h:38px; --nt-fs:22px; box-shadow:0 0 0 2px var(--leaf), 0 0 0 4px var(--g-fwd)}
  .s5.s5-xon{row-gap:6px}
  .s5-x{--mx-xcg:12px; --mx-xrg:6px}
  /* the average on the right of the losses, as on a desk: the maps leave room for it; the run in a row under the board */
  .s5-x.mx-x-tb:not(.s5-solo){grid-template-columns:repeat(4, auto); grid-template-areas:"f f . ." "c p r ." ". s s avg" "nb nb nb nb"}
  .s5-recap .lv-many .lv-cross.mx-x-tb{grid-template-areas:"f f ." "c p r" ". s s" ". avg avg" "nb nb nb"}
  .s5-x > .mx-xnb, .s5-recap .lv-cross > .mx-xnb{justify-self:stretch; align-self:start}
  .s5-x.mx-x-tb > .mx-xnb{margin-bottom:0}
  /* the source line gives way to a tapped number's line: one line under the table */
  .s5-real:not(.s5-xon) > .s5-read:empty{display:none}
  .s5-src:has(~ .s5-read:not(:empty)){display:none}
  .s5-x .s5-ringw .s5-cl{white-space:normal; max-width:4.6em; text-align:center; line-height:1}
  .s5-x .s5-mcap{font-size:12px; letter-spacing:.04em}
  .s5-x .s5-ringw .s5-cl{font-size:11.5px}
  .s5-x .nt-n.s5-big{--nt-w:56px; --nt-h:30px; --nt-fs:17px; box-shadow:0 0 0 2px var(--leaf), 0 0 0 3.5px var(--g-fwd)}
  .s5-real .s5-x .s5-map{--sq:6px}
  .s5-larger .s5-x .s5-map{--sq:4px; --gap:0px}   /* 3 px until 2026-11-11: two numbers per row left the room */
  .s5-larger .s5-x .s5-mg i, .s5-larger .s5-x:not(.s5-solo) .s5-mg i{border-radius:0}
  .s5-larger .s5-x.s5-solo .s5-map{--sq:9px; --gap:1px}
  .s5-larger .s5-x.s5-solo .s5-mg i{border-radius:1px}
  .s5-larger .s5-x.s5-solo .s5-mh{display:none}
  /* scene real: the hidden ratings' "?" too small to read on the phone's squares (the violet frame stays); a thinner
     ring on the predictions; the cards one under another, each in a row */
  .s5-real .s5-x .s5-mg i[data-c="q"]::after{content:none}
  .s5-real .s5-x .s5-mg i.s5-hid{box-shadow:0 0 0 1px var(--leaf), 0 0 0 2.5px var(--g-move)}
  .s5-reveal{flex-direction:column; align-items:center; gap:8px; margin-top:4px}
  .s5-rcard{width:100%; max-width:360px; grid-template-columns:auto 1fr; grid-template-rows:auto auto; grid-template-areas:"head head" "pair miss";
    align-items:center; gap:6px 10px; padding:8px 10px}
  .s5-rhead{grid-area:head}
  .s5-rpair{grid-area:pair; gap:12px}
  .s5-rmiss{grid-area:miss; font-size:13.5px; text-align:right}
  .s5-rfilm{font-size:15.5px}
  .s5-ruser{font-size:13px}
  .s5-rcard .pic.s5-tile{--s:30px}
  .s5 .s5-rcard .nt-n.s5-in{--nt-w:46px; --nt-h:30px; --nt-fs:18px}
  .s5 .s5-rp .nt-n.s5-in{box-shadow:0 0 0 2px var(--leaf), 0 0 0 4px var(--g-move)}
  .s5 .s5-rmiss .nt-n.s5-in{--nt-w:32px; --nt-h:22px; --nt-fs:13.5px}
  .s5-rs{font-size:12px}
  /* the recap's ringed prediction keeps its ochre (loss.css turns every ring violet on a phone) */
  .s5-recap .lv .mx td.lv-mark-b > .nt-n{box-shadow:0 0 0 2px var(--leaf), 0 0 0 4px var(--g-move)}
  .s5-runrow{grid-template-columns:auto minmax(0, 1fr) auto; grid-template-areas:"count curve ctl"; gap:2px 10px; width:100%}
  .s5-runrow > .s5-curve{height:48px}
  .s5-runrow .s5-cn{font-size:19px}
  .s5-larger .s5-x:not(.s5-solo) .s5-mg i.s5-hid{box-shadow:0 0 0 1px var(--leaf), 0 0 0 2.5px var(--g-move)}
  .s5-larger .s5-x:not(.s5-solo) .s5-mg i[data-c="q"]{box-shadow:0 0 0 1px var(--leaf), 0 0 0 2.5px var(--rubric)}
  .s5-mcap .s5-long{display:none}
  .s5-pop .g-fnote{font-size:13px; max-width:none}
  .s5-chain{display:grid; grid-template-columns:1fr auto 1fr; gap:6px; width:100%}
  .s5-chain .s5-arrow:nth-child(4){display:none}
  .s5-card{width:auto; padding:8px 6px 6px; gap:4px}
  .s5-card p{font-size:14px}
  .s5-card .s5-cardpic{min-height:72px}
  .s5-card .s5-map{--sq:2.5px}
  .s5-card .s5-curve{width:120px; height:66px}
  .s5-arrow{font-size:20px}
  .s5-key{font-size:13px; gap:3px 8px}
  .s5-lic p{font-size:10px; line-height:1.2}
}
@media (prefers-reduced-motion: reduce){
  .s5 .mx-c > .nt-n.s5-pop, .s5-rcard.s5-pop, .s5 .s5-rcard .nt-n.s5-pop{animation:none}
}

/* Text scale (core.css): on the large screens the words of three scenes grow less, so that their boards fit on an
   11-inch iPad: The whole method by 1.35, Real ratings by 1.3, A larger table by 1.2 */
@media (min-width: 1080px) and (min-height: 740px){
  .scene[data-key="recap"]{--tx:1.35}
  .scene[data-key="real"]{--tx:1.3}
  .scene[data-key="larger"]{--tx:1.2}
}
</style>

<svg class="sprite" aria-hidden="true" focusable="false">

</div>

<script>
/* Once Upon a Matchmaker: the shared base, owned by the main session.
   The scene engine (copied from Once Upon a Video Store), the data and the helpers that every section uses.
   Each agent's scenes live in their own file (sec1.js, ...) and register with MF.define; dev.html then calls
   MF.start(). The engine adds a section card before sections 1 to 5 and a leaf "Your turn in Python" at the
   end of sections 1 to 4 (PYTHON below), so agents never build those. Section 0 is the preface of part one
   (sec0.js, since 2026-11-10): the cover and matrix factorization at a glance, with no card and no Python leaf.

   A scene:
     MF.define("key", {

  // Put a bottom row into the rig: its name, its numbers, the products and the sum (still hidden).
  function loadRig(rig, a, spec, slots) {
    rig.prods = a.map(function (x, j) { return x * spec.values[j]; });
    rig.total = rig.prods.reduce(function (s, x) { return s + x; }, 0);
    whoFill(rig.W.who, spec);
    rig.W.bh.forEach(function (h, j) { h.textContent = ""; h.appendChild(cell(spec.values[j])); });
    rig.pcell = rig.prods.map(function (x) { return cell(x, { cls: "nt-prod" }); });

    rig.W.ph.forEach(function (h, j) { h.textContent = ""; h.appendChild(rig.slots[j] || rig.pcell[j]); });

  function beatProduct(rig, j, R, pace) {

    var slotted = !!rig.slots[j];

      [0, function () { show(rig.W.x[j], true); flash(rig.W.x[j], "signin", 400 * pace); hotCol(rig, j, true); }],
      [t1, function () {

        fly(rig.layer, botNum(rig, j), rig.W.ph[j], T.flow * pace, { scale: .92, fade: true });

      [t2, function () { show(rig.W.ph[j], true); flash(resNode(rig, j), "pop", 560 * pace); }],

      show(W.eq, true);

  function stack(opts) {

    var pace = opts.pace || 1;

    if (sumHead) sumHead.appendChild(sumText);
    var t = tableShell("nt-stack", films, opts.heads, sumHead ? [sumHead] : []);
    t.dataset.n = String(n);
    var tb = el("tbody"), top = el("tr", "nt-row nt-top");
    if (A.p) top.dataset.p = A.p;
    top.appendChild(whoCell(A));
    var topTd = films.map(function (f, j) {
      var td = el("td", "rt-c nt-c");
      td.dataset.f = f;
      td.appendChild(cell(A.values[j]));
      top.appendChild(td);

    });
    if (hasSum) top.appendChild(el("td", "nt-sumcol"));
    var W = workRows(n, hasSum, 0);
    W.rlab.textContent = opts.resLabel || "";

    tb.appendChild(top);
    tb.appendChild(W.bot);
    tb.appendChild(W.res);
    t.appendChild(tb);
    wrap.appendChild(t);
    wrap.appendChild(layer);
    var rig = makeRig(layer, topTd, W, n, hasSum);
    loadRig(rig, A.values, B, opts.slots);

      el: wrap, table: t, films: films, n: n, beats: beats,

      reset: function () { return api.show(0); },

      // Slots: which is a film index (0 for the first film) or "sum".

      value: function (which) { return which === "sum" ? rig.total : rig.prods[which]; },

  /* 5. THE BOARD of act 4: the newcomer on top, the regulars below, an inner product column, sorting */
  function rowKids(tr) {
    var out = [];
    each(tr.cells, function (c) { each(c.children, function (k) { out.push(k); }); });
    return out;
  }
  function glide(nodes, dy, dur, delay) {

    });
  }
  // Move rows from their old places to their new ones: measure, change, then glide (first, last, invert, play).
  function flipRows(trs, change, dur, stagger) {
    var before = trs.map(function (tr) { return tr.hidden ? null : tr.getBoundingClientRect().top; });
    change();
    trs.forEach(function (tr, i) {
      if (before[i] === null || tr.hidden) return;
      glide(rowKids(tr).concat(tr.cells.length === 1 ? [tr.cells[0]] : []), before[i] - tr.getBoundingClientRect().top, dur, (stagger || 0) * i);
    });
  }

  function board(opts) {
    opts = opts || {};
    var films = opts.films.slice(), n = films.length, more = (opts.more || []).slice();
    var top = opts.top, people = opts.people.slice();
    var t = S.table({ people: people, films: films.concat(more), newcomer: top, newcomerFirst: true, heads: opts.heads,
                      hide: function (p, f) { return S.rating(p, f) === null; } });
    t.classList.add("nt-tab", "nt-board");
    var wrap = el("div", "nt-wrap nt-boardw"), layer = el("div", "nt-fly");
    wrap.appendChild(t);
    wrap.appendChild(layer);
    var hr = t.tHead.rows[0];
    var iph = el("th", "nt-iph");
    iph.appendChild(el("span", "nt-hl", opts.sumLabel === undefined ? WORDS.name : opts.sumLabel));
    iph.scope = "col";
    hr.insertBefore(iph, hr.cells[1 + n] || null);
    var tb = t.tBodies[0], rows = {}, ipTd = {}, gap = null;
    Array.prototype.slice.call(tb.rows).forEach(function (tr) {
      var p = tr.dataset.p;
      if (!p) { gap = tr; tr.cells[0].colSpan = 2 + n + more.length; return; }
      rows[p] = tr;
      var td = el("td", "nt-ip");
      td.dataset.p = p;
      tr.insertBefore(td, tr.cells[1 + n] || null);
      ipTd[p] = td;
    });
    rows[top].classList.add("nt-row", "nt-top");
    var W = workRows(n, true, more.length);
    W.bot.classList.add("nt-band");
    W.res.classList.add("nt-band");
    tb.insertBefore(W.bot, gap);
    tb.insertBefore(W.res, gap);
    var topTd = films.map(function (f) { return rows[top].querySelector('td[data-f="' + f + '"]'); });
    var rig = makeRig(layer, topTd, W, n, true);
    var topVals = films.map(function (f) { return S.rating(top, f); });
    var IP = {};
    people.forEach(function (p) { IP[p] = S.inner(p, top, films); });
    var RANKED = people.slice().sort(function (a, b) { return IP[b] - IP[a]; });
    var R = Runner(), job = 0;
    // The whole state; draw() puts it on screen at once, the live methods animate toward it.
    var st = { numbers: !opts.marks, done: {}, focus: null, band: false, sorted: false };

    function setNumbers(on) {
      if (on) convert(t, { animate: false, measure: false });

    }
    function setBand(open) { W.bot.hidden = !open; W.res.hidden = !open; }
    function setFocus(p) {
      people.forEach(function (q) { rows[q].classList.toggle("nt-src", q === p); });
      if (!p) {

        W.res.classList.add("nt-empty");

    }
    function draw() {
      R.clear();
      clearLayer(layer);
      stopAnims(t, true);
      wrap.classList.remove("nt-busy");
      setNumbers(st.numbers);
      setBand(st.band);
      setFocus(st.focus);
      if (st.focus) drawRig(rig, n + 1);

      setOrder();
    }
    function regs() { return people.map(function (p) { return rows[p]; }).concat(gap ? [gap] : []); }

      st.band = true;

      setFocus(p);
      drawRig(rig, 0);
      if (!MOTION) return Promise.resolve(true);

      var to = [W.who].concat(W.botTd);

    // The sum travels down into the regular's inner product cell.

      return R.run([[dur, function () {
        st.done[p] = true;
        fill(ipTd[p], IP[p]);

      }]], dur);
    }
    // One regular's inner product, live: the band opens, the row rises, the products flow, the sum lands.
    // me is the job it belongs to: anything that starts another job (show, sort, stop, ...) cuts it short.
    function computeRow(p, pace, me, animate) {
      R.clear();
      clearLayer(layer);

      if (!st.numbers) { st.numbers = true; setNumbers(true); }
      if (!MOTION || animate === false) {
        st.band = true; st.focus = p; st.done[p] = true;
        draw();
        return Promise.resolve(true);
      }
      target = p;
      wrap.classList.add("nt-busy");
      function alive(ok) { return ok && me === job; }
      return openBand(true)
        .then(function (ok) { return alive(ok) ? rise(p, pace) : false; })
        .then(function (ok) { return alive(ok) ? R.wait(TEMPO.pause * pace * 0.5) : false; })
        .then(function (ok) { return alive(ok) ? beats(pace) : false; })
        .then(function (ok) { return alive(ok) ? landSum(p, pace) : false; })

    function compute(p, o) { o = o || {}; return computeRow(p, o.pace || 1, ++job, o.animate); }
    var api = {
      el: wrap, table: t, films: films, people: people, top: top, ip: IP, ranked: RANKED,
      row: function (p) { return rows[p]; },
      cell: function (p, f) { return rows[p] ? rows[p].querySelector('td[data-f="' + f + '"]') : null; },
      ipCell: function (p) { return ipTd[p] || null; },
      state: function () { return { numbers: st.numbers, done: people.filter(function (p) { return st.done[p]; }),
                                    focus: st.focus, band: st.band, sorted: st.sorted }; },
      // s: { numbers, done (a count in table order, or a list of ids), focus, band, sorted }; missing keys keep
      // their value. focus defaults to the last row done while the band is open.
      show: function (s) {
        job++;
        s = s || {};

        if (s.done !== undefined) {
          st.done = {};
          var list = typeof s.done === "number" ? people.slice(0, s.done) : s.done;
          list.forEach(function (p) { st.done[p] = true; });
          if (s.focus === undefined) st.focus = list.length ? list[list.length - 1] : null;
        }
        if (s.focus !== undefined) st.focus = s.focus;
        if (s.band !== undefined) st.band = !!s.band;
        else if (s.done !== undefined) st.band = !!st.focus && !s.sorted;
        if (s.sorted !== undefined) st.sorted = !!s.sorted;

        return api;
      },
      convert: function (o) {
        o = o || {};
        job++;
        st.numbers = true;
        return convert(t, { animate: o.animate, pace: o.pace, measure: false, stagger: o.stagger });
      },
      marks: function () { job++; st.numbers = false; draw(); return api; },
      band: function (open, animate) {

      // o.first: the pace of the first row (default 1), o.rest: the pace of the others (default 0.4).

        clearLayer(layer);

        setDone();

        st.sorted = true; st.band = false; st.focus = null;

/* The arithmetic of part two, matrix factorization (section 2, rebuilt on 2026-11-05 from Carlos's sketch): the

   table of ratings, R[i][j] for customer i and film j. which is "c" or "f", r the row in that matrix and k the
   position in the row. Nothing here changes its inputs.

   and in all posterior animations, the average loss with the total loss so that we stay consistent with the
   literature"; Koren, Bell and Volinsky 2009, equation 2, minimize the sum of the squared errors over the known
   ratings). Until then it was their average.

   moves to x - ALPHA * (after - before) / EPS, up when the total fell, down when it grew. Every number in turn, the
   customers' rows first, then the films', is one round; rounds until the total is below TOL. The scene "One small
   change" writes the ratio out: (after - before) / EPS, named nabla, and the update w = w - ALPHA * nabla.

                                   how many

   Z.at(c, f, which, r, k)         the number at that place
   Z.put(c, f, which, r, k, x)     { c, f }: copies with that number replaced
   Z.nudge(c, f, R, which, r, k, alpha)   { x, after, lossBefore, lossAfter, fell, amount, to }: the number, the number

                                   (alpha * |lossAfter - lossBefore| / EPS, alpha ALPHA unless given) and where the
