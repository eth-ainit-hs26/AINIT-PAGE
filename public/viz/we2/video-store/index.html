      return x;
    });
    return O.ops;
  }
  function pickOp(x, right) {
    if (O.ops.classList.contains("a3-solved")) return;
    if (right) { solveOps(); bump(x, "pop"); }
    else if (!x.classList.contains("a3-no")) { x.classList.add("a3-no"); bump(x, "shake"); }
  }
  function solveOps() {
    O.ops.classList.add("a3-solved");
    O.opb.forEach(function (x) { x.classList.toggle("a3-yes", x.textContent === TIMES); });
  }
  function resetOps() {
    O.ops.classList.remove("a3-solved");
    O.opb.forEach(function (x) { x.classList.remove("a3-yes", "a3-no"); });
  }

  function pairsView() {
    O.cols = ONE.pairs.map(pairCol);
    O.all = button("Reveal all", "quiet a3-all", function () { revealAll(!allSet()); });
    O.big = el("p", "a3-big", "Which arithmetic operation helps to measure agreement?");
    O.ask = h("div", "a3-ask", [O.big, opsRow()]);
    O.read = el("p", "a3-read");
    O.replay = button("Replay", "quiet a3-replay", function () { O.Q.stop(); stopCols(); playProducts(250); });
    O.under = h("div", "a3-under", [O.read, O.replay]);
    // Reveal all and the question share one place; the place of the question and of the line under it is kept
    // from step 1 on, so the pairs never move (on a phone the view starts at the top instead).
    O.pv = view("a3-pairv", [
      h("p", "a3-say", ["Five pairs of customers rated ", S.chip(F1[0], { long: true }), ". Does each pair agree?"]),
      h("div", "a3-pairs", O.cols.map(function (C) { return C.col; })),
      h("div", "a3-foot", [O.all, O.ask]),
      O.under
    ]);
    return O.pv;
  }
  function stopCols() { O.cols.forEach(function (C) { C.st.stop(); }); }
  // All pairs before (done false) or after (done true) their product; the rule over a product shows with its ×.
  function colsAt(done) {
    O.cols.forEach(function (C) { C.st.show(done ? C.st.beats : 0); C.col.classList.toggle("a3-on", done); });
  }
  function readLine(text, isCue) { O.read.textContent = text; O.read.classList.toggle("a3-cue", !!isCue); }
  // The products come out one pair after another, each answer box nodding as its product lands.
  function playProducts(delay) {
    var Q = O.Q, i = 0;
    colsAt(false);
    O.replay.hidden = true;
    readLine(CUE1, true);
    function one() {
      if (i >= O.cols.length) { readLine(END1); O.replay.hidden = false; return; }
      var C = O.cols[i++];
      C.col.classList.add("a3-on");
      C.st.forward().then(function (ok) {
        if (!ok) return;
        bump(C.box, "pop");
        Q.wait(350).then(function (go) { if (go) one(); });
      });
    }
    Q.wait(delay).then(function (go) { if (go) one(); });
  }
  function pairsAt(k, live) {
    O.pv.dataset.k = String(k);
    O.all.classList.toggle("a3-gone", k !== 0);
    O.ask.classList.toggle("a3-gone", k < 1);
    O.under.classList.toggle("a3-gone", k < 2);
    // The answers stay as the room left them on step 1; from step 2 on, all of them show.
    if (k >= 1) revealAll(true); else paintAll();
    if (k === 1) resetOps(); else if (k === 2) solveOps();
    O.ask.classList.toggle("a3-in", k === 1 && live);
    if (k === 1 && live) S.reveal(O.ask);
    if (k < 2) { colsAt(false); return; }
    if (live) { playProducts(700); S.reveal(O.under); }
    else { colsAt(true); readLine(END1); O.replay.hidden = false; }
  }

  function youView1(pair, i) {
    var Y = Yours(pair, F1);
    Y.view = view("a3-you", [kicker("Your turn: " + (i + 1) + " of " + ONE.yours.length),
                             h("p", "a3-say", ["How much do " + nm(pair[0]) + " and " + nm(pair[1]) + " agree on " + ft(F1[0]) + "?"]),
                             Y.box, Y.fb, Y.pad]);
    return Y;
  }
  // The rule: one card per case, each with its example from EXAMPLES.one.rule, in this order.
  function ruleView1() {
    var grid = el("div", "a3-rules");
    [["a3-pos", "Same side", "a positive number: they agree"],
     ["a3-neg", "Opposite sides", "a negative number: they disagree"],
     ["a3-zero", "Neutral", "0: we cannot tell"],
     ["a3-far", "Stronger opinions", "a number further from 0"]
    ].forEach(function (c, i) {
      var pr = ONE.rule[i];
      var st = N.stack({ top: pr[0], bottom: pr[1], films: F1, heads: "pic", resLabel: "agree" });
      st.end();
      var card = h("section", "a3-card " + c[0], [h("h3", "", [c[1]]), el("p", "a3-cw", c[2]), h("div", "a3-mini", [st.el])]);
      card.style.setProperty("--i", String(i));
      grid.appendChild(card);
    });
    O.rule = view("a3-rule", [h("p", "a3-say", ["On one film, ", b("multiply the two numbers"), ". The product says how much two customers agree."]), grid]);
    return O.rule;
  }
  function stopAll1() { O.Q.stop(); stopCols(); }

  S.define("onefilm", {
    act: 3, title: "How much do they agree?", steps: STEPS1,
    build: function (inner) {
      O.views.push(pairsView());
      ONE.yours.forEach(function (pr, i) { var Y = youView1(pr, i); O.you.push(Y); O.views.push(Y.view); });
      O.views.push(ruleView1());
      O.views.forEach(function (v) { inner.appendChild(v); });
    },
    enter: function () { O.last = null; revealAll(false); resetOps(); },
    step: function (k) {
      var was = O.last, live = MOTION && k > 0 && was === k - 1;
      O.last = k;
      stopAll1();
      var iy = k - NPAIR;
      var on = k < NPAIR ? O.pv : (iy < O.you.length ? O.you[iy].view : O.rule);
      O.views.forEach(function (v) { v.hidden = v !== on; });
      // The pairs view stays on screen for three steps, so only the later views fade in as a whole.
      on.classList.toggle("a3-live", live && k >= NPAIR);
      if (k < NPAIR) pairsAt(k, live);
      else if (iy < O.you.length) enterYours(O.you[iy]);
    },
    leave: function () { stopAll1(); },
    onkey: function (e, api) {
      var iy = api.step - NPAIR;
      return iy >= 0 && iy < O.you.length ? keyYours(O.you[iy], e) : false;
    }
  });

  /* SCENE twofilms */
  var TWO = S.EXAMPLES.two, F2 = TWO.films, F3 = S.ROUND2.films;
  var T = { last: null, Q: Seq(), ex: [], you: [], views: [] };
  var STEPS2 = 1 + TWO.shown.length + TWO.yours.length + 1;
  var GUESS = "Guess the result, then press Compute.";

  function rowsView2() {
    var p = TWO.shown[0];
    var vecs = h("div", "a3-vecs", [N.vector(p[0], F2), N.vector(p[1], F2, { heads: "none" })]);
    T.rows = view("a3-rows", [
      h("p", "a3-say", ["Two films now: " + and(F2.map(ft)) + ". Each customer is a ", b("row of " + count(F2.length) + " numbers"), ", one per film."]),
      vecs,
      h("p", "a3-read", ["How much do " + nm(p[0]) + " and " + nm(p[1]) + " agree over both films? Again, one number."])
    ]);
    return T.rows;
  }
  function exView2(pair, i) {
    var X = Shown(T.Q, pair, F2, { size: "lg" });
    var who = nm(pair[0]) + " and " + nm(pair[1]);
    var lead = i === 0 ? [who + ": ", b("multiply film by film"), ", then ", b("add"), " the products."]
                       : [who + ": multiply film by film, then add."];
    X.compute = button("Compute", "primary a3-compute", function () { compute2(X); });
    X.view = view("a3-ex", [kicker("Example " + (i + 1) + " of " + TWO.shown.length), h("p", "a3-say", lead), X.box,
                            h("div", "a3-under", [X.line, h("div", "a3-btns", [X.compute, X.replay])])]);
    return X;
  }
  // Nothing is computed before Compute is pressed: the room guesses first. A computed example stays computed until
  // the scene is left.
  function compute2(X) {
    X.done = true;
    X.compute.hidden = true;
    X.replay.hidden = false;
    X.Q.stop();
    play(X, 200);
  }
  function arrive2(X) {
    X.compute.hidden = !!X.done;
    X.replay.hidden = !X.done;
    if (X.done) endState(X);
    else { X.st.show(0); say(X, GUESS, true); }
  }
  function youView2(pair, i) {
    var Y = Yours(pair, F2);
    Y.view = view("a3-you", [kicker("Your turn: " + (i + 1) + " of " + TWO.yours.length),
                             h("p", "a3-say", ["How much do " + nm(pair[0]) + " and " + nm(pair[1]) + " agree over both films?"]),
                             Y.box, Y.fb, Y.pad]);
    return Y;
  }
  function nameView2() {
    var p = TWO.shown[0];
    T.three = Shown(T.Q, p, F3, { sumLabel: N.WORDS.name });
    T.name = view("a3-name", [
      h("p", "a3-title", ["This is the ", el("em", "", N.WORDS.name)]),
      h("p", "a3-say", [b("Multiply film by film, then add everything up."), " With " + count(F3.length) + " films: " +
        count(F3.length) + " products and one sum."]),
      T.three.box,
      h("div", "a3-under", [T.three.line, T.three.replay])
    ]);
    return T.name;
  }
  function stopAll2() {
    T.Q.stop();
    T.ex.concat([T.three]).forEach(function (X) { if (X) X.st.stop(); });
  }

  S.define("twofilms", {
    act: 3, title: "And with two films?", steps: STEPS2,
    build: function (inner) {
      T.views.push(rowsView2());
      TWO.shown.forEach(function (pr, i) { var X = exView2(pr, i); T.ex.push(X); T.views.push(X.view); });
      TWO.yours.forEach(function (pr, i) { var Y = youView2(pr, i); T.you.push(Y); T.views.push(Y.view); });
      T.views.push(nameView2());
      T.views.forEach(function (v) { inner.appendChild(v); });
    },
    enter: function () { T.last = null; T.ex.forEach(function (X) { X.done = false; }); },
    step: function (k) {
      var was = T.last, live = MOTION && k > 0 && was === k - 1;
      T.last = k;
      stopAll2();
      var ie = k - 1, iy = ie - T.ex.length;
      var on = k === 0 ? T.rows : (ie < T.ex.length ? T.ex[ie].view : (iy < T.you.length ? T.you[iy].view : T.name));
      T.views.forEach(function (v) { v.hidden = v !== on; });
      on.classList.toggle("a3-live", live);
      if (k === 0) return;
      if (ie < T.ex.length) arrive2(T.ex[ie]);
      else if (iy < T.you.length) enterYours(T.you[iy]);
      else if (live) play(T.three, 900);
      else endState(T.three);
    },
    leave: function () { stopAll2(); },
    onkey: function (e, api) {
      var iy = api.step - 1 - T.ex.length;
      return iy >= 0 && iy < T.you.length ? keyYours(T.you[iy], e) : false;
    }
  });
})();
</script>
<script>
/* Act 4 of Once Upon a Video Store: The nearest neighbour. Owner: the act 2 agent (see BRIEF.md and BRIEF-r2.md).
   Class names start with a4-. Two scenes. The first, nearest, is drawn in the notation of NOTATION.md (Store.N): the
   board of act 4 with Vera's row on top, then a small board of act 1 with Zoe's row on top. Seven steps, one idea each:
     1 the ratings in marks: Vera on top, the six regulars below (Love Actually waits, hidden)
     2 the marks become numbers: the notation's wave over the whole board
     3 Vera's inner products appear in their column, top to bottom, without their working
     4 sorted by inner product: Kai ends right under Vera, her nearest neighbour
     5 Love Actually appears: the participant copies Kai's number into Vera's "?"; a week later she watched it
     6 back to act 1: Zoe on top, Max and Lea below, and their inner products
     7 a match adds 1 and a mismatch -1: the counting of act 1 was the inner product all along
   Act 3 taught the inner product, so this act never works one out on screen (Carlos, 2026-11-06: "Don't calculate
   it in front of the participants"): the rows stand one on top of the other and the inner products appear.
   A step reached from the step before plays its motion; any other arrival (Back, the pager) draws it at once.
   The second scene, notebook, is one slide that introduces the notebook in Colab: its three functions, the
   challenge, and the link (Carlos, 2026-11-10: the notebook on "a separate slide"; until then a line under step 7).
   No globals. */
(function () {
  "use strict";
  var S = window.Store;
  if (!S || !S.N) return;

  var N = S.N, el = S.el, num = S.num;
  var motion = !S.reducedMotion;
  var R2 = S.ROUND2;
  var REG = R2.people, FILMS = R2.films, V = R2.newcomer, LOVE = R2.unseen;
  var R1 = S.ROUND1, Z = R1.newcomer;
  var R1F = R1.films.filter(function (f) { return f !== R1.unseen; });
  var ONE = ["max", "lea"];                       // act 1: Max matched Zoe on all three films, Lea on none
  function name(p) { return S.get(p).n; }

  var TITLE = "Vera's nearest neighbour";
  var TITLES = ["Vera and the regulars", "From marks to numbers", "Vera's inner products", "Vera's nearest neighbour",
                "A prediction for Vera", "Back to act 1", "The inner product, all along"];
  var COPY_STEP = 4, ONE_STEP = 5;                // the prediction, and act 1 again (counted from 0)
  var FUT = { "2": "love it", "1": "like it", "0": "shrug", "-1": "dislike it", "-2": "hate it" };
  var HOW_MANY = ["none", "one film", "two films", "all three films"];

  /* SMALL HELPERS */
  function put(parent, parts) {
    parts.forEach(function (x) {
      if (x === null || x === undefined) return;
      parent.appendChild(typeof x === "string" ? document.createTextNode(x) : x);
    });
    return parent;
  }
  function make(tag, cls, parts) { return put(el(tag, cls), parts); }
  function b(text, cls) { return el("b", cls, text); }
  function term(text) { return el("b", "a4-term", text); }
  // The notebook of this game in Colab, student version (Carlos, 2026-11-06: each game carries its notebook).
  var COLAB = "https://colab.research.google.com/github/eth-ainit-hs26/w2-cx-public/blob/main/01_cx_nearest_neighbours_student.ipynb";
  function colabLink() {
    var a = el("a", "btn primary a4-colab", "Open in Colab");
    a.href = COLAB;
    a.target = "_blank";
    a.rel = "noopener";
    return a;
  }
  function button(text, cls, fn) {
    var x = el("button", "btn" + (cls ? " " + cls : ""), text);
    x.type = "button";
    x.addEventListener("click", fn);
    return x;
  }

  /* THE SCENE'S STATE. tok changes on every step and on leaving, so a motion that outlives its step does nothing. */
  var X = { last: null, k: -1, tok: 0, timers: [], ghost: null, wave: null };
  function later(fn, ms) {
    var me = X.tok;
    X.timers.push(setTimeout(function () { if (me === X.tok) fn(); }, ms));
  }
  function halt() {
    X.tok++;
    X.timers.forEach(clearTimeout);
    X.timers = [];
    if (X.ghost) { X.ghost.remove(); X.ghost = null; }
    if (X.wave) { X.wave.cancel(); X.wave = null; }
  }

  /* STEP 5: Kai's number flies up into Vera's "?" */
  function kaiCell() { return X.bd.cell(X.nn, LOVE).querySelector(".nt-n"); }
  function resetCopy() {
    N.setSlot(X.vslot, null);
    X.res.classList.add("a4-wait");
    X.copy.classList.remove("a4-gone");
    REG.forEach(function (p) { X.bd.cell(p, LOVE).classList.remove("dim"); });
    var kc = kaiCell();
    if (kc) kc.classList.remove("nt-hot");
  }
  function landCopy() {
    if (X.ghost) { X.ghost.remove(); X.ghost = null; }
    var kc = kaiCell();
    if (kc) kc.classList.remove("nt-hot");
    N.setSlot(X.vslot, S.rating(X.nn, LOVE), true);
    X.res.classList.remove("a4-wait");
    S.reveal(X.res);
  }
  function copy() {
    if (X.k !== COPY_STEP || X.copy.classList.contains("a4-gone")) return;
    X.copy.classList.add("a4-gone");
    REG.forEach(function (p) { if (p !== X.nn) X.bd.cell(p, LOVE).classList.add("dim"); });
    var src = kaiCell();
    if (!motion || !src || !src.animate) { landCopy(); return; }
    src.classList.add("nt-hot");
    later(function () {
      var a = src.getBoundingClientRect(), z = X.vslot.getBoundingClientRect();
      var g = src.cloneNode(true);
      g.classList.remove("nt-hot");
      g.classList.add("a4-ghost");
      g.setAttribute("aria-hidden", "true");
      g.style.left = a.left + "px";
      g.style.top = a.top + "px";
      g.style.width = g.style.minWidth = a.width + "px";
      g.style.height = g.style.minHeight = a.height + "px";
      g.style.fontSize = getComputedStyle(src).fontSize;
      document.body.appendChild(g);
      X.ghost = g;
      var dx = z.left + (z.width - a.width) / 2 - a.left, dy = z.top + (z.height - a.height) / 2 - a.top;
      g.animate([{ transform: "none" }, { transform: "translate(" + dx + "px," + dy + "px) scale(1.08)", offset: 0.8 },
                 { transform: "translate(" + dx + "px," + dy + "px)" }],
                { duration: 900, easing: "cubic-bezier(.45,.05,.25,1)", fill: "forwards" });
      // The copy lands on the clock, so it lands even when the page's animations are held (a hidden tab).
      later(landCopy, 920);
    }, 450);
  }

  /* STEP 6: act 1's board; its two inner products appear, then the line that reads them */
  function one(live) {
    var me = X.tok, all = ONE.length;
    if (!live || !motion) {
      X.bd1.show({ numbers: true, done: all, band: false, sorted: false });
      X.oneSay.classList.remove("a4-wait");
      return;
    }
    X.bd1.show({ numbers: true, done: 0, band: false, sorted: false });
    X.oneSay.classList.add("a4-wait");
    later(function () {
      X.bd1.reveal().then(function (ok) {
        if (!ok || me !== X.tok) return;
        later(function () {
          X.oneSay.classList.remove("a4-wait");
          S.reveal(X.oneSay);
        }, 250);
      });
    }, 400);
  }

  S.define("nearest", {
    act: 4,
    title: TITLE,
    steps: 7,
    build: function (inner) {
      var root = el("div", "a4-near");
      X.root = root;

      // the board: Vera on top, the regulars below, the inner product column, Love Actually (hidden until step 5)
      X.bd = N.board({ top: V, people: REG, films: FILMS, more: [LOVE], marks: true });
      X.nn = X.bd.ranked[0];
      var vtd = X.bd.cell(V, LOVE);
      N.fill(vtd, undefined);
      X.vslot = vtd.querySelector(".nt-slot");
      X.vslot.setAttribute("aria-label", "Vera's number for " + S.get(LOVE).t + ": to predict");

      var film = el("i", "a4-film", S.get(LOVE).t);
      var kl = S.rating(X.nn, LOVE), payoff = S.LATER[V] && S.LATER[V][LOVE];
      X.caps = [
        ["Vera, the newcomer, on top. The six regulars below, on the same three films."],
        ["The marks become numbers. From here on, only numbers."],
        ["Each regular's ", term("inner product"), " with Vera, worked out as in act 3."],
        ["Sorted by inner product: ", b(name(X.nn)), ", the taste twin of act 2, is Vera's ", term("nearest neighbour"), "."],
        ["Vera has not seen ", film, ". Her nearest neighbour, ", b(name(X.nn)), ", has."],
        ["Back to act 1, where every mark was a tick or a cross."],
        ["With ticks and crosses only, each film adds 1 for a ", b("match"), " and " + num(-1) + " for a ", b("mismatch"), "."]
      ].map(function (parts) { return make("p", "a4-cap", parts); });
      put(root, X.caps);

      var bdBox = el("div", "a4-bd");
      X.bdBox = bdBox;
      bdBox.appendChild(X.bd.el);
      X.copy = button("Copy " + name(X.nn) + "'s number", "primary", copy);
      X.bar = make("div", "a4-bar", [X.copy]);
      X.res = make("div", "a4-res a4-wait", [
        make("p", "a4-say", [b(name(X.nn)), " " + S.word(kl) + ", so Vera will probably ", term(FUT[String(kl)]), " too."]),
        payoff === undefined || payoff === null ? null
          : make("p", "a4-later", ["A week later, Vera watched it and gave it ", N.cell(payoff, { cls: "a4-inl" }), "."])
      ]);
      X.res.setAttribute("aria-live", "polite");
      // The button and the result share one place: the result appears where the Copy button was.
      X.act = make("div", "a4-act", [X.bar, X.res]);
      bdBox.appendChild(X.act);
      root.appendChild(bdBox);

      // act 1 again: the key of its two marks, then Zoe on top of Max and Lea, in the board of act 4
      var one = el("div", "a4-one");
      X.one = one;
      X.key = N.legend([1, -1]);
      X.key.classList.add("a4-key");
      X.bd1 = N.board({ top: Z, people: ONE, films: R1F });
      var m0 = S.matches(ONE[0], Z, R1F), m1 = S.matches(ONE[1], Z, R1F);
      X.oneSay = make("p", "a4-say a4-wait", ["In act 1, ", b(name(ONE[0])), " matched " + name(Z) + " on " + HOW_MANY[m0] + ", and ",
                                             b(name(ONE[1])), " on " + HOW_MANY[m1] + "."]);
      X.rule = make("div", "a4-rule", [
        make("p", "a4-say", ["So the inner product is the matches minus the mismatches."]),
        make("p", "a4-big", ["The counting of act 1 was the ", term("inner product"), " all along."])
      ]);
      put(one, [X.key, X.bd1.el, X.oneSay, X.rule]);
      root.appendChild(one);

      inner.appendChild(root);
    },
    enter: function () { X.last = null; },
    step: function (k, api) {
      var was = X.last, live = was === k - 1;
      X.last = k;
      X.k = k;
      halt();
      api.setTitle(TITLES[k]);
      X.root.dataset.k = String(k);
      X.caps.forEach(function (c, i) { c.hidden = i !== k; });
      X.bdBox.hidden = k >= ONE_STEP;
      X.one.hidden = k < ONE_STEP;
      X.root.classList.toggle("a4-love", k === COPY_STEP);

      // the Copy button, and the result in its place
      X.act.hidden = k !== COPY_STEP;
      resetCopy();

      // Vera's board
      var bd = X.bd, all = REG.length;
      if (k === 0) bd.show({ numbers: false, done: 0, band: false, sorted: false });
      else if (k === 1) {
        if (live) {
          bd.show({ numbers: false, done: 0, band: false, sorted: false });
          var h = X.wave = bd.convert();
          h.done.then(function () { if (X.wave === h) X.wave = null; });
        }
        else bd.show({ numbers: true, done: 0, band: false, sorted: false });
      } else if (k === 2) {
        bd.show({ numbers: true, done: live ? 0 : all, band: false, sorted: false });
        if (live) later(function () { bd.reveal(); }, 350);
      } else if (k === 3) {
        if (live) { bd.show({ numbers: true, done: all, band: false, sorted: false }); bd.sort(true); }
        else bd.show({ numbers: true, done: all, sorted: true });
      } else bd.show({ numbers: true, done: all, sorted: true });

      // act 1 again
      X.key.hidden = k !== ONE_STEP;
      X.oneSay.hidden = k !== ONE_STEP;
      X.rule.hidden = k !== ONE_STEP + 1;
      if (k === ONE_STEP) one(live);
      else if (k > ONE_STEP) X.bd1.show({ numbers: true, done: ONE.length, band: false, sorted: false });
      else X.bd1.stop();
    },
    leave: function (api) {
      halt();
      X.bd.stop();
      X.bd1.stop();
      api.setTitle(TITLE);
    }
  });

  /* SCENE notebook: the notebook in Colab, on a slide of its own. The three functions are the notebook's three
     tasks and the challenge is its last part (source/notebook/cells_main.py and cells_challenge.py). */
  var TASKS = [
    ["inner_product", "How much do two customers agree?"],
    ["nearest_customer", "Which customer agrees most with a newcomer?"],
    ["predict", "Copy that customer's rating of a film the newcomer has not seen."]
  ];
  S.define("notebook", {
    act: 4,
    title: "Your turn, in Python",
    steps: 1,
    build: function (inner) {
      var list = el("ol", "a4-tasks");
      TASKS.forEach(function (t, i) {
        list.appendChild(make("li", "", [el("span", "a4-tn", String(i + 1)), el("code", "a4-fn", t[0]), el("span", "a4-tw", t[1])]));
      });
      inner.appendChild(make("div", "a4-nb", [
        make("p", "a4-cap", ["In the notebook, a computer does what you did: three short Python functions, about 30 minutes."]),
        list,
        make("p", "a4-say", ["Then a challenge: let the ", b("k nearest customers"), " vote."]),
        colabLink(),
        make("p", "a4-later", ["To keep your work in Colab: File, Save a copy in Drive."])
      ]));
    },
    step: function () {}
  });
})();

<script>
/* fullscreen.js: the full-screen button of the AINIT games (2026-11-11; Carlos shows the games from his iPad).
   The same file in every game. The button goes after the light or dark switch (.themebtn) and takes its look; a
   page without that switch marks the place with data-fullscreen. One tap and the page fills the whole screen, with
   no address bar or tabs, in Safari and Chrome on an iPad and on a computer. The button is left out where the
   browser cannot do that (an iPhone, a frame that does not allow it), and hidden on screens under 561 px and while
   the page is full screen. The browser's own exit button, a swipe down on an iPad, or Escape leave full screen. */
(function () {
  var doc = document, root = doc.documentElement;
  var request = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!request || !(doc.fullscreenEnabled || doc.webkitFullscreenEnabled)) return;
  var host = doc.querySelector("[data-fullscreen]"), twin = host ? null : doc.querySelector(".themebtn");
  if (!host && !twin) return;

  var btn = doc.createElement("button");
  btn.type = "button";
  btn.className = twin ? twin.className + " fullbtn" : "fullbtn";
  btn.title = "Full screen";
  btn.setAttribute("aria-label", "Full screen");
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" style="display:block; margin:auto" aria-hidden="true"' +
    ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';

  var narrow = window.matchMedia ? window.matchMedia("(max-width: 560px)") : null;
  function isFull() { return !!(doc.fullscreenElement || doc.webkitFullscreenElement); }
  function sync() { btn.style.display = isFull() || (narrow && narrow.matches) ? "none" : ""; }

  btn.addEventListener("click", function () {
    btn.blur();
    var p = request.call(root);
    if (p && typeof p.catch === "function") p.catch(function () {});
  });
  doc.addEventListener("fullscreenchange", sync);
  doc.addEventListener("webkitfullscreenchange", sync);
  if (narrow && narrow.addEventListener) narrow.addEventListener("change", sync);
  else if (narrow && narrow.addListener) narrow.addListener(sync);

  if (twin) twin.parentNode.insertBefore(btn, twin.nextSibling);
  else host.appendChild(btn);
  sync();
})();
</script>
<script>Store.start();</script>
