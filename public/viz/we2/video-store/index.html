<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Once Upon a Video Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style>
/* Once Upon a Video Store: the shared frame, owned by the main session. The acts add their own rules in
   act1.css to act4.css, with class names that start with a1-, a2-, a3- or a4-.
   Codex plates: vellum, a fine double rule, violet rubric, ochre accent. Blue for ticks, orange for crosses,
   grey for the wavy line of neutral. Two marks are drawn stronger than one. */
:root{
  --bg:#F9F4E3;
  --leaf:#FFFBF0;
  --ink:#2A2432;
  --muted:#6B6275;
  --rule:#D8CBA9;
  --rubric:#58409A;
  --ochre:#8F5A06;
  --like:#1E6AAE;
  --like-bg:#E9F1FA;
  --like-bg2:#C9DDF3;
  --dislike:#AE4E18;
  --dislike-bg:#FAEDE3;
  --dislike-bg2:#F2D3BC;
  --serif:"EB Garamond", Garamond, "Iowan Old Style", "Times New Roman", serif;
  --emoji:"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1720; --leaf:#231E2A; --ink:#EEE7D8; --muted:#A99FB3; --rule:#3D3548;
    --rubric:#B9A6F3; --ochre:#E3AA4C;
    --like:#86BDEE; --like-bg:#1A2633; --like-bg2:#22405E; --dislike:#F0A06D; --dislike-bg:#33231A; --dislike-bg2:#5A3520;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1720; --leaf:#231E2A; --ink:#EEE7D8; --muted:#A99FB3; --rule:#3D3548;
  --rubric:#B9A6F3; --ochre:#E3AA4C;
  --like:#86BDEE; --like-bg:#1A2633; --like-bg2:#22405E; --dislike:#F0A06D; --dislike-bg:#33231A; --dislike-bg2:#5A3520;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%; margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--serif); font-size:18px; line-height:1.45; -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600}
p{margin:0}
ol,ul{margin:0; padding:0; list-style:none}
button{font:inherit; color:inherit}
button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--rubric); outline-offset:2px}
.scene-no{color:var(--rubric); line-height:1; font-variant-numeric:lining-nums tabular-nums}
.sprite{position:absolute; width:0; height:0; overflow:hidden}
.em{font-family:var(--emoji); font-style:normal; line-height:1}
.sc{font-variant-caps:all-small-caps; letter-spacing:.09em}

/* App shell: top bar, one scene at a time, Back and Next with the steps of the scene between them */
.app{height:100vh; height:100dvh; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto}
.topbar{display:flex; align-items:center; gap:14px; padding:8px var(--gut-r) 8px var(--gut); border-bottom:1px solid var(--rule); min-width:0; overflow:hidden}
.brand{font-size:21px; font-weight:500; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis}
.brand em{color:var(--rubric)}
.pager{margin-left:auto; display:flex; align-items:center; gap:4px; min-width:0}
.pager .act{display:flex; align-items:center; gap:4px}
.pager .act + .act{margin-left:6px; padding-left:10px; border-left:1px solid var(--rule)}
.pager button{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--rule); background:var(--leaf); color:var(--rubric);
  font-size:15px; font-variant-numeric:lining-nums tabular-nums; line-height:1; padding:0; cursor:pointer; flex:none}
.pager button[aria-current="step"]{background:var(--rubric); border-color:var(--rubric); color:var(--leaf)}
.themebtn{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--rule); background:transparent; padding:0; cursor:pointer;
  display:grid; place-items:center; color:var(--muted); flex:none}
.themebtn svg{width:18px; height:18px}
.stage{overflow:auto; padding:12px var(--gut-r) 12px var(--gut)}
.foot{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; padding:8px var(--gut-r) 10px var(--gut); border-top:1px solid var(--rule)}
.navbtn{border:1.5px solid var(--rubric); color:var(--rubric); background:transparent; border-radius:999px; padding:5px 20px 7px;
  font-size:17px; cursor:pointer; min-width:104px}
.navbtn.next{background:var(--rubric); color:var(--leaf)}
.navbtn:disabled{opacity:.3; cursor:default}
.steps{display:flex; justify-content:center; flex-wrap:wrap; gap:6px}
.steps i{width:8px; height:8px; border-radius:50%; background:var(--rule)}
.steps i.past{background:var(--muted)}
.steps i.on{background:var(--rubric); transform:scale(1.25)}

/* A scene is one leaf of the codex: a fine double rule around one screen */
.scene{display:none; min-height:100%; max-width:1180px; margin:0 auto; flex-direction:column;
  background:var(--leaf); border:3px double var(--rule); border-radius:4px; padding:16px 24px 18px}
.scene.active{display:flex; animation:enter .35s ease both}
@keyframes enter{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ .scene.active{animation:none} }
.scene-head{display:flex; align-items:center; gap:14px}
.scene-head .scene-no{font-size:34px}
.scene-head h2{font-size:28px; line-height:1.1}
.scene-head .actname{margin-left:auto; color:var(--muted); font-variant-caps:all-small-caps; letter-spacing:.09em; font-size:15px; white-space:nowrap}
.scene-body{flex:1; display:flex; flex-direction:column; min-height:0}
.scene-inner{margin:auto 0; padding-top:12px; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; width:100%}
.scene-error{border:1.5px dashed var(--dislike); color:var(--dislike); border-radius:10px; padding:8px 12px; font-size:15px}
.say{text-align:center; color:var(--muted); font-style:italic; font-size:17px}
.bubble{justify-self:center; max-width:62ch; text-align:center; background:var(--bg); border:1.5px solid var(--rule); border-radius:16px; padding:9px 18px; font-size:18px}
.btn{border:1.5px solid var(--rubric); color:var(--rubric); background:transparent; border-radius:999px; padding:4px 16px 6px;
  font-size:16px; line-height:1.2; cursor:pointer}
.btn.primary{background:var(--rubric); color:var(--leaf)}
.btn.quiet{border-style:dashed}
.btn:disabled{opacity:.4; cursor:default}

/* The five marks: two ticks, a tick, neutral (a wavy line), a cross, two crosses.
   A badge holds one mark; data-r is the rating from 2 to -2. Two marks get the stronger tint. */
.mk{display:inline-block; width:1em; height:1em; vertical-align:-.14em; overflow:visible; flex:none}
.mk.tick2, .mk.cross2{width:1.25em}
.mk.tick, .mk.tick2{color:var(--like)}
.mk.cross, .mk.cross2{color:var(--dislike)}
.mk.wave{color:var(--muted)}
.vote{display:inline-flex; align-items:center; justify-content:center; gap:3px; min-width:44px; padding:4px 6px; border-radius:9px;
  border:1.5px solid var(--rule); background:transparent; flex:none; line-height:1; vertical-align:middle}
.vote .mk{width:20px; height:20px}
.vote .mk.tick2, .vote .mk.cross2{width:25px}
.vote[data-r="1"]{background:var(--like-bg); border-color:var(--like)}
.vote[data-r="2"]{background:var(--like-bg2); border-color:var(--like); border-width:2px}
.vote[data-r="-1"]{background:var(--dislike-bg); border-color:var(--dislike)}
.vote[data-r="-2"]{background:var(--dislike-bg2); border-color:var(--dislike); border-width:2px}
.vote .n{font-size:15px; min-width:1.7em; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); font-weight:600}

/* Pictures: an emoji tile for a film, an initial for a person */
.pic{--s:44px; position:relative; flex:none; width:var(--s); height:var(--s); display:grid; place-items:center; line-height:1}
.pic.film{border-radius:24%; font-family:var(--emoji); font-style:normal; font-size:calc(var(--s) * .56)}
.pic.person{border-radius:50%; font-family:var(--serif); font-weight:600; font-size:calc(var(--s) * .5); color:#2A2432;
  box-shadow:inset 0 0 0 1.5px rgba(42,36,50,.25)}
.pic.xl{--s:clamp(76px, 15vh, 120px)}
.pic.lg{--s:clamp(60px, 11vh, 88px)}
.pic.md{--s:44px}
.pic.sm{--s:34px}
.pic.xs{--s:26px}

/* Chips: a small picture and a name */
.chip{display:inline-flex; align-items:center; gap:6px; padding:2px 10px 2px 2px; border:1.5px solid var(--rule); border-radius:999px;
  background:var(--leaf); font-size:15.5px; line-height:1.1; white-space:nowrap; max-width:100%; min-width:0; vertical-align:middle}
.chip .pic{--s:26px}
.chip .chip-n{overflow:hidden; text-overflow:ellipsis}
.chip .chip-tag{font-size:12px; color:var(--ochre); font-variant-caps:all-small-caps; letter-spacing:.08em; font-weight:600}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--rubric)}
.chip.on{border-color:var(--rubric); box-shadow:0 0 0 2px var(--rubric)}
.chip.dim{opacity:.32}

/* A film card: picture, title, year, summary */
.fcard{display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:16px; row-gap:2px; align-items:center; align-content:center;
  padding:14px 16px; border:1.5px solid var(--rule); border-radius:14px; background:var(--bg); text-align:left}
.fcard .pic{grid-row:1 / span 2}
.fcard h3{font-size:22px; line-height:1.15}
.fcard h3 .yr{color:var(--muted); font-weight:400; font-size:.8em; margin-left:6px}
.fcard .sum{font-size:16.5px; line-height:1.38}

/* The ratings table: customers in rows, films in columns, one badge per cell.
   .on and .dim work on rows (tr) and on cells (td); .rt-new is the newcomer below a gap; .q is a "?" cell. */
.rt{border-collapse:separate; border-spacing:6px 5px; margin:0 auto}
.rt th, .rt td{padding:0; text-align:center; vertical-align:middle}
.rt-film{font-weight:500; font-size:14.5px; line-height:1.15; padding:0 2px 2px}
.rt-film .pic{margin:0 auto 3px}
.rt-ft{display:block; max-width:8.5em; margin:0 auto; text-wrap:balance}
.rt.pic-heads .rt-ft{display:none}
.rt-who{text-align:left; white-space:nowrap; padding-right:6px; font-weight:500}
.rt-who .pic{display:inline-grid; vertical-align:middle; margin-right:7px}
.rt-n{vertical-align:middle}
.rt-c .vote{min-width:52px}
.rt-gap td{height:6px; border-bottom:1.5px dashed var(--rule)}
.rt-new .rt-who{color:var(--rubric)}
.rt tr, .rt td, .rt th{transition:opacity .25s ease}
.rt tr.dim, .rt td.dim, .rt th.dim{opacity:.3}
.rt td.on .vote, .rt tr.on td .vote{box-shadow:0 0 0 2.5px var(--rubric)}
.rt tr.on .rt-who{color:var(--rubric)}
.q{display:inline-grid; place-items:center; min-width:52px; height:32px; border:1.5px dashed var(--rubric); border-radius:9px;
  color:var(--rubric); font-weight:700; font-size:18px}
@media (prefers-reduced-motion: reduce){ .rt tr, .rt td, .rt th{transition:none} }

/* Section cards: a leaf of its own before acts 2, 3 and 4. The leaf turns violet with a wipe like a turning page,
   then the act's numeral, a kicker, the act's name, one line and a motif come in one after another. */
:root{--card:#58409A; --card-rule:#7A64BC; --card-ink:#FFFBF0; --card-soft:#D8CDF4}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--card:#2F2552; --card-rule:#4C3F7E; --card-ink:#EEE7D8; --card-soft:#B9A6F3} }
:root[data-theme="dark"]{--card:#2F2552; --card-rule:#4C3F7E; --card-ink:#EEE7D8; --card-soft:#B9A6F3}
.scene.intro{background:var(--card); border-color:var(--card-rule); color:var(--card-ink)}
.scene.intro.active{animation:card-wipe .7s cubic-bezier(.65,0,.35,1) both}
@keyframes card-wipe{from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)}}
.scene.intro .scene-head{display:none}
.act-card{display:grid; justify-items:center; text-align:center; gap:10px; padding:8px 0}
.act-no{font-size:clamp(64px, 15vh, 128px); line-height:1; color:var(--card-soft); font-variant-numeric:lining-nums}
.act-kicker{font-variant-caps:all-small-caps; letter-spacing:.24em; font-size:19px; color:var(--card-soft)}
.act-title{font-style:italic; font-weight:500; font-size:clamp(42px, 9vh, 76px); line-height:1.04; text-wrap:balance}
.act-line{max-width:36ch; font-size:22px; line-height:1.38; text-wrap:balance}
.act-motif{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px; margin-top:10px}
.act-motif .vote{min-width:66px; padding:9px 10px}
.act-motif .vote[data-r="0"]{background:var(--leaf)}
.act-motif .vote .mk{width:28px; height:28px}
.act-motif .vote .mk.tick2, .act-motif .vote .mk.cross2{width:35px}
.act-op{width:66px; height:66px; border-radius:50%; border:2px solid var(--card-soft); display:grid; place-items:center;
  font-size:40px; line-height:1; color:var(--card-ink)}
.act-motif .chip{background:var(--leaf); color:var(--ink); font-size:21px; padding:3px 16px 3px 3px; border-color:var(--card-soft)}
.act-motif .chip .pic{--s:36px}
.act-link{width:96px; border-top:3px dotted var(--card-soft)}
.act-q{width:44px; height:44px; border-radius:50%; border:2px dashed var(--card-soft); display:grid; place-items:center;
  font-size:24px; font-weight:700; color:var(--card-ink)}
.act-card.play > *{animation:act-in .7s cubic-bezier(.2,.7,.2,1) both}
.act-card.play .act-no{animation-name:act-no; animation-duration:.9s; animation-delay:.45s}
.act-card.play .act-kicker{animation-delay:.75s}
.act-card.play .act-title{animation-delay:.9s}
.act-card.play .act-line{animation-delay:1.2s}
.act-card.play .act-motif{animation:none}
.act-card.play .act-motif > *{animation:act-pop .5s cubic-bezier(.3,1.5,.5,1) both; animation-delay:calc(1.5s + var(--j) * .14s)}
@keyframes act-in{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
@keyframes act-no{from{opacity:0; transform:scale(.55) rotate(-10deg)} to{opacity:1; transform:none}}
@keyframes act-pop{from{opacity:0; transform:scale(.4)} to{opacity:1; transform:none}}
.pager button.intro{width:11px; height:11px; border-radius:2px; transform:rotate(45deg); background:var(--rule); border:none; margin:0 4px}
.pager button.intro[aria-current="step"]{background:var(--rubric)}
@media (prefers-reduced-motion: reduce){
  .scene.intro.active, .act-card.play > *, .act-card.play .act-motif > *{animation:none}
}

/* Short screens: a laptop browser or the projector at 720p */
@media (max-height: 760px){
  .scene{padding:12px 22px 14px}
  .scene-head .scene-no{font-size:30px}
  .scene-head h2{font-size:25px}
  .scene-inner{gap:10px; padding-top:8px}
  .fcard{padding:10px 14px}
  .fcard h3{font-size:20px}
  .fcard .sum{font-size:15.5px}
  .bubble{font-size:17px; padding:7px 16px}
  .rt{border-spacing:6px 4px}
}
@media (max-width: 760px){
  .scene-head .actname{display:none}
}
@media (max-width: 560px){
  body{font-size:16.5px}
  .brand{font-size:17px}
  .topbar{gap:8px; padding-top:6px; padding-bottom:6px}
  .pager{gap:3px}
  .pager .act{gap:3px}
  .pager .act + .act{margin-left:2px; padding-left:5px}
  .pager button{width:11px; height:11px; font-size:0; border-width:1.5px}
  .brand .pre{display:none}
  .themebtn{width:28px; height:28px}
  .stage{padding:8px}
  .foot{padding-top:6px; padding-bottom:8px; gap:8px}
  .navbtn{min-width:84px; font-size:16px; padding:4px 14px 6px}
  .steps{gap:4px}
  .steps i{width:6px; height:6px}
  .scene{padding:10px 10px 12px}
  .scene-head{gap:10px}
  .scene-head .scene-no{font-size:24px}
  .scene-head h2{font-size:21px}
  .scene-inner{gap:10px; padding-top:8px}
  .say{font-size:14.5px}
  .bubble{font-size:15.5px; padding:7px 12px}
  .btn{font-size:15px; padding:3px 13px 5px}
  .vote{padding:3px 4px; min-width:36px}
  .vote .mk{width:17px; height:17px}
  .vote .mk.tick2, .vote .mk.cross2{width:21px}
  .vote .n{font-size:13.5px}
  .chip{font-size:13.5px; gap:4px; padding:2px 8px 2px 2px}
  .chip .pic{--s:22px}
  .fcard{column-gap:12px; padding:10px 12px}
  .fcard h3{font-size:18.5px}
  .fcard .sum{font-size:14.5px; line-height:1.34}
  .rt{border-spacing:3px 4px}
  .rt-film{font-size:12.5px}
  .rt-ft{display:none}
  .rt-who{padding-right:2px; font-size:15px}
  .rt-who .pic{margin-right:4px}
  .rt-c .vote, .q{min-width:40px}
  .q{height:28px}
  .act-card{gap:8px}
  .act-kicker{font-size:16px}
  .act-title{font-size:38px}
  .act-line{font-size:17px}
  .act-motif{gap:8px}
  .act-motif .vote{min-width:48px; padding:6px 6px}
  .act-motif .vote .mk{width:22px; height:22px}
  .act-motif .vote .mk.tick2, .act-motif .vote .mk.cross2{width:27px}
  .act-op{width:52px; height:52px; font-size:32px}
  .act-motif .chip{font-size:18px}
  .act-link{width:56px}
  .pager button.intro{width:8px; height:8px; margin:0 2px}
}
</style>
<style>
/* The notation of Once Upon a Video Store (owned by the notation agent; see NOTATION.md).
   A number keeps the colour of its mark: the blue tint above 0, the orange tint below 0, grey for 0, and the
   stronger tint from 2 and from -2 on. A vector is a row. An inner product stacks two rows, film by film; a
   product comes out of each column, then the products gather into the sum.
   Sizes are custom properties, so a scene can resize a form from its own stylesheet:
     --nt-w  width of a number cell     --nt-h  its height       --nt-fs  its font size
     --nt-sx gap between columns        --nt-sy gap between rows --nt-xg  room for the × between the two rows
     --nt-rg room under the rule        --nt-pw width of a product (default --nt-w)  --nt-eqw room for "=" */

/* 1. A NUMBER CELL */
.nt-n{display:inline-grid; place-items:center; box-sizing:border-box; min-width:var(--nt-w, 48px); min-height:var(--nt-h, 34px);
  padding:0 .28em; border:1.5px solid var(--rule); border-radius:10px; background:transparent; color:var(--muted);
  font-family:var(--serif); font-size:var(--nt-fs, var(--nt-auto, 21px)); font-weight:600; line-height:1;
  font-variant-numeric:lining-nums tabular-nums; vertical-align:middle; white-space:nowrap; flex:none;
  transition:box-shadow .25s ease}
.nt-n[data-t="1"]{background:var(--like-bg); border-color:var(--like); color:var(--like)}
.nt-n[data-t="2"]{background:var(--like-bg2); border-color:var(--like); border-width:2px; color:var(--like)}
.nt-n[data-t="-1"]{background:var(--dislike-bg); border-color:var(--dislike); color:var(--dislike)}
.nt-n[data-t="-2"]{background:var(--dislike-bg2); border-color:var(--dislike); border-width:2px; color:var(--dislike)}
/* a slot: a number to work out */
.nt-n.nt-slot{border:2px dashed var(--rubric); background:transparent; color:var(--rubric)}
.nt-n.nt-slot.nt-draft{color:var(--ink); border-style:solid}
.nt-n.nt-slot.nt-wrong{border-color:var(--muted); color:var(--muted); text-decoration:line-through; text-decoration-thickness:2px}
.nt-n.nt-ask{border-style:solid; box-shadow:0 0 0 3px var(--leaf), 0 0 0 5px var(--rubric)}
/* in focus: the two numbers of the column being multiplied, or the product travelling into the sum */
.nt-n.nt-hot, .vote.nt-hot{box-shadow:0 0 0 3px var(--rubric)}

/* 2. THE CONVERSION: the mark folds away like the flap of a station board and its number unfolds with a ring
   in its colour. The motions themselves are in notation.js (Web Animations); this keeps the number on top. */
.nt-n.nt-flip-in{position:relative; z-index:2}

/* 3 and 4. VECTORS AND STACKS: tables whose rows are customers and whose columns are films */
.nt-wrap{position:relative; display:inline-block; max-width:100%; vertical-align:top}
.nt-fly{position:absolute; left:0; top:0; width:0; height:0; overflow:visible; pointer-events:none; z-index:6}
.nt-ghost{position:absolute; margin:0; box-sizing:border-box; z-index:6; pointer-events:none; box-shadow:0 6px 16px rgba(42,36,50,.22)}
.nt-off{visibility:hidden}

   (act1.js to act4.js) and registers its scenes with Store.define; dev.html then calls Store.start().

   A scene:
     Store.define("key", {
       act: 1,                       // 1 to 4; scenes are shown act by act, in the order they were defined
       title: "A newcomer",          // the heading of the leaf and the tooltip in the pager
       steps: 3,                     // clicks inside the scene (Next walks through them, then moves on)
       build: function (inner, api) {},   // once, on the first visit: fill inner (the scene's content box)
       step: function (k, api) {},        // every time step k (counted from 0) is shown, also when going Back,
                                          // so it must SET the state for k from scratch
       enter: function (api) {},          // optional: the scene became the active one
       leave: function (api) {},          // optional: another scene is about to be shown
       onkey: function (e, api) {}        // optional: return true to claim a key before the engine sees it

  var BY = {};

  function get(id) { var x = BY[id]; if (!x) throw new Error("unknown id: " + id); return x; }

  function inner(a, b, films) {

  }

  function matches(a, b, films) {

  function chip(x, opts) {

      acts.push([t0, function () {
        rig.pcell[i].classList.add("nt-hot");
        fly(rig.layer, rig.pcell[i], W.sh, T.gather * pace, { arc: 22 });
      }]);
      acts.push([t0 + T.gather * pace, function () {
        setCell(rig.sumCell, upto);
        show(W.sh, true);
        flash(rig.sumCell, "pop", 480 * pace);
        rig.pcell[i].classList.remove("nt-hot");
      }]);
    });
    var end = start + rig.n * step + T.settle * pace;
    acts.push([end - 20, function () { hotSum(rig, false); }]);
    return R.run(acts, end);
  }
  function key(which) { return which === "sum" ? "sum" : String(which); }

  function stack(opts) {
    opts = opts || {};
    var films = opts.films.slice(), n = films.length;
    var hasSum = n > 1 && opts.sum !== false;
    var A = rowSpec(opts.top, films, opts.rating), B = rowSpec(opts.bottom, films, opts.rating);
    var pace = opts.pace || 1;
    var wrap = el("div", "nt-wrap nt-stackw" + (opts.size ? " nt-" + opts.size : ""));
    var layer = el("div", "nt-fly");
    var sumHead = hasSum ? el("th", "nt-sumh") : null, sumText = sumHead ? el("span", "nt-hl", opts.sumLabel || "") : null;
    if (sumHead) sumHead.appendChild(sumText);
    var t = tableShell("nt-stack", films, opts.heads, sumHead ? [sumHead] : []);
    t.dataset.n = String(n);
    var tb = el("tbody"), top = el("tr", "nt-row nt-top");
    if (A.p) top.dataset.p = A.p;
    top.appendChild(whoCell(A));
    var topTd = films.map(function (f, j) {
      var td = el("td", "rt-c nt-c");
      td.dataset.f = f;
      td.appendChild(cell(A.values[j]));
      top.appendChild(td);
      return td;
    });
    if (hasSum) top.appendChild(el("td", "nt-sumcol"));
    var W = workRows(n, hasSum, 0);
    W.rlab.textContent = opts.resLabel || "";
    if (B.p) W.bot.dataset.p = B.p;
    tb.appendChild(top);
    tb.appendChild(W.bot);
    tb.appendChild(W.res);
    t.appendChild(tb);
    wrap.appendChild(t);
    wrap.appendChild(layer);
    var rig = makeRig(layer, topTd, W, n, hasSum);
    loadRig(rig, A.values, B, opts.slots);
    var beats = n + (hasSum ? 1 : 0);
    var R = Runner(), playing = 0, aim = 0;
    function clamp(k) { return Math.max(0, Math.min(beats, k | 0)); }
    function land(k) { drawRig(rig, k); if (typeof api.onbeat === "function") api.onbeat(k); }
    function stepOnce() {
      var k = rig.at;
      if (k >= beats) return Promise.resolve(false);
      R.clear();
      drawRig(rig, k);
      aim = k + 1;
      if (!MOTION || opts.animate === false) { land(k + 1); return Promise.resolve(true); }
      var pr = k < n ? beatProduct(rig, k, R, pace) : beatSum(rig, R, pace);
      return pr.then(function (ok) { if (ok) land(k + 1); return ok; });
    }
    var api = {
      el: wrap, table: t, films: films, n: n, beats: beats,
      top: A, bottom: B, products: rig.prods.slice(), total: hasSum ? rig.total : rig.prods[0],
      onbeat: null,
      get at() { return rig.at; },
      show: function (k) { playing++; R.clear(); aim = clamp(k); drawRig(rig, aim); return api; },
      forward: function () { playing++; return stepOnce(); },
      play: function () {
        var me = ++playing;
        function loop() {
          if (me !== playing) return Promise.resolve(false);
          if (rig.at >= beats) return Promise.resolve(true);
          return stepOnce().then(function (ok) {
            if (!ok || me !== playing) return false;
            if (rig.at >= beats) return true;
            return R.wait(TEMPO.pause * pace).then(function (ok2) { return ok2 && me === playing ? loop() : false; });
          });
        }
        return loop();
      },
      end: function () { return api.show(beats); },
      reset: function () { return api.show(0); },
      replay: function () { api.show(0); return api.play(); },
      stop: function () { playing++; R.clear(); drawRig(rig, Math.max(rig.at, aim)); return api; },
      // Slots: which is a film index (0 for the first film) or "sum".
      slot: function (which) { return rig.slots[key(which)] || null; },
      value: function (which) { return which === "sum" ? rig.total : rig.prods[which]; },
      ask: function (which) {
        Object.keys(rig.slots).forEach(function (w) { rig.slots[w].classList.remove("nt-ask"); });
        for (var j = 0; j < n; j++) hotCol(rig, j, false);
        hotSum(rig, false);
        rig.pcell.forEach(function (c) { c.classList.remove("nt-hot"); });
        rig.asked = which === null || which === undefined ? null : key(which);
        if (rig.asked === null) return api;
        var s = rig.slots[rig.asked];
        if (rig.asked === "sum") {
          hotSum(rig, true);
          rig.W.ph.forEach(function (h) { var c = h.firstChild; if (c && !c.classList.contains("nt-slot")) c.classList.add("nt-hot"); });
        } else hotCol(rig, Number(rig.asked), true);
        if (s && s.classList.contains("nt-slot")) s.classList.add("nt-ask");
        return api;
      },
      answer: function (which, x) {
        var s = rig.slots[key(which)];
        if (!s) return false;
        var right = Number(x) === api.value(which);
        setSlot(s, x, right);
        if (right && rig.asked === key(which)) api.ask(null);
        return right;
      },
      draft: function (which, text) { var s = rig.slots[key(which)]; if (s) draft(s, text); return api; },
      solve: function (which) { var s = rig.slots[key(which)]; if (s) setSlot(s, api.value(which), true); if (rig.asked === key(which)) api.ask(null); return api; },
      clear: function (which) { var s = rig.slots[key(which)]; if (s) setSlot(s, null); return api; },
      answered: function (which) { var s = rig.slots[key(which)]; return !!(s && s.classList.contains("nt-right")); },
      complete: function () { return Object.keys(rig.slots).every(function (w) { return rig.slots[w].classList.contains("nt-right"); }); },
      label: function (text) { if (sumText) sumText.textContent = text || ""; return api; }
    };
    drawRig(rig, 0);
    return api;
  }

  /* 5. THE BOARD of act 4: the newcomer on top, the regulars below, an inner product column, sorting */
  function rowKids(tr) {
    var out = [];
    each(tr.cells, function (c) { each(c.children, function (k) { out.push(k); }); });
    return out;
  }
  function glide(nodes, dy, dur, delay) {
    if (!MOTION || Math.abs(dy) < 1) return;
    nodes.forEach(function (k) {
      anim(k, [{ transform: "translateY(" + dy + "px)" }, { transform: "translateY(0px)" }],
           { duration: dur, easing: "cubic-bezier(.3,.75,.25,1)", delay: delay || 0, fill: "backwards" });
    });
  }
  // Move rows from their old places to their new ones: measure, change, then glide (first, last, invert, play).
  function flipRows(trs, change, dur, stagger) {
    var before = trs.map(function (tr) { return tr.hidden ? null : tr.getBoundingClientRect().top; });
    change();
    trs.forEach(function (tr, i) {
      if (before[i] === null || tr.hidden) return;
      glide(rowKids(tr).concat(tr.cells.length === 1 ? [tr.cells[0]] : []), before[i] - tr.getBoundingClientRect().top, dur, (stagger || 0) * i);
    });
  }

  function board(opts) {
    opts = opts || {};
    var films = opts.films.slice(), n = films.length, more = (opts.more || []).slice();
    var top = opts.top, people = opts.people.slice();
    var t = S.table({ people: people, films: films.concat(more), newcomer: top, newcomerFirst: true, heads: opts.heads,
                      hide: function (p, f) { return S.rating(p, f) === null; } });
    t.classList.add("nt-tab", "nt-board");
    var wrap = el("div", "nt-wrap nt-boardw"), layer = el("div", "nt-fly");
    wrap.appendChild(t);
    wrap.appendChild(layer);
    var hr = t.tHead.rows[0];
    var iph = el("th", "nt-iph");
    iph.appendChild(el("span", "nt-hl", opts.sumLabel === undefined ? WORDS.name : opts.sumLabel));
    iph.scope = "col";
    hr.insertBefore(iph, hr.cells[1 + n] || null);
    var tb = t.tBodies[0], rows = {}, ipTd = {}, gap = null;
    Array.prototype.slice.call(tb.rows).forEach(function (tr) {
      var p = tr.dataset.p;
      if (!p) { gap = tr; tr.cells[0].colSpan = 2 + n + more.length; return; }
      rows[p] = tr;
      var td = el("td", "nt-ip");
      td.dataset.p = p;
      tr.insertBefore(td, tr.cells[1 + n] || null);
      ipTd[p] = td;
    });
    rows[top].classList.add("nt-row", "nt-top");
    var W = workRows(n, true, more.length);
    W.bot.classList.add("nt-band");
    W.res.classList.add("nt-band");
    tb.insertBefore(W.bot, gap);
    tb.insertBefore(W.res, gap);
    var topTd = films.map(function (f) { return rows[top].querySelector('td[data-f="' + f + '"]'); });
    var rig = makeRig(layer, topTd, W, n, true);
    var topVals = films.map(function (f) { return S.rating(top, f); });
    var IP = {};
    people.forEach(function (p) { IP[p] = S.inner(p, top, films); });
    var RANKED = people.slice().sort(function (a, b) { return IP[b] - IP[a]; });
    var R = Runner(), job = 0;
    // The whole state; draw() puts it on screen at once, the live methods animate toward it.
    var st = { numbers: !opts.marks, done: {}, focus: null, band: false, sorted: false };

    function setNumbers(on) {
      if (on) convert(t, { animate: false, measure: false });
      else unconvert(t);
    }
    function setBand(open) { W.bot.hidden = !open; W.res.hidden = !open; }
    function setFocus(p) {
      people.forEach(function (q) { rows[q].classList.toggle("nt-src", q === p); });
      if (!p) {
        W.bot.classList.add("nt-empty");
        W.res.classList.add("nt-empty");
        loadRig(rig, topVals, rowSpec(people[0], films));
        drawRig(rig, 0);
        return;
      }
      W.bot.classList.remove("nt-empty");
      W.res.classList.remove("nt-empty");
      loadRig(rig, topVals, rowSpec(p, films));
    }
    function setDone() {
      people.forEach(function (p) {
        // show(): a reveal cut short leaves no number hidden
        if (st.done[p]) { if (!ipTd[p].firstChild) fill(ipTd[p], IP[p]); show(ipTd[p].firstChild, true); }
        else ipTd[p].textContent = "";
      });
    }
    function setOrder() {
      (st.sorted ? RANKED : people).forEach(function (p) { tb.appendChild(rows[p]); });
      people.forEach(function (p) { rows[p].classList.toggle("nt-best", st.sorted && p === RANKED[0]); });
      wrap.classList.toggle("nt-sorted", st.sorted);
    }
    function draw() {
      R.clear();
      clearLayer(layer);
      stopAnims(t, true);
      wrap.classList.remove("nt-busy");
      setNumbers(st.numbers);
      setBand(st.band);
      setFocus(st.focus);
      if (st.focus) drawRig(rig, n + 1);
      setDone();
      setOrder();
    }
    function regs() { return people.map(function (p) { return rows[p]; }).concat(gap ? [gap] : []); }
    function openBand(animate) {
      if (st.band) return Promise.resolve(true);
      st.band = true;
      if (!animate || !MOTION) { setBand(true); return Promise.resolve(true); }
      flipRows(regs(), function () { setBand(true); }, TEMPO.rise * 0.7);
      return R.wait(TEMPO.rise * 0.7);
    }
    // The regular's numbers rise from their row to the place right under the newcomer.
    function rise(p, pace) {
      st.focus = p;
      setFocus(p);
      drawRig(rig, 0);
      if (!MOTION) return Promise.resolve(true);
      var src = rows[p], dur = TEMPO.rise * pace;
      var from = [src.cells[0]].concat(films.map(function (f) { return src.querySelector('td[data-f="' + f + '"]'); }));
      var to = [W.who].concat(W.botTd);
      to.forEach(function (td, i) {
        var a = from[i].getBoundingClientRect(), b = td.getBoundingClientRect();
        var kids = i === 0 ? [td.firstChild] : [W.bh[i - 1]];
        glide(kids, (a.top + a.height / 2) - (b.top + b.height / 2), dur, i * 60 * pace);
      });
      return R.wait(dur + films.length * 60 * pace);
    }
    function beats(pace) {
      var k = 0;
      function next() {
        if (k > n) return Promise.resolve(true);
        var pr = k < n ? beatProduct(rig, k, R, pace) : beatSum(rig, R, pace);
        var kk = k;
        return pr.then(function (ok) {
          if (!ok) return false;
          drawRig(rig, kk + 1);
          k++;
          if (k > n) return true;
          return R.wait(TEMPO.pause * pace * 0.6).then(function (ok2) { return ok2 ? next() : false; });
        });
      }
      return next();
    }
    // The sum travels down into the regular's inner product cell.
    function landSum(p, pace) {
      var dur = TEMPO.land * pace;
      fly(layer, rig.sumCell, ipTd[p], dur, { arc: 0 });
      return R.run([[dur, function () {
        st.done[p] = true;
        fill(ipTd[p], IP[p]);
        flash(ipTd[p].firstChild, "pop", 520 * pace);
      }]], dur);
    }
    // One regular's inner product, live: the band opens, the row rises, the products flow, the sum lands.
    // me is the job it belongs to: anything that starts another job (show, sort, stop, ...) cuts it short.
    function computeRow(p, pace, me, animate) {
      R.clear();
      clearLayer(layer);
      if (st.sorted) { st.sorted = false; setOrder(); }
      if (!st.numbers) { st.numbers = true; setNumbers(true); }
      if (!MOTION || animate === false) {
        st.band = true; st.focus = p; st.done[p] = true;
        draw();
        return Promise.resolve(true);
      }
      target = p;
      wrap.classList.add("nt-busy");
      function alive(ok) { return ok && me === job; }
      return openBand(true)
        .then(function (ok) { return alive(ok) ? rise(p, pace) : false; })
        .then(function (ok) { return alive(ok) ? R.wait(TEMPO.pause * pace * 0.5) : false; })
        .then(function (ok) { return alive(ok) ? beats(pace) : false; })
        .then(function (ok) { return alive(ok) ? landSum(p, pace) : false; })
        .then(function (ok) {

          return alive(ok);
        });
    }
    var target = null;
    function compute(p, o) { o = o || {}; return computeRow(p, o.pace || 1, ++job, o.animate); }
    var api = {
      el: wrap, table: t, films: films, people: people, top: top, ip: IP, ranked: RANKED,
      row: function (p) { return rows[p]; },
      cell: function (p, f) { return rows[p] ? rows[p].querySelector('td[data-f="' + f + '"]') : null; },
      ipCell: function (p) { return ipTd[p] || null; },
      state: function () { return { numbers: st.numbers, done: people.filter(function (p) { return st.done[p]; }),
                                    focus: st.focus, band: st.band, sorted: st.sorted }; },
      // s: { numbers, done (a count in table order, or a list of ids), focus, band, sorted }; missing keys keep
      // their value. focus defaults to the last row done while the band is open.
      show: function (s) {
        job++;
        s = s || {};
        if (s.numbers !== undefined) st.numbers = !!s.numbers;
        if (s.done !== undefined) {
          st.done = {};
          var list = typeof s.done === "number" ? people.slice(0, s.done) : s.done;
          list.forEach(function (p) { st.done[p] = true; });
          if (s.focus === undefined) st.focus = list.length ? list[list.length - 1] : null;
        }
        if (s.focus !== undefined) st.focus = s.focus;
        if (s.band !== undefined) st.band = !!s.band;
        else if (s.done !== undefined) st.band = !!st.focus && !s.sorted;
        if (s.sorted !== undefined) st.sorted = !!s.sorted;
        if (st.sorted) { st.band = false; st.focus = null; }
        if (!st.band) st.focus = null;
        target = null;
        draw();
        return api;
      },
      convert: function (o) {
        o = o || {};
        job++;
        st.numbers = true;
        return convert(t, { animate: o.animate, pace: o.pace, measure: false, stagger: o.stagger });
      },
      marks: function () { job++; st.numbers = false; draw(); return api; },
      band: function (open, animate) {

        if (open) return openBand(animate !== false);

        st.focus = null;
        if (animate === false || !MOTION) { draw(); return Promise.resolve(true); }
        flipRows(regs(), function () { setFocus(null); setBand(false); }, TEMPO.rise * 0.7);
        return R.wait(TEMPO.rise * 0.7);
      },
      compute: compute,
      // o.first: the pace of the first row (default 1), o.rest: the pace of the others (default 0.4).
      computeAll: function (o) {
        o = o || {};
        var me = ++job, list = people.filter(function (p) { return !st.done[p]; }), i = 0;
        var first = o.first || 1, rest = o.rest || 0.4;
        function next() {
          if (me !== job) return Promise.resolve(false);
          if (i >= list.length) return Promise.resolve(true);
          var p = list[i], pace = i === 0 ? first : rest;
          i++;
          return computeRow(p, pace, me, o.animate).then(function (ok) {
            if (!ok || me !== job) return false;
            if (i >= list.length) return true;
            return R.wait(TEMPO.pause * rest).then(function (ok2) { return ok2 ? next() : false; });
          });
        }
        return next();
      },
      sort: function (animate) {
        job++;
        R.clear();
        clearLayer(layer);
        people.forEach(function (p) { st.done[p] = true; });
        setDone();
        if (!st.numbers) { st.numbers = true; setNumbers(true); }
        st.sorted = true; st.band = false; st.focus = null;
        if (animate === false || !MOTION) { draw(); return Promise.resolve(true); }
        flipRows(regs(), function () { setFocus(null); setBand(false); setOrder(); }, TEMPO.sort, 45);
        return R.wait(TEMPO.sort + 45 * people.length);
      },
      unsort: function () { return api.show({ sorted: false }); },
      // After the lesson: every inner product appears in its row, top to bottom, with no band, no products and no
      // sum on the move (Carlos, 2026-11-06: "Don't calculate it in front of the participants"). The state is the
      // end state at once and only the appearance is timed, so a new step or stop() shows every number. Promise.
      reveal: function (o) {
        o = o || {};
        job++;
        people.forEach(function (p) { st.done[p] = true; });
        st.numbers = true;
        st.band = false;
        st.focus = null;
        target = null;
        draw();
        if (o.animate === false || !MOTION) return Promise.resolve(true);
        var gap = TEMPO.reveal * (o.pace || 1);
        var cells = (st.sorted ? RANKED : people).map(function (p) { return ipTd[p].firstChild; });
        cells.forEach(function (c) { show(c, false); });
        return R.run(cells.map(function (c, i) {
          return [i * gap, function () { show(c, true); flash(c, "pop", 520); }];
        }), (cells.length - 1) * gap + 520);
      },
      // Cut any motion short and show where it was going.
      stop: function () {
        job++;
        R.clear();
        if (target) { st.band = true; st.focus = target; st.done[target] = true; target = null; }
        draw();
        return api;
      }
    };
    draw();
    return api;
  }

  /* SCREENSHOT TOOL: hold every motion where it is (timers stop acting, animations pause). Not for scenes. */
  // Timers run on the browser's clock, animations on its frames; a headless browser with a virtual time budget
  // moves the first much faster than the second. So every motion of the notation is put where the clock says it
  // should be, and any other motion of the page (the leaf coming in, for example) is finished.
  function freeze() {
    FROZEN = true;
    var now = performance.now();
    var all = [];
    try { all = document.getAnimations(); } catch (e) {}
    all.forEach(function (a) {
      var mine = null;
      for (var i = 0; i < STARTED.length; i++) if (STARTED[i].a === a) { mine = STARTED[i]; break; }
      try {
        if (mine) { a.pause(); a.currentTime = Math.max(0, now - mine.t); }
        else a.finish();
      } catch (e) {}
    });
  }

  S.N = {
    TIMES: TIMES, PLUS: PLUS, EQUALS: EQUALS, WORDS: WORDS, TEMPO: TEMPO,
    tone: tone, cell: cell, setCell: setCell, slot: slot, setSlot: setSlot, draft: draft, fill: fill, legend: legend,
    convert: convert, unconvert: unconvert,
    vector: vector, stack: stack, board: board,
    freeze: freeze
  };
})();
</script>
<script>
/* Act 1 of Once Upon a Video Store, "Ticks and crosses". Owner: agent 1. Class names start with a1-.
   store     the title screen, the store's four films, the round 1 table, then the two kinds of customer
   newcomer  Zoe and the quiz "Will Zoe like Love Actually?"; the reason, the method, what a computer sees
   similar   the quiz "What measures how similar two customers are?", Zoe's matches counted cell by cell,
             the prediction from her nearest neighbours, and what Zoe said once she had seen the film
   numbers   a tick is 1 and a cross is minus 1; then the marks of the table fold away and numbers take their place.
             Since version 4 (Carlos, 2026-11-10) it is the FIRST scene of act 2, "Converting ratings into numbers":
             act 1 introduces the method in ticks and crosses and ends with the recipe. Its code stays here because it
             uses act 1's table and styles; this file loads before act2.js, so it comes first in act 2.
   A quiz shows its answer after the participant's own pick; moving past the quiz with Next shows it as well. */
(function () {
  "use strict";
  var S = window.Store;
  var el = S.el;
  var motion = !S.reducedMotion;

  var R1 = S.ROUND1;
  var REG = R1.people;                                   // Lea, Max, Nina, Omar
  var FILMS = R1.films;                                  // Jaws, The Shining, Notting Hill, Love Actually
  var ZOE = R1.newcomer;
  var UNSEEN = R1.unseen;                                // Love Actually, the film Zoe has not seen
  var SEEN = FILMS.filter(function (f) { return f !== UNSEEN; });
  var SCARY = ["jaws", "shining"], LOVE = ["notting", "love"];
  // The two kinds of customer, read off the data: the regulars who like the scary films, and the others.
  var KIND_A = REG.filter(function (p) { return S.rating(p, SCARY[0]) > 0; });
  var KIND_B = REG.filter(function (p) { return KIND_A.indexOf(p) < 0; });
  // Zoe's look-alikes: the regulars who rate every film she has seen exactly as she does (Max and Omar).
  var TWINS = REG.filter(function (p) { return S.matches(ZOE, p, SEEN) === SEEN.length; });
  var OTHERS = REG.filter(function (p) { return TWINS.indexOf(p) < 0; });
  var PRED = S.rating(TWINS[0], UNSEEN);                 // their verdict on Love Actually: a tick
  var LATER = S.LATER[ZOE][UNSEEN];                      // what Zoe said once she had watched it

  /* Small helpers of this act */
  function nm(id) { return S.get(id).n; }
  function pair(ids) { return ids.map(nm).join(" and "); }
  function zoeUnseen(p, f) { return p === ZOE && f === UNSEEN; }
  function each(list, fn) { Array.prototype.forEach.call(list, fn); }

    leave: function () { stopTimers(); },
    step: function (k) {
      stopTimers();

      SI.last = k;

  /* 4. numbers (act 2, its first scene): a tick is 1 and a cross is minus 1; then the marks leave the table and the
     numbers take their place.
     The key and the wave are the notation's (Store.N): the key draws each mark, "=", its number in its badge, and
     N.convert folds every mark of the table away and unfolds its number, in the mark's colours, diagonal by diagonal.

  var NUM_Q = [
    ["A computer works with numbers.", "Which number for a tick, and which for a cross?"],
    ["The natural choice:", "a tick is 1, a cross is " + S.num(-1) + "."],
    ["The ticks and crosses are gone.", "The computer sees only numbers."]

  var NUM_NOTE = [
    "",
    "Opposite opinions get opposite numbers. A cross is an opinion too: the customer watched the film and disliked it.",

    act: 2,
    title: "Ticks and crosses become numbers",
    steps: 3,

      var note = el("p", "a1-mnote");

      map.appendChild(q);
      map.appendChild(key);
      map.appendChild(note);
      map.appendChild(again);

                         rating: function (p, f) { return zoeUnseen(p, f) ? LATER : S.rating(p, f); } });
      var tw = el("div", "a1-twrap");
      tw.appendChild(t);
      root.appendChild(map);
      root.appendChild(tw);

    },
    enter: function () { if (NU) NU.last = null; },
    leave: function () { if (NU) stopWave(true); },
    step: function (k) {
      var was = NU.last;
      NU.last = k;
      NU.root.dataset.k = String(k);
      NU.q.textContent = "";
      NUM_Q[k].forEach(function (line) { NU.q.appendChild(el("span", "a1-line", line)); });
      NU.note.textContent = NUM_NOTE[k];
      if (motion && was !== null && was !== k) { replay(NU.q, "a1-in"); replay(NU.note, "a1-in"); }
      // The key: "?" in the notation's slots until the numbers are chosen; they pop in when Next reveals them.
      NU.nums.forEach(function (c) {

        else { c.classList.remove("nt-slot", "nt-right"); S.N.setCell(c, r); }
      });

      stopWave(false);
      S.N.unconvert(NU.t);
      if (k !== 2) return;
      if (was === 1 && motion) NU.timer = setTimeout(function () { NU.timer = 0; wave(true); }, WAVE_LEAD);
      else wave(false);
    }
  });
})();

<script>
/* Act 2 of Once Upon a Video Store: Converting ratings into numbers ("Shades of opinion" until version 4).

             once (2, 1, 0, -1, -2); five customers rate Jaws, one mark each; then why counting exact matches breaks:
             Pia and Kai, Pia and Rosa, the same count for a pair that agrees and for a pair that is opposite.
     twin    the six regulars and Vera on three films, marks only. Tap the customer most similar to Vera (Kai); then

(function () {

  /* SMALL HELPERS */
  function put(parent, parts) {

  }
  // The customer of the shades line who gave Jaws the mark r.

  /* SCENE: shades. The card is a grid of five columns, love on the left and hate on the right, built row by row so

     customers (step 4). Steps 5 and 6 swap the card for two pairs of customers on Jaws. */
  var SHD = { last: null };
  var STARS = { "2": 5, "1": 4, "0": 3, "-1": 2, "-2": 1 };    // the natural mapping: five stars are two ticks
  var SHADES_TITLE = ["From stars to numbers", "From stars to numbers", "From stars to numbers",
                      "Five marks", "Five marks", "Five marks"];
  var SHADES_SAY = [
    function () { return ["People often rate a film on ", b("five levels"), ", from loved it to hated it, drawn as stars."]; },
    function () { return ["The video store draws the same five levels as ", b("marks"), "."]; },
    function () { return ["Each mark becomes a ", b("number"), ". The stronger the opinion, the further from 0: above 0 for liking, below 0 for disliking."]; },
    function () { return ["Five customers rate ", b("Jaws"), ", and each of them picks a different mark."]; },
    function () { return ["Counting exact matches gives both pairs the same score: ", b("no match"), "."]; },
    function () { return ["One pair agrees, the other is opposite, and counting gives both the same 0."]; }
  ];
  var SHADES_BIG = [null, null, null, null,
    function () { return ["Are the two pairs equally similar?"]; },
    function () { return [el("span", "a2-line", "Counting cannot see shades."), make("span", "a2-line", ["We need a ", b("better measure"), " of similarity."])]; }
  ];
  // n of five stars, the rest drawn empty. Drawn here: a star is a rating's picture, never a number.
  var SVGNS = "http://www.w3.org/2000/svg";
  var STAR_D = "M12 2L14.59 9.04L22.08 9.33L16.19 13.96L18.23 21.18L12 17L5.77 21.18L7.81 13.96L1.92 9.33L9.41 9.04Z";

  function pairCard(a, c, agree) {
    var sec = el("section", "a2-pair " + (agree ? "agree" : "oppose"));
    var two = el("div", "a2-pair-who");
    [a, c].forEach(function (p) {
      var r = S.rating(p, SH.film);
      two.appendChild(make("div", "a2-pr", [S.chip(p), quietVote(r), el("span", "a2-pr-w", S.word(r))]));
    });
    sec.appendChild(two);
    sec.appendChild(make("p", "a2-cnt", [el("span", "a2-cnt-q", "Same mark?"), b("No", "a2-cnt-a"),

  S.define("shades", {
    act: 2,

    build: function (inner) {

      S.LEVELS.forEach(function (r, i) {

      });
      card.appendChild(grid);

      SHD.pairs = el("div", "a2-pairs");
      SHD.pairs.appendChild(pairCard("pia", "kai", true));
      SHD.pairs.appendChild(pairCard("pia", "rosa", false));
      SHD.big = el("p", "a2-big");

      put(root, [SHD.say, card, SHD.pairs, SHD.big]);
      inner.appendChild(root);
    },
    enter: function () { SHD.last = null; },
    step: function (k, api) {
      var from = SHD.last;
      SHD.last = k;
      api.setTitle(SHADES_TITLE[k]);
      SHD.root.dataset.k = String(k);
      SHD.card.hidden = k >= 4;
      SHD.pairs.hidden = k < 4;
      SHD.big.hidden = k < 4;
      setText(SHD.say, SHADES_SAY[k]());
      if (SHADES_BIG[k]) setText(SHD.big, SHADES_BIG[k]());
      // Each new row pops in, column by column, when Next brings it.
      SHD.root.classList.remove("a2-popm", "a2-popn", "a2-pop");
      if (motion && from === k - 1) {
        if (k === 1) replay(SHD.root, "a2-popm");
        if (k === 2) replay(SHD.root, "a2-popn");

  var TW = { k: 0, pick: null, why: null };
  var WHYNOT = {
    ivo: ["Ivo loved Jaws, like Vera, but he hated The Shining, which she liked."],
    pia: ["Pia gives Vera's exact marks on Jaws and The Shining, but she ", b("loves Notting Hill"), ", which Vera dislikes."],
    tom: ["Tom disliked Jaws and hated The Shining, and Vera enjoyed both. They agree only on Notting Hill."],
    jana: ["Jana shares Vera's tick for The Shining. On the other two films she is neutral, so she tells us little."],
    rosa: ["Rosa is Vera's opposite: she hated Jaws, disliked The Shining and loved Notting Hill."]
  };
  var WHY = [
    { t: "Kai gives the same marks as Vera on the most films.", ok: false,
      fb: ["Kai gives Vera's exact mark on ", b("no film"), ". Pia does on two, and she loves Notting Hill, which Vera dislikes."] },
    { t: "Kai likes what Vera likes and dislikes what Vera dislikes. Only how strongly differs.", ok: true,

  function outBox(waitText, onHide) {

  }

  function renderPick(fresh) {
    var p = TW.pick, done = p !== null;
    var right = p === TWIN;

  }

  S.define("twin", {
    act: 2,

        TW.pick = tr.dataset.p;
        renderPick(true);

      });
      var tw = el("div", "a2-tw-table");
      tw.appendChild(t);

      TW.q1 = el("div", "a2-qbox a2-q1");
      TW.q1.appendChild(make("h3", "a2-q", ["Who is most similar to ", b("Vera"), "?"]));
      TW.q1.appendChild(el("p", "a2-hint", "Tap a customer in the table."));
      TW.o1 = outBox("The answer appears after your tap.", function () {

      TW.q1.appendChild(TW.o1.box);

      TW.q2 = el("div", "a2-qbox a2-q2");
      TW.q2.appendChild(make("h3", "a2-q", ["Why ", b("Kai"), "?"]));

      TW.opts = WHY.map(function (w, i) {

        bt.appendChild(el("span", "a2-opt-l", String.fromCharCode(65 + i)));
        bt.appendChild(el("span", "a2-opt-t", w.t));
        bt.addEventListener("click", function () {

      TW.q2.appendChild(opts);
      TW.o2 = outBox("The answer appears after your choice.", function () {

      var br = el("div", "a2-bridge");

      br.appendChild(cmps);

    step: function (k) {

      TW.root.dataset.k = String(k);
      TW.main.hidden = k === 2;
      TW.bridge.hidden = k !== 2;
      TW.q1.hidden = k !== 0;

<script>
/* Act 3, "With numbers": the inner product, taught slowly.
   Round 2 (2026-11-03), Carlos on version 1: "we are not going to make a game here. We're going to teach them." So
   the scenes show worked examples, then the participants work the next ones and enter only the results.
   Version 4 (Carlos, 2026-11-10): act 2 turns the marks into numbers, so this act starts with the agreement on one
   film. The room says yes or no for five pairs, names the operation, and only then sees the products.

   Scene onefilm, "How much do they agree?"
     step 1         five pairs on Jaws side by side (Store.EXAMPLES.one.pairs), a Yes or No box under each, and
                    Reveal all. An answer takes the colour of its pair's product, in three strengths (1, 2 and 4,
                    the last drawn solid), while the product itself stays hidden.
     step 2         "Which arithmetic operation helps to measure agreement?" and the four operations to tap
     step 3         the × is the answer: it appears in each pair, and the products come out one pair after
                    another, between the pair and its answer, in the colour of the answer
     steps 4, 5     your turn (EXAMPLES.one.yours): the product is a slot, answered on a keypad of results
     step 6         the rule: four small stacks, each with its example (EXAMPLES.one.rule)
   Scene twofilms, "And with two films?"
     step 1         each customer is a row of two numbers
     steps 2 to 4   worked examples (EXAMPLES.two.shown). Each stack waits with its numbers until Compute is
                    pressed, so the room guesses first (version 4); then it plays beat by beat, a line per beat.
     steps 5 to 7   your turn (EXAMPLES.two.yours): both products and the sum are slots, answered in order
     step 8         the name, the inner product, and one three-film stack played once

   Every number, row, stack and slot is drawn by Store.N (notation.js; see NOTATION.md); this file arranges them
   and writes the words. The lines that read a result are made from the ratings, so they stay true to the data.
   A motion plays only when its step is reached from the step before; every other arrival draws the end state at
   once, and leaving a scene stops every timer. */
(function () {
  "use strict";
  var S = window.Store;
  if (!S || !S.N) return;
  var N = S.N, el = S.el, num = S.num, M = S.MINUS;
  var MOTION = !S.reducedMotion;

  /* SMALL TOOLS */
  function h(tag, cls, kids) {
    var e = el(tag, cls);
    (kids || []).forEach(function (k) {
      if (k === null || k === undefined) return;
      e.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
    });
    return e;
  }
  function b(text) { return el("b", "", text); }
  function nm(id) { return S.get(id).n; }
  function ft(id) { return S.get(id).t; }
  function and(words) {
    return words.length < 2 ? (words[0] || "") : words.slice(0, -1).join(", ") + " and " + words[words.length - 1];
  }
  function count(n) { return ["no", "one", "two", "three", "four", "five"][n] || String(n); }
  function button(text, cls, fn) {
    var x = el("button", "btn" + (cls ? " " + cls : ""), text);
    x.type = "button";
    x.addEventListener("click", fn);
    return x;
  }
  // Timers of a scene that one call cancels: wait() resolves false once stop() has been called.
  function Seq() {
    var q = { tok: 0, timers: [] };
    q.stop = function () { q.tok++; q.timers.forEach(clearTimeout); q.timers = []; };
    q.wait = function (ms) {
      var t = q.tok;
      return new Promise(function (res) { q.timers.push(setTimeout(function () { res(t === q.tok); }, ms)); });
    };
    return q;
  }
  // A short motion of a button or a box: "pop" for a right answer, "shake" for a wrong one.
  function bump(node, kind) {
    if (!MOTION || !node || !node.animate) return;
    var k = kind === "shake"
      ? [{ transform: "translateX(0px)" }, { transform: "translateX(-6px)" }, { transform: "translateX(5px)" },
         { transform: "translateX(-3px)" }, { transform: "translateX(0px)" }]
      : [{ transform: "scale(1)" }, { transform: "scale(1.12)" }, { transform: "scale(1)" }];
    node.animate(k, { duration: kind === "shake" ? 420 : 480, easing: "ease" });
  }

  /* WORDS THAT READ A RESULT, made from the ratings */
  var VERB = { "2": "loved", "1": "liked", "-1": "disliked", "-2": "hated" };
  // One film: what the product says about the two customers.
  function readOne(a, c, f) {
    var ra = S.rating(a, f), rc = S.rating(c, f), F = ft(f), s;
    if (ra === 0 && rc === 0) return "Neither " + nm(a) + " nor " + nm(c) + " has an opinion on " + F + ": we cannot tell, so the number is 0.";
    if (ra === 0 || rc === 0) return nm(ra === 0 ? a : c) + " has no opinion on " + F + ": we cannot tell, so the number is 0.";
    var who = nm(a) + " " + VERB[ra] + " " + F + " and " + nm(c) + " " + VERB[rc] + " it";
    if (ra * rc < 0) s = who + ": they disagree, so the number is negative.";
    else if (ra < 0) s = who + ". Both dislike it, so they agree and the number is positive.";
    else s = who + ": they agree, so the number is positive.";
    var strong = [a, c].filter(function (x) { return Math.abs(S.rating(x, f)) === 2; });
    if (strong.length === 2) s += " Both feel strongly, so the number is far from 0.";
    else if (strong.length === 1) s += " " + nm(strong[0]) + " " + VERB[S.rating(strong[0], f)] + " it, so the number is further from 0.";
    return s;
  }
  // Several films: which films they agree on, which they disagree on, and what the sum makes of it.
  function readMany(a, c, films) {
    var agree = [], dis = [], out = [], all = films.length, sum = S.inner(a, c, films);
    films.forEach(function (f) {
      var ra = S.rating(a, f), rc = S.rating(c, f), p = ra * rc;
      if (p > 0) agree.push(f);
      else if (p < 0) dis.push(f);
      else out.push((ra === 0 && rc === 0 ? "Neither has an opinion on " + ft(f) : nm(ra === 0 ? a : c) + " has no opinion on " + ft(f)) +
                    ", so " + ft(f) + " adds 0.");
    });
    function on(fs) { return fs.length === all ? (all === 2 ? "both films" : "all " + count(all) + " films") : and(fs.map(ft)); }
    if (agree.length && !dis.length) {
      out.push(S.rating(a, agree[0]) < 0 && agree.every(function (f) { return S.rating(a, f) < 0; })
        ? "Both dislike " + on(agree) + ": they agree, so the sum is positive."
        : "They agree on " + on(agree) + ", so the sum is positive.");
    } else if (dis.length && !agree.length) out.push("They disagree on " + on(dis) + ", so the sum is negative.");
    else if (agree.length) {
      out.push("They agree on " + and(agree.map(ft)) + " and disagree on " + and(dis.map(ft)) + ". The sum weighs both: " +
        (sum > 0 ? "the agreement is stronger, so it is positive." : sum < 0 ? "the disagreement is stronger, so it is negative."
                 : "they cancel out, so it is 0."));
    } else out.push("So the sum is 0.");
    return out.join(" ");
  }
  function readStack(st) {
    return st.n === 1 ? readOne(st.top.p, st.bottom.p, st.films[0]) : readMany(st.top.p, st.bottom.p, st.films);
  }
  // The words said while beat k of a stack plays (k counts from 0).
  function cue(st, k) {
    return k < st.n ? ft(st.films[k]) + ": multiply the two numbers." : "Add the " + count(st.n) + " products.";
  }

  /* A WORKED EXAMPLE: a stack, a line under it (the beats as they play, then the reading), and Replay */
  function Shown(Q, pair, films, opts) {
    var X = { Q: Q };
    X.st = N.stack({ top: pair[0], bottom: pair[1], films: films, size: opts.size, sumLabel: opts.sumLabel || "",
                     resLabel: films.length === 1 ? "agree" : "" });
    X.line = el("p", "a3-read");
    X.replay = button("Replay", "quiet a3-replay", function () { Q.stop(); play(X, 250); });
    X.box = h("div", "a3-stage", [X.st.el]);
    return X;
  }
  function say(X, text, isCue) {
    X.line.textContent = text;
    X.line.classList.toggle("a3-cue", !!isCue);
  }
  function endState(X) { X.st.end(); say(X, readStack(X.st)); }
  // Play the beats one at a time, each announced by its line, with a calm pause in between.
  function play(X, delay) {
    var Q = X.Q, st = X.st;
    if (!MOTION) { endState(X); return; }
    st.show(0);
    say(X, "", true);
    function beat() {
      if (st.at >= st.beats) { say(X, readStack(st)); return; }
      say(X, cue(st, st.at), true);
      st.forward().then(function (ok) {
        if (!ok) return;
        if (st.at >= st.beats) { say(X, readStack(st)); return; }
        Q.wait(N.TEMPO.pause + 500).then(function (go) { if (go) beat(); });
      });
    }
    Q.wait(delay).then(function (go) { if (go) beat(); });
  }

  /* YOUR TURN: a stack whose results are slots, answered in order on a keypad of results (or typed) */
  var RANGE = (function () {
    var lo = -4, hi = 4;
    [S.EXAMPLES.one, S.EXAMPLES.two].forEach(function (E) {
      E.yours.forEach(function (pr) {
        E.films.map(function (f) { return S.rating(pr[0], f) * S.rating(pr[1], f); })
          .concat([S.inner(pr[0], pr[1], E.films)])
          .forEach(function (x) { lo = Math.min(lo, x); hi = Math.max(hi, x); });
      });
    });
    return { lo: lo, hi: hi };
  })();
  function keypad(onPick) {
    var g = el("div", "a3-pad");
    g.setAttribute("role", "group");
    g.setAttribute("aria-label", "Your answer");
    for (var x = RANGE.lo; x <= RANGE.hi; x++) {
      (function (v) {
        var k = el("button", "a3-key");
        k.type = "button";
        k.setAttribute("aria-label", S.spoken(v));
        k.appendChild(N.cell(v));
        k.addEventListener("click", function () { onPick(v); });
        g.appendChild(k);
      })(x);
    }
    return g;
  }
  function Yours(pair, films) {
    var Y = { films: films, tries: 0, minus: false };
    Y.order = films.length > 1 ? films.map(function (f, j) { return j; }).concat(["sum"]) : [0];
    Y.st = N.stack({ top: pair[0], bottom: pair[1], films: films, slots: Y.order, size: "lg",
                     resLabel: films.length === 1 ? "agree" : "" });
    Y.text = el("p", "a3-fbt");
    Y.showme = button("Show me", "quiet a3-showme", function () { solve(Y); });
    Y.fb = h("div", "a3-fb", [Y.text, Y.showme]);
    Y.pad = keypad(function (x) { pick(Y, x); });
    Y.box = h("div", "a3-stage", [Y.st.el]);
    return Y;
  }
  function asked(Y) {
    for (var i = 0; i < Y.order.length; i++) if (!Y.st.answered(Y.order[i])) return Y.order[i];
    return null;
  }
  function askText(Y, w) {
    if (w === "sum") return "Now add the " + count(Y.st.n) + " products.";
    return Y.st.n === 1 ? "Multiply the two numbers and tap the product." : ft(Y.films[w]) + ": multiply the two numbers.";
  }
  // A hint points at the numbers to multiply or to add, never at the result.
  function hintText(Y, w) {
    var st = Y.st;
    if (w === "sum") return "Not quite. Add the " + count(st.n) + " products, " + and(st.products.map(num)) + ".";
    return "Not quite. Multiply " + st.top.label + "'s " + num(st.top.values[w]) + " by " + st.bottom.label + "'s " +
      num(st.bottom.values[w]) + (st.n > 1 ? ", the two numbers on " + ft(Y.films[w]) : "") + ".";
  }
  // The asked slot, the keypad and the words, from the answers so far.
  function paint(Y, note) {
    var w = asked(Y), done = w === null;
    Y.st.ask(w);
    Y.pad.hidden = done;
    Y.showme.hidden = done || Y.tries === 0;
    Y.fb.classList.toggle("a3-done", done);
    Y.fb.classList.toggle("a3-hint", !done && Y.tries > 0);
    Y.text.textContent = done ? (note ? note + " " : "") + readStack(Y.st)
      : (Y.tries ? hintText(Y, w) : (note ? note + " " : "") + askText(Y, w));
  }
  function pick(Y, x) {
    var w = asked(Y);
    if (w === null) return;
    Y.minus = false;
    if (Y.st.answer(w, x)) { Y.tries = 0; paint(Y, "Right."); }
    else { Y.tries++; paint(Y); }
  }
  function solve(Y) {
    var w = asked(Y);
    if (w === null) return;
    Y.st.solve(w);
    Y.tries = 0;
    Y.minus = false;
    paint(Y);
  }
  function enterYours(Y) {
    Y.minus = false;
    Y.st.end();
    paint(Y);
  }
  // For the presenter: digits answer, a minus first makes the number negative, Backspace takes the minus back.
  function keyYours(Y, e) {
    var w = asked(Y);
    if (w === null) return false;
    var k = e.key;
    if (k === "-" || k === M || k === "Subtract") { Y.minus = true; Y.st.draft(w, M); return true; }
    if (/^[0-9]$/.test(k)) { pick(Y, Y.minus ? -Number(k) : Number(k)); return true; }
    if ((k === "Backspace" || k === "Delete" || k === "Escape") && Y.minus) { Y.minus = false; Y.st.draft(w, ""); return true; }
    return false;
  }

  function kicker(text) { return el("p", "a3-kick", text); }
  function view(cls, kids) { var v = h("div", "a3-view " + cls, kids); v.hidden = true; return v; }

  /* SCENE onefilm */
  var ONE = S.EXAMPLES.one, F1 = ONE.films;
  var O = { last: null, Q: Seq(), cols: [], you: [], views: [] };
  var NPAIR = 3;                                         // the pairs view: the answers, the operation, the products
  var STEPS1 = NPAIR + ONE.yours.length + 1;
  var TIMES = N.TIMES;
  var OPS = [["+", "plus"], [M, "minus"], [TIMES, "times"], ["÷", "divided by"]];
  var CUE1 = "Multiply the two numbers of each pair.";
  var END1 = "Each product matches its answer, in sign and in strength.";
  // The strength of a product in three shades, shared by the product and its answer: 1, 2, and 4 (drawn solid).
  // The five pairs all have an opinion on Jaws, so no product is 0.
  function level(p) { var a = Math.abs(p); return a >= 4 ? 3 : (a >= 2 ? 2 : 1); }

  // A pair: its stack (the numbers only until step 3) and the box for Yes or No under it.
  function pairCol(pair) {
    var C = { pair: pair, p: S.inner(pair[0], pair[1], F1) };
    C.yes = C.p > 0;
    C.st = N.stack({ top: pair[0], bottom: pair[1], films: F1, heads: "none", pace: 0.75 });
    var lv = String(level(C.p));
    Array.prototype.forEach.call(C.st.el.querySelectorAll(".nt-prod"), function (c) { c.dataset.lv = lv; });
    C.ybtn = button("Yes", "a3-yn", function () { answer(C, true); });
    C.nbtn = button("No", "a3-yn", function () { answer(C, false); });
    C.ans = el("span", "a3-ans", C.yes ? "Yes" : "No");
    C.box = h("div", "a3-agree", [C.ybtn, C.nbtn, C.ans]);
    C.box.dataset.lv = lv;
    C.box.dataset.s = C.yes ? "yes" : "no";
    C.box.setAttribute("role", "group");
    C.box.setAttribute("aria-label", "Do " + nm(pair[0]) + " and " + nm(pair[1]) + " agree?");
    C.col = h("div", "a3-col", [C.st.el, C.box]);
    return C;
  }
  function isSet(C) { return C.box.classList.contains("a3-set"); }
  function setAnswer(C, on) {
    C.box.classList.toggle("a3-set", on);
    C.ybtn.classList.remove("a3-miss");
    C.nbtn.classList.remove("a3-miss");
  }
  // A right answer shows in the colour of the product; a wrong one is struck through and waits for the other.
  function answer(C, yes) {
    if (isSet(C)) return;
    if (yes === C.yes) { setAnswer(C, true); bump(C.box, "pop"); }
    else { var x = yes ? C.ybtn : C.nbtn; x.classList.add("a3-miss"); bump(x, "shake"); }
    paintAll();
  }
  function allSet() { return O.cols.every(isSet); }
  function paintAll() { O.all.textContent = allSet() ? "Hide the answers" : "Reveal all"; }
  function revealAll(on) { O.cols.forEach(function (C) { setAnswer(C, on); }); paintAll(); }

  // The four operations. Only the × is right; a wrong one is struck through.
  function opsRow() {
    O.ops = el("div", "a3-ops");
    O.ops.setAttribute("role", "group");
    O.ops.setAttribute("aria-label", "The four operations");
    O.opb = OPS.map(function (o) {
      var x = el("button", "a3-op", o[0]);
      x.type = "button";
      x.setAttribute("aria-label", o[1]);
      x.addEventListener("click", function () { pickOp(x, o[0] === TIMES); });
