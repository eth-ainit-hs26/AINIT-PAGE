<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matchmaker: Gradient Descent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style>
/* Once Upon a Matchmaker (frame copied from Once Upon a Video Store): the shared frame, owned by the main session. Each agent adds its own rules in
   its own stylesheet (sec1.css, ...), with class names that start with its prefix (s1-, ...).
   Codex plates: vellum, a fine double rule, violet rubric, ochre accent. Blue for ticks, orange for crosses,
   grey for the wavy line of neutral. Two marks are drawn stronger than one. */
:root{
  --bg:#F9F4E3;
  --leaf:#FFFBF0;
  --ink:#2A2432;
  --muted:#6B6275;
  --rule:#D8CBA9;
  --rubric:#58409A;
  --ochre:#8F5A06;
  --like:#1E6AAE;
  --like-bg:#E9F1FA;
  --like-bg2:#C9DDF3;
  --dislike:#AE4E18;
  --dislike-bg:#FAEDE3;
  --dislike-bg2:#F2D3BC;
  --serif:"EB Garamond", Garamond, "Iowan Old Style", "Times New Roman", serif;
  --emoji:"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  /* The colours of the guessing diagram and of section 3 (GUESS.md, HOPPER.md), defined once here: the forward pass
     and the loss violet, a move or update ochre, a slope green. */
  --g-fwd:var(--rubric); --g-move:var(--ochre); --g-slope:#2F7D62;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1720; --leaf:#231E2A; --ink:#EEE7D8; --muted:#A99FB3; --rule:#3D3548;
    --rubric:#B9A6F3; --ochre:#E3AA4C;
    --like:#86BDEE; --like-bg:#1A2633; --like-bg2:#22405E; --dislike:#F0A06D; --dislike-bg:#33231A; --dislike-bg2:#5A3520;
    --g-slope:#7CCFAE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1720; --leaf:#231E2A; --ink:#EEE7D8; --muted:#A99FB3; --rule:#3D3548;
  --rubric:#B9A6F3; --ochre:#E3AA4C;
  --like:#86BDEE; --like-bg:#1A2633; --like-bg2:#22405E; --dislike:#F0A06D; --dislike-bg:#33231A; --dislike-bg2:#5A3520;
  --g-slope:#7CCFAE;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%; margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--serif); font-size:18px; line-height:1.45; -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600}
p{margin:0}
ol,ul{margin:0; padding:0; list-style:none}
button{font:inherit; color:inherit}
button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--rubric); outline-offset:2px}
.scene-no{color:var(--rubric); line-height:1; font-variant-numeric:lining-nums tabular-nums}
.sprite{position:absolute; width:0; height:0; overflow:hidden}
.em{font-family:var(--emoji); font-style:normal; line-height:1}
.sc{font-variant-caps:all-small-caps; letter-spacing:.09em}

/* App shell: top bar, one scene at a time, Back and Next with the steps of the scene between them */
.app{height:100vh; height:100dvh; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto}
.topbar{display:flex; align-items:center; gap:14px; padding:8px var(--gut-r) 8px var(--gut); border-bottom:1px solid var(--rule); min-width:0; overflow:hidden}
.brand{font-size:21px; font-weight:500; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis}
.brand em{color:var(--rubric)}
.brand .part{margin-left:14px; font-size:15px; font-style:italic; color:var(--muted)}
.pager{margin-left:auto; display:flex; align-items:center; gap:4px; min-width:0}
.pager .act{display:flex; align-items:center; gap:4px}
.pager .act + .act{margin-left:6px; padding-left:10px; border-left:1px solid var(--rule)}
.pager button{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--rule); background:var(--leaf); color:var(--rubric);
  font-size:15px; font-variant-numeric:lining-nums tabular-nums; line-height:1; padding:0; cursor:pointer; flex:none}
.pager button[aria-current="step"]{background:var(--rubric); border-color:var(--rubric); color:var(--leaf)}
.pager.fold .act:not(.here) button:not(:first-child){display:none}
.themebtn{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--rule); background:transparent; padding:0; cursor:pointer;
  display:grid; place-items:center; color:var(--muted); flex:none}
.themebtn svg{width:18px; height:18px}
.stage{overflow:auto; padding:12px var(--gut-r) 12px var(--gut)}
.foot{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; padding:8px var(--gut-r) 10px var(--gut); border-top:1px solid var(--rule)}
.navbtn{border:1.5px solid var(--rubric); color:var(--rubric); background:transparent; border-radius:999px; padding:5px 20px 7px;
  font-size:17px; cursor:pointer; min-width:104px}
.navbtn.next{background:var(--rubric); color:var(--leaf)}
.navbtn:disabled{opacity:.3; cursor:default}
.steps{display:flex; justify-content:center; flex-wrap:wrap; gap:6px}
.steps i{width:8px; height:8px; border-radius:50%; background:var(--rule)}
.steps i.past{background:var(--muted)}
.steps i.on{background:var(--rubric); transform:scale(1.25)}

/* A scene is one leaf of the codex: a fine double rule around one screen */
.scene{display:none; min-height:100%; max-width:1180px; margin:0 auto; flex-direction:column;
  background:var(--leaf); border:3px double var(--rule); border-radius:4px; padding:16px 24px 18px}
.scene.active{display:flex; animation:enter .35s ease both}
@keyframes enter{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ .scene.active{animation:none} }
.scene-head{display:flex; align-items:center; gap:14px}
.scene-head .scene-no{font-size:34px}
.scene-head h2{font-size:28px; line-height:1.1}
.scene-head .actname{margin-left:auto; color:var(--muted); font-variant-caps:all-small-caps; letter-spacing:.09em; font-size:15px; white-space:nowrap}
/* The leaves of an optional section (3 and 4) carry this tag beside their title. */
.scene-head .opt-tag{flex:none; color:var(--ochre); border:1.5px solid var(--ochre); border-radius:999px; padding:0 10px 2px;
  font-variant-caps:all-small-caps; letter-spacing:.09em; font-size:15px; line-height:1.3; white-space:nowrap}
.scene-body{flex:1; display:flex; flex-direction:column; min-height:0}
.scene-inner{margin:auto 0; padding-top:12px; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; width:100%}
.scene-error{border:1.5px dashed var(--dislike); color:var(--dislike); border-radius:10px; padding:8px 12px; font-size:15px}
.say{text-align:center; color:var(--muted); font-style:italic; font-size:17px}
.bubble{justify-self:center; max-width:62ch; text-align:center; background:var(--bg); border:1.5px solid var(--rule); border-radius:16px; padding:9px 18px; font-size:18px}
.btn{border:1.5px solid var(--rubric); color:var(--rubric); background:transparent; border-radius:999px; padding:4px 16px 6px;
  font-size:16px; line-height:1.2; cursor:pointer}
.btn.primary{background:var(--rubric); color:var(--leaf)}
.btn.quiet{border-style:dashed}
.btn:disabled{opacity:.4; cursor:default}

/* The five marks: two ticks, a tick, neutral (a wavy line), a cross, two crosses.
   A badge holds one mark; data-r is the rating from 2 to -2. Two marks get the stronger tint. */
.mk{display:inline-block; width:1em; height:1em; vertical-align:-.14em; overflow:visible; flex:none}
.mk.tick2, .mk.cross2{width:1.25em}
.mk.tick, .mk.tick2{color:var(--like)}
.mk.cross, .mk.cross2{color:var(--dislike)}
.mk.wave{color:var(--muted)}
.vote{display:inline-flex; align-items:center; justify-content:center; gap:3px; min-width:44px; padding:4px 6px; border-radius:9px;
  border:1.5px solid var(--rule); background:transparent; flex:none; line-height:1; vertical-align:middle}
.vote .mk{width:20px; height:20px}
.vote .mk.tick2, .vote .mk.cross2{width:25px}
.vote[data-r="1"]{background:var(--like-bg); border-color:var(--like)}
.vote[data-r="2"]{background:var(--like-bg2); border-color:var(--like); border-width:2px}
.vote[data-r="-1"]{background:var(--dislike-bg); border-color:var(--dislike)}
.vote[data-r="-2"]{background:var(--dislike-bg2); border-color:var(--dislike); border-width:2px}
.vote .n{font-size:15px; min-width:1.7em; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); font-weight:600}

/* Pictures: an emoji tile for a film, an initial for a person */
.pic{--s:44px; position:relative; flex:none; width:var(--s); height:var(--s); display:grid; place-items:center; line-height:1}
.pic.film{border-radius:24%; font-family:var(--emoji); font-style:normal; font-size:calc(var(--s) * .56); color:#2A2432}
.pic.person{border-radius:50%; font-family:var(--serif); font-weight:600; font-size:calc(var(--s) * .5); color:#2A2432;
  box-shadow:inset 0 0 0 1.5px rgba(42,36,50,.25)}
.pic.xl{--s:clamp(76px, 15vh, 120px)}
.pic.lg{--s:clamp(60px, 11vh, 88px)}
.pic.md{--s:44px}
.pic.sm{--s:34px}
.pic.xs{--s:26px}

/* Chips: a small picture and a name */
.chip{display:inline-flex; align-items:center; gap:6px; padding:2px 10px 2px 2px; border:1.5px solid var(--rule); border-radius:999px;
  background:var(--leaf); font-size:15.5px; line-height:1.1; white-space:nowrap; max-width:100%; min-width:0; vertical-align:middle}
.chip .pic{--s:26px}
.chip .chip-n{overflow:hidden; text-overflow:ellipsis}
.chip .chip-tag{font-size:12px; color:var(--ochre); font-variant-caps:all-small-caps; letter-spacing:.08em; font-weight:600}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--rubric)}
.chip.on{border-color:var(--rubric); box-shadow:0 0 0 2px var(--rubric)}
.chip.dim{opacity:.32}

/* A film card: picture, title, year, summary */
.fcard{display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:16px; row-gap:2px; align-items:center; align-content:center;
  padding:14px 16px; border:1.5px solid var(--rule); border-radius:14px; background:var(--bg); text-align:left}
.fcard .pic{grid-row:1 / span 2}
.fcard h3{font-size:22px; line-height:1.15}
.fcard h3 .yr{color:var(--muted); font-weight:400; font-size:.8em; margin-left:6px}
.fcard .sum{font-size:16.5px; line-height:1.38}

/* The ratings table: customers in rows, films in columns, one badge per cell.
   .on and .dim work on rows (tr) and on cells (td); .rt-new is the newcomer below a gap; .q is a "?" cell. */
.rt{border-collapse:separate; border-spacing:6px 5px; margin:0 auto}
.rt th, .rt td{padding:0; text-align:center; vertical-align:middle}
.rt-film{font-weight:500; font-size:14.5px; line-height:1.15; padding:0 2px 2px}
.rt-film .pic{margin:0 auto 3px}
.rt-ft{display:block; max-width:8.5em; margin:0 auto; text-wrap:balance}
.rt.pic-heads .rt-ft{display:none}
.rt-who{text-align:left; white-space:nowrap; padding-right:6px; font-weight:500}
.rt-who .pic{display:inline-grid; vertical-align:middle; margin-right:7px}
.rt-n{vertical-align:middle}
.rt-c .vote{min-width:52px}
.rt-gap td{height:6px; border-bottom:1.5px dashed var(--rule)}
.rt-new .rt-who{color:var(--rubric)}
.rt tr, .rt td, .rt th{transition:opacity .25s ease}
.rt tr.dim, .rt td.dim, .rt th.dim{opacity:.3}
.rt td.on .vote, .rt tr.on td .vote{box-shadow:0 0 0 2.5px var(--rubric)}
.rt tr.on .rt-who{color:var(--rubric)}
.q{display:inline-grid; place-items:center; min-width:52px; height:32px; border:1.5px dashed var(--rubric); border-radius:9px;
  color:var(--rubric); font-weight:700; font-size:18px}
@media (prefers-reduced-motion: reduce){ .rt tr, .rt td, .rt th{transition:none} }

/* Section cards: a leaf of its own before acts 2, 3 and 4. The leaf turns violet with a wipe like a turning page,
   then the act's numeral, a kicker, the act's name, one line and a motif come in one after another. */
:root{--card:#58409A; --card-rule:#7A64BC; --card-ink:#FFFBF0; --card-soft:#D8CDF4}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--card:#2F2552; --card-rule:#4C3F7E; --card-ink:#EEE7D8; --card-soft:#B9A6F3} }
:root[data-theme="dark"]{--card:#2F2552; --card-rule:#4C3F7E; --card-ink:#EEE7D8; --card-soft:#B9A6F3}
.scene.intro{background:var(--card); border-color:var(--card-rule); color:var(--card-ink)}
.scene.intro.active{animation:card-wipe .7s cubic-bezier(.65,0,.35,1) both}
@keyframes card-wipe{from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)}}
.scene.intro .scene-head{display:none}
.act-card{display:grid; justify-items:center; text-align:center; gap:10px; padding:8px 0}
.act-no{font-size:clamp(64px, 15vh, 128px); line-height:1; color:var(--card-soft); font-variant-numeric:lining-nums}
.act-kicker{font-variant-caps:all-small-caps; letter-spacing:.24em; font-size:19px; color:var(--card-soft)}
.act-title{font-style:italic; font-weight:500; font-size:clamp(42px, 9vh, 76px); line-height:1.04; text-wrap:balance}
.act-line{max-width:36ch; font-size:22px; line-height:1.38; text-wrap:balance}
.act-motif{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px; margin-top:10px}
.act-motif .vote{min-width:66px; padding:9px 10px}
.act-motif .vote[data-r="0"]{background:var(--leaf)}
.act-motif .vote .mk{width:28px; height:28px}
.act-motif .vote .mk.tick2, .act-motif .vote .mk.cross2{width:35px}
.act-op{width:66px; height:66px; border-radius:50%; border:2px solid var(--card-soft); display:grid; place-items:center;
  font-size:40px; line-height:1; color:var(--card-ink)}
.act-motif .chip{background:var(--leaf); color:var(--ink); font-size:21px; padding:3px 16px 3px 3px; border-color:var(--card-soft)}
.act-motif .chip .pic{--s:36px}
.act-link{width:96px; border-top:3px dotted var(--card-soft)}
.act-q{width:44px; height:44px; border-radius:50%; border:2px dashed var(--card-soft); display:grid; place-items:center;
  font-size:24px; font-weight:700; color:var(--card-ink)}
.act-card.play > *{animation:act-in .7s cubic-bezier(.2,.7,.2,1) both}
.act-card.play .act-no{animation-name:act-no; animation-duration:.9s; animation-delay:.45s}
.act-card.play .act-kicker{animation-delay:.75s}
.act-card.play .act-title{animation-delay:.9s}
.act-card.play .act-line{animation-delay:1.2s}
.act-card.play .act-motif{animation:none}
.act-card.play .act-motif > *{animation:act-pop .5s cubic-bezier(.3,1.5,.5,1) both; animation-delay:calc(1.5s + var(--j) * .14s)}
@keyframes act-in{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
@keyframes act-no{from{opacity:0; transform:scale(.55) rotate(-10deg)} to{opacity:1; transform:none}}
@keyframes act-pop{from{opacity:0; transform:scale(.4)} to{opacity:1; transform:none}}
.pager button.intro{width:11px; height:11px; border-radius:2px; transform:rotate(45deg); background:var(--rule); border:none; margin:0 4px}
.pager button.intro[aria-current="step"]{background:var(--rubric)}
@media (prefers-reduced-motion: reduce){
  .scene.intro.active, .act-card.play > *, .act-card.play .act-motif > *{animation:none}
}

/* Short screens: a laptop browser or the projector at 720p */
@media (max-height: 760px){
  .scene{padding:12px 22px 14px}
  .scene-head .scene-no{font-size:30px}
  .scene-head h2{font-size:25px}
  .scene-inner{gap:10px; padding-top:8px}
  .fcard{padding:10px 14px}
  .fcard h3{font-size:20px}
  .fcard .sum{font-size:15.5px}
  .bubble{font-size:17px; padding:7px 16px}
  .rt{border-spacing:6px 4px}
}
@media (max-width: 760px){
  .scene-head .actname{display:none}
  .scene-head .opt-tag{margin-left:auto; font-size:13px; padding:0 7px 1px}
}
@media (max-width: 560px){
  body{font-size:16.5px}
  .brand{font-size:17px}
  .topbar{gap:8px; padding-top:6px; padding-bottom:6px}
  .pager{gap:3px}
  .pager .act{gap:3px}
  .pager .act + .act{margin-left:2px; padding-left:5px}
  .pager button{width:11px; height:11px; font-size:0; border-width:1.5px}
  .brand .pre{display:none}
  .brand .part{display:none}
  .themebtn{width:28px; height:28px}
  .stage{padding:8px}
  .foot{padding-top:6px; padding-bottom:8px; gap:8px}
  .navbtn{min-width:84px; font-size:16px; padding:4px 14px 6px}
  .steps{gap:4px}
  .steps i{width:6px; height:6px}
  .scene{padding:10px 10px 12px}
  .scene-head{gap:10px}
  .scene-head .scene-no{font-size:24px}
  .scene-head h2{font-size:21px}
  .scene-inner{gap:10px; padding-top:8px}
  .say{font-size:14.5px}
  .bubble{font-size:15.5px; padding:7px 12px}
  .btn{font-size:15px; padding:3px 13px 5px}
  .vote{padding:3px 4px; min-width:36px}
  .vote .mk{width:17px; height:17px}
  .vote .mk.tick2, .vote .mk.cross2{width:21px}
  .vote .n{font-size:13.5px}
  .chip{font-size:13.5px; gap:4px; padding:2px 8px 2px 2px}
  .chip .pic{--s:22px}
  .fcard{column-gap:12px; padding:10px 12px}
  .fcard h3{font-size:18.5px}
  .fcard .sum{font-size:14.5px; line-height:1.34}
  .rt{border-spacing:3px 4px}
  .rt-film{font-size:12.5px}
  .rt-ft{display:none}
  .rt-who{padding-right:2px; font-size:15px}
  .rt-who .pic{margin-right:4px}
  .rt-c .vote, .q{min-width:40px}
  .q{height:28px}
  .act-card{gap:8px}
  .act-kicker{font-size:16px}
  .act-title{font-size:38px}
  .act-line{font-size:17px}
  .act-motif{gap:8px}
  .act-motif .vote{min-width:48px; padding:6px 6px}
  .act-motif .vote .mk{width:22px; height:22px}
  .act-motif .vote .mk.tick2, .act-motif .vote .mk.cross2{width:27px}
  .act-op{width:52px; height:52px; font-size:32px}
  .act-motif .chip{font-size:18px}
  .act-link{width:56px}
  .pager button.intro{width:8px; height:8px; margin:0 2px}
  /* Five sections do not fit 390 px as dots: the current section shows all of its dots, every other section
     folds to its first marker, and the pager clips rather than run under the theme button. */
  .pager{overflow:hidden; flex-shrink:0; max-width:calc(100vw - 112px)}
  .pager .act:not(.here) button:not(:first-child){display:none}
}

/* Matchmaker additions (main session): the optional section's skip button, word motifs on a section card,
   and the leaf "Your turn in Python" that closes sections 1 to 4. */
.act-op.act-word{width:auto; min-width:66px; padding:0 14px; border-radius:12px; font-style:italic; font-size:26px}
.act-motif .nt-n{min-width:52px; min-height:40px; background:var(--leaf)}
/* An unknown number on a section card: notation.css draws a slot violet on transparent, which vanishes on the
   violet card, so here it takes the card's own light colours (dashed, as everything unknown in the game). */
.act-motif .nt-n.nt-slot{background:transparent; border-color:var(--card-soft); color:var(--card-ink)}
.act-skip{margin-top:6px; padding:8px 20px; border-radius:999px; border:1.5px solid var(--card-soft); background:transparent;
  color:var(--card-ink); font-size:19px; cursor:pointer}
.act-skip:hover{background:var(--card-rule)}
/* An optional section's card carries the skip button as well: a little less air, so it fits 1280x720. */
.act-card.opt{gap:6px}
.act-card.opt .act-motif{margin-top:4px}
.py-card{display:grid; justify-items:center; text-align:center; gap:14px; padding:10px 0; max-width:50ch; margin:0 auto}
.py-kicker{font-variant-caps:all-small-caps; letter-spacing:.24em; font-size:19px; color:var(--ochre)}
.py-what{font-size:clamp(24px, 4.2vh, 34px); line-height:1.25; font-style:italic; text-wrap:balance}
.py-open{display:inline-block; padding:12px 26px; border-radius:999px; background:var(--rubric); color:var(--leaf);
  font-size:21px; text-decoration:none; font-weight:500}
.py-open:hover{filter:brightness(1.08)}
.py-how, .py-back{font-size:18px; color:var(--muted); max-width:42ch}
.pager button.py{width:11px; height:11px; border-radius:3px; background:transparent; border:2px solid var(--ochre); margin:0 3px}
.pager button.py[aria-current="step"]{background:var(--ochre)}

.mx-x-tb > .mx-xf{justify-self:end; align-self:end}
.mx-x-tb > .mx-xc, .mx-x-tb > .mx-xp{justify-self:end; align-self:end}
.mx-x-tb > .mx-xr{align-self:end}
/* the turned films' matrix: its caption on its left, level with its column heads (as in the grid sketch) */
.mx-x-tb > .mx-xf > .mx.mx-tr{grid-template-columns:auto auto; grid-template-areas:"cap tw" ". size"; column-gap:10px;
  align-items:start}
.mx-x-tb > .mx-xf > .mx.mx-tr > .mx-cap{grid-area:cap; padding-top:.4em}
.mx-x-tb > .mx-xf > .mx.mx-tr > .mx-tw{grid-area:tw}
.mx-x-tb > .mx-xf > .mx.mx-tr > .mx-size{grid-area:size}
.mx-xarr{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:1}
.mx-xarr g{transition:opacity .4s ease}
.mx-xarr g.mx-xoff{opacity:0}
.mx-xarr g.mx-xnone{display:none}
.mx-xl{fill:none; stroke:var(--g-fwd, var(--rubric)); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; opacity:.75}
.mx-xh{fill:var(--g-fwd, var(--rubric)); stroke:none; opacity:.85}

/* M.stack (2026-11-05): the second matrix on top of the first (their columns aligned, both set to the right), the
   product on the right of the first, the worked line and the note under them. A lit pair: brighter bands, an outline
   round each of its two rows and arrows into the product's row and column, drawn in an SVG over the grid. */
.mx-stk{position:relative; display:grid; grid-template-columns:auto auto; grid-template-areas:"b ." "a c" "calc calc" "note note";
  justify-content:center; align-items:start; column-gap:var(--mx-scg, 64px); row-gap:var(--mx-srg, 8px); max-width:100%}
.mx-stk-two{grid-template-columns:auto; grid-template-areas:"b" "a" "calc" "note"}
.mx-stk .mx{--mx-ta:color-mix(in srgb, var(--rubric) 24%, transparent); --mx-tb:color-mix(in srgb, var(--ochre) 30%, transparent);
  --mx-tab:color-mix(in srgb, color-mix(in srgb, var(--rubric) 50%, var(--ochre)) 38%, transparent)}
.mx-sslot{min-width:0}
.mx-ssa{grid-area:a; justify-self:end}
.mx-ssb{grid-area:b; justify-self:end}
.mx-ssc{grid-area:c; justify-self:start}
/* a matrix of the stack: its size beside its caption, so that the matrices stay short */
.mx-stk .mx{grid-template-columns:auto auto; grid-template-areas:"cap size" "tw tw"; column-gap:10px; align-items:baseline}
.mx-stk .mx > .mx-cap{grid-area:cap}
.mx-stk .mx > .mx-tw{grid-area:tw; align-self:start}
.mx-stk .mx > .mx-size{grid-area:size; margin-top:0}
.mx-stk .mx-size .mx-shape{font-size:19px}
/* the side column: the worked line beside the second matrix, the note beside the product */
@media (min-width: 901px){

  .mx-stk-side > .mx-calc{align-self:end; flex-direction:column; align-items:flex-start; padding:0 0 4px}
  .mx-stk-side > .mx-note{align-self:center; justify-items:start; text-align:left}
}
.mx-stk > .mx-note{grid-area:note}
/* The textbook layout of M.stack (2026-11-06): the second matrix, turned, above the product (spanning both columns, at
   the right, so its columns are the product's); the first on the product's left, their last rows level. */
.mx-stk.mx-stk-tb{grid-template-areas:"b b" "a c" "calc calc" "note note"; row-gap:var(--mx-srg, 16px)}
.mx-stk-tb > .mx-ssb, .mx-stk-tb > .mx-ssa, .mx-stk-tb > .mx-ssc{justify-self:end; align-self:end}
.mx-stk.mx-stk-tb.mx-stk-two{grid-template-columns:auto auto; grid-template-areas:". b" "a ." "calc calc" "note note"}
@media (min-width: 901px){
  .mx-stk.mx-stk-tb.mx-stk-side{grid-template-columns:auto auto minmax(0, 34ch); grid-template-areas:"b b calc" "a c note"}
}
.mx-stk .mx-hit > .nt-n{box-shadow:0 0 0 3px var(--leaf), 0 0 0 6px var(--rubric)}
.mx-sov{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:2}
.mx-sbox{fill:none; stroke-width:2.5}
.mx-sl{fill:none; stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round}
.mx-sbox.mx-sta, .mx-sl.mx-sta{stroke:var(--rubric)}
.mx-sbox.mx-stb, .mx-sl.mx-stb{stroke:var(--ochre)}
.mx-sh{stroke:none}
.mx-sh.mx-sta{fill:var(--rubric)}
.mx-sh.mx-stb{fill:var(--ochre)}
/* the worked line of one inner product: the products, then the sum */
.mx-calc{grid-area:calc; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 12px; padding-top:4px}
.mx-calc:empty{display:none}
.mx-cl{display:inline-flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px}
.mx-cg{display:inline-flex; align-items:center; gap:5px}

/* M.workLine outside a stack: the look of the stack's worked line */
.mx-wl{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 12px}

<style>
/* The guessing diagram (MF.G.diagram) and Popper's schema (MF.G.schema). The diagram is agent b's since the port to the
   textbook cross (2026-11-06); GUESS.md has the design. Classes start with g-. The diagram is an M.cross (layout
   "textbook") of four MF.M matrices of one row or one column (the customer's row, the film's column, the prediction,
   the rating), the loss and the worked line; its number cells take the sizes of MF.M's sm, md and lg.
   Colours: the numbers keep the notation's colours (blue above 0, orange below 0); the guesses in ink; the forward pass
   and the loss in the rubric violet (--g-fwd); a move or update in ochre (--g-move); --g-slope is section 3's slope.
   The three are defined once on :root in core.css. */
.g-dia{--g-room:17px; --g-lw:58px; --g-lh:42px; --g-lfs:24px; --g-ww:38px; --g-wh:30px; --g-wfs:18px;
  position:relative; display:grid; justify-items:center; gap:10px; width:100%; min-width:0}
.g-sm{--g-lw:50px; --g-lh:36px; --g-lfs:21px; --g-ww:34px; --g-wh:28px; --g-wfs:17px}
.g-lg{--g-lw:66px; --g-lh:48px; --g-lfs:28px; --g-ww:42px; --g-wh:33px; --g-wfs:20px}

/* the cross: three columns (the customer's row, the prediction, the rating), the film's column above the first two,
   the worked line under the customer's row, the loss under the prediction and the rating */
.g-x.mx-cross.mx-x-tb{--mx-xcg:34px; --mx-xrg:10px; --mx-xjoin:18px; grid-template-columns:repeat(3, auto);
  grid-template-areas:"f f nb" "c p r" "note s s"}
.g-x.mx-x-tb > .mx-xf{margin-bottom:calc(26px - var(--mx-xrg))}
.g-x > .mx-xr{margin-left:10px}
.g-x > .mx-xnote{justify-self:end; align-self:start; margin-top:4px}
.g-x .g-mp > .mx-cap, .g-x .g-loss > .g-cap{color:var(--g-fwd)}
.g-cap{font-variant-caps:all-small-caps; letter-spacing:.09em; font-weight:600; font-size:15.5px; line-height:1.1; white-space:nowrap}
.g-loss{display:grid; justify-items:center; gap:5px}
.g-dia .nt-n.g-lossn{min-width:var(--g-lw); min-height:var(--g-lh); font-size:var(--g-lfs); font-weight:700; border-width:2.5px;
  box-shadow:0 0 0 3px var(--leaf), 0 0 0 5.5px var(--g-fwd)}
.g-dia .nt-n.g-lossn.nt-slot{border-width:2px}
/* the worked line: each pair multiplied, then the products and the sum, ringed; set to the right, under the row */
.g-dia .mx-wl.g-wl{flex-direction:column; align-items:flex-end; gap:5px}
.g-dia .g-wl .nt-n{min-width:var(--g-ww); min-height:var(--g-wh); font-size:var(--g-wfs)}
.g-nowork .g-work{display:none}

/* a guessed number: the ring of the number about to move, and the flash of a move, both in ochre */
.g-dia .nt-n.g-focus{box-shadow:0 0 0 3px var(--leaf), 0 0 0 6px var(--g-move)}
.g-dia .nt-n.g-moved{box-shadow:0 0 0 3px var(--leaf), 0 0 0 6px var(--g-move)}
/* o.room: room above every guessed number for a grasshopper (MF.H.team): under the heads, and between the film's two
   (g-roomc the customer's row, g-roomf the film's column) */
.g-roomc .g-mc thead th, .g-roomf .g-mf thead th{padding-bottom:var(--g-room)}
.g-roomf .g-mf tbody tr + tr > *{padding-top:calc(var(--mx-py) + var(--g-room))}

/* parts that are not shown yet keep their place */
.g-dia:not(.g-on-guesses) .g-mc, .g-dia:not(.g-on-guesses) .g-mf{visibility:hidden}
.g-dia:not(.g-on-rating) .g-mr{visibility:hidden}
.g-dia:not(.g-on-prediction) .g-mp, .g-dia:not(.g-on-prediction) .g-work{visibility:hidden}
.g-dia:not(.g-on-loss) .g-loss{visibility:hidden}
.g-dia.g-pwait .g-predn, .g-dia.g-lwait .g-lossn{visibility:hidden}

.g-note{display:grid; justify-items:center; gap:6px; text-align:center; width:100%; min-width:0}
.g-note:empty{display:none}
.g-layer{position:absolute; left:0; top:0; width:0; height:0; overflow:visible; pointer-events:none; z-index:9}
.g-ghost{position:absolute; margin:0; box-sizing:border-box; pointer-events:none; z-index:9; box-shadow:0 6px 16px rgba(42,36,50,.22)}

/* Short screens: the projector at 720p */
@media (max-height: 760px){
  .g-dia{--g-room:16px; --g-lw:54px; --g-lh:40px; --g-lfs:23px; --g-ww:36px; --g-wh:29px; --g-wfs:17px}
  .g-sm{--g-lw:48px; --g-lh:34px; --g-lfs:20px; --g-ww:33px; --g-wh:27px; --g-wfs:16px}
  .g-x.mx-cross.mx-x-tb{--mx-xrg:8px; --mx-xjoin:16px}

}
/* Phones */
@media (max-width: 560px){
  .g-dia, .g-sm, .g-lg{--g-room:15px; --g-lw:44px; --g-lh:32px; --g-lfs:18px; --g-ww:28px; --g-wh:24px; --g-wfs:14px}
  .g-x.mx-cross.mx-x-tb{--mx-xcg:10px; --mx-xrg:6px; --mx-xjoin:14px; grid-template-areas:"f f nb" "c p r" "note s s"}
  .g-x.mx-x-tb > .mx-xf{margin-bottom:calc(22px - var(--mx-xrg))}
  .g-x > .mx-xr{margin-left:4px}
  .g-cap{font-size:13px}
  .g-dia .g-wl.mx-wl{gap:4px}
  .g-dia .g-wl .mx-co{font-size:15px}
  .g-dia .g-wl .mx-cl, .g-dia .g-wl .mx-cg{gap:3px}
  .g-dia .nt-n.g-lossn{box-shadow:0 0 0 2px var(--leaf), 0 0 0 4px var(--g-fwd)}

}

/* POPPER'S SCHEMA: the sentence, four boxes with arrows, the loop over the top, Popper's words, the beats */
.g-sch{--g-bw:86px; --g-bh:56px; --g-arc:36px; display:grid; justify-items:center; gap:10px; width:100%}

.g-src{font-size:15.5px; color:var(--muted); text-align:center; text-wrap:balance}

  padding-top:var(--g-arc); margin-top:8px}

  background:var(--leaf); font-size:29px; line-height:1; margin-bottom:5px}
.g-fbox.g-strong{border:4.5px double var(--ink)}
.g-fsym i{font-style:italic}
.g-fsym sub{font-size:.58em; font-style:normal}
.g-farrow{position:absolute; top:calc(var(--g-bh) / 2 - 1px); left:calc(50% + var(--g-bw) / 2 + 6px); width:calc(100% - var(--g-bw) - 14px);
  height:2px; background:var(--ink); transform-origin:left center}
.g-farrow::after{content:""; position:absolute; right:-2px; top:50%; border-left:10px solid var(--ink); border-top:6px solid transparent;
  border-bottom:6px solid transparent; transform:translateY(-50%)}
.g-flab{font-size:18px; line-height:1.2; font-weight:500}
.g-fbeat{font-size:18px; line-height:1.2; color:var(--rubric); font-style:italic; margin-top:3px}
.g-fnote{font-size:17px; line-height:1.25; color:var(--ochre); font-weight:600; margin-top:4px}
.g-fnote.g-empty{display:none}
.g-again{position:absolute; top:6px; left:12.5%; right:12.5%; height:calc(var(--g-arc) - 6px); border:2px solid var(--muted); border-bottom:0;
  border-radius:16px 16px 0 0}
.g-again::after{content:""; position:absolute; left:-7px; bottom:-3px; border-top:10px solid var(--muted); border-left:6px solid transparent;
  border-right:6px solid transparent}
.g-againl{position:absolute; left:50%; top:0; transform:translate(-50%, -58%); background:var(--leaf); padding:0 10px; font-style:italic;
  color:var(--muted); font-size:17px; white-space:nowrap}

.g-sch:not(.g-on-boxes) .g-fbox, .g-sch:not(.g-on-boxes) .g-farrow, .g-sch:not(.g-on-boxes) .g-flab,
.g-sch:not(.g-on-boxes) .g-ssrc, .g-sch:not(.g-on-boxes) .g-fnote{visibility:hidden}

<style>
/* The grasshopper of section 3 and its ground (MF.H, hopper.js). Owned by S3-A; HOPPER.md has the design. Classes h-.
   The grasshopper is AML's paper cut-out in this game's green: the deep parts (thigh, wing) in the slope's green, the
   body and the head lighter, the legs in ink, a cream eye. The ground uses the diagram's colours: the loss and its
   curve violet (--g-fwd), the slope, the hop and its triangle green (--g-slope), a jump and its arrow ochre (--g-move). */
.h-glyph, .h-ground, .h-team{--h-body:#74C46E; --h-head:#92D58A; --h-deep:#2F7D62; --h-ink:var(--ink); --h-eye:#FFFBF0;

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .h-glyph, :root:not([data-theme="light"]) .h-ground, :root:not([data-theme="light"]) .h-team{
    --h-body:#7CCB76; --h-head:#9DDC94; --h-deep:#47A878; --h-shade:rgba(0,0,0,.38)}

:root[data-theme="dark"] .h-glyph, :root[data-theme="dark"] .h-ground, :root[data-theme="dark"] .h-team{
  --h-body:#7CCB76; --h-head:#9DDC94; --h-deep:#47A878; --h-shade:rgba(0,0,0,.38)}
/* on the violet section card */
.h-glyph.h-card, .scene.intro .h-glyph{--h-body:#A8E6A2; --h-head:#C6F1BF; --h-deep:#5DBB86; --h-ink:var(--card-ink, #FFFBF0);
  --h-shade:rgba(20,10,40,.3)}

/* the paper */
.h-hop .h-shade path{fill:var(--h-shade); stroke:none}
.h-hop .h-paper path{stroke:none}
.h-hop .h-body{fill:var(--h-body)}
.h-hop .h-head{fill:var(--h-head)}
.h-hop .h-deep{fill:var(--h-deep)}
.h-hop .h-ink{fill:var(--h-ink)}
.h-hop .h-eye{fill:var(--h-eye)}
.h-hop .h-pupil{fill:var(--h-pupil)}

/* one grasshopper as an element */
.h-glyph{display:inline-block; line-height:0; vertical-align:bottom}
.h-glyph svg{display:block; overflow:visible}

/* Section 4, many customers and many films: S4-B's scenes shared and together (sec4d.js), classes s4d-.
   Colours follow section 3 (GUESS.md, sec3d.css): a slope green (--g-slope), a move or update ochre (--ochre, the
   view's tone "b"), the ratings a number sits in violet (the view's tone "a"). The view itself is S4-A's (loss.css). */
.s4d{position:relative; display:grid; gap:8px; justify-items:center; width:100%; min-width:0}
.s4d-lead{font-size:23px; line-height:1.3; text-align:center; text-wrap:balance; max-width:76ch; margin:0}
.s4d-line{font-size:19px; line-height:1.35; text-align:center; text-wrap:balance; max-width:66ch; margin:0}
.s4d-say:empty{display:none}
.s4d-quiet{color:var(--muted)}
.s4d-nw{white-space:nowrap}
.s4d-b{font-weight:700; color:var(--rubric)}
.s4d-viewbox{display:grid; justify-items:center; width:100%; min-width:0}
.s4d-bench{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 34px; width:100%; min-width:0}
.s4d-v[hidden], .s4d-roombox[hidden]{display:none !important}
.s4d-off{visibility:hidden}
.s4d-glab{font-variant-caps:all-small-caps; letter-spacing:.08em; font-weight:600; font-size:15.5px; line-height:1.1; color:var(--muted);
  white-space:nowrap}

/* A number inside a line of words: the notation's cell, small */
.s4d .nt-n.s4d-in{--nt-w:34px; --nt-h:28px; --nt-fs:18px; border-radius:8px; margin:0 .08em; vertical-align:-.12em}

/* Flights and rings */
.s4d-layer{position:absolute; left:0; top:0; width:0; height:0; overflow:visible; pointer-events:none; z-index:9}
.s4d-ghost{position:absolute; margin:0; box-sizing:border-box; pointer-events:none; z-index:9; box-shadow:0 6px 16px rgba(42,36,50,.22)}
.s4d .nt-n.s4d-slope{box-shadow:0 0 0 2.5px var(--leaf), 0 0 0 5px var(--g-slope)}
.s4d .nt-n.s4d-move{box-shadow:0 0 0 2.5px var(--leaf), 0 0 0 5px var(--ochre)}
.s4d .nt-n.s4d-slope.nt-slot, .s4d .nt-n.s4d-move.nt-slot{box-shadow:none}
.s4d .nt-n.s4d-slope.nt-slot.nt-ask, .s4d .nt-n.s4d-move.nt-slot.nt-ask{box-shadow:0 0 0 3px var(--leaf), 0 0 0 5px var(--rubric)}
.s4d .nt-n.s4d-zero{box-shadow:none; opacity:.75}

/* A word in a cell (the rule written with words instead of numbers) */
.s4d .nt-n.s4d-word{font-style:italic; font-weight:500; font-size:calc(var(--nt-fs) * .66); color:var(--ink); padding:0 .55em;
  border-style:dashed; border-color:var(--muted)}
.s4d .nt-n.s4d-word.s4d-slope{color:var(--g-slope); border-style:solid; border-color:var(--g-slope)}
.s4d .nt-n.s4d-word.s4d-move{color:var(--ochre); border-style:solid; border-color:var(--ochre)}

/* A column (section 3's Col) */
.s4d .s4d-colw, .s4d .s4d-colw .nt-tab{--nt-w:58px; --nt-h:40px; --nt-fs:23px; --nt-sx:12px; --nt-sy:4px; --nt-xg:18px; --nt-rg:8px;
  --nt-eqw:26px; --nt-pw:var(--nt-w)}
.s4d-col .rt-who{text-align:right}
.s4d-col .rt-who .rt-n{font-variant-caps:all-small-caps; letter-spacing:.08em; font-size:15.5px; font-weight:600; color:var(--muted);
  white-space:nowrap}
.s4d .s4d-col .nt-rlab{font-weight:600; font-size:15.5px; color:var(--rubric)}
.s4d-col .nt-x{color:var(--ink)}
.s4d-cols{display:flex; align-items:center; gap:8px 14px}
.s4d-colcap{display:grid; justify-items:center; gap:2px}
.s4d-arrow{font-size:28px; line-height:1; color:var(--muted)}

/* Scene shared: the rule */
.s4d-rulev{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px 34px}
.s4d-rulebox{display:flex; align-items:flex-end; gap:10px}
.s4d-hop{line-height:0; padding-bottom:6px}
.s4d-rulew{display:grid; gap:6px; max-width:520px}
.s4d-rulew .s4d-line{text-align:left}

/* Scene shared: the stack of what each rating says, and their average */
.s4d .s4d-asksw, .s4d .s4d-asks{--nt-w:56px; --nt-h:38px; --nt-fs:22px; --nt-sx:16px; --nt-sy:3px; --nt-xg:16px; --nt-rg:7px; --nt-pw:var(--nt-w)}
.s4d-asks .rt-who{text-align:right}
.s4d-asks .rt-who .rt-n{font-variant-caps:all-small-caps; letter-spacing:.08em; font-size:15px; font-weight:600; color:var(--muted); white-space:nowrap}
.s4d .s4d-asks .nt-rlab{font-weight:600; font-size:15px; color:var(--g-slope)}
.s4d-asks .nt-x{color:var(--ink)}
.s4d-ah{font-weight:500; font-size:16px; white-space:nowrap; padding:0 0 2px; text-align:center}
.s4d-ah .pic{--s:22px; display:inline-grid; vertical-align:-5px; margin-right:4px}
.s4d-avgh, .s4d-ahc{font-variant-caps:all-small-caps; letter-spacing:.08em; font-weight:600; font-size:15px; color:var(--g-slope);
  vertical-align:bottom; padding:0 0 4px 26px; text-align:center}
.s4d-avgc{padding:var(--nt-rg) 0 0 26px; text-align:center}
.s4d .nt-n.s4d-avgn{--nt-w:66px; min-width:70px}
.s4d-asks td.nt-c{position:relative}
.s4d-notin{position:absolute; left:50%; top:calc(50% + var(--nt-xg) / 2); transform:translate(-50%, -50%); white-space:nowrap;
  font-variant-caps:all-small-caps; letter-spacing:.06em; font-size:14px; font-weight:600; color:var(--muted)}
.s4d-asks .nt-res > td.nt-pc.s4d-norule{border-top-color:transparent}
.s4d-asks .nt-res > td.nt-pc.s4d-faint{border-top-style:dashed}

/* The slopes, as two small matrices shaped like the guesses */
.s4d-slopes{display:flex; align-items:flex-start; gap:8px 14px}
.s4d-sl .mx-cap{font-variant-caps:all-small-caps; letter-spacing:.08em; font-weight:600; color:var(--g-slope)}
.s4d-sl .nt-n.s4d-cur{box-shadow:0 0 0 2.5px var(--leaf), 0 0 0 5.5px var(--ochre)}
.s4d-side{display:grid; justify-items:center; gap:8px; max-width:540px}
.s4d-sl .mx-rn{display:none}
.s4d-sline{font-size:18px; max-width:30em}

/* The guessed numbers can be tapped in the first step of shared */
.s4d-picking .s4d-tap{cursor:pointer}
.s4d-picking .s4d-tap .nt-n{transition:box-shadow .2s ease}
@media (hover: hover){ .s4d-picking .s4d-tap:hover .nt-n{box-shadow:0 0 0 2px var(--rubric)} }

/* The room's keys and the words after a try */
.s4d-room{display:grid; gap:6px; justify-items:center}
.s4d-pad{display:flex; flex-wrap:wrap; justify-content:center; gap:5px; max-width:780px}
.s4d-pad[hidden], .s4d-showme[hidden]{display:none}
.s4d-key{--nt-w:52px; --nt-h:38px; --nt-fs:20px; padding:2px; border:0; border-radius:11px; background:none; cursor:pointer; color:inherit}
.s4d-key .nt-n{pointer-events:none; transition:box-shadow .2s ease, translate .1s ease}
.s4d-key:active .nt-n{translate:0 1px}
.s4d-key:focus-visible{outline:2px solid var(--rubric); outline-offset:1px}
@media (hover: hover){ .s4d-key:hover .nt-n{box-shadow:0 0 0 2px var(--rubric)} }
.s4d-fbw{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px 12px}
.s4d-fb{font-size:19px; line-height:1.3; text-align:center; text-wrap:balance; max-width:62ch; margin:0}
.s4d-hint .s4d-b{color:var(--muted)}
.s4d-showme{font-size:15px; padding:2px 14px 4px}

/* Scene together: the rule, the worked updates, the question, the run */
.s4d-grulev{display:grid; gap:8px; justify-items:center; max-width:660px}
.s4d-workv{display:grid; gap:8px; justify-items:center}
.s4d-askv{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 30px}
.s4d-qt{border-collapse:separate; border-spacing:10px 3px; --nt-w:60px; --nt-h:32px; --nt-fs:19px}
.s4d-qt th, .s4d-qt td{padding:0; text-align:center; vertical-align:middle}
.s4d-wth{font-variant-caps:all-small-caps; letter-spacing:.08em; font-weight:600; font-size:15px; color:var(--muted)}
.s4d-wtn{display:inline-flex; align-items:center; gap:6px; font-size:17px; font-weight:500; white-space:nowrap}
.s4d-wtn .pic{--s:22px}
.s4d-qt td.s4d-rose .nt-n{box-shadow:0 0 0 2px var(--leaf), 0 0 0 4.5px var(--rubric)}
.s4d-qt .s4d-qavgc{padding-left:12px; border-left:1.5px solid var(--rule)}
.s4d-qt tbody .s4d-wth{text-align:right}
.s4d-qside{display:grid; gap:8px; justify-items:center; max-width:470px}
.s4d-qbtns{display:flex; gap:12px}
.s4d-qbtns[hidden]{display:none}
.s4d-qbtn{font-size:18px; padding:4px 18px 6px}
.s4d-runv{display:grid; gap:10px; justify-items:center; width:100%}
.s4d-runtop{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 12px}
.s4d .nt-n.s4d-count{--nt-w:52px; --nt-h:40px; --nt-fs:24px}
.s4d-play, .s4d-replay{font-size:15px; padding:2px 14px 4px}
.s4d-trail{display:flex; flex-wrap:wrap; justify-content:center; gap:5px; max-width:960px}
.s4d .nt-n.s4d-tc{--nt-w:58px; --nt-h:30px; --nt-fs:15px; border-radius:8px}
.s4d .nt-n.s4d-tc.s4d-now{box-shadow:0 0 0 2px var(--leaf), 0 0 0 4px var(--g-fwd, var(--rubric))}

@media (prefers-reduced-motion: reduce){
  .s4d-key .nt-n, .s4d-picking .s4d-tap .nt-n{transition:none}
}
.s4d-right{display:contents}
/* Desk screens: the lead and the cross of the view on the left; the bench of worked tables, the step's line and the
   room's keys in one column on the right, from the top (since 2026-11-04, when the view became the cross, which is too
   tall to have them under it) */
@media (min-width: 561px){
  .s4d-shared, .s4d-together{grid-template-columns:max-content minmax(0, 440px); grid-template-rows:auto 1fr; grid-template-areas:"lead right" "view right";
    column-gap:30px; justify-content:center; align-items:center}
  .s4d-shared > .s4d-lead, .s4d-together > .s4d-lead{grid-area:lead; contain:inline-size; width:100%}
  .s4d-shared > .s4d-viewbox, .s4d-together > .s4d-viewbox{grid-area:view}
  .s4d-right{grid-area:right; display:grid; justify-items:center; align-content:center; gap:8px; min-width:0; width:100%}
  .s4d-shared > .s4d-viewbox, .s4d-together > .s4d-viewbox{align-self:center}
  .s4d-right > .s4d-bench{flex-direction:column; flex-wrap:nowrap; width:auto; max-width:100%; gap:8px}
  .s4d .lv-cross{--mx-xcg:26px}
  .s4d-asks .rt-who .rt-n{white-space:normal; display:inline-block; max-width:6.4em; line-height:1.05}
}
/* Short screens: the projector at 720p */
@media (max-height: 760px){
  .s4d{row-gap:6px}
  .s4d-lead{font-size:21px}
  .s4d-line, .s4d-fb{font-size:17.5px}
  .s4d .s4d-asksw, .s4d .s4d-asks{--nt-h:30px; --nt-fs:20px; --nt-xg:11px; --nt-rg:4px}
  .s4d-ah .pic{--s:20px}
  /* the room's turn of shared: its keys take the place of the slopes found so far */
  .s4d-side.s4d-roomstep .s4d-slopes{display:none}
  .s4d .s4d-colw, .s4d .s4d-colw .nt-tab{--nt-h:30px; --nt-fs:21px; --nt-xg:12px; --nt-rg:4px}
  .s4d-sl{--nt-h:27px; --nt-fs:17px}
  .s4d-sl .mx-ch .pic{--s:24px}
  .s4d-grulev .s4d-quiet .nt-n.s4d-in{--nt-h:23px; --nt-fs:15.5px}
  .s4d-key{--nt-w:46px; --nt-h:30px}
  .s4d-pad{gap:4px}
  .s4d-grulev .s4d-quiet{font-size:16px; line-height:1.3}
}
/* A phone */
@media (max-width: 560px){
  .s4d{gap:5px}
  .s4d-lead{font-size:15.5px; line-height:1.25}
  .s4d-sline{font-size:13.5px; line-height:1.25}
  .s4d-line, .s4d-fb{font-size:14.5px}
  .s4d .nt-n.s4d-in{--nt-w:27px; --nt-h:23px; --nt-fs:14.5px; border-radius:7px}
  .s4d-bench{gap:6px 12px}
  .s4d-glab{font-size:13px}
  .s4d .s4d-colw, .s4d .s4d-colw .nt-tab{--nt-w:44px; --nt-h:30px; --nt-fs:18px; --nt-sx:8px; --nt-sy:3px; --nt-xg:13px; --nt-rg:5px}
  .s4d-col .rt-who .rt-n, .s4d .s4d-col .nt-rlab{font-size:13px}
  .s4d .s4d-asksw, .s4d .s4d-asks{--nt-w:42px; --nt-h:28px; --nt-fs:17px; --nt-sx:8px; --nt-sy:2px; --nt-xg:12px; --nt-rg:5px}
  .s4d-asks .rt-who .rt-n, .s4d .s4d-asks .nt-rlab{font-size:12.5px}
  .s4d-ah{font-size:13px}
  .s4d-ah .pic{--s:16px; margin-right:2px}
  .s4d-avgh, .s4d-ahc{font-size:12.5px; padding-left:12px}
  .s4d-avgc{padding-left:12px}
  .s4d .nt-n.s4d-avgn{--nt-w:50px; min-width:52px}
  .s4d-notin{font-size:11.5px}
  .s4d-arrow{font-size:20px}
  .s4d-cols{gap:4px 6px}
  .s4d-rulev{flex-wrap:nowrap; gap:6px 10px}
  .s4d-rulew{max-width:190px; gap:4px}
  .s4d-rulew .s4d-line{font-size:13.5px; line-height:1.3}
  .s4d-hop{display:none}
  .s4d-pad{max-width:330px; gap:4px}
  .s4d-key{--nt-w:42px; --nt-h:30px; --nt-fs:16px; padding:1px}
  .s4d-showme{font-size:13px; padding:1px 11px 3px}
  .s4d-qt{border-spacing:5px 2px; --nt-w:48px; --nt-h:26px; --nt-fs:15.5px}
  .s4d-wtn{font-size:14px; gap:4px}
  .s4d-wtn .pic{--s:18px}
  .s4d-wth{font-size:12.5px}
  .s4d-qt .s4d-qavgc{padding-left:6px}
  .s4d-askv{gap:6px 12px}
  .s4d-qbtn{font-size:15px; padding:2px 12px 4px}
  .s4d .nt-n.s4d-count{--nt-w:40px; --nt-h:32px; --nt-fs:19px}
  .s4d-trail{max-width:350px; gap:3px}
  .s4d .nt-n.s4d-tc{--nt-w:46px; --nt-h:22px; --nt-fs:11.5px; border-radius:6px}
  /* On a phone the slopes matrices show on the last step of shared only; in together the worked columns carry them */
  .s4d-side.s4d-early .s4d-slopes{display:none}
  .s4d-together .s4d-side{display:none}
  /* together on a phone: a tighter step block and smaller chips in its lines, so steps 1 and 4 fit 700 px */
  .s4d.s4d-together{gap:3px}
  .s4d-together .s4d-quiet{font-size:12.5px; line-height:1.25}
  .s4d-together .s4d-quiet .nt-n.s4d-in{--nt-h:18px; --nt-fs:12px}
  .s4d-together .s4d-colw, .s4d-together .s4d-colw .nt-tab{--nt-h:24px; --nt-fs:16px; --nt-rg:2px; --nt-xg:10px}
  /* shared on a phone: tighter worked columns, and the seven keys of the room in one row */
  .s4d.s4d-shared{gap:4px}
  .s4d-shared .s4d-asksw, .s4d-shared .s4d-asks{--nt-h:22px; --nt-fs:16px; --nt-rg:2px; --nt-xg:8px}
  .s4d-shared .s4d-sline .nt-n.s4d-in{--nt-h:19px; --nt-fs:13px}
  .s4d-shared .s4d-bench{gap:4px 12px}
  .s4d-asks .rt-who .rt-n{white-space:normal; display:inline-block; max-width:6.4em; line-height:1.05}
  .s4d-shared .s4d-key{--nt-w:40px}
}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-tick" viewBox="0 0 24 24"><path d="M4.4 12.9l4.8 4.7L19.6 6.6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-tick2" viewBox="0 0 30 24"><path d="M2.4 13l4.6 4.6L17.4 6.6M10.6 13l4.6 4.6L25.6 6.6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-cross" viewBox="0 0 24 24"><path d="M6.2 6.2l11.6 11.6M17.8 6.2L6.2 17.8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></symbol>
  <symbol id="i-cross2" viewBox="0 0 30 24"><path d="M3.4 6.6l9.4 10.8M12.8 6.6L3.4 17.4M16.8 6.6l9.4 10.8M26.2 6.6l-9.4 10.8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3.2 12q4.4-7.6 8.8 0t8.8 0" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <span class="brand"><span class="pre">Once Upon a </span><em>Matchmaker</em></span>
    <nav class="pager" id="pager" aria-label="Scenes"></nav>
    <button type="button" class="themebtn" id="themebtn" aria-label="Switch between light and dark (key t)" title="Light or dark (t)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
    </button>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="foot">
    <button type="button" class="navbtn" id="prev">&larr; Back</button>
    <div class="steps" id="steps" aria-hidden="true"></div>
    <button type="button" class="navbtn next" id="next">Next &rarr;</button>
  </footer>
</div>

<script>
/* Once Upon a Matchmaker: the shared base, owned by the main session.
   The scene engine (copied from Once Upon a Video Store), the data and the helpers that every section uses.
   Each agent's scenes live in their own file (sec1.js, ...) and register with MF.define; dev.html then calls
   MF.start(). The engine adds a section card before sections 2 to 5 and a leaf "Your turn in Python" at the
   end of sections 1 to 4 (PYTHON below), so agents never build those.

   A scene:
     MF.define("key", {
       act: 1,                       // the SECTION, 1 to 5 (the video store called them acts; `section: 1` works too);
                                     // scenes are shown section by section, in the order they were defined
                                     // (or in the order PLACE in this file lists them, as in section 3)
       title: "A newcomer",          // the heading of the leaf and the tooltip in the pager
       steps: 3,                     // clicks inside the scene (Next walks through them, then moves on)
       build: function (inner, api) {},   // once, on the first visit: fill inner (the scene's content box)
       step: function (k, api) {},        // every time step k (counted from 0) is shown, also when going Back,
                                          // so it must SET the state for k from scratch
       enter: function (api) {},          // optional: the scene became the active one
       leave: function (api) {},          // optional: another scene is about to be shown
       onkey: function (e, api) {}        // optional: return true to claim a key before the engine sees it
     });
   Only Next, Back, the pager and the keys change scenes or steps. A click inside a scene never does,
   so scenes are free to hold buttons, quizzes and puzzles. */
(function () {
  "use strict";

  var MINUS = "−";
  var SVGNS = "http://www.w3.org/2000/svg";

  /* DATA. Invented for the lesson: the profiles, the critic's answers and the ratings are not real data.
     The notebook uses the same numbers (notebook/data.py; notebook/build.py stops if the two disagree).
     Each section's agents use only the data of their section; the main session adds a section's data before
     its agents start. Change a number only together with every scene and notebook part that uses it. */

  // The three axes of a profile, each a question answered with the five marks. A positive number leans to
  // `pos`, a negative one to `neg`. g is the axis picture, gpos and gneg the pictures of its two ends,
  // d the tile colour, t the full name, short the label for table heads.
  var AXES = [
    { id: "real", t: "Real or fiction", short: "Real", pos: "real", neg: "fiction", g: "📰", gpos: "📰", gneg: "🐉",
      d: "#D6E8F7", ask: "Do you like real stories?", critic: "Did it really happen?" },
    { id: "comedy", t: "Comedy or drama", short: "Comedy", pos: "comedy", neg: "drama", g: "😂", gpos: "😂", gneg: "😢",
      d: "#FFF0B8", ask: "Do you like comedies?", critic: "Is it made to make you laugh?" },
    { id: "action", t: "Action or calm", short: "Action", pos: "action", neg: "calm", g: "💥", gpos: "💥", gneg: "🍵",

    hr.appendChild(el("th", "mx-bh"));

  /* THE PRODUCT VIEW

  /* POPPER'S SCHEMA

    { id: "ee", sym: ["EE"], label: "Error elimination", beat: "Estimate, then a verdict" },

    function clearInline() {
      cols.forEach(function (c) {

    var S = {
      el: root, PARTS: parts,
      show: function (k) { token++; seq.stop(); clearInline(); shown = aim = Math.max(0, Math.min(parts.length, k | 0)); paint(); return S; },
      reveal: function (k) {
        k = Math.max(0, Math.min(parts.length - 1, k | 0));
        if (aim !== shown) settle();
        var my = ++token;
        seq.stop();
        clearInline();
        if (shown > k) return Promise.resolve(true);
        shown = k;
        aim = k + 1;
        paint();
        if (!MOTION) { shown = aim; paint(); return Promise.resolve(true); }
        return play(parts[k], my).then(function (ok) {

})();

<script>
/* The arithmetic of section 2's what-if rule, as MF.W in the browser and as a module that node can require().
   Written by the main session from the rule fixed for the game and the notebook (core.js, S2; notebook/data.py,
   what_if). Owned by S2-B from 2026-11-03: it may add to it, and its check script (../tools/check_whatif.js) asserts
   every number the section 2 scenes show. Keep the rule itself unchanged: the notebook implements the same one.
   The derivation behind it is WHATIF.md.

   The rule: take the four guessed numbers of the corner in the order customer's first, customer's second, film's
   first, film's second, then again. For each: add 1; if the loss goes down, keep it. Otherwise subtract 1 from the
   original; if the loss goes down, keep that. Otherwise leave the number as it was. Stop when the loss is 0, or
   after a round in which no number moved.

   c is the customer's row of two numbers and f the film's column of two numbers (its first number on top), each a
   list of two; y is the rating. Since 2026-11-06 the prediction comes first: the loss is (prediction - y) squared.

   W.prediction(c, f)          the inner product of the customer's row and the film's column
   W.loss(c, f, y)             (the prediction minus y) squared
   W.tryMove(c, f, y, which, i) one what-if on one number: { change: 1, -1 or 0, before, plus, minus, after, c, f }
                               (plus and minus are the losses after +1 and -1; minus is null when +1 already helped;
                               c and f are the new guesses; the inputs are not changed)
   W.run(c, f, y, max)         the whole loop: a list of moves as tryMove returns them, in order, and the end
                               { moves, c, f, loss, stuck }

   Added by S2-B for scenes 6 to 8 (sec2w.js):
   W.HOP                       the size of a hop, 1
   W.partner(c, f, which, i)   the number that multiplies this one in the inner product: f[i] for "c", c[i] for "f"
   W.hop(c, f, y, which, i, by) one hop without deciding: { c, f, prediction, difference, loss } after it (the
                               difference is the prediction minus y)
   W.verdict(before, after)    "down", "up" or "same": what the hop did to the loss
   W.hops(c, f, y, max)        every single hop the rule tries, in order, as the scenes play them: { which, i, by,
                               from, to, partner, before, after, verdict, kept, c, f } (c and f after the hop; a hop
                               that is not kept is undone before the next one)
   W.rounds(res), W.kept(res)  the rounds a run of W.run used, and its moves that changed a number
   W.trail(c, f, y, res)       the losses of a run: the start, then the loss after each kept move
   W.survey(y, keypad)         every guess the keypad allows (5 numbers, 625 guesses): { total, exact, solved,

    var dn = bump(c, f, which, i, -1), minus = loss(dn.c, dn.f, y);
    if (minus < before) return { which: which, i: i, change: -1, before: before, plus: plus, minus: minus, after: minus, c: dn.c, f: dn.f };
    return { which: which, i: i, change: 0, before: before, plus: plus, minus: minus, after: before, c: c.slice(), f: f.slice() };
  }

        var m = tryMove(cur.c, cur.f, y, ORDER[k][0], ORDER[k][1]);

    /* The outlines of S.pair, measured in the cross: the box of the customer's row (its head and its cells) and of

    /* THE API */

      draw();
      if (so && so.pop) {
        c.forEach(function (rw, i) { rw.forEach(function (x, k) { if (x !== before.c[i][k]) moved(A.td(i, k)); }); });
        f.forEach(function (rw, j) { rw.forEach(function (x, k) { if (x !== before.f[j][k]) moved(B.td(j, k)); }); });

    }
    function moved(td) {

    }
    function values() {

    function cell(part, i, j) {
      if (part === "avg") return ring;

    }
    function guessCells() {
      var out = [];
      c.forEach(function (rw, i) { rw.forEach(function (x, k) { out.push(A.td(i, k)); }); });
      f.forEach(function (rw, j) { rw.forEach(function (x, k) { out.push(B.td(j, k)); }); });

      Array.prototype.forEach.call(root.querySelectorAll(".lv-mark"), function (td) {

        if (my !== tok || !ok) return false;
        arrived(my);
        bands([i, j]);
        return true;
      });
    }

      so = so || {};
      var pace = so.pace || 1;
      var my = begin(function () { end(); });
      S.askP = null;
      S.askS = null;
      S.lcell = null;
      S.pair = null;
      setDesk(null);
      bands(null);
      S.loss = toMap([], all);

      only = null;

      draw();

      var gap = TEMPO.wave * pace, acts = [], t = 120;

      });

      S.avg = false;

      at += TEMPO.tag * pace + 400 * pace;

    var DIV = "÷";
    function desk(mode) { setDesk(mode || null); return api; }

      draw();
      return api;
    }
    function room(on) { root.classList.toggle("lv-room", !!on); X.redraw(); later(); return api; }

    P.show({ done: "all", pair: null });

    var api = { PARTS: PARTS, LETTER: LETTER, show: show, reveal: reveal, set: set, setNumber: setNumber, values: values,
                matrix: function (part) { return mats[part] || null; }, cell: cell, guessCells: guessCells, mark: mark,
                note: note, stop: stop, el: root, people: people, films: films,
                showParts: showParts, add: add, focus: focus, predict: predict, work: work, pair: pair, losses: losses,
                lossWork: lossWork, fill: fill, land: land, average: average, desk: desk, slot: slot, format: format, room: room,
                product: P, layer: layer, cross: X,
                fly: function (from, to, fo) { fo = fo || {}; return fly(layer, from, to, fo.ms || TEMPO.fly, fo); },
                TEMPO: TEMPO };
    return api;
  }

  MF.L = { view: view, PARTS: PARTS, TEMPO: TEMPO, cellText: cellText, avgText: avgText };
})();
