/* Section 3 (optional), "Smaller hops": the grasshopper's scenes of Once Upon a Matchmaker, "A valley between the hops"
   (valley), "The grasshopper feels the slope" (feel) and "Again and again" (descent). Owned by agent S3-A (BRIEF-s3.md);
   S3-B's scenes eps and update (sec3d.js) come between feel and descent (core.js, PLACE). Classes start with s3-.
   Built on the guessing diagram MF.G (guess.js), the slope arithmetic MF.D (gradient-math.js) and the grasshopper and
   its ground MF.H (hopper.js, HOPPER.md). No data number is typed here: all come from MF.S2, MF.S3, MF.W and MF.D.

   Colours, as in the diagram: the loss and its curve violet, the slope, a hop and its triangle green, a jump ochre.
   Every step sets its whole state; motion plays only when a step is reached from the step before (or on entry at
   the first step), and Back or Next end it at once, drawing where it was going. Answers survive Back and Next until
   "Ask again". */
(function () {
  "use strict";
  var MF = window.MF;
  if (!MF || !MF.N || !MF.G || !MF.D || !MF.H || !MF.S3) return;
  var N = MF.N, D = MF.D, H = MF.H, GD = MF.G, el = MF.el, S2 = MF.S2, S3 = MF.S3, W = MF.W || {};
  var MOTION = !MF.reducedMotion;
  var WHO = S2.corner[0], FILM = S2.corner[1], Y = MF.rating(WHO, FILM);
  var ON = S3.on, START = S3.start, X0 = START[ON.which][ON.i];
  var HOP = W.HOP || 1, EPS = S3.eps, ALPHA = S3.alpha, TOL = S3.tol;
  var L0 = D.loss(START.c, START.f, Y);
  var FIRST = { c: S2.start[WHO].slice(), f: S2.start[FILM].slice() };   // the Matchmaker's first guess, part two
  var ZERO = W.ZERO || { c: [0, 0], f: [0, 0] };
  var CAP = 200;                                                         // the most steps a run plays
  var ARROW = " → ", DIV = "÷";

  /* SMALL TOOLS */
  // Fill a node with words and elements. A number cell keeps the punctuation right after it on its own line.
  function put(node, kids) {
    node.textContent = "";
    var list = (kids || []).filter(function (k) { return k !== null && k !== undefined && k !== ""; });
    for (var j = 0; j < list.length; j++) {
      var k = list[j], nx = list[j + 1];
      if (typeof k !== "string" && k.classList && k.classList.contains("nt-n") && typeof nx === "string" && /^[.,:;!?]/.test(nx)) {
        var m = nx.match(/^[.,:;!?]+/)[0], glue = el("span", "s3-nw");
        glue.appendChild(k);
        glue.appendChild(document.createTextNode(m));
        node.appendChild(glue);
        list[j + 1] = nx.slice(m.length);
        continue;
      }
      node.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
    }
    return node;
  }
  function h(tag, cls, kids) { return put(el(tag, cls), kids); }
  function button(text, cls, fn) {
    var b = el("button", "btn" + (cls ? " " + cls : ""), text);
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }
  function replay(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  // A number inside a line of words: the notation's cell, small, coloured by its sign.
  function num(x, places) { return H.cell(x, { cls: "s3-in", places: places }); }
  function numS(x) { var c = num(x); c.textContent = shortV(x); return c; }
  var WORDS = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve",
               "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen", "twenty"];
  function count(n) { return WORDS[n] || String(n); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function poss(n) { return n + (/s$/.test(n) ? "'" : "'s"); }
  function rowName(which) { return MF.get(which === "c" ? WHO : FILM).n; }
  function nameOf(which, i) { return poss(rowName(which)) + " " + MF.get(S2.dims[i]).t.toLowerCase(); }
  var NAME = nameOf(ON.which, ON.i);                                     // "Ida's first number"
  function sgn(x) { return x > 0 ? 1 : (x < 0 ? -1 : 0); }
  function at(x) { return D.set(START.c, START.f, ON.which, ON.i, x); }
  function lossAt(x) { var s = at(x); return D.loss(s.c, s.f, Y); }
  function same(a, b) { return a.c[0] === b.c[0] && a.c[1] === b.c[1] && a.f[0] === b.f[0] && a.f[1] === b.f[1]; }
  function Run() {
    var r = { tok: 0 };
    r.begin = function () { r.tok++; return r.tok; };
    r.ok = function (t) { return t === r.tok; };
    return r;
  }
  // A step plays its motion only when reached from the step before, or the first step on entry.
  function isLive(S, k) { return MOTION && (S.last === null ? k === 0 : k === S.last + 1); }
  function tidyExact(Dg) { H.tidy(Dg.el, { places: 6 }); }
  // Once the jumps begin: 2 decimals from 0.1 on, 4 below, 5 below 0.001 (0.00014, as the notebook prints it, so a
  // loss just above the tolerance never reads 0.0001), and "about 0" under the tolerance (a cell writes it "~0" with
  // the sign for about), so a long decimal never widens the diagram.
  function shortV(v) {
    var a = Math.abs(v);
    if (v && a < TOL) return "\u22480";
    return MF.dec(v, a >= 0.1 || !v ? 2 : (a >= 0.001 ? 4 : 5));
  }
  function tidyShort(Dg) { H.tidy(Dg.el, { round: shortV }); }
  // The three numbers held still are dimmed; the one watched keeps the diagram's ring.
  function held(Dg, on) {
    ["c", "f"].forEach(function (w) {
      [0, 1].forEach(function (i) { Dg.cell(w, i).classList.toggle("s3-held", !!on && !(w === ON.which && i === ON.i)); });
    });
  }
  // A list of losses as a trail, the first few and the last few when it is long: 1 -> 0.41 -> ... -> about 0.
  function trail(vals) {
    var kids = [], idx = vals.map(function (v, j) { return j; });
    if (vals.length > 6) idx = [0, 1, 2, -1, vals.length - 2, vals.length - 1];
    idx.forEach(function (j, q) {
      if (q) kids.push(el("span", "s3-arr", ARROW));
      if (j < 0) { kids.push(el("span", "s3-dots", "...")); return; }
      var v = vals[j];
      kids.push(v > 0 && v < TOL ? el("span", "s3-about", "about 0") : numS(v));
    });
    return kids;
  }

  /* THE FRAME OF A SCENE: the diagram and the ground side by side, a work panel (feel), the words under them.
     S.root.dataset.v says what shows: "solo" the diagram alone, "pair" the diagram and the ground, "three" also the
     work panel. On a phone the diagram gives way to the ground whenever the ground shows. */
  function frame(inner, key, o) {
    var S = { key: key, root: el("div", "s3 s3-" + key), mo: H.Motion(), run: Run(), last: null };
    S.root.s3Test = S;                                                   // for _try-s3a.js
    S.top = el("div", "s3-top");
    S.diaBox = el("div", "s3-dia");
    // The descent's numbers are rounded (shortV), so its diagram leaves the worked line out: -2.8 x -3 next to 8.41
    // would read as a slip.
    S.D = GD.diagram({ size: "sm", room: o.room || false, work: !o.rounded, c: START.c.slice(), f: START.f.slice() });
    S.diaBox.appendChild(S.D.el);
    S.top.appendChild(S.diaBox);
    S.gbox = el("div", "s3-gbox");
    S.GR = H.ground({ c: START.c, f: START.f });
    S.gbox.appendChild(S.GR.el);
    S.top.appendChild(S.gbox);
    if (o.work) { S.work = el("div", "s3-work"); S.top.appendChild(S.work); }
    S.note = el("div", "s3-note");
    S.lead = el("p", "s3-lead");
    S.say = el("p", "s3-say");
    S.ctl = el("div", "s3-ctl");
    S.note.appendChild(S.lead);
    S.note.appendChild(S.say);
    S.note.appendChild(S.ctl);
    S.root.appendChild(S.top);
    S.root.appendChild(S.note);
    inner.appendChild(S.root);
    return S;
  }
  function view(S, v) {
    var was = S.root.dataset.v;
    S.root.dataset.v = v;
    if (was !== v) S.GR.draw();
  }
  function words(S, lead, say) {
    put(S.lead, lead);
    put(S.say, say);
    S.say.hidden = !say || !say.length;
  }
  function halt(S) {
    S.run.begin();
    S.mo.stop();
    S.GR.stop();
    S.D.stop();
    if (S.T) S.T.stop();
  }
  function lab(text, cls) { return el("span", "s3-gl" + (cls ? " " + cls : ""), text); }
  function labNum(caption, x, cls) {
    var s = el("span", "s3-gl" + (cls ? " " + cls : ""));
    if (caption) s.appendChild(document.createTextNode(caption + " "));
    s.appendChild(num(x, 6));
    return s;
  }

  /* SCENE: A VALLEY BETWEEN THE HOPS
     MF.S3.start (prediction 3 against the rating 2, loss 1) is a guess where every hop of 1 makes the loss bigger or
     leaves it. Hold three numbers and watch one: the ground of Ida's first number, its point, the two hops of 1, the
     curve traced, a valley whose bottom lies between the hops. */
  var VA = null;
  var SIDE = [X0 - HOP, X0 + HOP];
  var HOPS1 = (function () {
    var list = [];
    ["c", "f"].forEach(function (w) {
      [0, 1].forEach(function (i) {
        [-HOP, HOP].forEach(function (d) {
          var s = D.set(START.c, START.f, w, i, START[w][i] + d);
          list.push(D.loss(s.c, s.f, Y));
        });
      });
    });
    return { bigger: list.every(function (l) { return l > L0; }), notLower: list.every(function (l) { return l >= L0; }) };
  })();
  function valleyView(GR) { return GR.fit(SIDE, { pad: 0.2 }); }
  function valleyBottom(GR) {
    var lo = GR.lowest();
    return { x: lo, loss: lo === null ? null : Math.round(GR.fn(lo) * 1e9) / 1e9, a: Math.floor(lo), b: Math.ceil(lo) };
  }
  function valleyWords(S, k) {
    var B = valleyBottom(S.GR);
    if (k === 0) {
      words(S, ["A guess for " + MF.get(WHO).n + " and " + MF.get(FILM).n + ", stuck at a loss of ", num(L0), "."],
        ["Each of its four numbers, moved up or down by " + MF.num(HOP) + ", makes the loss " +
         (HOPS1.bigger ? "bigger" : "bigger or leaves it at " + MF.num(L0)) + "."]);
    } else if (k === 1) {
      words(S, ["Hold three numbers still and watch one: " + NAME + "."],
        ["Across, the number; up, the loss. At ", num(X0), " the loss is ", num(L0), "."]);
    } else if (k === 2) {
      words(S, ["Hops of " + MF.num(HOP) + ", one each way:"],
        ["to ", num(SIDE[0]), " the loss is ", num(lossAt(SIDE[0])), ", to ", num(SIDE[1]), " it is ", num(lossAt(SIDE[1])),
         ". Both are higher than ", num(L0), "."]);
    } else if (k === 3) {
      words(S, ["Between the hops, the loss follows a curve: a valley."],
        ["Its bottom, a loss of ", num(B.loss), ", lies between ", num(B.a), " and ", num(B.b), "."]);
    } else {
      words(S, ["Hops of " + MF.num(HOP) + " jump over the valley."], [el("span", "s3-rub", "Smaller hops can land in it.")]);
    }
  }
  function valleyState(k) {
    var pts = [{ x: X0 }], arcs = [];
    if (k >= 2) {
      pts.push({ x: SIDE[0], kind: "whole" }, { x: SIDE[1], kind: "whole" });
      arcs.push({ x0: X0, x1: SIDE[0], kind: "whole", cls: k >= 4 ? "h-faded" : "" },
                { x0: X0, x1: SIDE[1], kind: "whole", cls: k >= 4 ? "h-hot" : "" });
    }
    return { view: valleyView(VA.GR), curve: k >= 3 ? 1 : 0, points: pts, arcs: arcs, hops: [], tangent: null, way: null,
             bottom: k >= 3, guide: k === 1 || k === 2 ? X0 : null, hopper: null };
  }
  function valleyDraw(k) {
    var S = VA;
    view(S, k === 0 ? "solo" : "pair");
    S.D.setRows(START.c, START.f);
    tidyExact(S.D);
    S.D.focus(k >= 1 ? ON.which : null, ON.i);
    held(S.D, k >= 1);
    S.GR.set(valleyState(k));
    valleyWords(S, k);
  }
  function valleyPlay(k) {
    var S = VA, tok = S.run.begin(), GR = S.GR;
    if (k === 1) {
      replay(S.gbox, "s3-rise");
      GR.set({ points: [], guide: null });
      S.mo.wait(500).then(function (ok) { if (ok && S.run.ok(tok)) GR.set(valleyState(1)); });
    } else if (k === 2) {
      // the diagram hops to each side and back; each hop leaves its point and its arc on the ground
      var st = valleyState(2), done = [{ x: X0 }], arcs = [];
      GR.set({ points: done, arcs: [] });
      var seq = SIDE.map(function (x, j) {
        return function () {
          S.D.set(ON.which, ON.i, x, { pop: true });
          tidyExact(S.D);
          arcs.push({ x0: X0, x1: x, kind: "whole", part: 0 });
          return GR.tween(700, function (e) { arcs[j].part = e; GR.set({ arcs: arcs }); }, H.ease.inOut).then(function (ok) {
            if (!ok || !S.run.ok(tok)) return false;
            done.push({ x: x, kind: "whole" });
            GR.set({ points: done });
            return S.mo.wait(700);
          });
        };
      });
      seq[0]().then(function (ok) { return ok && S.run.ok(tok) ? seq[1]() : false; }).then(function (ok) {
        if (!ok || !S.run.ok(tok)) return;
        S.D.set(ON.which, ON.i, X0, { pop: true });
        tidyExact(S.D);
        GR.set(st);
      });
    } else if (k === 3) {
      GR.set({ curve: 0, bottom: false });
      GR.trace(1500).then(function (ok) { if (ok && S.run.ok(tok)) GR.set({ bottom: true }); });
    } else if (k === 4) {
      var a = valleyState(4).arcs;
      a[1].part = 0;
      GR.set({ arcs: a });
      GR.tween(900, function (e) { a[1].part = e; GR.set({ arcs: a }); }, H.ease.inOut).then(function (ok) {
        if (ok && S.run.ok(tok)) GR.set(valleyState(4));
      });
    }
  }

  MF.define("valley", {
    act: 3,
    title: "A valley between the hops",
    steps: 5,
    build: function (inner) { VA = frame(inner, "valley", {}); },
    enter: function () { VA.last = null; },
    leave: function () { halt(VA); },
    step: function (k) {
      var live = isLive(VA, k);
      halt(VA);
      valleyDraw(k);
      if (live) valleyPlay(k);
      VA.last = k;
    }
  });

  /* SCENE: THE GRASSHOPPER FEELS THE SLOPE
     The grasshopper stands on Ida's first number and feels the ground with one tiny hop of MF.S3.eps (0.01), the one
     hop size of the whole section (Carlos, 2026-11-03: a small hop, kept fixed): the loss after the hop comes from the
     diagram, the change is the loss after minus the loss before, the slope the change divided by the hop, and the room
     picks it. The close view's loss axis starts above 0, or the triangle of a hop of 0.01 would be a few pixels tall.
     The last step opens the window onto the valley around -3 and draws the slope the grasshopper felt along the
     ground. The scene eps shows where the hop's part of it, 9 eps, comes from. */
  var FE = null;
  var MEAS = D.hop(START.c, START.f, Y, ON.which, ON.i, EPS);
  var SLOPE0 = D.slope(START.c, START.f, Y, ON.which, ON.i);              // the formula's slope, for the scene descent
  var TAN_LEN = 64;                                                      // half the length of the slope's line, px
  function closeView() {
    var lo = Math.min(MEAS.before, MEAS.after), hi = Math.max(MEAS.before, MEAS.after), d = hi - lo;
    return { x0: X0 - EPS * 0.35, x1: X0 + EPS * 1.45, y0: lo - d * 0.6, y1: hi + d * 0.5 };
  }
  // The ground around the start at the end: the left wall and the bottom of the valley, the start low enough for the
  // line of the slope to stay above the axis.
  function nearView(GR) { return GR.fit([X0 - 0.4, X0 + 0.4], { pad: 0.2 }); }
  function viewOf(GR, name) { return name === "valley" ? valleyView(GR) : (name === "near" ? nearView(GR) : closeView()); }
  // The choices for the slope: the slope and the two that a slip of the decimal point gives.
  function slopeChoices() {
    var s = MEAS.slope;
    return [s * 10, s, s / 10].sort(function (a, b) { return a - b; });
  }
  function feelState(k) {
    var m = MEAS;
    var s = { dia: X0, hops: [], pts: [{ x: X0 }], hopper: { x: X0, face: 1 }, tangent: null,
              view: k === 0 ? "valley" : (k === 4 ? "near" : "close"), curve: k === 0 || k === 4 ? 1 : 0, bits: [X0] };
    if (k === 1 ? !!FE.ans : (k === 2 || k === 3)) {
      s.dia = m.to;
      s.hops = [{ x: X0, eps: EPS, parts: k }];
      s.pts.push({ x: m.to });
      s.bits.push(m.to);
      s.hopper = { x: m.to, face: 1, lean: k === 3 ? X0 : null };
    }
    if (k === 4) {
      s.tangent = { x: X0, len: TAN_LEN, slope: m.slope };
      s.hopper = { x: X0, face: 1, lean: "tan" };
    }
    return s;
  }
  // The ground's labels: the hop over the triangle's top side, the change beside its right side, the slope inside it
  // once the room has it; at the end the slope in the empty corner above the bottom of the valley.
  function feelLabels(k, s) {
    var GR = FE.GR, m = MEAS, tri = s.hops.length === 1, nv = nearView(GR);
    GR.label("hop", tri ? labNum("hop", EPS, "s3-gl-hop") : null, { x: X0 + EPS / 2, y: m.before, dy: -16, anchor: "c" });
    GR.label("chg", tri && k >= 2 ? labNum("", m.change, "s3-gl-chg") : null, { x: m.to, y: (m.before + m.after) / 2, dx: 10, anchor: "l" });
    GR.label("slope", tri && k === 3 && FE.pick === "right" ? labNum("slope", m.slope, "s3-gl-slope") : null,
             { x: X0 + EPS * 0.66, y: m.before - (m.before - m.after) * 0.3, anchor: "c" });
    GR.label("tan", k === 4 ? labNum("slope", m.slope, "s3-gl-slope") : null,
             { x: X0 + (nv.x1 - X0) * 0.55, y: nv.y1 * 0.72, anchor: "c" });
  }
  // The work panel: the two small sums of the hop, the change, then the slope (its result the room's until picked).
  function calc(rows, resName) {
    var g = el("div", "s3-calc");
    rows.forEach(function (r, j) {
      g.appendChild(el("span", "s3-cl", r[0]));
      g.appendChild(el("span", "s3-op", j === 1 ? r[2] : ""));
      g.appendChild(num(r[1], 6));
    });
    g.appendChild(el("span", "s3-crule"));
    g.appendChild(el("span", "s3-cl s3-cres", resName));
    g.appendChild(el("span", "s3-op", "="));
    return g;
  }
  function calcChange() {
    var m = MEAS, g = calc([["after", m.after], ["before", m.before, MF.MINUS]], "change");
    g.appendChild(num(m.change, 6));
    return g;
  }
  function calcSlope(open) {
    var m = MEAS, g = calc([["change", m.change], ["hop", EPS, DIV]], "slope");
    g.appendChild(open ? N.slot({ cls: "s3-in" }) : num(m.slope, 6));
    return g;
  }
  function feelWork(k) {
    var w = FE.work;
    w.textContent = "";
    if (k === 2) w.appendChild(calcChange());
    else if (k >= 3) { w.appendChild(calcChange()); w.appendChild(calcSlope(k === 3 && FE.pick !== "right")); }
  }
  function feelWords(k) {
    var S = FE, m = MEAS;
    S.ctl.textContent = "";
    if (k === 0) {
      words(S, ["A grasshopper stands on " + NAME + ", at ", num(X0), "."],
        ["We see the whole valley. The grasshopper only feels the ground under its feet."]);
    } else if (k === 1) {
      if (!FE.ans) {
        words(S, ["It tries a tiny hop of " + MF.num(EPS) + " to the right, to ", num(m.to, 6), ". Will the loss go up or down?"], []);
        S.ctl.appendChild(choice("up", "↑", "Up"));
        S.ctl.appendChild(choice("down", "↓", "Down"));
      } else {
        var dir = m.after < m.before ? "down" : "up", right = FE.ans === dir;
        words(S, [el("span", "s3-tag " + (right ? "ok" : "no"), right ? "Right. " : "Not quite. "),
                  "The loss goes " + dir + ", from ", num(m.before, 6), " to ", num(m.after, 6), "."],
          ["The diagram works it out: at ", num(m.to, 6), " the prediction is ", num(D.prediction(at(m.to).c, at(m.to).f), 6), "."]);
        S.ctl.appendChild(button("Ask again", "quiet s3-again", function () { FE.ans = null; FE.last = null; FE.api.goStep(1); }));
      }
    } else if (k === 2) {
      words(S, ["The change: the loss after the hop minus the loss before."],
        [num(m.after, 6), " minus ", num(m.before, 6), " is ", num(m.change, 6), ": the loss went " +
         (m.change < 0 ? "down" : "up") + " by " + MF.num(Math.abs(m.change)) + "."]);
    } else if (k === 3) {
      if (FE.pick === "right") {
        words(S, [el("span", "s3-tag ok", "Right. "), "The slope is ", num(m.slope, 6), "."],
          [num(m.change, 6), " " + DIV + " " + MF.num(EPS) + " is ", num(m.slope, 6),
           ": for this hop the loss changes " + MF.num(Math.abs(m.slope)) + " times as much as the number."]);
      } else {
        words(S, ["The slope: the change divided by the hop. Which is it?"],
          FE.pick === "wrong" ? ["Divide the change by the hop: ", num(m.change, 6), " " + DIV + " " + MF.num(EPS) + "."] : []);
        slopeChoices().forEach(function (x) {
          var b = el("button", "s3-pick");
          b.type = "button";
          b.appendChild(num(x, 6));
          b.setAttribute("aria-label", "The slope is " + MF.spoken(Number(MF.num(x).replace(MF.MINUS, "-"))));
          if (FE.tried.indexOf(x) >= 0) { b.disabled = true; b.classList.add("s3-tried"); }
          b.addEventListener("click", function () {
            if (Math.abs(x - m.slope) < 1e-12) FE.pick = "right";
            else { FE.pick = "wrong"; FE.tried.push(x); }
            feelWork(3);
            feelWords(3);
            feelLabels(3, feelState(3));
          });
          S.ctl.appendChild(b);
        });
      }
    } else {
      words(S, ["The slope at ", num(X0), ", as the grasshopper feels it: ", num(m.slope, 6), "."],
        ["The minus says the ground goes " + (m.slope < 0 ? "down" : "up") + " to the right. The " + MF.num(Math.abs(m.slope)) +
         " says how steep: a tiny hop to the right " + (m.slope < 0 ? "lowers" : "raises") + " the loss by about " +
         MF.num(Math.abs(m.slope)) + " times the hop."]);
    }
  }
  function choice(dir, arrow, word) {
    var b = el("button", "s3-ch s3-" + dir);
    b.type = "button";
    b.appendChild(el("span", "s3-arrow", arrow));
    b.appendChild(el("span", "", word));
    b.setAttribute("aria-label", "The loss goes " + dir);
    b.addEventListener("click", function () { FE.ans = dir; feelHop(); });
    return b;
  }
  function feelDraw(k) {
    var S = FE, s = feelState(k);
    view(S, k <= 1 ? "pair" : "three");
    S.D.setRows(START.c, START.f);
    S.D.set(ON.which, ON.i, s.dia);
    tidyExact(S.D);
    S.D.focus(ON.which, ON.i);
    held(S.D, true);
    S.T.show(true, [0]);
    S.GR.set({ view: viewOf(S.GR, s.view), curve: s.curve, bits: s.curve ? [] : s.bits, points: s.pts,
               arcs: [], hops: s.hops, tangent: s.tangent, way: null, bottom: false, guide: null, hopper: s.hopper });
    feelLabels(k, s);
    feelWork(k);
    feelWords(k);
  }
  // The hop, after the room's answer: the grasshopper hops, the diagram works out the loss, the triangle's top side
  // stays.
  function feelHop() {
    var S = FE, tok = S.run.begin(), m = MEAS;
    S.mo.stop(); S.GR.stop();
    feelWords(1);
    S.ctl.hidden = true;
    S.lead.classList.add("s3-wait");
    S.GR.set({ hops: [{ x: X0, eps: EPS, parts: 1 }] });
    S.GR.move({ x: m.to, face: 1 }, { ms: MOTION ? 800 : 0, lift: 34 }).then(function (ok) {
      if (!S.run.ok(tok)) return;
      S.D.set(ON.which, ON.i, m.to, { pop: true });
      tidyExact(S.D);
      S.GR.set({ bits: [X0, m.to], points: [{ x: X0 }, { x: m.to }] });
      return S.mo.wait(MOTION ? 600 : 0);
    }).then(function () {
      if (!S.run.ok(tok)) return;
      feelDraw(1);
      S.ctl.hidden = false;
      S.lead.classList.remove("s3-wait");
      replay(S.note, "s3-rise");
    });
    S.T.hop([1, 0, 0, 0], { ms: 420 });
  }
  function feelPlay(k) {
    var S = FE, tok = S.run.begin(), GR = S.GR, s = feelState(k), m = MEAS;
    if (k === 0) {
      // the grasshopper drops onto the number in the diagram, then onto its point on the ground
      S.T.drop({ ms: 520 });
      GR.set({ hopper: { x: X0, face: 1, lift: 140 } });
      S.mo.wait(650).then(function (ok) {
        if (!ok || !S.run.ok(tok)) return;
        GR.move({ x: X0, face: 1 }, { ms: 750, ease: H.ease.out });
      });
    } else if (k === 1) {
      if (FE.ans) return;
      GR.set({ view: valleyView(GR), curve: 1, bits: [] });
      S.mo.wait(300).then(function (ok) {
        if (!ok || !S.run.ok(tok)) return;
        GR.set({ curve: 0, bits: [X0] });
        GR.zoom(closeView(), 1300);
      });
    } else if (k === 2) {
      GR.set({ hops: [{ x: X0, eps: EPS, parts: 1 }] });
      replay(S.work, "s3-rise");
      S.mo.wait(500).then(function (ok) { if (ok && S.run.ok(tok)) GR.set({ hops: [s.hops[0]] }); });
    } else if (k === 3) {
      replay(S.work.lastChild, "s3-rise");
      GR.set({ hopper: { x: m.to, face: 1 } });
      GR.move(s.hopper, { ms: 700 });
    } else if (k === 4) {
      // back to the start, the window opens onto the valley around it, the ground is traced, and the slope the
      // grasshopper felt is drawn along it
      GR.label("tan", null);
      GR.set({ view: closeView(), curve: 0, bits: [X0, m.to], points: [{ x: X0 }, { x: m.to }],
               hops: [{ x: X0, eps: EPS, parts: 3, faded: true }], tangent: null, hopper: { x: m.to, face: 1 } });
      S.D.set(ON.which, ON.i, m.to);
      tidyExact(S.D);
      GR.move({ x: X0, face: 1 }, { ms: 600, lift: 18 }).then(function (ok) {
        if (!ok || !S.run.ok(tok)) return false;
        S.D.set(ON.which, ON.i, X0, { pop: true });
        tidyExact(S.D);
        return GR.zoom(nearView(GR), 1000);
      }).then(function (ok) {
        if (!ok || !S.run.ok(tok)) return false;
        GR.set({ hops: [], points: [{ x: X0 }], bits: [X0] });
        return GR.trace(900);
      }).then(function (ok) {
        if (!ok || !S.run.ok(tok)) return;
        GR.set({ bits: [] });
        GR.tween(700, function (e) { GR.set({ tangent: { x: X0, len: TAN_LEN * e, slope: m.slope } }); }, H.ease.out).then(function (ok2) {
          if (ok2 && S.run.ok(tok)) feelLabels(4, s);
        });
        GR.move(s.hopper, { ms: 700 });
      });
    }
  }

  MF.define("feel", {
    act: 3,
    title: "The grasshopper feels the slope",
    steps: 5,
    build: function (inner, api) {
      FE = frame(inner, "feel", { work: true, room: ON.which });              // one grasshopper, on Ida's first number
      FE.api = api;
      FE.ans = null;
      FE.pick = null;
      FE.tried = [];
      FE.T = H.team({ cells: [FE.D.cell(ON.which, ON.i)], host: FE.D.el }, { size: 30 });
    },
    enter: function () { FE.last = null; },
    leave: function () { halt(FE); FE.ctl.hidden = false; FE.lead.classList.remove("s3-wait"); },
    step: function (k) {
      var live = isLive(FE, k);
      halt(FE);
      FE.ctl.hidden = false;
      FE.lead.classList.remove("s3-wait");
      feelDraw(k);
      if (live) feelPlay(k);
      FE.last = k;
    },
    onkey: function (e) {
      if (FE.api.step !== 1 || FE.ans) return false;
      if (e.key === "ArrowUp" || e.key === "u") { FE.ans = "up"; feelHop(); return true; }
      if (e.key === "ArrowDown" || e.key === "d") { FE.ans = "down"; feelHop(); return true; }
      return false;
    }
  });

  /* SCENE: AGAIN AND AGAIN
     One grasshopper alone on its ground jumps against its slope, alpha times the slope (MF.S3.alpha), until the loss is
     below MF.S3.tol; then one grasshopper on every number, all four jumping at once (MF.D.run): from the stuck guess,
     from part two's first guess, from the participant's guess (MF.S2.mine, set only when part two's corner ran in the
     same page, as in the tests) or one from the keypad, and from all zeros, where
     nothing moves. The last step names gradient descent. */
  var DS = null;
  var WALK = (function () {
    var w = D.walk(START.c, START.f, Y, ON.which, ON.i, ALPHA, 60), n = 0;
    while (n < w.length - 1 && w[n].loss >= TOL) n++;
    return w.slice(0, n + 1);
  })();
  var SHORTER = WALK.every(function (p, j) {
    return j < 2 || Math.abs(p.x - WALK[j - 1].x) < Math.abs(WALK[j - 1].x - WALK[j - 2].x);
  });
  function runOf(g) { return D.run(g.c, g.f, Y, ALPHA, CAP, TOL); }
  var OTHERS = null;
  // Other guesses from the keypad of part two's corner, in a fixed mixed order: ones that need a few steps and reach
  // the rating.
  function others() {
    if (OTHERS) return OTHERS;
    var K = S2.keypad, list = [];
    K.forEach(function (a) { K.forEach(function (b) { K.forEach(function (c) { K.forEach(function (d) {
      var g = { c: [a, b], f: [c, d] };
      if (D.loss(g.c, g.f, Y) === 0 || D.slides(g.c, g.f) || same(g, START) || same(g, FIRST)) return;
      var r = runOf(g);
      if (r.reached && r.steps >= 6) list.push(g);
    }); }); }); });
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var j = list.length - 1; j > 0; j--) { var q = Math.floor(rnd() * (j + 1)), t = list[j]; list[j] = list[q]; list[q] = t; }
    OTHERS = list;
    return OTHERS;
  }
  // DS.other counts the clicks on "Another guess": none shows the participant's guess, or the first of the others.
  function guessOf3() {
    var mine = S2.mine && S2.mine.c && S2.mine.f ? S2.mine : null, o = others();
    if (!DS.other && mine) return { g: { c: mine.c.slice(), f: mine.f.slice() }, mine: true };
    return { g: o[(mine ? DS.other - 1 : DS.other) % o.length], mine: false };
  }
  function walkView(GR) { return GR.fit([X0, WALK[WALK.length - 1].x], { pad: 0.14 }); }
  function walkDraw(j) {
    var S = DS, GR = S.GR, n = WALK.length - 1;
    var pts = WALK.slice(0, j + 1).map(function (p, q) { return { x: p.x, kind: q < j ? "old" : "dot" }; });
    var arcs = [];
    for (var q = 0; q < j; q++) arcs.push({ x0: WALK[q].x, x1: WALK[q + 1].x, kind: "jump" });
    GR.guess(START.c, START.f);
    GR.set({ view: walkView(GR), curve: 1, points: pts, arcs: arcs, hops: [], tangent: null, way: null, bottom: false,
             guide: null, hopper: { x: WALK[j].x, face: 1 } });
    S.D.setRows(START.c, START.f);
    S.D.set(ON.which, ON.i, WALK[j].x);
    tidyShort(S.D);
    S.D.focus(ON.which, ON.i);
    held(S.D, true);
    S.T.show(true, [0]);
    S.j = j;
    put(S.trail, ["Loss: "].concat(trail(WALK.slice(0, j + 1).map(function (p) { return p.loss; }))));
    S.play.textContent = S.playing ? "Pause" : (j >= n ? "Play again" : (j > 0 ? "Play on" : "Play"));
    if (j >= n && SHORTER) S.say.hidden = false;
  }
  function walkWords() {
    var w1 = WALK[1], u = D.update(X0, SLOPE0, ALPHA);
    words(DS, ["One grasshopper alone jumps against the slope, " + MF.num(ALPHA) + " times the slope."],
      ["At ", num(X0), " the slope is ", num(SLOPE0), ": a jump of " + MF.num(Math.abs(u.step)) + " to the " +
       (u.to > X0 ? "right" : "left") + ", to ", num(w1.x, 6), "." + (SHORTER ? " Near the bottom the ground is flatter, and the jumps get shorter." : "")]);
  }
  function walkPlay(from) {
    var S = DS, tok = S.run.begin(), GR = S.GR, n = WALK.length - 1;
    S.playing = true;
    walkDraw(from);
    function one(j) {
      if (!S.run.ok(tok)) return;
      if (j >= n) { S.playing = false; walkDraw(n); return; }
      var a = WALK[j], b = WALK[j + 1], f = Math.max(0.42, 1 - j * 0.09), arcs = [];
      for (var q = 0; q < j; q++) arcs.push({ x0: WALK[q].x, x1: WALK[q + 1].x, kind: "jump" });
      S.jt = j + 1;
      GR.set({ tangent: { x: a.x, len: 58 } });
      S.mo.wait(420 * f).then(function (ok) {
        if (!ok || !S.run.ok(tok)) return false;
        return GR.tween(360 * f, function (e) { GR.set({ way: { x0: a.x, x1: b.x, part: e } }); }, H.ease.out);
      }).then(function (ok) {
        if (!ok || !S.run.ok(tok)) return false;
        var arc = { x0: a.x, x1: b.x, kind: "jump", part: 0 };
        GR.set({ tangent: null });
        return Promise.all([
          GR.move({ x: b.x, face: 1 }, { ms: 620 * f, lift: 20 }),
          GR.tween(620 * f, function (e) { arc.part = e; GR.set({ arcs: arcs.concat([arc]), way: { x0: a.x, x1: b.x, part: 1 - e } }); }, H.ease.inOut)
        ]).then(function (r) { return r[0] && r[1]; });
      }).then(function (ok) {
        if (!ok || !S.run.ok(tok)) return;
        S.D.set(ON.which, ON.i, b.x, { pop: true });
        tidyShort(S.D);
        S.T.hop([1, 0, 0, 0], { ms: 300 });
        walkDraw(j + 1);
        S.mo.wait(260 * f).then(function (ok2) { if (ok2) one(j + 1); });
      });
    }
    S.mo.wait(from === 0 ? 700 : 150).then(function (ok) { if (ok) one(from); });
  }
  function walkToggle() {
    var S = DS, n = WALK.length - 1;
    if (S.api.step !== 0) return;
    if (S.playing) {
      // pause: the jump in flight lands, then everything stops
      var j = S.jt || S.j;
      S.playing = false;
      halt(S);
      walkDraw(Math.min(j, n));
      return;
    }
    halt(S);
    walkPlay(S.j >= n ? 0 : S.j);
  }
  // One grasshopper on each number, all jumping at once.
  function dirsOf(a, b) { return [sgn(b.c[0] - a.c[0]), sgn(b.c[1] - a.c[1]), sgn(b.f[0] - a.f[0]), sgn(b.f[1] - a.f[1])]; }
  function teamDraw(g, r, j) {
    var S = DS, st = r.states[j];
    S.D.setRows(st.c, st.f);
    tidyShort(S.D);
    S.D.focus(null);
    held(S.D, false);
    S.T.show(true);
    if (j + 1 < r.states.length) S.T.face(dirsOf(st, r.states[j + 1]));
    put(S.trail, ["Loss: "].concat(trail(r.states.slice(0, j + 1).map(function (x) { return x.loss; }))));
  }
  function teamPlay(g, r, after) {
    var S = DS, tok = S.run.begin(), st = r.states, n = st.length - 1;
    var ms = Math.max(140, Math.min(600, 6000 / Math.max(1, n)));
    teamDraw(g, r, 0);
    S.say.hidden = true;
    function one(j) {
      if (!S.run.ok(tok)) return;
      if (j > n) { S.say.hidden = false; replay(S.say, "s3-rise"); if (after) after(); return; }
      S.D.setRows(st[j].c, st[j].f);
      tidyShort(S.D);
      S.T.hop(dirsOf(st[j - 1], st[j]), { ms: ms * 0.9 });
      put(S.trail, ["Loss: "].concat(trail(st.slice(0, j + 1).map(function (x) { return x.loss; }))));
      S.mo.wait(ms).then(function (ok) { if (ok) one(j + 1); });
    }
    S.mo.wait(600).then(function (ok) { if (ok) one(1); });
  }
  function runWords(r, g, intro) {
    var last = r.states[r.states.length - 1], p = D.prediction(last.c, last.f);
    if (D.loss(g.c, g.f, Y) === 0) {
      return ["This guess already predicts the rating " + MF.num(Y) + ": every slope is 0, so no grasshopper jumps."];
    }
    if (D.slides(g.c, g.f)) {
      if (same(g, ZERO)) return ["All four at 0: every slope is 0, so no grasshopper jumps."];
      return ["The film's numbers are " + poss(MF.get(WHO).n) + " with the signs flipped: the grasshoppers slide toward all zeros, and the loss stops near ",
              num(Y * Y), "."];
    }
    if (r.reached) {
      var lands = MF.dec(p, 2) === MF.num(Y);
      return [(intro || "") + "After " + count(r.steps) + " steps the loss is below " + MF.num(TOL) + ", and the prediction " +
              (lands ? "lands on the rating, " : "is "), lands ? num(Y) : num(p, 2), lands ? "." : ", close to the rating " + MF.num(Y) + "."];
    }
    return ["After " + count(r.steps) + " steps the loss is ", numS(last.loss), "."];
  }
  function blank(GR) {
    GR.guess(START.c, START.f);
    GR.set({ view: walkView(GR), curve: 0, bits: [], points: [], arcs: [], hops: [], tangent: null, way: null, bottom: false, guide: null,
             hopper: null });
  }
  function teamStep(k, live) {
    var S = DS, g, lead, intro = "";
    blank(S.GR);
    if (k === 1) { g = START; lead = ["Now one grasshopper on every number, all four jumping at once, from the stuck guess."]; }
    else if (k === 2) { g = FIRST; lead = ["From " + poss(MF.get(WHO).n) + " and " + poss(MF.get(FILM).n) + " numbers in the first guess of part two: a loss of ",
                                    num(D.loss(FIRST.c, FIRST.f, Y)), "."]; }
    else {
      var q = guessOf3();
      g = q.g;
      lead = q.mine ? ["From your own guess for " + MF.get(WHO).n + " and " + MF.get(FILM).n + "."]
                    : (DS.other ? ["From another guess."]
                                : ["From a guess of four whole numbers between " + MF.num(S2.keypad[0]) + " and " +
                                   MF.num(S2.keypad[S2.keypad.length - 1]) + "."]);
    }
    var r = runOf(g);
    view(S, "solo");
    words(S, lead, runWords(r, g, intro));
    S.ctl.textContent = "";
    S.ctl.appendChild(button("Play again", "quiet s3-again", function () { halt(S); teamPlay(g, r); }));
    if (k === 3) S.ctl.appendChild(button("Another guess", "s3-other", function () {
      DS.other++;
      halt(S);
      teamStep(3, MOTION);
    }));
    S.trail.hidden = false;
    if (live) teamPlay(g, r);
    else { teamDraw(g, r, r.states.length - 1); S.say.hidden = false; }
  }
  function zeroStep(live) {
    var S = DS, GR = S.GR, sl = D.slopes(ZERO.c, ZERO.f, Y);
    var still = [sl.c[0], sl.c[1], sl.f[0], sl.f[1]].every(function (x) { return x === 0; });
    view(S, "pair");
    S.D.setRows(ZERO.c, ZERO.f);
    tidyShort(S.D);
    S.D.focus(ON.which, ON.i);
    held(S.D, false);
    S.T.show(true);
    GR.guess(ZERO.c, ZERO.f);
    GR.set({ view: GR.fit([-1, 1], { pad: 0.25 }), curve: 1, points: [{ x: 0 }], arcs: [], hops: [], tangent: { x: 0, len: 36 },
             way: null, bottom: false, guide: null, hopper: { x: 0, face: 1 } });
    words(S, ["All four at 0."],
      [(still ? "Every slope is 0: the ground is flat, no grasshopper knows which way is down, and none jumps. " : "") +
       "The loss stays at ", num(D.loss(ZERO.c, ZERO.f, Y)), ". A guess whose film numbers are the customer's with the signs flipped slides here and stops too."]);
    S.ctl.textContent = "";
    S.trail.hidden = true;
    if (live) {
      var tok = S.run.begin();
      S.T.hop([-1, 1, -1, 1], { ms: 420 });
      GR.ponder(1, 1400).then(function (ok) { if (ok && S.run.ok(tok)) GR.ponder(1, 1400); });
    }
  }
  function nameStep() {
    var S = DS, r = runOf(START), last = r.states[r.states.length - 1];
    view(S, "solo");
    blank(S.GR);
    S.D.setRows(last.c, last.f);
    tidyShort(S.D);
    S.D.focus(null);
    held(S.D, false);
    S.T.show(true);
    words(S, [el("span", "s3-rub", "That is gradient descent.")],
      ["Every number feels its slope and jumps a little against it, again and again."]);
    S.ctl.textContent = "";
    S.trail.hidden = true;
    S.way.hidden = false;
  }

  MF.define("descent", {
    act: 3,
    title: "Again and again",
    steps: 6,
    build: function (inner, api) {
      DS = frame(inner, "descent", { room: true, rounded: true });
      DS.api = api;
      DS.other = 0;
      DS.j = 0;
      DS.playing = false;
      DS.trail = el("p", "s3-trail");
      DS.row = el("div", "s3-trow");
      DS.note.insertBefore(DS.row, DS.ctl);
      DS.row.appendChild(DS.trail);
      DS.row.appendChild(DS.ctl);
      DS.play = button("Play", "primary s3-play", walkToggle);
      DS.way = h("p", "s3-way", ["Next: part 3 of the optional notebook writes it in Python; then the second half, one grasshopper on every number of a whole table."]);
      DS.note.appendChild(DS.way);
      DS.T = H.team(DS.D, { size: 30 });
    },
    enter: function () { DS.last = null; },
    leave: function () { DS.playing = false; halt(DS); },
    step: function (k) {
      var live = isLive(DS, k);
      DS.playing = false;
      halt(DS);
      DS.way.hidden = true;
      DS.trail.hidden = false;
      if (k === 0) {
        view(DS, "pair");
        walkWords();
        DS.ctl.textContent = "";
        DS.ctl.appendChild(DS.play);
        if (live) walkPlay(0);
        else walkDraw(WALK.length - 1);
      } else if (k <= 3) {
        teamStep(k, live);
      } else if (k === 4) zeroStep(live);
      else nameStep();
      DS.last = k;
    },
    onkey: function (e) {
      if (DS.api.step === 0 && (e.key === " " || e.key === "p")) { walkToggle(); return true; }
      return false;
    }
  });
})();
</script>
<script>
/* Section 3 (optional), smaller hops: S3-B's scenes eps ("Calculating the slope") and update ("Downhill"),
   BRIEF-s3d.md, classes s3d-. core.js (PLACE) shows them between S3-A's scenes feel and descent (sec3.js).
   Built on the guessing diagram MF.G (guess.js, the API of its top comment), the notation MF.N, the matrix MF.M, the
   grasshopper's ground MF.H and the arithmetic MF.D (gradient-math.js). GRADIENT.md has the derivation and every
   number these scenes show, and ../tools/check_gradient.js asserts them. No number is typed here: all come from
   MF.S2, MF.S3 and MF.D.

   The scene eps was rebuilt by the main session on 2026-11-04 at Carlos's request: the grasshopper's hop of 0.01
   with its numbers in place of a letter, the loss after the hop straight from the prediction and the rating (no
   difference, no square: "we go from predictions and ratings directly into losses"), and the triangle of the hop
   beside the change and the slope. Its key stays "eps", the hop it follows.
   The port to the textbook cross (agent b, 2026-11-06, BRIEF-port-b.md): the corner is MF.G's small cross (Ida's row
   on the left, Paddington's column above the prediction); every view of the four numbers keeps those shapes (the
   slopes, the old and the new numbers and the gradient are an L: Ida's row, Paddington's column above its right end);
   the prediction stands on the left of the rating; the slope rule reads 2 x partner x (prediction - rating).

   Every step sets its whole state; motion plays only when a step is reached from the step before; Back, the pager
   and leaving draw the end state at once and stop every timer. The room's answers survive Back and Next. */
(function () {
  "use strict";
  var MF = window.MF;
  if (!MF || !MF.N || !MF.G || !MF.D || !MF.M) return;
  var N = MF.N, G = MF.G, D = MF.D, M = MF.M, el = MF.el, S2 = MF.S2, S3 = MF.S3;
  var MOTION = !MF.reducedMotion;
  var T = N.TEMPO;
  var WHO = S2.corner[0], FILM = S2.corner[1], Y = MF.rating(WHO, FILM);
  var START = { c: S3.start.c.slice(), f: S3.start.f.slice() };
  var ON = [S3.on.which, S3.on.i], ALPHA = S3.alpha;
  var MINUS = MF.MINUS, DIVIDE = "÷", ARROW = "→";
  var ORDER = [["c", 0], ["c", 1], ["f", 0], ["f", 1]];

  /* THE NUMBERS OF THE TWO SCENES, all from MF.S3 and MF.D */
  function at(g, o) { return g[o[0]][o[1]]; }
  function same(a, b) { return a[0] === b[0] && a[1] === b[1]; }
  function round(x, p) { var r = parseFloat(x.toFixed(p)); return r === 0 ? 0 : r; }
  var SL = D.slopes(START.c, START.f, Y);
  var DIFF0 = D.prediction(START.c, START.f) - Y, LOSS0 = D.loss(START.c, START.f, Y);   // the prediction minus the rating
  // The slope rule for every number: the one worked out from the hop first, then the others; the last is the room's.
  var CHAIN = [ON].concat(ORDER.filter(function (o) { return !same(o, ON); })).map(function (o) {
    return { at: o, partner: D.partner(START.c, START.f, o[0], o[1]), diff: DIFF0, slope: at(SL, o),

  var UPD = ORDER.map(function (o) { var u = D.update(at(START, o), at(SL, o), ALPHA); u.at = o; return u; });

  /* WORDS */
  function poss(n) { return n + (/s$/.test(n) ? "'" : "'s"); }
  function rowName(which) { return MF.get(which === "c" ? WHO : FILM).n; }
  function ordWord(i) { return MF.get(S2.dims[i]).t.toLowerCase(); }                 // "first number"
  function nameOf(o) { return poss(rowName(o[0])) + " " + ordWord(o[1]); }          // "Ida's first number"
  function shortOf(o) { return poss(rowName(o[0])) + " " + MF.get(S2.dims[o[1]]).short.toLowerCase(); }  // "Ida's first"
  function mateOf(o) { return nameOf([o[0] === "c" ? "f" : "c", o[1]]); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* SMALL TOOLS */
  // Fill a node with words and elements. A number cell keeps the punctuation right after it on its own line.
  function put(node, kids) {
    node.textContent = "";
    var list = (kids || []).filter(function (k) { return k !== null && k !== undefined; });
    for (var j = 0; j < list.length; j++) {
      var k = list[j], nx = list[j + 1];
      if (typeof k !== "string" && k.classList && k.classList.contains("nt-n") && typeof nx === "string" && /^[.,:;!?]/.test(nx)) {
        var m = nx.match(/^[.,:;!?]+/)[0], glue = el("span", "s3d-nw");

  function button(text, cls, fn) {

  // Timers that one call cancels: run([[t, fn], ...], end) resolves true at the end, false when stop() came first.
  function Seq() {

      q.open = [];

        q.timers.push(setTimeout(function () {

    } catch (e) {}
  }
  // A copy of a cell travels from one element to another inside the scene's layer, then goes.

    o = o || {};

    var base = layer.getBoundingClientRect(), a = from.getBoundingClientRect(), z = to.getBoundingClientRect();

    g.style.height = a.height + "px";

  function off(node, hidden) { if (node) node.classList.toggle("s3d-off", !!hidden); }

  function anyCell(x, cls) { return N.cell(x, { cls: cls }); }

  function ni(x) { return N.cell(x, { cls: "s3d-in" }); }

  /* A COLUMN in the look of the notation's stack: one number per row, each after the first with its operator (x by
     default) between it and the row above, a rule, then the result. o.rows: [{ label, x, op, cls }]; o.res: { label,
     x, cls, slot }. x is a number or an expression in eps. */
  function Col(o) {
    var C = { rows: [], spec: o };
    var wrap = el("div", "nt-wrap s3d-colw" + (o.cls ? " " + o.cls : ""));
    var t = el("table", "rt nt-tab s3d-col");
    var tb = el("tbody");
    o.rows.forEach(function (r, j) {
      var tr = el("tr", "nt-row " + (j ? "nt-bot" : "nt-top"));
      var th = el("th", "rt-who nt-who");
      th.scope = "row";
      th.appendChild(el("span", "rt-n", r.label || ""));
      tr.appendChild(th);
      var td = el("td", "rt-c nt-c"), x = null;
      if (j) {
        x = el("span", "nt-x", r.op || N.TIMES);
        x.setAttribute("aria-hidden", "true");
        td.appendChild(x);
      }
      var hold = el("span", "nt-h"), c = anyCell(r.x, r.cls);
      hold.appendChild(c);
      td.appendChild(hold);
      tr.appendChild(td);
      tb.appendChild(tr);

    });

    pc.appendChild(rh);
    rr.appendChild(pc);

    C.hot = function (on) {
      C.rows.forEach(function (r) { r.cell.classList.toggle("nt-hot", on); if (r.x) r.x.classList.toggle("nt-on", on); });

  // The result of a column comes in: the numbers light up, copies of them travel down, the result lands.

      [t1, function () { C.rows.forEach(function (r) { fly(layer, r.cell, C.rh, T.flow * pace, { scale: 0.92, fade: true }); }); }],
      [t2, function () { C.showRes(true); pop(C.res, 560 * pace); }],
      [t3, function () { C.hot(false); }]

  /* THE CORNER'S FOUR NUMBERS AS AN L (the port to the textbook cross, 2026-11-06): Ida's two as a row, Paddington's two
     as a column standing above the right end of her row, the shapes of the small cross without its prediction (Carlos:
     a close-up keeps the shapes shown before). o.values [[c0, c1], [f0, f1]] (default: four slots), o.caption, o.size
     (default "sm"), o.brackets (default true), o.cls. L.set(i, j, x, opts), L.td(i, j) and L.item(i, j) as MF.M's matrix
     (i 0 the customer, 1 the film; j the number); L.brackets(on), L.bracketed(); L.mats, the row and the column; L.el. */
  function Lmat(o) {
    o = o || {};
    var v = o.values, br = o.brackets !== false, size = o.size || "sm";
    var a = M.matrix({ rows: [WHO], cols: S2.dims, values: v ? [v[0]] : null, fill: v ? "numbers" : "slots", rowHeads: "chip",
                       colHeads: "none", size: size, brackets: br, phonePics: true, cls: "s3d-La" });
    var bm = M.matrix({ rows: [FILM], cols: S2.dims, values: v ? [v[1]] : null, fill: v ? "numbers" : "slots", transpose: true,
                        rowHeads: "pic", colHeads: "none", size: size, brackets: br, cls: "s3d-Lb" });
    var root = el("div", "s3d-L" + (o.cls ? " " + o.cls : ""));

    root.appendChild(bm.el);

      set: function (i, j, x, opts) { return mats[i] ? mats[i].set(0, j, x, opts) : null; },
      td: function (i, j) { return mats[i] ? mats[i].td(0, j) : null; },
      item: function (i, j) { return mats[i] ? mats[i].item(0, j) : null; },

  }

  /* THE ROOM'S TURN: one answer on keys to tap, a hint after each wrong try, "Show me" after two wrong tries. */
  var TRIES = 2;
  function keypad(values, onPick) {
    var g = el("div", "s3d-pad");
    g.setAttribute("role", "group");
    g.setAttribute("aria-label", "Your answer");

      var k = el("button", "s3d-key");
      k.type = "button";
      k.dataset.v = String(v);

      g.appendChild(k);
    });
    return g;
  }
  // o.keys, o.answer, o.slot() the slot element of the moment, o.ask() and o.hint(tries) and o.right(how) the words,

  function Room(o) {

    R.text = el("p", "s3d-fb");

    R.pad = keypad(o.keys, function (x) { R.pick(x); });
    R.el = h("div", "s3d-room", [R.pad, h("div", "s3d-fbw", [R.text, R.showme])]);
    R.draw = function () {

      } else {

  var RANGE = (function () { var a = []; for (var x = -KEYMAX; x <= KEYMAX; x++) a.push(x); return a; })();

  /* =====================================================================================================
     SCENE eps, "Calculating the slope". Carlos, 2026-11-04: a concrete hop in place of a letter ("Don't use the
     epsilon because it makes it too confusing"), the square given directly, and the triangle with the grasshopper
     where the slope is calculated ("Just to give the numbers there"). The grasshopper's one hop, MF.S3.eps (0.01),
     carried through the diagram with its numbers: the hopped number, the product that changes, the prediction, the
     loss after the hop straight from the rating and the prediction. Then the change and the slope, each beside the triangle of the

  var E = { last: null, k: 0, tok: 0, Q: Seq(), ans: {}, mode: null, perch: null, v: {} };

  var HV = (function () {
    var i = ON[1], pred = D.prediction(HOPPED.c, HOPPED.f);
    return { to: round(MEAS.to, 6), prodBefore: round(START.c[i] * START.f[i], 6), prodAfter: round(HOPPED.c[i] * HOPPED.f[i], 6),
             prediction: round(pred, 6), difference: round(pred - Y, 6), after: round(MEAS.after, 6),

  })();
  var ESTEPS = [
    { mode: "hop", parts: 2, views: ["intro"],
      lead: function () { return [cap(nameOf(ON)) + " hops by " + MF.num(EPS_V) + ", from ", ni(X0), " to ", ni(HV.to), "."]; } },
    { mode: "hop", parts: 3, views: ["intro"], live: livePred,
      lead: function () {
        return ["Only the " + PROD + " product changes, from ", ni(HV.prodBefore), " to ", ni(HV.prodAfter), ". The prediction is ",
                ni(HV.prediction), "."];
      } },
    { mode: "hop", parts: 4, views: ["intro"], live: liveLoss,
      lead: function () { return ["The loss after the hop, straight from the prediction and the rating: ", ni(HV.after), "."]; } },
    { mode: "hop", parts: 4, views: ["tri", "change"], tri: 2, live: liveChange, ph: "nodia", small: true,
      lead: function () { return ["How much did the loss change? Take away the loss before the hop, ", ni(LOSS0), "."]; } },
    { mode: "hop", parts: 4, views: ["tri", "change", "per"], tri: 3, live: livePer, ph: "nodia", small: true,
      lead: function () { return ["The slope: the change divided by the hop, ", ni(HV.slope), "."]; } },
    { mode: "plain", parts: 4, views: ["chain"], chain: 0, ph: "nodia", side: true,
      lead: function () { return ["A rule gives the slope without a hop: ", ni(D.FACTOR), " times the partner, times the prediction minus the rating."]; } },

  function aliveE(my) { return my === E.tok; }

  }

  }

  function perch() {
    removePerch();

    var c = E.D.cell(ON[0], ON[1]), anchor = c && c.parentNode;
    if (!anchor) return;
    var p = el("span", "s3d-perch");
    p.setAttribute("aria-hidden", "true");

    anchor.appendChild(p);

  }
  function removePerch() { if (E.perch && E.perch.parentNode) E.perch.parentNode.removeChild(E.perch); E.perch = null; }
  // The ring of the number in question, and the rubric rings of its partner, of the rating and of the prediction.
  function marksE(o, mates) {
    var Dg = E.D;
    Array.prototype.forEach.call(Dg.el.querySelectorAll(".s3d-mate"), function (c) { c.classList.remove("s3d-mate"); });
    Dg.focus(o ? o[0] : null, o ? o[1] : 0);
    if (!o || !mates) return;
    var mate = Dg.cell(o[0] === "c" ? "f" : "c", o[1]);
    [mate, Dg.result("rating"), Dg.result("pair")].forEach(function (c) { if (c) c.classList.add("s3d-mate"); });
  }

  /* The bench under the diagram: one view or more per step. */
  function introView() {
    return h("div", "s3d-view s3d-intro", [h("p", "s3d-line s3d-quiet", ["Before the hop, the loss is ", ni(LOSS0), "."])]);
  }
  // The triangle of the hop on the ground of the hopped number, in the close view of the scene feel (its loss axis
  // starts above 0, or the triangle of a hop of 0.01 would be a few pixels tall); the curve stays hidden but for the
  // ground under the grasshopper's feet. parts 1 the hop across, 2 also the change, 3 also the slope.
  function closeView() {
    var lo = Math.min(MEAS.before, MEAS.after), hi = Math.max(MEAS.before, MEAS.after), d = hi - lo;
    return { x0: X0 - EPS_V * 0.35, x1: X0 + EPS_V * 1.45, y0: lo - d * 0.6, y1: hi + d * 0.5 };
  }
  function glab(caption, x, cls) {
    var s = el("span", "s3d-gl" + (cls ? " " + cls : ""));
    if (caption) s.appendChild(document.createTextNode(caption + " "));
    s.appendChild(N.cell(x, { cls: "s3d-in" }));
    return s;
  }
  function triView() {
    E.gbox = el("div", "s3d-gbox");
    E.GR = MF.H.ground({ c: START.c, f: START.f, which: ON[0], i: ON[1] });
    E.gbox.appendChild(E.GR.el);
    return h("div", "s3d-view s3d-triv", [E.gbox]);
  }

    diaDraw(START);
    put(U.note, ["Before the step, the loss is ", ni(LOSS0), "."]);
    U.Q.run([[700, function () {
      diaDraw(s.rows);
      ORDER.forEach(function (o) { pop(U.D.cell(o[0], o[1]), 520); });
    }], [1500, function () { pop(U.D.result("loss")); diaNote(s); }]], 1600);
  }
  // The gradient: the four slopes in the corner's shapes (Ida's as a row, Paddington's as a column), its brackets
  // drawn when it is named.
  var GD = {};
  function gradView() {
    GD.m = Lmat({ values: [SL.c, SL.f], size: "md", brackets: true, caption: "the gradient", cls: "s3d-grad" });
    Array.prototype.forEach.call(GD.m.el.querySelectorAll(".nt-n"), function (c) { c.classList.add("s3d-slope"); });
    GD.line = h("p", "s3d-line", [b("Gradient descent"), ": move every number against its slope, a small step at a time, again and again."]);
    return h("div", "s3d-view s3d-gradv", [GD.m.el, GD.line]);
  }

  function stepU(k, live) {
    var s = USTEPS[k], my = ++U.tok;
    U.k = k;
    U.Q.stop();
    U.layer.textContent = "";
    if (U.D) U.D.stop();
    put(U.lead, s.lead());
    Object.keys(U.v).forEach(function (n) { U.v[n].hidden = n !== s.view; });
    U.root.classList.toggle("s3d-ondia", s.view === "dia");
    if (s.view === "rule") {
      RU.panels.classList.toggle("s3d-off", !s.panels);
      if (live && MOTION && s.panels) {
        Array.prototype.forEach.call(RU.panels.children, function (p, j) { p.style.animationDelay = (j * 0.5) + "s"; });
        RU.panels.classList.remove("s3d-rise");
        void RU.panels.offsetWidth;
        RU.panels.classList.add("s3d-rise");
      } else RU.panels.classList.remove("s3d-rise");
    }
    if (s.view === "work") {
      if (s.room) {
        if (!WK.roomBox.firstChild) WK.roomBox.appendChild(roomU().el);
        WK.roomBox.hidden = false;
        workDraw(s.at, false);
        var st = roomStateU();
        if (st.done) {
          newCell(s.at, round(UPD[s.at].to, 2));
          var cs = workCols(s.at);
          cs.A.all(true);
          cs.B.all(true);
          WK.cols.hidden = false;
        } else {
          WK.cols.textContent = "";
          WK.cols.hidden = true;
        }
        roomU().show();
      } else {
        WK.roomBox.hidden = true;
        WK.cols.hidden = false;
        if (live && MOTION) liveWork(my, s.at);
        else {
          workDraw(s.at, true);
          var c2 = workCols(s.at);
          c2.A.all(true);
          c2.B.all(true);
        }
      }
    }
    if (s.view === "dia") {
      if (live && MOTION) liveDia(my, s);
      else { diaDraw(s.rows); diaNote(s); }
    }
    // The brackets of the gradient are drawn in every end state; only the live grad step draws them late.
    var lateBr = s.view === "grad" && live && MOTION;
    GD.m.brackets(!lateBr);
    if (lateBr) U.Q.run([[500, function () { GD.m.brackets(true); }]], 600);
  }

  MF.define("update", {
    act: 3, title: "Downhill", steps: USTEPS.length,
    build: function (inner) {
      var root = el("div", "s3d s3d-upd");
      U.root = root;
      U.lead = el("p", "s3d-lead");
      U.layer = el("div", "s3d-layer");
      U.D = G.diagram({ customer: WHO, film: FILM, c: START.c.slice(), f: START.f.slice() });
      U.note = el("p", "s3d-line s3d-dnote");
      U.v.rule = ruleView();
      U.v.work = workView();
      U.v.dia = h("div", "s3d-view s3d-diav", [U.D.el, U.note]);
      U.v.grad = gradView();
      var bench = el("div", "s3d-bench");
      Object.keys(U.v).forEach(function (n) { U.v[n].hidden = true; bench.appendChild(U.v[n]); });
      root.appendChild(U.lead);
      root.appendChild(bench);
      root.appendChild(U.layer);
      root.s3dTest = { D: U.D, ans: U.ans, steps: USTEPS, upd: UPD, step: STEP, big: BIG, room: function () { return roomU(); },
                       rows: WK.rows, grad: GD.m, U: U };
      inner.appendChild(root);
    },
    enter: function () { U.last = null; },
    leave: function () {
      U.tok++;
      U.Q.stop();
      if (U.layer) U.layer.textContent = "";
      if (U.D) U.D.stop();
    },
    step: function (k) {
      var was = U.last;
      U.last = k;
      stepU(k, k > 0 && was === k - 1);
    }
  });
})();
</script>
<script>
/* Section 4, many customers and many films: S4-A's scenes "Three customers, one film" (column) and "Many films"
   (table), BRIEF-s4.md. Classes start with s4-. core.js (PLACE) shows them around S4-B's scenes shared and together
   (sec4d.js). Built on the table view MF.L (loss.js, LOSS.md), the table arithmetic MF.T (table-math.js) and, for one
   still picture, the grasshopper team MF.H.team (hopper.js). No data number is typed here: every number comes from
   MF.S2, MF.S4 and MF.T.

   Every step sets its whole state; motion plays only when a step is reached from the step before (or the first step
   on entry). Back, Next, the pager and leaving the scene cut a motion or a run short and draw its end state. The
   room's answers survive Back and Next. */
(function () {
  "use strict";
  var MF = window.MF;
  if (!MF || !MF.N || !MF.L || !MF.T || !MF.S4 || !MF.S2) return;
  var N = MF.N, L = MF.L, T = MF.T, el = MF.el, S2 = MF.S2, S4 = MF.S4, H = MF.H;
  var MOTION = !MF.reducedMotion;
  var PEOPLE = S2.people, FILMS = S2.films, FILM = S4.film;
  var TRIES = 2;                                   // wrong tries before "Show me"
  var ARROW = " → ";

  /* SMALL TOOLS */
  // Fill a node with words and elements. A number cell keeps the punctuation right after it on its own line.
  function put(node, kids) {
    node.textContent = "";
    var list = (kids || []).filter(function (k) { return k !== null && k !== undefined && k !== ""; });
    for (var j = 0; j < list.length; j++) {
      var k = list[j], nx = list[j + 1];
      if (typeof k !== "string" && k.classList && k.classList.contains("nt-n") && typeof nx === "string" && /^[.,:;!?]/.test(nx)) {
        var m = nx.match(/^[.,:;!?]+/)[0], glue = el("span", "s4-nw");
        glue.appendChild(k);
        glue.appendChild(document.createTextNode(m));
        node.appendChild(glue);
        list[j + 1] = nx.slice(m.length);
        continue;
      }
      node.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
    }
    return node;
  }
  function h(tag, cls, kids) { return put(el(tag, cls), kids); }
  function button(text, cls, fn) {
    var b = el("button", "btn" + (cls ? " " + cls : ""), text);
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }
  // A number inside a line of words: the notation's cell, small, rounded like the view.
  function num(x, places) {
    var c = N.cell(x, { cls: "s4-in" });
    var t = L.cellText(x, places === undefined ? 2 : places);
    c.textContent = t;
    var v = Number(t.replace(MF.MINUS, "-"));
    c.dataset.t = !isFinite(v) || v === 0 ? "0" : (v >= 2 ? "2" : v > 0 ? "1" : v <= -2 ? "-2" : "-1");
    return c;
  }
  function rub(text) { return el("span", "s4-rub", text); }
  var WORDS = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"];
  function count(n) { return WORDS[n] || String(n); }
  function name(id) { return MF.get(id).n; }
  function poss(n) { return n + (/s$/.test(n) ? "'" : "'s"); }
  function isLive(S, k) { return MOTION && (S.last === null ? k === 0 : k === S.last + 1); }
  function Run() {
    var r = { tok: 0 };
    r.begin = function () { r.tok++; return r.tok; };
    r.ok = function (t) { return t === r.tok; };
    return r;
  }
  // The frame of a scene: the view, then the words, the room's keys and the buttons under it (in V.note).
  function frame(inner, key, V) {
    var S = { key: key, V: V, root: el("div", "s4 s4-" + key), run: Run(), timers: [], last: null };
    S.root.s4Test = S;                                                 // for _try-s4a.js
    S.root.appendChild(V.el);
    S.lead = el("p", "s4-lead");
    S.say = el("p", "s4-say");
    S.aside = el("p", "s4-aside");
    S.work = el("div", "s4-work");
    S.ctl = el("div", "s4-ctl");
    [S.lead, S.say, S.aside, S.work, S.ctl].forEach(function (n) { V.note.appendChild(n); });
    inner.appendChild(S.root);
    return S;
  }
  function words(S, lead, say, aside) {
    put(S.lead, lead || []);
    put(S.say, say || []);
    put(S.aside, aside || []);
    S.say.hidden = !say || !say.length;
    S.aside.hidden = !aside || !aside.length;
  }
  function later(S, ms, fn) {
    var tok = S.run.tok;
    var t = setTimeout(function () { if (S.run.ok(tok)) fn(); }, ms);
    S.timers.push(t);
  }
  function halt(S) {
    S.run.begin();
    S.timers.forEach(clearTimeout);
    S.timers = [];
    S.V.stop();
  }

  /* THE ROOM'S TURN: keys to tap, a hint after each wrong try, "Show me" after two wrong tries.
     o.keys, o.answer, o.slot() the slot element of the moment, o.state() { tries, last, done, how },
     o.ask(), o.hint(tries), o.right(how) the words, o.solved(live) what follows a solved answer. */
  function Room(o) {
    var R = {};
    R.text = el("p", "s4-fb");
    R.showme = button("Show me", "quiet s4-showme", function () { R.solve(); });
    R.pad = el("div", "s4-pad");
    R.pad.setAttribute("role", "group");
    R.pad.setAttribute("aria-label", "Your answer");
    o.keys.forEach(function (v) {
      var k = el("button", "s4-key");
      k.type = "button";
      k.dataset.v = String(v);
      k.setAttribute("aria-label", MF.spoken(v));
      k.appendChild(N.cell(v));
      k.addEventListener("click", function () { R.pick(v); });
      R.pad.appendChild(k);
    });
    R.el = h("div", "s4-room", [R.pad, h("div", "s4-fbw", [R.text, R.showme])]);
    R.draw = function () {
      var st = o.state(), slot = o.slot();
      if (!st) return R;
      if (slot && !st.done) {
        if (st.tries && st.last !== undefined) N.setSlot(slot, st.last, false);
        else N.setSlot(slot, null);
        slot.classList.add("nt-ask");
      }
      R.pad.hidden = !!st.done;
      R.showme.hidden = !!st.done || st.tries < TRIES;
      R.el.classList.toggle("s4-done", !!st.done);
      R.el.classList.toggle("s4-hint", !st.done && st.tries > 0);
      put(R.text, st.done ? o.right(st.how) : (st.tries ? o.hint(st.tries) : o.ask()));
      return R;
    };
    R.pick = function (x) {
      var st = o.state();
      if (!st || st.done) return false;
      if (x === o.answer) {
        st.done = true;
        st.how = "right";
        o.solved(MOTION);
        R.draw();
        return true;
      }
      st.tries++;
      st.last = x;
      o.wrong(st.tries);
      R.draw();
      return false;
    };
    R.solve = function () {
      var st = o.state();
      if (!st || st.done) return;
      st.done = true;
      st.how = "shown";
      o.solved(MOTION);
      R.draw();
    };
    return R;
  }
  function keysAround(ans, lo, hi) {
    var a = Math.min(lo, Math.floor(ans) - 2), b = Math.max(hi, Math.ceil(ans) + 2), out = [];
    for (var x = a; x <= b; x++) out.push(x);
    return out;
  }
  function popCell(td) {
    var c = td && td.firstChild;
    if (!c || !MOTION || !c.animate) return;
    try {
      c.animate([{ transform: "scale(.5)", opacity: 0.2 }, { transform: "scale(1.2)", opacity: 1, offset: 0.55 }, { transform: "scale(1)" }],
                { duration: 520, easing: "cubic-bezier(.3,.75,.3,1.25)" });
    } catch (e) {}
  }

  /* SCENE 1: THREE CUSTOMERS, ONE FILM
     The first half had one customer and one film. Raj and Elsa join Ida: three ratings of one film. We make a
     guess (part two's first guess), compute the three predictions (Ida's slowly, Raj's faster, the room Elsa's), the
     three losses (the same), and aggregate them into their average, the one number the Matchmaker now makes small. */
  var CO = null;
  var COL = (function () {
    var m = T.matrices(S2.start, PEOPLE, [FILM]), R = T.ratings(PEOPLE, [FILM]);
    return { c: m.c, f: m.f, R: R, t: T.table(m.c, m.f, R) };
  })();
  var IDA = 0, RAJ = 1, ELSA = 2;                  // rows of the column, in the order of MF.S2.people
  function cells(rows) { return rows.map(function (i) { return [i, 0]; }); }
  var CO_STEPS = ["ratings", "guess", "p0", "p1", "pRoom", "l0", "l1", "lRoom", "average", "one"];
  function coState(which) {
    if (!CO.ans[which]) CO.ans[which] = { tries: 0, done: false };
    return CO.ans[which];
  }
  function coPred(i) { return COL.t.P[i][0]; }
  function coLoss(i) { return COL.t.S[i][0]; }
  var ROOM_P = null, ROOM_L = null;
  // The room's prediction: the pairs of Elsa's worked line on the desk; after two wrong tries the products too.
  function roomBeat(tries) { return COL.c[ELSA].length + (tries >= TRIES ? 1 : 0); }
  function roomP() {
    if (ROOM_P) return ROOM_P;
    var ans = coPred(ELSA), pr = COL.c[ELSA].map(function (x, k) { return x * COL.f[0][k]; });
    ROOM_P = Room({
      keys: keysAround(ans, -4, 4), answer: ans,
      slot: function () { return CO.V.slot("p"); },
      state: function () { return CO_STEPS[CO.k] === "pRoom" ? coState("pred") : null; },
      ask: function () { return [poss(name(PEOPLE[ELSA])) + " row and " + poss(name(FILM)) + " column: work out the prediction and tap it."]; },
      hint: function (tries) {
        if (tries < TRIES) return [rub("Not quite."), " Multiply first by first and second by second, then add the two products."];
        return [rub("Not quite."), " The products are ", num(pr[0]), " and ", num(pr[1]), ". Add them."];
      },
      wrong: function (tries) { if (tries >= TRIES) CO.V.predict(cells([IDA, RAJ]), { ask: [ELSA, 0], beat: roomBeat(tries) }); },
      right: function (how) { return [rub(how === "shown" ? "Here it is." : "Right!"), " " + poss(name(PEOPLE[ELSA])) + " prediction is ", num(ans), "."]; },
      solved: function (live) {
        CO.V.predict(cells([IDA, RAJ, ELSA]), { pair: [ELSA, 0] });
        if (live) popCell(CO.V.cell("p", ELSA, 0));
      }
    });
    return ROOM_P;
  }
  function roomL() {
    if (ROOM_L) return ROOM_L;
    var ans = coLoss(ELSA), yE = COL.R[ELSA][0], pE = coPred(ELSA);
    ROOM_L = Room({
      keys: keysAround(ans, 0, 8).filter(function (x) { return x >= 0; }), answer: ans,
      slot: function () { return CO.V.slot("s"); },
      state: function () { return CO_STEPS[CO.k] === "lRoom" ? coState("loss") : null; },
      ask: function () { return ["Now " + poss(name(PEOPLE[ELSA])) + " loss: work it out and tap it."]; },
      hint: function (tries) {
        if (tries < TRIES) return [rub("Not quite."), " Her prediction minus her rating, squared."];
        return [rub("Not quite."), " Her prediction is ", num(pE), " and her rating ", num(yE), ": the loss is (", num(pE), " " + MF.MINUS + " ", num(yE), ")\u00B2."];
      },
      wrong: function (tries) { if (tries >= TRIES) CO.V.losses(cells([IDA, RAJ]), { ask: [ELSA, 0], beat: 0 }); },
      right: function (how) { return [rub(how === "shown" ? "Here it is." : "Right!"), " " + poss(name(PEOPLE[ELSA])) + " loss is ", num(ans), "."]; },
      solved: function (live) {
        CO.V.losses("all", { cell: [ELSA, 0], beat: 2 });
        if (live) popCell(CO.V.cell("s", ELSA, 0));
      }
    });
    return ROOM_L;
  }
  function coWords(name4) {
    var S = CO, ida = name(PEOPLE[IDA]), raj = name(PEOPLE[RAJ]), elsa = name(PEOPLE[ELSA]), film = name(FILM);
    var n = PEOPLE.length;
    if (name4 === "ratings") {
      words(S, ["Three customers, one film."],
        ["The first half had one customer and one film, " + ida + " and " + film + ". Now " + raj + " and " + elsa + " join her: " + count(n) + " ratings of " + film + "."]);
    } else if (name4 === "guess") {
      words(S, [rub("We make a guess:"), " two numbers for each customer and two for the film."],
        ["The first guess of part two, " + ida + " and " + film + " included."]);
    } else if (name4 === "p0") {
      words(S, [rub("We compute our estimate:"), " " + poss(ida) + " row with " + poss(film) + " column, number by number, then add."],
        ["The prediction ", num(coPred(IDA)), ", as in part two."]);
    } else if (name4 === "p1") {
      words(S, ["The same for " + raj + "."], [poss(raj) + " row with " + poss(film) + " column: the prediction ", num(coPred(RAJ)), "."]);
    } else if (name4 === "pRoom") {
      words(S, ["Your turn: " + elsa + "."], []);
    } else if (name4 === "l0") {
      words(S, [rub("Then the loss:"), " straight from the prediction and the rating, (prediction " + MF.MINUS + " rating)\u00B2."],
        [poss(ida) + " loss is ", num(coLoss(IDA)), ", as in part two."]);
    } else if (name4 === "l1") {
      words(S, ["The same for " + raj + "."], ["His loss is ", num(coLoss(RAJ)), "."]);
    } else if (name4 === "lRoom") {
      words(S, ["Your turn: " + elsa + "."], []);
    } else if (name4 === "average") {
      words(S, [rub("And we aggregate all these losses by computing the average.")],
        ["Add the " + count(n) + " losses and divide by " + count(n) + "."]);
    } else {
      words(S, ["One number for the whole column: the average loss."],
        ["This is the number the Matchmaker now makes small."],
        ["It stays comparable when more customers join, because it is an average."]);
    }
  }
  function coStep(k, live) {
    var S = CO, V = S.V, st = CO_STEPS[k], all3 = cells([IDA, RAJ, ELSA]);
    S.k = k;
    S.work.textContent = "";
    S.ctl.textContent = "";
    V.focus(null);
    V.mark(null);
    coWords(st);
    if (st !== "average" && st !== "one") V.average(false);
    if (st === "ratings") {
      V.showParts(["ratings"]);
      V.predict([]);
      V.losses([]);
      V.desk(null);
      V.average(false);
      if (live) { V.showParts([]); V.add("ratings"); }
      return;
    }
    if (st === "guess") {
      V.showParts(["guesses", "ratings"]);
      V.predict([]);
      V.losses([]);
      V.desk(null);
      if (live) { V.showParts(["ratings"]); V.add("guesses"); }
      return;
    }
    var shown = ["guesses", "predictions", "ratings"];
    if (st === "p0" || st === "p1") {
      var i = st === "p0" ? IDA : RAJ, before = cells(i === IDA ? [] : [IDA]);
      V.showParts(shown);
      V.losses([]);
      if (live) {
        V.predict(before, i === IDA ? {} : { pair: [IDA, 0] });
        V.work(i, 0, { pace: i === IDA ? 1 : 0.55 });
      } else V.predict(before.concat([[i, 0]]), { pair: [i, 0] });
      return;
    }
    if (st === "pRoom") {
      V.showParts(shown);
      V.losses([]);
      var R = roomP(), sp = coState("pred");
      S.work.appendChild(R.el);
      if (sp.done) V.predict(all3, { pair: [ELSA, 0] });
      else {
        V.predict(cells([IDA, RAJ]), { ask: [ELSA, 0], beat: roomBeat(sp.tries) });
        if (live && sp.tries < TRIES) V.pair(ELSA, 0, { pace: 0.6 });
      }
      R.draw();
      return;
    }
    shown = ["guesses", "predictions", "ratings", "losses"];
    if (st === "l0" || st === "l1") {
      var j = st === "l0" ? IDA : RAJ, done = cells(j === IDA ? [] : [IDA]);
      V.showParts(shown);
      V.predict(all3);
      if (live) {
        V.losses(done, j === IDA ? { cell: [IDA, 0], beat: 0 } : { cell: [IDA, 0] });
        V.lossWork(j, 0, { pace: j === IDA ? 1 : 0.55 });
      } else {
        V.losses(done.concat([[j, 0]]), { cell: [j, 0] });
        V.focus(j, 0);
      }
      return;
    }
    if (st === "lRoom") {
      V.showParts(shown);
      V.predict(all3);
      var RL = roomL(), sl = coState("loss");
      S.work.appendChild(RL.el);
      if (sl.done) { V.losses("all", { cell: [ELSA, 0] }); V.focus(ELSA, 0); }
      else {
        V.losses(cells([IDA, RAJ]), { ask: [ELSA, 0], beat: 0 });
        V.focus(ELSA, 0);
      }
      RL.draw();
      return;
    }
    // the average, then the last line
    V.predict(all3);
    V.losses("all");
    V.desk(null);
    V.showParts(PARTS_ALL);
    if (st === "average" && live) V.land({ pace: 1 });
    else V.average(true);
  }
  var PARTS_ALL = L.PARTS.slice();

  MF.define("column", {
    act: 4,
    title: "Three customers, one film",
    steps: CO_STEPS.length,
    build: function (inner, api) {
      var V = L.view({ people: PEOPLE, films: [FILM], size: "sm", desk: true, side: true });
      CO = frame(inner, "column", V);
      CO.api = api;
      CO.ans = {};
      CO.k = 0;
    },
    enter: function () { CO.last = null; },
    leave: function () { halt(CO); },
    step: function (k) {
      var live = isLive(CO, k);
      halt(CO);
      coStep(k, live);
      CO.last = k;
    }
  });

  /* SCENE 4: MANY FILMS
     The Martian joins: the whole table of part two, six ratings. The approach is the same: the guesses, six
     predictions, six losses, their average, filled fast. One grasshopper for every number of the two matrices, said in
     a sentence and shown once, standing still. Then the loop runs fast: the numbers change, the predictions settle on
     the ratings, the average falls below MF.S4.tol. The product of the two matrices gives the ratings: they were
     factorized. Another guess gives other numbers and the same ratings. */
