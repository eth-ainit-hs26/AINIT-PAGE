    C.all = function (on) { C.rows.forEach(function (r, j) { C.showRow(j, on); }); C.showRes(on); return C; };
    C.hot = function (on) {
      C.rows.forEach(function (r) { r.cell.classList.toggle("nt-hot", on); if (r.x) r.x.classList.toggle("nt-on", on); });
      return C;
    };
    return C;
  }
  // The result of a column comes in: the numbers light up, copies of them travel down, the result lands.
  function playCol(C, Q, layer, pace) {
    pace = pace || 1;
    var t1 = TEMPO.hot * pace, t2 = t1 + TEMPO.flow * pace, t3 = t2 + TEMPO.settle * pace;
    C.showRes(false);
    return Q.run([
      [0, function () { C.hot(true); }],
      [t1, function () { C.rows.forEach(function (r) { fly(layer, r.cell, C.rh, TEMPO.flow * pace, { scale: 0.92, fade: true }); }); }],
      [t2, function () { C.showRes(true); pop(C.res, 560 * pace); }],
      [t3, function () { C.hot(false); }]
    ], t3);
  }

  /* THE ROOM'S TURN: one answer on keys to tap (or typed by the presenter), a hint after each wrong try, "Show me"
     after two wrong tries. o.keys, o.answer, o.slot() the slot of the moment, o.state() its answer state
     ({ tries, done, how, last }), o.ask(), o.hint(tries), o.right(how) the words, o.solved(live) what follows. */
  var TRIES = 2;
  function keypad(values, onPick) {
    var g = el("div", "s4d-pad");
    g.setAttribute("role", "group");
    g.setAttribute("aria-label", "Your answer");
    values.forEach(function (v) {
      var k = el("button", "s4d-key");
      k.type = "button";
      k.dataset.v = String(v);
      k.setAttribute("aria-label", MF.spoken(v));
      k.appendChild(N.cell(v));
      k.addEventListener("click", function () { onPick(v); });
      g.appendChild(k);
    });
    return g;
  }
  function Room(o) {
    var Rm = { keys: o.keys };
    Rm.text = el("p", "s4d-fb");
    Rm.showme = button("Show me", "quiet s4d-showme", function () { Rm.solve(); });
    Rm.pad = keypad(o.keys, function (x) { Rm.pick(x); });
    Rm.el = h("div", "s4d-room", [Rm.pad, h("div", "s4d-fbw", [Rm.text, Rm.showme])]);
    Rm.draw = function () {
      var st = o.state(), slot = o.slot();
      if (!st || !slot) return Rm;
      if (st.done) {
        if (slot.classList.contains("nt-slot")) N.setSlot(slot, o.answer, true);
      } else if (st.last !== undefined && st.tries) {
        N.setSlot(slot, st.last, false);
        slot.classList.add("nt-ask");
      } else {
        N.setSlot(slot, null);
        slot.classList.add("nt-ask");
      }
      Rm.pad.hidden = !!st.done;
      Rm.showme.hidden = !!st.done || st.tries < TRIES;
      Rm.el.classList.toggle("s4d-done", !!st.done);
      Rm.el.classList.toggle("s4d-hint", !st.done && st.tries > 0);
      put(Rm.text, st.done ? o.right(st.how) : (st.tries ? o.hint(st.tries) : o.ask()));
      return Rm;
    };
    Rm.show = function () {
      Rm.draw();
      var st = o.state();
      if (st && st.done) o.solved(false);
      return Rm;
    };
    Rm.pick = function (x) {
      var st = o.state(), slot = o.slot();
      if (!st || !slot || st.done) return false;
      if (Math.abs(x - o.answer) < 1e-9) {
        st.done = true;
        st.how = "right";
        N.setSlot(slot, o.answer, true);
        Rm.draw();
        o.solved(true);
        return true;
      }
      st.tries++;
      st.last = x;
      Rm.draw();
      return false;
    };
    Rm.solve = function () {
      var st = o.state(), slot = o.slot();
      if (!st || !slot || st.done) return;
      st.done = true;
      st.how = "shown";
      N.setSlot(slot, o.answer, true);
      Rm.draw();
      o.solved(true);
    };
    return Rm;
  }
  // The presenter types the answer: a minus, digits and a point gather in the slot; a key that no longer key
  // starts with answers at once, Enter answers what is typed, Backspace or Escape starts again.
  function typing(S, room, slot) {
    return function (e) {
      var k = e.key, d = S.draft || "";
      if (k === "-" || k === MINUS || k === "Subtract") { if (d) return true; d = "-"; }
      else if (/^[0-9]$/.test(k)) d += k;
      else if (k === "." || k === ",") { if (d.indexOf(".") >= 0) return true; d += (d === "" || d === "-" ? "0" : "") + "."; }
      else if (k === "Enter") { if (!d || d === "-") return true; S.draft = ""; room.pick(Number(d)); return true; }
      else if ((k === "Backspace" || k === "Delete" || k === "Escape") && d) { S.draft = ""; room.draw(); return true; }
      else return false;
      S.draft = d;
      var texts = room.keys.map(function (v) { return String(v); });
      var longer = texts.some(function (t) { return t !== d && t.indexOf(d) === 0; });
      if (texts.indexOf(d) >= 0 && !longer) { S.draft = ""; room.pick(Number(d)); return true; }
      if (!longer && !/[.\-]$/.test(d) && texts.every(function (t) { return t.indexOf(d) !== 0; })) { S.draft = ""; room.pick(Number(d)); return true; }
      N.draft(slot(), d.replace("-", MINUS));
      return true;
    };
  }
  function roomState(S) { if (!S.ans[S.k]) S.ans[S.k] = { tries: 0, done: false }; return S.ans[S.k]; }

  /* THE SLOPES, as two small matrices shaped like the guesses: the customers' (a row each) and Paddington's (a column,
     turned as the films' matrix of the board; its calls stay logical, one row per film). */
  function slopeMats(cap, cls) {
    var P = {};
    P.c = M.matrix({ rows: PEOPLE, cols: S2.dims, fill: "slots", caption: cap, size: "sm", colHeads: "pic", phonePics: true,
                     brackets: false, cls: "s4d-sl" + (cls ? " " + cls : "") });
    // an empty caption that keeps its line, so the film's picture stands level with the customers' column heads
    P.f = M.matrix({ rows: [FILM], cols: S2.dims, fill: "slots", caption: "\u00a0", size: "sm", transpose: true, colHeads: "pic", rowHeads: "pic",
                     phonePics: true, brackets: false, cls: "s4d-sl s4d-slf" + (cls ? " " + cls : "") });
    P.el = h("div", "s4d-slopes", [P.c.el, P.f.el]);
    P.m = function (o) { return o[0] === "c" ? P.c : P.f; };
    P.set = function (o, on, live) {
      var c = P.m(o).set(o[1], o[2], on ? r2(slopeAt(o)) : undefined, { pop: !!live });
      if (c && on) c.classList.add("s4d-slope");
      return c;
    };
    P.draw = function (found) { ORDER.forEach(function (o) { P.set(o, found.some(function (x) { return same(x, o); }), false); }); };
    P.cur = function (o) {
      Array.prototype.forEach.call(P.el.querySelectorAll(".s4d-cur"), function (c) { c.classList.remove("s4d-cur"); });
      if (o) { var c = P.m(o).item(o[1], o[2]); if (c) c.classList.add("s4d-cur"); }
    };
    P.td = function (o) { return P.m(o).td(o[1], o[2]); };
    return P;
  }

  /* The view of the column, as S4-A draws it, with the number in question and the ratings it sits in ringed. */
  // The view as S4-A's scene column draws it (with o.dec the one-film row wraps into two lines at 1440x900).
  // The view of both scenes: the cross of the column (no differences since 2026-11-04).
  function makeView() {
    return L.view({ people: PEOPLE, films: [FILM], decPhone: true });
  }
  function marks(V, o, extra) {
    var list = [];
    if (o) {
      list.push({ part: o[0], i: o[1], j: o[2], tone: "b" });
      T.touches(R, o[0], o[1]).forEach(function (ij) {
        list.push({ part: "p", i: ij[0], j: ij[1], tone: "a" });
        list.push({ part: "r", i: ij[0], j: ij[1], tone: "a" });
      });
    }
    V.mark(list.concat(extra || []));
  }

  /* =====================================================================================================
     SCENE shared: which ratings a number sits in; section 3's rule for one rating; what each rating alone says to
     Paddington's first number, their average; Paddington's second; Ida's first; the room, Raj's second; all eight. */
  var A = { last: null, k: 0, tok: 0, Q: Seq(), ans: {}, pick: null, draft: "" };
  var ASTEPS = [
    { kind: "pick", lead: function () { return ["Tap a guessed number. Which ratings does it sit in?"]; } },
    { kind: "rule", lead: function () { return ["The rule of the first half, for one rating at a time."]; } },
    { kind: "asks", at: PAD1, cols: [0], play: [0], found: [],
      lead: function () { return [cap(nameOf(PAD1)) + " sits in all three predictions. What does " + poss(who(0)) + " rating alone say?"]; } },
    { kind: "asks", at: PAD1, cols: [0, 1], play: [1], found: [],
      lead: function () { return [poss(who(1)) + " rating alone, on the same number."]; } },
    { kind: "asks", at: PAD1, cols: [0, 1, 2], play: [2], found: [],
      lead: function () { return [poss(who(2)) + " rating alone."]; } },
    { kind: "asks", at: PAD1, cols: [0, 1, 2], avg: true, found: [PAD1],
      lead: function () { return ["The loss is the average of the three losses, so the slope is the average of what they say."]; } },
    { kind: "asks", at: PAD2, cols: [0, 1, 2], play: [0, 1, 2], pace: 0.45, avg: true, found: [PAD1, PAD2],
      lead: function () { return [cap(nameOf(PAD2)) + ": the same three ratings."]; } },
    { kind: "asks", at: IDA1, cols: [0, 1, 2], play: [0, 1, 2], pace: 0.55, avg: true, found: [PAD1, PAD2, IDA1],
      lead: function () { return [cap(nameOf(IDA1)) + " sits only in " + poss(who(0)) + " prediction."]; } },
    { kind: "asks", at: RAJ2, cols: [0, 1, 2], play: [0, 1, 2], pace: 0.45, room: true, found: [PAD1, PAD2, IDA1],
      lead: function () { return ["Your turn: the slope of " + nameOf(RAJ2) + "."]; } },
    { kind: "all", lead: function () { return ["Every number's slope, on the guess as it is."]; } }
  ];
  // The three says of a number, the average, the room's keys.
  var RAJ_ASKS = asksOf(RAJ2).map(function (a) { return a.slope; });
  var RAJ_SUM = RAJ_ASKS.reduce(function (s, x) { return s + x; }, 0);
  var ROOM_A_KEYS = (function () {
    var a = T.average(RAJ_ASKS), s = RAJ_SUM, list = [-s, -s / 2, -a, 0, a, s / 2, s].map(r2), out = [];
    list.forEach(function (x) { if (out.indexOf(x) < 0) out.push(x); });
    return out.sort(function (p, q) { return p - q; });
  })();

  // The stack of the three ratings' says: a column per rating, the rows 2, partner, prediction minus rating, the says under
  // the rules, and the average after them.
  var AK = {};
  function asksView() {
    var wrap = el("div", "nt-wrap s4d-asksw");
    var t = el("table", "rt nt-tab s4d-asks");
    var thead = el("thead"), hr = el("tr");
    hr.appendChild(el("th", "s4d-ahc"));
    AK.heads = PEOPLE.map(function (p) {
      var th = el("th", "s4d-ah");
      th.appendChild(MF.pic(p, "xs"));
      th.appendChild(el("span", "s4d-ahn", poss(MF.get(p).n)));
      hr.appendChild(th);
      return th;
    });
    AK.avgHead = el("th", "s4d-avgh", "average");
    hr.appendChild(AK.avgHead);
    thead.appendChild(hr);
    t.appendChild(thead);
    var tb = el("tbody");
    var LABELS = ["always", "partner", "prediction " + MINUS + " rating"];
    AK.rows = LABELS.map(function (lab, r) {
      var tr = el("tr", "nt-row " + (r ? "nt-bot" : "nt-top"));
      var th = el("th", "rt-who nt-who");
      th.scope = "row";
      th.appendChild(el("span", "rt-n", lab));
      tr.appendChild(th);
      var cells = PEOPLE.map(function () {
        var td = el("td", "rt-c nt-c"), x = null;
        if (r) {
          x = el("span", "nt-x", N.TIMES);
          x.setAttribute("aria-hidden", "true");
          td.appendChild(x);
        }
        var hold = el("span", "nt-h"), c = N.cell(0);
        hold.appendChild(c);
        td.appendChild(hold);
        tr.appendChild(td);
        return { td: td, x: x, hold: hold, cell: c };
      });
      tr.appendChild(el("td", "s4d-avgsp"));
      tb.appendChild(tr);
      return cells;
    });
    var rr = el("tr", "nt-res");
    rr.appendChild(el("th", "nt-rlab", "says"));
    AK.res = PEOPLE.map(function () {
      var pc = el("td", "nt-pc"), rh = el("span", "nt-h"), c = N.cell(0, { cls: "nt-prod s4d-slope" });
      rh.appendChild(c);
      pc.appendChild(rh);
      rr.appendChild(pc);
      return { td: pc, hold: rh, cell: c };
    });
    var ac = el("td", "s4d-avgc"), ah = el("span", "nt-h");
    AK.avg = N.cell(0, { cls: "nt-sum s4d-slope s4d-avgn" });
    ah.appendChild(AK.avg);
    ac.appendChild(ah);
    AK.avgHold = ah;
    rr.appendChild(ac);
    tb.appendChild(rr);
    t.appendChild(tb);
    // "not in it": a rating whose prediction does not contain the number says 0.
    AK.notin = PEOPLE.map(function (p, i) {
      var n = el("span", "s4d-notin", "not in it");
      AK.rows[1][i].td.appendChild(n);
      return n;
    });
    wrap.appendChild(t);
    AK.el = wrap;
    return wrap;
  }
  // Fill the stack for number o: the columns in `cols` show their inputs and says; avg shows the average.
  function asksDraw(o, cols, avg, room) {
    var list = asksOf(o);
    PEOPLE.forEach(function (p, i) {
      var a = list[i], on = cols.indexOf(i) >= 0;
      off(AK.heads[i], !on);
      AK.rows.forEach(function (row, r) {
        var x = r === 0 ? T.RULE : r === 1 ? a.partner : a.miss;
        var cell = row[i];
        if (a.touches) N.setCell(cell.cell, x);
        off(cell.hold, !on || !a.touches);
        if (cell.x) off(cell.x, !on || !a.touches);
      });
      off(AK.notin[i], !on || a.touches);
      N.setCell(AK.res[i].cell, r2(a.slope));
      AK.res[i].cell.classList.toggle("s4d-zero", !a.touches);
      off(AK.res[i].hold, !on);
      AK.res[i].td.classList.toggle("s4d-norule", !on);
      AK.res[i].td.classList.toggle("s4d-faint", on && !a.touches);
    });
    off(AK.avgHead, !avg && !room);
    if (room) {
      if (!AK.slot) {
        AK.slot = N.slot({ cls: "nt-sum s4d-avgn" });
      }
      if (AK.avg.parentNode) AK.avgHold.removeChild(AK.avg);
      if (!AK.slot.parentNode) AK.avgHold.appendChild(AK.slot);
      off(AK.avgHold, false);
    } else {
      if (AK.slot && AK.slot.parentNode) AK.avgHold.removeChild(AK.slot);
      if (!AK.avg.parentNode) AK.avgHold.appendChild(AK.avg);
      N.setCell(AK.avg, r2(T.average(list.map(function (q) { return q.slope; }))));
      AK.avg.classList.add("s4d-slope");
      off(AK.avgHold, !avg);
    }
  }
  // One rating's column plays: 2 comes in, the partner flies in from the view, then the prediction and the rating (the
  // prediction first, as on the board; prediction minus rating lands in the third cell), the says lands.
  function playAsk(S, V, o, i, pace) {
    var a = asksOf(o)[i], my = S.tok;
    pace = pace || 1;
    off(AK.heads[i], false);
    AK.res[i].td.classList.remove("s4d-norule");
    AK.res[i].td.classList.toggle("s4d-faint", !a.touches);
    if (!a.touches) {
      off(AK.notin[i], false);
      off(AK.res[i].hold, true);
      return S.Q.run([[300 * pace, function () { off(AK.res[i].hold, false); pop(AK.res[i].cell); }]], 700 * pace);
    }
    var col = AK.rows.map(function (row) { return row[i]; });
    col.forEach(function (c) { off(c.hold, true); if (c.x) off(c.x, true); });
    off(AK.res[i].hold, true);
    var mate = cellIn(V.cell(o[0] === "c" ? "f" : "c", o[0] === "c" ? a.j : a.i, o[2]));
    var rate = cellIn(V.cell("r", a.i, a.j)), pred = cellIn(V.cell("p", a.i, a.j));
    var acts = [
      [0, function () { off(col[0].hold, false); pop(col[0].cell); }],
      [300 * pace, function () { fly(S.layer, mate, col[1].cell, 820 * pace, { arc: 26 }); }],
      [(300 + 820) * pace, function () { off(col[1].hold, false); off(col[1].x, false); pop(col[1].cell); }],
      [800 * pace, function () { fly(S.layer, pred, col[2].cell, 820 * pace, { arc: 26, scale: 0.92, fade: true });
                                 fly(S.layer, rate, col[2].cell, 820 * pace, { arc: -18, scale: 0.92, fade: true, delay: 90 * pace }); }],
      [(800 + 820) * pace, function () { off(col[2].hold, false); off(col[2].x, false); pop(col[2].cell); }]
    ];
    var t1 = (800 + 820 + 260) * pace, t2 = t1 + TEMPO.hot * pace, t3 = t2 + TEMPO.flow * pace, t4 = t3 + TEMPO.settle * pace;
    acts.push([t1, function () { col.forEach(function (c) { c.cell.classList.add("nt-hot"); if (c.x) c.x.classList.add("nt-on"); }); }]);
    acts.push([t2, function () { col.forEach(function (c) { fly(S.layer, c.cell, AK.res[i].hold, TEMPO.flow * pace, { scale: 0.92, fade: true }); }); }]);
    acts.push([t3, function () { off(AK.res[i].hold, false); pop(AK.res[i].cell, 560 * pace); }]);
    acts.push([t4, function () { col.forEach(function (c) { c.cell.classList.remove("nt-hot"); if (c.x) c.x.classList.remove("nt-on"); }); }]);
    return S.Q.run(acts, t4).then(function (ok) { return ok && my === S.tok; });
  }
  // The says fly into the average, which lands.
  function playAvg(S) {
    var my = S.tok;
    off(AK.avgHead, false);
    off(AK.avgHold, true);
    var acts = [[0, function () { AK.res.forEach(function (r) { r.cell.classList.add("nt-hot"); }); }]];
    AK.res.forEach(function (r, i) {
      acts.push([350 + i * 260, function () { fly(S.layer, r.cell, AK.avgHold, TEMPO.gather || 760, { arc: 22, scale: 1.05, fade: true }); }]);
    });
    var t = 350 + (AK.res.length - 1) * 260 + (TEMPO.gather || 760);
    acts.push([t, function () { off(AK.avgHold, false); pop(AK.avg, 600); AK.res.forEach(function (r) { r.cell.classList.remove("nt-hot"); }); }]);
    return S.Q.run(acts, t + 400).then(function (ok) { return ok && my === S.tok; });
  }

  // The rule of section 3, in cells and words, the grasshopper standing beside it.
  var RU = {};
  function ruleView() {
    var C = Col({ rows: [{ label: "always", x: T.RULE }, { label: "partner", word: "partner" }, { label: "", word: "prediction " + MINUS + " rating" }],
                  res: { label: "one rating", word: "slope", cls: "s4d-slope" } });
    C.el.classList.add("s4d-rulecol");
    RU.col = C;
    var hop = el("span", "s4d-hop");
    hop.setAttribute("aria-hidden", "true");
    if (MF.H && MF.H.glyph) hop.appendChild(MF.H.glyph({ size: 46, face: "left" }));
    var words = h("div", "s4d-rulew", [
      h("p", "s4d-line", ["The ", b("partner"), " is the number it multiplies in that prediction."]),
      h("p", "s4d-line", ["A positive slope says ", b("smaller"), ", a negative one says ", b("bigger"), "."]),
      h("p", "s4d-line s4d-quiet", ["The first half shows where the rule comes from."])
    ]);
    return h("div", "s4d-v s4d-rulev", [h("div", "s4d-rulebox", [C.el, hop]), words]);
  }

  var AV = {};
  function sharedLine(s) {
    var o = s.at, list = asksOf(o), xs = list.map(function (q) { return q.slope; }), avg = T.average(xs);
    if (s.kind !== "asks") return [];
    if (s.room) return [];
    if (!s.avg) {
      var a = list[s.play[0]];
      if (s.play[0] === 2) {
        var small = list.filter(function (q) { return q.slope > 0; }).map(function (q) { return poss(who(q.i)); });
        var big = list.filter(function (q) { return q.slope < 0; }).map(function (q) { return poss(who(q.i)); });
        return ["They disagree: " + listWords(small) + " " + (small.length > 1 ? "ratings say" : "rating says") + " smaller, " +
                listWords(big) + " " + (big.length > 1 ? "say" : "says") + " bigger."];
      }
      return [cap(poss(who(a.i))) + " rating says ", ri(a.slope, "s4d-slope"), ": " + say(a.slope) + "."];
    }
    if (same(o, IDA1)) {
      var zeros = list.filter(function (q) { return !q.touches; }).map(function (q) { return poss(who(q.i)); });
      return [listWords(zeros) + " ratings say 0, and they still count: the average divides by all " + COUNT[list.length] + "."];
    }
    if (same(o, PAD2)) {
      var nil = list.filter(function (q) { return q.touches && q.partner === 0; }).map(function (q) { return who(q.i); });
      return [(nil.length ? poss(nil[0]) + " second number is 0, so his rating says 0. The slope is " : "The slope of " + nameOf(o) + " is "), ri(avg, "s4d-slope"), "."];
    }
    return ["The slope of " + nameOf(o) + " is ", ri(avg, "s4d-slope"), ": a small push to " + say(avg) + "."];
  }
  function pickLine() {
    var o = A.pick;
    if (!o) return ["A customer's number, or one of Paddington's."];
    var n = T.touches(R, o[0], o[1]).length;
    var whose = T.touches(R, o[0], o[1]).map(function (ij) { return poss(who(ij[0])); });
    return [cap(nameOf(o)) + " sits in " + (n === PEOPLE.length ? "all " + COUNT[n] + " predictions" : COUNT[n] + " prediction" + (n > 1 ? "s" : "") + ", " + listWords(whose)) +
            ": " + (n > 1 ? COUNT[n] + " ratings have" : "one rating has") + " a say."];
  }
  function roomA() {
    if (A.room) return A.room;

      GV.cols = el("div", "s4d-cols");
      GV.work = h("div", "s4d-v s4d-workv", [GV.cols]);
      GV.ask = askView();
      GV.run = runView();
      GV.roomBox = el("div", "s4d-roombox");
      var bench = h("div", "s4d-bench", [GV.side, GV.rule, GV.work, GV.ask, GV.run]);
      root.appendChild(G.lead);
      root.appendChild(h("div", "s4d-viewbox", [G.V.el]));
      root.appendChild(h("div", "s4d-right", [bench, G.line, GV.roomBox]));
      root.appendChild(G.layer);
      root.s4dTest = { V: G.V, G: G, steps: GSTEPS, slopes: GV.sl, room: function () { return roomG(); }, roomKeys: ROOM_G, run: RUN,
                       step: STEP, q: QA, answerQ: answerQ, startRun: startRun, toggleRun: toggleRun, rv: RV, cols: function () { return { A: GV.A, B: GV.B }; } };
      inner.appendChild(root);
    },
    enter: function () { G.last = null; },
    leave: function () {
      G.tok++;
      G.Q.stop();
      G.run.playing = false;
      if (G.layer) G.layer.textContent = "";
      if (G.V) G.V.stop();
    },
    step: function (k) {
      var was = G.last;
      G.last = k;
      stepG(k, k > 0 && was === k - 1);
    },
    onkey: function (e) {
      var s = GSTEPS[G.k];
      if (!s || !s.room || roomState(G).done || !GV.B) return false;
      return typing(G, roomG(), function () { return GV.B.res; })(e);
    }
  });
})();
</script>
<script>
/* fullscreen.js: the full-screen button of the AINIT games (2026-11-11; Carlos shows the games from his iPad).
   The same file in every game. The button goes after the light or dark switch (.themebtn) and takes its look; a
   page without that switch marks the place with data-fullscreen. One tap and the page fills the whole screen, with
   no address bar or tabs, in Safari and Chrome on an iPad and on a computer. The button is left out where the
   browser cannot do that (an iPhone, a frame that does not allow it), and hidden on screens under 561 px and while
   the page is full screen. The browser's own exit button, a swipe down on an iPad, or Escape leave full screen. */
(function () {
  var doc = document, root = doc.documentElement;
  var request = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!request || !(doc.fullscreenEnabled || doc.webkitFullscreenEnabled)) return;
  var host = doc.querySelector("[data-fullscreen]"), twin = host ? null : doc.querySelector(".themebtn");
  if (!host && !twin) return;

  var btn = doc.createElement("button");
  btn.type = "button";
  btn.className = twin ? twin.className + " fullbtn" : "fullbtn";
  btn.title = "Full screen";
  btn.setAttribute("aria-label", "Full screen");
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" style="display:block; margin:auto" aria-hidden="true"' +
    ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';

  var narrow = window.matchMedia ? window.matchMedia("(max-width: 560px)") : null;
  function isFull() { return !!(doc.fullscreenElement || doc.webkitFullscreenElement); }
  function sync() { btn.style.display = isFull() || (narrow && narrow.matches) ? "none" : ""; }

  btn.addEventListener("click", function () {
    btn.blur();
    var p = request.call(root);
    if (p && typeof p.catch === "function") p.catch(function () {});
  });
  doc.addEventListener("fullscreenchange", sync);
  doc.addEventListener("webkitfullscreenchange", sync);
  if (narrow && narrow.addEventListener) narrow.addEventListener("change", sync);
  else if (narrow && narrow.addListener) narrow.addListener(sync);

  if (twin) twin.parentNode.insertBefore(btn, twin.nextSibling);
  else host.appendChild(btn);
  sync();
})();
</script>
