:root {
  --paper: #F9F4E3;
  --sheet: #FDFAEF;
  --snow: #FFFFFF;
  --coal: #241F1A;
  --ink: #241F1A;
  --muted: #5E5448;
  --brand: #58409A;
  --accent2: #8F5A06;
  --ruling: #A49F93;
  --nib: #3E3932;
  --wash: rgba(88, 64, 154, 0.10);
  --wash2: rgba(143, 90, 6, 0.10);
  --serif: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --hatch2: repeating-linear-gradient(-45deg, var(--accent2) 0 1px, transparent 1px 5px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1B1812; --sheet: #221E17; --snow: #ECE6D6; --coal: #241F1A; --ink: #ECE6D6; --muted: #AAA190;
    --brand: #B3A6F2; --accent2: #E0A94E; --ruling: #5B5546; --nib: #D9D2C0;
    --wash: rgba(179, 166, 242, 0.14); --wash2: rgba(224, 169, 78, 0.16); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1B1812; --sheet: #221E17; --snow: #ECE6D6; --coal: #241F1A; --ink: #ECE6D6; --muted: #AAA190;
  --brand: #B3A6F2; --accent2: #E0A94E; --ruling: #5B5546; --nib: #D9D2C0;
  --wash: rgba(179, 166, 242, 0.14); --wash2: rgba(224, 169, 78, 0.16); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--serif); font-weight: 500; font-size: 20px;
  line-height: 1.4; font-variant-numeric: lining-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 30px;
}
button { font-family: inherit; }
.leaf {
  max-width: 1040px; margin: 0 auto; padding: 18px clamp(14px, 3vw, 40px) 20px;
  border: 1px solid var(--ruling); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5px var(--ruling);
}
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  font-style: italic; color: var(--muted); font-size: 16px; }
h1 { font-weight: 600; font-size: clamp(28px, 4.2vw, 40px); margin: 10px 0 4px; line-height: 1.1; text-wrap: balance;
  padding-bottom: 8px; border-bottom: 3px double var(--ruling); }
.lead { margin: 10px 0 16px; font-size: clamp(19px, 2.2vw, 23px); max-width: 52ch; }

/* the play area: the desk, and beside it the map of the town once it is opened */
.play { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 780px) { .play { grid-template-columns: minmax(0, 1fr); } }
.play.solo { grid-template-columns: minmax(0, 440px); justify-content: center; }
@media (max-width: 780px) { .play.solo { grid-template-columns: minmax(0, 1fr); } }
.side { min-width: 0; }
.desk { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { border: 1px solid var(--nib); background: var(--sheet); padding: 6px 6px 8px; position: relative; min-width: 0; }
.card.letter::after { content: ""; position: absolute; top: 6px; right: 6px; width: 16px; height: 16px;
  background: var(--hatch2); border: 1px solid var(--accent2); }
.card .lab { font-style: italic; color: var(--muted); font-size: 16px; display: flex; align-items: center; gap: 6px; min-height: 26px; }
.card .lab img { height: 26px; width: auto; display: block; }
.pic { aspect-ratio: 4 / 3; border: 1.5px solid var(--nib); border-radius: 6px; overflow: hidden; background: var(--sheet); margin-top: 4px; }
.pic svg { display: block; width: 100%; height: 100%; }

/* the route so far: the pictures Mara passed, joined by the road she took */
.trail-lab { font-style: italic; color: var(--muted); font-size: 16px; margin-bottom: -4px; }
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 3px; min-height: 40px; }
.trail .th { width: 48px; aspect-ratio: 4 / 3; border: 1px solid var(--nib); border-radius: 4px; overflow: hidden;
  background: var(--sheet); flex: none; }
.trail .th.now { outline: 2px solid var(--brand); outline-offset: 1px; }
.trail .th svg { display: block; width: 100%; height: 100%; }
.trail .go { width: 18px; height: 18px; color: var(--muted); flex: none; display: inline-flex; }
.trail .go svg { width: 100%; height: 100%; }

.result { min-height: 1.5em; font-size: 20px; text-align: center; }
.result b { color: var(--brand); font-weight: 600; }
.roads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 1.5px solid var(--brand); background: var(--sheet); color: var(--ink); font-size: 19px; font-weight: 600;
  padding: 8px 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
.btn:hover:not(:disabled) { background: var(--wash); }
.btn:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }
.btn:disabled { border-color: var(--ruling); color: var(--muted); cursor: default; }
.btn.strong { background: var(--brand); color: var(--paper); }
.btn.strong:hover:not(:disabled) { background: var(--brand); color: var(--paper); filter: brightness(1.12); }
.btn.strong:disabled { background: var(--sheet); color: var(--muted); }
.btn.wide { grid-column: 1 / -1; }
.btn svg { width: 22px; height: 22px; flex: none; }
/* the secondary option: opens the map of the town, offered only after a few letters */
.peek { border-color: var(--accent2); color: var(--accent2); font-weight: 500; }
.btn.peek:hover:not(:disabled) { background: var(--wash2); }
.peek[aria-expanded="true"] { background: var(--wash2); }
.score { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; min-height: 20px; }
.mk { width: 18px; height: 18px; border-radius: 50%; border: 1.5px dashed var(--ruling); }
.mk.paid { border: 1.5px solid var(--accent2); background: var(--hatch2); }


/* the map of the town */
.town svg.map { width: 100%; height: auto; display: block; }
.cellbox { fill: none; stroke: var(--nib); stroke-width: 2; }
.tbox { fill: none; stroke: var(--accent2); stroke-width: 5; }
.route { fill: none; stroke: var(--brand); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
.rdot { fill: var(--brand); stroke: var(--paper); stroke-width: 2; }
.tick { font-family: var(--serif); font-weight: 600; font-size: 26px; fill: var(--ink); text-anchor: middle; }
.axis { font-family: var(--serif); font-style: italic; font-size: 24px; fill: var(--muted); }
.compass { font-family: var(--serif); font-weight: 600; font-size: 22px; fill: var(--muted); text-anchor: middle; }
.cline { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>


<div class="leaf">
  <div class="top"><span>Mara's Town</span><span>A sketch</span></div>
  <h1>Can you get the letter there?</h1>
  <p class="lead">Send Mara north or east, one road at a time, to the place on the letter, and deliver it there. One coin
    if she does.</p>

  <div class="play solo" id="play">
    <div class="desk">
      <div class="pair">
        <div class="card"><div class="lab"><img id="maraImg" alt="">Here</div><div class="pic" id="herePic"></div></div>
        <div class="card letter"><div class="lab">The letter</div><div class="pic" id="letterPic"></div></div>
      </div>
      <div class="trail-lab">Route so far</div>
      <div class="trail" id="trail" aria-hidden="true"></div>
      <div class="result" id="result" aria-live="polite">&nbsp;</div>
      <div class="roads">
        <button class="btn" id="north" type="button"></button>
        <button class="btn" id="east" type="button"></button>
        <button class="btn wide" id="deliver" type="button"></button>
        <button class="btn strong wide" id="next" type="button">Next letter</button>

y=\".75\"/><circle cx=\"8.9\" cy=\"-47.2\" r=\"2.8\" fill=\"#FF8FA3\" opacity=\".75\"/><path d=\"M-0.6 -50.2L11.2 -47.8L-0.6 -46.1Z\" fill=\"#FF8A1C\" stroke=\"#FF8A1C\" stroke-width=\"0.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"-4.4\" cy=\"-43.6\" r=\"0.9\" fill=\"#2A2A2A\"/><circle cx=\"-2.2\" cy=\"-42.2\" r=\"0.9\" fill=\"#2A2A2A\"/><circle cx=\"0\" cy=\"-41.8\" r=\"0.9\" fill=\"#2A2A2A\"/><circle cx=\"2.2\" cy=\"-42.2\" r=\"0.9\" fill=\"#2A2A2A\"/><circle cx=\"4.4\" cy=\"-43.6\" r=\"0.9\" fill=\"#2A2A2A\"/><g transform=\"rotate(-8 0 -65)\"><rect x=\"-10\" y=\"-81\" width=\"20\" height=\"15\" rx=\"1.8\" fill=\"#262626\"/><rect x=\"-10\" y=\"-72.5\" width=\"20\" height=\"4.3\" fill=\"#E53935\"/><rect x=\"-15.5\" y=\"-68\" width=\"31\" height=\"4.4\" rx=\"2.2\" fill=\"#262626\"/></g></g>"}, "iconViewBox": "0 0 100 100", "letters": [[1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [0, 2], [1, 2], [2, 2]]};
(function () {
  "use strict";
  var D = window.TOWN;          // {mara, places: [{p, houses, snowmen, svg}], icons, iconViewBox, letters}
  var SIDE = 3;                 // places along a side: a count of 0, 1 or 2 of each object
  var UNLOCK = 3;               // letters finished (delivered or lost) before the map can be opened
  var $ = function (id) { return document.getElementById(id); };
  var ARROW = ["M4 12 H19 M13 6 L19 12 L13 18", "M12 20 V5 M6 11 L12 5 L18 11"];   // east, north
  var icon = function (d) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + ARROW[d] +
      '" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  };
  var LETTER = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" fill="none" ' +
    'stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M3 7 L12 13.5 L21 7" fill="none" ' +
    'stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  var FORK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 V13 M12 13 L5 5 M12 13 L19 5" fill="none" ' +
    'stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';

  // ===== the pictures. They are drawn by town-deck/tools/make_town_pictures.py, one source for the slides (PDF) and for this
  // page (SVG). A place is the inner markup of an svg with viewBox "0 0 240 180", coloured by the CSS variables of this
  // page, so dark mode needs no code here. Place p = houses + 3 times snowmen. East adds a house, north a snowman.
  var KINDS = [{ name: "house", plural: "houses" }, { name: "snowman", plural: "snowmen" }];
  var uid = 0;
  // the only ids in a picture are its sky gradient (sky0 to sky8): give each drawn copy its own, so that a place that
  // stands in a card, in the route and in the map never shares an id with itself
  function inner(p) { var u = ++uid; return D.places[p].svg.replace(/sky(\d)/g, "sky$1u" + u); }
  var idx = function (a, b) { return a + SIDE * b; };
  var label = function (a, b) { return a + " " + KINDS[0][a === 1 ? "name" : "plural"] + ", " + b + " " + KINDS[1][b === 1 ? "name" : "plural"]; };
  function scene(a, b) {
    return '<svg viewBox="0 0 240 180" role="img" aria-label="' + label(a, b) + '">' + inner(idx(a, b)) + "</svg>";
  }

  // ===== the letters: Mara always starts at the meadow, (0, 0), and a letter names one of the other eight places
  var START = [0, 0];
  var st = { s: [0, 0], t: [0, 0], path: [], done: false, msg: "", marks: [], finished: 0, open: false, key: "" };

  function newLetter() {
    var d, key;
    do { d = D.letters[Math.floor(Math.random() * D.letters.length)]; key = d.join(); } while (key === st.key);
    st.key = key; st.s = START.slice(); st.t = d.slice(); st.path = [START.slice()]; st.done = false; st.msg = "";
    draw();
  }
  function finish(paid, msg) {
    st.done = true; st.finished += 1; st.marks.push(paid); st.msg = msg;
  }
  function move(dir) {          // 0 = east, one more house. 1 = north, one more snowman
    if (st.done || st.s[dir] >= SIDE - 1) return;
    st.s[dir] += 1;
    st.path.push(st.s.slice());
    if (st.s[dir] > st.t[dir]) finish(false, "Too far " + (dir === 0 ? "east" : "north") + ". Mara cannot turn back. No coin.");
    draw();
  }
  function deliver() {          // the letter ends where she stands
    if (st.done) return;
    if (st.s[0] === st.t[0] && st.s[1] === st.t[1]) finish(true, "<b>Delivered.</b> One coin.");
    else finish(false, "Wrong place. No coin.");
    draw();
  }

  // ===== the map of the town: nine pictures, houses across and snowmen upward, with the route of this letter
  var CW = 140, CH = 105, GAP = 12, LEFT = 70, TOP = 44;
  var GW = SIDE * CW + (SIDE - 1) * GAP, GH = SIDE * CH + (SIDE - 1) * GAP;
  var MW = LEFT + GW + 14, MH = TOP + GH + 64;
  var cellX = function (c) { return LEFT + c * (CW + GAP); };
  var cellY = function (r) { return TOP + (SIDE - 1 - r) * (CH + GAP); };
  function glyph(kind, x, y) {  // a small copy of an object, 28 square, its top left corner at (x, y) on the page
    return '<svg x="' + x + '" y="' + y + '" width="28" height="28" viewBox="' + D.iconViewBox + '">' +
      D.icons[kind === 0 ? "house" : "snowman"] + "</svg>";
  }
  function town() {
    var o = '<svg class="map" viewBox="0 0 ' + MW + " " + MH + '" role="img" aria-label="The town: nine places. ' +
      'Houses increase to the east and snowmen to the north.">', c, r;
    for (c = 0; c < SIDE; c++) for (r = 0; r < SIDE; r++) {

        '<rect class="cellbox" x="' + cellX(c) + '" y="' + cellY(r) + '" width="' + CW + '" height="' + CH + '" rx="6"/>';
    }
    o += '<rect class="tbox" x="' + (cellX(st.t[0]) - 4) + '" y="' + (cellY(st.t[1]) - 4) + '" width="' + (CW + 8) + '" height="' + (CH + 8) + '" rx="9"/>';
    o += '<polyline class="route" points="' + st.path.map(function (p) { return (cellX(p[0]) + CW / 2) + "," + (cellY(p[1]) + CH / 2); }).join(" ") + '"/>';
    st.path.forEach(function (p) { o += '<circle class="rdot" cx="' + (cellX(p[0]) + CW / 2) + '" cy="' + (cellY(p[1]) + CH / 2) + '" r="7"/>'; });
    o += '<image href="' + D.mara + '" x="' + (cellX(st.s[0]) + CW - 42) + '" y="' + (cellY(st.s[1]) + CH - 54) + '" width="38" height="50"/>';
    for (c = 0; c < SIDE; c++) o += '<text class="tick" x="' + (cellX(c) + CW / 2) + '" y="' + (TOP + GH + 28) + '">' + c + "</text>";
    for (r = 0; r < SIDE; r++) o += '<text class="tick" x="' + (LEFT - 22) + '" y="' + (cellY(r) + CH / 2 + 9) + '">' + r + "</text>";
    o += glyph(0, LEFT + GW / 2 - 56, TOP + GH + 34) + '<text class="axis" x="' + (LEFT + GW / 2 - 28) + '" y="' + (TOP + GH + 56) + '">houses</text>';
    o += glyph(1, 2, 8) + '<text class="axis" x="' + 32 + '" y="30">snowmen</text>';
    o += '<text class="compass" x="' + (MW - 24) + '" y="22">N</text><path class="cline" d="M' + (MW - 24) + " 30 V" + 40 + " M" + (MW - 30) + " 35 L" + (MW - 24) + " 29 L" + (MW - 18) + ' 35"/>';
    return o + "</svg>";
  }

  // ===== drawing
  function draw() {
    $("herePic").innerHTML = scene(st.s[0], st.s[1]);
    $("letterPic").innerHTML = scene(st.t[0], st.t[1]);
    $("east").disabled = st.done || st.s[0] >= SIDE - 1;
    $("north").disabled = st.done || st.s[1] >= SIDE - 1;
    $("deliver").disabled = st.done;
    $("next").disabled = !st.done;
    $("result").innerHTML = st.msg || "&nbsp;";
    var tr = "";
    st.path.forEach(function (p, i) {
      if (i > 0) tr += '<span class="go">' + icon(p[0] > st.path[i - 1][0] ? 0 : 1) + "</span>";
      tr += '<span class="th' + (i === st.path.length - 1 ? " now" : "") + '">' + scene(p[0], p[1]) + "</span>";
    });
    $("trail").innerHTML = tr;
    $("score").innerHTML = st.marks.slice(-10).map(function (m) { return '<span class="mk' + (m ? " paid" : "") + '"></span>'; }).join("");
    var can = st.finished >= UNLOCK, show = can && st.open;
    $("peek").hidden = !can;
    $("peek").setAttribute("aria-expanded", show ? "true" : "false");
    $("peekText").textContent = show ? "Hide the town" : "Show the town";
    $("side").hidden = !show;
    $("play").classList.toggle("solo", !show);
    if (show) $("town").innerHTML = town();
  }

  $("north").innerHTML = icon(1) + "North";
  $("east").innerHTML = icon(0) + "East";
  $("deliver").innerHTML = LETTER + "Deliver the letter here";
  $("peekIcon").innerHTML = FORK;
  $("maraImg").src = D.mara;
  $("north").addEventListener("click", function () { move(1); });
  $("east").addEventListener("click", function () { move(0); });
  $("deliver").addEventListener("click", deliver);
  $("next").addEventListener("click", newLetter);
  $("peek").addEventListener("click", function () {
    st.open = !st.open;
    draw();
    if (st.open) {
      var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      $("side").scrollIntoView({ block: "nearest", behavior: calm ? "auto" : "smooth" });
    }
  });
  document.addEventListener("keydown", function (e) {
    var onButton = document.activeElement && document.activeElement.tagName === "BUTTON";
    if (e.key === "ArrowRight") { move(0); e.preventDefault(); }
    else if (e.key === "ArrowUp") { move(1); e.preventDefault(); }
    else if (e.key === "Enter" && !onButton) { if (st.done) newLetter(); else deliver(); e.preventDefault(); }
  });

})();
