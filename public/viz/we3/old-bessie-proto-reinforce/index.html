    },

    /* The tries, the last SHOWN of them (the best one always shown, marked when there are two or more). With no
       try yet, an invisible entry keeps the list's height, so the diagram does not move when the first one comes. */
    renderTries: function () {
      var P = this.P, t = this.S.tries, n = t.length, self = this;
      P.tlist.textContent = "";
      vis(P.tlab, n > 0);
      if (!n) {
        var blank = this.tryEntry(D.START, 0, 0);
        blank.el.classList.add("ob-hide");
        P.tlist.appendChild(blank.el);
        return null;
      }
      var best = 0;
      t.forEach(function (x, i) { if (x.avg > t[best].avg) best = i; });
      var shown = [];
      for (var i = Math.max(0, n - SHOWN); i < n; i++) shown.push(i);
      if (shown.indexOf(best) < 0) shown = [best].concat(shown.slice(1));
      var newest = null;
      shown.forEach(function (i, j) {
        if (j > 0 && i - shown[j - 1] > 1) P.tlist.appendChild(el("span", "s3a-tgap", ".."));
        var E = self.tryEntry(t[i].col, t[i].avg, i + 1);
        if (n >= 2 && i === best) E.el.classList.add("best");
        P.tlist.appendChild(E.el);
        if (i === n - 1) newest = E;
      });
      return newest;
    },
    tryEntry: function (col, avg, no) {
      var e = el("div", "s3a-try");
      e.appendChild(el("span", "s3a-tno", no ? String(no) : "0"));
      var mini = el("span", "s3a-mini");
      col.forEach(function (a, s) {
        var c = el("span", "s3a-mc a" + a);
        c.innerHTML = OB.art.glyph(a, 12);
        c.title = B.STATES[s] + ": " + B.ACTIONS[a];
        mini.appendChild(c);
      });
      e.appendChild(mini);
      var av = OB.moneyEl(avg);
      av.classList.add("s3a-tav");
      e.appendChild(av);
      return { el: e, mini: mini, avg: av };
    },

    /* The loop: up from the average, over the runs, down into the head of the column. p: the share drawn. */
    drawLoop: function (p) {
      var P = this.P;
      if (!P) return;
      if (p !== undefined) this.loopP = p;
      var f = this.loopP, d = P.dia.getBoundingClientRect();
      if (!this.loopOn || !d.width || getComputedStyle(P.loop).display === "none") { P.loop.style.visibility = "hidden"; return; }
      var a = P.avgBox.getBoundingClientRect(), g = P.C.grid.getBoundingClientRect(), e = P.C.entry(0).getBoundingClientRect();
      var h = 12, w = h * 0.62, top = 8;
      var x1 = a.left + a.width / 2 - d.left, y1 = a.top - d.top - 8;
      var x2 = e.left + e.width / 2 - d.left, y2 = g.top - d.top + 16;
      var pts = [[x1, y1], [x1, top], [x2, top], [x2, y2 - h]];
      P.line.setAttribute("points", pts.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" "));
      P.head.setAttribute("points", [x2, y2, x2 - w, y2 - h, x2 + w, y2 - h].map(function (v) { return v.toFixed(1); }).join(","));
      var len = 0;
      for (var i = 1; i < pts.length; i++) len += Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);
      P.line.style.strokeDasharray = len + " " + len;
      P.line.style.strokeDashoffset = String(len * (1 - f));
      P.head.style.opacity = f >= 1 ? "1" : "0";
      P.loop.style.visibility = "";
    }
  });
})();
</script>
<script>/* sec3b-data.js */
/* sec3b-data.js: every number that the scenes of sec3b.js show (agent A4b, 2026-11-14), computed from bessie.js.
   In the browser it is window.S3B (loaded before sec3b.js); in node, require('./sec3b-data.js'), for
   tools/check_tables.js, which asserts every shown number.

   W     the bets of proto-REINFORCE, B.PROTO.bets (= B.randomBets(17)), the table that agent A5 starts from
   P     its probability table, B.softmaxTable(W), shown with 2 decimals
   E     the exponential of every bet (step 1 of softmax), shown with 3 decimals; ESUM the rows' sums
   COL   the strict strategy of the column, B.BEST; COLW the column as bets: 3 on its action, 0 on the others
   DRAW  the draws of the policy in HEALTHY: B.act(P, HEALTHY, u) with u the action number of each "week" of
         B.dice(3, 100, 1). Seed 3 is the first seed, counting from 1, whose six draws come out 3 RUN, 1 SERVICE and
         2 REPLACE, HEALTHY's chances (0.47, 0.17, 0.35) times 6, rounded */
(function (root) {
  "use strict";
  var NODE = typeof module !== "undefined" && module.exports;
  var B = NODE ? require("./bessie.js") : root.B;

  /* The number format of core.js (OB.num), repeated here so that node can check the shown strings. */
  function num(x, places) {
    var p = places || 0;
    var neg = x < 0 && Math.abs(x) >= 0.5 * Math.pow(10, -p);
    var s = Math.abs(x).toFixed(p);
    var parts = s.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + parts.join(".");
  }
  var PLACES = { bets: 2, prob: 2, exp: 3 };
  function show(kind, x) { return num(x, PLACES[kind]); }

  var W = B.PROTO.bets.map(function (r) { return r.slice(); });
  var P = B.softmaxTable(W);
  var E = W.map(function (r) { return r.map(Math.exp); });
  var ESUM = E.map(function (r) { return r[0] + r[1] + r[2]; });
  var COL = B.BEST.slice();
  var COLBET = 3;
  var COLW = COL.map(function (b) { return [0, 1, 2].map(function (a) { return a === b ? COLBET : 0; }); });
  /* The highest bet and the highest chance of each row: the same action. */
  function argmax(r) { var k = 0; for (var a = 1; a < r.length; a++) if (r[a] > r[k]) k = a; return k; }
  var TOPW = W.map(argmax), TOPP = P.map(argmax);

  var DRAW = { seed: 3, n: 100, shown: 6, state: B.HEALTHY, u: [], acts: [], count: [0, 0, 0] };
  var dd = B.dice(DRAW.seed, DRAW.n, 1);
  for (var i = 0; i < DRAW.n; i++) {
    var u = dd[2 * i], a = B.act(P, DRAW.state, u);
    DRAW.u.push(u);
    DRAW.acts.push(a);
    DRAW.count[a]++;
  }

  /* The worked example of step 1 (e to the power of HEALTHY's bet on RUN) and the step 2 lines of HEALTHY. */
  var EX = { s: B.HEALTHY, a: B.RUN, bet: W[0][0], value: E[0][0] };
  function sumLine(s) { return E[s].map(function (x) { return show("exp", x); }).join(" + ") + " = " + show("exp", ESUM[s]); }
  function divLines(s) {
    return [0, 1, 2].map(function (a) { return show("exp", E[s][a]) + " / " + show("exp", ESUM[s]) + " = " + show("prob", P[s][a]); });
  }

  var S3B = {
    W: W, P: P, E: E, ESUM: ESUM, COL: COL, COLBET: COLBET, COLW: COLW, TOPW: TOPW, TOPP: TOPP, DRAW: DRAW, EX: EX,
    EPS: B.PROTO.eps, num: num, show: show, PLACES: PLACES, sumLine: sumLine, divLines: divLines
  };
  if (NODE) module.exports = S3B;
  else root.S3B = S3B;
})(typeof window !== "undefined" ? window : this);
</script>
<script>/* sec3b.js */
/* sec3b.js: page 3, section 4 of the weekend, bets and softmax (agent A4b, 2026-11-14), scenes 200 to 299.
   From Carlos's request (REQUEST.md: "a table of what we call bets ... through the softmax operation we can convert
   this into a probability table ... Include an optional slide ... 2 steps"). Every number comes from sec3b-data.js
   (window.S3B, computed from bessie.js) and is asserted by tools/check_tables.js. The tables are tables.js.

   200 card "Bets"
   210 From a column to a table of bets (5 beats): the strategy B.BEST as a column; the empty bets table W; what a bet
       says; the column as bets, 3 on its action and 0 on the others; the highest bet of each row is the column's action
   220 Why bets (4 beats): a column entry jumps; a bet moves by 0.01; small moves change the strategy a little; small
       moves make the best strategy simpler to compute (proto-REINFORCE)
   230 Softmax (7 beats): the bets of proto-REINFORCE; softmax; HEALTHY guessed, then computed; the other rows; each
       row adds up to 1; the higher the bet, the higher the chance
   240 The policy (9 beats): the probability table is a policy; in a state the action is drawn with that row's
       chances; six draws in HEALTHY (seed 3); the counts of 100 draws

  }

  /* A box for an average G1, of the make of tables.js's zoomed cell (as agent A6's close-up draws it): a caption
     (BEFORE or AFTER), the name AVERAGE G1 in a tag, the number in money, green for a gain and red for a loss. */
  function avgBox(v, cap) {
    var A = { el: el("div", "tb-zoom ob-box white s3c-avg") };
    A.cap = el("div", "tb-zcap" + (cap ? "" : " ob-gone"), cap || "");
    A.el.appendChild(A.cap);
    var hd = el("div", "tb-zhead");
    hd.appendChild(OB.html("span", "s3c-gname", "AVERAGE " + X.AVG));
    A.el.appendChild(hd);
    A.num = el("span", "tb-zn s3c-gn");
    A.el.appendChild(A.num);
    function tint(x) {
      var r = x === null ? 0 : +x.toFixed(2);
      A.num.classList.toggle("gain", r > 0);
      A.num.classList.toggle("loss", r < 0);
    }
    /* The number to x: at once, or rolling from o.from (with api) after o.delay, its colour set at the end. */
    A.set = function (x, api, o) {
      o = o || {};
      if (api && o.from !== undefined) {
        tint(o.from);
        api.at((o.delay || 0) + (o.dur || OB.DUR.roll), function () { tint(x); });
        return api.roll(A.num, x, { from: o.from, fmt: fmtM, delay: o.delay || 0, dur: o.dur });
      }
      tint(x);
      A.num.textContent = fmtM(x);
      A.num.dataset.v = String(x);
      return Promise.resolve();
    };
    /* A question mark in place of the number, while the room guesses. */
    A.ask = function () { tint(null); A.num.textContent = "?"; };
    /* The caption: shown (fading in when api moves) or gone. */
    A.capOn = function (on, api, o) {
      if (!on) { A.cap.classList.add("ob-gone"); A.cap.classList.remove("ob-hide"); return; }
      if (!A.cap.classList.contains("ob-gone")) return;
      A.cap.classList.remove("ob-gone");
      A.cap.classList.add("ob-hide");
      if (api) api.show(A.cap, true, o); else A.cap.classList.remove("ob-hide");
    };
    if (v !== null && v !== undefined) A.set(v);
    return A;
  }

  /* The update written out: its lines, the last one ending in the new bet (U.res, which flies into the table). */
  function updBox(lines) {
    var U = { el: el("div", "s3c-upd ob-box white ob-hide") };
    U.cap = el("div", "tb-zcap", "THE UPDATE");
    U.el.appendChild(U.cap);
    lines.forEach(function (ln, i) {
      var p = el("div", "s3c-line");
      if (i === lines.length - 1) {
        var j = ln.lastIndexOf(" = ");
        p.innerHTML = sym(ln.slice(0, j + 3));
        U.res = el("span", "s3c-new", ln.slice(j + 3));
        p.appendChild(U.res);
      } else p.innerHTML = sym(ln);
      U.el.appendChild(p);
    });
    return U;
  }

  /* Shows an element by wiping it in from the top (with motion) or at once; hides it at once. */
  function reveal(e, on, api, go, o) {
    o = o || {};
    if (!on) { e.classList.add("ob-hide"); e.style.clipPath = ""; e.style.opacity = ""; return; }
    if (!go || !e.classList.contains("ob-hide")) { e.classList.remove("ob-hide"); e.style.clipPath = ""; e.style.opacity = ""; return; }
    e.style.clipPath = "inset(0 0 100% 0)";
    e.classList.remove("ob-hide");
    api.at(o.delay || 0, function () {
      api.animate(o.dur || 1600, function (p) { e.style.clipPath = "inset(0 0 " + ((1 - p) * 100).toFixed(2) + "% 0)"; },
        function () { e.style.clipPath = ""; });
    });
  }
  /* Of a stack of layers, shows layer i (-1: none); with motion it wipes in over the one shown before, which goes
     when the wipe ends. */
  function pick(els, i, api, go, o) {
    o = o || {};
    var prev = -1;
    els.forEach(function (e, j) { if (j !== i && !e.classList.contains("ob-hide")) prev = j; });
    els.forEach(function (e, j) {
      e.classList.toggle("s3c-top", j === i);
      if (j === i) reveal(e, true, api, go, o);
      else if (j === prev && i >= 0 && go && els[i].classList.contains("ob-hide")) {
        api.at((o.delay || 0) + (o.dur || 1600), function () { e.classList.add("ob-hide"); });
      } else reveal(e, false);
    });
  }

  /* The loops drawn now, redrawn when the window changes size. */
  var LOOPS = [];
  function redrawLoops() { LOOPS.forEach(function (d) { if (!d.loop.el.classList.contains("ob-hide")) d.drawLoop(); }); }
  window.addEventListener("resize", function () { requestAnimationFrame(redrawLoops); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawLoops);

  /* The diagram of sketch page 25 for the bets W: the bets table, softmax, the probability table, the runs (one
     layer per policy, added with d.layer), their G1, the average G1 (d.A); the cells zb, za (a bet before and after)
     and aa (the average after), filled by the scenes; the loop from the average back to the bets. */
  function Dia(W, o) {
    o = o || {};
    var d = { W: W };
    d.wrap = el("div", "s3c-wrap");
    d.el = el("div", "s3c-dia");
    d.wrap.appendChild(d.el);
    function cell(area, cls) {
      var c = el("div", "s3c-cell " + (cls || ""));
      c.style.gridArea = area;
      d.el.appendChild(c);
      return c;
    }
    d.c = { bets: cell("bets"), prob: cell("prob"), runs: cell("runs"), g1: cell("g1"),
      ab: cell("ab", "s3c-ab"), aa: cell("aa", "s3c-aa"), zb: cell("zb", "s3c-zb"), za: cell("za", "s3c-za") };
    d.T = TB.table(o.empty ? null : W, { kind: "bets", size: "s", cap: "BETS TABLE W" });
    d.c.bets.appendChild(d.T.el);
    d.Q = TB.table(B.softmaxTable(W), { kind: "prob", size: "s", heads: "top", cap: "PROBABILITY TABLE" });
    d.c.prob.appendChild(d.Q.el);
    var rb = el("div", "s3c-rbox");
    d.n = el("span", "s3c-n", "n");
    d.brace = brace();
    d.stack = el("div", "s3c-stack");
    rb.appendChild(d.n);
    rb.appendChild(d.brace);
    rb.appendChild(d.stack);
    d.c.runs.appendChild(rb);
    d.rcap = el("div", "s3c-cap", "n = " + OB.num(D.n) + " RUNS");
    d.c.runs.appendChild(d.rcap);
    d.gstack = el("div", "s3c-stack");
    d.c.g1.appendChild(d.gstack);
    d.gcap = OB.html("div", "s3c-cap", X.G1 + " OF EACH RUN");
    d.c.g1.appendChild(d.gcap);
    d.A = avgBox(o.avg === undefined ? null : o.avg, o.avgCap || "");
    d.c.ab.appendChild(d.A.el);
    d.rbs = [];
    d.gcs = [];
    /* A layer of runs and of G1 for the bets V (hidden until d.runsOn and d.g1On show it). */
    d.layer = function (V) {
      var runs = OB.runs.play(B.softmaxTable(V), dice(), D.n);
      var b = OB.runs.block(runs, { compact: true, g1: false, height: 140, width: 130 });
      b.classList.add("ob-hide");
      d.stack.appendChild(b);
      d.rbs.push(b);
      var g = g1Canvas(runs);
      g.classList.add("ob-hide");
      d.gstack.appendChild(g);
      d.gcs.push(g);
      return d.rbs.length - 1;
    };
    d.runsOn = function (i, api, go, o2) { pick(d.rbs, i, api, go, o2); };
    d.g1On = function (i, api, go, o2) { pick(d.gcs, i, api, go, o2); };

    /* The arrows of the forward pass: on (drawn at once, or in turn when o2.draw names them) or off. */
    d.arrows = function (api, ids, o2) {
      o2 = o2 || {};
      var ph = phone(), wide = window.matchMedia && window.matchMedia("(min-width: 1120px)").matches;
      var spec = {
        sm: [ph ? d.T.el : d.T.grid, ph ? d.Q.el : d.Q.grid, ph ? { label: "SOFTMAX" } : { label: "SOFTMAX", labelDy: -22 }],
        play: [d.Q.el, d.stack, { from: "bottom", to: "top", elbow: true }],
        g1: [d.stack, d.gstack, {}],
        avg: wide ? [d.gstack, d.A.el, {}] : [d.c.g1, d.A.el, { from: "bottom", to: "top", elbow: true }]
      };
      Object.keys(spec).forEach(function (id) {
        if (ids.indexOf(id) < 0) { api.unarrow(id); return; }
        var sp = spec[id], q = {};
        Object.keys(sp[2]).forEach(function (k) { q[k] = sp[2][k]; });
        if (o2.draw && o2.draw[id] !== undefined) q.delay = o2.draw[id]; else q.dur = 1;
        api.arrow(id, sp[0], sp[1], q);
      });
    };

    /* The loop: from the average G1 out to the right, up above the diagram, and down into the bets. */
    d.loop = { el: OB.svgEl("svg", { "class": "s3c-loop ob-hide", "aria-hidden": "true" }), p: 1 };
    d.loop.line = OB.svgEl("polyline", {});
    d.loop.head = OB.svgEl("polygon", {});
    d.loop.el.appendChild(d.loop.line);
    d.loop.el.appendChild(d.loop.head);
    d.el.appendChild(d.loop.el);
    d.drawLoop = function (p) {
      if (p !== undefined) d.loop.p = p;
      var f = d.loop.p, R = d.el.getBoundingClientRect(), a = d.A.el.getBoundingClientRect(), t = d.T.grid.getBoundingClientRect();
      if (!R.width || !a.width || !t.width) return;
      var h = 14, x1 = a.right - R.left + 8, y1 = a.top + a.height / 2 - R.top;
      var xr = R.width - 14, yt = 12, xb = t.left + t.width / 2 - R.left, yb = t.top - R.top - 5;
      var pts = [[x1, y1], [xr, y1], [xr, yt], [xb, yt], [xb, yb - h]];
      var len = 0;
      for (var i = 1; i < pts.length; i++) len += Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);
      d.loop.line.setAttribute("points", pts.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" "));
      d.loop.line.style.strokeDasharray = len + " " + len;
      d.loop.line.style.strokeDashoffset = String(len * (1 - f));
      d.loop.head.setAttribute("points", [xb, yb, xb - h * 0.62, yb - h, xb + h * 0.62, yb - h].map(function (v) { return v.toFixed(1); }).join(","));
      d.loop.head.style.opacity = f >= 1 ? "1" : "0";
    };
    d.loopOn = function (on, api, go, o2) {
      o2 = o2 || {};
      var e = d.loop.el;
      if (!on) { e.classList.add("ob-hide"); return; }
      if (LOOPS.indexOf(d) < 0) LOOPS.push(d);
      if (!e.classList.contains("ob-hide")) { d.drawLoop(1); return; }
      e.classList.remove("ob-hide");
      if (!go) { d.drawLoop(1); return; }
      d.drawLoop(0);
      api.at(o2.delay || 0, function () {
        api.animate(o2.dur || 1800, function (p) { d.drawLoop(p); }, function () { d.drawLoop(1); });
      });
    };
    return d;
  }

  /* The four numbers of a hop in the middle of the screen, in the places of agent A6's scene 350: the bet's
     Before and After on top, the average's Before and After below. */
  function fourPanel(T, s, a, w0, w1, g0, g1) {
    var F = { el: el("div", "s3c-four ob-hide") };
    var g = el("div", "s3c-fgrid");
    F.zb = T.zoom(s, a, { cap: "BEFORE", value: w0 });
    F.za = T.zoom(s, a, { cap: "AFTER", value: w1 });
    F.gb = avgBox(g0, "BEFORE");
    F.ga = avgBox(g1, "AFTER");
    [F.zb.el, el("div", "s3c-fmid"), F.za.el, F.gb.el, el("div", "s3c-fmid"), F.ga.el].forEach(function (e) { g.appendChild(e); });
    F.boxes = [F.zb.el, F.za.el, F.gb.el, F.ga.el];
    F.boxes.forEach(function (e) { e.classList.add("s3c-fbox"); });
    F.el.appendChild(g);
    // A hidden copy of the sum box that scene 350 (agent A6) keeps below its grid: it takes the same room here, so
    // the four boxes stand where scene 350 shows them and the cut to it does not jump (main session, 2026-11-14).
    var S = window.S3D && window.S3D.T;
    if (S) {
      var c = el("div", "s3d-calc ob-box s3c-fspace");
      c.appendChild(el("div", "s3d-ccap", "AFTER - BEFORE"));
      var line = el("div", "s3d-cline");
      line.appendChild(el("span", "s3d-cexp", S.after + " - (" + S.before + ")"));
      line.appendChild(el("span", "s3d-cres", "= " + S.change));
      c.appendChild(line);
      F.el.appendChild(c);
    }
    return F;
  }

  OB.s3c = { Dia: Dia, avgBox: avgBox, updBox: updBox, lead: lead, say: say, live: live, hopW: hopW, sym: sym,
    fmtM: fmtM, opt: opt, ALL12: ALL12, dice: dice, reveal: reveal };

  /* 300. The card. */
  OB.scene({ page: 3, key: "proto-card", order: 300, title: X.card.title, card: X.card });

  /* 310. The forward pass, one box of the diagram per Next. */
  OB.scene({
    page: 3, key: "proto-forward", order: 310, title: "The forward pass", beats: X.forward.length,
    build: function (root) {
      root.classList.add("s3c-root");
      var P = this.parts = {};
      P.lead = lead(root);
      P.d = Dia(D.W0, { empty: true, avg: D.start });
      P.d.layer(D.W0);
      root.appendChild(P.d.wrap);
    },
    beat: function (k, api) {
      var P = this.parts, d = P.d, go = live(api, k);
      say(P.lead, X.forward[k], api);
      // 0: the bets, picked at random, cell by cell.
      d.T.set(D.W0, go && k === 0 ? { delay: 500, cstagger: 110 } : undefined);
      // 1: softmax, then the probability table.
      api.show(d.Q.el, k >= 1, opt(go && k === 1, 1300));
      // 2: the policy plays the runs.
      [d.n, d.brace, d.rcap].forEach(function (e) { api.show(e, k >= 2, opt(go && k === 2, 1200)); });
      d.runsOn(k >= 2 ? 0 : -1, api, go && k === 2, { delay: 1500 });
      // 3: each run's G1.
      api.show(d.gcap, k >= 3, opt(go && k === 3, 1200));
      d.g1On(k >= 3 ? 0 : -1, api, go && k === 3, { delay: 1200 });
      // 4: their average.
      api.show(d.A.el, k >= 4, opt(go && k === 4, 1200));
      if (k >= 4 && go && k === 4) d.A.set(D.start, api, { from: 0, delay: 1500 });
      else d.A.set(D.start);
      var ids = ["sm", "play", "g1", "avg"].slice(0, Math.max(0, k));
      var draw = {};
      if (go && k >= 1) draw[ids[k - 1]] = 0;
      d.arrows(api, ids, { draw: draw });
      // 5: the loop, and the number to raise.
      d.A.el.classList.toggle("s3c-lit", k >= 5);
      d.loopOn(k >= 5, api, go && k === 5, { delay: 300 });
    }
  });

  /* 320. The backward pass: one bet, a little more, and the average G1 that comes of it. */
  OB.scene({
    page: 3, key: "proto-backward", order: 320, title: "The backward pass", beats: X.backward.length,
    build: function (root) {
      root.classList.add("s3c-root");
      var P = this.parts = {}, h = D.hop1;
      P.lead = lead(root);
      var d = P.d = Dia(D.W0, { avg: D.start, avgCap: "BEFORE" });
      d.A.capOn(false);
      d.layer(D.W0);
      d.layer(hopW(D.W0, h.s, h.a));
      P.zb = d.T.zoom(h.s, h.a, { cap: "BEFORE", value: h.w });
      P.za = d.T.zoom(h.s, h.a, { cap: "AFTER", value: h.w + EPS });
      d.c.zb.appendChild(P.zb.el);
      d.c.za.appendChild(P.za.el);
      P.ga = avgBox(h.after, "AFTER");
      d.c.aa.appendChild(P.ga.el);
      [P.zb.el, P.za.el, P.ga.el].forEach(function (e) { e.classList.add("ob-hide"); });
      P.F = fourPanel(d.T, h.s, h.a, h.w, h.w + EPS, h.before, h.after);
      d.wrap.appendChild(P.F.el);
      root.appendChild(d.wrap);
    },
    beat: function (k, api) {
      var P = this.parts, d = P.d, h = D.hop1, go = live(api, k), hand = k >= 6;
      var cell = [h.s, h.a], W1 = hopW(D.W0, h.s, h.a);
      say(P.lead, X.backward[k], api);
      // The forward pass stands from the start, until the hand-over.
      var ov = api.root.querySelector(".ob-overlay");
      if (!hand && ov) { ov.classList.remove("ob-hide"); ov.style.opacity = ""; }
      d.runsOn(k >= 4 ? 1 : 0, api, go && k === 4, { delay: 600 });
      d.g1On(k >= 4 ? 1 : 0, api, go && k === 4, { delay: 2000 });
      // 0: the twelve bets light up; one is picked at random and ringed.
      if (go && k === 0) {
        d.T.mark(ALL12);
        api.at(1600, function () { d.T.mark([cell]); d.T.rings([cell]); });
      } else if (!hand) { d.T.mark([cell]); d.T.rings([cell]); }
      // 1: its bet taken apart: Before. The average G1 of these bets is its Before too.
      if (k >= 1) {
        if (go && k === 1) d.T.lift(h.s, h.a, P.zb, { delay: 300 });
        else { P.zb.el.classList.remove("ob-hide"); P.zb.el.style.visibility = ""; }
      } else api.show(P.zb.el, false);
      d.A.capOn(k >= 1, api, opt(go && k === 1, 1900));
      // 2: a little more, After.
      if (k >= 2 && !hand) api.arrow("hop", P.zb.el, P.za.el, { label: "+" + OB.num(EPS, 2), labelDy: -22, delay: go && k === 2 ? 200 : 0, dur: go && k === 2 ? undefined : 1 });
      else api.unarrow("hop");
      api.show(P.za.el, k >= 2, opt(go && k === 2, 1400));
      // 3: the After goes into the table; softmax gives HEALTHY new chances.
      d.T.setCell(h.s, h.a, k >= 3 ? W1[h.s][h.a] : h.w, go && k === 3 ? { delay: 300 } : undefined);
      d.Q.setRow(h.s, B.softmax(k >= 3 ? W1[h.s] : D.W0[h.s]), go && k === 3 ? { delay: 1500 } : undefined);
      d.Q.rings(k === 3 ? [[h.s, null]] : []);
      // 4: the same runs again, and the average G1 After.
      api.show(P.ga.el, k >= 4, opt(go && k === 4, 3200));
      if (go && k === 4) P.ga.set(h.after, api, { from: h.before, delay: 3800 });
      else P.ga.set(h.after);
      if (k >= 4 && !hand) api.arrow("flow", P.za.el, P.ga.el, { delay: go && k === 4 ? 3600 : 0, dur: go && k === 4 ? undefined : 1 });
      else api.unarrow("flow");
      // 5: the four boxes together.
      [P.zb.el, P.za.el, d.A.el, P.ga.el].forEach(function (e) { e.classList.toggle("s3c-lit", k === 5); });
      // The forward arrows, then the hand-over (6): the rest fades, the four numbers move to the middle.
      var parts = [d.c.bets, d.c.prob, d.c.runs, d.c.g1];
      var src = [P.zb.el, P.za.el, d.A.el, P.ga.el];
      if (!hand) {
        d.arrows(api, ["sm", "play", "g1", "avg"]);
        parts.forEach(function (c) { c.classList.remove("ob-hide"); c.style.opacity = ""; });
        d.A.el.classList.remove("ob-hide");     // the other three boxes are set above, beat by beat
        P.F.el.classList.add("ob-hide");
        P.F.boxes.forEach(function (e) { e.style.visibility = ""; });
        return;
      }
      d.T.rings([]);
      P.F.el.classList.remove("ob-hide");
      if (go) {
        parts.forEach(function (c) { api.fade(c, false); });
        if (ov) api.fade(ov, false);
        api.at(1200, function () { api.unarrow(); if (ov) { ov.classList.remove("ob-hide"); ov.style.opacity = ""; } });
        src.forEach(function (e, i) {
          api.fly(e, P.F.boxes[i], { delay: 1300 + i * 150, arc: 20 });
          api.at(1300 + i * 150, function () { e.classList.add("ob-hide"); });
        });
      } else {
        api.unarrow();
        parts.forEach(function (c) { c.classList.add("ob-hide"); c.style.opacity = ""; });
        src.forEach(function (e) { e.classList.add("ob-hide"); });
        P.F.boxes.forEach(function (e) { e.style.visibility = ""; });
      }
    }
  });
})();
</script>
<script>/* sec3c2.js */
/* sec3c2.js: page 3, proto-REINFORCE after agent A6's close-up (agent A5, 2026-11-14), scenes 400 to 499. The kit
   of the diagram is OB.s3c (sec3c.js); every number comes from sec3c-data.js and every line from sec3c-text.js.

   400 The update (4 beats): the new bet 2.41 flies from the update into the table; softmax gives HEALTHY new
       chances (RUN 0.87); the same 1,000 runs again, the room guesses (Compute); up, from -$243.36 to -$5.20
   410 Again (5 beats): another bet picked at random (HEALTHY, REPLACE); its hop, shown faster; nabla and the update,
       0.10 becomes -0.27; the same runs, the average G1 rises to $11.08; the loop
   420 Many updates (3 beats): the start; the movie of 300 updates (each a bet at random and 1,000 fresh runs), the
       average G1 drawn point by point and the probability table beside it, faster and faster, with Pause and Again;
       the end: the likeliest actions RUN, SERVICE, REPLACE, REPLACE, the best strategy

   The movie runs on its own requestAnimationFrame loop (the engine's motions are for single moves): it is stopped in
   beat() and leave(), and an instant visit shows its end at once. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, el = OB.el, TB = OB.tables, D = window.S3C, X = window.S3CT, K = OB.s3c;
  if (!K) { console.error("sec3c2: sec3c.js is missing"); return; }

  /* 400. The update in the diagram. */
  OB.scene({
    page: 3, key: "proto-update", order: 400, title: "The update", beats: X.update.length,
    build: function (root) {
      root.classList.add("s3c-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      var d = P.d = K.Dia(D.W0, { avg: D.start });
      d.layer(D.W0);
      d.layer(D.W1);
      P.U = K.updBox(X.updLines);
      d.el.appendChild(P.U.el);
      root.appendChild(d.wrap);
    },
    beat: function (k, api) {
      var P = this.parts, d = P.d, h = D.hop1, go = K.live(api, k), cell = [h.s, h.a];
      K.say(P.lead, X.update[k], api);
      if (k === 2) api.nextLabel("Compute");
      d.arrows(api, ["sm", "play", "g1", "avg"]);
      // 0: the update, and its new bet flies into the table.
      api.show(P.U.el, true);
      d.T.mark([cell]);
      if (go && k === 0) {
        d.T.setCell(h.s, h.a, h.w, { now: true });
        api.at(1500, function () {
          d.T.setCell(h.s, h.a, h.wNew, { now: true });
          api.fly(P.U.res, d.T.num(h.s, h.a), { arc: 30 });
        });
      } else {
        d.T.setCell(h.s, h.a, h.wNew, { now: true });
        d.T.num(h.s, h.a).style.visibility = "";
      }
      // 1: softmax gives HEALTHY new chances.
      d.Q.setRow(h.s, B.softmax(k >= 1 ? D.W1[h.s] : D.W0[h.s]), go && k === 1 ? { delay: 300 } : undefined);
      d.Q.rings(k === 1 ? [[h.s, null]] : []);
      d.Q.mark(k === 1 ? [cell] : []);
      // 2: the same runs again; the room guesses.
      d.runsOn(k >= 2 ? 1 : 0, api, go && k === 2, { delay: 300 });
      d.g1On(k >= 2 ? 1 : 0, api, go && k === 2, { delay: 1700 });
      // 3: the answer.
      if (k === 2) d.A.ask();
      else if (k >= 3 && go && k === 3) d.A.set(h.upd, api, { from: h.before, delay: 300 });
      else d.A.set(k >= 3 ? h.upd : h.before);
      d.A.el.classList.toggle("s3c-lit", k >= 3);
    }
  });

  /* 410. Again: another bet, the hop, nabla and the update, faster, the numbers in place; then the loop. */
  OB.scene({
    page: 3, key: "proto-again", order: 410, title: "Again", beats: X.again.length,
    build: function (root) {
      root.classList.add("s3c-root");
      var P = this.parts = {}, h = D.hop2;
      P.lead = K.lead(root);
      var d = P.d = K.Dia(D.W1, { avg: h.before, avgCap: "BEFORE" });
      d.A.capOn(false);
      d.layer(D.W1);
      d.layer(D.W2);
      P.zb = d.T.zoom(h.s, h.a, { cap: "BEFORE", value: h.w });
      P.za = d.T.zoom(h.s, h.a, { cap: "AFTER", value: h.w + D.eps });
      d.c.zb.appendChild(P.zb.el);
      d.c.za.appendChild(P.za.el);
      P.ga = K.avgBox(h.after, "AFTER");
      d.c.aa.appendChild(P.ga.el);
      [P.zb.el, P.za.el, P.ga.el].forEach(function (e) { e.classList.add("ob-hide"); });
      P.U = K.updBox(X.againLines);
      d.el.appendChild(P.U.el);
      root.appendChild(d.wrap);
    },
    beat: function (k, api) {
      var P = this.parts, d = P.d, h = D.hop2, go = K.live(api, k), cell = [h.s, h.a];
      K.say(P.lead, X.again[k], api);
      d.arrows(api, ["sm", "play", "g1", "avg"]);
      // 0: the twelve bets light up, one is ringed. 4: the loop, nothing marked.
      if (go && k === 0) {
        d.T.mark(K.ALL12);
        api.at(1400, function () { d.T.mark([cell]); d.T.rings([cell]); });
      } else if (k < 4) { d.T.mark([cell]); d.T.rings([cell]); }
      else { d.T.mark([]); d.T.rings([]); }
      // 1: the hop, all at once: Before, After, the average Before and After.
      var hop = k === 1, g1 = go && k === 1;
      if (hop) {
        if (g1) d.T.lift(h.s, h.a, P.zb, { delay: 100 });
        else { P.zb.el.classList.remove("ob-hide"); P.zb.el.style.visibility = ""; }
        api.arrow("hop", P.zb.el, P.za.el, { label: "+" + OB.num(D.eps, 2), labelDy: -22, delay: g1 ? 1300 : 0, dur: g1 ? 900 : 1 });
        api.show(P.za.el, true, K.opt(g1, 1900));
        api.show(P.ga.el, true, K.opt(g1, 2600));
        api.arrow("flow", P.za.el, P.ga.el, { delay: g1 ? 2500 : 0, dur: g1 ? 900 : 1 });
      } else {
        api.unarrow("hop");
        api.unarrow("flow");
        [P.zb.el, P.za.el, P.ga.el].forEach(function (e) {
          if (go && k === 2) api.fade(e, false, { dur: 800 }); else api.show(e, false);
        });
      }
      d.A.capOn(hop, api, K.opt(g1, 2600));
      // 2: the update, written in their place; the new bet flies into the table.
      api.show(P.U.el, k === 2 || k === 3, K.opt(go && k === 2, 900));
      if (go && k === 2) {
        d.T.setCell(h.s, h.a, h.w, { now: true });
        api.at(2300, function () {
          d.T.setCell(h.s, h.a, h.wNew, { now: true });
          api.fly(P.U.res, d.T.num(h.s, h.a), { arc: 30 });
        });
      } else {
        d.T.setCell(h.s, h.a, k >= 2 ? h.wNew : h.w, { now: true });
        d.T.num(h.s, h.a).style.visibility = "";
      }
      // 3: softmax, the same runs, the new average G1.
      d.Q.setRow(h.s, B.softmax(k >= 3 ? D.W2[h.s] : D.W1[h.s]), go && k === 3 ? { delay: 200 } : undefined);
      d.runsOn(k >= 3 ? 1 : 0, api, go && k === 3, { delay: 900 });
      d.g1On(k >= 3 ? 1 : 0, api, go && k === 3, { delay: 1700 });
      if (k >= 3 && go && k === 3) d.A.set(h.upd, api, { from: h.before, delay: 2600 });
      else d.A.set(k >= 3 ? h.upd : h.before);
      d.A.el.classList.toggle("s3c-lit", k >= 3);
      // 4: the loop.
      d.loopOn(k >= 4, api, go && k === 4, { delay: 200 });
    }
  });

  /* 420. Many updates: the movie. */

  /* The bets and chances after each of the 300 rounds, rebuilt from the movie's rows in hundredths (whole numbers,
     so the sums are exact); frame 0 is B.PROTO's bets. tools/check_proto.js checks that the last frame is D.end.W. */
  var FR = (function () {
    var H = D.W0.map(function (r) { return r.map(function (x) { return Math.round(x * 100); }); });
    var out = [];
    function push(g) {
      var W = H.map(function (r) { return r.map(function (x) { return x / 100; }); });
      out.push({ W: W, P: B.softmaxTable(W), g: g });
    }
    push(D.start);
    D.movie.forEach(function (m) { H[m[0]][m[1]] += m[2]; push(m[3]); });
    return out;
  })();
  var N = FR.length - 1, FIRST = 2;

  /* The chart of the average G1 after each update: drawn in the element's own pixels, on D.chart's scale. */
  function Chart() {
    var C = { el: el("div", "s3c-chart") };
    C.ylab = OB.html("div", "s3c-ylab", "AVERAGE " + X.AVG);
    C.el.appendChild(C.ylab);
    C.svg = OB.svgEl("svg", { "class": "s3c-csvg", "aria-hidden": "true" });
    C.el.appendChild(C.svg);
    C.axes = OB.svgEl("g", {});
    C.best = OB.svgEl("line", { "class": "s3c-best" });
    C.bestLab = OB.svgEl("text", { "class": "s3c-bl" });
    C.bestLab.textContent = "BEST STRATEGY";
    C.curve = OB.svgEl("polyline", { "class": "s3c-curve" });
    C.dot = OB.svgEl("circle", { "class": "s3c-dot", r: "6" });
    [C.axes, C.best, C.bestLab, C.curve, C.dot].forEach(function (e) { C.svg.appendChild(e); });
    C.key = "";
    C.i = FIRST;
    C.showBest = false;
    function geo() {
      var w = C.el.clientWidth, h = C.el.clientHeight, f = parseFloat(window.getComputedStyle(C.el).fontSize) || 11;
      var g = { w: w, h: h, f: f, l: Math.round(f * 5 + 16), r: 12, t: Math.round(f * 2.6), b: Math.round(f * 2 + 14) };
      g.x = function (i) { return g.l + (w - g.l - g.r) * i / N; };
      g.y = function (v) { return g.t + (h - g.t - g.b) * (D.chart.hi - v) / (D.chart.hi - D.chart.lo); };
      return g;
    }
    function text(x, y, s, cls, anchor) {
      var t = OB.svgEl("text", { x: x.toFixed(1), y: y.toFixed(1), "class": cls || "", "text-anchor": anchor || "start" });
      t.textContent = s;
      return t;
    }
    function axes(g) {
      while (C.axes.firstChild) C.axes.removeChild(C.axes.firstChild);
      C.svg.setAttribute("width", g.w);
      C.svg.setAttribute("height", g.h);
      for (var v = D.chart.lo; v <= D.chart.hi; v += 100) {
        var y = g.y(v);
        C.axes.appendChild(OB.svgEl("line", { "class": v === 0 ? "s3c-zero" : "s3c-grid", x1: g.l, x2: g.w - g.r, y1: y, y2: y }));
        C.axes.appendChild(text(g.l - 9, y + g.f * 0.45, OB.money(v, 0), "s3c-tl", "end"));
      }
      for (var i = 0; i <= N; i += 100) {
        var x = g.x(i);
        C.axes.appendChild(OB.svgEl("line", { "class": "s3c-tick", x1: x, x2: x, y1: g.h - g.b, y2: g.h - g.b + 7 }));
        C.axes.appendChild(text(x, g.h - g.b + 9 + g.f, String(i), "s3c-tl", i === 0 ? "start" : i === N ? "end" : "middle"));
      }
      C.axes.appendChild(OB.svgEl("polyline", { "class": "s3c-ax", points: g.l + "," + g.t + " " + g.l + "," + (g.h - g.b) + " " + (g.w - g.r) + "," + (g.h - g.b) }));
      C.axes.appendChild(text((g.l + g.w - g.r) / 2, g.h - 2, "UPDATES", "s3c-tt", "middle"));
    }
    C.draw = function (i) {
      if (i !== undefined) C.i = i;
      var g = geo();
      if (!g.w || !g.h) return;
      var key = g.w + "x" + g.h + "x" + g.f;
      if (key !== C.key) { C.key = key; axes(g); }
      var pts = [];
      for (var j = 0; j <= C.i; j++) pts.push(g.x(j).toFixed(1) + "," + g.y(FR[j].g).toFixed(1));
      C.curve.setAttribute("points", pts.join(" "));
      C.dot.setAttribute("cx", g.x(C.i).toFixed(1));
      C.dot.setAttribute("cy", g.y(FR[C.i].g).toFixed(1));
      var yb = g.y(D.end.best);
      C.best.setAttribute("x1", g.l);
      C.best.setAttribute("x2", g.w - g.r);
      C.best.setAttribute("y1", yb);
      C.best.setAttribute("y2", yb);
      C.bestLab.setAttribute("x", g.l + 10);
      C.bestLab.setAttribute("y", (yb - 9).toFixed(1));
      C.best.style.display = C.bestLab.style.display = C.showBest ? "" : "none";
    };
    return C;
  }

  var MOVIE = {
    page: 3, key: "proto-movie", order: 420, title: "Many updates", beats: X.movie.length,
    build: function (root) {
      root.classList.add("s3c-root");
      var P = this.parts = {}, self = MOVIE;
      P.lead = K.lead(root);
      var mv = el("div", "s3c-mv");
      var left = el("div", "s3c-mvl");
      P.C = Chart();
      left.appendChild(P.C.el);
      var bar = el("div", "s3c-mvbar");
      P.pause = el("button", "ob-btn s3c-btn", "PAUSE");
      P.pause.type = "button";
      P.count = el("span", "s3c-count");
      P.again = el("button", "ob-btn quiet s3c-btn", "AGAIN");
      P.again.type = "button";
      bar.appendChild(P.pause);
      bar.appendChild(P.count);
      bar.appendChild(P.again);
      left.appendChild(bar);
      mv.appendChild(left);
      var right = el("div", "s3c-mvr");
      P.Q = TB.table(FR[FIRST].P, { kind: "prob", size: "m", cap: "PROBABILITY TABLE" });
      right.appendChild(P.Q.el);
      mv.appendChild(right);
      root.appendChild(mv);
      P.note = el("p", "ob-note s3c-note ob-hide", X.movieNote);
      root.appendChild(P.note);
      P.M = { i: FIRST, playing: false, raf: 0, last: 0, acc: 0 };
      P.pause.addEventListener("click", function () {
        if (P.M.playing) self.stop(); else if (P.M.i < N) self.play(); else self.play(true);
      });
      P.again.addEventListener("click", function () { self.play(true); });
      window.addEventListener("resize", function () { if (P.C.key) P.C.draw(); });
    },
    /* Frame i: the chart up to update i, the counter, the table of chances after update i. */
    frame: function (i) {
      var P = MOVIE.parts;
      P.M.i = i;
      P.C.draw(i);
      P.count.textContent = X.counter(i);
      P.Q.set(FR[i].P, { now: true });
    },
    /* The end of the movie (beat 2): the best strategy's line, the likeliest actions lit, the note. */
    extras: function (on) {
      var P = MOVIE.parts;
      P.C.showBest = on;
      P.C.draw();
      P.Q.mark(on ? D.end.top.map(function (a, s) { return [s, a]; }) : []);
      P.note.classList.toggle("ob-hide", !on);
    },
    stop: function () {
      var P = MOVIE.parts;
      if (!P) return;
      P.M.playing = false;
      if (P.M.raf) cancelAnimationFrame(P.M.raf);
      P.M.raf = 0;
      P.pause.textContent = "PLAY";
    },
    /* Plays the movie from where it is (or from the start): 700 ms for each of the first eight updates, then each
       0.88 times the one before, down to 20 ms (about 16 s for the 298 updates). */
    play: function (fromStart) {
      var P = MOVIE.parts, M = P.M, self = MOVIE;
      self.stop();
      if (fromStart || M.i >= N) { M.i = FIRST; self.extras(false); self.frame(FIRST); }
      function dur(i) { var j = i - FIRST - 1; return j < 8 ? 700 : Math.max(20, 700 * Math.pow(0.88, j - 7)); }
      M.playing = true;
      M.last = 0;
      M.acc = 0;
      P.pause.textContent = "PAUSE";
      function tick(now) {
        if (!M.playing) return;
        if (!M.last) M.last = now;
        M.acc += now - M.last;
        M.last = now;
        var i = M.i;
        while (i < N && M.acc >= dur(i + 1)) { M.acc -= dur(i + 1); i++; }
        if (i !== M.i) self.frame(i);
        if (i >= N) {
          self.stop();
          if (self.k === 2) self.extras(true);
          return;
        }
        M.raf = requestAnimationFrame(tick);
      }
      M.raf = requestAnimationFrame(tick);
    },
    beat: function (k, api) {
      var P = MOVIE.parts, go = K.live(api, k);
      MOVIE.k = k;
      MOVIE.stop();
      K.say(P.lead, X.movie[k], api);
      api.show(P.pause, k >= 1);
      api.show(P.again, k >= 1);
      if (k === 0) { MOVIE.extras(false); MOVIE.frame(FIRST); return; }
      if (k === 1 && go) { MOVIE.extras(false); MOVIE.frame(FIRST); MOVIE.play(true); return; }
      MOVIE.frame(N);
      MOVIE.extras(k >= 2);
    },
    leave: function () { MOVIE.stop(); }
  };
  OB.scene(MOVIE);
})();
</script>
<script>/* sec3d-data.js */
/* sec3d-data.js: every number that the close-up of page 3 shows (agent A6, 2026-11-14), computed from bessie.js.
   In the browser it is window.S3D (loaded before sec3d.js); in node, require('./sec3d-data.js'), for
   tools/check_closeup.js, which asserts every shown number.

   The guided example B.PROTO: the bet on RUN in HEALTHY (B.PROTO.pick), 1,000 runs on B.dice(12, 1000), the hop
   epsilon = 0.01, the step alpha = 0.01. B.hop gives the average G1 before and after the hop, on the same dice.

   Every number is shown with two decimals, as B.PROTO's comment says, and every shown number follows from the shown
   numbers before it, worked in hundredths (whole numbers, so the arithmetic is exact):
     change = after - before            -241.35 - (-243.36) = 2.01
     nabla  = change / epsilon          2.01 / 0.01 = 201
     w      = w + alpha x nabla         0.40 + 0.01 x 201 = 0.40 + 2.01 = 2.41
   The update climbs (w + alpha nabla): the average G1 has to go up (Carlos, 2026-11-14, "yes!").

   DOLLARS: true writes the averages and their change as money (OB.money: "-$243.36", "$2.01"), as page 2 and Try it
   write every G1; nabla, the bets, epsilon and alpha are plain numbers. */
(function (root) {
  "use strict";
  var NODE = typeof module !== "undefined" && module.exports;
  var B = NODE ? require("./bessie.js") : root.B;
  var DOLLARS = true;

  /* The number formats of core.js (OB.num, OB.money), repeated here so that node can check the shown strings. */
  function num(x, places) {
    var p = places || 0;
    var neg = x < 0 && Math.abs(x) >= 0.5 * Math.pow(10, -p);
    var s = Math.abs(x).toFixed(p);
    var parts = s.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + parts.join(".");
  }
  function money(x, places, sign) {
    var p = places || 0;
    var r = +x.toFixed(p);
    var body = "$" + num(Math.abs(r), p);
    if (r < 0) return "-" + body;
    return (sign && r > 0 ? "+" : "") + body;
  }
  /* A whole number of hundredths as text with two decimals (241 -> "2.41", -24336 -> "-243.36"). */
  function hund(i) { return num(i / 100, 2); }
  /* An average G1 (or its change) as the page writes it. */
  function avg(x, sign) { return DOLLARS ? money(x, 2, sign) : (sign && x > 0 ? "+" : "") + num(x, 2); }

  var P = B.PROTO, S = P.pick[0], A = P.pick[1];
  var dice = B.dice(P.diceSeed, P.n);
  var hop = B.hop(P.bets, S, A, P.eps, dice, P.n);

  /* In hundredths: the bet before and after the hop, the averages before and after, the change, epsilon, alpha. */
  var U = {
    w0: Math.round(P.bets[S][A] * 100),            // 40
    eps: Math.round(P.eps * 100),                  // 1
    alpha: Math.round(P.alpha * 100),              // 1
    before: Math.round(hop.before * 100),          // -24336
    after: Math.round(hop.after * 100)             // -24135
  };
  U.w1 = U.w0 + U.eps;                             // 41
  U.change = U.after - U.before;                   // 201: the change is 2.01
  var NABLA = U.change / U.eps;                    // 201: 2.01 / 0.01, a whole number since epsilon is one hundredth
  U.step = U.alpha * NABLA;                        // 201: 0.01 x 201 = 2.01
  U.wNew = U.w0 + U.step;                          // 241: 0.40 + 2.01 = 2.41

  var V = {                                        // the shown numbers as numbers
    w0: U.w0 / 100, w1: U.w1 / 100, eps: U.eps / 100, alpha: U.alpha / 100,
    before: U.before / 100, after: U.after / 100, change: U.change / 100,
    nabla: NABLA, step: U.step / 100, wNew: U.wNew / 100
  };
  var T = {                                        // the shown numbers as text
    w0: hund(U.w0), w1: hund(U.w1), eps: hund(U.eps), alpha: hund(U.alpha),
    before: avg(V.before), after: avg(V.after), change: avg(V.change), changeUp: avg(V.change, true),
    changeNum: hund(U.change), nabla: num(NABLA, 0), step: hund(U.step), wNew: hund(U.wNew),
    perUnit: DOLLARS ? money(NABLA, 0) : num(NABLA, 0),   // nabla read as the rise of the average for one unit of bet
    n: num(P.n, 0)
  };

  var S3D = {
    DOLLARS: DOLLARS, s: S, a: A, n: P.n, U: U, V: V, T: T, hop: hop, bets: P.bets,
    num: num, money: money, hund: hund, avg: avg
  };
  if (NODE) module.exports = S3D;
  else root.S3D = S3D;
})(typeof window !== "undefined" ? window : this);
</script>
<script>/* sec3d.js */
/* sec3d.js: page 3, the close-up of the hop and the update (agent A6, 2026-11-14), scenes 350 to 399.
   Carlos (REQUEST.md): "do a separate slide for this where we do the calculation on how to update, how to do the
   before and after, because having the entire diagram there is too distracting. So if we can just for a moment fade
   the diagram and then focus on this before and after calculation slowly, in particular in explaining ... why the W
   must be updated using this update formula." Agent A5's scene before 350 fades the diagram and leaves four values;
   its scene 400 brings the diagram back with the updated bet. Every number comes from sec3d-data.js (window.S3D,
   computed from bessie.js) and is asserted by tools/check_closeup.js; no number is written here.

   350 Up close: before and after (4 beats): the four values; the bet moved by epsilon = 0.01; did the average G1 go
       up or down? (the room guesses); Compute: after minus before, $2.01
   360 The triangle of the hop (5 beats): the bet across and the average G1 up, before and after as two points;
       across 0.01; up $2.01; nabla is the slope, up divided by across (the room guesses); Compute: 201
   370 The update (2 beats): w = w + alpha nabla, alpha = 0.01; the sign: weekend 2's loss had to go down (minus),
       here the average G1 has to go up (plus)
   380 Why this update (4 beats): a positive nabla raises the bet; a negative one lowers it; a steep slope moves it
       more; alpha keeps each move small
   390 The update, worked out (3 beats): w = 0.40 + 0.01 x 201 = ? (the room guesses); Compute: 2.41; the new bet
       alone on the screen, for A5's scene 400 */
(function () {
  "use strict";
  var OB = window.OB, art = OB.art, el = OB.el, TB = OB.tables, D = window.S3D;
  if (!TB || !D) { console.error("sec3d: tables.js or sec3d-data.js is missing"); return; }
  var T = D.T, V = D.V;
  var NAB = art.sym("nabla"), ALP = art.sym("alpha"), EPS = art.sym("epsilon");
  var G1 = "G<sub>1</sub>", AVG = "<span class=\"ob-bar\">G<sub>1</sub></span>";
  var INK = art.C.ink, INK2 = art.C.ink2;

  /* The lead line of a scene: its words change with the beat and fade in on Next (as in sec3b.js). The words sit in
     one inner span, so that the lead's flex box keeps the spaces around a subscript. */
  function lead(root) { var p = el("p", "ob-say s3d-lead"); root.appendChild(p); return p; }
  function say(p, markup, api) {
    if (p.dataset.t === markup) return;
    p.dataset.t = markup;
    p.innerHTML = "<span>" + markup + "</span>";
    if (api && api.forward && !api.instant) api.fade(p, true);
  }
  /* A piece of arithmetic that stays on one line of a lead. */

      var P = this.parts = {};
      P.lead = lead(root);
      var stack = el("div", "s3d-stack");
      var w = el("div", "s3d-work ob-box white");
      w.appendChild(eqRow("w", "w + " + ALP + NAB));
      w.appendChild(eqRow("", T.w0 + " + " + T.alpha + " x " + T.nabla));
      P.r3 = eqRow("", "");
      P.q = el("span", "s3d-q", "?");
      P.sum = el("span", "", T.w0 + " + " + T.step);
      P.r3.right.appendChild(P.q);
      P.r3.right.appendChild(P.sum);
      w.appendChild(P.r3);
      P.r4 = eqRow("", "");
      P.res = el("span", "s3d-res", T.wNew);
      P.r4.right.appendChild(P.res);
      w.appendChild(P.r4);
      P.work = w;
      stack.appendChild(w);
      P.Z = betBox("NEW BET", V.wNew);
      P.Z.el.classList.add("s3d-final", "ob-hide");
      stack.appendChild(P.Z.el);
      root.appendChild(stack);
    },
    beat: function (k, api) {
      var P = this.parts, go = live(api, k);
      say(P.lead, L390[k], api);
      if (k === 0) api.nextLabel("Compute");
      // Beat 0: the question mark. Beat 1: 0.01 x 201 becomes 2.01, then the sum rolls up from the bet now.
      P.q.classList.toggle("ob-gone", k >= 1);
      P.sum.classList.toggle("ob-gone", k < 1);
      if (k === 1 && go) P.sum.classList.add("ob-hide");
      if (k >= 1) api.show(P.sum, true, { delay: k === 1 && go ? 300 : 0 });
      api.show(P.r4, k >= 1, { delay: k === 1 && go ? 1600 : 0 });
      if (k >= 1) {
        if (k === 1 && go) api.roll(P.res, V.wNew, { from: V.w0, fmt: betFmt, delay: 2000 });
        else { P.res.textContent = T.wNew; P.res.dataset.v = String(V.wNew); }
      }
      // Beat 2: the working fades, and the new bet flies into the box of the entry, left alone on the screen.
      if (k >= 2) {
        if (go) {
          api.fade(P.work, false, { dur: 900 });
          api.show(P.Z.el, true, { delay: 500 });
          api.fly(P.res, P.Z.num, { delay: 1100 });
        } else {
          api.show(P.work, false);
          api.show(P.Z.el, true);
          P.Z.num.style.visibility = "";
        }
      } else {
        api.show(P.work, true);
        api.show(P.Z.el, false);
      }
    }
  });
})();
</script>
<script>/* fullscreen.js */
/* fullscreen.js: the full-screen button of the AINIT games (2026-11-11; Carlos shows the games from his iPad).
   The same file in every game. The button goes after the light or dark switch (.themebtn) and takes its look; a
   page without that switch marks the place with data-fullscreen. One tap and the page fills the whole screen, with
   no address bar or tabs, in Safari and Chrome on an iPad and on a computer. The button is left out where the
   browser cannot do that (an iPhone, a frame that does not allow it), and hidden on screens under 561 px and while
   the page is full screen. The browser's own exit button, a swipe down on an iPad, or Escape leave full screen. */
(function () {
  var doc = document, root = doc.documentElement;
  var request = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!request || !(doc.fullscreenEnabled || doc.webkitFullscreenEnabled)) return;
  var host = doc.querySelector("[data-fullscreen]"), twin = host ? null : doc.querySelector(".themebtn");
  if (!host && !twin) return;

  var btn = doc.createElement("button");
  btn.type = "button";
  btn.className = twin ? twin.className + " fullbtn" : "fullbtn";
  btn.title = "Full screen";
  btn.setAttribute("aria-label", "Full screen");
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" style="display:block; margin:auto" aria-hidden="true"' +
    ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';

  var narrow = window.matchMedia ? window.matchMedia("(max-width: 560px)") : null;
  function isFull() { return !!(doc.fullscreenElement || doc.webkitFullscreenElement); }
  function sync() { btn.style.display = isFull() || (narrow && narrow.matches) ? "none" : ""; }

  btn.addEventListener("click", function () {
    btn.blur();
    var p = request.call(root);
    if (p && typeof p.catch === "function") p.catch(function () {});
  });
  doc.addEventListener("fullscreenchange", sync);
  doc.addEventListener("webkitfullscreenchange", sync);
  if (narrow && narrow.addEventListener) narrow.addEventListener("change", sync);
  else if (narrow && narrow.addListener) narrow.addListener(sync);

  if (twin) twin.parentNode.insertBefore(btn, twin.nextSibling);
  else host.appendChild(btn);
  sync();
})();
</script>
