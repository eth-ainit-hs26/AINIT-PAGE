      if (k === WORK) api.nextLabel("Compute");
      handOut(P);
      // The table of preferences, its entry in focus: 0.40 until the new preference lands in it (beat 8).
      thetaOn(P.th);
      P.th.el.style.visibility = "";
      if (!(k === 8 && go)) {
        P.th.setCell(D.s, D.a, k >= 8 ? V.wNew : V.w0, { now: true });
        P.th.num(D.s, D.a).style.visibility = "";
      }

      // 0: the table (from 360), the update, its tags, alpha; the arrow from theta_{s,a} to its entry.
      var g0 = k === 0 && go, t = H ? 900 : 0;
      if (H) handIn(api, P, H);
      if (g0) P.f.classList.add("ob-hide");
      api.show(P.f, true, { delay: g0 ? t + 200 : 0 });
      P.tags.forEach(function (e) { api.show(e, true, { delay: g0 ? t + 1300 : 0 }); });
      api.show(P.al, true, { delay: g0 ? t + 2200 : 0 });
      P.route.set(true, api, g0, t + 2800);

      // 1: the sign, beside weekend 2's.
      api.show(P.cards, k >= 1, { delay: k === 1 && go ? 300 : 0 });
      P.plus.classList.toggle("s3d-lit", k >= 1);

      // 2 to 5: why this update, one card per Next, the newest lit.
      P.whys.forEach(function (c, i) {
        var at = WHY0 + i, fresh = k === at && go;
        api.show(c, k >= at, { delay: fresh ? 200 : 0 });
        c.classList.toggle("s3d-lit", k === at);
        if (k >= at) drawWhy(api, c, fresh);
      });

      // 6: the update worked out: nabla comes under the formula, then the box; the preference now flies out of the
      // table, alpha and nabla out of their line; the room guesses.
      var g6 = k === WORK && go;
      api.show(P.nb, k >= WORK, { delay: g6 ? 300 : 0 });
      api.show(P.work, k >= WORK, { delay: g6 ? 900 : 0 });
      if (g6) {
        P.ops2.forEach(function (e) { e.classList.add("ob-hide"); api.show(e, true, { delay: 3300, dur: 600 }); });
        flyEl(api, P.th.num(D.s, D.a), P.w0, { delay: 1700, dur: 1100, arc: 30 });
        flyEl(api, P.alN, P.a2, { delay: 2050, dur: 1100, arc: 30 });
        flyEl(api, P.nbN, P.n2, { delay: 2400, dur: 1100, arc: 30 });
      } else {
        P.ops2.forEach(function (e) { e.classList.remove("ob-hide"); e.style.opacity = ""; });
        [P.w0, P.a2, P.n2].forEach(function (e) { e.style.visibility = ""; });
      }

      // 7, Compute: 0.01 x 174 becomes 1.74, then the sum rolls up from the preference now.
      P.q.classList.toggle("ob-gone", k >= WORK + 1);
      P.sum.classList.toggle("ob-gone", k < WORK + 1);
      if (k === WORK + 1 && go) P.sum.classList.add("ob-hide");
      if (k >= WORK + 1) api.show(P.sum, true, { delay: k === WORK + 1 && go ? 300 : 0 });
      api.show(P.r4, k >= WORK + 1, { delay: k === WORK + 1 && go ? 1600 : 0 });
      if (k >= WORK + 1) {
        if (k === WORK + 1 && go) api.roll(P.res, V.wNew, { from: V.w0, fmt: betT, delay: 2000 });
        else { P.res.textContent = OB.texText(T.wNew); P.res.dataset.v = String(V.wNew); }
      }

      // 8: the new preference flies back into the table and takes the place of the preference now, which stays
      // until the new one is nearly on it.
      if (k === 8 && go) {
        P.th.setCell(D.s, D.a, V.w0, { now: true });
        flyEl(api, P.res, P.th.num(D.s, D.a), { delay: 500, dur: 1400, arc: 60, keep: true,
          land: function () { P.th.setCell(D.s, D.a, V.wNew, { now: true }); } });
      }
    }
  });
})();
</script>
<script>/* sec3e.js */
/* sec3e.js: page 3, scene 430 "What we learned" (main session, 2026-11-17), the last scene of the page.
   Carlos: "Other conclusion slide, summarizing what we learned through all this process."

   Six cards, one per Next, the newest lit; each a number, a name, a small picture and a short caption:
   0  HUMAN LEARNING: the helmet and the policy we chose (B.EXAMPLE, as scene 190 shows it)
   1  THE POLICY: the preferences theta, softmax, the probabilities, HEALTHY's roulette (from S3C.W0)
   2  THE FORWARD PASS: the first four of the n episodes of scene 310 (OB.runs.play on S3C's dice), their returns, the
      average G bar 1
   3  THE BACKWARD PASS: the triangle of the hop (schematic, as the why cards of scene 370), the hop S3C.eps
   4  THE UPDATE: the table of preferences, its entry lit, and theta_{s,a} + alpha nabla
   5  REPEAT: the learning curve of scene 420 (S3C.start and the S3C.rounds updates of S3C.movie), the optimal policy's
      line (S3C.end.best), and the likeliest action in each state after the last update (S3C.end.top, B.BEST)
   Every number comes from S3C (sec3c-data.js), S3CT (sec3c-text.js) or B (bessie.js); none is written here. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, D = window.S3C, X = window.S3CT, TB = OB && OB.tables;
  if (!OB || !B || !D || !X || !TB || !OB.runs) { console.error("sec3e: bessie.js, sec3c-data.js, sec3c-text.js or runs.js is missing"); return; }
  var el = OB.el, art = OB.art, tx = OB.tex, sv = OB.svgEl;
  var C = art.C;
  var N = X.num(D.n, 0), EPS = X.num(D.eps, 2), ALPHA = X.num(D.alpha, 2), LAST = X.num(D.rounds, 0);
  var TH = tx("\\theta"), AVG = tx("\\bar{G}_1"), NAB = tx("\\nabla"), UPD = tx("\\theta_{s,a} = \\theta_{s,a} + \\alpha\\nabla");
  var TOP = D.end.top;
  if (TOP.join() !== B.BEST.join()) console.error("sec3e: the likeliest actions after the last update are " + TOP.join() + ", B.BEST is " + B.BEST.join());

  var LEAD = [
    "Human learning: we chose the actions ourselves and searched for the optimal policy.",
    "The policy: softmax turns the preferences " + TH + " of each state into probabilities, and a roulette samples the action.",
    "The forward pass: the policy plays " + tx("n = " + OB.texNum(N)) + " episodes. Their average return is " + AVG + ".",
    "The backward pass: one preference hops by " + EPS + ". The slope " + NAB + " is the change of " + AVG + " divided by " + EPS + ".",
    "The update: " + UPD + ", with " + tx("\\alpha = " + ALPHA) + ". It moves the preference along the slope, so that " + AVG + " goes up.",
    "Repeat: after " + LAST + " updates the likeliest action in each state is the optimal policy's."
  ];
  var CARDS = [
    { name: "HUMAN LEARNING", cap: "WE CHOOSE THE POLICY", cls: "s3e-human" },
    { name: "THE POLICY", cap: "THE ROULETTE SAMPLES THE ACTION" },
    { name: "THE FORWARD PASS", cap: tx("n = " + OB.texNum(N)) + " EPISODES, THEIR AVERAGE " + AVG },
    { name: "THE BACKWARD PASS", cap: NAB + " = UP DIVIDED BY ACROSS" },
    { name: "THE UPDATE", cap: UPD },
    { name: "REPEAT", cap: LAST + " UPDATES: THE OPTIMAL POLICY" }
  ];

  function add(p, tag, attrs) { var n = sv(tag, attrs); p.appendChild(n); return n; }
  function svgText(p, x, y, t, cls, anchor) {
    var n = add(p, "text", { x: x, y: y, "class": cls || "", "text-anchor": anchor || "start" });
    n.textContent = t;
    return n;
  }
  function board(w, h) { return sv("svg", { "class": "s3e-svg", viewBox: "0 0 " + w + " " + h, width: w, height: h, "aria-hidden": "true" }); }

  /* A policy as a column: a van per state, the action chosen in it. */
  function policyCol(policy) {
    var c = el("div", "s3e-pol");
    policy.forEach(function (a, s) {
      var r = el("div", "s3e-prow");
      r.appendChild(art.van(s, { size: 30, gauge: false, label: false }));
      r.appendChild(art.actionChip(a, { glyph: 12 }));
      c.appendChild(r);
    });
    return c;
  }
  /* A table of 4 states by 3 actions, schematic: a colour mark per state and per action; cell(s, a, x, y, w, h) draws
     inside each cell. */
  function grid(svg, x0, y0, cw, ch, cell) {
    var g = add(svg, "g", {});
    for (var a = 0; a < 3; a++) add(g, "rect", { "class": "s3e-am a" + a, x: x0 + a * cw + cw / 2 - 4, y: y0 - 11, width: 8, height: 6 });
    for (var s = 0; s < 4; s++) {
      add(g, "rect", { "class": "s3e-sm w" + s, x: x0 - 11, y: y0 + s * ch + ch / 2 - 4, width: 7, height: 8 });
      for (a = 0; a < 3; a++) {
        add(g, "rect", { "class": "s3e-cell", x: x0 + a * cw, y: y0 + s * ch, width: cw, height: ch });
        if (cell) cell(g, s, a, x0 + a * cw, y0 + s * ch, cw, ch);
      }
    }
    return g;
  }
  function arrowR(svg, x1, x2, y) {
    add(svg, "line", { "class": "s3e-arl", x1: x1, y1: y, x2: x2 - 8, y2: y });
    add(svg, "polygon", { "class": "s3e-arh", points: [x2, y, x2 - 9, y - 5, x2 - 9, y + 5].join(",") });
  }

  /* 1. The policy: preferences, softmax, probabilities, HEALTHY's roulette. */
  function policyPic() {
    var P = B.softmaxTable(D.W0), W = 300, H = 118, svg = board(W, H);
    grid(svg, 14, 22, 17, 17);
    svgText(svg, 39.5, 112, "PREFERENCES", "s3e-lab", "middle");
    arrowR(svg, 72, 112, 56);
    svgText(svg, 92, 47, "SOFTMAX", "s3e-lab", "middle");
    grid(svg, 126, 22, 17, 17, function (g, s, a, x, y, w, h) {
      add(g, "rect", { "class": "s3e-bar a" + a, x: x + 2, y: y + h - 5, width: Math.max(0.5, (w - 4) * P[s][a]), height: 3 });
    });
    svgText(svg, 151.5, 112, "PROBABILITIES", "s3e-lab", "middle");
    arrowR(svg, 184, 212, 56);
    // HEALTHY's roulette: one slot per action, as large as its probability, from the top, clockwise.
    var cx = 252, cy = 56, r = 38, t = -Math.PI / 2;
    P[0].forEach(function (p, a) {
      var t2 = t + p * 2 * Math.PI, big = p > 0.5 ? 1 : 0;
      add(svg, "path", { "class": "s3e-slot a" + a, d: "M" + cx + " " + cy + " L" + (cx + r * Math.cos(t)).toFixed(2) + " " + (cy + r * Math.sin(t)).toFixed(2) +
        " A" + r + " " + r + " 0 " + big + " 1 " + (cx + r * Math.cos(t2)).toFixed(2) + " " + (cy + r * Math.sin(t2)).toFixed(2) + " Z" });
      t = t2;
    });
    add(svg, "circle", { "class": "s3e-hub", cx: cx, cy: cy, r: 9 });
    svgText(svg, cx, 112, "ROULETTE", "s3e-lab", "middle");
    return svg;
  }

  /* 2. The forward pass: the first four episodes of scene 310 and their returns, then the average. */
  function forwardPic() {
    var runs = OB.runs.play(B.softmaxTable(D.W0), B.dice(D.seeds.dice, D.n), 4);
    var w = el("div", "s3e-fwd");
    var bk = OB.runs.block(runs, { compact: false, head: false, label: false, g1: true, places: 0 });
    bk.classList.add("s3e-runs");
    (bk.g1s || []).forEach(function (g) { g.classList.remove("ob-hide"); });
    w.appendChild(bk);
    w.appendChild(el("span", "s3e-brace"));
    w.appendChild(OB.html("span", "s3e-avg", AVG));
    return w;
  }

  /* 3. The backward pass: the triangle of the hop, schematic (no average is drawn to scale). */
  function backwardPic() {
    var W = 300, H = 118, svg = board(W, H), ax = { x: 30, y: 96, top: 4, right: 270 };
    var Bp = { x: 104, y: 78 }, Ap = { x: 196, y: 30 };
    add(svg, "line", { "class": "s3e-ax", x1: ax.x, y1: ax.y, x2: ax.right, y2: ax.y });
    add(svg, "line", { "class": "s3e-ax", x1: ax.x, y1: ax.top, x2: ax.x, y2: ax.y });
    svgText(svg, ax.x + 8, ax.top + 8, "AVERAGE RETURN", "s3e-lab", "start");
    svgText(svg, ax.right, H - 2, "THE PREFERENCE", "s3e-lab", "end");
    add(svg, "polygon", { "class": "s3e-tf", points: [Bp.x, Bp.y, Ap.x, Bp.y, Ap.x, Ap.y].join(",") });
    add(svg, "line", { "class": "s3e-leg", x1: Bp.x, y1: Bp.y, x2: Ap.x, y2: Bp.y });
    add(svg, "line", { "class": "s3e-leg s3e-up", x1: Ap.x, y1: Bp.y, x2: Ap.x, y2: Ap.y });
    add(svg, "line", { "class": "s3e-hyp", x1: Bp.x, y1: Bp.y, x2: Ap.x, y2: Ap.y });
    svgText(svg, (Bp.x + Ap.x) / 2, Bp.y + 15, "+" + EPS, "s3e-num", "middle");
    svgText(svg, Ap.x + 8, (Bp.y + Ap.y) / 2 + 4, "UP", "s3e-lab s3e-gain", "start");
    var nb = svgText(svg, (Bp.x + Ap.x) / 2 - 16, (Bp.y + Ap.y) / 2 - 4, String.fromCharCode(8711), "s3e-tex s3e-nab", "middle");
    nb.setAttribute("font-size", "22");
    add(svg, "rect", { "class": "s3e-pt s3e-old", x: Bp.x - 6, y: Bp.y - 6, width: 12, height: 12 });
    add(svg, "rect", { "class": "s3e-pt", x: Ap.x - 6, y: Ap.y - 6, width: 12, height: 12 });
    svgText(svg, Bp.x - 10, Bp.y + 4, "BEFORE", "s3e-lab", "end");
    svgText(svg, Ap.x + 10, Ap.y + 4, "AFTER", "s3e-lab", "start");
    return svg;
  }

  /* 4. The update: what is added, and the table of preferences with its entry lit. */
  function updatePic() {
    var w = el("div", "s3e-upd");
    var svg = board(92, 104);
    grid(svg, 18, 22, 22, 18, function (g, s, a, x, y, cw, ch) {
      if (s === 0 && a === 0) add(g, "rect", { "class": "s3e-lit", x: x, y: y, width: cw, height: ch });
    });
    w.appendChild(OB.html("span", "s3e-add", tx("+\\,\\alpha\\nabla")));
    w.appendChild(el("span", "s3e-into"));
    w.appendChild(svg);
    return w;
  }

  /* 5. Repeat: the learning curve of scene 420 and the policy it ends on. */
  function repeatPic() {
    var w = el("div", "s3e-rep");
    var W = 190, H = 118, svg = board(W, H), x0 = 14, x1 = 186, yT = 10, yB = 98;
    var lo = D.chart.lo, hi = D.chart.hi;
    function Y(v) { return yB - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (yB - yT); }
    var pts = [D.start].concat(D.movie.map(function (r) { return r[3]; }));
    function X(i) { return x0 + i / (pts.length - 1) * (x1 - x0); }
    add(svg, "line", { "class": "s3e-ax", x1: x0, y1: yB, x2: x1, y2: yB });
    add(svg, "line", { "class": "s3e-ax", x1: x0, y1: yT - 4, x2: x0, y2: yB });
    add(svg, "line", { "class": "s3e-best", x1: x0, y1: Y(D.end.best), x2: x1, y2: Y(D.end.best) });
    svgText(svg, x1, Y(D.end.best) - 6, "OPTIMAL POLICY", "s3e-lab", "end");
    var line = add(svg, "polyline", { "class": "s3e-curve", points: pts.map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ") });
    svgText(svg, x1, H - 4, LAST + " UPDATES", "s3e-lab", "end");
    w.appendChild(svg);
    w.appendChild(policyCol(TOP));
    w.curve = line;
    return w;
  }

  function humanPic() {
    var w = el("div", "s3e-hum");
    w.appendChild(OB.html("span", "s3e-face", art.face(6)));
    w.appendChild(el("span", "s3e-into"));
    w.appendChild(policyCol(B.EXAMPLE));
    return w;
  }

  function card(i, c, pic) {
    var k = el("div", "ob-box white s3e-card ob-hide" + (c.cls ? " " + c.cls : ""));
    var h = el("div", "s3e-head");
    h.appendChild(el("span", "s3e-no", String(i + 1)));
    h.appendChild(el("span", "s3e-name", c.name));
    k.appendChild(h);
    var p = el("div", "s3e-pic");
    p.appendChild(pic);
    k.appendChild(p);
    k.appendChild(OB.html("div", "s3e-cap", c.cap));
    return k;
  }

  OB.scene({
    page: 3, key: "summary", order: 430, title: "What we learned", beats: LEAD.length,
    build: function (root) {
      var P = this.parts = {};
      P.lead = el("p", "ob-say s3e-lead");
      root.appendChild(P.lead);
      var g = el("div", "s3e-grid");
      var pics = [humanPic(), policyPic(), forwardPic(), backwardPic(), updatePic(), repeatPic()];
      P.rep = pics[5];
      P.cards = CARDS.map(function (c, i) { var k = card(i, c, pics[i]); g.appendChild(k); return k; });
      root.appendChild(g);
    },
    beat: function (k, api) {
      var P = this.parts, go = api.forward && !api.instant && api.from === k - 1;
      if (P.lead.dataset.k !== String(k)) {
        P.lead.dataset.k = String(k);
        P.lead.innerHTML = "<span>" + LEAD[k] + "</span>";
        if (go) api.fade(P.lead, true, { dur: 900 });
      }
      P.cards.forEach(function (c, i) {
        api.show(c, i <= k, { delay: i === k && go ? 250 : 0 });
        c.classList.toggle("s3e-on", i === k);
      });
      // The learning curve draws itself from its start when its card comes with Next.
      var cv = P.rep.curve, len = cv.getTotalLength ? cv.getTotalLength() : 0;
      if (k === 5 && go && len) {
        cv.style.strokeDasharray = len + " " + len;
        cv.style.strokeDashoffset = String(len);
        api.at(600, function () {
          api.animate(2200, function (p) { cv.style.strokeDashoffset = String(len * (1 - p)); },
            function () { cv.style.strokeDashoffset = "0"; });
        });
      } else {
        cv.style.strokeDasharray = "";
        cv.style.strokeDashoffset = "";
      }
    }
  });
})();
</script>
<script>/* fullscreen.js */
/* fullscreen.js: the full-screen button of the AINIT games (2026-11-11; Carlos shows the games from his iPad).
   The same file in every game. The button goes after the light or dark switch (.themebtn) and takes its look; a
   page without that switch marks the place with data-fullscreen. One tap and the page fills the whole screen, with
   no address bar or tabs, in Safari and Chrome on an iPad and on a computer. The button is left out where the
   browser cannot do that (an iPhone, a frame that does not allow it), and hidden on screens under 561 px and while
   the page is full screen. The browser's own exit button, a swipe down on an iPad, or Escape leave full screen. */
(function () {
  var doc = document, root = doc.documentElement;
  var request = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!request || !(doc.fullscreenEnabled || doc.webkitFullscreenEnabled)) return;
  var host = doc.querySelector("[data-fullscreen]"), twin = host ? null : doc.querySelector(".themebtn");
  if (!host && !twin) return;

  var btn = doc.createElement("button");
  btn.type = "button";
  btn.className = twin ? twin.className + " fullbtn" : "fullbtn";
  btn.title = "Full screen";
  btn.setAttribute("aria-label", "Full screen");
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" style="display:block; margin:auto" aria-hidden="true"' +
    ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';

  var narrow = window.matchMedia ? window.matchMedia("(max-width: 560px)") : null;
  function isFull() { return !!(doc.fullscreenElement || doc.webkitFullscreenElement); }
  function sync() { btn.style.display = isFull() || (narrow && narrow.matches) ? "none" : ""; }

  btn.addEventListener("click", function () {
    btn.blur();
    var p = request.call(root);
    if (p && typeof p.catch === "function") p.catch(function () {});
  });
  doc.addEventListener("fullscreenchange", sync);
  doc.addEventListener("webkitfullscreenchange", sync);
  if (narrow && narrow.addEventListener) narrow.addEventListener("change", sync);
  else if (narrow && narrow.addListener) narrow.addListener(sync);

  if (twin) twin.parentNode.insertBefore(btn, twin.nextSibling);
  else host.appendChild(btn);
  sync();
})();
</script>
<script>/* juice.js */
/* juice.js: the motion layer of the look Arcade Marquee (design/arcade-marquee-motion, 2026-11-17). Loaded last by
   the three shells (after fullscreen.js), with juice.css. MOTION.md lists every device, where it plays, how long it
   takes and how to switch it off.

   core.js asks window.OB.fx for juice at seven points, and only while motion is allowed (a beat reached with Next, no
   &instant, no reduced motion): enter (a fade-in), flight and landed (api.fly), roll (api.roll), arrow (api.arrow),
   beat and cut (every beat shown). Every motion that this file starts runs through the engine's timeline
   (OB.animate), so that Next, Back, the pager and a deep link end it at once: the particles of a burst die with the
   burst's motion, the transforms that an entrance or a pop sets are cleared in its done. The idle life (the vans bob,
   the marquee's bulbs chase, smoke rises from FAILING) is CSS, off under &instant and prefers-reduced-motion.

   Switches: OB.fx.off = true (or the hash flag &nojuice) turns the whole layer off and the pages move as they did;
   OB.fx.config holds the sizes and the durations. The sections call OB.fx.burst, OB.fx.toss, OB.fx.celebrate and
   OB.fx.milestone at a few moments, always as "OB.fx && OB.fx.<name>(...)". */
(function () {
  "use strict";
  var OB = window.OB;
  if (!OB) return;
  var doc = document, html = doc.documentElement;
  var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var OFF = /[#&]nojuice\b/.test(location.hash || "");
  /* html.fx-still: no CSS motion at all (&instant, reduced motion); html.fx-off: the layer is off (&nojuice or
     OB.fx.off), and the CSS motion of cfa9c43 comes back (juice.css). */
  if (REDUCED || OB.instant()) html.classList.add("fx-still");
  if (OFF) html.classList.add("fx-off");

  var C = {
    pop: 560,            // ms: a chip, a number or a van pops in
    rise: 700,           // ms: a sentence rises into place
    box: 620,            // ms: a panel swells into place
    land: 460,           // ms: the bump of an element when a flight lands on it
    bump: 420,           // ms: the bump of a score when its roll ends
    head: 640,           // ms: a scene's head comes in
    cap: 240             // particles at most on the screen

  /* ================================================================================================================
     Beats: the scene's head comes in, the stage card lights its marquee and drops its title, the vans of a few
     scenes idle, the pager's coin and the beat's dot pop. cut: what CSS started is stopped. */
  var IDLE = ".s1-vans, .s1-flow, .s1-rflow, .ob-card .road";
  function decorate(sec) {
    if (sec.fxDone) return;
    sec.fxDone = true;
    Array.prototype.slice.call(sec.querySelectorAll(IDLE)).forEach(function (box) { box.classList.add("fx-idle"); });
    Array.prototype.slice.call(sec.querySelectorAll(".fx-idle .ob-van")).forEach(function (v) {
      if (v.querySelector(".fx-puffs")) return;
      var pf = doc.createElement("span");
      pf.className = "fx-puffs";
      pf.setAttribute("aria-hidden", "true");
      for (var i = 0; i < 3; i++) pf.appendChild(doc.createElement("i"));
      v.appendChild(pf);
    });
    var card = sec.querySelector(".ob-card");
    if (card && !card.querySelector(".fx-bulbs")) {
      ["top", "bottom"].forEach(function (side) {
        var b = doc.createElement("div");
        b.className = "fx-bulbs " + side;
        b.setAttribute("aria-hidden", "true");
        for (var i = 0; i < 22; i++) { var s = doc.createElement("i"); s.style.setProperty("--i", String(i)); b.appendChild(s); }
        card.appendChild(b);
      });
    }
  }
  function headIn(sec) {
    var no = sec.querySelector(".scene-head .scene-no"), h2 = sec.querySelector(".scene-head h2");
    if (!h2) return;
    OB.animate(C.head, function (p) {
      var t = lin(p);
      var q = clamp(t / 0.8);
      h2.style.translate = (-34 * (1 - backOut(q, 1.6))).toFixed(2) + "px 0";
      h2.style.opacity = String(clamp(q * 2.4));
      if (no) {
        no.style.scale = mix(0.2, 1, backOut(clamp(t / 0.7), 2.6)).toFixed(4);
        no.style.rotate = (-200 * (1 - out3(clamp(t / 0.75)))).toFixed(1) + "deg";
      }
    }, function () {
      h2.style.translate = ""; h2.style.opacity = "";
      if (no) { no.style.scale = ""; no.style.rotate = ""; }
    });
  }
  function cardIn(sec) {
    var card = sec.querySelector(".ob-card");
    if (!card) return;
    var title = card.querySelector(".title"), kick = card.querySelector(".kicker"), van = card.querySelector(".drive");
    card.classList.remove("fx-in");
    void card.offsetWidth;
    card.classList.add("fx-in");
    OB.animate(1500, function (p) {
      var t = lin(p) * 1.5;   // seconds
      if (title) {
        var q = clamp((t - 0.18) / 0.62);
        var drop = q < 0.62 ? -90 * (1 - io3(q / 0.62)) : 0;
        var sq = q >= 0.62 ? Math.sin((q - 0.62) / 0.38 * Math.PI) * (1 - (q - 0.62) / 0.38 * 0.4) : 0;
        title.style.translate = "0 " + drop.toFixed(2) + "px";
        title.style.scale = (1 + 0.12 * sq).toFixed(4) + " " + (1 - 0.16 * sq).toFixed(4);
        title.style.opacity = String(clamp(q * 3));
      }
      if (kick) {
        var k = clamp(t / 0.6);
        kick.style.letterSpacing = mix(0.9, 0.16, out3(k)).toFixed(3) + "em";
        kick.style.opacity = String(out3(k));
      }
    }, function () {
      if (title) { title.style.translate = ""; title.style.scale = ""; title.style.opacity = ""; }
      if (kick) { kick.style.letterSpacing = ""; kick.style.opacity = ""; }
      card.classList.remove("fx-in");
    });
    if (van) {
      van.classList.add("fx-drive");
      for (var j = 0; j < 6; j++) (function (j) {
        OB.at(120 + j * 210, function () {
          var r = van.getBoundingClientRect();
          if (r.width) BURST.puff({ x: r.left + r.width * 0.06, y: r.top + r.height * 0.72, dir: Math.PI * 1.05 }, 2);
        });
      })(j);
      OB.at(1400, function () { van.classList.remove("fx-drive"); });
    }
  }
  function beat(s, k, api, entering) {
    if (!s || !s.sec) return;
    still();
    if (OFF || OB.fx.off) return;
    decorate(s.sec);
    var go = live() && api.forward && !api.instant;
    html.classList.toggle("fx-live", go);
    if (!go) return;
    if (entering && s.card) cardIn(s.sec);
    else if (entering) headIn(s.sec);
    if (entering) {
      var cur = doc.querySelector(".pager button[aria-current]");
      if (cur) bump(cur, 0.35, 520);
    }
    var dot = doc.querySelector(".beats i.on");
    if (dot) bump(dot, 0.6, 420);
  }
  function cut() {
    html.classList.remove("fx-live");
    Array.prototype.slice.call(doc.querySelectorAll(".fx-in, .fx-drive, .fx-spin")).forEach(function (e) {
      e.classList.remove("fx-in", "fx-drive", "fx-spin");
    });
    /* a die still in the air lands at once (a beat that tosses it again adds the class back) */
    Array.prototype.slice.call(doc.querySelectorAll(".ob-die.tumble")).forEach(function (e) { e.classList.remove("tumble"); });
  }

  /* A die is tossed (art.setDie with roll true, juice.css fx-toss, 1.5 s): dust where it lands, at 66% and 88%. */
  if (OB.art && typeof OB.art.setDie === "function") {
    var setDie0 = OB.art.setDie;
    OB.art.setDie = function (e, n, roll) {
      setDie0(e, n, roll);
      if (!roll || !live()) return;
      [990, 1320].forEach(function (ms, i) {
        OB.at(ms, function () {
          var r = e.getBoundingClientRect();
          if (r.width) BURST.dust({ x: r.left + r.width / 2, y: r.bottom - 2, w: r.width }, i);
        });
      });
    };
  }

  /* tally(froms, values, target, total, fmt, opts): the Compute of a return. A copy of each reward flies from its
     week into the total, one after the other (opts.delay ms, then opts.stagger ms apart, opts.dur ms each), and the
     total counts up by that reward as it lands: the room sees the sum built week by week. Returns false when motion is
     off, and the section then rolls the number as before. The total ends on fmt(total) in every case. */
  function tally(froms, values, target, total, fmt, opts) {
    if (!live() || !target || !froms || !froms.length) return false;
    opts = opts || {};
    var d0 = opts.delay || 0, st = opts.stagger || 80, dur = opts.dur || 640, sum = 0, left = froms.length;
    target.dataset.v = String(total);
    target.textContent = fmt(0);
    function sign(x) {
      var r = Math.round(x * 100) / 100;
      target.classList.toggle("gain", r > 0);
      target.classList.toggle("loss", r < 0);
    }
    sign(0);
    froms.forEach(function (f, i) {
      OB.at(d0 + i * st, function () { bump(f, 0.28, 380); });
      toss(f, target, { delay: d0 + i * st, dur: dur, arc: 46, scale: 0.6, fade: true, land: function (natural) {
        sum += values[i];
        left -= 1;
        var end = left === 0;
        target.textContent = fmt(end ? total : sum);
        sign(end ? total : sum);
        if (!natural) return;
        bump(target, end ? 0.34 : 0.1, end ? C.bump : 260);
        if (end) { var c = centre(target); if (c) (total >= 0 ? BURST.coins : BURST.zap)(c); }
      } });
    });
    return true;
  }

  /* ================================================================================================================
     Calls for the sections. */
  function burst(target, kind) {
    if (!live()) return;
    var c = centre(target);
    if (!c) return;
    (BURST[kind] || BURST.sparkle)(c);
  }
  /* toss(from, to, opts): a copy of from flies to to on the arc of api.fly, without hiding to; opts.dur (ms), opts.delay
     (ms), opts.arc, opts.land (called when it lands, or at once when the beat is cut), opts.scale (end size). */
  function toss(from, to, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      OB.at(opts.delay || 0, function () {
        var a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
        if (!live() || !a.width || !b.width) { if (opts.land) opts.land(false); resolve(); return; }
        var g = from.cloneNode(true);
        g.removeAttribute("id");
        g.classList.remove("ob-hide", "ob-ring");
        g.classList.add("ob-ghost", "fx-fly");
        var cs = window.getComputedStyle(from);
        ["fontSize", "fontFamily", "fontWeight", "color", "letterSpacing", "lineHeight", "whiteSpace"].forEach(function (k) { g.style[k] = cs[k]; });
        g.style.left = a.left + "px"; g.style.top = a.top + "px"; g.style.width = a.width + "px"; g.style.height = a.height + "px";
        g.style.visibility = "visible"; g.style.opacity = "";
        doc.body.appendChild(g);
        var sc = opts.scale || 0.8;
        var path = flight(g, { dx: b.left + b.width / 2 - a.left - a.width * sc / 2, dy: b.top + b.height / 2 - a.top - a.height * sc / 2,
          sx: sc, sy: sc, arc: opts.arc === undefined ? 60 : opts.arc, w: a.width, h: a.height, from: from, to: to, opts: {}, fade: !!opts.fade });
        OB.animate(opts.dur || 800, function (p) { if (path) path(p); }, function () {
          if (g.parentNode) g.parentNode.removeChild(g);
          if (opts.land) opts.land(true);
          resolve();
        });
      });
    });
  }
  function celebrate(target) {
    if (!live()) return;
    var c = centre(target);
    if (!c) return;
    BURST.confetti(c);
    OB.at(260, function () { BURST.confetti({ x: c.x - c.w * 0.35, y: c.y, w: c.w / 3 }, 22); });
    OB.at(420, function () { BURST.confetti({ x: c.x + c.w * 0.35, y: c.y, w: c.w / 3 }, 22); });
  }
  function milestone(target) {
    if (!live()) return;
    var c = centre(target);
    if (c) BURST.milestone(c);
  }

  OB.fx = { off: OFF, config: C, enter: enter, flight: flight, landed: landed, roll: roll, arrow: arrow, beat: beat, cut: cut,
    burst: burst, toss: toss, tally: tally, celebrate: celebrate, milestone: milestone, bump: bump, shake: shake, live: live };
})();
</script>
<script>OB.start({ page: 3, card: { kicker: "OLD BESSIE 3", title: "proto-REINFORCE" } });</script>
