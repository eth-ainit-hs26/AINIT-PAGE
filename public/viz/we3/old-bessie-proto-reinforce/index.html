<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Old Bessie 3: proto-REINFORCE</title>
<style>/* core.css */
/* core.css: the look of "Old Bessie", the engine's stylesheet (agent A2, 2026-11-14). ENGINE.md documents it.

   Since 2026-11-17 the look is Arcade Marquee with the motion layer juice.js and juice.css (Carlos: "Yes, Arcade
   Marquee takes over"), from the design rounds of 2026-11-15 and 2026-11-17 (../../design/arcade-marquee/ and
   ../../design/arcade-marquee-motion/); from 2026-11-16 to 2026-11-17 it was Grand Prix. skin-base.css and skin.css
   load after this file and set the fonts (Rubik, Righteous, Bungee), the colours and the frame. The values below are the retro console look of 2026-11-14 (the arcade's light
   "paper" theme), kept as defaults that the skin overrides. Sizes of words are multiplied by var(--fz) and line
   heights by var(--lh), both set by the skin. Light only: no dark theme and no theme toggle (Carlos, 2026-11-14).

   Larger words on large screens (the rule of weekend 2, w2-cx-private/CLAUDE.md): on a screen of at least 1080 x 740
   px --tx is 1.4. A size of words up to 18 px is written calc(V * var(--tx)); a larger one grows by a share that falls
   to nothing at 44 px: calc(V * (1 + (var(--tx) - 1) * w)) with w = (44 - V) / 26. Boards, tables, sprites, the top
   bar and the Back and Next buttons keep their sizes. */

:root {
  --px: "Rubik", "Helvetica Neue", Arial, sans-serif;
  --bg: #E8E0CC;            /* the NES shell */
  --box: #F8F4E4;           /* dialog boxes */
  --white: #FFFFFF;
  --ink: #181818;
  --ink2: #585858;          /* secondary ink */
  --hi: #404040;            /* the inner line of a dialog box */
  --press: #BBB6A2;         /* the pressed edge of a button */
  --yellow: #F8D028;
  --ring: #E84828;          /* the highlight ring */
  --run: #1666C8;           /* RUN, calm blue */
  --service: #E08A00;       /* SERVICE, amber */
  --replace: #D33A2C;       /* REPLACE, hot red */
  --run-soft: #DCE9FB;
  --service-soft: #FBEED2;
  --replace-soft: #FADBD6;
  --wear0: #2E8B57;         /* HEALTHY */
  --wear1: #C99A33;         /* WORN */
  --wear2: #E07A2A;         /* SHAKY */
  --wear3: #D33A2C;         /* FAILING */
  --wear0-soft: #D5EBDD;
  --wear1-soft: #F3E6C4;
  --wear2-soft: #F8DCC4;
  --wear3-soft: #F6D2CC;
  --gain: #1F7A45;          /* a positive amount of money */
  --loss: #C0302A;          /* a negative amount of money */
  --gut: 16px;
  --tx: 1;
}
@media (min-width: 1080px) and (min-height: 740px) { :root { --tx: 1.4; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--px);
  font-size: calc(calc(12px * var(--tx)) * var(--fz, 1));
  line-height: calc(1.7 * var(--lh, 1));
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button { font-family: var(--px); color: var(--ink); }

/* The frame: top bar, stage, footer. */
.app {
  height: 100vh; height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.topbar {
  display: flex; align-items: center; gap: 12px; min-width: 0;
  padding: 7px var(--gut);
  background: var(--box);
  border-bottom: 4px solid var(--ink);
}
.topbar .brand {
  font-size: calc(11px * var(--fz, 1)); line-height: calc(1.4 * var(--lh, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 0 1 auto; min-width: 0;
}
.pager { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: 0 1 auto; min-width: 0; overflow: hidden; }
.pager button {
  min-width: 26px; height: 26px; padding: 0 4px;
  font-size: calc(9px * var(--fz, 1)); line-height: 1;
  background: var(--box); border: 2px solid var(--ink); border-radius: 0;
  box-shadow: inset -2px -2px 0 0 var(--press);
  cursor: pointer; flex: 0 0 auto;
}
.pager button.card { min-width: 14px; width: 14px; padding: 0; background: var(--ink2); box-shadow: none; }
.pager button.opt { border-style: dashed; }
.pager button[aria-current] { background: var(--yellow); box-shadow: inset 2px 2px 0 0 #B89020; }
.pager .gap { font-size: calc(9px * var(--fz, 1)); color: var(--ink2); flex: 0 0 auto; padding: 0 1px; }
.pager.fold .far { display: none; }
[data-fullscreen] { display: flex; flex: 0 0 auto; }
.fullbtn {
  width: 34px; height: 30px; padding: 0;
  background: var(--box); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 0;
  box-shadow: inset -2px -2px 0 0 var(--press);
  cursor: pointer;
}
.fullbtn:hover { background: var(--yellow); }

.stage { position: relative; overflow: auto; padding: 10px var(--gut) 12px; min-height: 0; }
.scene { display: none; min-height: 100%; flex-direction: column; }
.scene.active { display: flex; }
.scene-head { display: flex; align-items: baseline; gap: 14px; min-width: 0; padding: 2px 0 8px; }
.scene-head .scene-no { font-size: calc(calc(14px * var(--tx)) * var(--fz, 1)); color: var(--ink2); flex: 0 0 auto; }
.scene-head h2 { margin: 0; font-weight: 400; line-height: calc(1.35 * var(--lh, 1)); font-size: calc(calc(18px * var(--tx)) * var(--fz, 1)); min-width: 0; }
.scene-head .opt-tag {
  margin-left: auto; flex: 0 0 auto;
  font-size: calc(calc(9px * var(--tx)) * var(--fz, 1)); line-height: 1; padding: 6px 8px;
  border: 2px dashed var(--ink); background: var(--box);
}
.scene-body { position: relative; flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; }
.scene-inner {
  position: relative; width: 100%; max-width: 1240px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: calc(14px * var(--tx));
}
.scene.card .scene-head { display: none; }

.foot {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
  padding: 8px var(--gut) 10px;
  background: var(--box);
  border-top: 4px solid var(--ink);
}
.navbtn {
  min-width: 132px; padding: 13px 16px 11px;
  font-size: calc(14px * var(--fz, 1)); line-height: 1;
  background: var(--box); border: 4px solid var(--ink); border-radius: 0;
  box-shadow: inset -4px -4px 0 0 var(--press);
  cursor: pointer; touch-action: manipulation;
}
.navbtn.next { background: var(--yellow); box-shadow: inset -4px -4px 0 0 #B89020; }
.navbtn:active:not(:disabled) { box-shadow: inset 4px 4px 0 0 var(--press); }
.navbtn:disabled { opacity: 0.35; cursor: default; }
.navbtn.skip { min-width: 0; font-size: calc(11px * var(--fz, 1)); padding: 11px 12px 9px; border-style: dashed; }
.navbtn.skip[hidden] { display: none; }
.beats { display: flex; justify-content: center; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.beats i { width: 12px; height: 12px; border: 2px solid var(--ink); background: transparent; flex: 0 0 auto; }
.beats i.past { background: var(--ink2); }
.beats i.on { background: var(--yellow); }

/* The stage card at the start of a page (and any scene with card: {...}), in the manner of a console's stage card. */
.ob-card {
  align-self: center; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: calc(18px * var(--tx));
  padding: calc(34px * var(--tx)) calc(56px * var(--tx)) calc(28px * var(--tx));
  min-width: min(100%, 640px); max-width: 100%;
}
.ob-card .kicker { font-size: calc(calc(14px * var(--tx)) * var(--fz, 1)); color: var(--ink2); letter-spacing: 0.08em; }
.ob-card .title { margin: 0; font-weight: 400; line-height: calc(1.3 * var(--lh, 1)); font-size: calc(64px * var(--fz, 1)); }
.ob-card .line { font-size: calc(calc(13px * var(--tx)) * var(--fz, 1)); line-height: calc(1.8 * var(--lh, 1)); max-width: 40ch; color: var(--ink2); }
.ob-card .road { display: flex; align-items: flex-end; justify-content: center; gap: 18px; min-height: 90px; }
.ob-card .press { font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); animation: ob-blink 2s cubic-bezier(.45,.05,.55,.95) infinite; }
.ob-card .drive { animation: ob-drive 1.4s cubic-bezier(.2,.7,.2,1) both; }
@keyframes ob-drive { from { transform: translateX(-240px); } to { transform: none; } }
@keyframes ob-blink { 50% { opacity: 0; } }

/* Dialog boxes and words. */
.ob-box {
  background: var(--box);
  border: 4px solid var(--ink);
  border-radius: 0;
  box-shadow: inset 0 0 0 2px var(--box), inset 0 0 0 4px var(--hi);
  padding: calc(12px * var(--tx)) calc(16px * var(--tx));
}
.ob-box.plain { box-shadow: none; }
.ob-box.white { background: var(--white); box-shadow: inset 0 0 0 2px var(--white), inset 0 0 0 4px var(--hi); }
.ob-say { font-size: calc(calc(15px * var(--tx)) * var(--fz, 1)); line-height: calc(1.75 * var(--lh, 1)); text-align: center; max-width: 52ch; margin: 0; text-wrap: balance; }
.ob-say.left { text-align: left; }
.ob-note { font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: calc(1.8 * var(--lh, 1)); color: var(--ink2); text-align: center; max-width: 60ch; margin: 0; }
.ob-big { font-size: calc(calc(24px * (1 + (var(--tx) - 1) * 0.769)) * var(--fz, 1)); line-height: calc(1.35 * var(--lh, 1)); }
.ob-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(14px * var(--tx)); }
.ob-col { display: flex; flex-direction: column; align-items: center; gap: calc(10px * var(--tx)); }
.ob-hide { visibility: hidden; }
.ob-gone { display: none !important; }
.ob-mark { background: var(--yellow); padding: 0 0.2em; }

/* Buttons inside a scene (Compute, Roll, Done). */
.ob-btn {
  font-size: calc(calc(12px * var(--tx)) * var(--fz, 1)); line-height: 1;
  padding: calc(10px * var(--tx)) calc(14px * var(--tx));
  background: var(--yellow); border: 4px solid var(--ink); border-radius: 0;
  box-shadow: inset -4px -4px 0 0 #B89020;
  cursor: pointer; touch-action: manipulation;
}
.ob-btn.quiet { background: var(--box); box-shadow: inset -4px -4px 0 0 var(--press); }
.ob-btn:active:not(:disabled) { box-shadow: inset 4px 4px 0 0 #B89020; }
.ob-btn:disabled { opacity: 0.35; cursor: default; }

/* Chips: a state (coloured by wear), an action (its lever colour and glyph), an amount of money. */
.ob-chip {
  display: inline-flex; align-items: center; gap: 0.5em; white-space: nowrap;
  font-size: calc(calc(12px * var(--tx)) * var(--fz, 1)); line-height: 1;
  padding: 0.55em 0.7em 0.5em;
  border: 3px solid var(--ink); background: var(--box);
}
.ob-chip svg { flex: 0 0 auto; }
.ob-chip.s0 { background: var(--wear0-soft); } .ob-chip.s0 .dot { background: var(--wear0); }
.ob-chip.s1 { background: var(--wear1-soft); } .ob-chip.s1 .dot { background: var(--wear1); }
.ob-chip.s2 { background: var(--wear2-soft); } .ob-chip.s2 .dot { background: var(--wear2); }
.ob-chip.s3 { background: var(--wear3-soft); } .ob-chip.s3 .dot { background: var(--wear3); }
.ob-chip .dot { width: 0.8em; height: 0.8em; border: 2px solid var(--ink); flex: 0 0 auto; }
.ob-chip.a0 { color: var(--run); background: var(--run-soft); border-color: var(--run); }
.ob-chip.a1 { color: #9A5E00; background: var(--service-soft); border-color: var(--service); }
.ob-chip.a2 { color: var(--replace); background: var(--replace-soft); border-color: var(--replace); }
.ob-money { white-space: nowrap; }
.ob-money.gain { color: var(--gain); }
.ob-money.loss { color: var(--loss); }

/* Pictures from art.js. */
.ob-art { display: inline-block; line-height: 0; flex: 0 0 auto; }
.ob-art svg { display: block; shape-rendering: crispEdges; }
.ob-art svg.smooth { shape-rendering: auto; }
.ob-van { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; }
.ob-van .gauge { display: flex; gap: 3px; padding: 3px 4px; border: 2px solid var(--ink); background: var(--box); line-height: 0; }
.ob-van .gauge i { width: 12px; height: 8px; border: 1px solid var(--ink); opacity: 0.3; }
.ob-van .gauge i.lit { opacity: 1; }
.ob-van .tag { font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: 1.2; white-space: nowrap; }
.ob-van.w0 .tag { color: var(--wear0); } .ob-van.w0 .gauge i.lit { background: var(--wear0); }
.ob-van.w1 .tag { color: #9C7417; }      .ob-van.w1 .gauge i.lit { background: var(--wear1); }
.ob-van.w2 .tag { color: #C25F14; }      .ob-van.w2 .gauge i.lit { background: var(--wear2); }
.ob-van.w3 .tag { color: var(--wear3); } .ob-van.w3 .gauge i.lit { background: var(--wear3); }
.ob-game { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; }
.ob-game .label { font-size: calc(calc(9px * var(--tx)) * var(--fz, 1)); line-height: calc(1.3 * var(--lh, 1)); text-align: center; max-width: 13em; }
.ob-die.tumble { animation: ob-tumble 0.5s linear 3; }
@keyframes ob-tumble { 25% { transform: rotate(90deg) translateY(-6px); } 50% { transform: rotate(180deg); } 75% { transform: rotate(270deg) translateY(-6px); } 100% { transform: rotate(360deg); } }

/* Motion (core.js): ghosts in flight, the highlight ring, arrows, the scene's overlay. */
.ob-ghost { position: fixed; z-index: 40; margin: 0; pointer-events: none; transform-origin: 0 0; }
.ob-ring { outline: 4px solid var(--ring); outline-offset: 4px; animation: ob-ring 0.6s cubic-bezier(.2,.7,.2,1) both; }
@keyframes ob-ring { from { outline-color: transparent; outline-offset: 14px; } }
.ob-overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 5; }
.ob-overlay svg { position: absolute; left: 0; top: 0; overflow: visible; }
.ob-arrow line, .ob-arrow polyline { stroke: var(--ink); stroke-width: 4; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
.ob-arrow polygon { fill: var(--ink); }
.ob-arrow-label {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: 1; padding: 5px 6px 4px;
  background: var(--box); border: 2px solid var(--ink);
}
.scene-error { border: 3px dashed var(--loss); color: var(--loss); padding: 8px 12px; font-size: calc(11px * var(--fz, 1)); }

/* The placeholder of a page whose scenes are not built yet. */
.ob-todo { text-align: center; }

/* Phones and small windows. */
@media (max-height: 700px) and (min-width: 561px) {
  .navbtn { padding: 10px 14px 8px; }
  .stage { padding-top: 6px; }
}
@media (max-width: 560px) {
  :root { --gut: 10px; }
  .topbar { gap: 8px; padding-top: 6px; padding-bottom: 6px; }
  .topbar .brand { font-size: calc(9px * var(--fz, 1)); }
  .pager button { min-width: 22px; height: 22px; font-size: calc(8px * var(--fz, 1)); }
  .foot { grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; }
  .foot .skip { grid-column: 1 / -1; grid-row: 1; justify-self: center; }
  .navbtn { min-width: 96px; font-size: calc(11px * var(--fz, 1)); padding: 11px 10px 9px; }
  .ob-say { font-size: calc(12px * var(--fz, 1)); }
  .ob-note { font-size: calc(10px * var(--fz, 1)); }
  .ob-card .title { font-size: calc(32px * var(--fz, 1)); }
  .ob-card { min-width: 0; }
  .ob-chip { font-size: calc(10px * var(--fz, 1)); }
}
@media (prefers-reduced-motion: reduce) {
  .ob-card .drive, .ob-card .press, .ob-ring, .ob-die.tumble { animation: none; }
}

/* Back and Next carry pixel triangles. */
.navbtn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
#prev::before, #next::after { content: ""; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
#prev::before { border-right: 9px solid currentColor; }
#next::after { border-left: 9px solid currentColor; }

/* Notation: subscripts (S1, a1, $r1, G1), powers (gamma squared), the bar of an average (G1 with a bar), the pixel
   Greek letters of art.js (OB.art.sym). */
sub, sup { font-size: 0.62em; line-height: 0; position: relative; vertical-align: baseline; }
sub { bottom: -0.3em; }
sup { top: -0.55em; }
.ob-bar { display: inline-block; border-top: 0.14em solid currentColor; padding-top: 0.12em; line-height: 1.1; }
.ob-sym { display: inline-block; vertical-align: -0.02em; shape-rendering: crispEdges; }
.ob-symbox { display: inline-block; line-height: 1; }
</style>
<style>/* runs.css */
/* runs.css: the episode symbol (agent A3, 2026-11-14), OB.runs in runs.js. Classes start with runs-. */

.runs-block { --rc: calc(18px + 8px * var(--tx)); display: inline-flex; flex-direction: column; gap: 3px; }
.runs-row { display: flex; align-items: center; gap: calc(6px * var(--tx)); }
.runs-no { width: 2.4em; text-align: right; font-size: calc(calc(9px * var(--tx)) * var(--fz, 1)); line-height: 1; color: var(--ink2); flex: 0 0 auto; }
.runs-cells { display: inline-flex; border: 2px solid var(--ink); background: var(--ink); gap: 2px; flex: 0 0 auto; }
.runs-head .runs-cells { border-color: transparent; background: transparent; }
.runs-wk { width: var(--rc); text-align: center; font-size: calc(calc(7px * var(--tx)) * var(--fz, 1)); line-height: 1; color: var(--ink2); }
.runs-cell {
  position: relative; width: var(--rc); height: var(--rc);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink); line-height: 0;
}
.runs-cell svg { width: 58%; height: 58%; }
.runs-cell.w0, .runs-swatch.w0 { background: var(--wear0); }
.runs-cell.w1, .runs-swatch.w1 { background: var(--wear1); }
.runs-cell.w2, .runs-swatch.w2 { background: var(--wear2); }
.runs-cell.w3, .runs-swatch.w3 { background: var(--wear3); }
.runs-bolt { position: absolute; right: 1px; top: 1px; line-height: 0; }
.runs-bolt svg { width: calc(var(--rc) * 0.36); height: auto; display: block; }
.runs-cell.bd svg:first-child { transform: translate(-12%, 10%); }
.runs-g1 { min-width: 6.2em; text-align: right; font-size: calc(calc(10px * var(--tx)) * var(--fz, 1)); line-height: 1; white-space: nowrap; flex: 0 0 auto; }
.runs-g1h { color: var(--ink); }

/* Compact: one thin line per episode. */
.runs-block.compact { flex-direction: row; align-items: stretch; gap: 8px; }
.runs-canvas, .runs-g1col { display: block; image-rendering: pixelated; border: 2px solid var(--ink); background: var(--box); box-sizing: content-box; }
.runs-canvas.blend, .runs-g1col.blend { image-rendering: auto; }

/* The legend of the symbol. */
.runs-legend { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 18px; font-size: calc(calc(9px * var(--tx)) * var(--fz, 1)); line-height: 1.2; color: var(--ink2); }
.runs-key { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.runs-swatch { width: 14px; height: 14px; border: 2px solid var(--ink); flex: 0 0 auto; }
.runs-gl { line-height: 0; color: var(--ink); }
.runs-gl svg { display: block; }

@media (max-width: 560px) {
  .runs-block { --rc: 18px; }
  .runs-row { gap: 4px; }
  .runs-cells { gap: 1px; border-width: 1px; }
  .runs-g1 { min-width: 5.4em; font-size: calc(9px * var(--fz, 1)); }
  .runs-no { width: 2.2em; font-size: calc(8px * var(--fz, 1)); }
  .runs-legend { gap: 6px 10px; font-size: calc(8px * var(--fz, 1)); }
}
</style>
<style>/* runs_tip.css */
/* runs_tip.css: the card of one week of an episode (runs_tip.js, main session, 2026-11-17). Classes start with rt-. */

.rt-on .runs-cell { cursor: pointer; }
.runs-cell.rt-cur { outline: 3px solid var(--ink); outline-offset: 1px; z-index: 2; box-shadow: 0 0 0 5px var(--yellow); }

.rt-card {
  position: fixed; z-index: 80; left: 0; top: 0; pointer-events: none;
  padding: 12px 22px 14px; min-width: 300px;
  opacity: 0; visibility: hidden; transform: translateY(6px);
  transition: opacity 0.16s ease, transform 0.16s ease, visibility 0s linear 0.16s;
}
.rt-card.below { transform: translateY(-6px); }
.rt-card.on { opacity: 1; visibility: visible; transform: none; transition: opacity 0.16s ease, transform 0.16s ease; }
/* The caret: under the card, or above it when the card is below the cell. */
.rt-card::after {
  content: ""; position: absolute; left: var(--rt-cx, 50%); top: 100%; margin-left: -9px;
  border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 10px solid #FFFFFF;
}
.rt-card.below::after { top: auto; bottom: 100%; border-top: 0; border-bottom: 10px solid #FFFFFF; }

.rt-head {
  font-family: var(--disp); font-style: italic; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--ink2); font-size: calc(calc(10px * var(--tx)) * var(--fz, 1)); line-height: 1.2; text-align: center;
}
.rt-flow { display: flex; align-items: flex-end; justify-content: center; gap: 4px 12px; margin-top: 8px; }
.rt-st { display: flex; flex-direction: column; align-items: center; gap: 4px; }

<style>/* sec3c-runs.css */

.s3d-uform .s3d-us { font-size: calc(calc(32px * (1 + (var(--tx) - 1) * 0.154)) * var(--fz, 1)); }
.s3d-uform .s3d-ut:empty { min-height: 0; }
.s3d-uform .s3d-upf { gap: calc(10px * var(--tx)); }
.s3d-ual { white-space: nowrap; }
.s3d-usigns { grid-area: signs; flex-direction: column; flex-wrap: nowrap; gap: calc(8px * var(--tx)); }
.s3d-usigns .s3d-sign { padding: 6px 12px 7px; gap: 3px; }
.s3d-usigns .s3d-sf { font-size: calc(calc(15px * var(--tx)) * var(--fz, 1)); }
.s3d-uwork { grid-area: work; justify-self: stretch; padding: 12px 16px 10px; gap: 8px;
  font-size: calc(calc(17px * (1 + (var(--tx) - 1) * 0.923)) * var(--fz, 1)); }
.s3d-uwhys { grid-area: whys; grid-template-columns: repeat(4, minmax(0, 176px)); gap: calc(10px * var(--tx)); }
.s3d-uwhys .s3d-why { padding: 6px 8px 8px; gap: 3px; }

<style>/* sec3e.css */
/* sec3e.css: page 3, scene 430 "What we learned" (sec3e.js, main session, 2026-11-17). Classes start with s3e-.
   Words scale with --tx (core.css) and the skin's --fz; the pictures are SVG boards in plain px on a desk. */

.s3e-lead { min-height: calc(2 * 1.75em); display: flex; align-items: center; justify-content: center; text-align: center; max-width: 46em; margin: 0 auto; }
.s3e-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 360px)); justify-content: center;
  gap: calc(12px * var(--tx)) calc(16px * var(--tx)); margin-top: calc(8px * var(--tx));
}
.s3e-card { display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 14px 12px; min-width: 0; }
.s3e-card.s3e-on { outline: 3px solid var(--red); outline-offset: 4px; }
.s3e-head { display: flex; align-items: center; gap: 12px; }
.s3e-no {
  display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 24px; padding: 0 6px;
  transform: skewX(-14deg); background: var(--red); color: #FFFFFF; font-family: var(--disp); font-style: italic; font-weight: 800;
  font-size: 17px; line-height: 1; flex: 0 0 auto;
}
.s3e-human .s3e-no { background: var(--wear0); }
.s3e-name {
  font-family: var(--disp); font-style: italic; font-weight: 800; letter-spacing: 0.05em; color: var(--ink); white-space: nowrap;
  font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: 1;
}
.s3e-human .s3e-name { color: var(--wear0); }
.s3e-pic { height: 122px; display: flex; align-items: center; justify-content: center; min-width: 0; }
.s3e-cap {
  font-family: var(--disp); font-weight: 700; letter-spacing: 0.05em; color: var(--ink2); text-align: center;
  font-size: calc(calc(9px * var(--tx)) * var(--fz, 1)); line-height: 1.3;
}

/* The SVG boards: words in the units of the viewBox. */
.s3e-svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.s3e-svg text { font-family: var(--disp); font-weight: 700; letter-spacing: 0.05em; fill: var(--ink2); }
.s3e-svg .s3e-lab { font-size: calc(8.5px * var(--fz, 1)); }
.s3e-svg .s3e-num { font-family: var(--px); font-weight: 700; letter-spacing: 0; fill: var(--ink); font-size: calc(11px * var(--fz, 1)); }
.s3e-svg .s3e-gain { fill: var(--gain); }
.s3e-svg .s3e-tex { font-family: KaTeX_Main, "Times New Roman", serif; font-weight: 400; letter-spacing: normal; fill: var(--ink); }
.s3e-svg .s3e-tmath { font-family: KaTeX_Math, "Times New Roman", serif; font-style: italic; }
.s3e-ax { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: square; }
.s3e-cell { fill: #FFFFFF; stroke: var(--line); stroke-width: 1.5; }
.s3e-am.a0, .s3e-bar.a0, .s3e-slot.a0 { fill: var(--run); }
.s3e-am.a1, .s3e-bar.a1, .s3e-slot.a1 { fill: var(--service); }
.s3e-am.a2, .s3e-bar.a2, .s3e-slot.a2 { fill: var(--replace); }
.s3e-sm.w0 { fill: var(--wear0); } .s3e-sm.w1 { fill: var(--wear1); } .s3e-sm.w2 { fill: var(--wear2); } .s3e-sm.w3 { fill: var(--wear3); }
.s3e-slot { stroke: #FFFFFF; stroke-width: 1.5; }
.s3e-hub { fill: #FFFFFF; stroke: #D3D8DF; stroke-width: 2; }
.s3e-arl { stroke: var(--ink); stroke-width: 2.5; }
.s3e-arh { fill: var(--ink); }
.s3e-tf { fill: var(--yellow); fill-opacity: 0.6; }
.s3e-leg { stroke: var(--ink); stroke-width: 4; stroke-linecap: square; }
.s3e-leg.s3e-up { stroke: var(--gain); }
.s3e-hyp { stroke: var(--ink); stroke-width: 2.5; }
.s3e-pt { fill: var(--ink); stroke: var(--ink); stroke-width: 2; }
.s3e-pt.s3e-old { fill: #FFFFFF; }
.s3e-lit { fill: var(--yellow); stroke: var(--red); stroke-width: 2.5; }
.s3e-best { stroke: var(--ink2); stroke-width: 2; stroke-dasharray: 5 4; }
.s3e-curve { fill: none; stroke: var(--red); stroke-width: 2.5; stroke-linejoin: round; }

/* The pictures made of elements: the helmet and a policy, the episodes and their average, the update. */
.s3e-hum, .s3e-fwd, .s3e-upd, .s3e-rep { display: flex; align-items: center; justify-content: center; gap: 12px; min-width: 0; }
.s3e-face { line-height: 0; }
.s3e-face svg { display: block; }
.s3e-into { position: relative; display: block; width: 28px; height: 3px; background: var(--ink); margin-right: 9px; flex: 0 0 auto; }
.s3e-into::after {
  content: ""; position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
  border-left: 11px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
}
.s3e-pol { display: flex; flex-direction: column; gap: 4px; }
.s3e-prow { display: flex; align-items: center; gap: 6px; }
.s3e-prow .ob-van { line-height: 0; }
.s3e-prow .ob-chip { font-size: calc(8.5px * var(--fz, 1)); }
.s3e-runs { --rc: 13px; gap: 2px; }
.s3e-runs .runs-row { gap: 6px; }
.s3e-runs .runs-g1 { min-width: 3.4em; font-size: calc(8px * var(--fz, 1)); }
.s3e-brace { align-self: stretch; width: 7px; border: 2.5px solid var(--ink); border-left: 0; margin: 2px 0; flex: 0 0 auto; }
.s3e-avg { font-size: calc(17px * var(--fz, 1)); }
.s3e-add { font-size: calc(17px * var(--fz, 1)); white-space: nowrap; }
.s3e-rep .s3e-svg { flex: 0 1 190px; }

@media (max-width: 999px) {
  .s3e-grid { grid-template-columns: repeat(2, minmax(0, 360px)); }
}
@media (max-width: 560px) {
  .s3e-lead { min-height: calc(3 * 1.75em); }
  .s3e-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .s3e-card { padding: 8px 10px 10px; }
  .s3e-name { font-size: calc(13px * var(--fz, 1)); }
  .s3e-cap { font-size: calc(10px * var(--fz, 1)); }
  .s3e-pic { height: auto; min-height: 100px; }
}
</style>

:root {
  --px: "Rubik", "Helvetica Neue", Arial, sans-serif;
  --disp: "Righteous", "Rubik", sans-serif;
  --sign: "Bungee", "Rubik", sans-serif;
  --fz: 1.24; --lh: 0.8;
  --bg: #FFF4DF; --box: #FFFFFF; --white: #FFFFFF; --ink: #1E1442; --ink2: #5A5378; --hi: #1E1442; --press: #D9CFF0;
  --yellow: #FFC736; --orange: #FF8A2A; --pink: #F2386F; --violet: #7A3FE0; --cyan: #19B6E8; --ring: #F2386F;
  --run: #2F6BFF; --service: #FF9E1B; --replace: #F2386F;
  --run-soft: #E1E9FF; --service-soft: #FFEFD6; --replace-soft: #FFE0EA;
  --wear0: #22B573; --wear1: #FFC233; --wear2: #FF8A2A; --wear3: #F2445A;
  --wear0-soft: #D3F3E3; --wear1-soft: #FFF0C7; --wear2-soft: #FFE2CA; --wear3-soft: #FFD7DD;
  --gain: #0F9A5A; --loss: #E0264F;
  --sunset: linear-gradient(180deg, var(--yellow) 0 25%, var(--orange) 25% 50%, var(--pink) 50% 75%, var(--violet) 75%);
}
body { font-family: var(--px); font-weight: 500; background: var(--bg); color: var(--ink); }
button { font-family: var(--px); color: var(--ink); }

/* The frame: a cabinet's marquee strip on top, the control panel below. */
.topbar { background: var(--bg); border-bottom: 0; position: relative; padding: 10px var(--gut) 14px; }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
  background: linear-gradient(180deg, var(--yellow) 0 2px, transparent 2px 3px, var(--orange) 3px 5px, transparent 5px 6px, var(--pink) 6px 8px); }
.topbar .brand { font-family: var(--disp); font-size: 15px; letter-spacing: 0.02em; color: var(--ink); }
.pager { gap: 6px; padding: 2px; }
.pager button { min-width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2.5px solid var(--ink); background: #FFFFFF;
  box-shadow: 0 2.5px 0 0 var(--ink); font-family: var(--sign); font-size: 11px; color: var(--ink); }
.pager button.card { min-width: 12px; width: 12px; height: 12px; border-radius: 2px; transform: rotate(45deg); background: var(--ink); box-shadow: none; border-width: 0; margin: 0 3px; }
.pager button.opt { border-style: dashed; box-shadow: none; }
.pager button[aria-current] { background: var(--yellow); box-shadow: 0 2.5px 0 0 var(--ink); }
.pager button.card[aria-current] { background: var(--pink); }
.fullbtn { border: 2.5px solid var(--ink); border-radius: 8px; background: #FFFFFF; box-shadow: 0 2.5px 0 0 var(--ink); color: var(--ink); }
.fullbtn:hover { background: var(--yellow); }

.stage { padding-top: 16px; background: radial-gradient(circle at 50% 120%, rgba(255, 199, 54, 0.16), transparent 55%), var(--bg); }
.scene-head { align-items: center; gap: 14px; padding: 0 0 12px; }
.scene-head .scene-no { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%;
  background: var(--yellow); border: 3px solid var(--ink); box-shadow: 0 3px 0 0 var(--ink); font-family: var(--sign); font-size: 18px; color: var(--ink); line-height: 1; }
.scene-head h2 { font-family: var(--disp); font-size: calc(24px * var(--tx)); line-height: 1.1; letter-spacing: 0.01em; color: var(--ink); }
.scene-head .opt-tag { font-family: var(--sign); font-size: 12px; letter-spacing: 0.08em; border: 2.5px dashed var(--ink); border-radius: 999px; background: #FFFFFF; padding: 7px 12px; }

.foot { background: var(--bg); border-top: 0; position: relative; padding: 14px var(--gut) 12px; }
.foot::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px;
  background: linear-gradient(180deg, var(--pink) 0 2px, transparent 2px 3px, var(--orange) 3px 5px, transparent 5px 6px, var(--yellow) 6px 8px); }
.navbtn { border: 3px solid var(--ink); border-radius: 999px; background: #FFFFFF; box-shadow: 0 5px 0 0 var(--ink);
  font-family: var(--sign); font-size: 18px; letter-spacing: 0.04em; padding: 13px 26px 11px; min-width: 150px; color: var(--ink); }
.navbtn.next { background: var(--pink); color: #FFFFFF; box-shadow: 0 5px 0 0 var(--ink); }
.navbtn:active:not(:disabled) { box-shadow: 0 1px 0 0 var(--ink); transform: translateY(4px); }
.navbtn.skip { border-style: dashed; font-size: 13px; box-shadow: none; }
.beats { gap: 7px; }
.beats i { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--ink); background: #FFFFFF; }
.beats i.past { background: var(--ink); }
.beats i.on { background: var(--yellow); }

/* Panels: stickers on the cabinet. */
.ob-box { background: #FFFFFF; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 0 var(--ink); }
.ob-box.plain { box-shadow: 4px 4px 0 0 var(--ink); }
.ob-box.white { background: #FFFFFF; box-shadow: 5px 5px 0 0 var(--ink); }
.ob-say { font-weight: 500; line-height: 1.3; }
.ob-note { color: var(--ink2); line-height: 1.35; }
.ob-big { font-family: var(--disp); }
.ob-mark { background: var(--yellow); padding: 0 0.2em; border-radius: 4px; }
.ob-btn { border: 3px solid var(--ink); border-radius: 999px; background: var(--yellow); box-shadow: 0 4px 0 0 var(--ink); font-family: var(--sign); letter-spacing: 0.03em; color: var(--ink); }
.ob-btn.quiet { background: #FFFFFF; box-shadow: 0 4px 0 0 var(--ink); }
.ob-btn:active:not(:disabled) { box-shadow: 0 1px 0 0 var(--ink); transform: translateY(3px); }

.ob-chip { border: 2.5px solid var(--ink); border-radius: 999px; background: #FFFFFF; font-weight: 700; letter-spacing: 0.02em; padding: 0.42em 0.8em 0.38em; }
.ob-chip .dot { border: 2px solid var(--ink); border-radius: 50%; }
.ob-chip.a0 { background: var(--run); color: #FFFFFF; border-color: var(--ink); }
.ob-chip.a1 { background: var(--service); color: var(--ink); border-color: var(--ink); }
.ob-chip.a2 { background: var(--replace); color: #FFFFFF; border-color: var(--ink); }
.ob-van .gauge { border: 2.5px solid var(--ink); border-radius: 999px; background: #FFFFFF; padding: 3px 6px; gap: 3px; }
.ob-van .gauge i { width: 10px; height: 10px; border-radius: 50%; border: 0; background: #E4DDF2; opacity: 1; }
.ob-van .tag { font-family: var(--sign); letter-spacing: 0.04em; }
.ob-van.w0 .tag { color: #108A50; } .ob-van.w1 .tag { color: #9A6A00; } .ob-van.w2 .tag { color: #C2560A; } .ob-van.w3 .tag { color: #D12A45; }
.ob-game .label { font-family: var(--sign); font-size: 12px; letter-spacing: 0.03em; }
.ob-ring { outline: 4px solid var(--pink); outline-offset: 5px; border-radius: 6px; }
.ob-arrow line, .ob-arrow polyline { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.ob-arrow polygon { fill: var(--ink); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.ob-arrow-label { border: 2.5px solid var(--ink); border-radius: 999px; background: var(--yellow); font-weight: 700; padding: 5px 9px 4px; }

/* The stage card: the lit marquee. */
.ob-card { position: relative; overflow: hidden; border-radius: 22px; min-width: min(100%, 760px); padding-top: calc(28px * var(--tx));
  padding-left: 0; padding-right: 0; }
.ob-card > * { position: relative; margin-left: calc(56px * var(--tx)); margin-right: calc(56px * var(--tx)); }
.ob-card .kicker { font-family: var(--sign); font-size: 20px; letter-spacing: 0.16em; color: var(--pink); }
.ob-card .title { align-self: stretch; margin: 0; font-family: var(--disp); font-size: 100px; line-height: 1.02; color: #FFFFFF;
  padding: 0.04em calc(48px * var(--tx)) 0.1em; overflow-wrap: normal;
  /* the sunset stripes run behind the last line of the title, from edge to edge of the card */
  background: linear-gradient(180deg, var(--yellow) 0 22%, transparent 22% 26%, var(--orange) 26% 48%, transparent 48% 52%, var(--pink) 52% 74%, transparent 74% 78%, var(--violet) 78%) 50% calc(100% - 0.3em) / 100% 0.62em no-repeat;
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--ink), 9px 9px 0 var(--pink); }
.ob-card .line { color: var(--ink2); line-height: 1.35; max-width: 36ch; }
.ob-card .road { min-height: 96px; }
.ob-card .press { font-family: var(--sign); font-size: 15px; letter-spacing: 0.24em; color: var(--pink); }

/* Page 1. */
.s1-games .ob-art.ob-box { padding: 4px; border-radius: 50%; }
.s1-item { font-weight: 600; }
.s1-item::before { border: 3px solid var(--ink); width: 0.9em; height: 0.9em; border-radius: 50%; background: var(--yellow); }
.s1-def .word { font-family: var(--disp); color: var(--ink); }
.s1-act.a0 { background: var(--run-soft); } .s1-act.a1 { background: var(--service-soft); } .s1-act.a2 { background: var(--replace-soft); }
.s1-act.a0, .s1-act.a1, .s1-act.a2 { border-color: var(--ink); }
.s1-act .name { font-family: var(--disp); }
.s1-act.a0 .name, .s1-act.a0 .big-glyph { color: #2456D6; } .s1-act.a1 .name, .s1-act.a1 .big-glyph { color: #A35F00; } .s1-act.a2 .name, .s1-act.a2 .big-glyph { color: #D1245A; }
.s1-cap, .s2-name, .s2-wk, .s2-strat-h, .s2-runlab, .s3a-cap, .s3a-tlab, .s3b-pcap, .s3b-bacap, .s3b-ccap, .s3c-cap, .s3d-ccap, .s3d-ut,
.s3d-sk, .s3d-we, .tb-cap, .tb-zcap, .tb-sh, .tb-eh, .s2-tdname, .s3c-tt { font-weight: 700; letter-spacing: 0.06em; }
.s1-td .name { font-family: var(--disp); }
.s1-reward { font-weight: 700; border-radius: 10px; }
.s1-roll { border: 2.5px dashed var(--ink2); border-radius: 14px; }
.s1-out1 .count b { font-weight: 700; }

/* Runs: lit panels of a scoreboard. */
.runs-cells { border: 2.5px solid var(--ink); background: var(--ink); gap: 2px; border-radius: 6px; overflow: hidden; }
.runs-cell { color: rgba(30, 20, 66, 0.8); }
.runs-canvas, .runs-g1col { border: 2.5px solid var(--ink); border-radius: 6px; }
.runs-g1 { font-weight: 700; }
.runs-swatch { border-radius: 50%; border-width: 2px; }
.runs-legend { font-weight: 600; }

/* Page 2. */
.s2-num { font-weight: 700; border-width: 2.5px; }
.s2-sym { font-weight: 600; }
.s2-gcells { border: 2.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
.s2-dl { background: #FFFFFF; border: 2.5px solid var(--ink); border-radius: 8px; }
.s2-dot { background: rgba(30, 20, 66, 0.55); border-radius: 50%; }
.s2-avg { background: var(--yellow); border: 2.5px solid var(--ink); border-radius: 999px; }
.s2-avgl { font-weight: 700; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--yellow); padding: 4px 7px 3px; }
.s2-glab.s2-win .s2-gname { background: var(--yellow); border-radius: 6px; }
.s2-gname { font-weight: 700; }
.s2-formula { font-weight: 700; }
.s2-loop { border-color: var(--pink); }

/* Tables: a high-score table, navy rules. */
.tb-c, .tb-e { background: #FFFFFF; border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); }
.tb-c.fc, .tb-e, .tb-sum { border-left: 2.5px solid var(--ink); }
.tb-c.fr, .tb-e.fr { border-top: 2.5px solid var(--ink); }
.tb-sum { background: #FFF8EA; }
.tb-n { font-weight: 700; }
.tb-ah { font-family: var(--sign); }
.tb-ah.a0 { color: #2456D6; } .tb-ah.a1 { color: #A35F00; } .tb-ah.a2 { color: #D1245A; }
.tb-bar { border: 2px solid var(--ink); border-radius: 999px; background: #FFFFFF; }
.tb-c.lit { background: var(--yellow); }
.tb-zn { font-family: var(--sign); }

/* Page 3. */
.s3a-arr { background: var(--ink); height: 5px; border-radius: 3px; }
.s3a-ph { border: 3px dashed var(--ink2); border-radius: 14px; font-family: var(--sign); }
.s3a-pad { border: 3px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 0 var(--ink); }
.s3a-key { border: 2.5px solid var(--ink); border-radius: 999px; font-weight: 700; }
.s3a-key.a0 { background: var(--run); color: #FFFFFF; } .s3a-key.a1 { background: var(--service); color: var(--ink); border-color: var(--ink); } .s3a-key.a2 { background: var(--replace); color: #FFFFFF; }
.s3a-mc { border: 2px solid var(--ink); border-radius: 4px; }
.s3a-mc.a0 { background: var(--run); color: #FFFFFF; } .s3a-mc.a1 { background: var(--service); color: var(--ink); border-color: var(--ink); } .s3a-mc.a2 { background: var(--replace); color: #FFFFFF; }
.s3a-try.best .s3a-tav { background: var(--yellow); border-radius: 6px; }
.s3a-av { font-family: var(--sign); }
.s3b-tag { border: 2.5px dashed var(--ink); border-radius: 10px; background: #FFFFFF; font-weight: 600; }
.s3b-ruler { border: 3px solid var(--ink); border-radius: 10px; overflow: visible; }
.s3b-seg + .s3b-seg { border-left: 3px solid var(--ink); }
.s3b-seg.a1 { color: var(--ink); }
.s3b-seg:first-child { border-radius: 7px 0 0 7px; } .s3b-seg:last-child { border-radius: 0 7px 7px 0; }
.s3b-slot { border: 2.5px dashed var(--ink2); border-radius: 12px; }
.s3b-got.a0 { color: #2456D6; } .s3b-got.a1 { color: #A35F00; } .s3b-got.a2 { color: #D1245A; }
.s3b-lit, .s3c-lit, .s3d-lit, .s3d-new { outline: 4px solid var(--pink); outline-offset: 4px; }
.s3b-cn b { font-family: var(--sign); }
.s3c-brace polyline { stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.s3c-g1c { border: 2.5px solid var(--ink); border-radius: 6px; background: #FFFFFF; }
.s3c-gname, .s3d-gname { border: 2.5px solid var(--ink); border-radius: 999px; background: var(--yellow); font-weight: 700; }
.s3c-dia .tb-zn, .s3d-ba .tb-zn { font-family: var(--sign); }
.s3c-loop polyline { stroke: var(--pink); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.s3c-loop polygon { fill: var(--pink); }
.s3c-new, .s3d-sg { background: var(--yellow); border-radius: 4px; }
.s3c-curve { stroke: var(--pink); stroke-width: 3.5; }
.s3c-dot { fill: var(--yellow); stroke: var(--ink); stroke-width: 3; }
.s3d-mtop { border: 2.5px solid var(--ink); border-radius: 999px; background: var(--yellow); font-weight: 700; }
.s3d-ptf { fill: var(--yellow); fill-opacity: 0.85; }
.s3d-phyp { stroke-width: 3; }
.s3d-pleg { stroke-width: 5; stroke-linecap: round; }
.s3d-ptit, .s3d-ptag { font-weight: 700; letter-spacing: 0.05em; }

@media (max-width: 560px) {
  .topbar .brand { font-size: 11px; }

  .navbtn { min-width: 100px; font-size: 14px; padding: 11px 14px 9px; }
  .scene-head h2 { font-size: 19px; }
  .scene-head .scene-no { width: 34px; height: 34px; font-size: 14px; }
  .ob-card .title { font-size: 46px; padding-left: 14px; padding-right: 14px; -webkit-text-stroke-width: 2px; text-shadow: 3px 3px 0 var(--ink), 5px 5px 0 var(--pink); }
  .ob-card > * { margin-left: 18px; margin-right: 18px; }
  .ob-card .kicker { font-size: 14px; }
}

/* Short desk screens (1366 x 768 and the like, words at 1.4): the same frame, tighter, so that no scene scrolls. */
@media (min-width: 1080px) and (max-height: 800px) {
  .topbar { padding-top: 6px; padding-bottom: 13px; }
  .stage { padding-top: 6px; padding-bottom: 6px; }
  .scene-head { padding-bottom: 4px; }
  .scene-head .scene-no { width: 34px; height: 34px; font-size: 15px; }
  .scene-head h2 { font-size: calc(21px * var(--tx)); }

/* ====================================================================================================================
   Port of 2026-11-17 (design/arcade-marquee-motion): the parts of the pages built after the round of 2026-11-15, whose
   stylesheets were written for Grand Prix (sec3a2.css, sec3b-policy.css, sec3d.css, sec3e.css, runs_tip.css), and
   the refinement of dense frames that NOTES.md of the round asked for (light rules inside tables).
   ==================================================================================================================== */
:root { --red: #F2386F; --line: #DCD5EC; --cut: 0px; }

/* Tables: a high-score table. A navy edge round the cells, light rules between them. */
.tb-c, .tb-e { border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); }
.tb-c.fc, .tb-e, .tb-sum { border-left: 3px solid var(--ink); }
.tb-c.fr, .tb-e.fr { border-top: 3px solid var(--ink); }
.tb-c.a2, .tb-sum, .tb-e { border-right: 3px solid var(--ink); }
.tb-c.s3, .tb-e.s3 { border-bottom: 3px solid var(--ink); }
.tb-bar { border-width: 2px; }
.tb .ob-ring { outline-offset: -2px; }
.tb-zoom { border-radius: 14px; }
.s3d-tab .s3d-trh, .s3d-tab .s3d-td { border-top-color: var(--line); }

/* Scene 190, Human learning (sec3a2). */
.s3h-title { font-family: var(--disp); font-style: normal; font-weight: 400; letter-spacing: 0.04em; }
.s3h-human .s3h-title { color: #108A50; }
.s3h-name { font-family: var(--px); font-weight: 700; }
.s3h-arr, .s3h-into { border-radius: 3px; }
.s3h-next { border-radius: 3px; }

/* The card of a week (runs_tip). */
.rt-head { font-family: var(--sign); font-style: normal; font-weight: 400; letter-spacing: 0.08em; }
.rt-bd { font-family: var(--sign); font-weight: 400; }
.rt-card::before { content: ""; position: absolute; left: var(--rt-cx, 50%); top: calc(100% + 3px); margin-left: -12px;
  border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 13px solid var(--ink); }
.rt-card.below::before { top: auto; bottom: calc(100% + 3px); border-top: 0; border-bottom: 13px solid var(--ink); }
.runs-cell.rt-cur { outline: 3px solid var(--ink); box-shadow: 0 0 0 6px var(--yellow); }

/* Scene 260, the roulette (sec3b-policy). */
.s3p-ann .s3p-name { font-family: var(--disp); font-style: normal; font-weight: 400; letter-spacing: 0.02em; }
.s3p-table .tb-rf.s3p-hl { outline: 4px solid var(--pink); }

/* Scene 430, What we learned (sec3e): coins for the numbers, Righteous for the names. */
.s3e-card.s3e-on { outline: 4px solid var(--pink); outline-offset: 5px; }
.s3e-no { transform: none; min-width: 30px; width: 30px; height: 30px; padding: 0; border-radius: 50%; background: var(--yellow); color: var(--ink);
  border: 2.5px solid var(--ink); box-shadow: 0 2.5px 0 0 var(--ink); font-family: var(--sign); font-style: normal; font-weight: 400; font-size: 14px; }
.s3e-human .s3e-no { background: var(--wear0); color: #FFFFFF; }
.s3e-name { font-family: var(--disp); font-style: normal; font-weight: 400; letter-spacing: 0.03em; }
.s3e-human .s3e-name { color: #108A50; }
.s3e-cap { font-family: var(--px); font-weight: 700; }
.s3e-svg text { font-family: var(--px); font-weight: 700; letter-spacing: 0.03em; }
.s3e-hub { stroke: var(--ink); stroke-width: 2.5; }
.s3e-cell { stroke: var(--line); }
.s3e-ax, .s3e-leg { stroke-linecap: round; }
.s3e-into { border-radius: 3px; }

/* The proto-REINFORCE diagram (sec3c, sec3c-runs): its sheet of ten episodes keeps the geometry of the pages as built
   (no edge round each row of cells), and the caption of the probability table stays on one line. */
.s3c-face .runs-cells { border: 0; border-radius: 2px; }
.s3c-face { border: 2px solid var(--ink); border-radius: 6px; }
.s3c-card { border: 2px solid var(--ink2); border-radius: 6px; }
.s3c-dia .tb-prob .tb-cap { letter-spacing: 0.02em; white-space: nowrap; max-width: none; }

/* The effects under the why cards (sec3d.js, scenes 360 and 370) were sized for Barlow Condensed; in Rubik's capitals
   "PREFERENCE DOWN" left its card at 1180 x 820 (tools/overflow.mjs). A smaller size and less letter-spacing in the
   row of four, and a second line rather than a spill wherever a card is narrower still. */
.s3d-we { letter-spacing: 0.02em; white-space: normal; text-align: center; text-wrap: balance; }
.s3d-uwhys .s3d-we { font-size: calc(calc(9px * var(--tx)) * var(--fz, 1)); }
/* With large words (1180 x 820, 1366 x 768) the four labels of the row of scene 370 sit on one line each: PREFERENCE
   DOWN measures 145 px in a card of 152 px at 1180 x 820. A narrower card (1080 x 810) still breaks it in two. */
@media (min-width: 1080px) and (min-height: 740px) { .s3d-uwhys .s3d-we { font-size: calc(calc(8.5px * var(--tx)) * var(--fz, 1)); letter-spacing: 0; } }
/* The names in the six places under the roulette (sec3b-policy.css) were sized for Barlow Condensed; Righteous has
   no bold, and REPLACE left its place by 3.7 px. Rubik's bold, a little smaller. */
.s3p-slot .s3p-name { font-family: var(--px); font-weight: 700; letter-spacing: 0; font-size: calc(calc(7.4px * var(--tx)) * var(--fz, 1)); }

<style>/* juice.css */
/* juice.css: the motion layer of the look Arcade Marquee (design/arcade-marquee-motion, 2026-11-17), with juice.js.
   Loaded last by the three shells. Only individual transform properties (translate, rotate, scale) and opacity are
   animated here, so that the inline transforms of the engine (a flying copy, a moved element) keep working, and so
   that the compositor does the work on an iPad. html.fx-still (&instant, prefers-reduced-motion, &nojuice) and the
   media query at the end stop every loop; html.fx-live is set while a beat reached with Next is playing. */

/* The particles: one canvas over the page. */
.fx-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* A flying copy runs no animation of its own (the tumble of a die, a van's idle bob). */
.fx-fly, .fx-fly * { animation: none !important; }
.fx-fly { will-change: transform; }

/* A number while it counts: lit like a score. */
.fx-rolling { background-color: #FFE48A; box-shadow: 0 0 0 3px #FFE48A; border-radius: 3px; }

/* The spark that rides the tip of an arrow while it draws itself. */
.fx-tip { fill: var(--yellow); stroke: var(--ink); stroke-width: 2.5; pointer-events: none; }
.ob-arrow polygon { transform-box: fill-box; transform-origin: 50% 50%; }

/* The ring: it closes on its element with a small overshoot. */
.ob-ring { animation: fx-ring 0.72s cubic-bezier(.2,.7,.2,1) both; }
@keyframes fx-ring {
  0% { outline-color: transparent; outline-offset: 18px; }
  55% { outline-color: var(--pink); outline-offset: 1px; }
  78% { outline-offset: 7px; }
  100% { outline-offset: 5px; }
}
.tb .ob-ring { animation-name: fx-ring-in; }
@keyframes fx-ring-in { 0% { outline-color: transparent; outline-offset: 8px; } 60% { outline-offset: -4px; } 100% { outline-offset: -2px; } }

/* The stage card: a lit marquee. Bulbs run along its top and bottom edges and a wave of light chases along them. */
.ob-card .kicker { white-space: nowrap; }
.ob-card.ob-box { padding-bottom: calc(28px * var(--tx) + 18px); }
.ob-card > .fx-bulbs { position: absolute; left: 26px; right: 26px; margin: 0; display: flex; justify-content: space-between;
  pointer-events: none; z-index: 0; }
.ob-card > .fx-bulbs.top { top: 11px; }
.ob-card > .fx-bulbs.bottom { bottom: 11px; }
.fx-bulbs i { position: relative; width: 11px; height: 11px; border-radius: 50%; background: #F6E3AE; border: 2px solid var(--ink); }
.fx-bulbs i::after { content: ""; position: absolute; left: -2px; top: -2px; width: 11px; height: 11px; border-radius: 50%;
  background: var(--yellow); border: 2px solid var(--ink); box-shadow: 0 0 0 3px rgba(255, 199, 54, 0.45), 0 0 10px 3px rgba(255, 199, 54, 0.55);
  opacity: 0; animation: fx-bulb 1.8s ease-in-out infinite; animation-delay: calc(var(--i) * -0.09s); }
.fx-bulbs.bottom i::after { animation-direction: reverse; }
.fx-bulbs i:nth-child(3n+1)::after { background: var(--pink); box-shadow: 0 0 0 3px rgba(242, 56, 111, 0.35), 0 0 10px 3px rgba(242, 56, 111, 0.45); }
@keyframes fx-bulb { 0%, 100% { opacity: 0.1; } 50% { opacity: 1; } }
.ob-card.fx-in .fx-bulbs i::after { animation-duration: 0.9s; }
@media (max-height: 800px) and (min-width: 1080px) { .ob-card > .fx-bulbs.top { top: 7px; } .ob-card > .fx-bulbs.bottom { bottom: 7px; } .fx-bulbs i, .fx-bulbs i::after { width: 9px; height: 9px; } }
@media (max-width: 560px) { .ob-card.ob-box { padding-bottom: 40px; } .ob-card > .fx-bulbs { left: 14px; right: 14px; } .ob-card > .fx-bulbs.top { top: 7px; } .ob-card > .fx-bulbs.bottom { bottom: 7px; }
  .fx-bulbs i, .fx-bulbs i::after { width: 7px; height: 7px; border-width: 1.5px; } .fx-bulbs i:nth-child(even) { display: none; } }

/* The card's van drives in with its wheels turning, rocking on its springs, then idles. */
.ob-card .drive { animation: fx-drive 1.4s cubic-bezier(.22,.8,.25,1) both; }
@keyframes fx-drive {
  0% { translate: -320px 0; rotate: 0deg; }
  70% { translate: 10px 0; rotate: 0deg; }
  80% { translate: 4px 0; rotate: -2.5deg; }
  90% { translate: 0 0; rotate: 1.2deg; }
  100% { translate: 0 0; rotate: 0deg; }
}
.ob-card .drive { transform-origin: 50% 100%; }
.ob-van .wh { transform-box: fill-box; transform-origin: 50% 50%; }
.fx-drive .wh { animation: fx-wheel 0.42s linear 3; }
@keyframes fx-wheel { from { rotate: 0deg; } to { rotate: 360deg; } }
.ob-card .press { animation: fx-press 1.6s ease-in-out infinite; }
@keyframes fx-press { 0%, 100% { opacity: 1; scale: 1; } 50% { opacity: 0.35; scale: 0.96; } }

/* Idle life: the vans of a few scenes run their engines. HEALTHY hums, WORN sags, SHAKY rattles, FAILING shakes and
   smokes; exhaust puffs leave every one of them. The loops move the picture inside the van, never the van itself. */
.fx-idle .ob-van { position: relative; }
.fx-idle .ob-van > .ob-art { display: inline-block; transform-origin: 50% 100%; animation: fx-hum 1.6s ease-in-out infinite; }
.fx-idle .ob-van.w1 > .ob-art { animation-name: fx-sag; animation-duration: 2.2s; }
.fx-idle .ob-van.w2 > .ob-art { animation-name: fx-rattle; animation-duration: 0.9s; }
.fx-idle .ob-van.w3 > .ob-art { animation-name: fx-shake; animation-duration: 0.62s; }
.fx-idle .ob-van:nth-child(2) > .ob-art { animation-delay: -0.4s; }
.fx-idle .ob-van:nth-child(3) > .ob-art { animation-delay: -0.8s; }
@keyframes fx-hum { 0%, 100% { translate: 0 0; } 50% { translate: 0 -2.5px; } }
@keyframes fx-sag { 0%, 100% { translate: 0 0; rotate: 0deg; } 40% { translate: 0 -2px; rotate: -0.8deg; } 70% { translate: 0 0.5px; rotate: 0.6deg; } }
@keyframes fx-rattle { 0%, 100% { translate: 0 0; rotate: 0deg; } 20% { translate: 0 -2px; rotate: -1.6deg; } 45% { translate: 0 0; rotate: 1.2deg; }
  70% { translate: 0 -1px; rotate: -0.8deg; } }
@keyframes fx-shake { 0%, 100% { translate: 0 0; rotate: 0deg; } 15% { translate: -1.5px -1.5px; rotate: -2.4deg; } 35% { translate: 1.5px 0; rotate: 2deg; }
  55% { translate: -1px -2px; rotate: -1.6deg; } 75% { translate: 1px 0; rotate: 1.4deg; } }
.fx-puffs { position: absolute; left: 1%; bottom: 22%; width: 0; height: 0; pointer-events: none; }
.fx-puffs i { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: #CFC9DE;
  border: 2px solid rgba(30, 20, 66, 0.25); opacity: 0; animation: fx-puff 2.1s ease-out infinite; }
.fx-puffs i:nth-child(2) { animation-delay: 0.7s; }
.fx-puffs i:nth-child(3) { animation-delay: 1.4s; }
@keyframes fx-puff { 0% { opacity: 0; translate: 0 0; scale: 0.3; } 12% { opacity: 0.9; } 100% { opacity: 0; translate: -10px -26px; scale: 1.5; } }
.fx-idle .ob-van.w2 .fx-puffs i { background: #B5AECB; }
.fx-idle .ob-van.w3 .fx-puffs i { background: #8E86A8; animation-duration: 1.3s; }
.fx-idle .ob-van.w3 .fx-puffs { left: 8%; bottom: 72%; }
@keyframes fx-smoke { 0% { opacity: 0; translate: 0 0; scale: 0.4; } 15% { opacity: 0.95; } 100% { opacity: 0; translate: 4px -34px; scale: 1.9; } }
.fx-idle .ob-van.w3 .fx-puffs i { animation-name: fx-smoke; }
/* The stage card's van idles with puffs once it has arrived. */
.ob-card .road .ob-van { position: relative; }

/* A die is tossed: it crouches, flies up spinning about its centre, lands with a squash and a small hop, and settles.
   The squash is about the centre too, so the translate puts the bottom back on the floor (about 0.1 of the die). At
   1180 x 820 the die sits 24 px under the title of its box: at the top of the toss, smaller and turned by 30 degrees,
   it stays clear of the title (it rose 28 px at first and covered the words). */
.ob-die { display: inline-block; transform-origin: 50% 50%; }
.ob-die.tumble { animation: fx-toss 1.5s linear both; }
@keyframes fx-toss {
  0% { translate: 0 0; rotate: 0deg; scale: 1 1; animation-timing-function: ease-out; }
  8% { translate: 0 4px; rotate: 0deg; scale: 1.12 0.88; animation-timing-function: cubic-bezier(.25,.6,.35,1); }
  40% { translate: 0 -14px; rotate: 300deg; scale: 0.9 0.9; animation-timing-function: cubic-bezier(.55,0,.8,.4); }
  66% { translate: 0 5px; rotate: 540deg; scale: 1.16 0.84; animation-timing-function: cubic-bezier(.3,.7,.4,1); }
  78% { translate: 0 -6px; rotate: 600deg; scale: 0.97 1.03; animation-timing-function: cubic-bezier(.5,0,.7,.5); }
  88% { translate: 0 2px; rotate: 630deg; scale: 1.05 0.95; animation-timing-function: ease-out; }
  100% { translate: 0 0; rotate: 720deg; scale: 1 1; }
}

/* The layer off (&nojuice, OB.fx.off): the CSS motion of cfa9c43 (core.css) comes back, no loop of this file runs. */
html.fx-off .ob-card .drive { animation: ob-drive 1.4s cubic-bezier(.2,.7,.2,1) both; }

<script>/* bessie.js */
/* bessie.js: Old Bessie, the MDP of weekend 3's visualization, shared by every section.

   The model is the FS26 arcade's van, rl-arcade/repair-or-replace/js/van.js (commit 05dea09), unchanged:
   four states of wear, three actions, the same money and the same transition probabilities. In the browser it is
   window.B; in node, require('./bessie.js'). tools/check_bessie.js asserts every number the pages rely on.

   Words (TERMINOLOGY.md, since 2026-11-17): the names below keep the words of 2026-11-14 (playRun, avgG1, randomBets,
   PROTO.bets); in the pages and these comments a run is an episode, a bet an action preference, a strict policy a
   deterministic policy, a cumulative reward the return.

   An episode is one quarter, WEEKS = 13 weeks, from HEALTHY. Its return is
   G1 = r1 + GAMMA r2 + GAMMA^2 r3 + ... + GAMMA^12 r13, GAMMA = 0.9 (the discount factor).

   Dice. Every week of an episode uses exactly two random numbers from B.dice: the first picks the action (unused by
   a deterministic policy, but always spent), the second the outcome of the transition dynamics. Two policies
   followed on the same dice therefore meet the same luck, and a change in their averages comes from the policies
   alone. */
(function (root) {
  'use strict';

  const STATES = ['HEALTHY', 'WORN', 'SHAKY', 'FAILING'];
  const ACTIONS = ['RUN', 'SERVICE', 'REPLACE'];
  const HEALTHY = 0, WORN = 1, SHAKY = 2, FAILING = 3;
  const RUN = 0, SERVICE = 1, REPLACE = 2;

  const REV_RUN = [95, 72, 40, 16];          // RUN: the week's profit, by wear
  const P_BD = [0.02, 0.08, 0.28, 0.55];     // RUN: probability of a breakdown, by wear
  const BREAKDOWN_COST = 280;                // on top of the profit; the van ends FAILING
  const DEGR = [                             // RUN without a breakdown: wears 0, 1 or 2 levels
    [0.35, 0.55, 0.10],
    [0.30, 0.55, 0.15],
    [0.45, 0.55, 0.00],
    [0.65, 0.35, 0.00],
  ];
  const C_SERVICE = 50;                      // SERVICE: a week in the shop
  const SERV_UP = [                          // SERVICE: repairs 0, 1 or 2 levels
    [1.00, 0.00, 0.00],
    [0.05, 0.70, 0.25],
    [0.45, 0.50, 0.05],
    [0.55, 0.42, 0.03],
  ];
  const C_REPLACE = 130;                     // REPLACE: a new van, HEALTHY
  const GAMMA = 0.9;
  const WEEKS = 13;
  const START = HEALTHY;

  /* The transition dynamics of state s and action a: every outcome, in a fixed order, as
     {p, next, reward, face}. face as in the arcade's van.js: 'breakdown', 'wear0' to 'wear2' (RUN),
     'fix0' to 'fix2' (SERVICE), 'new' (REPLACE). Outcomes of probability 0 are left out; two outcomes that land
     in the same state with the same reward stay apart (they differ in what happened). */
  function outcomes(s, a) {
    const out = [];
    if (a === RUN) {
      out.push({ p: P_BD[s], next: FAILING, reward: REV_RUN[s] - BREAKDOWN_COST, face: 'breakdown' });
      for (let d = 0; d < 3; d++) {
        const p = (1 - P_BD[s]) * DEGR[s][d];
        if (p > 0) out.push({ p, next: Math.min(FAILING, s + d), reward: REV_RUN[s], face: 'wear' + d });
      }
    } else if (a === SERVICE) {
      for (let u = 0; u < 3; u++) {
        const p = SERV_UP[s][u];
        if (p > 0) out.push({ p, next: Math.max(HEALTHY, s - u), reward: -C_SERVICE, face: 'fix' + u });
      }
    } else {
      out.push({ p: 1, next: HEALTHY, reward: -C_REPLACE, face: 'new' });
    }
    return out;
  }

  /* One week: the outcome of (s, a) that the random number u in [0, 1) picks. */
  function step(s, a, u) {
    const out = outcomes(s, a);
    let cum = 0;
    for (const o of out) {
      cum += o.p;
      if (u < cum) return o;
    }
    return out[out.length - 1];
  }

  /* Mulberry32, the arcade's generator. */
  function rng(seed) {

<script>/* art.js */
/* art.js: the pictures of "Old Bessie" (agent A2, 2026-11-14), as inline SVG pixels, crisp at any size. OB.art.

   match core.css: the wear colours of the four states and the lever colours of the three actions.

   coloured by wear; the action glyphs are the arcade's (js/actions.js: wheel RUN, wrench SERVICE, sparkle REPLACE);

(function () {
  "use strict";
  var OB = window.OB;

  var C = {
    ink: "#181818", ink2: "#585858", box: "#F8F4E4", white: "#FFFFFF", yellow: "#F8D028",
    wear: ["#2E8B57", "#C99A33", "#E07A2A", "#D33A2C"],
    wearDark: ["#1E6B40", "#9C7417", "#B85A16", "#9E2A20"],
    wearSoft: ["#D5EBDD", "#F3E6C4", "#F8DCC4", "#F6D2CC"],
    wearText: ["#2E8B57", "#9C7417", "#C25F14", "#D33A2C"],
    lever: ["#1666C8", "#E08A00", "#D33A2C"],
    leverText: ["#1666C8", "#9A5E00", "#D33A2C"],
    leverSoft: ["#DCE9FB", "#FBEED2", "#FADBD6"]
  };
  var STATES = (window.B && window.B.STATES) || ["HEALTHY", "WORN", "SHAKY", "FAILING"];

  /* Old Bessie, facing right, 30 x 16 pixels. B body, R roof stripe (both in the wear colour), G glass, L headlight,

  var VAN = [
    "..............................",
    "..KKKKKKKKKKKKKKKKK...........",
    "..KRRRRRRRRRRRRRRRK...........",
    "..KBBBBBBBBBBBBBBBK...........",
    "..KBBBBBBBBBBBBBBBKKKKKK......",
    "..KBBBBBBBBBBBBBBBKBBBBBK.....",
    "..KBBBBBBBBBBBBBBBKGGGGBBK....",
    "..KBBBBBBBBBBBBBBBKGGGGBBBK...",
    "..KBBBBBBBBBBBBBBBKGGGGBBBK...",
    "..KBBBBBBBBBBBBBBBKBBBBBBLK...",
    "SSKBBBBBBBBBBBBBBBKBBBBBBBKSS.",
    "SSKKKTTTKKKKKKKKKKKKKTTTKKKSS.",
    "...TTTTTTT.........TTTTTTT....",
    "...TTTHTTT.........TTTHTTT....",
    "....TTTTT...........TTTTT.....",
    "gggggggggggggggggggggggggggggg"

  var DECALS = [
    [],
    [[8, 5, "K"], [8, 6, "K"], [9, 7, "K"], [9, 8, "K"]],
    [[6, 13, "K"], [7, 12, "K"], [7, 14, "K"], [9, 14, "O"], [9, 15, "O"], [10, 15, "O"], [10, 16, "O"]],
    [[3, 4, "K"], [4, 4, "K"], [5, 5, "K"], [6, 4, "K"], [7, 5, "K"], [12, 26, "D"], [13, 26, "D"], [7, 0, "M"], [8, 1, "M"], [6, 1, "M"], [9, 0, "M"]]

  function vanRows(wear) {

<script>/* skin-base.js */
/* skin-base.js: the part of every concept's art that is shared (design round of 2026-11-15). Loaded right after
   art.js and before every section, so a section that keeps a picture from load time (runs.js keeps its colours) gets
   the concept's.

   - The Greek letters are drawn by KaTeX since 2026-11-16 (tex.js, loaded after the skins: art.sym and art.symEl);
     the vector glyphs that this file drew for them until then are gone.
   - art.pixels draws the breakdown bolt of runs.js (its rows start "..KKK") with the concept's bolt.
   - OB.skin.install(parts): replaces the van, the game icons, the face, the die, the breakdown bolt and the action
     glyphs with the concept's drawings, keeping every class name the sections style (ob-van w<wear>, gauge, tag,
     ob-game, label, ob-die, ob-chip a<n>). Each part is optional. */
(function () {
  "use strict";
  var OB = window.OB, art = OB.art;
  var pixels0 = art.pixels;
  art.pixels = function (rows, pal, px, cls) {
    if (OB.skin.bolt && rows && rows.length === 8 && rows[0] === "..KKK") return OB.skin.bolt(px || 2);
    return pixels0(rows, pal, px, cls);
  };

  function wrap(svg, cls) {
    var s = document.createElement("span");
    s.className = "ob-art" + (cls ? " " + cls : "");

    return s;
  }
  function svg(vb, w, h, body, cls) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '" width="' + w + '" height="' + h + '" class="smooth' +
      (cls ? " " + cls : "") + '" aria-hidden="true">' + body + "</svg>";
  }

  function install(p) {
    var STATES = art.STATES, ACTIONS = art.ACTIONS;
    if (p.vanSvg) {
      art.vanSvg = function (wear, px) { return p.vanSvg(wear | 0, (px || 4) * 30); };
      art.van = function (wear, opts) {
        opts = opts || {};
        wear = Math.max(0, Math.min(3, wear | 0));
        var box = document.createElement("span");
        box.className = "ob-van w" + wear;
        box.appendChild(wrap(p.vanSvg(wear, opts.size || 120, opts)));
        if (opts.gauge !== false) {
          var g = document.createElement("span");
          g.className = "gauge";
          for (var i = 0; i < 4; i++) {
            var seg = document.createElement("i");
            if (i < 4 - wear) seg.className = "lit";
            g.appendChild(seg);
          }
          box.appendChild(g);
        }
        if (opts.label !== false) {
          var t = document.createElement("span");
          t.className = "tag";
          t.textContent = STATES[wear];
          box.appendChild(t);
        }
        return box;
      };
    }
    if (p.icon) {
      art.sprite = function (name, px) { return p.icon(name, (px || 6) * 11); };
      art.game = function (id, opts) {
        opts = opts || {};
        var g = art.GAMES.filter(function (x) { return x.id === id; })[0];
        var box = document.createElement("span");
        box.className = "ob-game";
        box.appendChild(wrap(p.icon(g.sprite, (opts.px || 7) * 11), "ob-box plain"));
        var t = document.createElement("span");
        t.className = "label";
        t.textContent = g.name;
        box.appendChild(t);
        return box;
      };
    }
    if (p.face) art.face = function (px) { return p.face((px || 4) * 9); };
    if (p.die) {
      art.die = function (n, px) { return p.die(n, (px || 3) * 15); };
      art.dieEl = function (n, px) { return wrap(p.die(n, (px || 3) * 15), "ob-die"); };
      art.setDie = function (e, n, roll) {
        var size = parseFloat(e.querySelector("svg").getAttribute("width"));
        e.innerHTML = p.die(n, size);
        e.classList.remove("tumble");
        if (roll) { void e.offsetWidth; e.classList.add("tumble"); }
      };
    }
    if (p.glyph) {
      art.glyph = function (a, px) { return p.glyph(a, px || 20); };
      art.actionChip = function (a, opts) {
        opts = opts || {};
        var c = document.createElement("span");
        c.className = "ob-chip a" + a;
        c.innerHTML = p.glyph(a, opts.glyph || 18);
        c.appendChild(document.createTextNode(opts.text || ACTIONS[a]));
        return c;
      };
    }
    if (p.colors) Object.keys(p.colors).forEach(function (k) {
      var v = p.colors[k];

    });

})();
