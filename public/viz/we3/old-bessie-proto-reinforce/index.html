<style>/* core.css */
/* core.css: the look of "Old Bessie", the engine's stylesheet (agent A2, 2026-11-14). ENGINE.md documents it.

   The arcade's retro console look in its light "paper" theme (rl-arcade/repair-or-replace/css/style.css): Press Start
   2P everywhere, the NES shell #E8E0CC, dialog boxes #F8F4E4 with a double pixel border, ink #181818, secondary ink
   #585858, the lever colours of the three actions and the wear colours of the four states. Light only: no dark
   theme and no theme toggle (Carlos, 2026-11-14).

   Larger words on large screens (the rule of weekend 2, w2-cx-private/CLAUDE.md): on a screen of at least 1080 x 740
   px --tx is 1.4. A size of words up to 18 px is written calc(V * var(--tx)); a larger one grows by a share that falls
   to nothing at 44 px: calc(V * (1 + (var(--tx) - 1) * w)) with w = (44 - V) / 26. Boards, tables, sprites, the top
   bar and the Back and Next buttons keep their sizes. */

:root {
  --px: "Press Start 2P", ui-monospace, monospace;
  --bg: #E8E0CC;            /* the NES shell */
  --box: #F8F4E4;           /* dialog boxes */
  --white: #FFFFFF;
  --ink: #181818;
  --ink2: #585858;          /* secondary ink */
  --hi: #404040;            /* the inner line of a dialog box */
  --press: #BBB6A2;         /* the pressed edge of a button */
  --yellow: #F8D028;
  --ring: #E84828;          /* the highlight ring */
  --run: #1666C8;           /* RUN, calm blue */
  --service: #E08A00;       /* SERVICE, amber */
  --replace: #D33A2C;       /* REPLACE, hot red */
  --run-soft: #DCE9FB;
  --service-soft: #FBEED2;
  --replace-soft: #FADBD6;
  --wear0: #2E8B57;         /* HEALTHY */
  --wear1: #C99A33;         /* WORN */
  --wear2: #E07A2A;         /* SHAKY */
  --wear3: #D33A2C;         /* FAILING */
  --wear0-soft: #D5EBDD;
  --wear1-soft: #F3E6C4;
  --wear2-soft: #F8DCC4;
  --wear3-soft: #F6D2CC;
  --gain: #1F7A45;          /* a positive amount of money */
  --loss: #C0302A;          /* a negative amount of money */
  --gut: 16px;
  --tx: 1;
}
@media (min-width: 1080px) and (min-height: 740px) { :root { --tx: 1.4; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--px);
  font-size: calc(12px * var(--tx));
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button { font-family: var(--px); color: var(--ink); }

/* The frame: top bar, stage, footer. */
.app {
  height: 100vh; height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.topbar {
  display: flex; align-items: center; gap: 12px; min-width: 0;
  padding: 7px var(--gut);
  background: var(--box);
  border-bottom: 4px solid var(--ink);
}
.topbar .brand {
  font-size: 11px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 0 1 auto; min-width: 0;
}
.pager { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: 0 1 auto; min-width: 0; overflow: hidden; }
.pager button {
  min-width: 26px; height: 26px; padding: 0 4px;
  font-size: 9px; line-height: 1;
  background: var(--box); border: 2px solid var(--ink); border-radius: 0;
  box-shadow: inset -2px -2px 0 0 var(--press);
  cursor: pointer; flex: 0 0 auto;
}
.pager button.card { min-width: 14px; width: 14px; padding: 0; background: var(--ink2); box-shadow: none; }
.pager button.opt { border-style: dashed; }
.pager button[aria-current] { background: var(--yellow); box-shadow: inset 2px 2px 0 0 #B89020; }
.pager .gap { font-size: 9px; color: var(--ink2); flex: 0 0 auto; padding: 0 1px; }
.pager.fold .far { display: none; }
[data-fullscreen] { display: flex; flex: 0 0 auto; }
.fullbtn {
  width: 34px; height: 30px; padding: 0;
  background: var(--box); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 0;
  box-shadow: inset -2px -2px 0 0 var(--press);
  cursor: pointer;
}
.fullbtn:hover { background: var(--yellow); }

.stage { position: relative; overflow: auto; padding: 10px var(--gut) 12px; min-height: 0; }
.scene { display: none; min-height: 100%; flex-direction: column; }
.scene.active { display: flex; }
.scene-head { display: flex; align-items: baseline; gap: 14px; min-width: 0; padding: 2px 0 8px; }
.scene-head .scene-no { font-size: calc(14px * var(--tx)); color: var(--ink2); flex: 0 0 auto; }
.scene-head h2 { margin: 0; font-weight: 400; line-height: 1.35; font-size: calc(18px * var(--tx)); min-width: 0; }
.scene-head .opt-tag {
  margin-left: auto; flex: 0 0 auto;
  font-size: calc(9px * var(--tx)); line-height: 1; padding: 6px 8px;
  border: 2px dashed var(--ink); background: var(--box);
}
.scene-body { position: relative; flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; }
.scene-inner {
  position: relative; width: 100%; max-width: 1240px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: calc(14px * var(--tx));
}
.scene.card .scene-head { display: none; }

.foot {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
  padding: 8px var(--gut) 10px;
  background: var(--box);
  border-top: 4px solid var(--ink);
}
.navbtn {
  min-width: 132px; padding: 13px 16px 11px;
  font-size: 14px; line-height: 1;
  background: var(--box); border: 4px solid var(--ink); border-radius: 0;
  box-shadow: inset -4px -4px 0 0 var(--press);
  cursor: pointer; touch-action: manipulation;
}
.navbtn.next { background: var(--yellow); box-shadow: inset -4px -4px 0 0 #B89020; }
.navbtn:active:not(:disabled) { box-shadow: inset 4px 4px 0 0 var(--press); }
.navbtn:disabled { opacity: 0.35; cursor: default; }
.navbtn.skip { min-width: 0; font-size: 11px; padding: 11px 12px 9px; border-style: dashed; }
.navbtn.skip[hidden] { display: none; }
.beats { display: flex; justify-content: center; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.beats i { width: 12px; height: 12px; border: 2px solid var(--ink); background: transparent; flex: 0 0 auto; }
.beats i.past { background: var(--ink2); }
.beats i.on { background: var(--yellow); }

/* The stage card at the start of a page (and any scene with card: {...}), in the manner of a console's stage card. */
.ob-card {
  align-self: center; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: calc(18px * var(--tx));
  padding: calc(34px * var(--tx)) calc(56px * var(--tx)) calc(28px * var(--tx));
  min-width: min(100%, 640px); max-width: 100%;
}
.ob-card .kicker { font-size: calc(14px * var(--tx)); color: var(--ink2); letter-spacing: 0.08em; }
.ob-card .title { margin: 0; font-weight: 400; line-height: 1.3; font-size: 64px; }
.ob-card .line { font-size: calc(13px * var(--tx)); line-height: 1.8; max-width: 40ch; color: var(--ink2); }
.ob-card .road { display: flex; align-items: flex-end; justify-content: center; gap: 18px; min-height: 90px; }
.ob-card .press { font-size: calc(11px * var(--tx)); animation: ob-blink 1.1s steps(2, end) infinite; }
.ob-card .drive { animation: ob-drive 1.8s steps(12, end) both; }
@keyframes ob-drive { from { transform: translateX(-240px); } to { transform: none; } }
@keyframes ob-blink { 50% { opacity: 0; } }

/* Dialog boxes and words. */
.ob-box {
  background: var(--box);
  border: 4px solid var(--ink);
  border-radius: 0;
  box-shadow: inset 0 0 0 2px var(--box), inset 0 0 0 4px var(--hi);
  padding: calc(12px * var(--tx)) calc(16px * var(--tx));
}
.ob-box.plain { box-shadow: none; }
.ob-box.white { background: var(--white); box-shadow: inset 0 0 0 2px var(--white), inset 0 0 0 4px var(--hi); }
.ob-say { font-size: calc(15px * var(--tx)); line-height: 1.75; text-align: center; max-width: 52ch; margin: 0; text-wrap: balance; }
.ob-say.left { text-align: left; }
.ob-note { font-size: calc(11px * var(--tx)); line-height: 1.8; color: var(--ink2); text-align: center; max-width: 60ch; margin: 0; }
.ob-big { font-size: calc(24px * (1 + (var(--tx) - 1) * 0.769)); line-height: 1.35; }
.ob-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(14px * var(--tx)); }
.ob-col { display: flex; flex-direction: column; align-items: center; gap: calc(10px * var(--tx)); }
.ob-hide { visibility: hidden; }
.ob-gone { display: none !important; }
.ob-mark { background: var(--yellow); padding: 0 0.2em; }

/* Buttons inside a scene (Compute, Roll, Done). */
.ob-btn {
  font-size: calc(12px * var(--tx)); line-height: 1;
  padding: calc(10px * var(--tx)) calc(14px * var(--tx));
  background: var(--yellow); border: 4px solid var(--ink); border-radius: 0;
  box-shadow: inset -4px -4px 0 0 #B89020;

<script>/* bessie.js */
/* bessie.js: Old Bessie, the MDP of weekend 3's visualization, shared by every section.

   The model is the FS26 arcade's van, rl-arcade/repair-or-replace/js/van.js (commit 05dea09), unchanged:
   four states of wear, three actions, the same money and the same chances. In the browser it is window.B;
   in node, require('./bessie.js'). tools/check_bessie.js asserts every number the pages rely on.

   A run is one quarter, WEEKS = 13 weeks, from HEALTHY. Its cumulative reward is
   G1 = r1 + GAMMA r2 + GAMMA^2 r3 + ... + GAMMA^12 r13, GAMMA = 0.9.

   Dice. Every week of a run uses exactly two random numbers from B.dice: the first picks the action (unused by a
   strict policy, but always spent), the second the outcome of the transition dynamics. Two policies played on the
   same dice therefore meet the same luck, and a change in their averages comes from the policies alone. */
(function (root) {
  'use strict';

  const STATES = ['HEALTHY', 'WORN', 'SHAKY', 'FAILING'];
  const ACTIONS = ['RUN', 'SERVICE', 'REPLACE'];
  const HEALTHY = 0, WORN = 1, SHAKY = 2, FAILING = 3;
  const RUN = 0, SERVICE = 1, REPLACE = 2;

  const REV_RUN = [95, 72, 40, 16];          // RUN: the week's profit, by wear
  const P_BD = [0.02, 0.08, 0.28, 0.55];     // RUN: chance of a breakdown, by wear
  const BREAKDOWN_COST = 280;                // on top of the profit; the van ends FAILING
  const DEGR = [                             // RUN without a breakdown: wears 0, 1 or 2 levels
    [0.35, 0.55, 0.10],
    [0.30, 0.55, 0.15],
    [0.45, 0.55, 0.00],
    [0.65, 0.35, 0.00],
  ];
  const C_SERVICE = 50;                      // SERVICE: a week in the shop
  const SERV_UP = [                          // SERVICE: repairs 0, 1 or 2 levels
    [1.00, 0.00, 0.00],
    [0.05, 0.70, 0.25],
    [0.45, 0.50, 0.05],
    [0.55, 0.42, 0.03],
  ];
  const C_REPLACE = 130;                     // REPLACE: a new van, HEALTHY
  const GAMMA = 0.9;
  const WEEKS = 13;
  const START = HEALTHY;

  /* The transition dynamics of state s and action a: every outcome, in a fixed order, as
     {p, next, reward, face}. face as in the arcade's van.js: 'breakdown', 'wear0' to 'wear2' (RUN),
     'fix0' to 'fix2' (SERVICE), 'new' (REPLACE). Outcomes with no chance are left out; two outcomes that land
     in the same state with the same reward stay apart (they differ in what happened). */
  function outcomes(s, a) {
    const out = [];
    if (a === RUN) {
      out.push({ p: P_BD[s], next: FAILING, reward: REV_RUN[s] - BREAKDOWN_COST, face: 'breakdown' });
      for (let d = 0; d < 3; d++) {
        const p = (1 - P_BD[s]) * DEGR[s][d];
        if (p > 0) out.push({ p, next: Math.min(FAILING, s + d), reward: REV_RUN[s], face: 'wear' + d });
      }
    } else if (a === SERVICE) {
      for (let u = 0; u < 3; u++) {
        const p = SERV_UP[s][u];
        if (p > 0) out.push({ p, next: Math.max(HEALTHY, s - u), reward: -C_SERVICE, face: 'fix' + u });
      }
    } else {
      out.push({ p: 1, next: HEALTHY, reward: -C_REPLACE, face: 'new' });
    }
    return out;
  }

  /* One week: the outcome of (s, a) that the random number u in [0, 1) picks. */
  function step(s, a, u) {
    const out = outcomes(s, a);
    let cum = 0;
    for (const o of out) {
      cum += o.p;
      if (u < cum) return o;
    }
    return out[out.length - 1];
  }

  /* Mulberry32, the arcade's generator. */
  function rng(seed) {
    let t = seed >>> 0;
    return function () {
      t = (t + 0x6D2B79F5) >>> 0;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* The dice of n runs: n * weeks * 2 numbers, run by run, week by week, (action, transition). */
  function dice(seed, n, weeks) {
    weeks = weeks || WEEKS;
    const r = rng(seed);
    const d = new Float64Array(n * weeks * 2);
    for (let k = 0; k < d.length; k++) d[k] = r();
    d.n = n;
    d.weeks = weeks;
    return d;
  }

  /* The action a policy takes in state s with the random number u. A policy is either a column of four actions
     (a strict policy, one action per state) or a table of four rows of three probabilities. */
  function act(policy, s, u) {
    const row = policy[s];
    if (typeof row === 'number') return row;
    let cum = 0;
    for (let a = 0; a < 3; a++) {
      cum += row[a];
      if (u < cum) return a;
    }
    return 2;
  }

  /* Run i of the dice: states S1..S13 (and the state after the last week), actions, rewards, faces, G1. */
  function playRun(policy, d, i) {
    const weeks = d.weeks || WEEKS;
    const states = [], actions = [], rewards = [], faces = [];
    let s = START, G = 0, disc = 1;
    for (let t = 0; t < weeks; t++) {
      const k = (i * weeks + t) * 2;
      const a = act(policy, s, d[k]);
      const o = step(s, a, d[k + 1]);
      states.push(s); actions.push(a); rewards.push(o.reward); faces.push(o.face);
      G += disc * o.reward;
      disc *= GAMMA;
      s = o.next;
    }
    states.push(s);
    return { states, actions, rewards, faces, G1: G };
  }

  /* G1 of a list of rewards. */
  function g1(rewards) {
    let G = 0, disc = 1;
    for (const r of rewards) { G += disc * r; disc *= GAMMA; }
    return G;
  }

  /* The average G1 of the first n runs of the dice (all of them by default). */
  function avgG1(policy, d, n) {
    n = n || d.n;
    let sum = 0;
    for (let i = 0; i < n; i++) sum += playRun(policy, d, i).G1;
    return sum / n;
  }

  /* Softmax of one row of bets: exponential of every entry, then the row divided by its sum. */
  function softmax(row) {
    const m = Math.max.apply(null, row);
    const e = row.map((x) => Math.exp(x - m));
    const sum = e.reduce((x, y) => x + y, 0);
    return e.map((x) => x / sum);
  }
  function softmaxTable(W) { return W.map(softmax); }

  /* The exact expected G1 of a policy (over all runs, weighted by their chances): for checks only. */
  function expectedG1(policy) {
    let dist = [0, 0, 0, 0];
    dist[START] = 1;
    let J = 0, disc = 1;
    for (let t = 0; t < WEEKS; t++) {
      const nd = [0, 0, 0, 0];
      for (let s = 0; s < 4; s++) {
        if (dist[s] === 0) continue;
        const row = policy[s];
        const probs = typeof row === 'number' ? [0, 1, 2].map((a) => (a === row ? 1 : 0)) : row;
        for (let a = 0; a < 3; a++) {
          if (probs[a] === 0) continue;
          for (const o of outcomes(s, a)) {
            const w = dist[s] * probs[a] * o.p;
            J += disc * w * o.reward;
            nd[o.next] += w;
          }
        }
      }
      dist = nd;
      disc *= GAMMA;
    }
    return J;
  }

  /* One hop of the backward pass of proto-REINFORCE: the average G1 before and after adding eps to the bet
     W[s][a], both on the same dice; the change; nabla = change / eps. */
  function hop(W, s, a, eps, d, n) {
    const before = avgG1(softmaxTable(W), d, n);
    const W2 = W.map((row) => row.slice());
    W2[s][a] += eps;
    const after = avgG1(softmaxTable(W2), d, n);
    return { before, after, change: after - before, nabla: (after - before) / eps, W2 };
  }

  /* Random bets, uniform in [-1, 1], one decimal (the starting table of proto-REINFORCE). */
  function randomBets(seed) {
    const r = rng(seed);
    return [0, 1, 2, 3].map(() => [0, 1, 2].map(() => Math.round((r() * 2 - 1) * 10) / 10));
  }

  const B = {
    STATES, ACTIONS, HEALTHY, WORN, SHAKY, FAILING, RUN, SERVICE, REPLACE,
    REV_RUN, P_BD, BREAKDOWN_COST, DEGR, C_SERVICE, SERV_UP, C_REPLACE,
    GAMMA, WEEKS, START,
    outcomes, step, rng, dice, act, playRun, g1, avgG1, softmax, softmaxTable, expectedG1, hop, randomBets,
    /* The arcade's optimal strict policy at gamma 0.9: RUN, SERVICE, REPLACE, REPLACE. Over one quarter from
       HEALTHY it is also the best of the 81 strict policies (expected G1 242.08, tools/check_bessie.js). */
    BEST: [RUN, SERVICE, REPLACE, REPLACE],
    /* Try it (section 4, A4a): ten runs, the same dice for every try. */
    TRY: { n: 10, diceSeed: 11 },
    /* The guided example of proto-REINFORCE (section 4, A5 and A6). The bets are B.randomBets(17); the entry is
       drawn by B.rng(17 * 7919) among the twelve and lands on (HEALTHY, RUN); 1,000 runs on B.dice(12, 1000).
       Shown with two decimals: average G1 before -243.36, after -241.35, change 2.01, nabla 201,
       w = 0.40 + 0.01 x 201 = 2.41, average G1 after the update -5.20 (same dice). */
    PROTO: {
      betsSeed: 17,
      bets: [[0.4, -0.6, 0.1], [-0.7, -0.8, 0.5], [-0.4, 0.1, -0.5], [0.4, 0.6, -0.4]],
      pickSeed: 17 * 7919,
      pick: [HEALTHY, RUN],
      diceSeed: 12,
      n: 1000,
      eps: 0.01,
      alpha: 0.01,
    },
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = B;
  else root.B = B;
})(typeof window !== 'undefined' ? window : this);
</script>
<script>/* core.js */
/* core.js: the scene engine of "Old Bessie" (agent A2, 2026-11-14). ENGINE.md documents the API; read it first.

   A page is a list of scenes; a scene is a list of beats. Next shows the next beat of the scene, and after its last
   beat the first beat of the next scene; Back reverses beat by beat. Each section registers its scenes with
   OB.scene({ key, order, title, beats, build, beat, ... }) and the shell starts the page with OB.start({ page, card }).

   The beat contract. beat(k, api) leaves the scene in the state of beat k, whatever state it was in (Back and deep
   links jump). It sets that state at once (synchronously) and may decorate the change with the motion helpers
   (api.show, api.fade, api.fly, api.move, api.roll, api.ring, api.arrow, api.at), which only animate when the reader
   came forward with Next and motion is allowed (api.instant false). Before any other beat is shown, the engine
   finishes every running motion and every pending api.at callback at once, so a reader who presses Next early
   always lands on the right state. */
(function () {
  "use strict";

  var doc = document;
  var DUR = { fade: 1200, fly: 1600, move: 1600, roll: 1500, arrow: 1200 };
  var HASH0 = location.hash || "";
  var INSTANT = /[#&]instant\b/.test(HASH0);
  var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var SVGNS = "http://www.w3.org/2000/svg";

  /* Small helpers. */
  function el(tag, cls, text) {
    var e = doc.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function html(tag, cls, markup) {
    var e = el(tag, cls);
    e.innerHTML = markup;
    return e;
  }
  function svgEl(tag, attrs) {
    var e = doc.createElementNS(SVGNS, tag);
    for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);
    return e;
  }
  function num(x, places) {
    var p = places || 0;
    var neg = x < 0 && Math.abs(x) >= 0.5 * Math.pow(10, -p);
    var s = Math.abs(x).toFixed(p);
    var parts = s.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + parts.join(".");
  }
  function money(x, places, sign) {
    var p = places || 0;
    var r = +x.toFixed(p);
    var body = "$" + num(Math.abs(r), p);
    if (r < 0) return "-" + body;
    return (sign && r > 0 ? "+" : "") + body;
  }
  function moneyEl(x, places, sign) {
    var r = +x.toFixed(places || 0);
    return el("span", "ob-money " + (r > 0 ? "gain" : r < 0 ? "loss" : ""), money(x, places, sign));
  }
  function remove(list, item) { var i = list.indexOf(item); if (i >= 0) list.splice(i, 1); }
  function safe(fn) {
    try { return fn(); } catch (e) { if (window.console) console.error("OB:", e); return undefined; }
  }
  function ease(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

  /* The timeline of the current beat: its pending callbacks and its running motions. */
  var T = null;
  function Timeline(instant) { this.instant = instant; this.timers = []; this.motions = []; this.flushing = false; this.dead = false; }
  function quick() { return !T || T.instant || T.flushing || T.dead; }
  function at(ms, fn) {
    var t = T;
    if (quick() || !(ms > 0)) { safe(fn); return; }
    var rec = { fn: fn, due: Date.now() + ms, id: 0 };
    rec.id = setTimeout(function () { remove(t.timers, rec); if (!t.dead) { safe(fn); relayoutSoon(); } }, ms);
    t.timers.push(rec);
  }
  function finishAll(t) {
    if (!t || t.dead) return;
    t.flushing = true;
    for (var guard = 0; guard < 5000 && (t.timers.length || t.motions.length); guard++) {
      if (t.motions.length) { t.motions[0].finish(); continue; }
      t.timers.sort(function (a, b) { return a.due - b.due; });
      var rec = t.timers.shift();
      clearTimeout(rec.id);
      safe(rec.fn);
    }
    t.dead = true;
  }
  /* animate(dur, tick, done): tick(p) for p from 0 to 1 (eased), then done(). A Promise, resolved at the end or
     when the engine finishes the beat early. */
  function animate(dur, tick, done) {
    var t = T;
    return new Promise(function (resolve) {
      var fin = false, rec = { finish: finish };
      function finish() {
        if (fin) return;
        fin = true;
        if (t) remove(t.motions, rec);
        if (done) safe(done);
        relayoutSoon();
        resolve();
      }
      if (quick() || !(dur > 0)) { finish(); return; }
      t.motions.push(rec);
      var t0 = null;
      function frame(now) {
        if (fin) return;
        if (t0 === null) t0 = now;
        var p = Math.min(1, (now - t0) / dur);
        safe(function () { tick(ease(p)); });
        if (p >= 1) finish(); else requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  }
  function later(opts, start) {
    var d = (opts && opts.delay) || 0;
    return new Promise(function (resolve) { at(d, function () { Promise.resolve(start()).then(resolve); }); });
  }

  /* The motion helpers. Each sets its end state for sure and animates only when motion is allowed. */
  function show(e, on, opts) {
    if (!e) return Promise.resolve();
    if (on === undefined) on = true;
    if (!on) { e.classList.add("ob-hide"); e.style.opacity = ""; return Promise.resolve(); }
    if (!e.classList.contains("ob-hide")) return Promise.resolve();
    return fade(e, true, opts);
  }
  function fade(e, on, opts) {
    opts = opts || {};
    if (!e) return Promise.resolve();
    if (on && opts.delay) e.classList.add("ob-hide");
    return later(opts, function () {
      var from = on ? 0 : 1, to = on ? 1 : 0;
      if (on) { e.classList.remove("ob-hide"); e.style.opacity = "0"; }
      return animate(opts.dur || DUR.fade, function (p) { e.style.opacity = String(from + (to - from) * p); },
        function () { e.style.opacity = ""; if (!on) e.classList.add("ob-hide"); });
    });
  }
  function fly(from, to, opts) {
    opts = opts || {};
    if (!from || !to) return Promise.resolve();
    to.style.visibility = "hidden";
    return later(opts, function () {
      function land() { to.style.visibility = ""; to.classList.remove("ob-hide"); }
      if (quick()) { land(); return null; }
      var src = opts.ghost || from;
      var a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
      if (!a.width || !b.width) { land(); return null; }
      var g = src.cloneNode(true);
      g.removeAttribute("id");
      g.classList.remove("ob-hide", "ob-ring");
      g.classList.add("ob-ghost");
      g.style.visibility = "visible";
      g.style.opacity = "";
      g.style.left = a.left + "px";
      g.style.top = a.top + "px";
      g.style.width = a.width + "px";
      g.style.height = a.height + "px";
      from.parentNode.insertBefore(g, from.nextSibling);
      var sx = opts.scale === false ? 1 : b.width / a.width, sy = opts.scale === false ? 1 : b.height / a.height;
      var dx = b.left - a.left, dy = b.top - a.top, arc = opts.arc === undefined ? 40 : opts.arc;
      return animate(opts.dur || DUR.fly, function (p) {
        var y = dy * p - Math.sin(Math.PI * p) * arc;
        g.style.transform = "translate(" + (dx * p) + "px," + y + "px) scale(" + (1 + (sx - 1) * p) + "," + (1 + (sy - 1) * p) + ")";
      }, function () { if (g.parentNode) g.parentNode.removeChild(g); land(); });
    });
  }
  function move(e, dest, opts) {
    opts = opts || {};
    if (!e || !dest) return Promise.resolve();
    var a = e.getBoundingClientRect();
    if (opts.before) dest.insertBefore(e, opts.before); else dest.appendChild(e);
    if (quick()) { e.style.transform = ""; return Promise.resolve(); }
    var b = e.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    e.style.transform = "translate(" + dx + "px," + dy + "px)";
    return later(opts, function () {
      return animate(opts.dur || DUR.move, function (p) {
        e.style.transform = "translate(" + (dx * (1 - p)) + "px," + (dy * (1 - p)) + "px)";
      }, function () { e.style.transform = ""; });
    });
  }
  function roll(e, to, opts) {
    opts = opts || {};

    "SSKKKTTTKKKKKKKKKKKKKTTTKKKSS.",
    "...TTTTTTT.........TTTTTTT....",
    "...TTTHTTT.........TTTHTTT....",
    "....TTTTT...........TTTTT.....",
    "gggggggggggggggggggggggggggggg"
  ];
  /* Decals: [row, col, char]. WORN a scratch; SHAKY also a dent and rust; FAILING also a crack, a drip and smoke. */
  var DECALS = [
    [],
    [[8, 5, "K"], [8, 6, "K"], [9, 7, "K"], [9, 8, "K"]],
    [[6, 13, "K"], [7, 12, "K"], [7, 14, "K"], [9, 14, "O"], [9, 15, "O"], [10, 15, "O"], [10, 16, "O"]],
    [[3, 4, "K"], [4, 4, "K"], [5, 5, "K"], [6, 4, "K"], [7, 5, "K"], [12, 26, "D"], [13, 26, "D"], [7, 0, "M"], [8, 1, "M"], [6, 1, "M"], [9, 0, "M"]]
  ];
  function vanRows(wear) {
    var rows = VAN.map(function (r) { return r.split(""); });
    for (var w = 1; w <= wear; w++) DECALS[w].forEach(function (d) { rows[d[0]][d[1]] = d[2]; });
    return rows.map(function (r) { return r.join(""); });
  }
  function vanPal(wear) {
    return { K: C.ink, B: C.wear[wear], R: C.wearDark[wear], G: "#B6D9EB", L: C.yellow, S: C.ink2, T: C.ink, H: C.box,
      g: C.ink2, O: "#6B3410", D: C.ink2, M: "#9A9A9A" };
  }
  function vanSvg(wear, px) { return pixels(vanRows(wear | 0), vanPal(wear | 0), px || 4); }
  /* The van as an element: opts.size (width in px, default 120), opts.gauge (default true), opts.label (default
     true: the state's name in its colour). */
  function van(wear, opts) {
    opts = opts || {};
    wear = Math.max(0, Math.min(3, wear | 0));
    var box = document.createElement("span");
    box.className = "ob-van w" + wear;
    var px = (opts.size || 120) / 30;
    box.appendChild(wrap(vanSvg(wear, px)));
    if (opts.gauge !== false) {
      var g = document.createElement("span");
      g.className = "gauge";
      for (var i = 0; i < 4; i++) {
        var seg = document.createElement("i");
        if (i < 4 - wear) seg.className = "lit";
        g.appendChild(seg);
      }
      box.appendChild(g);
    }
    if (opts.label !== false) {
      var t = document.createElement("span");
      t.className = "tag";
      t.textContent = STATES[wear];
      box.appendChild(t);
    }
    return box;
  }

  /* The three action glyphs (the arcade's line art), in currentColor. */
  var GLYPH = [
    '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.1"/>' +
      '<circle cx="12" cy="12" r="2.5" fill="currentColor"/>' +
      '<g stroke="currentColor" stroke-width="2.1" stroke-linecap="round">' +
      '<line x1="12" y1="9.5" x2="12" y2="3.4"/><line x1="14.1" y1="13.2" x2="18.9" y2="16.1"/>' +
      '<line x1="9.9" y1="13.2" x2="5.1" y2="16.1"/></g>',
    '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"' +
      ' fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
    '<path d="M12 2.6l1.95 5.95a2 2 0 0 0 1.3 1.3L21.4 12l-5.95 1.95a2 2 0 0 0-1.3 1.3L12 21.4l-1.95-5.95a2 2 0 0 0-1.3-1.3L2.6 12l5.95-1.95a2 2 0 0 0 1.3-1.3z"' +
      ' fill="currentColor"/>'
  ];
  function glyph(a, px) {
    var s = px || 20;
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" class="smooth" aria-hidden="true">' + GLYPH[a] + "</svg>";
  }

  /* Chips: a state (its colour, its name) and an action (its glyph, its colour, its name). */
  function stateChip(s, opts) {
    opts = opts || {};
    var c = document.createElement("span");
    c.className = "ob-chip s" + s;
    var d = document.createElement("i");
    d.className = "dot";
    c.appendChild(d);
    c.appendChild(document.createTextNode(opts.text || STATES[s]));
    return c;
  }
  function actionChip(a, opts) {
    opts = opts || {};
    var c = document.createElement("span");
    c.className = "ob-chip a" + a;
    c.innerHTML = glyph(a, opts.glyph || 18);
    c.appendChild(document.createTextNode(opts.text || ACTIONS[a]));
    return c;
  }

  /* The four games of the arcade, as their cartridge sprites (rl-arcade/cartridges.js, palette PX). */
  var PX = { ".": null, K: "#0b0b16", W: "#f4f6ff", R: "#ff4d5e", r: "#c0202e", G: "#6be24a", g: "#1f9a52",
    B: "#41a6ff", b: "#9aa7ff", Y: "#ffd23f", O: "#ff9a3c", P: "#b06bff", C: "#5ad0ff", S: "#c9cee6", s: "#6c7194", N: "#9a6a3c" };
  var SPRITES = {
    van: ["...........", "...KKKKKKK.", "..KKWWKbbbK", ".KbbbbbbbbK", ".KbbbbbbbbK",
      ".KbbbbbbbbK", ".KKKKKKKKK.", "..KK...KK..", "..KK...KK..", "..........."],
    robot: [".....R.....", ".....K.....", "..KKKKKKK..", "..KSSSSSK..", "..KSSSSSK..",
      "..KCCSCCK..", "..KSSSSSK..", "..KSKKKSK..", "..KKKKKKK..", "...K...K..."],
    tag: ["..KKKKKKK..", ".KOOOKOOOK.", ".KOOOOOOOK.", ".KOYYYOOOK.", ".KOYOOOOOK.",
      ".KOYYYOOOK.", ".KOOOYOOOK.", ".KOYYYOOOK.", ".KOOOOOOOK.", "..KKKKKKK.."],
    pokeball: ["...KKKKK...", ".KKRRRRRKK.", ".KRRRRRRRK.", "KRRRRRRRRRK", "KRRRWWWRRRK",
      "KKKKWKWKKKK", "KWWWWWWWWWK", "KWWWWWWWWWK", ".KWWWWWWWK.", ".KKWWWWWKK.", "...KKKKK..."]
  };
  var GAMES = [
    { id: "bessie", sprite: "van", name: "OLD BESSIE" },
    { id: "anymal", sprite: "robot", name: "ANYMAL" },
    { id: "pricing", sprite: "tag", name: "LAST-MINUTE PRICING" },
    { id: "pokemon", sprite: "pokeball", name: "POKEMON" }
  ];
  function sprite(name, px) { return pixels(SPRITES[name], PX, px || 6); }
  /* A game as an element: its sprite on a cartridge-like tile and its name. id: bessie, anymal, pricing, pokemon. */
  function game(id, opts) {
    opts = opts || {};
    var g = GAMES.filter(function (x) { return x.id === id; })[0];
    var box = document.createElement("span");
    box.className = "ob-game";
    var tile = wrap(sprite(g.sprite, opts.px || 7), "ob-box plain");
    box.appendChild(tile);
    var t = document.createElement("span");
    t.className = "label";
    t.textContent = g.name;
    box.appendChild(t);
    return box;
  }

  /* The player, the one who chooses (sketch page 18): a small face. */
  var FACE = ["..KKKKK..", ".KYYYYYK.", "KYYKYKYYK", "KYYKYKYYK", "KYYYYYYYK", "KYKYYYKYK", "KYYKKKYYK", ".KYYYYYK.", "..KKKKK.."];
  function face(px) { return pixels(FACE, { K: C.ink, Y: C.yellow }, px || 4); }

  /* A die for the transition dynamics: n pips (1 to 6), 15 x 15 pixels. */
  var PIPS = { 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]],
    5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] };
  function dieRows(n) {
    var g = [];
    for (var y = 0; y < 15; y++) {
      var r = "";
      for (var x = 0; x < 15; x++) r += (x === 0 || y === 0 || x === 14 || y === 14) ? "K" : "W";
      g.push(r.split(""));
    }
    if (n === 0) {   /* a question mark: an outcome that no fair die decides (page 1; added after the freeze by the main session) */
      [".OOO.", "O...O", "....O", "...O.", "..O..", "..O..", ".....", "..O.."].forEach(function (row, y) {
        for (var x = 0; x < 5; x++) if (row[x] === "O") g[3 + y][5 + x] = "K";
      });
      return g.map(function (r) { return r.join(""); });
    }
    (PIPS[n] || PIPS[1]).forEach(function (p) {
      for (var dy = 0; dy < 3; dy++) for (var dx = 0; dx < 3; dx++) g[2 + p[1] * 4 + dy][2 + p[0] * 4 + dx] = "K";
    });
    return g.map(function (r) { return r.join(""); });
  }
  function die(n, px) { return pixels(dieRows(n), { K: C.ink, W: C.white }, px || 3); }
  function dieEl(n, px) { return wrap(die(n, px), "ob-die"); }
  /* Set the face of a die element made by dieEl; with roll true it tumbles first (about 1.5 s, CSS ob-tumble). */
  function setDie(e, n, roll) {
    var px = parseFloat(e.querySelector("svg").getAttribute("width")) / 15;
    e.innerHTML = die(n, px);
    e.classList.remove("tumble");
    if (roll) { void e.offsetWidth; e.classList.add("tumble"); }
  }

  /* Greek letters drawn as pixels: Press Start 2P has only ASCII (and a few signs such as x), so gamma, alpha,
     epsilon, nabla and Sigma are 8 x 8 pixel glyphs that sit in a line of text like a letter of the font. */
  var SYM = {
    gamma: ["........", "........", "OO....OO", ".OO..OO.", "..OOOO..", "...OO...", "...OO...", "...OO..."],
    alpha: ["........", "........", ".OOO.OO.", "OO..OOO.", "OO...OO.", "OO..OOO.", ".OOO.OO.", "........"],
    epsilon: ["........", "........", ".OOOOO..", "OO......", ".OOOO...", "OO......", ".OOOOO..", "........"],
    nabla: ["OOOOOOO.", "OO...OO.", ".O...O..", ".OO.OO..", "..O.O...", "..OOO...", "...O....", "........"],
    Sigma: ["OOOOOOO.", "OO......", ".OO.....", "..OO....", ".OO.....", "OO......", "OOOOOOO.", "........"]
  };
  function sym(name) {
    return pixels(SYM[name], { O: "currentColor" }, 1).replace('width="8" height="8"', 'width="1em" height="1em" class="ob-sym"');
  }
  function symEl(name) {
    var s = document.createElement("span");
    s.className = "ob-symbox";
    s.setAttribute("aria-label", name);
    s.innerHTML = sym(name);
    return s;
  }

  OB.art = {
    C: C, STATES: STATES, ACTIONS: ACTIONS, GAMES: GAMES, SPRITES: SPRITES,
    pixels: pixels, wrap: wrap,
    van: van, vanSvg: vanSvg, glyph: glyph, stateChip: stateChip, actionChip: actionChip,
    sprite: sprite, game: game, face: face, die: die, dieEl: dieEl, setDie: setDie,
    sym: sym, symEl: symEl, SYM: SYM
  };
})();
</script>
<script>/* runs.js */
/* runs.js: the run symbol of "Old Bessie" (agent A3, 2026-11-14), drawn on pages 2 and 3. OB.runs.

   A run is one row: one cell per week, the cell coloured by the van's state that week (the wear colours of core.css),
   the action's glyph small inside it (art.js, in ink), a breakdown marked by a small yellow bolt in the cell's corner,
   and at the end of the row a slot for the run's G1, hidden until a scene shows it. Many runs are a block of rows.
   Up to 20 runs (by default) are drawn as elements, one legible row each; more are drawn as a compact block on a
   canvas, one thin line per run (1,000 runs fit in a few hundred pixels), with an optional G1 column of thin bars.

   API (stable from 2026-11-14; additions only):

     OB.runs.play(policy, d, n)    the first n runs (default d.n) of the dice d under policy: an array of
                                   B.playRun(policy, d, i), each { states, actions, rewards, faces, G1 }.
     OB.runs.block(runs, opts)     an element .runs-block that draws the runs. opts (all optional):
         compact   true or false   default: runs.length > 20
         g1        true            rows: a G1 slot at the end of each row; compact: a G1 column of bars. Hidden
                                   (class ob-hide) until shown with OB.runs.showG1 or api.show
         head      true            rows: a line above the rows with the week numbers and the head "G1" of the slots
         label     true            rows: the run's number at the left of its row (1, 2, 3, ...)
         places    0               decimals of the G1 slots (OB.money)
         height    0               compact: the block's height in px (default: 1 px a run, at most 320 px)
         width     0               compact: the block's width in px (default 13 x 8 px)
       The element carries: .runs (the data), .rows[i] and .cells[i][t] (rows), .g1s[i] (the G1 slots of the rows),
       .g1head (the head "G1" over the slots), .canvas and .g1col (compact).
     OB.runs.showG1(block, on, api, opts)  shows (on true) or hides the G1 slots of a block: with api and motion one
                                   after another (opts.stagger ms, default 140; opts.delay ms); compact: the G1 column.
     OB.runs.row(run, i, opts)     one row element (as in a block of rows): .cells, .g1 (its slot)
     OB.runs.cell(s, a, breakdown) one cell element .runs-cell (state s, action a, a bolt when breakdown is true)
     OB.runs.legend(opts)          a line that explains the symbol: the four states' colours, the three glyphs and
                                   the bolt (opts.states, opts.actions, opts.breakdown: false leaves a part out)

   Sizes: the cell is --rc (CSS, about 29 px on a large screen, 18 px on a phone); a block of rows sets it with
   style.setProperty("--rc", "24px") if a scene needs another size. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, art = OB.art, el = OB.el;
  var WEAR = art.C.wear;

  /* The bolt of a breakdown: a 5 x 8 pixel spark, yellow with an ink outline. */
  var BOLT = [
    "..KKK",
    ".KYYK",
    ".KYK.",
    "KYYKK",
    "KYYYK",
    ".KYK.",
    ".KK..",
    "K...."
  ];
  function boltSvg() { return art.pixels(BOLT, { K: art.C.ink, Y: art.C.yellow }, 2); }

  function play(policy, d, n) {
    var out = [];
    n = n || d.n;
    for (var i = 0; i < n; i++) out.push(B.playRun(policy, d, i));
    return out;
  }

  function cell(s, a, breakdown) {
    var c = el("span", "runs-cell w" + s + (breakdown ? " bd" : ""));
    c.innerHTML = art.glyph(a, 16);
    if (breakdown) c.appendChild(OB.html("span", "runs-bolt", boltSvg()));
    c.title = B.STATES[s] + ", " + B.ACTIONS[a] + (breakdown ? ", breakdown" : "");
    return c;
  }

  function row(run, i, opts) {
    opts = opts || {};
    var r = el("div", "runs-row");
    if (opts.label !== false) r.appendChild(el("span", "runs-no", String(i + 1)));
    var cs = el("span", "runs-cells"), cells = [];
    for (var t = 0; t < run.actions.length; t++) {
      var c = cell(run.states[t], run.actions[t], run.faces[t] === "breakdown");
      cs.appendChild(c);
      cells.push(c);
    }
    r.appendChild(cs);
    r.cells = cells;
    if (opts.g1 !== false) {
      var g = OB.moneyEl(run.G1, opts.places || 0);
      g.classList.add("runs-g1", "ob-hide");
      r.appendChild(g);
      r.g1 = g;
    }
    return r;
  }

  function rowsBlock(runs, opts) {
    var b = el("div", "runs-block rows");
    b.runs = runs;
    b.rows = [];
    b.cells = [];
    b.g1s = [];
    var weeks = runs.length ? runs[0].actions.length : B.WEEKS;
    if (opts.head !== false) {
      var h = el("div", "runs-row runs-head");
      if (opts.label !== false) h.appendChild(el("span", "runs-no", ""));
      var hs = el("span", "runs-cells");
      for (var t = 0; t < weeks; t++) hs.appendChild(el("span", "runs-wk", String(t + 1)));
      h.appendChild(hs);
      if (opts.g1 !== false) {
        b.g1head = OB.html("span", "runs-g1 runs-g1h ob-hide", "G<sub>1</sub>");
        h.appendChild(b.g1head);
      }
      b.appendChild(h);
    }
    runs.forEach(function (run, i) {
      var r = row(run, i, opts);
      b.appendChild(r);
      b.rows.push(r);
      b.cells.push(r.cells);
      if (r.g1) b.g1s.push(r.g1);
    });
    return b;
  }

  /* Compact: a canvas with one line per run (13 columns of the state colours), and a G1 column of bars. */
  function compactBlock(runs, opts) {
    var b = el("div", "runs-block compact");
    b.runs = runs;
    var n = runs.length, weeks = n ? runs[0].actions.length : B.WEEKS;
    var H = opts.height || Math.min(320, n), W = opts.width || weeks * 8;
    var rowPx = n <= H ? Math.max(1, Math.floor(H / n)) : 1;
    var cv = el("canvas", "runs-canvas");
    cv.width = weeks;
    cv.height = n * rowPx;
    cv.style.width = W + "px";
    cv.style.height = (n <= H ? n * rowPx : H) + "px";
    if (n > H) cv.classList.add("blend");
    var g = cv.getContext("2d");
    runs.forEach(function (run, i) {
      for (var t = 0; t < weeks; t++) {
        g.fillStyle = WEAR[run.states[t]];
        g.fillRect(t, i * rowPx, 1, rowPx);
      }
    });
    b.appendChild(cv);
    b.canvas = cv;
    if (opts.g1 !== false) {
      var gw = 64, gc = el("canvas", "runs-g1col ob-hide");
      gc.width = gw;
      gc.height = n * rowPx;
      gc.style.width = Math.round(W * 0.9) + "px";
      gc.style.height = cv.style.height;
      if (n > H) gc.classList.add("blend");
      var m = 1;
      runs.forEach(function (run) { m = Math.max(m, Math.abs(run.G1)); });
      var lo = 0, hi = 0;
      runs.forEach(function (run) { lo = Math.min(lo, run.G1); hi = Math.max(hi, run.G1); });
      var span = Math.max(1, hi - lo), x0 = Math.round((0 - lo) / span * (gw - 2)) + 1;
      var gg = gc.getContext("2d");
      runs.forEach(function (run, i) {
        var x1 = Math.round((run.G1 - lo) / span * (gw - 2)) + 1;
        gg.fillStyle = run.G1 >= 0 ? "#1F7A45" : "#C0302A";
        gg.fillRect(Math.min(x0, x1), i * rowPx, Math.max(1, Math.abs(x1 - x0)), rowPx);
      });
      gg.fillStyle = art.C.ink;
      gg.fillRect(x0, 0, 1, n * rowPx);
      b.appendChild(gc);
      b.g1col = gc;
    }
    return b;
  }

  function block(runs, opts) {
    opts = opts || {};
    var compact = opts.compact === undefined ? runs.length > 20 : !!opts.compact;
    return compact ? compactBlock(runs, opts) : rowsBlock(runs, opts);
  }

  function showG1(b, on, api, opts) {
    opts = opts || {};
    var show = api ? api.show : OB.show;
    var moving = api && !api.instant;
    if (b.g1col) { show(b.g1col, on !== false, { delay: opts.delay || 0 }); return; }
    if (b.g1head) show(b.g1head, on !== false, { delay: opts.delay || 0 });
    var st = opts.stagger === undefined ? 140 : opts.stagger;
    b.g1s.forEach(function (g, i) {
      show(g, on !== false, moving ? { delay: (opts.delay || 0) + i * st } : undefined);
    });
  }

  function legend(opts) {
    opts = opts || {};
    var l = el("div", "runs-legend");
    if (opts.states !== false) {
      for (var s = 0; s < 4; s++) {
        var it = el("span", "runs-key");
        it.appendChild(el("span", "runs-swatch w" + s));
        it.appendChild(el("span", "", B.STATES[s]));
        l.appendChild(it);
      }
    }
    if (opts.actions !== false) {
      for (var a = 0; a < 3; a++) {
        var ia = el("span", "runs-key");
        ia.appendChild(OB.html("span", "runs-gl", art.glyph(a, 16)));
        ia.appendChild(el("span", "", B.ACTIONS[a]));
        l.appendChild(ia);
      }
    }
    if (opts.breakdown !== false) {
      var ib = el("span", "runs-key");
      ib.appendChild(OB.html("span", "runs-gl", boltSvg()));
      ib.appendChild(el("span", "", "BREAKDOWN"));
      l.appendChild(ib);
    }
    return l;
  }

  OB.runs = { play: play, block: block, showG1: showG1, row: row, cell: cell, legend: legend };
})();
</script>
<script>/* tables.js */
/* tables.js: the bets table W, the probability table and a strict strategy's column, for page 3 of "Old Bessie"
   (agent A4b, 2026-11-14). Agents A4a, A5 and A6 reuse it; the API below is stable.

   Rows are the states HEALTHY, WORN, SHAKY, FAILING (S1 to S4), top to bottom, each with the van of art.js. Columns
   are the actions RUN, SERVICE, REPLACE (a1 to a3), left to right, each with its glyph and lever colour. Sizes are
   plain px (tables keep their size on large screens, the rule of core.css); a phone (below 561 px) gets smaller cells.

   Motion. Every call sets its end state at once and animates through the engine's helpers (OB.roll, OB.fade, OB.fly,
   OB.ring, OB.animate, OB.at), so it moves only when the current beat allows motion (the reader came with Next) and
   the engine finishes it when the reader moves on. Build tables in build(); change them in beat().

   OB.tables.table(values, opts) -> T
     values      4 rows of 3 numbers (exact values: the table rounds them for display), or null (empty cells); a row
                 or a cell may be null too
     opts.kind   "bets" (signed, 2 decimals), "prob" (2 decimals, each cell's chance also drawn as a bar),
                 "exp" (3 decimals: the first step of softmax)
     opts.size   "l" (default), "m", or "s" (a compact table for a diagram)
     opts.heads  true (default): vans on the left, actions on top; "top": actions only; "side": vans only; false
     opts.sum    true: a column at the right for the rows' sums, empty until T.sum fills it
     opts.rows   the states drawn, default [0, 1, 2, 3]
     opts.cap    a caption under the table, e.g. "BETS TABLE W" (HTML allowed)
     opts.places the decimals, in place of the kind's
   T.el                        the element (div.tb); append it where you want it
   T.cell(s, a), T.num(s, a)   a cell and its number (a span); T.side(s) a row's van; T.top(a) an action's head;
                               T.rowFrame(s), T.colFrame(a) frames over a row's or a column's cells (ring these);
                               T.sumCell(s); T.cap (the caption element)
   T.get(s, a), T.values()     the exact numbers held now (null where empty)
   T.set(values, o)            every cell to values (null empties). A changed cell rolls to its new number, an empty
                               cell fades its number in. o.delay (ms), o.stagger (ms from row to row), o.cstagger
                               (ms from cell to cell), o.from (a number: empty cells roll from it, e.g. 0), o.now
                               (true: no motion, for a cell that a fly lands on)
   T.setRow(s, row, o), T.setCell(s, a, v, o)   the same for one row or one cell
   T.sum(s, v, o)              the sum v of row s in the sum column (null hides it); a "prob" sum also draws the row's
                               chances as one full bar. o.delay
   T.rings(list)               exactly these blinking rings: [s, a] a cell, [s, null] a row, [null, a] a column;
                               rings already on stay on without blinking again; [] or null clears them
   T.ring(s, a, on)            one ring on (default) or off
   T.mark(list)                lights cells ([s, a]) or rows ([s, null]) in yellow and dims the other numbers; [] clears
   T.show(on, o), T.fade(on, o)  the whole table: show (fades in if hidden; off hides at once), or fade in or out
   T.zoom(s, a, o) -> Z        a large copy of a cell in a box, not attached: Z.el, Z.num, Z.cap; o.cap (a caption
                               above, "BEFORE"), o.value (default the cell's), o.head (false: no state and action chips)
   T.lift(s, a, Z, o)          rings the cell, then a copy of it flies out and grows into Z.el (o.delay, default 600)
   OB.tables.column(policy, opts) -> C   a strict strategy (B.BEST, a column of four actions): C.el, C.entry(s) (the
                               cell, clickable), C.chip(s), C.side(s), C.get(s), C.values(), C.set(s, a) (the new chip
                               fades in), C.rings(list of states); opts.size, opts.heads (vans, default true), opts.cap
                               (default "STRATEGY"), opts.rows. A column and a table of the same size line up row by
                               row when their tops align (the same head height and row height).
   OB.tables.fmt(kind, x, places)   a number as a table of that kind writes it ("-0.60", "0.47", "1.492")
   OB.tables.PLACES            { bets: 2, prob: 2, exp: 3 }
   OB.tables.chances(row)      B.softmax(row), the exact chances of a row of bets */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, art = OB.art;
  var PLACES = { bets: 2, prob: 2, exp: 3 };
  var VAN = { l: 64, m: 54, s: 40 };
  var GLY = { l: 22, m: 20, s: 15 };
  var NAMES = (B && B.ACTIONS) || ["RUN", "SERVICE", "REPLACE"];

  function el(tag, cls, text) { return OB.el(tag, cls, text); }
  function fmt(kind, x, places) {
    var p = places !== undefined ? places : (PLACES[kind] !== undefined ? PLACES[kind] : 2);
    return OB.num(x, p);
  }
  /* The formatter of a roll: an intermediate value drops decimals rather than show more characters than cap, so a
     number never grows wider than the cell's ends while it rolls (-0.60 rolling to 0.549 shows -0.60, -0.31, 0.012). */
  function capped(F, cap) {
    return function (x) {
      var s = F(x), p = (s.split(".")[1] || "").length;
      while (s.length > cap && p > 0) { p--; s = OB.num(x, p); }
      return s;
    };
  }
  function place(e, row, col) { e.style.gridRow = String(row); e.style.gridColumn = String(col); }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function resolved() { return Promise.resolve(); }

  /* The head of an action: its glyph and name, in its lever colour. */
  function actionHead(a, size) {
    var h = el("div", "tb-ah a" + a);
    h.appendChild(OB.html("span", "tb-gl", art.glyph(a, GLY[size] || 22)));
    h.appendChild(el("span", "tb-an", NAMES[a]));
    return h;
  }
  /* The head of a row: the van of art.js and the state's name (no name in the compact size). */
  function stateHead(s, size) {
    var h = el("div", "tb-sv s" + s);
    h.appendChild(art.van(s, { size: VAN[size] || 64, gauge: false, label: size !== "s" }));
    return h;
  }

  /* A table: bets, probabilities or exponentials. */
  function table(values, opts) {
    opts = opts || {};
    var kind = opts.kind || "bets", size = opts.size || "l";
    var heads = opts.heads === undefined ? true : opts.heads;
    var side = heads === true || heads === "side", top = heads === true || heads === "top";
    var rows = opts.rows || [0, 1, 2, 3];
    var F = function (x) { return fmt(kind, x, opts.places); };
    var T = { kind: kind, size: size, rows: rows.slice() };
    var root = el("div", "tb tb-" + kind + " tb-" + size);
    var grid = el("div", "tb-grid");
    var c0 = side ? 2 : 1, r0 = top ? 2 : 1;
    grid.style.gridTemplateColumns = (side ? "var(--tb-hw) " : "") + "repeat(3, var(--tb-cw))" +
      (opts.sum ? " var(--tb-sg) var(--tb-sw)" : "");
    grid.style.gridTemplateRows = (top ? "var(--tb-hh) " : "") + "repeat(" + rows.length + ", var(--tb-rh))";
    var cells = [[], [], [], []], vals = [[null, null, null], [null, null, null], [null, null, null], [null, null, null]];
    var sides = [], tops = [], rframes = [], cframes = [], sums = [], sumv = [null, null, null, null];

    if (top) {
      for (var a = 0; a < 3; a++) { var h = actionHead(a, size); place(h, 1, c0 + a); grid.appendChild(h); tops[a] = h; }
      if (opts.sum) { var sh = el("div", "tb-sh", "SUM"); place(sh, 1, c0 + 4); grid.appendChild(sh); }
    }
    rows.forEach(function (s, r) {
      if (side) { var sv = stateHead(s, size); place(sv, r0 + r, 1); grid.appendChild(sv); sides[s] = sv; }
      for (var a = 0; a < 3; a++) {
        var c = el("div", "tb-c s" + s + " a" + a + (a === 0 ? " fc" : "") + (r === 0 ? " fr" : "") + " empty");
        var inn = el("div", "tb-in");
        var n = el("span", "tb-n");
        inn.appendChild(n);
        var bar = null;
        if (kind === "prob") { bar = el("div", "tb-bar"); bar.appendChild(el("i")); inn.appendChild(bar); }
        c.appendChild(inn);
        place(c, r0 + r, c0 + a);
        grid.appendChild(c);
        cells[s][a] = { el: c, inn: inn, n: n, bar: bar };
      }
      var rf = el("div", "tb-rf");
      rf.style.gridRow = String(r0 + r);
      rf.style.gridColumn = c0 + " / " + (c0 + 3);
      grid.appendChild(rf);
      rframes[s] = rf;
      if (opts.sum) {
        var sc = el("div", "tb-c tb-sum s" + s + (r === 0 ? " fr" : "") + " empty");
        var si = el("div", "tb-in");
        var sn = el("span", "tb-n");
        si.appendChild(sn);
        var sb = null;
        if (kind === "prob") {
          sb = el("div", "tb-bar tb-sbar");
          for (var q = 0; q < 3; q++) sb.appendChild(el("i", "a" + q));
          si.appendChild(sb);
        }
        sc.appendChild(si);
        place(sc, r0 + r, c0 + 4);
        grid.appendChild(sc);
        sums[s] = { el: sc, inn: si, n: sn, bar: sb };
      }
    });
    for (var ca = 0; ca < 3; ca++) {
      var cf = el("div", "tb-cf");
      cf.style.gridRow = r0 + " / " + (r0 + rows.length);
      cf.style.gridColumn = String(c0 + ca);
      grid.appendChild(cf);
      cframes[ca] = cf;
    }
    root.appendChild(grid);
    if (opts.cap) { T.cap = OB.html("div", "tb-cap", opts.cap); root.appendChild(T.cap); }
    T.el = root;
    T.grid = grid;

    function barTo(c, p) { if (c && c.bar) c.bar.firstChild.style.width = (Math.max(0, Math.min(1, p)) * 100).toFixed(2) + "%"; }

    /* One cell to v: roll from the old number, fade in when it was empty (or roll from o.from). */
    T.setCell = function (s, a, v, o) {
      o = o || {};
      var c = cells[s] && cells[s][a];
      if (!c) return resolved();
      var old = vals[s][a];
      if (!isNum(v)) {
        vals[s][a] = null;
        c.n.textContent = "";
        delete c.n.dataset.v;
        barTo(c, 0);
        c.el.classList.add("empty");
        c.inn.classList.remove("ob-hide");
        c.inn.style.opacity = "";
        return resolved();
      }
      vals[s][a] = v;
      c.el.classList.remove("empty");
      if (o.now) {
        c.n.textContent = F(v);
        c.n.dataset.v = String(v);
        barTo(c, v);
        c.inn.classList.remove("ob-hide");
        c.inn.style.opacity = "";
        return resolved();
      }
      var from = isNum(old) ? old : (isNum(o.from) ? o.from : null);
      var delay = o.delay || 0;
      if (from === null) {
        c.n.textContent = F(v);
        c.n.dataset.v = String(v);
        barTo(c, v);
        return OB.fade(c.inn, true, { delay: delay, dur: o.dur });
      }
      if (from === v && isNum(old)) { c.n.textContent = F(v); c.n.dataset.v = String(v); barTo(c, v); return resolved(); }
      c.inn.classList.remove("ob-hide");
      c.inn.style.opacity = "";
      var dur = o.dur || OB.DUR.roll;
      if (c.bar) {
        barTo(c, from);
        OB.at(delay, function () {
          OB.animate(dur, function (p) { barTo(c, from + (v - from) * p); }, function () { barTo(c, v); });
        });
      }
      var cap = Math.max(F(v).length, isNum(old) ? F(old).length : 0);
      return OB.roll(c.n, v, { from: from, fmt: capped(F, cap), delay: delay, dur: dur });
    };
    T.setRow = function (s, row, o) {
      o = o || {};
      var ps = [];
      for (var a = 0; a < 3; a++) {
        var oo = {}; for (var k in o) oo[k] = o[k];
        oo.delay = (o.delay || 0) + a * (o.cstagger || 0);
        ps.push(T.setCell(s, a, row ? row[a] : null, oo));
      }
      return Promise.all(ps);
    };
    T.set = function (values, o) {
      o = o || {};
      var ps = [];
      rows.forEach(function (s, r) {
        var oo = {}; for (var k in o) oo[k] = o[k];
        oo.delay = (o.delay || 0) + r * (o.stagger || 0);
        ps.push(T.setRow(s, values ? values[s] : null, oo));
      });
      return Promise.all(ps);
    };
    T.get = function (s, a) { return vals[s][a]; };
    T.values = function () { return vals.map(function (r) { return r.slice(); }); };

    /* The sum of a row, in the sum column. */
    T.sum = function (s, v, o) {
      o = o || {};
      var c = sums[s];
      if (!c) return resolved();
      var old = sumv[s];
      if (!isNum(v)) {
        sumv[s] = null;
        c.n.textContent = "";
        c.el.classList.add("empty");
        c.inn.classList.add("ob-hide");
        return resolved();
      }
      sumv[s] = v;
      c.el.classList.remove("empty");
      c.n.textContent = F(v);
      c.n.dataset.v = String(v);
      if (c.bar) {
        var row = vals[s], tot = 0, q;
        for (q = 0; q < 3; q++) tot += isNum(row[q]) ? row[q] : 0;
        for (q = 0; q < 3; q++) c.bar.children[q].style.width = (tot > 0 ? (isNum(row[q]) ? row[q] : 0) / tot * 100 : 0).toFixed(2) + "%";
      }
      if (old === v && !c.inn.classList.contains("ob-hide")) return resolved();
      if (isNum(old) && !c.inn.classList.contains("ob-hide")) return OB.roll(c.n, v, { from: old, fmt: F, delay: o.delay || 0 });
      if (!c.inn.classList.contains("ob-hide")) c.inn.classList.add("ob-hide");
      return OB.show(c.inn, true, { delay: o.delay || 0 });
    };
    // A sum cell starts hidden.
    sums.forEach(function (c) { if (c) c.inn.classList.add("ob-hide"); });

    /* Rings and marks. */
    var ringed = [];
    function target(s, a) {
      if (s === null || s === undefined) return cframes[a];
      if (a === null || a === undefined) return rframes[s];
      return cells[s] && cells[s][a] && cells[s][a].el;
    }
    T.rings = function (list) {
      var want = (list || []).map(function (p) { return target(p[0], p[1]); }).filter(Boolean);
      ringed.forEach(function (e) { if (want.indexOf(e) < 0) OB.ring(e, false); });
      want.forEach(function (e) { if (ringed.indexOf(e) < 0) OB.ring(e, true); });
      ringed = want;
    };
    T.ring = function (s, a, on) {
      var e = target(s, a);
      if (!e) return;
      var i = ringed.indexOf(e);
      if (on === false) { if (i >= 0) ringed.splice(i, 1); OB.ring(e, false); return; }
      if (i < 0) { ringed.push(e); OB.ring(e, true); }
    };
    T.mark = function (list) {
      list = list || [];
      rows.forEach(function (s) { for (var a = 0; a < 3; a++) cells[s][a].el.classList.remove("lit"); });
      list.forEach(function (p) {
        var s = p[0], a = p[1];
        if (!cells[s] || !cells[s][0]) return;
        if (a === null || a === undefined) { for (var q = 0; q < 3; q++) cells[s][q].el.classList.add("lit"); }
        else if (cells[s][a]) cells[s][a].el.classList.add("lit");
      });
      root.classList.toggle("tb-dim", list.length > 0);
    };

    /* The whole table. */
    T.show = function (on, o) { return OB.show(root, on, o); };
    T.fade = function (on, o) { return OB.fade(root, on, o); };

    /* Elements. */
    T.cell = function (s, a) { return cells[s] && cells[s][a] ? cells[s][a].el : null; };
    T.num = function (s, a) { return cells[s] && cells[s][a] ? cells[s][a].n : null; };
    T.side = function (s) { return sides[s] || null; };
    T.top = function (a) { return tops[a] || null; };
    T.rowFrame = function (s) { return rframes[s] || null; };
    T.colFrame = function (a) { return cframes[a] || null; };
    T.sumCell = function (s) { return sums[s] ? sums[s].el : null; };

    /* A large copy of a cell in a box, and the motion that lifts the cell into it. */
    T.zoom = function (s, a, o) {
      o = o || {};
      var Z = { el: el("div", "tb-zoom ob-box white tb-" + kind) };
      if (o.cap) { Z.cap = OB.html("div", "tb-zcap", o.cap); Z.el.appendChild(Z.cap); }
      if (o.head !== false) {
        var hd = el("div", "tb-zhead");
        hd.appendChild(art.stateChip(s));
        hd.appendChild(art.actionChip(a));
        Z.el.appendChild(hd);
      }
      var v = o.value !== undefined ? o.value : vals[s][a];
      Z.num = el("span", "tb-zn", isNum(v) ? F(v) : "");
      if (isNum(v)) Z.num.dataset.v = String(v);
      Z.el.appendChild(Z.num);
      Z.fmt = F;
      return Z;
    };
    T.lift = function (s, a, Z, o) {
      o = o || {};
      var c = T.cell(s, a);
      if (!c || !Z) return resolved();
      T.ring(s, a, true);
      return OB.fly(c, Z.el, { delay: o.delay === undefined ? 600 : o.delay, arc: o.arc === undefined ? 30 : o.arc, dur: o.dur });
    };

    T.set(values || null);
    return T;
  }

  /* A strict strategy as a column: one action per state, the state's van on the left. */
  function column(policy, opts) {
    opts = opts || {};
    var size = opts.size || "l", rows = opts.rows || [0, 1, 2, 3], side = opts.heads !== false;
    var C = { size: size, rows: rows.slice() };
    var root = el("div", "tb tb-col tb-" + size);
    var grid = el("div", "tb-grid");
    grid.style.gridTemplateColumns = (side ? "var(--tb-hw) " : "") + "var(--tb-ew)";
    grid.style.gridTemplateRows = "var(--tb-hh) repeat(" + rows.length + ", var(--tb-rh))";
    var c0 = side ? 2 : 1;
    var head = el("div", "tb-eh", opts.top || "ACTION");
    place(head, 1, c0);
    grid.appendChild(head);
    var entries = [], chips = [], sides = [], acts = [null, null, null, null];
    rows.forEach(function (s, r) {
      if (side) { var sv = stateHead(s, size); place(sv, 2 + r, 1); grid.appendChild(sv); sides[s] = sv; }
      var e = el("div", "tb-e s" + s + (r === 0 ? " fr" : ""));
      place(e, 2 + r, c0);
      grid.appendChild(e);
      entries[s] = e;
    });
    root.appendChild(grid);
    C.cap = OB.html("div", "tb-cap", opts.cap === undefined ? "STRATEGY" : opts.cap);
    if (opts.cap !== "") root.appendChild(C.cap);
    C.el = root;
    C.grid = grid;

    C.set = function (s, a) {
      var e = entries[s];
      if (!e) return resolved();
      if (acts[s] === a && chips[s]) return resolved();
      acts[s] = a;
      e.textContent = "";
      if (typeof a !== "number") { chips[s] = null; return resolved(); }
      var chip = art.actionChip(a);
      e.appendChild(chip);
      chips[s] = chip;
      return OB.fade(chip, true);
    };
    C.get = function (s) { return acts[s]; };
    C.values = function () { return acts.slice(); };
    C.entry = function (s) { return entries[s] || null; };
    C.chip = function (s) { return chips[s] || null; };
    C.side = function (s) { return sides[s] || null; };
    var ringed = [];
    C.rings = function (list) {
      var want = (list || []).map(function (s) { return entries[s]; }).filter(Boolean);
      ringed.forEach(function (e) { if (want.indexOf(e) < 0) OB.ring(e, false); });
      want.forEach(function (e) { if (ringed.indexOf(e) < 0) OB.ring(e, true); });
      ringed = want;
    };
    rows.forEach(function (s) { C.set(s, policy ? policy[s] : null); });

  }

    table: table,

    PLACES: PLACES,
    chances: function (row) { return B.softmax(row); }

})();

<script>/* sec3a-data.js */
/* sec3a-data.js: the numbers and the number-bearing words of "Try it", page 3, scenes 100 to 199 (agent A4a,
   2026-11-14). All numbers come from bessie.js. In the browser OB.s3a (this file loads after core.js and before
   sec3a.js); in node require("./sec3a-data.js"), which tools/check_try.js uses to assert every number the scene shows.

   Every try plays its strategy on the same dice, B.dice(B.TRY.diceSeed, B.TRY.n): ten runs of 13 weeks from HEALTHY.
   A strict strategy spends each week's first number (the action's) without using it, so every try meets the same
   luck, and a change in the average G1 comes from the change in the strategy alone. A try's runs stay the same when
   no run uses the changed entries (no run takes an action in their states): verdict() says so.

   The scene writes dollars with OB.money (whole dollars); the functions that write words take that formatter as an
   argument, so the check can call them with a copy of it. */
(function (root) {
  "use strict";
  var node = typeof module !== "undefined" && module.exports;
  var B = node ? require("./bessie.js") : root.B;

  var N = B.TRY.n, SEED = B.TRY.diceSeed;
  var dice = B.dice(SEED, N);
  var START = [B.RUN, B.RUN, B.RUN, B.RUN];
  var BAR = "<span class=\"ob-bar\">G<sub>1</sub></span>";
  var G1 = "G<sub>1</sub>";

  /* A try: the ten runs of the strategy col on the dice, their G1 and their average. */
  function play(col) {
    var runs = [], sum = 0;
    for (var i = 0; i < N; i++) {
      var r = B.playRun(col, dice, i);
      runs.push(r);
      sum += r.G1;
    }
    return { col: col.slice(), runs: runs, g1: runs.map(function (r) { return r.G1; }), avg: sum / N };
  }
  /* The states in which some run takes an action (its 13 weeks; the state after the last week takes none). */
  function visited(t) {
    var v = [false, false, false, false];
    t.runs.forEach(function (r) { for (var w = 0; w < r.actions.length; w++) v[r.states[w]] = true; });
    return v;
  }
  function sameRuns(a, b) {
    if (a.runs.length !== b.runs.length) return false;
    for (var i = 0; i < a.runs.length; i++) {
      var x = a.runs[i], y = b.runs[i];
      if (x.states.join() !== y.states.join() || x.actions.join() !== y.actions.join() || x.rewards.join() !== y.rewards.join()) return false;
    }
    return true;
  }
  /* The states whose entries differ between two strategies. */
  function changed(colA, colB) { return [0, 1, 2, 3].filter(function (s) { return colA[s] !== colB[s]; }); }

  /* How a try compares with the try before it. kind: "same-strategy", "same-runs" (the changed states are reached by
     no run, listed in states), "higher", "lower", or "equal" (different runs, the same whole dollars). */
  function verdict(prev, cur, money) {
    var ch = changed(prev.col, cur.col);
    if (!ch.length) return { kind: "same-strategy", states: [] };
    if (sameRuns(prev, cur)) return { kind: "same-runs", states: ch };
    var a = money(cur.avg), b = money(prev.avg);
    if (a === b) return { kind: "equal", states: ch };
    return { kind: cur.avg > prev.avg ? "higher" : "lower", states: ch };
  }

  /* The words of the scene, by step. edit: the column can be changed (n: the tries in the list, 0, 1 or more; the
     line about the same luck is said once, on the first return to the column); runs, g1, avg: the steps of a try.
     prev: the try to compare with (null in the first try). */
  function words(step, cur, prev, money, n) {
    if (step === "edit") {
      if (!n) return "A strategy: one action per state. Tap an entry to change it, then press Done.";
      if (n === 1) return "Change one entry, then press Done. Every try meets the same luck: a change in the average comes from the strategy alone.";
      return "Change one entry, then press Done. Can you raise the average?";
    }
    if (step === "runs") {
      if (!prev) return "Ten runs with this strategy: one row per run, one cell per week.";
      return "Ten runs with this strategy and the same luck as before.";
    }
    if (step === "g1") {
      if (!prev) return "The " + G1 + " of each run. What is their average? Guess, then press Compute.";
      return "The " + G1 + " of each run. Is their average higher than the last try's? Guess, then press Compute.";
    }
    var X = BAR + " = " + money(cur.avg);
    if (!prev) return "Their average: " + X + ".";
    var v = verdict(prev, cur, money), Y = money(prev.avg);
    if (v.kind === "same-strategy") return "The same strategy meets the same luck: the same runs and the same average, " + X + ".";
    if (v.kind === "same-runs") {
      return "No run used the " + (v.states.length > 1 ? "entries" : "entry") + " you changed: the same runs and the same average, " + X + ".";
    }
    if (v.kind === "equal") return "Their average: " + X + ", the same to the dollar as the last try's.";
    return "Their average: " + X + ", " + v.kind + " than the last try's " + Y + ".";
  }

  var D = {
    N: N, SEED: SEED, dice: dice, START: START, BAR: BAR,

<script>/* sec3a.js */
/* sec3a.js: page 3, "Try it", scenes 100 to 199 (agent A4a, 2026-11-14), from Carlos's sketch page 24: the strategy
   as a column, "Old Bessie", then its runs, each run's G1, their average, and back to the column to try again.

   100 try-card  the card of this part.
   110 try       5 beats (counted from 0 here; the deep link counts from 1):
                 0 the column, RUN everywhere at first: a tap on an entry rings it and opens a keypad of the three
                   actions, a press sets the entry, Done plays the column;
                 1 its ten runs on the dice of sec3a-data.js; 2 each run's G1; 3 their average;
                 4 back to the column: the try joins the list of tries (its column in small and its average); change
                   one entry and press Done to try again.

   The loop lives inside the scene. Done, or Next at beat 4 after a change, plays the column from beat 1 again with
   OB.go(index, 1, { forward: true }) (the third argument of go is the one Next uses), so the runs, the G1 and the
   average move as on a press of Next. At beat 4 without a change, Next goes on to the next scene. The scene keeps its
   state on the spec (S: the column, the tries, whether the column's try is the last in the list), so Back, the pager
   and a deep link show their beat with the column of now; a deep link to beat 5 of a fresh page puts the first try,
   RUN everywhere, in the list. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, el = OB.el, D = OB.s3a;
  var SHOWN = 6;                                   // tries shown in the list; the best one is always among them
  var STEP = ["edit", "runs", "g1", "avg", "edit"];

  function vis(e, on) { if (!e) return; e.classList.toggle("ob-hide", !on); e.style.opacity = ""; }
  function money0(x) { return OB.money(x); }
  function keyOf(col) { return col.join(""); }

  OB.scene({
    page: 3, key: "try-card", order: 100, title: "Try it",
    card: { kicker: "REINFORCE", title: "Try it", line: "Pick a strategy, play ten runs and read their average. Then change one entry and try again.", wear: 0 }
  });

  OB.scene({
    page: 3, key: "try", order: 110, title: "Try a strategy", beats: 5,

    build: function (root) {
      var self = this, P = this.P = {};
      this.S = { col: D.START.slice(), tries: [], filed: false, sel: -1 };
      this.cache = {};
      this.k = 0;
      this.editing = false;
      this.loopOn = false;
      this.loopP = 1;

      P.lead = OB.html("p", "ob-say s3a-lead", "");
      root.appendChild(P.lead);
      var dia = P.dia = el("div", "s3a-dia");

      // The column, "Old Bessie", and its keypad (beside the column on a desk, under it on a phone).
      var colW = P.colW = el("div", "s3a-colw");
      var C = P.C = OB.tables.column(D.START, { size: "m", top: "OLD BESSIE" });
      colW.appendChild(C.el);
      var pad = P.pad = el("div", "s3a-pad ob-gone");
      pad.setAttribute("role", "group");
      pad.setAttribute("aria-label", "Choose an action");
      P.keys = [0, 1, 2].map(function (a) {
        var b = el("button", "s3a-key a" + a);
        b.type = "button";
        b.innerHTML = OB.art.glyph(a, 18);
        b.appendChild(document.createTextNode(B.ACTIONS[a]));
        b.addEventListener("click", function (e) { self.press(a, e); });
        pad.appendChild(b);
        return b;
      });
      colW.appendChild(pad);
      [0, 1, 2, 3].forEach(function (s) {
        var e = C.entry(s);
        e.addEventListener("click", function (ev) { self.tap(s, ev); });
        e.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); self.tap(s, ev); }
        });
      });
      dia.appendChild(colW);
      dia.appendChild(el("span", "s3a-arr s3a-a1"));

      // The runs: a block of ten rows, a dashed frame in its place while the column is being chosen.
      var runsW = el("div", "s3a-runsw");
      P.hold = el("div", "s3a-hold");
      P.ph = el("div", "s3a-ph", "?");
      P.hold.appendChild(P.ph);
      runsW.appendChild(P.hold);
      runsW.appendChild(el("div", "s3a-cap", "RUNS"));
      dia.appendChild(runsW);
      dia.appendChild(el("span", "s3a-arr s3a-a2"));

      // The average.
      var avgW = el("div", "s3a-avgw");
      P.avgBox = el("div", "ob-box white s3a-avgbox");
      P.avgBox.appendChild(OB.html("span", "s3a-sym", D.BAR));
      P.av = el("span", "s3a-av", "?");
      P.avgBox.appendChild(P.av);
      avgW.appendChild(P.avgBox);
      avgW.appendChild(el("div", "s3a-cap", "AVERAGE"));
      dia.appendChild(avgW);

      // Done under the column; the list of tries under the runs and the average.
      var ctl = el("div", "s3a-ctl");
      P.done = el("button", "ob-btn s3a-done", "Done");
      P.done.type = "button";
      P.done.addEventListener("click", function (e) {

      ctl.appendChild(P.done);
      dia.appendChild(ctl);
      var tries = el("div", "s3a-tries");
      P.tlab = el("span", "s3a-tlab", "TRIES");
      tries.appendChild(P.tlab);
      P.tlist = el("div", "s3a-tlist");
      tries.appendChild(P.tlist);
      dia.appendChild(tries);

      // The loop from the average back to the column (sketch page 24), drawn over the diagram.
      P.loop = OB.svgEl("svg", { "class": "ob-arrow s3a-loop", width: "1", height: "1", "aria-hidden": "true" });
      P.line = OB.svgEl("polyline", {});
      P.head = OB.svgEl("polygon", {});
      P.loop.appendChild(P.line);
      P.loop.appendChild(P.head);
      dia.appendChild(P.loop);
      root.appendChild(dia);

      this.ensureBlock(this.tryOf(D.START));
      this.renderTries();

      var redraw = function () { self.drawLoop(); self.placePad(); };

        ro.observe(P.avgBox);

    beat: function (k, api) {
      var P = this.P, S = this.S, self = this;
      this.api = api;
      this.k = k;
      this.closePad();
      var editing = k === 0 || k === 4;
      var live = api.forward && !api.instant && (k === 1 ? api.from === 0 || api.from === 4 : api.from === k - 1);
      // Beat 4 puts the try that beat 3 just showed in the list; a fresh deep link puts RUN everywhere there.
      var filing = false;
      if (k === 4 && !S.filed && (api.from === 3 || !S.tries.length)) {
        S.tries.push(this.tryOf(S.col));
        S.filed = true;
        filing = live;
      }
      this.setEditing(editing);
      var cur = this.tryOf(S.col);

      P.lead.innerHTML = D.words(STEP[k], cur, this.prevTry(), OB.money, S.tries.length);
      if (live) api.fade(P.lead, true, { dur: 900 });
      vis(P.done, editing);

      // The runs, under a dashed frame while the column is being chosen.
      var blk = editing ? P.block : this.ensureBlock(cur);
      if (editing) {
        if (filing) {
          vis(blk, true);
          vis(P.ph, false);
          api.fade(blk, false, { delay: 300 });
          api.show(P.ph, true, { delay: 1500 });

          vis(P.ph, true);
        }
      } else {
        vis(P.ph, false);
        vis(blk, true);

        if (live && k === 1) {
          // the rows appear one after another, each from week 1 to week 13
          blk.rows.forEach(function (r, i) {
            r.style.clipPath = "inset(0 100% 0 0)";
            api.at(i * 200, function () {
              api.animate(1200, function (p) { r.style.clipPath = "inset(0 " + (100 - 100 * p).toFixed(2) + "% 0 0)"; },
                function () { r.style.clipPath = ""; });
            });
          });

        if (live && k === 2) OB.runs.showG1(blk, true, api, { stagger: 200 });
        else {

          vis(blk.g1head, k >= 2);

      if (k === 3) {

          blk.g1s.forEach(function (g, i) { api.fly(g, P.av, { delay: 300 + i * 90, dur: 1400, arc: 30, scale: false }); });

    onkey: function (e) {

    },
    leave: function () { this.closePad(); },

    /* The try of a column, computed once. */

    },
    /* The try the current one is compared with: the last in the list, or the one before when the current try is it. */
    prevTry: function () {

    ensureBlock: function (tr) {

      b.classList.add("ob-hide");

    },
    setAv: function (x) {

      delete av.dataset.v;
      if (x === null) { av.className = "s3a-av"; av.textContent = "?"; return; }
      var r = +x.toFixed(0);
      av.className = "s3a-av ob-money" + (r > 0 ? " gain" : r < 0 ? " loss" : "");
      av.textContent = OB.money(x);
    },

    /* Editing the column: a tap rings an entry and opens the keypad, a press sets the entry. */
    setEditing: function (on) {
      var C = this.P.C;
      this.editing = on;
      this.P.colW.classList.toggle("s3a-edit", on);
      [0, 1, 2, 3].forEach(function (s) {
        var e = C.entry(s);
        if (on) { e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); }
        else { e.removeAttribute("tabindex"); e.removeAttribute("role"); }

    tap: function (s, ev) {
      if (!this.editing) return;

      if (this.S.sel === s) { this.closePad(); return; }
      this.openPad(s);
    },
    openPad: function (s) {
      var P = this.P, S = this.S;
      S.sel = s;
      P.C.rings([s]);
      P.keys.forEach(function (b, a) { b.setAttribute("aria-pressed", S.col[s] === a ? "true" : "false"); });
      P.pad.classList.remove("ob-gone");

    },

      if (!P || s < 0) return;

      var w = P.colW.getBoundingClientRect(), g = P.C.grid.getBoundingClientRect(), e = P.C.entry(s).getBoundingClientRect();
      if (!w.width) return;
      P.pad.style.left = Math.round(g.right - w.left + 14) + "px";
      P.pad.style.top = Math.round(Math.max(0, e.top + e.height / 2 - w.top - P.pad.offsetHeight / 2)) + "px";
    },
    closePad: function () {

    press: function (a, ev) {
