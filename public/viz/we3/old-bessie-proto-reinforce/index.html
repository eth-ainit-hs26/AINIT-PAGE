<script>/* tex.js */
/* tex.js: the formulas of "Old Bessie" in LaTeX's standard font, Computer Modern (agent T, 2026-11-16). Carlos: "Please
   use the LaTeX standard font whenever you show math formulas." KaTeX 0.16.11 (katex.js, katex.css, MIT) draws every
   formula and math symbol offline, in its two faces KaTeX_Main-Regular (upright: digits, signs, Greek capitals,
   nabla) and KaTeX_Math-Italic (italic letters and lowercase Greek), both in font/ and inlined by tools/build.py.
   Loaded after art.js, the skins and katex.js, before every section. ENGINE.md, section Formulas, has the rules.

   OB.tex(src)          the KaTeX HTML of the TeX src (a string; cached), for markup: "the " + OB.tex("G_1") + " of"
   OB.texEl(src, cls)   the same in an element: span.ob-tex (and cls)
   OB.texNum(s)         a number or an amount as OB.num and OB.money write it, as TeX: "$1,234.56" -> "\$1{,}234.56",
                        "-$243.36" -> "-\$243.36" (KaTeX draws the hyphen as the minus of a formula)
   OB.texArith(s)       arithmetic as the data files write it, as TeX: OB.texNum, and " x " becomes the times sign,
                        " / " a slash spaced like the other operators: "0.01 x 201" -> "0.01 \times 201"
   OB.texIn(markup)     markup whose formulas sit between \( and \): each drawn by KaTeX, the rest left as it is (the
                        text files sec3a-data.js and sec3c-text.js mark their formulas so, for node to check them)
   OB.texText(s)        a number shown outside KaTeX in the face of the formulas (class ob-texn; it rolls or flies):
                        its hyphen becomes the minus sign of the formulas
   OB.texFmt(f)         a formatter for api.roll that writes f(x) as OB.texText does
   OB.texNumEl(s, cls)  a number in the face of the formulas: span.ob-texn with OB.texText(s)
   art.sym(name), art.symEl(name)   gamma, alpha, epsilon (drawn as varepsilon), nabla and Sigma by KaTeX: markup, or
                        span.ob-symbox */
(function () {
  "use strict";
  var OB = window.OB, art = OB.art, K = window.katex;
  var MINUS = String.fromCharCode(8722);
  var OPTS = {
    output: "html", throwOnError: false, strict: false,
    /* \htmlClass only: it lets a formula mark a part of itself for a skin's highlight (scene 370's sign). */
    trust: function (c) { return c.command === "\\htmlClass"; }
  };
  var cache = Object.create(null);

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function tex(src) {
    var s = String(src);
    var h = cache[s];
    if (h === undefined) {
      if (K) {
        try { h = K.renderToString(s, OPTS); } catch (e) { if (window.console) console.error("OB.tex:", s, e); h = esc(s); }
      } else h = esc(s);
      cache[s] = h;
    }
    return h;
  }
  function texEl(src, cls) {
    var e = document.createElement("span");
    e.className = "ob-tex" + (cls ? " " + cls : "");
    e.innerHTML = tex(src);
    return e;
  }
  function texNum(s) { return String(s).replace(/\$/g, "\\$").replace(/,/g, "{,}"); }
  function texArith(s) {
    return texNum(s).replace(/ x /g, " \\times ").replace(/ \/ /g, " \\mathbin{/} ");
  }
  function texIn(markup) {
    return String(markup).replace(/\\\(([\s\S]+?)\\\)/g, function (m, src) { return tex(src); });
  }
  function texText(s) { return String(s).replace(/-/g, MINUS); }
  function texFmt(f) { return function (x) { return texText(f(x)); }; }
  function texNumEl(s, cls) {
    var e = document.createElement("span");
    e.className = "ob-texn" + (cls ? " " + cls : "");
    e.textContent = texText(s);
    return e;
  }

  OB.tex = tex;
  OB.texEl = texEl;
  OB.texNum = texNum;
  OB.texArith = texArith;
  OB.texIn = texIn;
  OB.texText = texText;
  OB.texFmt = texFmt;
  OB.texNumEl = texNumEl;

  /* The Greek letters of art.js, by KaTeX: the names of ENGINE.md, epsilon drawn as the textbooks' varepsilon. */
  var GREEK = { gamma: "\\gamma", alpha: "\\alpha", epsilon: "\\varepsilon", nabla: "\\nabla", Sigma: "\\Sigma" };
  art.sym = function (name) { return tex(GREEK[name] || name); };
  art.symEl = function (name) {
    var s = texEl(GREEK[name] || name, "ob-symbox");
    s.setAttribute("aria-label", name);
    return s;
  };
  art.TEX = GREEK;
})();
</script>
<script>/* runs.js */
/* runs.js: the episode symbol of "Old Bessie" (agent A3, 2026-11-14), drawn on pages 2 and 3. OB.runs (the names of
   this file and of its API keep the word run of 2026-11-14; the pages say episode since 2026-11-17, TERMINOLOGY.md).

   An episode is one row: one cell per week, the cell coloured by the van's state that week (the wear colours of
   core.css), the action's glyph small inside it (art.js, in ink), a breakdown marked by a small yellow bolt in the
   cell's corner, and at the end of the row a slot for the episode's return G1, hidden until a scene shows it. Many
   episodes are a block of rows. Up to 20 episodes (by default) are drawn as elements, one legible row each; more are
   drawn as a compact block on a canvas, one thin line per episode (1,000 episodes fit in a few hundred pixels), with
   an optional G1 column of thin bars.

   API (stable from 2026-11-14; additions only):

     OB.runs.play(policy, d, n)    the first n episodes (default d.n) of the dice d following policy: an array of
                                   B.playRun(policy, d, i), each { states, actions, rewards, faces, G1 }.
     OB.runs.block(runs, opts)     an element .runs-block that draws the episodes. opts (all optional):
         compact   true or false   default: runs.length > 20
         g1        true            rows: a G1 slot at the end of each row; compact: a G1 column of bars. Hidden
                                   (class ob-hide) until shown with OB.runs.showG1 or api.show
         head      true            rows: a line above the rows with the week numbers and the head "G1" of the slots
         label     true            rows: the episode's number at the left of its row (1, 2, 3, ...)
         places    0               decimals of the G1 slots (OB.money)
         height    0               compact: the block's height in px (default: 1 px an episode, at most 320 px)
         width     0               compact: the block's width in px (default 13 x 8 px)
       The element carries: .runs (the data), .rows[i] and .cells[i][t] (rows), .g1s[i] (the G1 slots of the rows),
       .g1head (the head "G1" over the slots), .canvas and .g1col (compact).
     OB.runs.showG1(block, on, api, opts)  shows (on true) or hides the G1 slots of a block: with api and motion one
                                   after another (opts.stagger ms, default 140; opts.delay ms); compact: the G1 column.
     OB.runs.row(run, i, opts)     one row element (as in a block of rows): .cells, .g1 (its slot)
     OB.runs.cell(s, a, breakdown) one cell element .runs-cell (state s, action a, a bolt when breakdown is true)
     OB.runs.legend(opts)          a line that explains the symbol: the four states' colours, the three glyphs and
                                   the bolt (opts.states, opts.actions, opts.breakdown: false leaves a part out)

   Sizes: the cell is --rc (CSS, about 29 px on a large screen, 18 px on a phone); a block of rows sets it with
   style.setProperty("--rc", "24px") if a scene needs another size. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, art = OB.art, el = OB.el;
  var WEAR = art.C.wear;

  /* The bolt of a breakdown: a 5 x 8 pixel spark, yellow with an ink outline. */
  var BOLT = [
    "..KKK",
    ".KYYK",
    ".KYK.",
    "KYYKK",
    "KYYYK",
    ".KYK.",
    ".KK..",
    "K...."
  ];
  function boltSvg() { return art.pixels(BOLT, { K: art.C.ink, Y: art.C.yellow }, 2); }

  function play(policy, d, n) {
    var out = [];
    n = n || d.n;
    for (var i = 0; i < n; i++) out.push(B.playRun(policy, d, i));
    return out;
  }

  function cell(s, a, breakdown) {
    var c = el("span", "runs-cell w" + s + (breakdown ? " bd" : ""));
    c.innerHTML = art.glyph(a, 16);
    if (breakdown) c.appendChild(OB.html("span", "runs-bolt", boltSvg()));
    c.title = B.STATES[s] + ", " + B.ACTIONS[a] + (breakdown ? ", breakdown" : "");
    return c;
  }

  function row(run, i, opts) {
    opts = opts || {};
    var r = el("div", "runs-row");
    if (opts.label !== false) r.appendChild(el("span", "runs-no", String(i + 1)));
    var cs = el("span", "runs-cells"), cells = [];
    for (var t = 0; t < run.actions.length; t++) {
      var c = cell(run.states[t], run.actions[t], run.faces[t] === "breakdown");
      cs.appendChild(c);
      cells.push(c);
    }
    r.appendChild(cs);
    r.cells = cells;
    if (opts.g1 !== false) {
      var g = OB.moneyEl(run.G1, opts.places || 0);
      g.classList.add("runs-g1", "ob-hide");
      r.appendChild(g);
      r.g1 = g;
    }
    return r;
  }

  function rowsBlock(runs, opts) {
    var b = el("div", "runs-block rows");
    b.runs = runs;
    b.rows = [];
    b.cells = [];
    b.g1s = [];
    var weeks = runs.length ? runs[0].actions.length : B.WEEKS;
    if (opts.head !== false) {
      var h = el("div", "runs-row runs-head");
      if (opts.label !== false) h.appendChild(el("span", "runs-no", ""));
      var hs = el("span", "runs-cells");
      for (var t = 0; t < weeks; t++) hs.appendChild(el("span", "runs-wk", String(t + 1)));
      h.appendChild(hs);
      if (opts.g1 !== false) {
        b.g1head = OB.html("span", "runs-g1 runs-g1h ob-hide", OB.tex("G_1"));
        h.appendChild(b.g1head);
      }
      b.appendChild(h);
    }
    runs.forEach(function (run, i) {
      var r = row(run, i, opts);
      b.appendChild(r);
      b.rows.push(r);
      b.cells.push(r.cells);
      if (r.g1) b.g1s.push(r.g1);
    });
    return b;
  }

  /* Compact: a canvas with one line per episode (13 columns of the state colours), and a G1 column of bars. */
  function compactBlock(runs, opts) {
    var b = el("div", "runs-block compact");
    b.runs = runs;
    var n = runs.length, weeks = n ? runs[0].actions.length : B.WEEKS;
    var H = opts.height || Math.min(320, n), W = opts.width || weeks * 8;
    var rowPx = n <= H ? Math.max(1, Math.floor(H / n)) : 1;
    var cv = el("canvas", "runs-canvas");
    cv.width = weeks;
    cv.height = n * rowPx;
    cv.style.width = W + "px";
    cv.style.height = (n <= H ? n * rowPx : H) + "px";
    if (n > H) cv.classList.add("blend");
    var g = cv.getContext("2d");
    runs.forEach(function (run, i) {
      for (var t = 0; t < weeks; t++) {
        g.fillStyle = WEAR[run.states[t]];
        g.fillRect(t, i * rowPx, 1, rowPx);
      }
    });
    b.appendChild(cv);
    b.canvas = cv;
    if (opts.g1 !== false) {
      var gw = 64, gc = el("canvas", "runs-g1col ob-hide");
      gc.width = gw;
      gc.height = n * rowPx;
      gc.style.width = Math.round(W * 0.9) + "px";
      gc.style.height = cv.style.height;
      if (n > H) gc.classList.add("blend");
      var m = 1;
      runs.forEach(function (run) { m = Math.max(m, Math.abs(run.G1)); });
      var lo = 0, hi = 0;
      runs.forEach(function (run) { lo = Math.min(lo, run.G1); hi = Math.max(hi, run.G1); });
      var span = Math.max(1, hi - lo), x0 = Math.round((0 - lo) / span * (gw - 2)) + 1;
      var gg = gc.getContext("2d");
      runs.forEach(function (run, i) {
        var x1 = Math.round((run.G1 - lo) / span * (gw - 2)) + 1;
        gg.fillStyle = run.G1 >= 0 ? "#1F7A45" : "#C0302A";
        gg.fillRect(Math.min(x0, x1), i * rowPx, Math.max(1, Math.abs(x1 - x0)), rowPx);
      });
      gg.fillStyle = art.C.ink;
      gg.fillRect(x0, 0, 1, n * rowPx);
      b.appendChild(gc);
      b.g1col = gc;
    }
    return b;
  }

  function block(runs, opts) {
    opts = opts || {};
    var compact = opts.compact === undefined ? runs.length > 20 : !!opts.compact;
    return compact ? compactBlock(runs, opts) : rowsBlock(runs, opts);
  }

  function showG1(b, on, api, opts) {
    opts = opts || {};
    var show = api ? api.show : OB.show;
    var moving = api && !api.instant;
    if (b.g1col) { show(b.g1col, on !== false, { delay: opts.delay || 0 }); return; }
    if (b.g1head) show(b.g1head, on !== false, { delay: opts.delay || 0 });
    var st = opts.stagger === undefined ? 140 : opts.stagger;
    b.g1s.forEach(function (g, i) {
      show(g, on !== false, moving ? { delay: (opts.delay || 0) + i * st } : undefined);
    });
  }

  function legend(opts) {
    opts = opts || {};
    var l = el("div", "runs-legend");
    if (opts.states !== false) {
      for (var s = 0; s < 4; s++) {
        var it = el("span", "runs-key");
        it.appendChild(el("span", "runs-swatch w" + s));
        it.appendChild(el("span", "", B.STATES[s]));
        l.appendChild(it);
      }
    }
    if (opts.actions !== false) {
      for (var a = 0; a < 3; a++) {
        var ia = el("span", "runs-key");
        ia.appendChild(OB.html("span", "runs-gl", art.glyph(a, 16)));
        ia.appendChild(el("span", "", B.ACTIONS[a]));
        l.appendChild(ia);
      }
    }
    if (opts.breakdown !== false) {
      var ib = el("span", "runs-key");
      ib.appendChild(OB.html("span", "runs-gl", boltSvg()));
      ib.appendChild(el("span", "", "BREAKDOWN"));
      l.appendChild(ib);
    }
    return l;
  }

  OB.runs = { play: play, block: block, showG1: showG1, row: row, cell: cell, legend: legend };
})();
</script>
<script>/* runs_tip.js */
/* runs_tip.js: the card of one week of an episode, on the cells of a block of episodes (main session, 2026-11-17).
   Carlos: "whenever I hover over one of the entries of the matrix describing the runs and what happens at each week,
   I want a description of what happened, what was the action taken, what was the state, what was the new state ...
   a pop-up showing me what happened there in a bit more detail, graphically, not a lot of text."

   OB.runs.tip(block) gives every cell of a block of rows (OB.runs.block, not compact) a card: the episode and the
   week; the van in its state S_t; the arrow with the action a_t; the van in the next state S_t+1; the reward $r_t of
   the week, and the bolt when the van broke down. A mouse shows it on hover; a touch screen on a tap, and a tap
   elsewhere hides it. One card for the page, fixed above the cell (below it when there is no room), inside the
   window; Escape, a scroll, a resize or a change of the hash hides it. Returns the block. Used by Try it (sec3a.js).

   Loaded after runs.js on pages 2 and 3 (the shells' pattern runs*.js; "runs.js" < "runs_tip.js"); nothing changes
   until a scene calls OB.runs.tip. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B;
  if (!OB || !OB.runs || !B) return;
  var el = OB.el, art = OB.art;
  var card = null, cur = null, timer = 0, lastType = "mouse";

  function phone() { return window.matchMedia && window.matchMedia("(max-width: 560px)").matches; }

  function make() {
    if (card) return card;
    card = el("div", "rt-card ob-box white");
    card.setAttribute("role", "tooltip");
    card.setAttribute("aria-hidden", "true");
    document.body.appendChild(card);
    return card;
  }

  /* A van with its symbol above it: S_t or S_t+1. */
  function stateCol(sym, s, px) {
    var c = el("div", "rt-st");
    c.appendChild(OB.html("span", "rt-sym", OB.tex(sym)));
    c.appendChild(art.van(s, { size: px, gauge: false, label: true }));
    return c;
  }

  function fill(run, i, t, cell) {
    var C = make(), s = run.states[t], a = run.actions[t], s2 = run.states[t + 1], r = run.rewards[t];
    var px = phone() ? 56 : 84, w = String(t + 1), w2 = String(t + 2);
    C.textContent = "";
    C.appendChild(el("div", "rt-head", "EPISODE " + (i + 1) + ", WEEK " + w));
    var f = el("div", "rt-flow");
    f.appendChild(stateCol("S_{" + w + "}", s, px));
    var m = el("div", "rt-mid");
    m.appendChild(OB.html("span", "rt-sym", OB.tex("a_{" + w + "}")));
    m.appendChild(art.actionChip(a));
    m.appendChild(el("span", "rt-arrow"));
    f.appendChild(m);
    f.appendChild(stateCol("S_{" + w2 + "}", s2, px));
    C.appendChild(f);
    var rw = el("div", "rt-rew");
    rw.appendChild(OB.html("span", "rt-rsym", OB.tex("\\$r_{" + w + "} =")));
    var mon = OB.moneyEl(r, 0);
    mon.classList.add("rt-money");
    rw.appendChild(mon);
    if (run.faces[t] === "breakdown") {
      var bd = el("span", "rt-bd");
      var bolt = cell.querySelector(".runs-bolt");
      if (bolt) { var b2 = bolt.cloneNode(true); b2.className = "rt-bolt"; bd.appendChild(b2); }
      bd.appendChild(el("span", "", "BREAKDOWN"));
      rw.appendChild(bd);
    }

  }

  /* Above the cell, centred on it, kept 8 px inside the window; below it when the top has no room. The caret points
     at the cell's centre. */
  function place(cell) {

    var cw = C.offsetWidth, ch = C.offsetHeight, gap = 12;
    var x = Math.max(8, Math.min(W - cw - 8, r.left + r.width / 2 - cw / 2));
    var below = r.top - gap - ch < 8;
    var y = below ? Math.min(H - ch - 8, r.bottom + gap) : r.top - gap - ch;
    C.style.left = Math.round(x) + "px";
    C.style.top = Math.round(y) + "px";
    C.classList.toggle("below", below);
    C.style.setProperty("--rt-cx", Math.round(r.left + r.width / 2 - x) + "px");
  }

  function show(b, i, t, cell) {
    clearTimeout(timer);
    if (cur && cur !== cell) cur.classList.remove("rt-cur");
    cur = cell;
    cell.classList.add("rt-cur");
    fill(b.runs[i], i, t, cell);
    card.classList.add("on");
    place(cell);
  }
  function hide() {
    clearTimeout(timer);
    if (cur) cur.classList.remove("rt-cur");
    cur = null;
    if (card) card.classList.remove("on");
  }
  /* A mouse that leaves a cell: the card waits a moment, so that moving to the next cell does not flicker. */
  function soon() { clearTimeout(timer); timer = setTimeout(hide, 90); }

  function tip(b) {
    if (!b || !b.cells || b.rtOn) return b;
    b.rtOn = true;
    b.classList.add("rt-on");
    b.cells.forEach(function (row, i) {
      row.forEach(function (c, t) {
        c.removeAttribute("title");
        c.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") show(b, i, t, c); });
        c.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse" && cur === c) soon(); });
        // A touch or a pen: the tap shows the card, a second tap on the same cell hides it (a mouse has its hover).
        c.addEventListener("pointerdown", function (e) { lastType = e.pointerType || "mouse"; });
        c.addEventListener("click", function () {
          if (lastType === "mouse") return;
          if (cur === c && card.classList.contains("on")) hide(); else show(b, i, t, c);
        });
      });
    });
    return b;
  }

  /* A press anywhere but on a cell of a block with cards hides the card (a tap elsewhere, Next, Back, the pager). */
  document.addEventListener("pointerdown", function (e) {
    if (!cur) return;
    var t = e.target;
    if (!(t && t.closest && t.closest(".rt-on .runs-cell"))) hide();
  }, true);
  document.addEventListener("keydown", function (e) { if (cur) hide(); }, true);
  window.addEventListener("scroll", function () { if (cur) hide(); }, true);
  window.addEventListener("resize", function () { if (cur) hide(); });
  window.addEventListener("hashchange", function () { if (cur) hide(); });

  OB.runs.tip = tip;
})();
</script>
<script>/* runs_vec.js */
/* runs_vec.js: the compact block of episodes drawn as vectors (design/arcade-marquee-motion, 2026-11-17). Loaded
   after runs.js (the pattern runs*.js). OB.runs.block keeps its API; a compact block (more than 20 episodes, the lanes
   of page 2's scene 700 "The goal of RL") gets an SVG in place of its canvas of 13 x 100 pixels: one column a week,
   one band a run of episodes in the same state, so that the mosaic reads as 13 week columns of colour on any screen.
   The SVG carries the canvas's classes and size and stays block.canvas, the element that scene 700 measures. The G1
   column of bars (opts.g1) stays a canvas: no scene shows it. Nothing else of runs.js changes. */
(function () {
  "use strict";
  var OB = window.OB, R = OB && OB.runs, B = window.B;
  if (!R || !R.block) return;
  var NS = "http://www.w3.org/2000/svg";
  var block0 = R.block;
  R.block = function (runs, opts) {
    opts = opts || {};
    var b = block0(runs, opts);
    var compact = opts.compact === undefined ? runs.length > 20 : !!opts.compact;
    if (!compact || !b.canvas || !b.canvas.parentNode) return b;
    var cv = b.canvas, n = runs.length, weeks = n ? runs[0].actions.length : B.WEEKS, WEAR = OB.art.C.wear;
    /* viewBox units: a week is 10 wide (8 of colour, a gap of 2), an episode 1 high; the SVG stretches to the
       canvas's size (preserveAspectRatio none), so the columns keep their gaps at any size. */
    var CW = 10, GAP = 2, parts = [];
    for (var t = 0; t < weeks; t++) {
      var i = 0;
      while (i < n) {
        var s = runs[i].states[t], j = i + 1;
        while (j < n && runs[j].states[t] === s) j++;
        parts.push('<rect x="' + (t * CW) + '" y="' + i + '" width="' + (CW - GAP) + '" height="' + (j - i + (j < n ? 0.04 : 0)) +
          '" fill="' + WEAR[s] + '"/>');
        i = j;
      }
    }
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", (cv.getAttribute("class") || "runs-canvas") + " runs-vec");
    svg.setAttribute("viewBox", "0 0 " + (weeks * CW - GAP) + " " + n);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("aria-hidden", "true");
    svg.style.width = cv.style.width;
    svg.style.height = cv.style.height;
    svg.innerHTML = parts.join("");
    cv.parentNode.replaceChild(svg, cv);
    b.canvas = svg;
    return b;
  };
})();
</script>
<script>/* tables.js */
/* tables.js: the table of preferences theta, the probability table and a deterministic policy's column, for page 3 of
   "Old Bessie" (agent A4b, 2026-11-14). Agents A4a, A5 and A6 reuse it; the API below is stable.

   Rows are the states HEALTHY, WORN, SHAKY, FAILING (S1 to S4), top to bottom, each with the van of art.js. Columns
   are the actions RUN, SERVICE, REPLACE (a1 to a3), left to right, each with its glyph and lever colour. Sizes are
   plain px (tables keep their size on large screens, the rule of core.css); a phone (below 561 px) gets smaller cells.

   Motion. Every call sets its end state at once and animates through the engine's helpers (OB.roll, OB.fade, OB.fly,
   OB.ring, OB.animate, OB.at), so it moves only when the current beat allows motion (the reader came with Next) and
   the engine finishes it when the reader moves on. Build tables in build(); change them in beat().

   OB.tables.table(values, opts) -> T
     values      4 rows of 3 numbers (exact values: the table rounds them for display), or null (empty cells); a row
                 or a cell may be null too
     opts.kind   "bets" (signed, 2 decimals), "prob" (2 decimals, each cell's probability also drawn as a bar),
                 "exp" (3 decimals: the first step of softmax)
     opts.size   "l" (default), "m", or "s" (a compact table for a diagram)
     opts.heads  true (default): vans on the left, actions on top; "top": actions only; "side": vans only; false
     opts.sum    true: a column at the right for the rows' sums, empty until T.sum fills it
     opts.rows   the states drawn, default [0, 1, 2, 3]
     opts.cap    a caption under the table, e.g. "PREFERENCES" and theta (HTML allowed)
     opts.places the decimals, in place of the kind's
   T.el                        the element (div.tb); append it where you want it
   T.cell(s, a), T.num(s, a)   a cell and its number (a span); T.side(s) a row's van; T.top(a) an action's head;
                               T.rowFrame(s), T.colFrame(a) frames over a row's or a column's cells (ring these);
                               T.sumCell(s); T.cap (the caption element)
   T.get(s, a), T.values()     the exact numbers held now (null where empty)
   T.set(values, o)            every cell to values (null empties). A changed cell rolls to its new number, an empty
                               cell fades its number in. o.delay (ms), o.stagger (ms from row to row), o.cstagger
                               (ms from cell to cell), o.from (a number: empty cells roll from it, e.g. 0), o.now
                               (true: no motion, for a cell that a fly lands on)
   T.setRow(s, row, o), T.setCell(s, a, v, o)   the same for one row or one cell
   T.sum(s, v, o)              the sum v of row s in the sum column (null hides it); a "prob" sum also draws the row's
                               probabilities as one full bar. o.delay
   T.rings(list)               exactly these blinking rings: [s, a] a cell, [s, null] a row, [null, a] a column;
                               rings already on stay on without blinking again; [] or null clears them
   T.ring(s, a, on)            one ring on (default) or off
   T.mark(list)                lights cells ([s, a]) or rows ([s, null]) in yellow and dims the other numbers; [] clears
   T.show(on, o), T.fade(on, o)  the whole table: show (fades in if hidden; off hides at once), or fade in or out
   T.zoom(s, a, o) -> Z        a large copy of a cell in a box, not attached: Z.el, Z.num, Z.cap; o.cap (a caption
                               above, "BEFORE"), o.value (default the cell's), o.head (false: no state and action chips)
   T.lift(s, a, Z, o)          rings the cell, then a copy of it flies out and grows into Z.el (o.delay, default 600)
   OB.tables.column(policy, opts) -> C   a deterministic policy (B.BEST, a column of four actions): C.el, C.entry(s)
                               (the cell, clickable), C.chip(s), C.side(s), C.get(s), C.values(), C.set(s, a) (the new
                               chip fades in), C.rings(list of states); opts.size, opts.heads (vans, default true),
                               opts.cap (default "POLICY"), opts.rows. A column and a table of the same size line up row
                               by row when their tops align (the same head height and row height).
   OB.tables.fmt(kind, x, places)   a number as a table of that kind writes it ("-0.60", "0.47", "1.492")
   OB.tables.PLACES            { bets: 2, prob: 2, exp: 3 }
   OB.tables.chances(row)      B.softmax(row), the exact probabilities of a row of preferences */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, art = OB.art;
  var PLACES = { bets: 2, prob: 2, exp: 3 };
  var VAN = { l: 64, m: 54, s: 40 };
  var GLY = { l: 22, m: 20, s: 15 };
  var NAMES = (B && B.ACTIONS) || ["RUN", "SERVICE", "REPLACE"];

  function el(tag, cls, text) { return OB.el(tag, cls, text); }
  function fmt(kind, x, places) {
    var p = places !== undefined ? places : (PLACES[kind] !== undefined ? PLACES[kind] : 2);
    return OB.num(x, p);
  }
  /* The formatter of a roll: an intermediate value drops decimals rather than show more characters than cap, so a
     number never grows wider than the cell's ends while it rolls (-0.60 rolling to 0.549 shows -0.60, -0.31, 0.012). */
  function capped(F, cap) {
    return function (x) {
      var s = F(x), p = (s.split(".")[1] || "").length;
      while (s.length > cap && p > 0) { p--; s = OB.num(x, p); }
      return s;
    };
  }
  /* A number longer than LONG characters is drawn smaller so that it stays inside its cell: 22,026.466, e to the power
     of the preference 10 in the softmax aside, at 7/10 of the table's size (--fit on the number, read by
     tables.css). */
  var LONG = 7;
  function fitN(n, s) {
    if (s.length > LONG) n.style.setProperty("--fit", (LONG / s.length).toFixed(3));
    else n.style.removeProperty("--fit");
  }
  function place(e, row, col) { e.style.gridRow = String(row); e.style.gridColumn = String(col); }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function resolved() { return Promise.resolve(); }

  /* The head of an action: its glyph and name, in its lever colour. */
  function actionHead(a, size) {
    var h = el("div", "tb-ah a" + a);
    h.appendChild(OB.html("span", "tb-gl", art.glyph(a, GLY[size] || 22)));
    h.appendChild(el("span", "tb-an", NAMES[a]));
    return h;
  }
  /* The head of a row: the van of art.js and the state's name (no name in the compact size). */
  function stateHead(s, size) {
    var h = el("div", "tb-sv s" + s);
    h.appendChild(art.van(s, { size: VAN[size] || 64, gauge: false, label: size !== "s" }));
    return h;
  }

  /* A table: preferences, probabilities or exponentials. */
  function table(values, opts) {
    opts = opts || {};
    var kind = opts.kind || "bets", size = opts.size || "l";
    var heads = opts.heads === undefined ? true : opts.heads;
    var side = heads === true || heads === "side", top = heads === true || heads === "top";
    var rows = opts.rows || [0, 1, 2, 3];
    var F = function (x) { return fmt(kind, x, opts.places); };
    var T = { kind: kind, size: size, rows: rows.slice() };
    var root = el("div", "tb tb-" + kind + " tb-" + size);
    var grid = el("div", "tb-grid");
    var c0 = side ? 2 : 1, r0 = top ? 2 : 1;
    grid.style.gridTemplateColumns = (side ? "var(--tb-hw) " : "") + "repeat(3, var(--tb-cw))" +

    grid.style.gridTemplateRows = (top ? "var(--tb-hh) " : "") + "repeat(" + rows.length + ", var(--tb-rh))";
    var cells = [[], [], [], []], vals = [[null, null, null], [null, null, null], [null, null, null], [null, null, null]];
    var sides = [], tops = [], rframes = [], cframes = [], sums = [], sumv = [null, null, null, null];

    if (top) {
      for (var a = 0; a < 3; a++) { var h = actionHead(a, size); place(h, 1, c0 + a); grid.appendChild(h); tops[a] = h; }
      if (opts.sum) { var sh = el("div", "tb-sh", "SUM"); place(sh, 1, c0 + 4); grid.appendChild(sh); }
    }
    rows.forEach(function (s, r) {
      if (side) { var sv = stateHead(s, size); place(sv, r0 + r, 1); grid.appendChild(sv); sides[s] = sv; }
      for (var a = 0; a < 3; a++) {
        var c = el("div", "tb-c s" + s + " a" + a + (a === 0 ? " fc" : "") + (r === 0 ? " fr" : "") + " empty");
        var inn = el("div", "tb-in");
        var n = el("span", "tb-n");
        inn.appendChild(n);
        var bar = null;
        if (kind === "prob") { bar = el("div", "tb-bar"); bar.appendChild(el("i")); inn.appendChild(bar); }
        c.appendChild(inn);
        place(c, r0 + r, c0 + a);
        grid.appendChild(c);
        cells[s][a] = { el: c, inn: inn, n: n, bar: bar };
      }
      var rf = el("div", "tb-rf");
      rf.style.gridRow = String(r0 + r);
      rf.style.gridColumn = c0 + " / " + (c0 + 3);
      grid.appendChild(rf);
      rframes[s] = rf;
      if (opts.sum) {
        var sc = el("div", "tb-c tb-sum s" + s + (r === 0 ? " fr" : "") + " empty");
        var si = el("div", "tb-in");
        var sn = el("span", "tb-n");
        si.appendChild(sn);
        var sb = null;
        if (kind === "prob") {
          sb = el("div", "tb-bar tb-sbar");
          for (var q = 0; q < 3; q++) sb.appendChild(el("i", "a" + q));
          si.appendChild(sb);
        }
        sc.appendChild(si);
        place(sc, r0 + r, c0 + 4);
        grid.appendChild(sc);
        sums[s] = { el: sc, inn: si, n: sn, bar: sb };
      }
    });
    for (var ca = 0; ca < 3; ca++) {
      var cf = el("div", "tb-cf");
      cf.style.gridRow = r0 + " / " + (r0 + rows.length);
      cf.style.gridColumn = String(c0 + ca);
      grid.appendChild(cf);
      cframes[ca] = cf;
    }
    root.appendChild(grid);
    if (opts.cap) { T.cap = OB.html("div", "tb-cap", opts.cap); root.appendChild(T.cap); }
    T.el = root;
    T.grid = grid;

    function barTo(c, p) { if (c && c.bar) c.bar.firstChild.style.width = (Math.max(0, Math.min(1, p)) * 100).toFixed(2) + "%"; }

    /* One cell to v: roll from the old number, fade in when it was empty (or roll from o.from). */
    T.setCell = function (s, a, v, o) {
      o = o || {};
      var c = cells[s] && cells[s][a];
      if (!c) return resolved();
      var old = vals[s][a];
      if (!isNum(v)) {

        delete c.n.dataset.v;
        barTo(c, 0);
        c.el.classList.add("empty");
        c.inn.classList.remove("ob-hide");
        c.inn.style.opacity = "";
        return resolved();
      }
      vals[s][a] = v;
      c.el.classList.remove("empty");
      fitN(c.n, F(v));
      if (o.now) {
        c.n.textContent = F(v);
        c.n.dataset.v = String(v);
        barTo(c, v);
        c.inn.classList.remove("ob-hide");
        c.inn.style.opacity = "";
        return resolved();
      }
      var from = isNum(old) ? old : (isNum(o.from) ? o.from : null);
      var delay = o.delay || 0;
      if (from === null) {
        c.n.textContent = F(v);
        c.n.dataset.v = String(v);
        barTo(c, v);
        return OB.fade(c.inn, true, { delay: delay, dur: o.dur });

      if (from === v && isNum(old)) { c.n.textContent = F(v); c.n.dataset.v = String(v); barTo(c, v); return resolved(); }
      c.inn.classList.remove("ob-hide");

    T.setRow = function (s, row, o) {
      o = o || {};
      var ps = [];
      for (var a = 0; a < 3; a++) {
        var oo = {}; for (var k in o) oo[k] = o[k];
        oo.delay = (o.delay || 0) + a * (o.cstagger || 0);
        ps.push(T.setCell(s, a, row ? row[a] : null, oo));
      }

    };
    T.set = function (values, o) {
      o = o || {};
      var ps = [];
      rows.forEach(function (s, r) {
        var oo = {}; for (var k in o) oo[k] = o[k];

      });
      return Promise.all(ps);
    };
    T.get = function (s, a) { return vals[s][a]; };
    T.values = function () { return vals.map(function (r) { return r.slice(); }); };

    /* The sum of a row, in the sum column. */
    T.sum = function (s, v, o) {
      o = o || {};
      var c = sums[s];
      if (!c) return resolved();
      var old = sumv[s];
      if (!isNum(v)) {
        sumv[s] = null;
        c.n.textContent = "";
        c.el.classList.add("empty");
        c.inn.classList.add("ob-hide");
        return resolved();
      }
      sumv[s] = v;
      c.el.classList.remove("empty");
      fitN(c.n, F(v));
      c.n.textContent = F(v);
      c.n.dataset.v = String(v);
      if (c.bar) {
        var row = vals[s], tot = 0, q;
        for (q = 0; q < 3; q++) tot += isNum(row[q]) ? row[q] : 0;
        for (q = 0; q < 3; q++) c.bar.children[q].style.width = (tot > 0 ? (isNum(row[q]) ? row[q] : 0) / tot * 100 : 0).toFixed(2) + "%";
      }
      if (old === v && !c.inn.classList.contains("ob-hide")) return resolved();
      if (isNum(old) && !c.inn.classList.contains("ob-hide")) return OB.roll(c.n, v, { from: old, fmt: F, delay: o.delay || 0 });
      if (!c.inn.classList.contains("ob-hide")) c.inn.classList.add("ob-hide");
      return OB.show(c.inn, true, { delay: o.delay || 0 });
    };
    // A sum cell starts hidden.
    sums.forEach(function (c) { if (c) c.inn.classList.add("ob-hide"); });

    /* Rings and marks. */
    var ringed = [];
    function target(s, a) {
      if (s === null || s === undefined) return cframes[a];

<script>/* sec3a-data.js */
/* sec3a-data.js: the numbers and the number-bearing words of "Try it", page 3, scenes 100 to 199 (agent A4a,
   2026-11-14; the what-if of beat 5 by agent U, 2026-11-16). All numbers come from bessie.js. In the browser OB.s3a
   (this file loads after core.js and before sec3a.js); in node require("./sec3a-data.js"), which tools/check_try.js
   uses to assert every number the scene shows.

   Every policy plays on the same dice, B.dice(B.TRY.diceSeed, B.TRY.n): ten episodes of 13 weeks from HEALTHY. A
   deterministic policy spends each week's first number (the action's) without using it, so every policy meets the
   same luck, and a change in the average return comes from the change in the policy alone. A what-if changes one
   state's action: its episodes stay the same when no episode is in that state in any week (sameRuns).

   The scene writes dollars with OB.money (whole dollars); the functions that write words take that formatter as an
   argument, so the check can call them with a copy of it. The change of a what-if is the difference of the two
   averages as the screen shows them (whole dollars), so before, after and the change agree on the screen. The words
   mark their formulas between \( and \) in TeX: the scene draws them with OB.texIn (tex.js, KaTeX), node checks the
   plain text. BAR is the TeX of the average return. */
(function (root) {
  "use strict";
  var node = typeof module !== "undefined" && module.exports;
  var B = node ? require("./bessie.js") : root.B;

  var N = B.TRY.n, SEED = B.TRY.diceSeed;
  var dice = B.dice(SEED, N);
  var START = [B.RUN, B.RUN, B.RUN, B.RUN];
  /* The what-if that a deep link to beat 5 shows on a fresh page: RUN everywhere, FAILING taking REPLACE, which gives
     B.EXAMPLE (RUN until it fails). No example shows B.BEST, which the end of page 3 reveals. */
  var FIX = { s: B.FAILING, a: B.REPLACE };
  var BAR = "\\bar{G}_1";
  var G1 = "\\(G_1\\)", GBAR = "\\(" + BAR + "\\)";
  /* An amount as OB.money writes it, as TeX (OB.texNum of tex.js, repeated for node). */
  function tnum(s) { return String(s).replace(/\$/g, "\\$").replace(/,/g, "{,}"); }

  /* A try: the ten episodes of the policy col on the dice, their returns G1 and their average. */
  function play(col) {
    var runs = [], sum = 0;
    for (var i = 0; i < N; i++) {
      var r = B.playRun(col, dice, i);
      runs.push(r);
      sum += r.G1;
    }
    return { col: col.slice(), runs: runs, g1: runs.map(function (r) { return r.G1; }), avg: sum / N };
  }
  /* The states in which some episode takes an action (its 13 weeks; the state after the last week takes none). */
  function visited(t) {
    var v = [false, false, false, false];
    t.runs.forEach(function (r) { for (var w = 0; w < r.actions.length; w++) v[r.states[w]] = true; });
    return v;
  }
  function sameRuns(a, b) {
    if (a.runs.length !== b.runs.length) return false;
    for (var i = 0; i < a.runs.length; i++) {
      var x = a.runs[i], y = b.runs[i];
      if (x.states.join() !== y.states.join() || x.actions.join() !== y.actions.join() || x.rewards.join() !== y.rewards.join()) return false;
    }
    return true;
  }
  /* The policy col with state s taking action a. */
  function change(col, s, a) { var c = col.slice(); c[s] = a; return c; }
  /* An average as whole dollars, the number OB.money shows. */
  function whole(x) { return +x.toFixed(0); }

  /* The what-if of state s: bef and aft are the tries of the policy before and after the change. delta: the change
     of the average in whole dollars, after minus before as the screen shows them. kind: "same-runs" (no episode is
     in state s in any week: the same episodes, the same average), "equal" (other episodes, the same whole dollars),
     "higher", "lower". */
  function compare(bef, aft, s) {
    var d = whole(aft.avg) - whole(bef.avg);
    var kind = sameRuns(bef, aft) ? "same-runs" : d > 0 ? "higher" : d < 0 ? "lower" : "equal";
    return { s: s, from: bef.col[s], to: aft.col[s], delta: d, kind: kind };
  }
  /* The label of the arrow from BEFORE to AFTER ("+$798", "-$120", "$0") and the word under it. */
  function label(c, money) { return money(c.delta, 0, true); }
  function word(c) { return c.kind === "higher" ? "UP" : c.kind === "lower" ? "DOWN" : "SAME"; }

  /* The words of the walk, beats 1 to 4: edit (the column can be changed), runs, g1, avg (cur: the try). */
  function words(step, cur, money) {
    if (step === "edit") return "A policy: one action per state. Tap an entry to change it, then press Done.";
    if (step === "runs") return "Ten episodes with this policy: one row per episode, one cell per week.";
    if (step === "g1") return "The return " + G1 + " of each episode. What is their average? Guess, then press Compute.";
    return "Their average: \\(" + BAR + " = " + tnum(money(cur.avg)) + "\\).";
  }

  /* The words of the what-if, beat 5. pick: no state picked (o.kept: the change kept last, { s, a }, or null);
     menu: state o.s picked, taking o.a; shown: the what-if o, a result of compare(). */
  function wiWords(step, o, money) {
    var S = B.STATES, A = B.ACTIONS;
    if (step === "pick") {
      if (o && o.kept) return "Kept: " + S[o.kept.s] + " takes " + A[o.kept.a] + ". Tap a state for the next what-if.";
      return "What if one state took another action? Tap a state.";
    }
    if (step === "menu") return S[o.s] + " takes " + A[o.a] + ". What if it took another action? Choose one.";
    var head = "What if " + S[o.s] + " takes " + A[o.to] + " in place of " + A[o.from] + "? ";
    if (o.kind === "same-runs") return head + "No episode is " + S[o.s] + " in any week: the same episodes, the same " + GBAR + ".";
    if (o.kind === "equal") return head + "Other episodes, the same " + GBAR + " to the dollar.";
    return head + "On the same luck, " + GBAR + " goes " + (o.kind === "higher" ? "up" : "down") + " by " + money(Math.abs(o.delta)) + ".";
  }

  var D = {
    N: N, SEED: SEED, dice: dice, START: START, FIX: FIX, BAR: BAR,
    play: play, visited: visited, sameRuns: sameRuns, change: change, whole: whole, compare: compare,
    label: label, word: word, words: words, wiWords: wiWords
  };
  if (node) module.exports = D;
  else root.OB.s3a = D;
})(typeof window !== "undefined" ? window : this);
</script>

      W.keep = el("button", "ob-btn s3a-keep", "Keep");
      W.keep.type = "button";
      W.keep.addEventListener("click", function (e) { unfocus(e); self.keep(); });
      W.leave = el("button", "ob-btn quiet s3a-leave", "Leave");
      W.leave.type = "button";
      W.leave.addEventListener("click", function (e) { unfocus(e); self.drop(); });
      W.ctl.appendChild(W.keep);
      W.ctl.appendChild(W.leave);
      avgs.appendChild(W.ctl);
      wi.appendChild(avgs);
      root.appendChild(wi);
    },

    beat: function (k, api) {
      var P = this.P, S = this.S, self = this;
      this.api = api;
      this.k = k;
      this.closePad();
      var live = api.forward && !api.instant && api.from === k - 1;
      gone(P.dia, k === 4);
      gone(this.W.root, k !== 4);
      this.setEditing(k === 0);
      this.setPicking(k === 4);
      if (k === 4) {
        this.showWhatIf();
        if (live) { api.fade(this.W.root, true, { dur: 900 }); api.fade(P.lead, true, { dur: 900 }); }
        return;
      }
      if (k >= 1) S.walked = true;
      var cur = this.tryOf(S.col);
      P.lead.innerHTML = OB.texIn(D.words(STEP[k], cur, OB.money));
      if (live) api.fade(P.lead, true, { dur: 900 });
      vis(P.done, k === 0);

      // The episodes, under a dashed frame while the column is being chosen.
      if (k === 0) {
        vis(P.block, false);
        vis(P.ph, true);
      } else {
        var blk = this.ensureBlock(cur);
        vis(P.ph, false);
        vis(blk, true);
        blk.rows.forEach(function (r) { r.style.clipPath = ""; });
        if (live && k === 1) {
          // the rows appear one after another, each from week 1 to week 13
          blk.rows.forEach(function (r, i) {
            r.style.clipPath = "inset(0 100% 0 0)";
            api.at(i * 200, function () {
              api.animate(1200, function (p) { r.style.clipPath = "inset(0 " + (100 - 100 * p).toFixed(2) + "% 0 0)"; },
                function () { r.style.clipPath = ""; });
            });
          });
        }
        if (live && k === 2) OB.runs.showG1(blk, true, api, { stagger: 200 });
        else {
          blk.g1s.forEach(function (g) { vis(g, k >= 2); });
          vis(blk.g1head, k >= 2);
        }
      }

      // The average: each episode's return G1 flies into the box, then the number rolls to their average.
      if (k === 3) {
        this.setAv(cur.avg);
        if (live) {
          P.block.g1s.forEach(function (g, i) { api.fly(g, P.av, { delay: 300 + i * 90, dur: 1400, arc: 30, scale: false }); });
          api.roll(P.av, cur.avg, { from: 0, delay: 2500, fmt: money0 });
        }
      } else this.setAv(null);

      if (k === 0) api.nextLabel("Play");
      else if (k === 2) api.nextLabel("Compute");
      requestAnimationFrame(function () { self.placePad(); });
    },

    onkey: function (e) {
      if (e.key !== "Escape") return false;
      if (this.k === 0 && this.S && this.S.sel >= 0) { this.closePad(); return true; }
      if (this.k === 4 && this.S && this.S.wi && this.S.wi.pick >= 0) { this.drop(); return true; }
      return false;
    },
    leave: function () { this.closePad(); },

    /* The try of a column, computed once. */
    tryOf: function (col) {
      var k = keyOf(col);
      return this.cache[k] || (this.cache[k] = D.play(col));
    },
    ensureBlock: function (tr) {
      var P = this.P, k = keyOf(tr.col);
      if (P.block && P.blockKey === k) return P.block;
      var b = OB.runs.block(tr.runs, { label: true, head: true, g1: true });
      if (OB.runs.tip) OB.runs.tip(b);
      b.classList.add("ob-hide");
      if (P.block) P.hold.replaceChild(b, P.block); else P.hold.insertBefore(b, P.ph);
      P.block = b;
      P.blockKey = k;
      return b;
    },
    setAv: function (x) {
      var av = this.P.av;
      delete av.dataset.v;
      if (x === null) { av.className = "s3a-av"; av.textContent = "?"; return; }
      var r = D.whole(x);
      av.className = "s3a-av ob-money" + (r > 0 ? " gain" : r < 0 ? " loss" : "");
      av.textContent = OB.money(x);
    },

    /* Beat 1: a tap rings an entry and opens the keypad, a press sets the entry. */
    setEditing: function (on) {
      var C = this.P.C;
      this.editing = on;
      this.P.colW.classList.toggle("s3a-edit", on);
      STATES.forEach(function (s) {
        var e = C.entry(s);
        if (on) { e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); }
        else { e.removeAttribute("tabindex"); e.removeAttribute("role"); }
        e.setAttribute("aria-label", B.STATES[s] + ": " + B.ACTIONS[C.get(s)]);
      });
    },
    tap: function (s, ev) {
      if (!this.editing) return;
      unfocus(ev);
      if (this.S.sel === s) { this.closePad(); return; }
      this.openPad(s);
    },
    openPad: function (s) {
      var P = this.P, S = this.S;
      S.sel = s;
      P.C.rings([s]);
      P.keys.forEach(function (b, a) { b.setAttribute("aria-pressed", S.col[s] === a ? "true" : "false"); });
      P.pad.classList.remove("ob-gone");
      this.placePad();
    },
    placePad: function () {
      var P = this.P, s = this.S ? this.S.sel : -1;
      if (!P || !P.pad || s < 0) return;
      if (getComputedStyle(P.pad).position !== "absolute") { P.pad.style.left = ""; P.pad.style.top = ""; return; }
      var w = P.colW.getBoundingClientRect(), g = P.C.grid.getBoundingClientRect(), e = P.C.entry(s).getBoundingClientRect();
      if (!w.width) return;
      P.pad.style.left = Math.round(g.right - w.left + 14) + "px";
      P.pad.style.top = Math.round(Math.max(0, e.top + e.height / 2 - w.top - P.pad.offsetHeight / 2)) + "px";
    },
    closePad: function () {
      if (!this.P || !this.P.pad) return;
      this.S.sel = -1;
      this.P.C.rings([]);
      this.P.pad.classList.add("ob-gone");
    },
    press: function (a, ev) {
      var P = this.P, S = this.S, s = S.sel;
      if (!this.editing || s < 0) return;
      if (S.col[s] !== a) {
        S.col[s] = a;
        P.C.set(s, a);
        P.C.entry(s).setAttribute("aria-label", B.STATES[s] + ": " + B.ACTIONS[a]);
      }
      this.closePad();
      if (ev && ev.detail === 0) P.C.entry(s).focus();
    },
    /* Done: the column plays from beat 2, with motion, as a press of Next does. */
    play: function () {
      if (!this.editing) return;
      this.closePad();
      OB.go(this.index, 1, { forward: true });
    },

    /* Beat 5. The what-if starts from the walked column; on a fresh page (no walk yet, the column as it starts) it
       shows the fixed what-if D.FIX. */
    showWhatIf: function () {
      var S = this.S;
      if (!S.wi || !same(S.wi.first, S.col)) {
        var fixed = !S.walked && same(S.col, D.START);
        S.wi = { first: S.col.slice(), base: S.col.slice(), pick: fixed ? D.FIX.s : -1, alt: fixed ? D.FIX.a : -1, kept: null };
      }
      this.render();
    },
    setPicking: function (on) {
      var C = this.W.C;
      this.picking = on;
      this.W.root.classList.toggle("s3a-edit", on);
      STATES.forEach(function (s) {
        var e = C.entry(s);
        if (on) { e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); }
        else { e.removeAttribute("tabindex"); e.removeAttribute("role"); }
      });
    },
    /* A tap on a state: it is picked and its menu opens; a tap on the state already picked drops the what-if. */
    pick: function (s) {
      var wi = this.S.wi;
      if (!this.picking || !wi) return;
      if (wi.pick === s) { this.drop(); return; }
      wi.pick = s;
      wi.alt = -1;
      wi.kept = null;
      this.redraw();
    },
    /* A choice in the menu: another action shows the what-if at once (the current one, NOW, is disabled). */
    choose: function (a) {
      var wi = this.S.wi;
      if (!this.picking || !wi || wi.pick < 0 || a === wi.base[wi.pick]) return;
      wi.alt = a;
      this.redraw();
    },
    keep: function () {
      var wi = this.S.wi;
      if (!wi || wi.pick < 0 || wi.alt < 0) return;
      wi.base = D.change(wi.base, wi.pick, wi.alt);
      wi.kept = { s: wi.pick, a: wi.alt };
      wi.pick = -1;
      wi.alt = -1;
      this.redraw();
    },
    drop: function () {
      var wi = this.S.wi;
      if (!wi) return;
      wi.pick = -1;
      wi.alt = -1;
      wi.kept = null;
      this.redraw();
    },
    /* A change of the what-if is drawn at once: the beat plays again without motion, which also ends any motion still
       running (the fade-in of beat 5, a kept action fading into the column). */
    redraw: function () { OB.go(this.index, 4); },
    /* The episodes of a try for the what-if, built once per policy, with their returns G1. */
    wiBlock: function (tr) {
      var k = keyOf(tr.col);
      if (!this.wblocks[k]) {
        var b = OB.runs.block(tr.runs, { label: true, head: true, g1: true });
        if (OB.runs.tip) OB.runs.tip(b);
        b.g1s.forEach(function (g) { g.classList.remove("ob-hide"); });
        if (b.g1head) b.g1head.classList.remove("ob-hide");
        this.wblocks[k] = b;
      }
      return this.wblocks[k];
    },
    /* The cells of state s (none for -1) marked in a block. */
    mark: function (b, s) {
      b.runs.forEach(function (run, i) {
        b.cells[i].forEach(function (c, t) { c.classList.toggle("s3a-use", run.states[t] === s); });
      });
    },
    put: function (slot, child) {
      if (slot.firstChild === child && slot.childNodes.length === 1) return;
      slot.textContent = "";
      slot.appendChild(child);
    },
    /* Beat 5 drawn at once from S.wi. */
    render: function () {
      var W = this.W, wi = this.S.wi, base = wi.base, p = wi.pick, art = OB.art;
      var bef = this.tryOf(base);
      var aft = p >= 0 && wi.alt >= 0 ? this.tryOf(D.change(base, p, wi.alt)) : null;
      var c = aft ? D.compare(bef, aft, p) : null;

      STATES.forEach(function (s) {
        W.C.set(s, base[s]);
        W.C.entry(s).setAttribute("aria-label", B.STATES[s] + ": " + B.ACTIONS[base[s]] + (s === p ? ", picked" : ""));
      });
      W.C.rings(p >= 0 ? [p] : []);

      vis(W.mkeys, p >= 0);
      W.keys.forEach(function (b, a) {
        var now = p >= 0 && base[p] === a;
        vis(b.now, now);
        b.classList.toggle("s3a-isnow", now);
        b.disabled = now;
        b.setAttribute("aria-pressed", aft && wi.alt === a ? "true" : "false");
      });
      vis(W.ctl, !!aft);

      // The heads: the picked state and its action before and after ("?" until one is chosen).
      W.bef.chips.textContent = "";
      W.aft.chips.textContent = "";
      if (p >= 0) {
        W.bef.chips.appendChild(art.stateChip(p));
        W.bef.chips.appendChild(art.actionChip(base[p]));
        W.aft.chips.appendChild(art.stateChip(p));
        W.aft.chips.appendChild(aft ? art.actionChip(wi.alt) : el("span", "ob-chip s3a-qchip", "?"));
      }

      // The episodes, the cells of the picked state marked.
      var bb = this.wiBlock(bef);
      this.put(W.bef.slot, bb);
      this.mark(bb, p);
      if (aft) {
        var ab = this.wiBlock(aft);
        this.put(W.aft.slot, ab);
        this.mark(ab, p);
      } else if (W.aft.slot.firstChild !== W.sizer) {
        W.aft.slot.textContent = "";
        W.aft.slot.appendChild(W.sizer);
        W.aft.slot.appendChild(W.aph);
      }

      // The averages and the change.
      W.gb.num.textContent = OB.money(bef.avg);
      tone(W.gb.num, bef.avg);
      W.ga.num.textContent = aft ? OB.money(aft.avg) : "?";
      tone(W.ga.num, aft ? aft.avg : null);
      vis(W.mlab, !!c);
      vis(W.mword, !!c);
      W.mid.className = "s3a-mid" + (c ? " " + c.kind : "");
      if (c) {
        W.mlab.textContent = D.label(c, OB.money);
        W.mword.textContent = D.word(c);
      }

      var words = c ? D.wiWords("shown", c, OB.money)
        : p >= 0 ? D.wiWords("menu", { s: p, a: base[p] }, OB.money)
        : D.wiWords("pick", { kept: wi.kept }, OB.money);
      this.P.lead.innerHTML = OB.texIn(words);
      this.P.lead.style.opacity = "";
    }
  });
})();
</script>
<script>/* sec3a2.js */
/* sec3a2.js: page 3, scene 190 "Human learning" (main session, 2026-11-17), between Try it and the next section.
   Carlos: "At the end of slide one ... a slide that says, what we did was human learning. We as humans used our
   intelligence to find the best policy. Now in section two, we're going to show how we can let a computer do this
   for our system."

   Two beats, two panels side by side (one above the other on a phone):
   0  HUMAN LEARNING: the helmet (the player, the one who chooses) and the policy it chose, a column of actions
      (B.EXAMPLE: no example shows the optimal policy, which the page reveals at its end)
   1  A COMPUTER LEARNS: a computer and the table it will learn, the preferences, empty until the next section */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, TB = OB && OB.tables;
  if (!OB || !B || !TB) return;
  var el = OB.el, art = OB.art;

  var LEAD = [
    "What we did was human learning: we used our own intelligence to look for the optimal policy.",
    "Now we let a computer do this for us."
  ];

  /* A computer, flat, in the look's colours: a dark screen with a small table on it, and its base. */
  function computer(w) {
    var h = Math.round(w * 50 / 64), cells = "";
    for (var r = 0; r < 4; r++) {
      for (var c = 0; c < 3; c++) {
        var lit = r === 0 && c === 0;
        cells += '<rect x="' + (20 + c * 8.6) + '" y="' + (10.2 + r * 5.4) + '" width="7.4" height="4.4" rx="0.8" fill="' +
          (lit ? "#FFD21F" : "#5C6371") + '"/>';
      }
    }
    var svg = '<svg viewBox="0 0 64 50" width="' + w + '" height="' + h + '" aria-hidden="true">' +
      '<rect x="7" y="3" width="50" height="34" rx="3.5" fill="#15171C"/>' +
      '<rect x="10.5" y="6.5" width="43" height="27" rx="1.5" fill="#2B2F38"/>' +
      '<rect x="13" y="10.2" width="4.6" height="21" rx="0.8" fill="#E1251B"/>' + cells +
      '<path d="M2 39 H62 L57.5 46.5 H6.5 Z" fill="#C3C8D0"/><rect x="25" y="39" width="14" height="2.2" rx="1" fill="#9AA1AD"/>' +
      "</svg>";
    return OB.html("span", "s3h-pc", svg);
  }

  /* A panel: its title, the one who chooses (an icon with its name under it), an arrow, the thing chosen. */
  function panel(cls, title, icon, who, thing) {
    var p = el("div", "ob-box white s3h-panel " + cls);
    p.appendChild(el("div", "s3h-title", title));
    var row = el("div", "s3h-row");
    var w = el("div", "s3h-who");
    w.appendChild(icon);
    w.appendChild(el("div", "s3h-name", who));
    row.appendChild(w);
    var a = el("span", "s3h-arr");
    row.appendChild(a);
    var t = el("div", "s3h-thing");
    t.appendChild(thing);
    row.appendChild(t);
    p.appendChild(row);
    p.who = w;
    p.arr = a;
    p.thing = t;
    return p;
  }

  OB.scene({
    page: 3, key: "human-learning", order: 190, title: "Human learning", beats: LEAD.length,
    build: function (root) {
      var P = this.parts = {};
      P.lead = el("p", "ob-say s3h-lead");
      root.appendChild(P.lead);
      var g = el("div", "s3h-grid");
      var col = TB.column(B.EXAMPLE, { size: "s", cap: "POLICY" });
      P.h = panel("s3h-human", "HUMAN LEARNING", OB.html("span", "s3h-face", art.face(8)), "WE CHOOSE", col.el);
      var tab = TB.table(null, { kind: "bets", size: "s", cap: "PREFERENCES " + OB.tex("\\theta") });
      P.c = panel("s3h-pcpanel", "A COMPUTER LEARNS", computer(84), "A COMPUTER", tab.el);
      P.mid = el("span", "s3h-next");
      g.appendChild(P.h);
      g.appendChild(P.mid);
      g.appendChild(P.c);
      root.appendChild(g);
    },
    beat: function (k, api) {
      var P = this.parts, go = api.forward && !api.instant && api.from === k - 1;
      if (P.lead.dataset.k !== String(k)) {
        P.lead.dataset.k = String(k);
        P.lead.textContent = LEAD[k];
        if (go) api.fade(P.lead, true, { dur: 900 });
      }
      api.show(P.mid, k >= 1, { delay: go && k === 1 ? 200 : 0 });
      api.show(P.c, k >= 1, { delay: go && k === 1 ? 700 : 0 });
    }
  });
})();
</script>
<script>/* sec3b-data.js */
/* sec3b-data.js: every number that the scenes of sec3b.js show (agent A4b, 2026-11-14), computed from bessie.js.
   In the browser it is window.S3B (loaded before sec3b.js); in node, require('./sec3b-data.js'), for
   tools/check_tables.js, which asserts every shown number.

   W     the preferences of proto-REINFORCE (theta on the page), B.PROTO.bets (= B.randomBets(17, 68), between -10 and
         10, two of them extreme, -6.9 and 10, since the evening of 2026-11-16), the table that agent A5 starts from;
         since 2026-11-16 also the table of preferences that scene 210 introduces, so one table runs through the page
         (its highest preferences give RUN, RUN, REPLACE, SERVICE, a policy other than B.BEST)
   READ  the two entries of W that scenes 220 and 230 ring and read out: [state, action], a positive preference and a
         negative one
   P     its probability table, B.softmaxTable(W), shown with 2 decimals
   E     the exponential of every preference (step 1 of softmax), shown with 3 decimals; ESUM the rows' sums
   DRAW  the draws of the policy in HEALTHY: B.act(P, HEALTHY, u) with u the action number of each "week" of
         B.dice(3, 100, 1). Seed 3 is the first seed, counting from 1, whose six draws come out 3 RUN, 1 SERVICE and
         2 REPLACE, HEALTHY's probabilities (0.47, 0.17, 0.35) times 6, rounded */
(function (root) {
  "use strict";
  var NODE = typeof module !== "undefined" && module.exports;
  var B = NODE ? require("./bessie.js") : root.B;

  /* The number format of core.js (OB.num), repeated here so that node can check the shown strings. */
  function num(x, places) {
    var p = places || 0;
    var neg = x < 0 && Math.abs(x) >= 0.5 * Math.pow(10, -p);
    var s = Math.abs(x).toFixed(p);
    var parts = s.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + parts.join(".");
  }
  var PLACES = { bets: 2, prob: 2, exp: 3 };
  function show(kind, x) { return num(x, PLACES[kind]); }

  var W = B.PROTO.bets.map(function (r) { return r.slice(); });
  var P = B.softmaxTable(W);
  var E = W.map(function (r) { return r.map(Math.exp); });
  var ESUM = E.map(function (r) { return r[0] + r[1] + r[2]; });
  var READ = [[B.HEALTHY, B.RUN], [B.HEALTHY, B.SERVICE]];
  /* The highest preference and the highest probability of each row: the same action. */
  function argmax(r) { var k = 0; for (var a = 1; a < r.length; a++) if (r[a] > r[k]) k = a; return k; }
  var TOPW = W.map(argmax), TOPP = P.map(argmax);

  var DRAW = { seed: 3, n: 100, shown: 6, state: B.HEALTHY, u: [], acts: [], count: [0, 0, 0] };
  var dd = B.dice(DRAW.seed, DRAW.n, 1);
  for (var i = 0; i < DRAW.n; i++) {
    var u = dd[2 * i], a = B.act(P, DRAW.state, u);
    DRAW.u.push(u);
    DRAW.acts.push(a);
    DRAW.count[a]++;
  }

  /* The worked example of step 1 (e to the power of HEALTHY's preference for RUN) and the step 2 lines of HEALTHY. */
  var EX = { s: B.HEALTHY, a: B.RUN, bet: W[0][0], value: E[0][0] };
  function sumLine(s) { return E[s].map(function (x) { return show("exp", x); }).join(" + ") + " = " + show("exp", ESUM[s]); }
  function divLines(s) {
    return [0, 1, 2].map(function (a) { return show("exp", E[s][a]) + " / " + show("exp", ESUM[s]) + " = " + show("prob", P[s][a]); });
  }

  var S3B = {
    W: W, P: P, E: E, ESUM: ESUM, READ: READ, TOPW: TOPW, TOPP: TOPP, DRAW: DRAW, EX: EX,
    EPS: B.PROTO.eps, num: num, show: show, PLACES: PLACES, sumLine: sumLine, divLines: divLines
  };
  if (NODE) module.exports = S3B;
  else root.S3B = S3B;
})(typeof window !== "undefined" ? window : this);
</script>
<script>/* sec3b-policy.js */
/* sec3b-policy.js: page 3, scene 260 "pick" (agent V, 2026-11-16; the roulette since 2026-11-17, main session): how
   the policy picks an action, in HEALTHY.

   Carlos, 2026-11-16: "We need a slide that explains in more detail how the probabilistic strategy chooses actions
   ... when you show how the probabilistic policy works, you highlight one row, then you take the probability values
   and you build with them ... I want the bars flow. You have little bars drawn in the row, and little bars expand and
   amplify the moving transition from there, becoming one single bar where the roulette spins. Then you spin the
   roulette and then you announce the chosen action. And then the rest you do as you show it." It follows scene 250,
   Softmax, and takes the place of the scene "The policy" (order 240 until that day).
   Carlos, 2026-11-17: "we are now using roulettes ... it would be nice if when you say how the policy picks an
   action, you form a roulette instead of the bar." The bar became a roulette wheel: the slots of the three actions,
   each as large as its probability, clockwise from the top in the order RUN, SERVICE, REPLACE (the notebooks' roulette:
   "each action's slot, starting where the slot before it ends"); a ball runs round the rim and stops at the point u of
   the wheel, u turns from the top.

   Beats (k from 0):
   0     the probability table, alone; HEALTHY's row ringed, the other rows dimmed
   1     the table makes room and the empty wheel fades in; HEALTHY's little bars leave their cells, fly into the
         wheel and open, one after the other, into its three slots (the exact probabilities: the shown ones, rounded,
         add up to 0.99)

          var q = EFLY(lin(e));

    tween(api, 1220, 480, function (p) {
      var q = EOUT(p);
      P.annName.style.opacity = p >= 1 ? "" : String(q);
      P.annName.style.transform = p >= 1 ? "" : "translateX(" + (-20 * (1 - q)).toFixed(2) + "px)";
    });
  };
  /* 4 to 8: a quick spin, its slot lights up, its glyph flies into its place. At 4 the announcement first goes into
     place 1 and the places come in. */
  function quick(P, k, api) {
    var d = drawAt(k), a0 = M.acts[d - 1], a = M.acts[d], S = P.slot[d], t = 0;
    setLit(P, a0, 1);

      api.at(100, function () { P.annTok.style.visibility = "hidden"; });

    spin(P, api, t, 1400, M.u[d - 1], M.u[d], 1.25);

    setSlots(P, true, SHOWN);

    P.ctrack.style.opacity = "0";
    tally(P, 0);
    P.clabs.forEach(function (l) { l.style.opacity = "0"; });
    light(P, api, 0, a0, false);

    tween(api, 700, 2600, function (p) { tally(P, Math.round(M.n * EIO(p))); });

<script>/* sec3b.js */
/* sec3b.js: page 3, section 4 of the weekend, preferences and softmax (agent A4b, 2026-11-14; reordered by agent T on
   2026-11-16 at Carlos's request), scenes 200 to 299. Every number comes from sec3b-data.js (window.S3B, computed
   from bessie.js) and is asserted by tools/check_tables.js. The tables are tables.js.

   Carlos, 2026-11-16: "One slide introduced the table of bets. The other is what ... every entry on the table of bets
   means. And then the third one, clarify that you allow negative bets. Then afterwards show how the table of bets
   gives rise to a probabilistic strategy. Then show the table normalize to the softmax. There you include the link
   towards the softmax explanation, but don't explain it there." One table runs through the section: the preferences of
   proto-REINFORCE, S3B.W (B.randomBets(17, 68)).

   200 card "Preferences"

       column per action
   220 What a preference says (2 beats): the rule; HEALTHY's preference for RUN, 0.40, ringed and read out
   230 Negative preferences (2 beats): the table allows them; HEALTHY's preference for SERVICE, -0.60, ringed and
       read out
   240 From preferences to probabilities (2 beats): HEALTHY's row of preferences gives HEALTHY's probabilities; the
       higher the preference, the higher the probability
   250 Softmax (2 beats): softmax turns the table of preferences into the probability table; it is a stochastic policy.
       A button opens the aside "How softmax works, and why"
   260 is agent V's scene "pick" (sec3b-policy.js): how the policy samples an action, the six draws and the counts of
       100.
   The aside of 250 (core.js, aside: "softmax"; outside the main flow, 10 beats):
   282 Softmax, step 1: e to the power (4 beats): the two steps; e to the power of 0.40, guessed then computed; every
       preference
   284 Softmax, step 2: divide by the sum (5 beats): HEALTHY's sum; its probabilities, guessed then computed; every row;
       the two steps are softmax
   286 Softmax, why it works (1 beat): the probabilities of each row add up to 1 */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, el = OB.el, TB = OB.tables, D = window.S3B;
  if (!TB || !D) { console.error("sec3b: tables.js or sec3b-data.js is missing"); return; }

  /* The lead line of a scene: its words change with the beat and fade in on Next. The lead is a flex box that keeps
     two lines of room, so its words go into one span (a formula inside stays in the line). */
  function lead(root) { var p = el("p", "ob-say s3b-lead"); root.appendChild(p); return p; }
  function say(p, markup, api) {
    if (p.dataset.t === markup) return;

  }
  function note(root, text) { var n = OB.html("p", "ob-note s3b-note", text || ""); root.appendChild(n); return n; }
  /* True when the beat was reached with Next from the beat before it (motion may play). */
  function live(api, k) { return api.forward && !api.instant && api.from === k - 1; }
  var NAMES = B.ACTIONS, STATES = B.STATES;

  /* 200. The card of this part. */
  OB.scene({
    page: 3, key: "bets-card", order: 200, title: "Preferences",
    card: { kicker: "REINFORCE", title: "Preferences", line: "A policy written as a table of preferences, and the preferences turned into probabilities.", wear: 1 }
  });

  /* Scenes 210 to 230 share one board: the lead, the table of preferences, a line that reads out one entry, a note.
     Each keeps the room of every part, so the table stays put from scene to scene. */
  function board(root) {
    var P = {};
    P.lead = lead(root);
    var flow = el("div", "s3b-flow");
    P.T = TB.table(D.W, { kind: "bets", cap: "PREFERENCES " + OB.tex("\\theta") });
    flow.appendChild(P.T.el);
    root.appendChild(flow);

    root.appendChild(P.read);

  /* An entry read out: "In HEALTHY, the preference for RUN is 0.40." */
  function readOut(e) {
    return "In " + STATES[e[0]] + ", the preference for " + NAMES[e[1]] + " is " + D.show("bets", D.W[e[0]][e[1]]) + ".";

/* Scenes 240 and 250: a row of preferences gives the probabilities of its state; softmax turns the whole table into

(function () {
  "use strict";

  var H = B.HEALTHY;

/* The aside of scene 250, outside the main flow (orders 280 to 299): how softmax works (Carlos, 2026-11-14: "Include an optional slide

(function () {
  "use strict";

  if (!TB || !D) return;

  /* An arrow's label: above a left-to-right arrow; on a stacked flow (a phone) on the arrow itself. */

  var H = B.HEALTHY, OTHER = [B.WORN, B.SHAKY, B.FAILING], EX = D.EX;
  /* The number e and the arithmetic of the two steps by KaTeX (tex.js); the worked result rolls in the face of the
