/* sec3c-runs.js: the episodes of the proto-REINFORCE diagram (agent W, 2026-11-16), OB.s3cRuns, drawn by sec3c.js in
   the scenes 310, 320, 400 and 410. Carlos (2026-11-16): "do it also reinforce into 1,000 run because it's very
   obscure. Or a small number so we can see the runs in more detail."

   The first ten episodes are drawn in detail, the way page 2 draws an episode (OB.runs.row: a cell per week in the
   colour of the van's state, the action's glyph, the bolt of a breakdown, the episode's return G1 at the end); the
   other 990 arrive as a stream of small strips (each one a real episode's states) along the arrow from the
   probability table, into a stack of cards behind the ten, while the count under them goes from 10 to 1,000. The
   returns: the ten as numbers at the ends of
   their rows, each flying into its bin of a histogram ($100 bins, one scale for every policy of the diagram,
   S3C.hist.max) where it lands as a block; then the other 990 pour in and the bars rise to their counts. The average
   is a mark on the histogram whose number flies into the average box.
   Vector shapes only (HTML and SVG); every motion through the engine's api (core.js), eased, finished by the engine
   when the reader moves on.

   R = OB.s3cRuns.View()        R.box (the episodes: the sheet of ten and its stack), R.face (the sheet, the arrows'
                                end), R.hist (the histogram's box), R.count (the number of the caption n = 1,000)
   R.src = element              where the stream starts (the probability table)
   R.layer(V, key, mean)        the episodes of the preferences V on the dice of the diagram; key names V in S3C.ten
                                (W0, W0h, W1), mean is the average return the scenes say; both are checked against the
                                episodes (console.error when they differ). Returns the layer's index.
   R.runsOn(i, api, go, o)      shows layer i's episodes (-1: none). go: the motion of Next. From none: the ten rows
                                play one after another, then the stream and the count. From another layer: the ten rows
                                are played again under a playhead, then the stream.
   R.g1On(i, api, go, o)        layer i's returns (-1: none). From none: the ten returns at the ends of the rows, each
                                flies into its bin, then the bars rise. From another layer: the bars move.
   R.markOn(i, api, go, o)      the mark of layer i's average on the histogram (-1: none): drawn, moved or hidden.
   R.flyAvg(api, to, o)         a copy of the mark's number flies into the element to, hidden until it lands; with
                                o.set, to keeps what it shows and o.set() gives it the number when the copy lands.
   R.frame(S)                   the movie of scenes 410 and 420 (main session, 2026-11-16, evening): the episodes of
                                a summary S at once, with no layer and no motion: the ten rows (their cells changed in
                                place), the full stack and its count, the G1 slots, the bars, the mark at S.mean.
   OB.s3cRuns.summary(runs)     what the diagram draws of a policy's episodes: { ten, bins, mean }.
   o: { delay } in ms. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, el = OB.el, D = window.S3C;
  if (!OB || !OB.runs || !B || !D || !D.ten || !D.hist) { console.error("sec3c-runs: runs.js or sec3c-data.js is missing"); return; }

  var TEN = D.ten.W0.length;
  var LO = D.g1.lo, HI = D.g1.hi, BIN = D.hist.bin, NB = Math.round((HI - LO) / BIN), HMAX = D.hist.max;
  /* The histogram's box in px: the mark's number on top, the bars (a G1 of the ten lands as a block of UNIT px), "$0". */
  var HW = 180, HH = 158, X0 = 4, X1 = HW - 4, HT = 21, HB = 140, UNIT = 4;
  var STRIPS = 40, LIFT = 7;          // the strips of a stream; they ride LIFT px above the arrow's line
  /* The dice of the diagram: 1,000 episodes of B.dice(12), the same luck for every policy (also OB.s3c.dice). */
  var DICE = null;
  function dice() { return DICE || (DICE = B.dice(D.seeds.dice, D.n)); }

  function money0(x) { return OB.money(x, 0); }
  /* The counts of returns in the histogram's $100 bins (a return outside the scale counts in the bin at its end). */
  function binsOf(g1s) {
    var bins = [];
    for (var b = 0; b < NB; b += 1) bins.push(0);
    g1s.forEach(function (g) { bins[Math.max(0, Math.min(NB - 1, Math.floor((g - LO) / BIN)))] += 1; });
    return bins;
  }
  function summary(runs) {
    var sum = 0;
    runs.forEach(function (q) { sum += q.G1; });
    return { ten: runs.slice(0, TEN), bins: binsOf(runs.map(function (q) { return q.G1; })), mean: sum / runs.length };
  }
  /* A cell of an episode for state s, action a and a breakdown, cloned from one made once by OB.runs.cell. */
  var CELLS = {};
  function cellOf(s, a, bd) {
    var k = s + "." + a + (bd ? "b" : "");
    if (!CELLS[k]) { CELLS[k] = OB.runs.cell(s, a, bd); CELLS[k].dataset.k = k; }
    return CELLS[k].cloneNode(true);
  }
  function money2(x) { return OB.money(x, 2); }
  function xOf(v) { return X0 + (v - LO) / (HI - LO) * (X1 - X0); }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function smooth(t) { t = clamp01(t); return t * t * (3 - 2 * t); }
  /* The linear time of a cubic in-out p (the ease of core.js), to run a stream on one api.animate. */
  function unease(p) { return p < 0.5 ? Math.cbrt(p / 4) : 1 - Math.cbrt(2 * (1 - p)) / 2; }
  function wear() { return (OB.art && OB.art.C && OB.art.C.wear) || ["#18A058", "#EDB20C", "#F0741B", "#DE3127"]; }
  function sv(tag, attrs) { return OB.svgEl(tag, attrs || {}); }

  /* A copy of src flies from src to to (both elements, measured when it starts; o.rect(), a client rect, in place of
     to): o.delay, o.dur, o.arc; o.fade, the last part of the flight in which the copy fades; o.ground, a white ground
     that grows under the copy; o.tick(p) in flight; o.land, called when it lands (or at once without motion). */
  function ghostFly(api, src, to, o) {
    o = o || {};
    api.at(o.delay || 0, function () {
      var a = src.getBoundingClientRect(), b = o.rect ? o.rect() : to.getBoundingClientRect();
      if (api.instant || !a.width || !b.width) { if (o.land) o.land(); return; }
      var cs = window.getComputedStyle(src);
      var g = src.cloneNode(true);
      g.classList.remove("ob-hide");
      g.classList.add("s3c-ghost");
      ["fontSize", "fontFamily", "fontWeight", "color", "letterSpacing"].forEach(function (k) { g.style[k] = cs[k]; });
      g.style.lineHeight = a.height + "px";       // one line, as tall as the source's box: the text stays in place
      g.style.left = a.left + "px";
      g.style.top = a.top + "px";
      g.style.width = a.width + "px";
      g.style.height = a.height + "px";
      g.style.opacity = "1";
      g.style.visibility = "visible";
      g.style.clipPath = "";
      if (o.ground) g.style.backgroundColor = "rgba(255,255,255,0)";
      document.body.appendChild(g);
      var s = o.scale !== undefined ? o.scale : b.height / a.height;
      var dx = b.left + (b.width - a.width * s) / 2 - a.left, dy = b.top + (b.height - a.height * s) / 2 - a.top;
      var arc = o.arc === undefined ? 26 : o.arc;
      api.animate(o.dur || 1000, function (p) {
        g.style.transform = "translate(" + (dx * p).toFixed(1) + "px," + (dy * p - Math.sin(Math.PI * p) * arc).toFixed(1) + "px) scale(" + (1 + (s - 1) * p).toFixed(4) + ")";
        if (o.fade) g.style.opacity = String(clamp01((1 - p) / o.fade));
        if (o.ground) g.style.backgroundColor = "rgba(255,255,255," + clamp01(p / 0.2).toFixed(3) + ")";
        if (o.tick) o.tick(p);
      }, function () { if (g.parentNode) g.parentNode.removeChild(g); if (o.land) o.land(); });
    });
  }

  function View() {
    var R = { layers: [], cur: { runs: -1, g1: -1, mark: -1 }, src: null };

    /* The episodes: a sheet of ten rows on a stack of cards. */
    R.box = el("div", "s3c-sheet");
    R.deck = el("div", "s3c-deck");
    R.cards = [];
    for (var c = 0; c < 3; c += 1) {
      var cd = el("div", "s3c-card");
      cd.style.transform = "translate(" + (4 * (c + 1)) + "px," + (4 * (c + 1)) + "px)";
      cd.style.opacity = "0";
      R.deck.insertBefore(cd, R.deck.firstChild);
      R.cards.push(cd);
    }
    R.box.appendChild(R.deck);
    R.face = el("div", "s3c-face ob-hide");
    R.box.appendChild(R.face);
    R.head = el("div", "s3c-phead ob-hide");
    R.face.appendChild(R.head);
    R.block = null;
    R.count = OB.texNumEl(OB.num(D.n));

    /* The histogram. */
    R.hist = el("div", "s3c-hist ob-hide");
    R.svg = sv("svg", { "class": "s3c-hsvg", viewBox: "0 0 " + HW + " " + HH, width: HW, height: HH, "aria-hidden": "true" });
    R.hist.appendChild(R.svg);
    var zx = xOf(0);
    R.svg.appendChild(sv("line", { "class": "s3c-hzero", x1: zx, y1: HT - 4, x2: zx, y2: HB }));
    R.bars = [];
    var bw = (X1 - X0) / NB;
    for (var b = 0; b < NB; b += 1) {
      var lo = LO + b * BIN;
      var r = sv("rect", { "class": "s3c-hbar " + (lo < 0 ? "loss" : "gain"), x: (X0 + b * bw + 0.6).toFixed(2), width: (bw - 1.2).toFixed(2), y: HB, height: 0 });
      R.svg.appendChild(r);
      R.bars.push(r);
    }
    R.svg.appendChild(sv("line", { "class": "s3c-hbase", x1: X0 - 2, y1: HB, x2: X1 + 2, y2: HB }));
    var z = sv("text", { "class": "s3c-htk", x: zx, y: HH - 3, "text-anchor": "middle" });
    z.textContent = "$0";
    R.svg.appendChild(z);
    R.mline = sv("line", { "class": "s3c-hmark", x1: 0, y1: HT - 6, x2: 0, y2: HB + 3 });
    R.svg.appendChild(R.mline);
    R.mtag = el("div", "s3c-mtag");
    R.mnum = el("span", "s3c-mnum");
    R.mtag.appendChild(R.mnum);
    R.hist.appendChild(R.mtag);
    markVis(false);

    function markVis(on) {
      R.mline.style.opacity = on ? "" : "0";
      R.mtag.style.opacity = on ? "" : "0";
      R.mline.style.transform = "";
    }

    /* A layer: the episodes of the preferences V, their returns and bins, the average. */
    R.layer = function (V, key, mean) {
      var runs = OB.runs.play(B.softmaxTable(V), dice(), D.n);
      var L = { runs: runs, key: key, mean: mean, bins: [], g1: runs.map(function (q) { return q.G1; }) };
      for (var b2 = 0; b2 < NB; b2 += 1) L.bins.push(0);
      var sum = 0;
      runs.forEach(function (q) {
        sum += q.G1;
        var k = Math.floor((q.G1 - LO) / BIN);
        L.bins[Math.max(0, Math.min(NB - 1, k))] += 1;
      });
      var avg = sum / runs.length;
      if (money2(avg) !== money2(mean)) console.error("sec3c-runs: the average return of " + key + " is " + money2(avg) + ", the scenes say " + money2(mean));
      var ten = (D.ten && D.ten[key]) || [];
      for (var j = 0; j < TEN && ten.length; j += 1) {
        if (money0(runs[j].G1) !== money0(ten[j])) console.error("sec3c-runs: episode " + (j + 1) + " of " + key + " has G1 " + money0(runs[j].G1) + ", S3C.ten says " + money0(ten[j]));
      }
      L.block = null;
      R.layers.push(L);
      return R.layers.length - 1;
    };

    function block(i) {
      var L = R.layers[i];
      if (!L.block) {
        L.block = OB.runs.block(L.runs.slice(0, TEN), { compact: false, head: false, label: true, g1: true });
        L.block.classList.add("s3c-rows");
      }
      return L.block;
    }
    function g1Slots(bk, on) {
      bk.g1s.forEach(function (g) { g.classList.toggle("ob-hide", !on); g.style.opacity = ""; });
    }
    function setBlock(i) {
      var bk = block(i);
      if (R.block && R.block !== bk && R.block.parentNode) R.block.parentNode.removeChild(R.block);
      if (bk.parentNode !== R.face) R.face.insertBefore(bk, R.head);
      bk.style.position = "";
      bk.style.left = bk.style.top = "";
      bk.style.clipPath = "";
      bk.rows.forEach(function (rw) { rw.style.clipPath = ""; });
      g1Slots(bk, R.cur.g1 >= 0);
      R.block = bk;
    }
    function deckAt(f) {
      R.cards.forEach(function (cd, j) { cd.style.opacity = String(clamp01((f - 0.12 - 0.3 * j) / 0.12)); });
    }

    /* The stream: STRIPS strips, each an episode of the layer (episodes 11 to 58), from the source along the arrow's
       elbow into the stack; f(frac) is told how much of the stream has arrived. */
    function stream(api, i, delay, emit, fly, f) {
      var L = R.layers[i];
      api.at(delay, function () {
        if (!R.src) return;
        var host = R.box.closest(".s3c-dia");
        if (!host) return;
        var H = host.getBoundingClientRect(), q = R.src.getBoundingClientRect(), t = R.face.getBoundingClientRect();
        if (!q.width || !t.width) { if (f) f(1); return; }
        var x1 = q.left + q.width / 2 - H.left, y1 = q.bottom + 6 - H.top;
        var x2 = t.left + t.width / 2 - H.left, y2 = t.top + 16 - H.top, ym = (q.bottom + t.top) / 2 - H.top - LIFT;
        var pts = [[x1, y1], [x1, ym], [x2, ym], [x2, y2]], segs = [], len = 0;
        for (var s = 1; s < pts.length; s += 1) {
          var l = Math.abs(pts[s][0] - pts[s - 1][0]) + Math.abs(pts[s][1] - pts[s - 1][1]);
          segs.push(l);
          len += l;
        }
        function along(u) {
          var d = u * len;
          for (var s2 = 0; s2 < segs.length; s2 += 1) {
            if (d <= segs[s2] || s2 === segs.length - 1) {
              var k = segs[s2] ? Math.min(1, d / segs[s2]) : 1, A = pts[s2], Bp = pts[s2 + 1];
              return [A[0] + (Bp[0] - A[0]) * k, A[1] + (Bp[1] - A[1]) * k];
            }
            d -= segs[s2];
          }
          return pts[pts.length - 1];
        }
        var layer = el("div", "s3c-streams");
        host.appendChild(layer);
        var W = wear(), strips = [];
        for (var j = 0; j < STRIPS; j += 1) {
          var run = L.runs[TEN + j], stops = [];
          for (var w = 0; w < run.states.length; w += 1) {
            var a0 = (100 * w / run.states.length).toFixed(2), a1 = (100 * (w + 1) / run.states.length).toFixed(2);
            stops.push(W[run.states[w]] + " " + a0 + "% " + a1 + "%");
          }
          var e = el("div", "s3c-strip");
          e.style.background = "linear-gradient(90deg," + stops.join(",") + ")";
          e.style.opacity = "0";
          layer.appendChild(e);
          strips.push({ e: e, t0: emit * Math.pow(j / STRIPS, 0.75) });
        }
        var total = emit + fly;
        api.animate(total, function (p) {
          var now = unease(p) * total;
          strips.forEach(function (S) {
            var u = (now - S.t0) / fly;
            if (u <= 0 || u >= 1) { S.e.style.opacity = "0"; return; }
            var xy = along(Math.pow(u, 1.25));
            S.e.style.opacity = String(Math.min(1, u / 0.12));
            S.e.style.transform = "translate(" + (xy[0] - 10).toFixed(1) + "px," + (xy[1] - 2.5).toFixed(1) + "px)";
          });
          if (f) f(clamp01(Math.pow(clamp01((now - fly) / emit), 1 / 0.75)));
        }, function () { if (layer.parentNode) layer.parentNode.removeChild(layer); if (f) f(1); });
      });
    }

    R.runsOn = function (i, api, go, o) {
      o = o || {};
      var d0 = o.delay || 0, prev = R.cur.runs;
      if (i < 0) {
        R.cur.runs = -1;
        if (R.block && R.block.parentNode) R.block.parentNode.removeChild(R.block);
        R.block = null;
        R.face.classList.add("ob-hide");
        R.head.classList.add("ob-hide");
        deckAt(0);
        R.count.textContent = OB.texText(OB.num(TEN));
        return;
      }
      if (prev === i && R.block) { R.face.classList.remove("ob-hide"); deckAt(1); R.count.textContent = OB.texText(OB.num(D.n)); return; }
      R.cur.runs = i;
      if (!go) {
        setBlock(i);
        R.face.classList.remove("ob-hide");
        R.face.style.opacity = "";
        R.head.classList.add("ob-hide");
        deckAt(1);
        R.count.textContent = OB.texText(OB.num(D.n));
        return;
      }
      if (prev < 0) {
        // The first play: the sheet, then each episode week by week, one after another; then the stream and the count.
        setBlock(i);
        var bk = R.block;
        bk.rows.forEach(function (rw) { rw.style.clipPath = "inset(0 100% 0 0)"; });
        R.count.textContent = OB.texText(OB.num(TEN));
        deckAt(0);
        api.show(R.face, true, { delay: d0, dur: 500 });
        bk.rows.forEach(function (rw, j) {
          api.at(d0 + 300 + j * 160, function () {
            api.animate(560, function (p) { rw.style.clipPath = "inset(0 " + (100 * (1 - p)).toFixed(2) + "% 0 0)"; }, function () { rw.style.clipPath = ""; });
          });
        });
        var s0 = d0 + 300 + TEN * 160 + 300;
        stream(api, i, s0, 1900, 800, function (fr) {
          deckAt(fr);
          R.count.textContent = OB.texText(OB.num(Math.round(TEN + (D.n - TEN) * fr)));
        });
        return;
      }
      // Again, with the same luck: the new rows played over the old ones under a playhead, then the stream.
      var old = R.block, nb = block(i);
      R.face.classList.remove("ob-hide");
      deckAt(1);
      R.count.textContent = OB.texText(OB.num(D.n));
      g1Slots(nb, R.cur.g1 >= 0);
      if (!old || old === nb) { setBlock(i); return; }
      nb.style.position = "absolute";
      nb.style.left = old.offsetLeft + "px";
      nb.style.top = old.offsetTop + "px";
      nb.style.clipPath = "inset(0 100% 0 -4px)";
      R.face.insertBefore(nb, R.head);
      R.block = nb;
      R.head.style.left = old.offsetLeft + "px";
      R.head.style.top = (old.offsetTop - 3) + "px";
      R.head.style.height = (old.offsetHeight + 6) + "px";
      R.head.style.transform = "translateX(0)";
      var w = old.offsetWidth;
      api.at(d0, function () {
        R.head.classList.remove("ob-hide");
        R.head.style.opacity = "1";
        api.animate(1100, function (p) {
          nb.style.clipPath = "inset(0 " + (100 * (1 - p)).toFixed(2) + "% 0 -4px)";
          R.head.style.transform = "translateX(" + (w * p).toFixed(1) + "px)";
          R.head.style.opacity = String(Math.min(1, (1 - p) / 0.08));
        }, function () {
          if (old.parentNode) old.parentNode.removeChild(old);
          nb.style.position = "";
          nb.style.left = nb.style.top = "";
          nb.style.clipPath = "";
          R.head.classList.add("ob-hide");
        });
      });
      stream(api, i, d0 + 700, 1000, 600, null);
    };

    function heights(bins, k) { return bins.map(function (c) { return (HB - HT) * c / HMAX * (k === undefined ? 1 : k); }); }
    function setH(hs) {
      R.bars.forEach(function (r, b) {
        r.setAttribute("y", (HB - hs[b]).toFixed(2));
        r.setAttribute("height", hs[b].toFixed(2));
      });
    }
    function setBars(bins) { setH(heights(bins)); }
    /* The client rect of a part of bin b, from y0 to y1 (SVG units, y1 < y0): where a G1 lands. */
    function binRect(b, y0, y1) {
      var Q = R.svg.getBoundingClientRect(), k = Q.width / HW, bw = (X1 - X0) / NB;
      return { left: Q.left + (X0 + b * bw) * k, top: Q.top + y1 * k, width: bw * k, height: Math.max(1, (y0 - y1) * k) };
    }

    R.g1On = function (i, api, go, o) {
      o = o || {};
      var d0 = o.delay || 0, prev = R.cur.g1;
      if (i < 0) {
        R.cur.g1 = -1;
        R.hist.classList.add("ob-hide");
        if (R.block) g1Slots(R.block, false);
        setBars(R.bars.map(function () { return 0; }));
        return;
      }
      var L = R.layers[i];
      if (prev === i) { R.hist.classList.remove("ob-hide"); if (R.block) g1Slots(R.block, true); setBars(L.bins); return; }
      R.cur.g1 = i;
      if (!go) {
        R.hist.classList.remove("ob-hide");
        R.hist.style.opacity = "";
        if (R.block) g1Slots(R.block, true);
        setBars(L.bins);
        return;
      }
      if (prev < 0) {
        // The ten returns at the ends of their rows, one after another; each flies into its bin and lands there as a
        // block; then the other 990 pour in and the bars rise from the blocks to their counts.
        var bk = R.block, hs = R.bars.map(function () { return 0; }), fin = heights(L.bins);
        setH(hs);
        api.show(R.hist, true, { delay: d0, dur: 600 });
        if (bk) {
          bk.g1s.forEach(function (g, j) {
            g.classList.add("ob-hide");
            api.show(g, true, { delay: d0 + 200 + j * 90, dur: 400 });
          });
        }
        var f0 = d0 + 200 + TEN * 90 + 400, landed = R.bars.map(function () { return 0; });
        for (var j = 0; j < TEN; j += 1) {
          (function (j) {
            var b = Math.max(0, Math.min(NB - 1, Math.floor((L.g1[j] - LO) / BIN))), n = landed[b];
            landed[b] += 1;
            var y0 = HB - UNIT * n, y1 = y0 - UNIT;
            if (!bk) { hs[b] = Math.max(hs[b], HB - y1); setH(hs); return; }
            ghostFly(api, bk.g1s[j], null, { delay: f0 + j * 100, dur: 850, arc: 22, fade: 0.3,
              rect: function () { return binRect(b, y0, y1); },
              tick: function (p) { hs[b] = Math.max(hs[b], UNIT * n + UNIT * clamp01((p - 0.7) / 0.3)); setH(hs); },
              land: function () { hs[b] = Math.max(hs[b], UNIT * (n + 1)); setH(hs); } });
          })(j);
        }

   sec3c.js draws it with OB.texIn (tex.js, KaTeX, LaTeX's standard font); updLines is one formula in TeX. Node

  "use strict";

  function paren(x) { return x < 0 ? "(" + num(x, 0) + ")" : num(x, 0); }

    card: { kicker: "REINFORCE", title: "proto-REINFORCE",

    /* 310, the forward pass. */

      "Softmax gives " + STATES[h1.s] + " new probabilities: " + ACTIONS[h1.a] + " is now " + num(P1H[h1.a], 2) + ".",

    d.rcap = el("div", "s3c-cap");
    d.rcap.appendChild(OB.texEl("n =\\;"));
    d.rcap.appendChild(R.count);
    d.rcap.appendChild(document.createTextNode(" EPISODES"));
    d.c.runs.appendChild(d.rcap);
    d.stack = R.face;
    d.gstack = R.hist;
    d.c.g1.appendChild(R.hist);
    d.gcap = OB.html("div", "s3c-cap", "RETURN " + OB.texIn(X.G1) + " OF EACH EPISODE");
    d.c.g1.appendChild(d.gcap);
    d.A = avgBox(o.avg === undefined ? null : o.avg, o.avgCap || "");
    d.c.ab.appendChild(d.A.el);
    R.src = d.Q.el;
    /* A layer of episodes and returns for the preferences V, named key in S3C.ten, whose average return the scenes
       say is mean. */
    d.layer = function (V, key, mean) { return R.layer(V, key, mean); };
    d.runsOn = function (i, api, go, o2) { R.runsOn(i, api, go, o2); };
    d.g1On = function (i, api, go, o2) { R.g1On(i, api, go, o2); };
    d.markOn = function (i, api, go, o2) { R.markOn(i, api, go, o2); };
    d.flyAvg = function (api, to, o2) { R.flyAvg(api, to, o2); };

    /* The arrows of the forward pass: on (drawn at once, or in turn when o2.draw names them) or off. */
    d.arrows = function (api, ids, o2) {
      o2 = o2 || {};
      var ph = phone(), wide = window.matchMedia && window.matchMedia("(min-width: 1120px)").matches;
      var spec = {
        sm: [ph ? d.T.el : d.T.grid, ph ? d.Q.el : d.Q.grid, ph ? { label: "SOFTMAX" } : { label: "SOFTMAX", labelDy: -22 }],
        play: [d.Q.el, d.stack, { from: "bottom", to: "top", elbow: true }],
        g1: [d.stack, d.gstack, {}],
        avg: wide ? [d.gstack, d.A.el, {}] : [d.c.g1, d.A.el, { from: "bottom", to: "top", elbow: true }]
      };
      Object.keys(spec).forEach(function (id) {
        if (ids.indexOf(id) < 0) { api.unarrow(id); return; }
        var sp = spec[id], q = {};
        Object.keys(sp[2]).forEach(function (k) { q[k] = sp[2][k]; });
        if (o2.draw && o2.draw[id] !== undefined) q.delay = o2.draw[id]; else q.dur = 1;
        api.arrow(id, sp[0], sp[1], q);

    };

    /* The loop: from the average return out to the right, up above the diagram, and down into the preferences. */
    d.loop = { el: OB.svgEl("svg", { "class": "s3c-loop ob-hide", "aria-hidden": "true" }), p: 1 };
    d.loop.line = OB.svgEl("polyline", {});
    d.loop.head = OB.svgEl("polygon", {});
    d.loop.el.appendChild(d.loop.line);
    d.loop.el.appendChild(d.loop.head);
    d.el.appendChild(d.loop.el);
    d.drawLoop = function (p) {
      if (p !== undefined) d.loop.p = p;
      var f = d.loop.p, R = d.el.getBoundingClientRect(), a = d.A.el.getBoundingClientRect(), t = d.T.grid.getBoundingClientRect();
      if (!R.width || !a.width || !t.width) return;
      var h = 14, x1 = a.right - R.left + 8, y1 = a.top + a.height / 2 - R.top;
      var xr = R.width - 14, yt = 12, xb = t.left + t.width / 2 - R.left, yb = t.top - R.top - 5;
      var pts = [[x1, y1], [xr, y1], [xr, yt], [xb, yt], [xb, yb - h]];
      var len = 0;
      for (var i = 1; i < pts.length; i++) len += Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);
      d.loop.line.setAttribute("points", pts.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" "));
      d.loop.line.style.strokeDasharray = len + " " + len;
      d.loop.line.style.strokeDashoffset = String(len * (1 - f));
      d.loop.head.setAttribute("points", [xb, yb, xb - h * 0.62, yb - h, xb + h * 0.62, yb - h].map(function (v) { return v.toFixed(1); }).join(","));
      d.loop.head.style.opacity = f >= 1 ? "1" : "0";
    };
    d.loopOn = function (on, api, go, o2) {
      o2 = o2 || {};
      var e = d.loop.el;
      if (!on) { e.classList.add("ob-hide"); return; }
      if (LOOPS.indexOf(d) < 0) LOOPS.push(d);
      if (!e.classList.contains("ob-hide")) { d.drawLoop(1); return; }
      e.classList.remove("ob-hide");
      if (!go) { d.drawLoop(1); return; }
      d.drawLoop(0);
      api.at(o2.delay || 0, function () {
        api.animate(o2.dur || 1800, function (p) { d.drawLoop(p); }, function () { d.drawLoop(1); });
      });
    };
    return d;
  }

  OB.s3c = { Dia: Dia, avgBox: avgBox, updBox: updBox, lead: lead, say: say, live: live, hopW: hopW, sym: sym,
    fmtM: fmtM, opt: opt, ALL12: ALL12, dice: dice, reveal: reveal };

  /* 300. The card. */
  OB.scene({ page: 3, key: "proto-card", order: 300, title: X.card.title, card: X.card });

  /* 310. The forward pass, one box of the diagram per Next. */
  OB.scene({
    page: 3, key: "proto-forward", order: 310, title: "The forward pass", beats: X.forward.length,
    build: function (root) {
      root.classList.add("s3c-root");
      var P = this.parts = {};
      P.lead = lead(root);
      P.d = Dia(D.W0, { empty: true, avg: D.start });
      P.d.layer(D.W0, "W0", D.start);
      root.appendChild(P.d.wrap);
    },
    beat: function (k, api) {
      var P = this.parts, d = P.d, go = live(api, k);
      say(P.lead, X.forward[k], api);
      // 0: the preferences, picked at random, cell by cell.
      d.T.set(D.W0, go && k === 0 ? { delay: 500, cstagger: 110 } : undefined);
      // 1: softmax, then the probability table.
      api.show(d.Q.el, k >= 1, opt(go && k === 1, 1300));
      // 2: the policy is followed for the episodes: ten week by week, then the other 990, counted.
      [d.n, d.brace, d.rcap].forEach(function (e) { api.show(e, k >= 2, opt(go && k === 2, 900)); });
      d.runsOn(k >= 2 ? 0 : -1, api, go && k === 2, { delay: 900 });
      // 3: each episode's return G1: the ten as numbers, then the histogram of the 1,000.
      api.show(d.gcap, k >= 3, opt(go && k === 3, 3300));
      d.g1On(k >= 3 ? 0 : -1, api, go && k === 3, { delay: 200 });
      // 4: their average: its mark on the histogram, and its number flies into the box.
      d.markOn(k >= 4 ? 0 : -1, api, go && k === 4, { delay: 300 });
      api.show(d.A.el, k >= 4, opt(go && k === 4, 700));
      d.A.set(D.start);
      if (go && k === 4) d.flyAvg(api, d.A.num, { delay: 1500 });
      var ids = ["sm", "play", "g1", "avg"].slice(0, Math.max(0, k));
      var draw = {};
      if (go && k >= 1) draw[ids[k - 1]] = 0;
      d.arrows(api, ids, { draw: draw });
      // 5: the loop, and the number to raise.
      d.A.el.classList.toggle("s3c-lit", k >= 5);
      d.loopOn(k >= 5, api, go && k === 5, { delay: 300 });
    }
  });

  /* 320. The backward pass: one preference, a little more, and the average return that comes of it. */
  OB.scene({
    page: 3, key: "proto-backward", order: 320, title: "The backward pass", beats: X.backward.length,
    build: function (root) {
      root.classList.add("s3c-root");
      var P = this.parts = {}, h = D.hop1;
      P.root = root;
      P.lead = lead(root);
      var d = P.d = Dia(D.W0, { avg: D.start, avgCap: "BEFORE" });
      d.A.capOn(false);
      d.layer(D.W0, "W0", h.before);
      d.layer(hopW(D.W0, h.s, h.a), "W0h", h.after);
      P.zb = d.T.zoom(h.s, h.a, { cap: "BEFORE", value: h.w });
      P.za = d.T.zoom(h.s, h.a, { cap: "AFTER", value: h.w + EPS });
      d.c.zb.appendChild(P.zb.el);
      d.c.za.appendChild(P.za.el);
      P.ga = avgBox(h.after, "AFTER");
      d.c.aa.appendChild(P.ga.el);
      [P.zb.el, P.za.el, P.ga.el].forEach(function (e) { e.classList.add("ob-hide"); });
      root.appendChild(d.wrap);
    },
    /* Leaving at the last beat (Next to 360): the scene keeps a still copy of its picture, the place of its table of
       preferences and the places of the four numbers, which scene 360 flies into its own tables (sec3d.js). */
    leave: function () {
      var P = this.parts;
      if (P && this.k === X.backward.length - 1 && OB.s3dTake) OB.s3dTake(P.root, [P.zb.num, P.za.num, P.d.A.num, P.ga.num], P.d.T.el);
    },
    beat: function (k, api) {
      var P = this.parts, d = P.d, h = D.hop1, go = live(api, k);
      var cell = [h.s, h.a], W1 = hopW(D.W0, h.s, h.a);
      this.k = k;
      say(P.lead, X.backward[k], api);
      // The episodes and their returns of the preferences Before; at 4 of the preferences After, generated again
      // with the same luck.
      d.runsOn(k >= 4 ? 1 : 0, api, go && k === 4, { delay: 600 });
      d.g1On(k >= 4 ? 1 : 0, api, go && k === 4, { delay: 2300 });
      d.markOn(k >= 4 ? 1 : 0, api, go && k === 4, { delay: 2500 });
      // 0: the twelve preferences light up; one is picked at random and ringed.
      if (go && k === 0) {
        d.T.mark(ALL12);
        api.at(1600, function () { d.T.mark([cell]); d.T.rings([cell]); });
      } else { d.T.mark([cell]); d.T.rings([cell]); }
      // 1: its preference taken apart: Before. The average return of these preferences is its Before too.
      if (k >= 1) {
        if (go && k === 1) d.T.lift(h.s, h.a, P.zb, { delay: 300 });
        else { P.zb.el.classList.remove("ob-hide"); P.zb.el.style.visibility = ""; }
      } else api.show(P.zb.el, false);
      d.A.capOn(k >= 1, api, opt(go && k === 1, 1900));
      // 2: a little more, After.
      if (k >= 2) api.arrow("hop", P.zb.el, P.za.el, { label: "+" + OB.num(EPS, 2), labelDy: -22, delay: go && k === 2 ? 200 : 0, dur: go && k === 2 ? undefined : 1 });
      else api.unarrow("hop");
      api.show(P.za.el, k >= 2, opt(go && k === 2, 1400));
      // 3: the After goes into the table; softmax gives HEALTHY new probabilities.
      d.T.setCell(h.s, h.a, k >= 3 ? W1[h.s][h.a] : h.w, go && k === 3 ? { delay: 300 } : undefined);
      d.Q.setRow(h.s, B.softmax(k >= 3 ? W1[h.s] : D.W0[h.s]), go && k === 3 ? { delay: 1500 } : undefined);
      d.Q.rings(k === 3 ? [[h.s, null]] : []);

      api.show(P.ga.el, k >= 4, opt(go && k === 4, 3000));
      P.ga.set(h.after);
      if (go && k === 4) d.flyAvg(api, P.ga.num, { delay: 3800, dur: 1100, arc: 56 });   // high, over the box Before
      if (k >= 4) api.arrow("flow", P.za.el, P.ga.el, { delay: go && k === 4 ? 3000 : 0, dur: go && k === 4 ? undefined : 1 });
      else api.unarrow("flow");
      // 5: the four boxes together.
      [P.zb.el, P.za.el, d.A.el, P.ga.el].forEach(function (e) { e.classList.toggle("s3c-lit", k === 5); });
      // The forward arrows stand from the start.
      d.arrows(api, ["sm", "play", "g1", "avg"]);
    }
  });
})();

<script>/* sec3c2.js */
/* sec3c2.js: page 3, proto-REINFORCE after agent A6's close-up (agent A5, 2026-11-14), scenes 400 to 499. The kit
   of the diagram is OB.s3c (sec3c.js); every number comes from sec3c-data.js and every line from sec3c-text.js.

   400 The update (4 beats): the new preference 2.14 flies from the update into the table; softmax gives HEALTHY
       new probabilities (RUN 0.84); the same 1,000 episodes again (the ten played again under a playhead, the stream,
       the histogram moves right), the mark of the average goes and the room guesses (Compute); the mark at $73.57 and
       its number flies into the box: up, from -$172.24 to $73.57
   The episodes are drawn by OB.s3cRuns (sec3c-runs.js, agent W, 2026-11-16) through the diagram's d.layer, d.runsOn,
   d.g1On, d.markOn and d.flyAvg.
   410 The learning curve (3 beats, main session, 2026-11-16, evening): the whole diagram after update 1, the panel of
       its backward pass and its update, and an empty plot (across the updates, up the average return); the average
       of the preferences at random, -$172.24, flies to the first point; the average after update 1, $73.57, to the
       second
   420 Many updates (2 beats): the movie of updates 2 to 300 with the whole diagram, every part set at each update
       (the preference picked at random, its Before, After and change, nabla, the update, the preferences, the
       probabilities, the 1,000 episodes of the new policy, their histogram and average, the plot's new point), faster
       and faster, with Pause and Again; the end: the likeliest actions RUN, SERVICE, REPLACE, REPLACE, the optimal
       policy
   Scene 410 "Again" (a second update shown slowly) went at Carlos's word that evening: "show me only one loop".

   The movie runs on its own requestAnimationFrame loop (the engine's motions are for single moves): it is stopped in
   beat() and leave(), and an instant visit shows its end at once. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, el = OB.el, D = window.S3C, X = window.S3CT, K = OB.s3c, RV = OB.s3cRuns;
  if (!K) { console.error("sec3c2: sec3c.js is missing"); return; }

  /* 400. The update in the diagram. */
  OB.scene({
    page: 3, key: "proto-update", order: 400, title: "The update", beats: X.update.length,
    build: function (root) {
      root.classList.add("s3c-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      var d = P.d = K.Dia(D.W0, { avg: D.start });
      d.layer(D.W0, "W0", D.start);
      d.layer(D.W1, "W1", D.hop1.upd);
      P.U = K.updBox(X.updLines);
      d.el.appendChild(P.U.el);
      root.appendChild(d.wrap);
    },
    beat: function (k, api) {
      var P = this.parts, d = P.d, h = D.hop1, go = K.live(api, k), cell = [h.s, h.a];
      K.say(P.lead, X.update[k], api);
      if (k === 2) api.nextLabel("Compute");
      d.arrows(api, ["sm", "play", "g1", "avg"]);
      // 0: the update, and its new preference flies into the table.
      api.show(P.U.el, true);
      d.T.mark([cell]);
      if (go && k === 0) {
        d.T.setCell(h.s, h.a, h.w, { now: true });
        api.at(1500, function () {
          d.T.setCell(h.s, h.a, h.wNew, { now: true });
          api.fly(P.U.res, d.T.num(h.s, h.a), { arc: 30 });
        });
      } else {
        d.T.setCell(h.s, h.a, h.wNew, { now: true });
        d.T.num(h.s, h.a).style.visibility = "";
      }
      // 1: softmax gives HEALTHY new probabilities.
      d.Q.setRow(h.s, B.softmax(k >= 1 ? D.W1[h.s] : D.W0[h.s]), go && k === 1 ? { delay: 300 } : undefined);
      d.Q.rings(k === 1 ? [[h.s, null]] : []);
      d.Q.mark(k === 1 ? [cell] : []);
      // 2: the same episodes again, the mark of the average goes; the room guesses.
      d.runsOn(k >= 2 ? 1 : 0, api, go && k === 2, { delay: 300 });
      d.g1On(k >= 2 ? 1 : 0, api, go && k === 2, { delay: 2000 });
      d.markOn(k === 2 ? -1 : k >= 3 ? 1 : 0, api, go && (k === 2 || k === 3), { delay: 300 });
      // 3: the answer: the mark at the new average, and its number flies into the box.
      if (k === 2 || (go && k === 3)) d.A.ask();
      else d.A.set(k >= 3 ? h.upd : h.before);
      if (go && k === 3) d.flyAvg(api, d.A.num, { delay: 1300, set: function () { d.A.set(h.upd); } });
      d.A.el.classList.toggle("s3c-lit", k >= 3);
    }
  });

  /* 410 and 420 (main session, 2026-11-16, evening). Carlos: "you show me only one loop, and then you move to show me
     the plot of how the reward goes up to how to make the reward plot, and then show the iterations. I want you to
     show me the iterations exactly as we did in weekend 2, where we kept the entire diagram that illustrates one
     iteration of the proto-reinforce loop ... Like every time you compute a step to produce the next point in the
     plot, I want you to show me everything ... You don't have to do this part step by step ... but I want you to
     show me all the values there. And at the same speed at which you are doing the iterations in this last slide."
     Both scenes show the whole diagram of one update (OB.s3c.Dia), a panel with its backward pass and its update, and
     the learning curve. The diagram stands after the update: its preferences, probabilities, episodes and average
     are those of the new preferences, on the dice of the update's round, so the average box holds the plot's newest
     point. */

  /* The frames: FR[0] the preferences at random; FR[i] update i: its preference, its numbers, then the preferences
     and the probabilities after it, rebuilt from the movie's rows in hundredths (whole numbers, so the sums are exact).
     tools/check_proto.js checks that the rebuilt preferences end on D.end.W. */
  var FR = (function () {
    var H = D.W0.map(function (r) { return r.map(function (x) { return Math.round(x * 100); }); });
    function bets() { return H.map(function (r) { return r.map(function (x) { return x / 100; }); }); }
    var out = [{ i: 0, W: D.W0, P: B.softmaxTable(D.W0), g: D.start }];
    D.movie.forEach(function (m, k) {
      var s = m[0], a = m[1], w = H[s][a] / 100;
      H[s][a] += m[2];
      var W = bets();
      out.push({ i: k + 1, s: s, a: a, w: w, wNew: H[s][a] / 100, nabla: m[2], g: m[3], before: m[4], after: m[5],
        change: (Math.round(m[5] * 100) - Math.round(m[4] * 100)) / 100, W: W, P: B.softmaxTable(W) });
    });
    return out;
  })();
  var N = FR.length - 1, FIRST = 1;

  /* The episodes of frame i's preferences on its round's dice (dice 12 for the preferences at random and rounds 1
     and 2, B.dice(2000 + i) after), generated here and kept as the diagram draws them; their average must be the data's
     (a console error if not). About 2 ms a frame, once. */
  var SUM = [];
  function runsOf(i) {
    if (!SUM[i]) {
      var d = i <= 2 ? RV.dice() : B.dice(D.seeds.movieDiceBase + i, D.n);
      SUM[i] = RV.summary(OB.runs.play(FR[i].P, d, D.n));
      if (OB.money(SUM[i].mean, 2) !== OB.money(FR[i].g, 2)) {
        console.error("sec3c2: the episodes of frame " + i + " average " + OB.money(SUM[i].mean, 2) + ", the data says " + OB.money(FR[i].g, 2));
      }
    }
    return SUM[i];
  }

  /* The panel of update i: the preference picked at random (its state and action), Before, After and their change
     for the preference and for the average return, then nabla and the update. The formulas are drawn once; a frame only
     writes numbers. */
  function Panel() {
    var P = { el: el("div", "s3c-hp ob-box white") };
    P.el.appendChild(el("div", "tb-zcap", "BACKWARD PASS AND UPDATE"));
    var hd = el("div", "s3c-hphead");
    P.cs = [0, 1, 2, 3].map(function (s) { var c = OB.art.stateChip(s); c.classList.add("ob-gone"); hd.appendChild(c); return c; });
    P.ca = [0, 1, 2].map(function (a) { var c = OB.art.actionChip(a); c.classList.add("ob-gone"); hd.appendChild(c); return c; });
    P.el.appendChild(hd);
    var g = el("div", "s3c-hpgrid");
    ["", "BEFORE", "AFTER", "CHANGE"].forEach(function (t) { g.appendChild(el("div", "s3c-hph", t)); });
    /* A number of the grid: its cell, and in it the number's own span (which a flight carries). */
    function cell(cls) { var c = el("div", "s3c-hpc"), e = el("span", "s3c-hpn" + (cls ? " " + cls : "")); c.appendChild(e); g.appendChild(c); return e; }
    g.appendChild(OB.html("div", "s3c-hpl", "PREFERENCE " + OB.tex("\\theta_{s,a}")));
    P.w = cell(); P.w1 = cell(); P.dw = cell("s3c-hpd");
    g.appendChild(OB.html("div", "s3c-hpl", "AVERAGE " + OB.texIn(X.AVG)));
    P.gb = cell(); P.ga = cell(); P.dg = cell("s3c-hpd");
    P.el.appendChild(g);
    function line(parts) {
      var l = el("div", "s3c-line s3c-hpf");
      parts.forEach(function (q) { l.appendChild(q); });
      P.el.appendChild(l);
      return l;
    }
    P.ch = OB.texNumEl("", "");
    P.nab = OB.texNumEl("", "");
    P.l1 = line([OB.texEl("\\nabla =\\;"), P.ch, OB.texEl("\\;/\\;" + X.num(D.eps, 2) + " =\\;"), P.nab]);
    P.uw = OB.texNumEl("", "");
    P.un = OB.texNumEl("", "");
    P.res = OB.texNumEl("", "s3c-new");
    P.l2 = line([OB.texEl("\\theta_{s,a} =\\;"), P.uw, OB.texEl("\\;+\\;" + X.num(D.alpha, 2) + "\\;\\times\\;"), P.un, OB.texEl("\\;=\\;"), P.res]);
    function money(e, t, x) {
      var r = +x.toFixed(2);
      e.textContent = t;
      e.classList.toggle("gain", r > 0);
      e.classList.toggle("loss", r < 0);
    }
    P.set = function (r) {
      var h = X.hop(r);
      P.cs.forEach(function (c, s) { c.classList.toggle("ob-gone", s !== r.s); });
      P.ca.forEach(function (c, a) { c.classList.toggle("ob-gone", a !== r.a); });
      P.w.textContent = h.w;
      P.w1.textContent = h.w1;
      P.dw.textContent = h.dw;
      money(P.gb, h.before, r.before);
      money(P.ga, h.after, r.after);
      money(P.dg, h.dg, r.change);
      P.ch.textContent = OB.texText(h.change);
      P.nab.textContent = OB.texText(h.nabla);
      P.uw.textContent = OB.texText(h.w);
      P.un.textContent = OB.texText(h.nablaP);
      P.res.textContent = OB.texText(h.wNew);
    };
    return P;
  }

  /* The learning curve: the average return after each update, point by point. Across, the updates from 0 to the larger
     of 10 and the newest point's update: the first points stand apart, and the axis grows with the movie. Up, D.chart's
     scale. Two tags (HTML over the plot) carry the numbers of points 0 and 1 in scene 410. */
  var XMIN = 10;
  function Plot() {
    var C = { el: el("div", "s3c-plot") };
    C.ylab = OB.html("div", "s3c-ylab", "AVERAGE " + OB.texIn(X.AVG));
    C.el.appendChild(C.ylab);
    C.svg = OB.svgEl("svg", { "class": "s3c-csvg", "aria-hidden": "true" });
    C.el.appendChild(C.svg);
    C.axes = OB.svgEl("g", {});
    C.xt = OB.svgEl("g", {});
    C.best = OB.svgEl("line", { "class": "s3c-best" });
    C.bestLab = OB.svgEl("text", { "class": "s3c-bl" });
    C.bestLab.textContent = X.bestLab;
    C.curve = OB.svgEl("polyline", { "class": "s3c-curve" });
    C.d0 = OB.svgEl("circle", { "class": "s3c-dot s3c-dot0", r: "5" });
    C.dot = OB.svgEl("circle", { "class": "s3c-dot", r: "6" });
    [C.axes, C.xt, C.best, C.bestLab, C.curve, C.d0, C.dot].forEach(function (e) { C.svg.appendChild(e); });
    C.tags = [D.start, FR[1].g].map(function (v) {
      var t = OB.moneyEl(v, 2);
      t.classList.add("s3c-ptag", "ob-hide");
      C.el.appendChild(t);
      return t;
    });
    C.tagsOn = [false, false];
    C.n = -1;
    C.key = "";
    C.showBest = false;
    function xmax(n) { return Math.max(XMIN, n); }
    function geo() {
      var w = C.el.clientWidth, h = C.el.clientHeight, f = parseFloat(window.getComputedStyle(C.el).fontSize) || 11;
      var g = { w: w, h: h, f: f, l: Math.round(f * 4.6 + 14), r: 14, t: Math.round(f * 2.4), b: Math.round(f * 2 + 14) };
      g.y = function (v) { return g.t + (h - g.t - g.b) * (D.chart.hi - v) / (D.chart.hi - D.chart.lo); };
      return g;
    }
    function text(parent, x, y, s, cls, anchor) {
      var t = OB.svgEl("text", { x: x.toFixed(1), y: y.toFixed(1), "class": cls || "", "text-anchor": anchor || "start" });
      t.textContent = s;
      parent.appendChild(t);
      return t;
    }
    function clear(gr) { while (gr.firstChild) gr.removeChild(gr.firstChild); }
    function axes(g) {
      clear(C.axes);
      C.svg.setAttribute("width", g.w);
      C.svg.setAttribute("height", g.h);
      for (var v = D.chart.lo; v <= D.chart.hi; v += 100) {
        var y = g.y(v);
        C.axes.appendChild(OB.svgEl("line", { "class": v === 0 ? "s3c-zero" : "s3c-grid", x1: g.l, x2: g.w - g.r, y1: y, y2: y }));
        text(C.axes, g.l - 9, y + g.f * 0.45, OB.money(v, 0), "s3c-tl", "end");
      }
      C.axes.appendChild(OB.svgEl("polyline", { "class": "s3c-ax", points: g.l + "," + g.t + " " + g.l + "," + (g.h - g.b) + " " + (g.w - g.r) + "," + (g.h - g.b) }));
      text(C.axes, (g.l + g.w - g.r) / 2, g.h - 2, "UPDATES", "s3c-tt", "middle");

    var STEPS = [1, 2, 5, 10, 20, 25, 50, 100];
    function ticks(g, m, x) {
      clear(C.xt);
      var st = STEPS[STEPS.length - 1];
      for (var j = 0; j < STEPS.length; j += 1) if (m / STEPS[j] <= 6) { st = STEPS[j]; break; }
      for (var i = 0; i <= m; i += st) {
        var xi = x(i);
        C.xt.appendChild(OB.svgEl("line", { "class": "s3c-tick", x1: xi, x2: xi, y1: g.h - g.b, y2: g.h - g.b + 7 }));

  /* The view of 410 and 420: the lead, the diagram (OB.s3c.Dia) with the panel and the plot in cells of its own, the
     bar of the movie under the plot (420). */

  function View(root, bar) {

    var V = { lead: K.lead(root) };
    var d = V.d = K.Dia(FR[1].W, { avg: FR[1].g });
    d.el.classList.add("s3c-mvd");
    V.hop = Panel();
    var ch = el("div", "s3c-cell s3c-hopc");
    ch.style.gridArea = "hop";
    ch.appendChild(V.hop.el);
    d.el.appendChild(ch);
    V.plot = Plot();
    var cp = el("div", "s3c-cell s3c-plotc");
    cp.style.gridArea = "plot";
    cp.appendChild(V.plot.el);
    d.el.appendChild(cp);
    if (bar) {
      var b = el("div", "s3c-mvbar");
      V.pause = el("button", "ob-btn s3c-btn", "PAUSE");
      V.pause.type = "button";
      V.count = el("span", "s3c-count");
      V.again = el("button", "ob-btn quiet s3c-btn", "AGAIN");
      V.again.type = "button";

      cp.appendChild(b);

  window.addEventListener("resize", function () { VIEWS.forEach(function (V) { if (V.plot.key) V.plot.draw(); }); });

  /* Update i, everything at once: in the panel its backward pass and its update; in the diagram the preferences after
     it (the changed preference ringed), their probabilities, the episodes of the new policy on the update's dice, their
     histogram and average. plotN: the plot's last point (default i). */
  function render(V, i, plotN) {

    d.T.set(r.W, { now: true });
    V.hop.set(r);
    d.T.mark([[r.s, r.a]]);
    d.T.rings([[r.s, r.a]]);
    d.Q.set(r.P, { now: true });
    d.Q.rings([[r.s, null]]);
    d.R.frame(runsOf(i));
    d.A.set(r.g);

    if (V.count) V.count.textContent = X.counter(i);
  }
  function arrows(V, api, pt) {
    V.d.arrows(api, ["sm", "play", "g1", "avg"]);
    if (pt) api.arrow("pt", V.d.A.el, V.plot.el, pt === true ? { dur: 1 } : pt);

    page: 3, key: "proto-plot", order: 410, title: "The learning curve", beats: X.plot.length,
    build: function (root) { this.V = View(root, false); },
    beat: function (k, api) {

      arrows(V, api, k >= 2 ? (go && k === 2 ? { delay: 200 } : true) : false);
      // 1: the average of the preferences at random (the panel's Before) flies to point 0.
      V.hop.gb.classList.toggle("s3c-lit", k === 1);

        api.at(400 + OB.DUR.fly, function () { C.draw(0); });

        api.at(1300 + OB.DUR.fly, function () { C.draw(1); });

    page: 3, key: "proto-movie", order: 420, title: "Many updates", beats: X.movie.length,
    build: function (root) {

      V.pause.addEventListener("click", function () {
        if (V.M.playing) self.stop(); else if (V.M.k < N || V.M.t < dur(N)) self.play(); else self.play(true);
      });
      V.again.addEventListener("click", function () { self.play(true); });
    },
    /* Shows update k (only when the screen holds another). */

    extras: function (on) {

    },
    stop: function () {

    /* Plays from where the movie stands (or from update 1): update k stays on the screen for dur(k). */

      if (M.k === FIRST) { M.k = FIRST + 1; M.t = 0; }
      M.playing = true;
      M.last = 0;
      V.pause.textContent = "PAUSE";
      function tick(now) {
        if (!M.playing) return;

        M.last = now;

      arrows(V, api, true);

      V.M.k = N;

      V.M.shown = -1;

  function dur(k) { var j = k - FIRST - 1; return j < 8 ? 700 : Math.max(20, 700 * Math.pow(0.88, j - 7)); }

  OB.scene(MOVIE);
})();
</script>
<script>/* sec3d-data.js */
/* sec3d-data.js: every number that the close-up of page 3 shows (agent A6, 2026-11-14), computed from bessie.js.
   In the browser it is window.S3D (loaded before sec3d.js); in node, require('./sec3d-data.js'), for
   tools/check_closeup.js, which asserts every shown number.

   The guided example B.PROTO: the preference for RUN in HEALTHY (B.PROTO.pick), 1,000 episodes on B.dice(12, 1000),
   the hop epsilon = 0.01, the step size alpha = 0.01. B.hop gives the average return before and after the hop, on
   the same dice.

   Every number is shown with two decimals, as B.PROTO's comment says, and every shown number follows from the shown
   numbers before it, worked in hundredths (whole numbers, so the arithmetic is exact):
     change = after - before            -170.50 - (-172.24) = 1.74
     nabla  = change / epsilon          1.74 / 0.01 = 174
     w      = w + alpha x nabla         0.40 + 0.01 x 174 = 0.40 + 1.74 = 2.14
   The update climbs (theta_{s,a} + alpha nabla): the average return has to go up (Carlos, 2026-11-14, "yes!").

   DOLLARS: true writes the averages and their change as money (OB.money: "-$172.24", "$1.74"), as page 2 and Try it
   write every return; nabla, the preferences, epsilon and alpha are plain numbers. */

    var s = Math.abs(x).toFixed(p);

     alpha. */
  var U = {
    w0: Math.round(P.bets[S][A] * 100),            // 40
    eps: Math.round(P.eps * 100),                  // 1
    alpha: Math.round(P.alpha * 100),              // 1
    before: Math.round(hop.before * 100),          // -17224
    after: Math.round(hop.after * 100)             // -17050

  var V = {                                        // the shown numbers as numbers
    w0: U.w0 / 100, w1: U.w1 / 100, eps: U.eps / 100, alpha: U.alpha / 100,
    before: U.before / 100, after: U.after / 100, change: U.change / 100,
    nabla: NABLA, step: U.step / 100, wNew: U.wNew / 100

  var T = {                                        // the shown numbers as text
    w0: hund(U.w0), w1: hund(U.w1), eps: hund(U.eps), alpha: hund(U.alpha),
    before: avg(V.before), after: avg(V.after), change: avg(V.change), changeUp: avg(V.change, true),
    changeNum: hund(U.change), nabla: num(NABLA, 0), step: hund(U.step), wNew: hund(U.wNew),
    perUnit: DOLLARS ? money(NABLA, 0) : num(NABLA, 0),   // nabla read as the rise of the average for one unit of preference
    n: num(P.n, 0)

  var S3D = {
    DOLLARS: DOLLARS, s: S, a: A, n: P.n, U: U, V: V, T: T, hop: hop, bets: P.bets,
    num: num, money: money, hund: hund, avg: avg
  };
  if (NODE) module.exports = S3D;
  else root.S3D = S3D;
})(typeof window !== "undefined" ? window : this);

<script>/* sec3d.js */

   Carlos (REQUEST.md): "do a separate slide for this where we do the calculation on how to update, how to do the
   before and after, because having the entire diagram there is too distracting. So if we can just for a moment fade
   the diagram and then focus on this before and after calculation slowly, in particular in explaining ... why the W
   must be updated using this update formula." Agent A5's scene 320 ends on the four numbers of the hop; its scene 400
   brings the diagram back with the updated preference. Every number comes from sec3d-data.js (window.S3D, computed
   from bessie.js) and is asserted by tools/check_closeup.js; no number is written here.

   Carlos, 2026-11-17, on the close-up: "keep showing me at all times the table of bets, and you highlight the entry
   we are analyzing so people don't lose context ... I think we can skip slide 10 and simply from the four numbers
   just jump to the triangle of the hop. Again, the table of bets would not disappear, so we always keep context ...
   when the W appears, it would be nice to show an arrow to that entry in the table so it is clear. The slide 13
   should appear side by side with slide 14 and 12. I don't want that the formula disappears when we move to 13 and
   then to 14. Keep the formula there. Don't disappear things. Also keep the table of bets there, visible at all
   times, so that we know where the 0.40 appears when it appears in the formula. The new bet 2.14 goes back to the
   table of bets." So scene 350 (Up close: before and after) went, and scenes 370, 380 and 390 became one scene.

   360 The triangle of the hop (5 beats): on the left the table of preferences theta, small, its entry (HEALTHY, RUN)
       lit and ringed, and under it the table of the four numbers; on the right the plot: before and after as two
       points, their numbers flying out of the table; across, 0.41 - 0.40 = 0.01 from the two preferences; up,
       -$170.50 - (-$172.24) = $1.74 from the two averages; nabla = 1.74 / 0.01 as a fraction, its two numbers flying
       from the sides (the room guesses); Compute: 174. Next from 320's last beat flies 320's table of preferences to
       its place here and 320's four numbers into the table of the four numbers

       flying in from 360. 0: theta_{s,a} = theta_{s,a} + alpha nabla with alpha = 0.01, and an arrow from the
       symbol theta_{s,a} to its entry; 1: the sign: weekend 2's loss had to go down (minus, w = w - alpha nabla),
       here the average return has to go up (plus); 2 to 5, why this update, one card per Next, each a small copy of
       360's triangle of the hop (BEFORE, AFTER, across +epsilon, the vertical side UP or DOWN, the slope): a
       positive nabla raises the preference, a negative one lowers it, a steep slope moves it more, alpha keeps each
       move small; 6: the update worked out under the table, theta_{s,a} = 0.40 + 0.01 x 174 = ?, the 0.40 flying out
       of the table, 0.01 and 174 out of the line under the formula (the room guesses); 7, Compute: 2.14; 8: the new
       preference, 2.14, flies back into the table. Nothing that comes goes until the scene ends. */
(function () {

  if (!TB || !D) { console.error("sec3d: tables.js or sec3d-data.js is missing"); return; }
  var T = D.T, V = D.V;
  /* Formulas by KaTeX (tex.js), in LaTeX's standard font: tx(src) is the markup of the TeX src. A number that rolls at
     the end of a formula is an element in the face of the formulas (class ob-texn, OB.texFmt). */
  var tx = OB.tex;
  var NAB = tx("\\nabla"), AVG = tx("\\bar{G}_1");
  var INK = art.C.ink, INK2 = art.C.ink2;

  /* The lead line of a scene: its words change with the beat and fade in on Next (as in sec3b.js). The words sit in
     one inner span, so that the lead's flex box keeps the spaces around a subscript. */
  function lead(root) { var p = el("p", "ob-say s3d-lead"); root.appendChild(p); return p; }
  function say(p, markup, api) {
    if (p.dataset.t === markup) return;
    p.dataset.t = markup;
    p.innerHTML = "<span>" + markup + "</span>";
    if (api && api.forward && !api.instant) api.fade(p, true);
  }
  /* A piece of arithmetic that stays on one line of a lead. */
  function nw(markup) { return "<span class=\"s3d-nw\">" + markup + "</span>"; }
  /* True when beat k was reached with Next from the beat before it (or entered with Next): motion may play. */
  function live(api, k) { return api.forward && !api.instant && api.from === k - 1; }
  function avgFmt(x) { return D.avg(x); }
  function betFmt(x) { return OB.tables.fmt("bets", x); }
  var avgT = OB.texFmt(avgFmt), betT = OB.texFmt(betFmt), intT = OB.texFmt(function (x) { return OB.num(x, 0); });

  /* Small SVG tools for the plot of 360 and the why cards of 370. */
  function add(parent, tag, attrs) { var n = OB.svgEl(tag, attrs); parent.appendChild(n); return n; }
  function svgText(parent, x, y, t, cls, anchor) {
    var n = add(parent, "text", { x: x, y: y, "class": cls || "", "text-anchor": anchor || "middle" });
    n.textContent = t;
    return n;
  }
  /* A letter of a formula inside an SVG, in the face KaTeX draws it with (tex.css: s3d-tex upright, KaTeX_Main;
     s3d-tex s3d-tmath italic, KaTeX_Math): text t centred at x on the baseline y, size px. */
  function texText(parent, t, x, y, size, italic) {
    var n = add(parent, "text", { x: x, y: y, "class": "s3d-tex" + (italic ? " s3d-tmath" : ""), "text-anchor": "middle", "font-size": size, fill: INK });
    n.textContent = t;
    return n;
  }
  /* The symbol of the average return, G bar 1, at the end of an SVG text t, in the faces KaTeX draws it with: the
     italic G, KaTeX_Main's macron (character 713) set over it the way KaTeX sets an accent over a capital (back
     0.56 em of the G, raised 0.252 em), then the subscript 1 (class sub) after the G. */
  function gBar(t, sub) {
    add(t, "tspan", { "class": "s3d-tex s3d-tmath" }).textContent = "G";
    add(t, "tspan", { "class": "s3d-tex s3d-tbar", dx: "-0.56em", "baseline-shift": "0.252em" }).textContent = String.fromCharCode(713);
    add(t, "tspan", { "class": "s3d-tex " + sub, dx: "0.1em", dy: "3" }).textContent = "1";
  }
  /* A line drawn from its start in 1.2 s when go is true, or there at once. */
  function drawIn(api, n, go, delay) {
    var len = Math.hypot(+n.getAttribute("x2") - +n.getAttribute("x1"), +n.getAttribute("y2") - +n.getAttribute("y1"));
    n.style.strokeDasharray = len + " " + len;
    n.style.strokeDashoffset = "0";
    n.classList.remove("ob-hide");
    n.style.opacity = "";
    if (!go) return;
    n.style.strokeDashoffset = String(len);
    api.at(delay || 0, function () {
      api.animate(OB.DUR.arrow, function (p) { n.style.strokeDashoffset = String(len * (1 - p)); },
        function () { n.style.strokeDashoffset = "0"; });
    });
  }
  function hideLine(n) { n.classList.add("ob-hide"); }

  /* 360. The triangle of the hop, beside the table of the four numbers (agent W, 2026-11-16). Carlos: "when you
     show the table, the triangle of updates, don't move to another slide. Still show me the real numbers you
     calculated at the end and keep them in the diagram ... whenever you compute inside each side of the triangle,
     highlight the corresponding numbers in the table ... when you calculate nabla as a fraction, show the numbers in
     the two sides of the rectangle triangle moving toward the fraction ... And then do the calculation."

     The four numbers of the hop stand in a table on the left for the whole scene, under the table of preferences, the
     plot on the right: the preference across, the average return up, before and after as two points whose
     coordinates fly out of the table. Across, the two preferences light up and fly into the subtraction written
     under the bottom side (0.41 - 0.40 = 0.01); up, the two averages light up and fly into the subtraction written
     beside the right side, one number under the other; then the two results fly from the sides into the fraction of
     nabla, the room guesses, and Compute works it out. Every computation stays on the plot to the end.

     The hand-overs (main session, 2026-11-17; from agent W's hand-over of 2026-11-16): when Next leaves a scene at
     its last beat, the scene calls take() (OB.s3dTake for scene 320 of sec3c.js), which keeps a still copy of its
     picture, the place of its table of preferences and the place of each number that flies on. The first beat of
     the next scene lays that copy over itself where the scene before drew it, flies the table of preferences (a copy
     of its own) from the old place to its new one and the numbers into their new places, and fades the copy out, so
     nothing jumps and the table never leaves the screen: 320 hands over to 360, 360 to 370. Any other way into a
     scene shows it at once. */
  var HAND = null;
  /* A still copy of the children of root (the line of words aside, it changes as on every Next) on fixed position,
     where they are drawn now. The elements away (the table and the numbers that fly on) are hidden in the copy. */
  function snapshot(root, away) {
    away.forEach(function (e) { if (e) e.setAttribute("data-s3d-away", "1"); });
    var layer = el("div", "s3d-snap");
    Array.prototype.forEach.call(root.children, function (c) {
      if (c.classList.contains("ob-hide") || c.classList.contains("ob-gone")) return;
      if (c.classList.contains("ob-say")) return;
      var r = c.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var k = c.cloneNode(true);
      k.removeAttribute("id");
      k.classList.add("s3d-snapel");
      k.style.position = "fixed";
      k.style.margin = "0";
      k.style.left = r.left + "px";
      k.style.top = r.top + "px";
      k.style.width = r.width + "px";
      k.style.height = r.height + "px";
      layer.appendChild(k);
    });
    away.forEach(function (e) { if (e) e.removeAttribute("data-s3d-away"); });
    Array.prototype.forEach.call(layer.querySelectorAll("[data-s3d-away]"), function (n) {
      n.removeAttribute("data-s3d-away");
      n.style.visibility = "hidden";
    });
    return layer;
  }
  /* Called by a scene that Next leaves at its last beat: root, the numbers that fly on (elements), the table of
     preferences (an element). The hand-over is for the beat that comes at once; anything later finds none. */
  function take(root, nums, tab) {
    nums = nums || [];
    HAND = {
      snap: snapshot(root, nums.concat([tab])),
      tab: tab ? tab.getBoundingClientRect() : null,
      nums: nums.map(function (n) { return { r: n.getBoundingClientRect(), html: n.outerHTML }; })
    };
    setTimeout(function () { HAND = null; }, 0);
  }
  OB.s3dTake = take;
  /* The first beat of a scene, entered with Next: lays the copy of the scene before over the scene and fades it out
     from 250 ms in 900 ms; flies a copy of the table of preferences th (tables.js) from the old place to th. */
  function handIn(api, P, H) {
    if (P.snap && P.snap.parentNode) P.snap.parentNode.removeChild(P.snap);
    P.snap = H.snap;
    api.root.appendChild(P.snap);
    var snap = P.snap;
    api.at(250, function () {
      api.animate(900, function (p) { snap.style.opacity = String(1 - p); },
        function () { if (snap.parentNode) snap.parentNode.removeChild(snap); if (P.snap === snap) P.snap = null; });
    });
    if (H.tab) flyFrom(api, P.th.el.outerHTML, H.tab, P.th.el, { now: true, delay: 150, dur: 1300, arc: 0, plain: true });
  }
  function handOut(P) { if (P && P.snap) { var s = P.snap; P.snap = null; if (s.parentNode) s.parentNode.removeChild(s); } }

  /* A copy of an element, or of the markup html, flown from the rectangle a to the element to (fixed position, one
     scale that keeps its shape, centred on to); to stays hidden until the copy lands. As api.fly, but from a place
     that no element holds any more (the hand-over), and centred rather than stretched. o.plain: no white ground in
     flight (a whole table). o.keep: to keeps what it shows until the copy is nearly on it (a value it replaces);
     o.land() runs as the copy lands (it writes the new value). */
  function flyFrom(api, html, a, to, o) {
    o = o || {};
    if (!to) return;
    if (!o.keep) to.style.visibility = "hidden";
    function land() { if (o.land) o.land(); to.style.visibility = ""; }
    if (api.instant || !a || !a.width) { api.at(o.delay || 0, land); return; }
    // The copy stands at its start at once (o.now: it takes over from an element that has just gone), or from
    // o.delay; then it travels. A white ground fades in under it in flight, so it reads where it crosses numbers.
    var g = null;
    function make() {
      var host = el("div", "s3d-flyhost");
      host.innerHTML = html;
      g = host.firstChild;
      g.classList.remove("ob-hide");
      g.classList.add("s3d-fly");
      g.style.visibility = "visible";
      g.style.left = a.left + "px";
      g.style.top = a.top + "px";
      g.style.width = a.width + "px";
      g.style.height = a.height + "px";
      if (o.fs) g.style.fontSize = o.fs;
      document.body.appendChild(g);
    }
    if (o.now) make();
    api.at(o.delay || 0, function () {
      if (!g) make();
      var b = to.getBoundingClientRect();
      if (!b.width) { if (g.parentNode) g.parentNode.removeChild(g); land(); return; }
      var s = b.height / a.height;
      var dx = b.left + (b.width - a.width * s) / 2 - a.left, dy = b.top + (b.height - a.height * s) / 2 - a.top;
      var arc = o.arc === undefined ? 30 : o.arc;
      api.animate(o.dur || 1100, function (p) {
        g.style.transform = "translate(" + (dx * p) + "px," + (dy * p - Math.sin(Math.PI * p) * arc) + "px) scale(" + (1 + (s - 1) * p) + ")";
        if (o.keep && p >= 0.85) to.style.visibility = "hidden";
        if (!o.plain) g.style.backgroundColor = "rgba(255,255,255," + (0.88 * Math.max(0, Math.min(1, p / 0.12, (1 - p) / 0.12))).toFixed(3) + ")";
      }, function () { if (g && g.parentNode) g.parentNode.removeChild(g); land(); });
    });
  }
  /* The same from an element that stays where it is: its copy (or o.ghost's) flies to to. */
  function flyEl(api, from, to, o) {
    o = o || {};
    if (!from || !to) return;
    if (!o.keep) to.style.visibility = "hidden";
    api.at(o.delay || 0, function () {
      flyFrom(api, (o.ghost || from).outerHTML, from.getBoundingClientRect(), to,
        { dur: o.dur, arc: o.arc, fs: window.getComputedStyle(from).fontSize, keep: o.keep, land: o.land });
    });
  }

  /* The table of preferences theta, small, as scene 320 draws it, its entry (HEALTHY, RUN) lit in yellow and ringed:
     on 360 and 370 at all times. thetaOn sets the light and the ring (in beat, where the engine allows a ring). */
  var CELL = [D.s, D.a];
  function thetaTable() {
    var Tt = TB.table(D.bets, { kind: "bets", size: "s", cap: "PREFERENCES " + tx("\\theta") });
    Tt.el.classList.add("s3d-theta");
    return Tt;
  }
  function thetaOn(Tt) { Tt.mark([CELL]); Tt.rings([CELL]); }

  /* The table of the four numbers: BEFORE and AFTER across the top, the preference (the entry's chips) and the
     average return down the side. lit("bet" | "avg" | "") lights a row's two numbers. */
  function table4() {
    var Tb = { el: el("div", "s3d-tab ob-box white") };
    function put(e) { Tb.el.appendChild(e); return e; }
    function numCell(text, cls) {
      var c = put(el("div", "s3d-td"));
      var n = el("span", "s3d-tn" + (cls ? " " + cls : ""), text);
      c.appendChild(n);
      return { el: c, num: n };
    }
    put(el("div", "s3d-t0"));
    put(el("div", "s3d-th", "BEFORE"));
    put(el("div", "s3d-th", "AFTER"));
    var rb = put(el("div", "s3d-trh"));
    rb.appendChild(art.stateChip(D.s));
    rb.appendChild(art.actionChip(D.a));
    Tb.w0 = numCell(T.w0);
    Tb.w1 = numCell(T.w1);
    var rg = put(el("div", "s3d-trh"));
    rg.appendChild(OB.html("span", "s3d-gname", "AVERAGE " + AVG));
    Tb.g0 = numCell(T.before, V.before < 0 ? "loss" : "gain");
    Tb.g1 = numCell(T.after, V.after < 0 ? "loss" : "gain");
    Tb.lit = function (which) {
      [Tb.w0, Tb.w1].forEach(function (c) { c.el.classList.toggle("s3d-tlit", which === "bet"); });
      [Tb.g0, Tb.g1].forEach(function (c) { c.el.classList.toggle("s3d-tlit", which === "avg"); });
    };
    return Tb;
  }

  /* The subtractions written on the sides of the triangle, in the face of the formulas: across, on one line under
     the bottom side; up, one number under the other beside the right side. Each number is its own element, so the
     numbers of the table can fly into it. */
  function op(src, cls) { return OB.html("span", "s3d-op" + (cls ? " " + cls : ""), tx(src)); }
  function acrossCalc() {
    var C = { el: el("div", "s3d-cx") };
    C.a = OB.texNumEl(T.w1, "s3d-cn");
    C.b = OB.texNumEl(T.w0, "s3d-cn");
    C.r = OB.texNumEl(T.eps, "s3d-cn s3d-cr");
    C.ops = [op("-", "s3d-bin"), op("=", "s3d-bin")];
    [C.a, C.ops[0], C.b, C.ops[1], C.r].forEach(function (e) { C.el.appendChild(e); });
    return C;
  }
  function upCalc() {
    var C = { el: el("div", "s3d-cy") };
    var l1 = el("div", "s3d-cyl"), l2 = el("div", "s3d-cyl"), l3 = el("div", "s3d-cyl");
    C.a = OB.texNumEl(T.after, "s3d-cn");
    l1.appendChild(C.a);
    C.ops = [op("-", "s3d-cyop"), op("(")];
    C.b = OB.texNumEl(T.before, "s3d-cn");
    C.ops.push(op(")"));
    [C.ops[0], C.ops[1], C.b, C.ops[2]].forEach(function (e) { l2.appendChild(e); });
    C.rule = el("div", "s3d-cyr");
    C.r = OB.texNumEl(T.change, "s3d-cn s3d-cr s3d-cgain");
    l3.appendChild(C.r);
    [l1, l2, C.rule, l3].forEach(function (e) { C.el.appendChild(e); });
    return C;
  }

  /* 360's plot, in the units of its viewBox (plain px on a desk, scaled down on a phone): the preference across, the
     average return up, before and after as two points, the right triangle and its slope. The words on its sides are
     HTML laid over it (s3d-pov), sized with the plot by --s3d-k. */
  var PV = { w: 600, h: 330 };
  var AX = { x: 150, y: 270, top: 34, right: 585 };
  var PB = { x: 250, y: 228 }, PA = { x: 452, y: 66 };
  function hopPlot() {
    var svg = OB.svgEl("svg", { "class": "s3d-psvg", viewBox: "0 0 " + PV.w + " " + PV.h, width: PV.w, height: PV.h, "aria-hidden": "true" });
    var P = { svg: svg };
    // A point: its dashed guides to the axes (under the triangle), its mark, ticks and tag (over it), and the two
    // numbers on the axes in a group of their own (lab), which the table's numbers fly into.
    function point(p, xt, yt) {
      var under = add(svg, "g", { "class": "ob-hide" });
      add(under, "line", { "class": "s3d-pgd", x1: p.x, y1: p.y + 10, x2: p.x, y2: AX.y });
      add(under, "line", { "class": "s3d-pgd", x1: AX.x, y1: p.y, x2: p.x - 10, y2: p.y });
      var over = OB.svgEl("g", { "class": "ob-hide" });
      add(over, "line", { "class": "s3d-ptick", x1: p.x, y1: AX.y, x2: p.x, y2: AX.y + 8 });
      add(over, "line", { "class": "s3d-ptick", x1: AX.x - 8, y1: p.y, x2: AX.x, y2: p.y });
      var lab = OB.svgEl("g", { "class": "ob-hide" });
      var x = svgText(lab, p.x, AX.y + 28, xt, "s3d-ptk");
      var y = svgText(lab, AX.x - 13, p.y + 8, yt, "s3d-ptk", "end");
      return { under: under, over: over, lab: lab, xt: x, yt: y };
    }
    P.axes = add(svg, "g", { "class": "s3d-pax" });
    add(P.axes, "line", { x1: AX.x, y1: AX.y, x2: AX.right, y2: AX.y });
    add(P.axes, "line", { x1: AX.x, y1: AX.top, x2: AX.x, y2: AX.y });
    gBar(svgText(P.axes, AX.x, 20, "AVERAGE ", "s3d-ptit", "start"), "s3d-psub");
    svgText(P.axes, AX.right, PV.h - 6, "THE PREFERENCE", "s3d-ptit", "end");
    P.B = point(PB, T.w0, T.before);
    P.A = point(PA, T.w1, T.after);
    // The triangle: its tint, across, up, and the slope from before to after.
    P.fill = add(svg, "polygon", { "class": "s3d-ptf ob-hide", points: [PB.x, PB.y, PA.x, PB.y, PA.x, PA.y].join(",") });
    P.across = add(svg, "line", { "class": "s3d-pleg ob-hide", x1: PB.x, y1: PB.y, x2: PA.x, y2: PB.y });
    P.up = add(svg, "line", { "class": "s3d-pleg s3d-pup ob-hide", x1: PA.x, y1: PB.y, x2: PA.x, y2: PA.y });
    P.hyp = add(svg, "line", { "class": "s3d-phyp ob-hide", x1: PB.x, y1: PB.y, x2: PA.x, y2: PA.y });
    P.nab = add(svg, "g", { "class": "ob-hide" });
    texText(P.nab, String.fromCharCode(8711), 328, 121, 36, false);
    // The marks of the points, their tags and their numbers, on top.
    [P.B.over, P.A.over, P.B.lab, P.A.lab].forEach(function (gr) { svg.appendChild(gr); });
    svgText(P.B.over, PB.x - 16, PB.y + 27, "BEFORE", "s3d-ptag", "end");
    add(P.B.over, "rect", { "class": "s3d-ppt s3d-pold", x: PB.x - 8, y: PB.y - 8, width: 16, height: 16 });
    svgText(P.A.over, PA.x + 16, PA.y - 6, "AFTER", "s3d-ptag", "start");
    add(P.A.over, "rect", { "class": "s3d-ppt", x: PA.x - 8, y: PA.y - 8, width: 16, height: 16 });
    return P;
  }
  /* The plot's scale (rendered width over the viewBox's), for the HTML words laid over it. */
  function fitK(P) {
    var w = P.svg.getBoundingClientRect().width;
    if (w) P.box.style.setProperty("--s3d-k", (w / PV.w).toFixed(4));
  }
  var PLOTS = [];
  window.addEventListener("resize", function () { PLOTS.forEach(fitK); });

  var L360 = [
    "In a picture: the preference across, the average return " + AVG + " up. Before and after are two points.",
    "Across: the preference moved by " + T.eps + ".",
    "Up: the average return " + AVG + " rose by " + T.change + ".",
    nw(NAB + ",") + " nabla, is the slope of the triangle: up divided by across. Guess it, then press Compute.",
    nw(tx("\\nabla = " + T.nabla) + ":") + " near this preference, the average return " + AVG + " rises by " + T.perUnit + " for each unit of preference."
  ];
  OB.scene({
    page: 3, key: "closeup-slope", order: 360, title: "The triangle of the hop", beats: L360.length,
    build: function (root) {
      var P = this.parts = hopPlot();
      P.root = root;
      P.lead = lead(root);
      var row = el("div", "s3d-trow");
      var col = el("div", "s3d-tcol");
      P.th = thetaTable();
      col.appendChild(P.th.el);
      P.tab = table4();
      col.appendChild(P.tab.el);
      row.appendChild(col);
      var box = el("div", "s3d-plot");
      box.appendChild(P.svg);
      var ov = el("div", "s3d-pov");
      P.cx = acrossCalc();
      P.cy = upCalc();
      ov.appendChild(P.cx.el);
      ov.appendChild(P.cy.el);
      box.appendChild(ov);
      P.box = box;
      // The plot and, under it, nabla as a fraction (the right column; the tables are the left one).
      var rc = el("div", "s3d-rcol");
      rc.appendChild(box);
      row.appendChild(rc);
      root.appendChild(row);
      // nabla as a fraction: up over across; the two numbers fly in from the sides, the result waits for Compute.
      var eq = el("div", "s3d-eq ob-hide");
      eq.appendChild(OB.html("span", "s3d-eqf", tx("\\nabla = \\dfrac{\\htmlClass{s3d-fn}{" + T.changeNum + "}}{\\htmlClass{s3d-fd}{" + T.eps + "}} =\\;")));
      P.nv = el("span", "s3d-eqv s3d-q ob-texn", "?");
      eq.appendChild(P.nv);
      P.eq = eq;
      P.fn = eq.querySelector(".s3d-fn");
      P.fd = eq.querySelector(".s3d-fd");
      rc.appendChild(eq);
      PLOTS.push(P);
    },
    /* Leaving: the copy of 320 goes; at the last beat (Next to 370) the table of preferences flies on. */
    leave: function () {
      var P = this.parts;
      handOut(P);
      if (P && this.k === L360.length - 1) take(P.root, [], P.th.el);
    },
    beat: function (k, api) {
      var P = this.parts, go = live(api, k), H = k === 0 && go && api.from === -1 ? HAND : null;
      HAND = null;
      this.k = k;
      say(P.lead, L360[k], api);
      if (k === 3) api.nextLabel("Compute");
      fitK(P);
      handOut(P);
      // The table of preferences: the entry in focus, at every beat.
      thetaOn(P.th);
      P.th.el.style.visibility = "";
      // The table: the preferences lit while across is worked out (1), the averages while up is (2).
      P.tab.lit(k === 1 ? "bet" : k === 2 ? "avg" : "");

      // Beat 0: the tables (from 320, or at once), then before and after come onto the axes, their numbers flying
      // out of the table.
      var t = 0;
      if (k === 0 && go) {
        if (H) {
          handIn(api, P, H);
          [P.tab.w0, P.tab.w1, P.tab.g0, P.tab.g1].forEach(function (c, i) {
            if (H.nums[i]) flyFrom(api, H.nums[i].html, H.nums[i].r, c.num, { now: true, delay: 120 + i * 90, dur: 1200, arc: 16 });
          });
          P.tab.el.classList.add("ob-hide");
          api.show(P.tab.el, true, { delay: 350, dur: 1000 });
          t = 1700;
        } else {
          P.tab.el.classList.add("ob-hide");
          api.show(P.tab.el, true, { delay: 100, dur: 1000 });
          t = 900;
        }
