<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Old Bessie 1: MDPs</title>
<style>/* core.css */
/* core.css: the look of "Old Bessie", the engine's stylesheet (agent A2, 2026-11-14). ENGINE.md documents it.

   Since 2026-11-16 the look is Grand Prix (Carlos: "Grand prix is the winner, do that"), from the design round of
   2026-11-15 (../../design/): skin-base.css and skin.css load after this file and set the fonts (Barlow, Barlow
   Condensed), the colours and the frame. The values below are the retro console look of 2026-11-14 (the arcade's light
   "paper" theme), kept as defaults that the skin overrides. Sizes of words are multiplied by var(--fz) and line
   heights by var(--lh), both set by the skin. Light only: no dark theme and no theme toggle (Carlos, 2026-11-14).

   Larger words on large screens (the rule of weekend 2, w2-cx-private/CLAUDE.md): on a screen of at least 1080 x 740
   px --tx is 1.4. A size of words up to 18 px is written calc(V * var(--tx)); a larger one grows by a share that falls
   to nothing at 44 px: calc(V * (1 + (var(--tx) - 1) * w)) with w = (44 - V) / 26. Boards, tables, sprites, the top
   bar and the Back and Next buttons keep their sizes. */

:root {
  --px: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --bg: #E8E0CC;            /* the NES shell */
  --box: #F8F4E4;           /* dialog boxes */
  --white: #FFFFFF;
  --ink: #181818;
  --ink2: #585858;          /* secondary ink */
  --hi: #404040;            /* the inner line of a dialog box */
  --press: #BBB6A2;         /* the pressed edge of a button */
  --yellow: #F8D028;
  --ring: #E84828;          /* the highlight ring */
  --run: #1666C8;           /* RUN, calm blue */
  --service: #E08A00;       /* SERVICE, amber */
  --replace: #D33A2C;       /* REPLACE, hot red */
  --run-soft: #DCE9FB;
  --service-soft: #FBEED2;
  --replace-soft: #FADBD6;
  --wear0: #2E8B57;         /* HEALTHY */
  --wear1: #C99A33;         /* WORN */
  --wear2: #E07A2A;         /* SHAKY */
  --wear3: #D33A2C;         /* FAILING */
  --wear0-soft: #D5EBDD;
  --wear1-soft: #F3E6C4;
  --wear2-soft: #F8DCC4;
  --wear3-soft: #F6D2CC;
  --gain: #1F7A45;          /* a positive amount of money */
  --loss: #C0302A;          /* a negative amount of money */
  --gut: 16px;
  --tx: 1;
}
@media (min-width: 1080px) and (min-height: 740px) { :root { --tx: 1.4; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--px);
  font-size: calc(calc(12px * var(--tx)) * var(--fz, 1));
  line-height: calc(1.7 * var(--lh, 1));
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button { font-family: var(--px); color: var(--ink); }

/* The frame: top bar, stage, footer. */
.app {
  height: 100vh; height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.topbar {
  display: flex; align-items: center; gap: 12px; min-width: 0;
  padding: 7px var(--gut);
  background: var(--box);
  border-bottom: 4px solid var(--ink);
}
.topbar .brand {
  font-size: calc(11px * var(--fz, 1)); line-height: calc(1.4 * var(--lh, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 0 1 auto; min-width: 0;
}
.pager { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: 0 1 auto; min-width: 0; overflow: hidden; }
.pager button {
  min-width: 26px; height: 26px; padding: 0 4px;
  font-size: calc(9px * var(--fz, 1)); line-height: 1;
  background: var(--box); border: 2px solid var(--ink); border-radius: 0;
  box-shadow: inset -2px -2px 0 0 var(--press);
  cursor: pointer; flex: 0 0 auto;
}
.pager button.card { min-width: 14px; width: 14px; padding: 0; background: var(--ink2); box-shadow: none; }
.pager button.opt { border-style: dashed; }
.pager button[aria-current] { background: var(--yellow); box-shadow: inset 2px 2px 0 0 #B89020; }
.pager .gap { font-size: calc(9px * var(--fz, 1)); color: var(--ink2); flex: 0 0 auto; padding: 0 1px; }
.pager.fold .far { display: none; }
[data-fullscreen] { display: flex; flex: 0 0 auto; }
.fullbtn {
  width: 34px; height: 30px; padding: 0;
  background: var(--box); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 0;
  box-shadow: inset -2px -2px 0 0 var(--press);
  cursor: pointer;
}
.fullbtn:hover { background: var(--yellow); }

.stage { position: relative; overflow: auto; padding: 10px var(--gut) 12px; min-height: 0; }
.scene { display: none; min-height: 100%; flex-direction: column; }
.scene.active { display: flex; }
.scene-head { display: flex; align-items: baseline; gap: 14px; min-width: 0; padding: 2px 0 8px; }
.scene-head .scene-no { font-size: calc(calc(14px * var(--tx)) * var(--fz, 1)); color: var(--ink2); flex: 0 0 auto; }
.scene-head h2 { margin: 0; font-weight: 400; line-height: calc(1.35 * var(--lh, 1)); font-size: calc(calc(18px * var(--tx)) * var(--fz, 1)); min-width: 0; }
.scene-head .opt-tag {
  margin-left: auto; flex: 0 0 auto;
  font-size: calc(calc(9px * var(--tx)) * var(--fz, 1)); line-height: 1; padding: 6px 8px;
  border: 2px dashed var(--ink); background: var(--box);
}
.scene-body { position: relative; flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; }
.scene-inner {
  position: relative; width: 100%; max-width: 1240px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: calc(14px * var(--tx));
}
.scene.card .scene-head { display: none; }

.foot {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
  padding: 8px var(--gut) 10px;
  background: var(--box);
  border-top: 4px solid var(--ink);
}
.navbtn {
  min-width: 132px; padding: 13px 16px 11px;
  font-size: calc(14px * var(--fz, 1)); line-height: 1;
  background: var(--box); border: 4px solid var(--ink); border-radius: 0;
  box-shadow: inset -4px -4px 0 0 var(--press);
  cursor: pointer; touch-action: manipulation;
}
.navbtn.next { background: var(--yellow); box-shadow: inset -4px -4px 0 0 #B89020; }
.navbtn:active:not(:disabled) { box-shadow: inset 4px 4px 0 0 var(--press); }
.navbtn:disabled { opacity: 0.35; cursor: default; }
.navbtn.skip { min-width: 0; font-size: calc(11px * var(--fz, 1)); padding: 11px 12px 9px; border-style: dashed; }
.navbtn.skip[hidden] { display: none; }
.beats { display: flex; justify-content: center; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.beats i { width: 12px; height: 12px; border: 2px solid var(--ink); background: transparent; flex: 0 0 auto; }
.beats i.past { background: var(--ink2); }
.beats i.on { background: var(--yellow); }

/* The stage card at the start of a page (and any scene with card: {...}), in the manner of a console's stage card. */
.ob-card {
  align-self: center; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: calc(18px * var(--tx));
  padding: calc(34px * var(--tx)) calc(56px * var(--tx)) calc(28px * var(--tx));
  min-width: min(100%, 640px); max-width: 100%;
}
.ob-card .kicker { font-size: calc(calc(14px * var(--tx)) * var(--fz, 1)); color: var(--ink2); letter-spacing: 0.08em; }
.ob-card .title { margin: 0; font-weight: 400; line-height: calc(1.3 * var(--lh, 1)); font-size: calc(64px * var(--fz, 1)); }
.ob-card .line { font-size: calc(calc(13px * var(--tx)) * var(--fz, 1)); line-height: calc(1.8 * var(--lh, 1)); max-width: 40ch; color: var(--ink2); }
.ob-card .road { display: flex; align-items: flex-end; justify-content: center; gap: 18px; min-height: 90px; }
.ob-card .press { font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); animation: ob-blink 2s cubic-bezier(.45,.05,.55,.95) infinite; }
.ob-card .drive { animation: ob-drive 1.4s cubic-bezier(.2,.7,.2,1) both; }
@keyframes ob-drive { from { transform: translateX(-240px); } to { transform: none; } }
@keyframes ob-blink { 50% { opacity: 0; } }

/* Dialog boxes and words. */
.ob-box {
  background: var(--box);
  border: 4px solid var(--ink);
  border-radius: 0;
  box-shadow: inset 0 0 0 2px var(--box), inset 0 0 0 4px var(--hi);
  padding: calc(12px * var(--tx)) calc(16px * var(--tx));
}
.ob-box.plain { box-shadow: none; }
.ob-box.white { background: var(--white); box-shadow: inset 0 0 0 2px var(--white), inset 0 0 0 4px var(--hi); }
.ob-say { font-size: calc(calc(15px * var(--tx)) * var(--fz, 1)); line-height: calc(1.75 * var(--lh, 1)); text-align: center; max-width: 52ch; margin: 0; text-wrap: balance; }
.ob-say.left { text-align: left; }
.ob-note { font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: calc(1.8 * var(--lh, 1)); color: var(--ink2); text-align: center; max-width: 60ch; margin: 0; }
.ob-big { font-size: calc(calc(24px * (1 + (var(--tx) - 1) * 0.769)) * var(--fz, 1)); line-height: calc(1.35 * var(--lh, 1)); }
.ob-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(14px * var(--tx)); }
.ob-col { display: flex; flex-direction: column; align-items: center; gap: calc(10px * var(--tx)); }
.ob-hide { visibility: hidden; }
.ob-gone { display: none !important; }
.ob-mark { background: var(--yellow); padding: 0 0.2em; }

/* Buttons inside a scene (Compute, Roll, Done). */
.ob-btn {
  font-size: calc(calc(12px * var(--tx)) * var(--fz, 1)); line-height: 1;
  padding: calc(10px * var(--tx)) calc(14px * var(--tx));
  background: var(--yellow); border: 4px solid var(--ink); border-radius: 0;
  box-shadow: inset -4px -4px 0 0 #B89020;
  cursor: pointer; touch-action: manipulation;
}
.ob-btn.quiet { background: var(--box); box-shadow: inset -4px -4px 0 0 var(--press); }
.ob-btn:active:not(:disabled) { box-shadow: inset 4px 4px 0 0 #B89020; }
.ob-btn:disabled { opacity: 0.35; cursor: default; }

/* Chips: a state (coloured by wear), an action (its lever colour and glyph), an amount of money. */
.ob-chip {
  display: inline-flex; align-items: center; gap: 0.5em; white-space: nowrap;
  font-size: calc(calc(12px * var(--tx)) * var(--fz, 1)); line-height: 1;
  padding: 0.55em 0.7em 0.5em;
  border: 3px solid var(--ink); background: var(--box);
}
.ob-chip svg { flex: 0 0 auto; }
.ob-chip.s0 { background: var(--wear0-soft); } .ob-chip.s0 .dot { background: var(--wear0); }
.ob-chip.s1 { background: var(--wear1-soft); } .ob-chip.s1 .dot { background: var(--wear1); }
.ob-chip.s2 { background: var(--wear2-soft); } .ob-chip.s2 .dot { background: var(--wear2); }
.ob-chip.s3 { background: var(--wear3-soft); } .ob-chip.s3 .dot { background: var(--wear3); }
.ob-chip .dot { width: 0.8em; height: 0.8em; border: 2px solid var(--ink); flex: 0 0 auto; }
.ob-chip.a0 { color: var(--run); background: var(--run-soft); border-color: var(--run); }
.ob-chip.a1 { color: #9A5E00; background: var(--service-soft); border-color: var(--service); }
.ob-chip.a2 { color: var(--replace); background: var(--replace-soft); border-color: var(--replace); }
.ob-money { white-space: nowrap; }
.ob-money.gain { color: var(--gain); }
.ob-money.loss { color: var(--loss); }

/* Pictures from art.js. */
.ob-art { display: inline-block; line-height: 0; flex: 0 0 auto; }
.ob-art svg { display: block; shape-rendering: crispEdges; }
.ob-art svg.smooth { shape-rendering: auto; }
.ob-van { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; }
.ob-van .gauge { display: flex; gap: 3px; padding: 3px 4px; border: 2px solid var(--ink); background: var(--box); line-height: 0; }
.ob-van .gauge i { width: 12px; height: 8px; border: 1px solid var(--ink); opacity: 0.3; }
.ob-van .gauge i.lit { opacity: 1; }
.ob-van .tag { font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: 1.2; white-space: nowrap; }
.ob-van.w0 .tag { color: var(--wear0); } .ob-van.w0 .gauge i.lit { background: var(--wear0); }
.ob-van.w1 .tag { color: #9C7417; }      .ob-van.w1 .gauge i.lit { background: var(--wear1); }
.ob-van.w2 .tag { color: #C25F14; }      .ob-van.w2 .gauge i.lit { background: var(--wear2); }
.ob-van.w3 .tag { color: var(--wear3); } .ob-van.w3 .gauge i.lit { background: var(--wear3); }
.ob-game { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; }
.ob-game .label { font-size: calc(calc(9px * var(--tx)) * var(--fz, 1)); line-height: calc(1.3 * var(--lh, 1)); text-align: center; max-width: 13em; }
.ob-die.tumble { animation: ob-tumble 0.5s linear 3; }
@keyframes ob-tumble { 25% { transform: rotate(90deg) translateY(-6px); } 50% { transform: rotate(180deg); } 75% { transform: rotate(270deg) translateY(-6px); } 100% { transform: rotate(360deg); } }

/* Motion (core.js): ghosts in flight, the highlight ring, arrows, the scene's overlay. */
.ob-ghost { position: fixed; z-index: 40; margin: 0; pointer-events: none; transform-origin: 0 0; }
.ob-ring { outline: 4px solid var(--ring); outline-offset: 4px; animation: ob-ring 0.6s cubic-bezier(.2,.7,.2,1) both; }
@keyframes ob-ring { from { outline-color: transparent; outline-offset: 14px; } }
.ob-overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 5; }
.ob-overlay svg { position: absolute; left: 0; top: 0; overflow: visible; }
.ob-arrow line, .ob-arrow polyline { stroke: var(--ink); stroke-width: 4; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
.ob-arrow polygon { fill: var(--ink); }
.ob-arrow-label {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: 1; padding: 5px 6px 4px;
  background: var(--box); border: 2px solid var(--ink);
}
.scene-error { border: 3px dashed var(--loss); color: var(--loss); padding: 8px 12px; font-size: calc(11px * var(--fz, 1)); }

/* The placeholder of a page whose scenes are not built yet. */
.ob-todo { text-align: center; }

/* Phones and small windows. */
@media (max-height: 700px) and (min-width: 561px) {
  .navbtn { padding: 10px 14px 8px; }
  .stage { padding-top: 6px; }
}
@media (max-width: 560px) {
  :root { --gut: 10px; }
  .topbar { gap: 8px; padding-top: 6px; padding-bottom: 6px; }
  .topbar .brand { font-size: calc(9px * var(--fz, 1)); }
  .pager button { min-width: 22px; height: 22px; font-size: calc(8px * var(--fz, 1)); }
  .foot { grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; }
  .foot .skip { grid-column: 1 / -1; grid-row: 1; justify-self: center; }
  .navbtn { min-width: 96px; font-size: calc(11px * var(--fz, 1)); padding: 11px 10px 9px; }
  .ob-say { font-size: calc(12px * var(--fz, 1)); }
  .ob-note { font-size: calc(10px * var(--fz, 1)); }
  .ob-card .title { font-size: calc(32px * var(--fz, 1)); }
  .ob-card { min-width: 0; }
  .ob-chip { font-size: calc(10px * var(--fz, 1)); }
}
@media (prefers-reduced-motion: reduce) {
  .ob-card .drive, .ob-card .press, .ob-ring, .ob-die.tumble { animation: none; }
}

/* Back and Next carry pixel triangles. */
.navbtn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
#prev::before, #next::after { content: ""; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
#prev::before { border-right: 9px solid currentColor; }
#next::after { border-left: 9px solid currentColor; }

/* Notation: subscripts (S1, a1, $r1, G1), powers (gamma squared), the bar of an average (G1 with a bar), the pixel
   Greek letters of art.js (OB.art.sym). */
sub, sup { font-size: 0.62em; line-height: 0; position: relative; vertical-align: baseline; }
sub { bottom: -0.3em; }
sup { top: -0.55em; }
.ob-bar { display: inline-block; border-top: 0.14em solid currentColor; padding-top: 0.12em; line-height: 1.1; }
.ob-sym { display: inline-block; vertical-align: -0.02em; shape-rendering: crispEdges; }
.ob-symbox { display: inline-block; line-height: 1; }
</style>
<style>/* sec1.css */
/* sec1.css: page 1, section 2 of the weekend, "MDPs" (agent A2). Classes start with s1-. */

/* What the games have in common. */
.s1-games { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(16px * var(--tx)) calc(26px * var(--tx)); }
.s1-games .ob-game svg { width: 96px; height: 96px; }
.s1-games .ob-art.ob-box { padding: 10px; }
.s1-list { display: flex; flex-direction: column; gap: calc(10px * var(--tx)); padding: calc(14px * var(--tx)) calc(26px * var(--tx)); min-width: min(100%, 30em); }
.s1-item { display: flex; align-items: center; gap: 0.8em; font-size: calc(calc(18px * var(--tx)) * var(--fz, 1)); line-height: calc(1.4 * var(--lh, 1)); }
.s1-item::before { content: ""; width: 0; height: 0; border-top: 0.42em solid transparent; border-bottom: 0.42em solid transparent; border-left: 0.6em solid var(--ink); flex: 0 0 auto; }

/* A definition. */
.s1-def { max-width: min(100%, 60em); display: flex; flex-direction: column; align-items: center; gap: calc(16px * var(--tx)); padding: calc(20px * var(--tx)) calc(28px * var(--tx)); }
.s1-def .word { font-size: calc(calc(26px * (1 + (var(--tx) - 1) * 0.692)) * var(--fz, 1)); line-height: calc(1.3 * var(--lh, 1)); }
.s1-def .ob-say { max-width: 40ch; }

/* Old Bessie's states and actions. */
.s1-vans { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: calc(18px * var(--tx)) calc(30px * var(--tx)); }
.s1-acts { display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: calc(16px * var(--tx)); }
.s1-act { display: flex; flex-direction: column; align-items: center; gap: calc(12px * var(--tx)); width: calc(220px + 60px * var(--tx)); padding: calc(18px * var(--tx)) calc(12px * var(--tx)); text-align: center; }
.s1-act .big-glyph { line-height: 0; }
.s1-act .name { font-size: calc(calc(17px * var(--tx)) * var(--fz, 1)); line-height: 1.2; }
.s1-act .gloss { font-size: calc(calc(12px * var(--tx)) * var(--fz, 1)); line-height: calc(1.7 * var(--lh, 1)); color: var(--ink2); }
.s1-act.a0 { border-color: var(--run); } .s1-act.a0 .name, .s1-act.a0 .big-glyph { color: var(--run); }
.s1-act.a1 { border-color: var(--service); } .s1-act.a1 .name, .s1-act.a1 .big-glyph { color: #9A5E00; }
.s1-act.a2 { border-color: var(--replace); } .s1-act.a2 .name, .s1-act.a2 .big-glyph { color: var(--replace); }

@media (max-width: 560px) {
  .s1-games .ob-game svg { width: 56px; height: 56px; }
  .s1-vans .ob-van svg { width: 140px; height: auto; }
  .s1-act .big-glyph svg { width: 40px; height: 40px; }
  .s1-games { gap: 12px 14px; }
  .s1-item { font-size: calc(13px * var(--fz, 1)); }
  .s1-def .word { font-size: calc(20px * var(--fz, 1)); }
  .s1-act { width: 100%; flex-direction: row; text-align: left; padding: 10px 12px; }
}

/* Transition dynamics: a state and an action go in, a new state and a reward come out. */
.s1-flow { display: grid; grid-template-columns: auto auto auto; align-items: center; justify-content: center; gap: 0 calc(70px * var(--tx)); }
.s1-in, .s1-out { display: flex; flex-direction: column; align-items: center; gap: calc(10px * var(--tx)); }
.s1-pair { display: flex; align-items: flex-end; gap: calc(14px * var(--tx)); }
.s1-slot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.s1-cap { font-size: calc(calc(9px * var(--tx)) * var(--fz, 1)); line-height: 1.2; color: var(--ink2); letter-spacing: 0.06em; white-space: nowrap; }
.s1-td { display: flex; flex-direction: column; align-items: center; gap: calc(10px * var(--tx)); padding: calc(14px * var(--tx)) calc(16px * var(--tx)); text-align: center; }
.s1-td .name { font-size: calc(calc(13px * var(--tx)) * var(--fz, 1)); line-height: calc(1.6 * var(--lh, 1)); }
.s1-reward { font-size: calc(calc(18px * var(--tx)) * var(--fz, 1)); line-height: 1.2; padding: 8px 10px 6px; }
.s1-defs { display: flex; flex-direction: column; align-items: center; gap: calc(8px * var(--tx)); padding: calc(14px * var(--tx)) calc(22px * var(--tx)); max-width: 100%; }
.s1-defs .ob-say { max-width: 46ch; }
.s1-num { display: grid; grid-template-columns: auto auto; gap: 4px 0.9em; align-items: baseline; font-size: calc(calc(14px * var(--tx)) * var(--fz, 1)); line-height: calc(1.5 * var(--lh, 1)); }
@media (max-width: 760px) {
  .s1-flow { grid-template-columns: auto; gap: 44px 0; }
}

/* Transition dynamics are usually random: six rolls, then all the outcomes in 100 rolls. */
.s1-rflow { display: flex; align-items: center; justify-content: center; gap: calc(60px * var(--tx)); }
.s1-area { display: grid; justify-items: center; }
.s1-area > * { grid-area: 1 / 1; }
.s1-rolls, .s1-outs { display: flex; flex-direction: column; align-items: center; gap: calc(8px * var(--tx)); }
.s1-row { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(12px * var(--tx)); }
.s1-roll { width: calc(120px + 14px * var(--tx)); min-height: 136px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; padding: 8px 4px; border: 3px dashed var(--ink2); }
.s1-roll .no { font-size: calc(calc(8px * var(--tx)) * var(--fz, 1)); line-height: 1; color: var(--ink2); }
.s1-got { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.s1-got .ob-money { font-size: calc(calc(13px * var(--tx)) * var(--fz, 1)); line-height: 1.2; }
.s1-out1 { width: calc(150px + 30px * var(--tx)); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; }
.s1-out1 .ob-money { font-size: calc(calc(13px * var(--tx)) * var(--fz, 1)); line-height: 1.2; }
.s1-out1 .bd { font-size: calc(calc(8px * var(--tx)) * var(--fz, 1)); line-height: 1.2; min-height: 2.4em; color: var(--loss); }  /* the empty tag keeps its line: the counts align */
.s1-out1 .count { font-size: calc(calc(13px * var(--tx)) * var(--fz, 1)); line-height: calc(1.3 * var(--lh, 1)); }
.s1-out1 .count b { font-weight: 400; font-size: calc(calc(18px * var(--tx)) * var(--fz, 1)); }
.s1-cap2 { font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: calc(1.6 * var(--lh, 1)); color: var(--ink2); text-align: center; }
@media (max-width: 760px) {
  .s1-rflow { flex-direction: column; gap: 40px; }
  .s1-roll { width: 104px; min-height: 120px; }
  .s1-out1 { width: 150px; }
}

:root {
  --px: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --disp: "Barlow Condensed", "Barlow", sans-serif;
  --fz: 1.3; --lh: 0.78;
  --bg: #E8EBEF; --box: #FFFFFF; --white: #FFFFFF; --ink: #15171C; --ink2: #5C6371; --hi: #D5DAE1; --press: #C3C8D0;
  --line: #D3D8DF; --red: #E1251B; --yellow: #FFD21F; --ring: #E1251B;
  --run: #1D63D6; --service: #E58A00; --replace: #D8322A;
  --run-soft: #E3ECFB; --service-soft: #FDF0DA; --replace-soft: #FBE3E1;
  --wear0: #18A058; --wear1: #EDB20C; --wear2: #F0741B; --wear3: #DE3127;
  --wear0-soft: #DCF2E5; --wear1-soft: #FCF0C9; --wear2-soft: #FDE3CF; --wear3-soft: #FADBD8;
  --gain: #0E8A47; --loss: #D42B22;
  --cut: 14px;
}
body { font-family: var(--px); font-weight: 500; background: var(--bg); color: var(--ink); }
button { font-family: var(--px); }

/* The frame. */
.topbar { background: #FFFFFF; border-bottom: 0; position: relative; z-index: 2; box-shadow: 0 1px 0 var(--line); padding: 9px var(--gut); }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -5px; height: 5px;
  background: linear-gradient(100deg, var(--red) 0 30%, var(--yellow) 30% 33.5%, transparent 33.5%); pointer-events: none; }
.topbar .brand { font-family: var(--disp); font-weight: 700; font-style: italic; letter-spacing: 0.04em; font-size: 18px; }
.pager { gap: 5px; padding: 0 6px; }
.pager button { transform: skewX(-14deg); border: 0; border-radius: 0; background: #EDF0F4; box-shadow: none; color: var(--ink2);
  font-family: var(--disp); font-weight: 700; font-size: 14px; min-width: 28px; height: 26px; }
.pager button.card { width: 5px; min-width: 5px; background: var(--ink); }
.pager button.opt { background: transparent; outline: 1.5px dashed #9AA1AD; outline-offset: -2px; }
.pager button[aria-current] { background: var(--red); color: #FFFFFF; box-shadow: none; }
.pager button.card[aria-current] { background: var(--red); }
.pager .gap { font-size: 12px; }
.fullbtn { border: 0; border-radius: 0; background: #EDF0F4; box-shadow: none; transform: skewX(-14deg); }
.fullbtn svg { transform: skewX(14deg); }
.fullbtn:hover { background: var(--yellow); }

.stage { background: linear-gradient(108deg, transparent 0 61%, rgba(255, 255, 255, 0.55) 61% 69%, transparent 69% 71%, rgba(255, 255, 255, 0.4) 71% 72.5%, transparent 72.5%), var(--bg); padding-top: 16px; }
.scene-head { align-items: center; gap: 16px; padding: 0 0 12px; }
.scene-head .scene-no { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; height: 36px; padding: 0 8px;
  transform: skewX(-14deg); background: var(--red); color: #FFFFFF; font-family: var(--disp); font-style: italic; font-weight: 800; font-size: 24px; line-height: 1; }
.scene-head h2 { font-family: var(--disp); font-style: italic; font-weight: 800; letter-spacing: 0.005em;
  font-size: calc(27px * var(--tx)); line-height: 1.05; }
.scene-head .opt-tag { font-family: var(--disp); font-weight: 700; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase;
  border: 1.5px dashed var(--ink2); background: transparent; transform: skewX(-14deg); padding: 7px 12px; }

.foot { background: #FFFFFF; border-top: 0; box-shadow: 0 -1px 0 var(--line); padding: 10px var(--gut) 12px; }
.navbtn { transform: skewX(-12deg); border: 0; border-radius: 0; background: #EDF0F4; box-shadow: none; color: var(--ink);
  font-family: var(--disp); font-style: italic; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-size: 20px; padding: 13px 26px 12px; min-width: 150px; }
.navbtn.next { background: var(--red); color: #FFFFFF; box-shadow: 5px 5px 0 0 var(--ink); }
.navbtn.next:active:not(:disabled) { box-shadow: 1px 1px 0 0 var(--ink); transform: skewX(-12deg) translate(3px, 3px); }
.navbtn:active:not(:disabled) { box-shadow: none; }
.navbtn.skip { border: 1.5px dashed var(--ink2); background: transparent; font-size: 15px; padding: 11px 16px; }
.beats { gap: 5px; }
.beats i { width: 20px; height: 7px; border: 0; background: #DADFE6; transform: skewX(-24deg); }
.beats i.past { background: var(--ink); }
.beats i.on { background: var(--red); }

/* Panels: white, two chamfered corners, painted by the background so that rings and arrows are never clipped. */
.ob-box, .ob-box.plain, .ob-box.white {
  border: 0; border-radius: 0; box-shadow: none;
  background:
    linear-gradient(135deg, transparent var(--cut), #FFFFFF 0) top left,
    linear-gradient(225deg, #FFFFFF 0, #FFFFFF 0) top right,
    linear-gradient(315deg, transparent var(--cut), #FFFFFF 0) bottom right,
    linear-gradient(45deg, #FFFFFF 0, #FFFFFF 0) bottom left;
  background-size: 50.5% 50.5%; background-repeat: no-repeat;
  filter: drop-shadow(0 1.5px 0 rgba(21, 23, 28, 0.13));
}
.ob-say { font-weight: 500; line-height: 1.3; letter-spacing: -0.003em; }
.ob-note { font-weight: 500; color: var(--ink2); line-height: 1.35; }
.ob-big { font-family: var(--disp); font-weight: 700; }
.ob-mark { background: var(--yellow); padding: 0 0.18em; }
.ob-btn { border: 0; border-radius: 0; transform: skewX(-12deg); background: var(--red); color: #FFFFFF; box-shadow: 4px 4px 0 0 var(--ink);
  font-family: var(--disp); font-style: italic; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
.ob-btn.quiet { background: #EDF0F4; color: var(--ink); box-shadow: none; }
.ob-btn:active:not(:disabled) { box-shadow: 1px 1px 0 0 var(--ink); }

.ob-chip { border: 0; border-radius: 3px; background: #EEF1F5; font-family: var(--disp); font-weight: 700; letter-spacing: 0.04em; padding: 0.42em 0.7em 0.38em; }
.ob-chip .dot { border: 0; border-radius: 50%; width: 0.75em; height: 0.75em; }
.ob-chip.a0 { background: var(--run); color: #FFFFFF; border: 0; }
.ob-chip.a1 { background: var(--service); color: #1E1405; border: 0; }
.ob-chip.a2 { background: var(--replace); color: #FFFFFF; border: 0; }
.ob-van .gauge { border: 0; background: transparent; padding: 0; gap: 3px; }
.ob-van .gauge i { width: 13px; height: 5px; border: 0; background: #C9CED6; opacity: 1; transform: skewX(-24deg); }
.ob-van .tag { font-family: var(--disp); font-weight: 700; letter-spacing: 0.08em; }
.ob-van.w1 .tag { color: #8F6A00; } .ob-van.w2 .tag { color: #B0500C; } .ob-van.w0 .tag { color: #0F7F45; }
.ob-game .label { font-family: var(--disp); font-weight: 700; letter-spacing: 0.06em; font-size: 15px; }
.ob-ring { outline: 3px solid var(--red); outline-offset: 5px; }
.ob-arrow line, .ob-arrow polyline { stroke: var(--ink); stroke-width: 3; stroke-linecap: butt; }
.ob-arrow-label { border: 0; background: var(--ink); color: #FFFFFF; font-family: var(--disp); font-weight: 700; letter-spacing: 0.04em; padding: 5px 8px 4px; }

/* The stage card: a race start. */
.ob-card { position: relative; padding-top: calc(60px * var(--tx)); --cut: 26px; min-width: min(100%, 760px); }
.ob-card::before { content: ""; position: absolute; top: 0; left: 26px; right: 26px; height: 16px;
  background: repeating-conic-gradient(var(--ink) 0 25%, #FFFFFF 0 50%) 0 0 / 16px 16px; }
.ob-card .kicker { font-family: var(--disp); font-style: italic; font-weight: 800; letter-spacing: 0.22em; color: var(--red); font-size: 22px; }
.ob-card .title { font-family: var(--disp); font-style: italic; font-weight: 800; font-size: 112px; line-height: 0.9; letter-spacing: -0.005em; max-width: 13ch; }
.ob-card .line { font-weight: 500; color: var(--ink2); line-height: 1.35; max-width: 34ch; }
.ob-card .road { position: relative; width: 100%; min-height: 100px; border-bottom: 3px solid var(--ink); padding-bottom: 0; }
.ob-card .road::before { content: ""; position: absolute; left: 18%; bottom: 26px; width: 120px; height: 34px;
  background: linear-gradient(var(--red) 0 0) 0 0 / 100% 4px no-repeat, linear-gradient(var(--ink2) 0 0) 30px 14px / 80px 3px no-repeat, linear-gradient(var(--yellow) 0 0) 10px 28px / 100px 4px no-repeat; }
.ob-card .press { font-family: var(--disp); font-weight: 700; letter-spacing: 0.3em; font-size: 16px; color: var(--ink); }

/* Page 1. */
.s1-games .ob-art.ob-box { padding: 6px; }
.s1-item { font-weight: 600; }
.s1-item::before { border: 0; width: 9px; height: 0.95em; background: var(--red); transform: skewX(-16deg); }
.s1-def .word { font-family: var(--disp); font-style: italic; font-weight: 800; font-size: calc(48px * var(--fz)); line-height: 1; }
.s1-act { box-shadow: none; }
.s1-act.a0 { --edge: var(--run); } .s1-act.a1 { --edge: var(--service); } .s1-act.a2 { --edge: var(--replace); }
.s1-act::before { content: ""; position: absolute; left: 22px; right: 22px; top: 0; height: 6px; background: var(--edge); }
.s1-act { position: relative; }
.s1-act .name { font-family: var(--disp); font-style: italic; font-weight: 800; letter-spacing: 0.04em; }
.s1-act.a1 .name, .s1-act.a1 .big-glyph { color: #A35F00; }
.s1-cap, .s2-name, .s2-wk, .s2-strat-h, .s2-runlab, .runs-legend, .s3a-cap, .s3a-tlab, .s3b-pcap, .s3b-bacap, .s3b-ccap,
.s3c-cap, .s3d-ccap, .s3d-ut, .s3d-sk, .s3d-we, .tb-cap, .tb-zcap, .tb-sh, .tb-eh, .s2-tdname, .s3c-tt {
  font-family: var(--disp); font-weight: 700; letter-spacing: 0.06em; }
.s1-td .name { font-family: var(--disp); font-style: italic; font-weight: 800; letter-spacing: 0.06em; font-size: calc(20px * var(--tx)); }
.s1-reward { font-weight: 700; }
.s1-roll { border: 1.5px dashed #AEB4BE; }
.s1-out1 .count b { font-weight: 700; }

/* Runs: a timing strip per run. */
.runs-cells { border: 0; background: #FFFFFF; gap: 2px; padding: 2px; }
.runs-cell { color: rgba(15, 17, 22, 0.72); border-radius: 1px; }
.runs-canvas, .runs-g1col { border: 0; outline: 1px solid var(--line); }
.runs-g1 { font-weight: 700; }
.runs-swatch { border: 0; border-radius: 2px; }

/* Page 2. */
.s2-num { border-width: 2px; font-weight: 700; }
.s2-sym { font-weight: 600; }
.s2-strat .ob-chip { border-width: 0; }
.s2-gcells { border: 0; background: #FFFFFF; }
.s2-dl { background: #FFFFFF; border: 0; }
.s2-dot { background: rgba(21, 23, 28, 0.45); border-radius: 50%; }
.s2-avg { background: var(--red); border: 0; width: 5px; margin-left: -2.5px; }
.s2-avgl { background: var(--ink); color: #FFFFFF; border: 0; font-weight: 700; }
.s2-glab.s2-win .s2-gname { background: var(--yellow); }
.s2-gname { font-family: var(--disp); font-weight: 700; letter-spacing: 0.03em; }
.s2-gaxis { border-top-width: 2px; }
.s2-formula { font-weight: 700; }
.s2-loop { border-width: 3px; }

/* Tables: a timing screen, thin rules and bold figures. */
.tb-c, .tb-e { background: #FFFFFF; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tb-c.fc, .tb-e, .tb-sum { border-left: 1px solid var(--line); }
.tb-c.fr, .tb-e.fr { border-top: 1px solid var(--line); }
.tb-sum { background: #F4F6F8; }
.tb-n { font-weight: 600; }
.tb-ah { font-family: var(--disp); font-weight: 700; letter-spacing: 0.04em; }
.tb-ah.a1 { color: #A35F00; }
.tb-bar { border: 0; background: #E6E9EE; border-radius: 0; transform: skewX(-20deg); }
.tb-c.lit { background: var(--yellow); }
.tb-zn { font-weight: 700; }
.tb-zoom { --cut: 10px; }
.tb .ob-ring { outline-offset: -1px; }

/* Page 3. */
.s3a-arr, .s3a-arr::after { background-color: var(--ink); }
.s3a-ph { border: 1.5px dashed #AEB4BE; font-family: var(--disp); font-weight: 800; }
.s3a-pad { border: 0; border-radius: 0; box-shadow: 0 10px 24px rgba(21, 23, 28, 0.18); }
.s3a-key { border: 0; border-radius: 2px; font-family: var(--disp); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.s3a-key.a0 { background: var(--run); color: #FFFFFF; } .s3a-key.a1 { background: var(--service); color: #1E1405; } .s3a-key.a2 { background: var(--replace); color: #FFFFFF; }
.s3a-key[aria-pressed="true"] { outline: 3px solid var(--ink); }
.s3a-mc { border-width: 0; border-radius: 1px; }
.s3a-mc.a0 { background: var(--run); color: #FFFFFF; } .s3a-mc.a1 { background: var(--service); color: #1E1405; } .s3a-mc.a2 { background: var(--replace); color: #FFFFFF; }

.s3a-av { font-weight: 700; }
.s3b-tag { border: 1.5px dashed var(--ink2); background: #FFFFFF; font-weight: 600; }
.s3b-ruler { border: 0; }
.s3b-seg + .s3b-seg { border-left: 2px solid #FFFFFF; }
.s3b-seg.a1 { color: #1E1405; }
.s3b-slot { border: 1.5px dashed #AEB4BE; }
.s3b-got.a1 { color: #A35F00; }

.s3b-cn b, .s3d-us { font-weight: 700; }
.s3c-brace polyline { stroke-width: 2.5; }
.s3c-g1c { border: 0; outline: 1px solid var(--line); background: #FFFFFF; }
.s3c-gname, .s3d-gname { border: 0; background: var(--ink); color: #FFFFFF; font-family: var(--disp); font-weight: 700; letter-spacing: 0.06em; }
.s3c-dia .tb-zn, .s3d-ba .tb-zn { font-weight: 700; }
.s3c-loop polyline { stroke: var(--red); stroke-width: 3; }
.s3c-loop polygon { fill: var(--red); }
.s3c-new, .s3d-sg { background: var(--yellow); }
.s3c-ax, .s3d-pax line { stroke-width: 2.5; }
.s3c-curve { stroke: var(--red); stroke-width: 3; }
.s3c-dot { fill: var(--yellow); stroke: var(--ink); stroke-width: 2.5; }
.s3d-mtop { border: 0; background: var(--ink); color: #FFFFFF; font-weight: 700; }
.s3d-ptf { fill: var(--yellow); fill-opacity: 0.7; }
.s3d-pleg { stroke-width: 4; }
.s3d-ptit, .s3d-ptag { font-family: var(--disp); font-weight: 700; letter-spacing: 0.06em; }
.s3d-plab, .s3d-ptk { font-weight: 700; }
.s3d-eq, .s3d-cline, .s3d-work { font-weight: 600; }

@media (max-width: 560px) {
  .topbar .brand { font-size: 13px; }
  .pager button { min-width: 22px; height: 22px; font-size: 12px; }
  .navbtn { min-width: 104px; font-size: 16px; padding: 11px 14px; }
  .scene-head h2 { font-size: 22px; }
  .scene-head .scene-no { min-width: 36px; height: 30px; font-size: 19px; }
  .ob-card .title { font-size: 54px; }
  .ob-card { --cut: 18px; }
  .ob-card .kicker { font-size: 16px; }
}

/* Short desk screens (1366 x 768 and the like, words at 1.4): the same frame, tighter, so that no scene scrolls. */
@media (min-width: 1080px) and (max-height: 800px) {
  .stage { padding-top: 8px; }
  .scene-head { padding-bottom: 6px; }
  .scene-head h2 { font-size: calc(24px * var(--tx)); }
  .scene-head .scene-no { height: 32px; font-size: 22px; }
  .foot { padding-top: 6px; padding-bottom: 8px; }
  .navbtn { padding-top: 10px; padding-bottom: 9px; }
  .ob-card { padding-top: calc(36px * var(--tx)); }
  .ob-card .title { font-size: 96px; }
}

<script>/* bessie.js */
/* bessie.js: Old Bessie, the MDP of weekend 3's visualization, shared by every section.

   The model is the FS26 arcade's van, rl-arcade/repair-or-replace/js/van.js (commit 05dea09), unchanged:
   four states of wear, three actions, the same money and the same chances. In the browser it is window.B;
   in node, require('./bessie.js'). tools/check_bessie.js asserts every number the pages rely on.

   A run is one quarter, WEEKS = 13 weeks, from HEALTHY. Its cumulative reward is
   G1 = r1 + GAMMA r2 + GAMMA^2 r3 + ... + GAMMA^12 r13, GAMMA = 0.9.

   Dice. Every week of a run uses exactly two random numbers from B.dice: the first picks the action (unused by a
   strict policy, but always spent), the second the outcome of the transition dynamics. Two policies played on the
   same dice therefore meet the same luck, and a change in their averages comes from the policies alone. */
(function (root) {
  'use strict';

  const STATES = ['HEALTHY', 'WORN', 'SHAKY', 'FAILING'];
  const ACTIONS = ['RUN', 'SERVICE', 'REPLACE'];
  const HEALTHY = 0, WORN = 1, SHAKY = 2, FAILING = 3;
  const RUN = 0, SERVICE = 1, REPLACE = 2;

  const REV_RUN = [95, 72, 40, 16];          // RUN: the week's profit, by wear
  const P_BD = [0.02, 0.08, 0.28, 0.55];     // RUN: chance of a breakdown, by wear
  const BREAKDOWN_COST = 280;                // on top of the profit; the van ends FAILING
  const DEGR = [                             // RUN without a breakdown: wears 0, 1 or 2 levels
    [0.35, 0.55, 0.10],
    [0.30, 0.55, 0.15],
    [0.45, 0.55, 0.00],
    [0.65, 0.35, 0.00],
  ];
  const C_SERVICE = 50;                      // SERVICE: a week in the shop
  const SERV_UP = [                          // SERVICE: repairs 0, 1 or 2 levels
    [1.00, 0.00, 0.00],
    [0.05, 0.70, 0.25],
    [0.45, 0.50, 0.05],
    [0.55, 0.42, 0.03],
  ];
  const C_REPLACE = 130;                     // REPLACE: a new van, HEALTHY
  const GAMMA = 0.9;
  const WEEKS = 13;
  const START = HEALTHY;

  /* The transition dynamics of state s and action a: every outcome, in a fixed order, as
     {p, next, reward, face}. face as in the arcade's van.js: 'breakdown', 'wear0' to 'wear2' (RUN),
     'fix0' to 'fix2' (SERVICE), 'new' (REPLACE). Outcomes with no chance are left out; two outcomes that land
     in the same state with the same reward stay apart (they differ in what happened). */
  function outcomes(s, a) {

<script>/* art.js */

<script>/* tex.js */
/* tex.js: the formulas of "Old Bessie" in LaTeX's standard font, Computer Modern (agent T, 2026-11-16). Carlos: "Please
   use the LaTeX standard font whenever you show math formulas." KaTeX 0.16.11 (katex.js, katex.css, MIT) draws every
   formula and math symbol offline, in its two faces KaTeX_Main-Regular (upright: digits, signs, Greek capitals,
   nabla) and KaTeX_Math-Italic (italic letters and lowercase Greek), both in font/ and inlined by tools/build.py.
   Loaded after art.js, the skins and katex.js, before every section. ENGINE.md, section Formulas, has the rules.

   OB.tex(src)          the KaTeX HTML of the TeX src (a string; cached), for markup: "the " + OB.tex("G_1") + " of"
   OB.texEl(src, cls)   the same in an element: span.ob-tex (and cls)
   OB.texNum(s)         a number or an amount as OB.num and OB.money write it, as TeX: "$1,234.56" -> "\$1{,}234.56",
                        "-$243.36" -> "-\$243.36" (KaTeX draws the hyphen as the minus of a formula)
   OB.texArith(s)       arithmetic as the data files write it, as TeX: OB.texNum, and " x " becomes the times sign,
                        " / " a slash spaced like the other operators: "0.01 x 201" -> "0.01 \times 201"
   OB.texIn(markup)     markup whose formulas sit between \( and \): each drawn by KaTeX, the rest left as it is (the
                        text files sec3a-data.js and sec3c-text.js mark their formulas so, for node to check them)
   OB.texText(s)        a number shown outside KaTeX in the face of the formulas (class ob-texn; it rolls or flies):
                        its hyphen becomes the minus sign of the formulas
   OB.texFmt(f)         a formatter for api.roll that writes f(x) as OB.texText does
   OB.texNumEl(s, cls)  a number in the face of the formulas: span.ob-texn with OB.texText(s)
   art.sym(name), art.symEl(name)   gamma, alpha, epsilon (drawn as varepsilon), nabla and Sigma by KaTeX: markup, or
                        span.ob-symbox */
(function () {
  "use strict";
  var OB = window.OB, art = OB.art, K = window.katex;
  var MINUS = String.fromCharCode(8722);
  var OPTS = {
    output: "html", throwOnError: false, strict: false,
    /* \htmlClass only: it lets a formula mark a part of itself for a skin's highlight (scene 370's sign). */
    trust: function (c) { return c.command === "\\htmlClass"; }
  };
  var cache = Object.create(null);

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function tex(src) {
    var s = String(src);
    var h = cache[s];
    if (h === undefined) {
      if (K) {
        try { h = K.renderToString(s, OPTS); } catch (e) { if (window.console) console.error("OB.tex:", s, e); h = esc(s); }
      } else h = esc(s);
      cache[s] = h;
    }
    return h;
  }
  function texEl(src, cls) {
    var e = document.createElement("span");
    e.className = "ob-tex" + (cls ? " " + cls : "");
    e.innerHTML = tex(src);
    return e;
  }
  function texNum(s) { return String(s).replace(/\$/g, "\\$").replace(/,/g, "{,}"); }
  function texArith(s) {
    return texNum(s).replace(/ x /g, " \\times ").replace(/ \/ /g, " \\mathbin{/} ");
  }
  function texIn(markup) {
    return String(markup).replace(/\\\(([\s\S]+?)\\\)/g, function (m, src) { return tex(src); });
  }
  function texText(s) { return String(s).replace(/-/g, MINUS); }
  function texFmt(f) { return function (x) { return texText(f(x)); }; }
  function texNumEl(s, cls) {
    var e = document.createElement("span");
    e.className = "ob-texn" + (cls ? " " + cls : "");
    e.textContent = texText(s);
    return e;
  }

  OB.tex = tex;
  OB.texEl = texEl;
  OB.texNum = texNum;
  OB.texArith = texArith;
  OB.texIn = texIn;
  OB.texText = texText;
  OB.texFmt = texFmt;
  OB.texNumEl = texNumEl;

  /* The Greek letters of art.js, by KaTeX: the names of ENGINE.md, epsilon drawn as the textbooks' varepsilon. */
  var GREEK = { gamma: "\\gamma", alpha: "\\alpha", epsilon: "\\varepsilon", nabla: "\\nabla", Sigma: "\\Sigma" };
  art.sym = function (name) { return tex(GREEK[name] || name); };
  art.symEl = function (name) {
    var s = texEl(GREEK[name] || name, "ob-symbox");
    s.setAttribute("aria-label", name);
    return s;
  };
  art.TEX = GREEK;
})();
</script>
<script>/* sec1.js */
/* sec1.js: page 1, section 2 of the weekend, "MDPs" (agent A2, 2026-11-14), from Carlos's sketch pages 5 to 12.
   Scenes 100 to 999 of page 1. Every number comes from bessie.js (window.B). */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, art = OB.art, el = OB.el;

  /* 100. All these games have the following (sketch page 6). */
  OB.scene({
    page: 1, key: "have", order: 100, title: "What they have in common", beats: 4,
    build: function (root) {
      root.appendChild(el("p", "ob-say", "All these games and many other scenarios in life have the following:"));
      var games = el("div", "s1-games");
      art.GAMES.forEach(function (g) { games.appendChild(art.game(g.id)); });
      root.appendChild(games);
      var list = el("div", "s1-list ob-box");
      ["States", "Actions", "Transition dynamics"].forEach(function (t) { list.appendChild(el("div", "s1-item", t)); });
      root.appendChild(list);
    },
    beat: function (k, api) {
      var items = api.root.querySelectorAll(".s1-item");
      for (var i = 0; i < items.length; i++) api.show(items[i], k > i);
      api.show(api.root.querySelector(".s1-list"), k > 0);
    }
  });

  /* 200. States: a definition (sketch page 7). */
  OB.scene({
    page: 1, key: "states", order: 200, title: "States", beats: 1,
    build: function (root) {
      var box = el("div", "s1-def ob-box");
      box.appendChild(el("div", "word", "State"));
      box.appendChild(el("p", "ob-say", "A state is the situation you are in right now."));
      box.appendChild(el("p", "ob-say", "It holds what you need to know to choose what to do next."));
      root.appendChild(box);
    }
  });

  /* 300. Old Bessie's four states (sketch page 8). */
  OB.scene({
    page: 1, key: "bessie-states", order: 300, title: "Old Bessie's four states", beats: 4,
    build: function (root) {
      root.appendChild(el("p", "ob-say", "Old Bessie's state is how worn the van is."));
      var row = el("div", "s1-vans");
      for (var s = 0; s < 4; s++) row.appendChild(art.van(s, { size: 210 }));
      root.appendChild(row);
    },
    beat: function (k, api) {
      var vans = api.root.querySelectorAll(".ob-van");
      for (var i = 0; i < vans.length; i++) api.show(vans[i], i <= k);
    }
  });
})();

/* Scenes 600 and 700 share the example of WORN and RUN on seeded dice. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, art = OB.art, el = OB.el;
  var S = B.WORN, A = B.RUN, SEED = 80, ROLLS = 100, SHOWN = 6;
  var dice = B.dice(SEED, ROLLS, 1);
  var rolls = [];
  for (var i = 0; i < ROLLS; i++) {
    var u = dice[2 * i + 1];
    rolls.push({ u: u, o: B.step(S, A, u), face: 0 });   /* face 0: the die shows a question mark; the outcome comes from u */
  }
  window.OB.sec1 = { S: S, A: A, SEED: SEED, ROLLS: ROLLS, SHOWN: SHOWN, rolls: rolls };

  function slot(cap, child) {
    var s = el("div", "s1-slot");
    s.appendChild(el("span", "s1-cap", cap));
    s.appendChild(child);
    return s;
  }
  function reward(x) {
    var r = OB.moneyEl(x);
    r.classList.add("s1-reward", "ob-box", "plain");
    return r;
  }
  /* The flow: the state and the action, the box of the transition dynamics with a die, the outcome. */
  function flow(root, o) {
    var f = el("div", "s1-flow");
    var inn = el("div", "s1-in");
    var pair = el("div", "s1-pair");
    pair.appendChild(slot("STATE", art.van(S, { size: 150 })));
    pair.appendChild(slot("ACTION", art.actionChip(A)));
    inn.appendChild(pair);
    var td = el("div", "s1-td ob-box white");
    td.appendChild(el("div", "name", "TRANSITION DYNAMICS"));
    td.appendChild(art.dieEl(0, 5));
    var out = el("div", "s1-out");
    if (o) {
      var p2 = el("div", "s1-pair");
      p2.appendChild(slot("NEW STATE", art.van(o.o.next, { size: 150 })));
      p2.appendChild(slot("REWARD", reward(o.o.reward)));
      out.appendChild(p2);
    }
    f.appendChild(inn);
    f.appendChild(td);
    f.appendChild(out);
    root.appendChild(f);
    return { flow: f, inn: inn, td: td, out: out };
  }

  /* 600. Transition dynamics: a definition, then Old Bessie (sketch page 11). */
  OB.scene({
    page: 1, key: "dynamics", order: 600, title: "Transition dynamics", beats: 3,
    build: function (root) {
      var d = el("div", "s1-defs ob-box");
      d.appendChild(el("p", "ob-say", "Given a state and an action, the transition dynamics decide:"));
      var n = el("div", "s1-num");
      n.appendChild(el("span", "", "(1)"));
      n.appendChild(el("span", "", "the new state"));
      n.appendChild(el("span", "", "(2)"));
      n.appendChild(el("span", "", "the reward"));
      d.appendChild(n);
      root.appendChild(d);
      this.parts = flow(root, rolls[0]);
    },
    beat: function (k, api) {
      var p = this.parts;
      api.show(p.inn, k >= 1);
      api.show(p.td, k >= 1);
      if (k >= 1) api.arrow("in", p.inn, p.td, { delay: k === 1 ? 600 : 0 }); else api.unarrow("in");
      var die = p.td.querySelector(".ob-die");
      if (k >= 2) {
        if (api.forward && !api.instant && api.from === 1) art.setDie(die, rolls[0].face, true);
        api.arrow("out", p.td, p.out, { delay: 1500 });
        api.show(p.out, true, { delay: 1500 });
      } else {
        api.unarrow("out");
        api.show(p.out, false);
      }
    }
  });
})();

/* Scenes 400, 500 and 700. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, art = OB.art, el = OB.el, X = OB.sec1;

  /* 400. Actions: a definition (sketch page 9). */
  OB.scene({
    page: 1, key: "actions", order: 400, title: "Actions", beats: 1,
    build: function (root) {
      var box = el("div", "s1-def ob-box");
      box.appendChild(el("div", "word", "Action"));
      box.appendChild(el("p", "ob-say", "An action is a choice you can make in a state."));
      box.appendChild(el("p", "ob-say", "You choose one action at a time."));
      root.appendChild(box);
    }
  });

  /* 500. Old Bessie's three actions, the arcade's glyphs, colours and glosses (sketch page 9). */
  var GLOSS = ["Drive the route this week.", "A week in the shop.", "Buy a new van."];
  OB.scene({
    page: 1, key: "bessie-actions", order: 500, title: "Old Bessie's three actions", beats: 3,
    build: function (root) {
      root.appendChild(el("p", "ob-say", "In every state, Old Bessie's owner chooses one of three actions:"));
      var row = el("div", "s1-acts");
      for (var a = 0; a < 3; a++) {
        var c = el("div", "s1-act ob-box a" + a);
        c.appendChild(OB.html("span", "big-glyph", art.glyph(a, 80)));
        c.appendChild(el("div", "name", B.ACTIONS[a]));
        c.appendChild(el("div", "gloss", GLOSS[a]));
        row.appendChild(c);
      }
      root.appendChild(row);
    },
    beat: function (k, api) {
      var cards = api.root.querySelectorAll(".s1-act");
      for (var i = 0; i < cards.length; i++) api.show(cards[i], i <= k);
    }
  });

  /* 700. Transition dynamics are usually random (sketch page 12): WORN and RUN, six rolls landing side by side,
     then all the outcomes, counted in 100 rolls of the same dice. */
  var OUTS = B.outcomes(X.S, X.A).slice().sort(function (p, q) { return p.next - q.next || q.reward - p.reward; });
  function kind(o) { for (var j = 0; j < OUTS.length; j++) if (OUTS[j].face === o.face) return j; return -1; }
  var COUNT = OUTS.map(function () { return 0; });
  X.rolls.forEach(function (r) { COUNT[kind(r.o)]++; });

  OB.scene({
    page: 1, key: "random", order: 700, title: "Transition dynamics are usually random", beats: X.SHOWN + 2,
    build: function (root) {
      var P = this.parts = { got: [], slots: [], cards: [], counts: [] };
      root.appendChild(el("p", "ob-say", "For the same state and the same action, the new state and the reward can be different every time."));
      var f = el("div", "s1-rflow");
      var inn = el("div", "s1-pair");
      var s1 = el("div", "s1-slot");
      s1.appendChild(el("span", "s1-cap", "STATE"));
      s1.appendChild(art.van(X.S, { size: 120 }));
      inn.appendChild(s1);
      var s2 = el("div", "s1-slot");
      s2.appendChild(el("span", "s1-cap", "ACTION"));
      s2.appendChild(art.actionChip(X.A));
      inn.appendChild(s2);
      var td = el("div", "s1-td ob-box white");
      td.appendChild(el("div", "name", "TRANSITION DYNAMICS"));
      P.die = art.dieEl(X.rolls[0].face, 4);
      td.appendChild(P.die);
      f.appendChild(inn);
      f.appendChild(td);
      root.appendChild(f);
      P.inn = inn;
      P.td = td;

      var area = el("div", "s1-area");
      var rolls = el("div", "s1-rolls");
      var row = el("div", "s1-row");
      for (var i = 0; i < X.SHOWN; i++) {
        var r = X.rolls[i], sl = el("div", "s1-roll");
        sl.appendChild(el("span", "no", "ROLL " + (i + 1)));
        var got = el("div", "s1-got");
        got.appendChild(art.van(r.o.next, { size: 84, gauge: false }));
        got.appendChild(OB.moneyEl(r.o.reward));
        sl.appendChild(got);
        row.appendChild(sl);
        P.slots.push(sl);
        P.got.push(got);
      }
      rolls.appendChild(row);
      area.appendChild(rolls);
      var outs = el("div", "s1-outs");
      outs.appendChild(el("div", "s1-cap2", "All its outcomes, counted in " + X.ROLLS + " rolls:"));
      var orow = el("div", "s1-row");
      OUTS.forEach(function (o, j) {
        var c = el("div", "s1-out1 ob-box");
        c.appendChild(art.van(o.next, { size: 84, gauge: false }));
        c.appendChild(OB.moneyEl(o.reward));
        var bd = el("span", "bd", " ");
        if (o.face === "breakdown") bd.innerHTML = "BREAKDOWN<br>" + OB.tex(OB.texNum(OB.money(B.REV_RUN[X.S])) + " - " + OB.texNum(OB.money(B.BREAKDOWN_COST)));
        c.appendChild(bd);
        var cnt = el("div", "count");
        var b = el("b", "", String(COUNT[j]));
        cnt.appendChild(b);
        cnt.appendChild(document.createTextNode(" rolls"));
        c.appendChild(cnt);
        orow.appendChild(c);
        P.cards.push(c);
        P.counts.push(b);
      });
      outs.appendChild(orow);
      area.appendChild(outs);
      root.appendChild(area);
      P.rolls = rolls;
      P.outs = outs;
    },
    beat: function (k, api) {
      var P = this.parts, n = X.SHOWN, i;
      if (k < n) api.nextLabel("Roll");
      api.arrow("in", P.inn, P.td);
      var all = k === n + 1;
      api.show(P.rolls, !all);
      api.show(P.outs, all);
      for (i = 0; i < n; i++) api.show(P.got[i], k > i);
      if (k >= 1 && k <= n) {
        var r = X.rolls[k - 1];
        if (api.forward && !api.instant && api.from === k - 1) {
          art.setDie(P.die, r.face, true);
          api.fly(P.die, P.got[k - 1], { delay: 1500, scale: false });
        } else art.setDie(P.die, r.face, false);
      }
      if (all) {
        var shown = OUTS.map(function () { return 0; });
        for (i = 0; i < n; i++) {
          var j = kind(X.rolls[i].o);
          shown[j]++;
          if (api.forward && !api.instant) api.fly(P.got[i], P.cards[j], { scale: false });
        }
        P.counts.forEach(function (b, j) { api.roll(b, COUNT[j], { from: shown[j], delay: api.instant ? 0 : 1700 }); });
      }
    }
  });
})();
</script>
<script>/* fullscreen.js */
/* fullscreen.js: the full-screen button of the AINIT games (2026-11-11; Carlos shows the games from his iPad).
   The same file in every game. The button goes after the light or dark switch (.themebtn) and takes its look; a
   page without that switch marks the place with data-fullscreen. One tap and the page fills the whole screen, with
   no address bar or tabs, in Safari and Chrome on an iPad and on a computer. The button is left out where the
   browser cannot do that (an iPhone, a frame that does not allow it), and hidden on screens under 561 px and while
   the page is full screen. The browser's own exit button, a swipe down on an iPad, or Escape leave full screen. */
(function () {
  var doc = document, root = doc.documentElement;
  var request = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!request || !(doc.fullscreenEnabled || doc.webkitFullscreenEnabled)) return;
  var host = doc.querySelector("[data-fullscreen]"), twin = host ? null : doc.querySelector(".themebtn");
  if (!host && !twin) return;

  var btn = doc.createElement("button");
  btn.type = "button";
  btn.className = twin ? twin.className + " fullbtn" : "fullbtn";
  btn.title = "Full screen";
  btn.setAttribute("aria-label", "Full screen");
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" style="display:block; margin:auto" aria-hidden="true"' +
    ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';

  var narrow = window.matchMedia ? window.matchMedia("(max-width: 560px)") : null;
  function isFull() { return !!(doc.fullscreenElement || doc.webkitFullscreenElement); }
  function sync() { btn.style.display = isFull() || (narrow && narrow.matches) ? "none" : ""; }

  btn.addEventListener("click", function () {
    btn.blur();
    var p = request.call(root);
    if (p && typeof p.catch === "function") p.catch(function () {});
  });
  doc.addEventListener("fullscreenchange", sync);
  doc.addEventListener("webkitfullscreenchange", sync);
  if (narrow && narrow.addEventListener) narrow.addEventListener("change", sync);
  else if (narrow && narrow.addListener) narrow.addListener(sync);

  if (twin) twin.parentNode.insertBefore(btn, twin.nextSibling);
  else host.appendChild(btn);
  sync();
})();
</script>
