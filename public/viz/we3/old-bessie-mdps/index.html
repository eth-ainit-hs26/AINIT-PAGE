<style>/* core.css */
/* core.css: the look of "Old Bessie", the engine's stylesheet (agent A2, 2026-11-14). ENGINE.md documents it.

   The arcade's retro console look in its light "paper" theme (rl-arcade/repair-or-replace/css/style.css): Press Start
   2P everywhere, the NES shell #E8E0CC, dialog boxes #F8F4E4 with a double pixel border, ink #181818, secondary ink
   #585858, the lever colours of the three actions and the wear colours of the four states. Light only: no dark
   theme and no theme toggle (Carlos, 2026-11-14).

   Larger words on large screens (the rule of weekend 2, w2-cx-private/CLAUDE.md): on a screen of at least 1080 x 740
   px --tx is 1.4. A size of words up to 18 px is written calc(V * var(--tx)); a larger one grows by a share that falls
   to nothing at 44 px: calc(V * (1 + (var(--tx) - 1) * w)) with w = (44 - V) / 26. Boards, tables, sprites, the top
   bar and the Back and Next buttons keep their sizes. */

:root {
  --px: "Press Start 2P", ui-monospace, monospace;
  --bg: #E8E0CC;            /* the NES shell */
  --box: #F8F4E4;           /* dialog boxes */
  --white: #FFFFFF;
  --ink: #181818;
  --ink2: #585858;          /* secondary ink */
  --hi: #404040;            /* the inner line of a dialog box */
  --press: #BBB6A2;         /* the pressed edge of a button */
  --yellow: #F8D028;
  --ring: #E84828;          /* the highlight ring */
  --run: #1666C8;           /* RUN, calm blue */
  --service: #E08A00;       /* SERVICE, amber */
  --replace: #D33A2C;       /* REPLACE, hot red */
  --run-soft: #DCE9FB;
  --service-soft: #FBEED2;
  --replace-soft: #FADBD6;
  --wear0: #2E8B57;         /* HEALTHY */
  --wear1: #C99A33;         /* WORN */
  --wear2: #E07A2A;         /* SHAKY */
  --wear3: #D33A2C;         /* FAILING */
  --wear0-soft: #D5EBDD;
  --wear1-soft: #F3E6C4;
  --wear2-soft: #F8DCC4;
  --wear3-soft: #F6D2CC;
  --gain: #1F7A45;          /* a positive amount of money */
  --loss: #C0302A;          /* a negative amount of money */
  --gut: 16px;
  --tx: 1;
}
@media (min-width: 1080px) and (min-height: 740px) { :root { --tx: 1.4; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--px);
  font-size: calc(12px * var(--tx));
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button { font-family: var(--px); color: var(--ink); }

/* The frame: top bar, stage, footer. */
.app {
  height: 100vh; height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.topbar {
  display: flex; align-items: center; gap: 12px; min-width: 0;
  padding: 7px var(--gut);
  background: var(--box);
  border-bottom: 4px solid var(--ink);
}
.topbar .brand {
  font-size: 11px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 0 1 auto; min-width: 0;
}
.pager { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: 0 1 auto; min-width: 0; overflow: hidden; }
.pager button {
  min-width: 26px; height: 26px; padding: 0 4px;
  font-size: 9px; line-height: 1;
  background: var(--box); border: 2px solid var(--ink); border-radius: 0;
  box-shadow: inset -2px -2px 0 0 var(--press);
  cursor: pointer; flex: 0 0 auto;
}
.pager button.card { min-width: 14px; width: 14px; padding: 0; background: var(--ink2); box-shadow: none; }
.pager button.opt { border-style: dashed; }
.pager button[aria-current] { background: var(--yellow); box-shadow: inset 2px 2px 0 0 #B89020; }
.pager .gap { font-size: 9px; color: var(--ink2); flex: 0 0 auto; padding: 0 1px; }
.pager.fold .far { display: none; }
[data-fullscreen] { display: flex; flex: 0 0 auto; }
.fullbtn {
  width: 34px; height: 30px; padding: 0;
  background: var(--box); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 0;
  box-shadow: inset -2px -2px 0 0 var(--press);
  cursor: pointer;
}
.fullbtn:hover { background: var(--yellow); }

.stage { position: relative; overflow: auto; padding: 10px var(--gut) 12px; min-height: 0; }
.scene { display: none; min-height: 100%; flex-direction: column; }
.scene.active { display: flex; }
.scene-head { display: flex; align-items: baseline; gap: 14px; min-width: 0; padding: 2px 0 8px; }
.scene-head .scene-no { font-size: calc(14px * var(--tx)); color: var(--ink2); flex: 0 0 auto; }
.scene-head h2 { margin: 0; font-weight: 400; line-height: 1.35; font-size: calc(18px * var(--tx)); min-width: 0; }
.scene-head .opt-tag {
  margin-left: auto; flex: 0 0 auto;
  font-size: calc(9px * var(--tx)); line-height: 1; padding: 6px 8px;
  border: 2px dashed var(--ink); background: var(--box);
}
.scene-body { position: relative; flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; }
.scene-inner {
  position: relative; width: 100%; max-width: 1240px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: calc(14px * var(--tx));
}
.scene.card .scene-head { display: none; }

.foot {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
  padding: 8px var(--gut) 10px;
  background: var(--box);
  border-top: 4px solid var(--ink);
}
.navbtn {
  min-width: 132px; padding: 13px 16px 11px;
  font-size: 14px; line-height: 1;
  background: var(--box); border: 4px solid var(--ink); border-radius: 0;
  box-shadow: inset -4px -4px 0 0 var(--press);
  cursor: pointer; touch-action: manipulation;
}
.navbtn.next { background: var(--yellow); box-shadow: inset -4px -4px 0 0 #B89020; }
.navbtn:active:not(:disabled) { box-shadow: inset 4px 4px 0 0 var(--press); }
.navbtn:disabled { opacity: 0.35; cursor: default; }
.navbtn.skip { min-width: 0; font-size: 11px; padding: 11px 12px 9px; border-style: dashed; }
.navbtn.skip[hidden] { display: none; }
.beats { display: flex; justify-content: center; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.beats i { width: 12px; height: 12px; border: 2px solid var(--ink); background: transparent; flex: 0 0 auto; }
.beats i.past { background: var(--ink2); }
.beats i.on { background: var(--yellow); }

/* The stage card at the start of a page (and any scene with card: {...}), in the manner of a console's stage card. */
.ob-card {
  align-self: center; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: calc(18px * var(--tx));
  padding: calc(34px * var(--tx)) calc(56px * var(--tx)) calc(28px * var(--tx));
  min-width: min(100%, 640px); max-width: 100%;
}
.ob-card .kicker { font-size: calc(14px * var(--tx)); color: var(--ink2); letter-spacing: 0.08em; }
.ob-card .title { margin: 0; font-weight: 400; line-height: 1.3; font-size: 64px; }
.ob-card .line { font-size: calc(13px * var(--tx)); line-height: 1.8; max-width: 40ch; color: var(--ink2); }
.ob-card .road { display: flex; align-items: flex-end; justify-content: center; gap: 18px; min-height: 90px; }
.ob-card .press { font-size: calc(11px * var(--tx)); animation: ob-blink 1.1s steps(2, end) infinite; }
.ob-card .drive { animation: ob-drive 1.8s steps(12, end) both; }
@keyframes ob-drive { from { transform: translateX(-240px); } to { transform: none; } }
@keyframes ob-blink { 50% { opacity: 0; } }

/* Dialog boxes and words. */
.ob-box {
  background: var(--box);
  border: 4px solid var(--ink);
  border-radius: 0;
  box-shadow: inset 0 0 0 2px var(--box), inset 0 0 0 4px var(--hi);
  padding: calc(12px * var(--tx)) calc(16px * var(--tx));
}
.ob-box.plain { box-shadow: none; }
.ob-box.white { background: var(--white); box-shadow: inset 0 0 0 2px var(--white), inset 0 0 0 4px var(--hi); }
.ob-say { font-size: calc(15px * var(--tx)); line-height: 1.75; text-align: center; max-width: 52ch; margin: 0; text-wrap: balance; }
.ob-say.left { text-align: left; }
.ob-note { font-size: calc(11px * var(--tx)); line-height: 1.8; color: var(--ink2); text-align: center; max-width: 60ch; margin: 0; }
.ob-big { font-size: calc(24px * (1 + (var(--tx) - 1) * 0.769)); line-height: 1.35; }
.ob-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(14px * var(--tx)); }
.ob-col { display: flex; flex-direction: column; align-items: center; gap: calc(10px * var(--tx)); }
.ob-hide { visibility: hidden; }
.ob-gone { display: none !important; }
.ob-mark { background: var(--yellow); padding: 0 0.2em; }

/* Buttons inside a scene (Compute, Roll, Done). */
.ob-btn {
  font-size: calc(12px * var(--tx)); line-height: 1;
  padding: calc(10px * var(--tx)) calc(14px * var(--tx));
  background: var(--yellow); border: 4px solid var(--ink); border-radius: 0;
  box-shadow: inset -4px -4px 0 0 #B89020;

<script>/* bessie.js */
/* bessie.js: Old Bessie, the MDP of weekend 3's visualization, shared by every section.

   The model is the FS26 arcade's van, rl-arcade/repair-or-replace/js/van.js (commit 05dea09), unchanged:
   four states of wear, three actions, the same money and the same chances. In the browser it is window.B;
   in node, require('./bessie.js'). tools/check_bessie.js asserts every number the pages rely on.

   A run is one quarter, WEEKS = 13 weeks, from HEALTHY. Its cumulative reward is
   G1 = r1 + GAMMA r2 + GAMMA^2 r3 + ... + GAMMA^12 r13, GAMMA = 0.9.

   Dice. Every week of a run uses exactly two random numbers from B.dice: the first picks the action (unused by a
   strict policy, but always spent), the second the outcome of the transition dynamics. Two policies played on the
   same dice therefore meet the same luck, and a change in their averages comes from the policies alone. */
(function (root) {
  'use strict';

  const STATES = ['HEALTHY', 'WORN', 'SHAKY', 'FAILING'];
  const ACTIONS = ['RUN', 'SERVICE', 'REPLACE'];
  const HEALTHY = 0, WORN = 1, SHAKY = 2, FAILING = 3;
  const RUN = 0, SERVICE = 1, REPLACE = 2;

  const REV_RUN = [95, 72, 40, 16];          // RUN: the week's profit, by wear
  const P_BD = [0.02, 0.08, 0.28, 0.55];     // RUN: chance of a breakdown, by wear
  const BREAKDOWN_COST = 280;                // on top of the profit; the van ends FAILING
  const DEGR = [                             // RUN without a breakdown: wears 0, 1 or 2 levels
    [0.35, 0.55, 0.10],
    [0.30, 0.55, 0.15],
    [0.45, 0.55, 0.00],
    [0.65, 0.35, 0.00],
  ];
  const C_SERVICE = 50;                      // SERVICE: a week in the shop
  const SERV_UP = [                          // SERVICE: repairs 0, 1 or 2 levels
    [1.00, 0.00, 0.00],
    [0.05, 0.70, 0.25],
    [0.45, 0.50, 0.05],
    [0.55, 0.42, 0.03],
  ];
  const C_REPLACE = 130;                     // REPLACE: a new van, HEALTHY
  const GAMMA = 0.9;
  const WEEKS = 13;
  const START = HEALTHY;

  /* The transition dynamics of state s and action a: every outcome, in a fixed order, as
     {p, next, reward, face}. face as in the arcade's van.js: 'breakdown', 'wear0' to 'wear2' (RUN),
     'fix0' to 'fix2' (SERVICE), 'new' (REPLACE). Outcomes with no chance are left out; two outcomes that land
     in the same state with the same reward stay apart (they differ in what happened). */
  function outcomes(s, a) {
    const out = [];
    if (a === RUN) {
      out.push({ p: P_BD[s], next: FAILING, reward: REV_RUN[s] - BREAKDOWN_COST, face: 'breakdown' });
      for (let d = 0; d < 3; d++) {
        const p = (1 - P_BD[s]) * DEGR[s][d];
        if (p > 0) out.push({ p, next: Math.min(FAILING, s + d), reward: REV_RUN[s], face: 'wear' + d });
      }
    } else if (a === SERVICE) {
      for (let u = 0; u < 3; u++) {
        const p = SERV_UP[s][u];
        if (p > 0) out.push({ p, next: Math.max(HEALTHY, s - u), reward: -C_SERVICE, face: 'fix' + u });
      }
    } else {
      out.push({ p: 1, next: HEALTHY, reward: -C_REPLACE, face: 'new' });
    }
    return out;
  }

  /* One week: the outcome of (s, a) that the random number u in [0, 1) picks. */
  function step(s, a, u) {
    const out = outcomes(s, a);
    let cum = 0;
    for (const o of out) {
      cum += o.p;
      if (u < cum) return o;
    }
    return out[out.length - 1];
  }

  /* Mulberry32, the arcade's generator. */
  function rng(seed) {
    let t = seed >>> 0;
    return function () {
      t = (t + 0x6D2B79F5) >>> 0;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* The dice of n runs: n * weeks * 2 numbers, run by run, week by week, (action, transition). */
  function dice(seed, n, weeks) {
    weeks = weeks || WEEKS;
    const r = rng(seed);
    const d = new Float64Array(n * weeks * 2);
    for (let k = 0; k < d.length; k++) d[k] = r();
    d.n = n;
    d.weeks = weeks;
    return d;
  }

  /* The action a policy takes in state s with the random number u. A policy is either a column of four actions
     (a strict policy, one action per state) or a table of four rows of three probabilities. */
  function act(policy, s, u) {
    const row = policy[s];
    if (typeof row === 'number') return row;
    let cum = 0;
    for (let a = 0; a < 3; a++) {
      cum += row[a];
      if (u < cum) return a;
    }
    return 2;
  }

  /* Run i of the dice: states S1..S13 (and the state after the last week), actions, rewards, faces, G1. */
  function playRun(policy, d, i) {
    const weeks = d.weeks || WEEKS;
    const states = [], actions = [], rewards = [], faces = [];
    let s = START, G = 0, disc = 1;
    for (let t = 0; t < weeks; t++) {
      const k = (i * weeks + t) * 2;
      const a = act(policy, s, d[k]);
      const o = step(s, a, d[k + 1]);
      states.push(s); actions.push(a); rewards.push(o.reward); faces.push(o.face);
      G += disc * o.reward;
      disc *= GAMMA;
      s = o.next;
    }
    states.push(s);
    return { states, actions, rewards, faces, G1: G };
  }

  /* G1 of a list of rewards. */
  function g1(rewards) {
    let G = 0, disc = 1;
    for (const r of rewards) { G += disc * r; disc *= GAMMA; }
    return G;
  }

  /* The average G1 of the first n runs of the dice (all of them by default). */
  function avgG1(policy, d, n) {
    n = n || d.n;
    let sum = 0;
    for (let i = 0; i < n; i++) sum += playRun(policy, d, i).G1;
    return sum / n;
  }

  /* Softmax of one row of bets: exponential of every entry, then the row divided by its sum. */
  function softmax(row) {
    const m = Math.max.apply(null, row);
    const e = row.map((x) => Math.exp(x - m));
    const sum = e.reduce((x, y) => x + y, 0);
    return e.map((x) => x / sum);
  }
  function softmaxTable(W) { return W.map(softmax); }

  /* The exact expected G1 of a policy (over all runs, weighted by their chances): for checks only. */
  function expectedG1(policy) {
    let dist = [0, 0, 0, 0];
    dist[START] = 1;
    let J = 0, disc = 1;
    for (let t = 0; t < WEEKS; t++) {
      const nd = [0, 0, 0, 0];
      for (let s = 0; s < 4; s++) {
        if (dist[s] === 0) continue;
        const row = policy[s];
        const probs = typeof row === 'number' ? [0, 1, 2].map((a) => (a === row ? 1 : 0)) : row;
        for (let a = 0; a < 3; a++) {
          if (probs[a] === 0) continue;
          for (const o of outcomes(s, a)) {
            const w = dist[s] * probs[a] * o.p;
            J += disc * w * o.reward;
            nd[o.next] += w;
          }
        }
      }
      dist = nd;
      disc *= GAMMA;
    }
    return J;
  }

  /* One hop of the backward pass of proto-REINFORCE: the average G1 before and after adding eps to the bet
     W[s][a], both on the same dice; the change; nabla = change / eps. */
  function hop(W, s, a, eps, d, n) {
    const before = avgG1(softmaxTable(W), d, n);
    const W2 = W.map((row) => row.slice());
    W2[s][a] += eps;
    const after = avgG1(softmaxTable(W2), d, n);
    return { before, after, change: after - before, nabla: (after - before) / eps, W2 };
  }

  /* Random bets, uniform in [-1, 1], one decimal (the starting table of proto-REINFORCE). */
  function randomBets(seed) {
    const r = rng(seed);
    return [0, 1, 2, 3].map(() => [0, 1, 2].map(() => Math.round((r() * 2 - 1) * 10) / 10));
  }

  const B = {
    STATES, ACTIONS, HEALTHY, WORN, SHAKY, FAILING, RUN, SERVICE, REPLACE,
    REV_RUN, P_BD, BREAKDOWN_COST, DEGR, C_SERVICE, SERV_UP, C_REPLACE,
    GAMMA, WEEKS, START,
    outcomes, step, rng, dice, act, playRun, g1, avgG1, softmax, softmaxTable, expectedG1, hop, randomBets,
    /* The arcade's optimal strict policy at gamma 0.9: RUN, SERVICE, REPLACE, REPLACE. Over one quarter from
       HEALTHY it is also the best of the 81 strict policies (expected G1 242.08, tools/check_bessie.js). */
    BEST: [RUN, SERVICE, REPLACE, REPLACE],
    /* Try it (section 4, A4a): ten runs, the same dice for every try. */
    TRY: { n: 10, diceSeed: 11 },

      Array.prototype.slice.call(pagerEl.querySelectorAll(".gap")).forEach(function (g) { g.parentNode.removeChild(g); });
      for (var q = 1; q < shown.length; q++) if (shown[q] - shown[q - 1] > 1) pagerEl.insertBefore(el("span", "gap", ".."), pagerBtns[shown[q]]);
      if (pagerEl.scrollWidth <= pagerEl.clientWidth + 1) return;
    }
  }
  function writeHash() {
    var s = scenes[cur];
    try { history.replaceState(null, "", "#s=" + encodeURIComponent(s.key) + "&k=" + (curBeat + 1) + (INSTANT ? "&instant" : "")); } catch (e) {}
  }
  function readHash() {
    var h = location.hash || "", m = h.match(/[#&]s=([^&]+)/);
    if (!m) return null;
    var key = decodeURIComponent(m[1]), i = /^\d+$/.test(key) ? parseInt(key, 10) - 1 : indexOfKey(key);
    var mk = h.match(/[#&]k=(\d+)/);
    return i >= 0 && i < scenes.length ? { i: i, k: mk ? parseInt(mk[1], 10) - 1 : 0 } : null;
  }

  function start(cfg) {
    CFG = cfg || {};
    stage = doc.getElementById("stage");
    prevBtn = doc.getElementById("prev");
    nextBtn = doc.getElementById("next");
    skipBtn = doc.getElementById("skip");
    beatsEl = doc.getElementById("beats");
    pagerEl = doc.getElementById("pager");
    var page = CFG.page;
    var list = REG.filter(function (s) { return s.page === undefined || page === undefined || s.page === page; });
    if (CFG.card && !list.some(function (s) { return s.key === "card"; })) {
      list.push({ key: "card", order: 0, title: CFG.card.title, card: CFG.card, beats: 1, seq: -1 });
    }
    if (!list.some(function (s) { return !s.card; })) {
      list.push({ key: "coming-next", order: 1, title: "Coming next", beats: 1, seq: 1e9,
        card: { kicker: CFG.card ? CFG.card.kicker : "", title: "Coming next", line: "The scenes of this page are being built.", press: " ", van: false } });
    }
    scenes = list.slice().sort(function (a, b) { return a.order - b.order || a.seq - b.seq; });
    var shown = 0;
    scenes.forEach(function (s, i) {
      s.index = i;
      s.num = s.card ? 0 : ++shown;
      var sec = el("section", "scene" + (s.card ? " card" : "") + (s.optional ? " optional" : ""));
      sec.dataset.key = s.key;
      sec.dataset.order = String(s.order);
      var head = el("header", "scene-head");
      head.appendChild(el("span", "scene-no", s.card ? "" : String(s.num)));
      var h = el("h2", "", s.title || "");
      head.appendChild(h);
      if (s.optional) head.appendChild(el("span", "opt-tag", "OPTIONAL"));
      sec.appendChild(head);
      var body = el("div", "scene-body"), inner = el("div", "scene-inner");
      body.appendChild(inner);
      sec.appendChild(body);
      stage.appendChild(sec);
      s.sec = sec;
      s.inner = inner;
      var b = el("button", (s.card ? "card" : "") + (s.optional ? " opt" : ""), s.card ? "" : String(s.num));
      b.type = "button";
      b.title = (s.optional ? "Optional: " : "") + (s.title || "");
      b.setAttribute("aria-label", s.card ? (s.title || "Card") : "Scene " + s.num + ": " + (s.title || ""));
      b.addEventListener("click", function () { b.blur(); go(i, 0); });
      pagerEl.appendChild(b);
      pagerBtns.push(b);
    });
    // A clicked button gives the focus back, so that the space bar always means Next.
    prevBtn.addEventListener("click", function () { prevBtn.blur(); back(); });
    nextBtn.addEventListener("click", function () { nextBtn.blur(); next(); });
    skipBtn.addEventListener("click", function () { skipBtn.blur(); skip(); });
    window.addEventListener("resize", relayoutSoon);
    if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(relayoutSoon);
    window.addEventListener("hashchange", function () { var h = readHash(); if (h && (h.i !== cur || h.k !== curBeat)) go(h.i, h.k); });
    doc.addEventListener("keydown", function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target;

      var s = scenes[cur];
      if (s && typeof s.onkey === "function" && run(s, "onkey", e, apiFor(s, curBeat, false)) === true) return;
      var free = !t || t === doc.body || t === doc.documentElement;
      if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && free)) { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); back(); }
      else if (e.key === "Home") { e.preventDefault(); go(0, 0); }
      else if (e.key === "End") { e.preventDefault(); go(scenes.length - 1, 0); }
    });
    var h = readHash();
    go(h ? h.i : 0, h ? h.k : 0);
  }

  window.OB = {
    DUR: DUR,
    // helpers
    el: el, html: html, svgEl: svgEl, num: num, money: money, moneyEl: moneyEl,
    // motion (also on the api of a beat)
    at: at, show: show, fade: fade, fly: fly, move: move, roll: roll, ring: ring, animate: animate,
    // engine
    scene: scene, start: start, go: go, next: next, back: back, skip: skip,
    instant: function (on) { if (on !== undefined) INSTANT = !!on; return INSTANT; },
    list: function () {
      return scenes.map(function (s) {
        return { key: s.key, order: s.order, beats: s.beats, title: s.title || "", card: !!s.card, optional: !!s.optional };
      });
    },
    state: function () { return { scene: cur, beat: curBeat, key: cur >= 0 ? scenes[cur].key : null, busy: !!(T && (T.timers.length || T.motions.length)) }; },
    config: function () { return CFG; }
  };
})();

<script>/* art.js */
/* art.js: the pictures of "Old Bessie" (agent A2, 2026-11-14), as inline SVG pixels, crisp at any size. OB.art.
   ENGINE.md lists the API. Colours are written here as hex (CSS custom properties do not reach SVG attributes) and
   match core.css: the wear colours of the four states and the lever colours of the three actions.

   Sources: the van is the arcade's OLD BESSIE (rl-arcade/repair-or-replace/js/vanCard.js) redrawn as pixels and
   coloured by wear; the action glyphs are the arcade's (js/actions.js: wheel RUN, wrench SERVICE, sparkle REPLACE);
   the game sprites are the arcade's cartridges (rl-arcade/cartridges.js). */
(function () {
  "use strict";
  var OB = window.OB;

  var C = {
    ink: "#181818", ink2: "#585858", box: "#F8F4E4", white: "#FFFFFF", yellow: "#F8D028",
    wear: ["#2E8B57", "#C99A33", "#E07A2A", "#D33A2C"],
    wearDark: ["#1E6B40", "#9C7417", "#B85A16", "#9E2A20"],
    wearSoft: ["#D5EBDD", "#F3E6C4", "#F8DCC4", "#F6D2CC"],
    wearText: ["#2E8B57", "#9C7417", "#C25F14", "#D33A2C"],
    lever: ["#1666C8", "#E08A00", "#D33A2C"],
    leverText: ["#1666C8", "#9A5E00", "#D33A2C"],
    leverSoft: ["#DCE9FB", "#FBEED2", "#FADBD6"]
  };
  var STATES = (window.B && window.B.STATES) || ["HEALTHY", "WORN", "SHAKY", "FAILING"];
  var ACTIONS = (window.B && window.B.ACTIONS) || ["RUN", "SERVICE", "REPLACE"];

  /* A grid of characters to an SVG of pixels: each run of one colour in a row is one rect. */
  function pixels(rows, pal, px, cls) {
    var h = rows.length, w = 0, out = [];
    rows.forEach(function (row) { w = Math.max(w, row.length); });
    rows.forEach(function (row, y) {
      var x = 0;
      while (x < row.length) {
        var ch = row[x], x0 = x;
        while (x < row.length && row[x] === ch) x++;
        var col = pal[ch];
        if (col) out.push('<rect x="' + x0 + '" y="' + y + '" width="' + (x - x0) + '" height="1" fill="' + col + '"/>');
      }
    });
    var scale = px || 4;
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + " " + h + '" width="' + (w * scale) + '" height="' + (h * scale) +
      '" shape-rendering="crispEdges"' + (cls ? ' class="' + cls + '"' : "") + ' aria-hidden="true">' + out.join("") + "</svg>";
  }
  function wrap(svg, cls) {
    var s = document.createElement("span");
    s.className = "ob-art" + (cls ? " " + cls : "");
    s.innerHTML = svg;
    return s;
  }

  /* Old Bessie, facing right, 30 x 16 pixels. B body, R roof stripe (both in the wear colour), G glass, L headlight,
     S pipe and bumper, T tyre, H hub, g ground. The decals of wear are added on top by vanRows. */
  var VAN = [
    "..............................",
    "..KKKKKKKKKKKKKKKKK...........",
    "..KRRRRRRRRRRRRRRRK...........",
    "..KBBBBBBBBBBBBBBBK...........",
    "..KBBBBBBBBBBBBBBBKKKKKK......",
    "..KBBBBBBBBBBBBBBBKBBBBBK.....",
    "..KBBBBBBBBBBBBBBBKGGGGBBK....",
    "..KBBBBBBBBBBBBBBBKGGGGBBBK...",
    "..KBBBBBBBBBBBBBBBKGGGGBBBK...",
    "..KBBBBBBBBBBBBBBBKBBBBBBLK...",
    "SSKBBBBBBBBBBBBBBBKBBBBBBBKSS.",
    "SSKKKTTTKKKKKKKKKKKKKTTTKKKSS.",
    "...TTTTTTT.........TTTTTTT....",
    "...TTTHTTT.........TTTHTTT....",
    "....TTTTT...........TTTTT.....",
    "gggggggggggggggggggggggggggggg"
  ];
  /* Decals: [row, col, char]. WORN a scratch; SHAKY also a dent and rust; FAILING also a crack, a drip and smoke. */
  var DECALS = [
    [],
    [[8, 5, "K"], [8, 6, "K"], [9, 7, "K"], [9, 8, "K"]],
    [[6, 13, "K"], [7, 12, "K"], [7, 14, "K"], [9, 14, "O"], [9, 15, "O"], [10, 15, "O"], [10, 16, "O"]],
    [[3, 4, "K"], [4, 4, "K"], [5, 5, "K"], [6, 4, "K"], [7, 5, "K"], [12, 26, "D"], [13, 26, "D"], [7, 0, "M"], [8, 1, "M"], [6, 1, "M"], [9, 0, "M"]]
  ];
  function vanRows(wear) {
    var rows = VAN.map(function (r) { return r.split(""); });
    for (var w = 1; w <= wear; w++) DECALS[w].forEach(function (d) { rows[d[0]][d[1]] = d[2]; });
    return rows.map(function (r) { return r.join(""); });
  }
  function vanPal(wear) {
    return { K: C.ink, B: C.wear[wear], R: C.wearDark[wear], G: "#B6D9EB", L: C.yellow, S: C.ink2, T: C.ink, H: C.box,
      g: C.ink2, O: "#6B3410", D: C.ink2, M: "#9A9A9A" };
  }
  function vanSvg(wear, px) { return pixels(vanRows(wear | 0), vanPal(wear | 0), px || 4); }
  /* The van as an element: opts.size (width in px, default 120), opts.gauge (default true), opts.label (default
     true: the state's name in its colour). */
  function van(wear, opts) {
    opts = opts || {};
    wear = Math.max(0, Math.min(3, wear | 0));
    var box = document.createElement("span");
    box.className = "ob-van w" + wear;
    var px = (opts.size || 120) / 30;
    box.appendChild(wrap(vanSvg(wear, px)));
    if (opts.gauge !== false) {
      var g = document.createElement("span");
      g.className = "gauge";
      for (var i = 0; i < 4; i++) {
        var seg = document.createElement("i");
        if (i < 4 - wear) seg.className = "lit";
        g.appendChild(seg);
      }
      box.appendChild(g);
    }
    if (opts.label !== false) {
      var t = document.createElement("span");
      t.className = "tag";
      t.textContent = STATES[wear];
      box.appendChild(t);
    }
    return box;
  }

  /* The three action glyphs (the arcade's line art), in currentColor. */
  var GLYPH = [
    '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.1"/>' +
      '<circle cx="12" cy="12" r="2.5" fill="currentColor"/>' +
      '<g stroke="currentColor" stroke-width="2.1" stroke-linecap="round">' +
      '<line x1="12" y1="9.5" x2="12" y2="3.4"/><line x1="14.1" y1="13.2" x2="18.9" y2="16.1"/>' +
      '<line x1="9.9" y1="13.2" x2="5.1" y2="16.1"/></g>',
    '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"' +
      ' fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
    '<path d="M12 2.6l1.95 5.95a2 2 0 0 0 1.3 1.3L21.4 12l-5.95 1.95a2 2 0 0 0-1.3 1.3L12 21.4l-1.95-5.95a2 2 0 0 0-1.3-1.3L2.6 12l5.95-1.95a2 2 0 0 0 1.3-1.3z"' +
      ' fill="currentColor"/>'
  ];
  function glyph(a, px) {
    var s = px || 20;
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" class="smooth" aria-hidden="true">' + GLYPH[a] + "</svg>";
  }

  /* Chips: a state (its colour, its name) and an action (its glyph, its colour, its name). */
  function stateChip(s, opts) {
    opts = opts || {};
    var c = document.createElement("span");
    c.className = "ob-chip s" + s;
    var d = document.createElement("i");
    d.className = "dot";
    c.appendChild(d);
    c.appendChild(document.createTextNode(opts.text || STATES[s]));
    return c;
  }
  function actionChip(a, opts) {
    opts = opts || {};
    var c = document.createElement("span");
    c.className = "ob-chip a" + a;
    c.innerHTML = glyph(a, opts.glyph || 18);
    c.appendChild(document.createTextNode(opts.text || ACTIONS[a]));
    return c;
  }

  /* The four games of the arcade, as their cartridge sprites (rl-arcade/cartridges.js, palette PX). */
  var PX = { ".": null, K: "#0b0b16", W: "#f4f6ff", R: "#ff4d5e", r: "#c0202e", G: "#6be24a", g: "#1f9a52",
    B: "#41a6ff", b: "#9aa7ff", Y: "#ffd23f", O: "#ff9a3c", P: "#b06bff", C: "#5ad0ff", S: "#c9cee6", s: "#6c7194", N: "#9a6a3c" };
  var SPRITES = {
    van: ["...........", "...KKKKKKK.", "..KKWWKbbbK", ".KbbbbbbbbK", ".KbbbbbbbbK",
      ".KbbbbbbbbK", ".KKKKKKKKK.", "..KK...KK..", "..KK...KK..", "..........."],
    robot: [".....R.....", ".....K.....", "..KKKKKKK..", "..KSSSSSK..", "..KSSSSSK..",
      "..KCCSCCK..", "..KSSSSSK..", "..KSKKKSK..", "..KKKKKKK..", "...K...K..."],
    tag: ["..KKKKKKK..", ".KOOOKOOOK.", ".KOOOOOOOK.", ".KOYYYOOOK.", ".KOYOOOOOK.",
      ".KOYYYOOOK.", ".KOOOYOOOK.", ".KOYYYOOOK.", ".KOOOOOOOK.", "..KKKKKKK.."],
    pokeball: ["...KKKKK...", ".KKRRRRRKK.", ".KRRRRRRRK.", "KRRRRRRRRRK", "KRRRWWWRRRK",
      "KKKKWKWKKKK", "KWWWWWWWWWK", "KWWWWWWWWWK", ".KWWWWWWWK.", ".KKWWWWWKK.", "...KKKKK..."]
  };
  var GAMES = [
    { id: "bessie", sprite: "van", name: "OLD BESSIE" },
    { id: "anymal", sprite: "robot", name: "ANYMAL" },
    { id: "pricing", sprite: "tag", name: "LAST-MINUTE PRICING" },
    { id: "pokemon", sprite: "pokeball", name: "POKEMON" }
  ];
  function sprite(name, px) { return pixels(SPRITES[name], PX, px || 6); }
  /* A game as an element: its sprite on a cartridge-like tile and its name. id: bessie, anymal, pricing, pokemon. */
  function game(id, opts) {
    opts = opts || {};
    var g = GAMES.filter(function (x) { return x.id === id; })[0];
    var box = document.createElement("span");
    box.className = "ob-game";
    var tile = wrap(sprite(g.sprite, opts.px || 7), "ob-box plain");
    box.appendChild(tile);
    var t = document.createElement("span");
    t.className = "label";
    t.textContent = g.name;
    box.appendChild(t);
    return box;
  }

  /* The player, the one who chooses (sketch page 18): a small face. */
  var FACE = ["..KKKKK..", ".KYYYYYK.", "KYYKYKYYK", "KYYKYKYYK", "KYYYYYYYK", "KYKYYYKYK", "KYYKKKYYK", ".KYYYYYK.", "..KKKKK.."];
  function face(px) { return pixels(FACE, { K: C.ink, Y: C.yellow }, px || 4); }

  /* A die for the transition dynamics: n pips (1 to 6), 15 x 15 pixels. */
  var PIPS = { 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]],
    5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] };
  function dieRows(n) {
    var g = [];
    for (var y = 0; y < 15; y++) {
      var r = "";
      for (var x = 0; x < 15; x++) r += (x === 0 || y === 0 || x === 14 || y === 14) ? "K" : "W";
      g.push(r.split(""));
    }
    if (n === 0) {   /* a question mark: an outcome that no fair die decides (page 1; added after the freeze by the main session) */
      [".OOO.", "O...O", "....O", "...O.", "..O..", "..O..", ".....", "..O.."].forEach(function (row, y) {
        for (var x = 0; x < 5; x++) if (row[x] === "O") g[3 + y][5 + x] = "K";
      });
      return g.map(function (r) { return r.join(""); });
    }
    (PIPS[n] || PIPS[1]).forEach(function (p) {
      for (var dy = 0; dy < 3; dy++) for (var dx = 0; dx < 3; dx++) g[2 + p[1] * 4 + dy][2 + p[0] * 4 + dx] = "K";
    });
    return g.map(function (r) { return r.join(""); });
  }
  function die(n, px) { return pixels(dieRows(n), { K: C.ink, W: C.white }, px || 3); }
  function dieEl(n, px) { return wrap(die(n, px), "ob-die"); }
  /* Set the face of a die element made by dieEl; with roll true it tumbles first (about 1.5 s, CSS ob-tumble). */
  function setDie(e, n, roll) {
    var px = parseFloat(e.querySelector("svg").getAttribute("width")) / 15;
    e.innerHTML = die(n, px);
    e.classList.remove("tumble");
    if (roll) { void e.offsetWidth; e.classList.add("tumble"); }
  }

  /* Greek letters drawn as pixels: Press Start 2P has only ASCII (and a few signs such as x), so gamma, alpha,
     epsilon, nabla and Sigma are 8 x 8 pixel glyphs that sit in a line of text like a letter of the font. */
  var SYM = {
    gamma: ["........", "........", "OO....OO", ".OO..OO.", "..OOOO..", "...OO...", "...OO...", "...OO..."],
    alpha: ["........", "........", ".OOO.OO.", "OO..OOO.", "OO...OO.", "OO..OOO.", ".OOO.OO.", "........"],
    epsilon: ["........", "........", ".OOOOO..", "OO......", ".OOOO...", "OO......", ".OOOOO..", "........"],
    nabla: ["OOOOOOO.", "OO...OO.", ".O...O..", ".OO.OO..", "..O.O...", "..OOO...", "...O....", "........"],
    Sigma: ["OOOOOOO.", "OO......", ".OO.....", "..OO....", ".OO.....", "OO......", "OOOOOOO.", "........"]
  };
  function sym(name) {
    return pixels(SYM[name], { O: "currentColor" }, 1).replace('width="8" height="8"', 'width="1em" height="1em" class="ob-sym"');
  }
  function symEl(name) {
    var s = document.createElement("span");
    s.className = "ob-symbox";
    s.setAttribute("aria-label", name);
    s.innerHTML = sym(name);
    return s;
  }

  OB.art = {
    C: C, STATES: STATES, ACTIONS: ACTIONS, GAMES: GAMES, SPRITES: SPRITES,
    pixels: pixels, wrap: wrap,
    van: van, vanSvg: vanSvg, glyph: glyph, stateChip: stateChip, actionChip: actionChip,
    sprite: sprite, game: game, face: face, die: die, dieEl: dieEl, setDie: setDie,
    sym: sym, symEl: symEl, SYM: SYM
  };
})();
</script>
<script>/* sec1.js */
/* sec1.js: page 1, section 2 of the weekend, "MDPs" (agent A2, 2026-11-14), from Carlos's sketch pages 5 to 12.
   Scenes 100 to 999 of page 1. Every number comes from bessie.js (window.B). */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, art = OB.art, el = OB.el;

  /* 100. All these games have the following (sketch page 6). */
  OB.scene({
    page: 1, key: "have", order: 100, title: "What they have in common", beats: 4,
    build: function (root) {
      root.appendChild(el("p", "ob-say", "All these games and many other scenarios in life have the following:"));
      var games = el("div", "s1-games");
      art.GAMES.forEach(function (g) { games.appendChild(art.game(g.id)); });
      root.appendChild(games);
      var list = el("div", "s1-list ob-box");
      ["States", "Actions", "Transition dynamics"].forEach(function (t) { list.appendChild(el("div", "s1-item", t)); });
      root.appendChild(list);
    },
    beat: function (k, api) {
      var items = api.root.querySelectorAll(".s1-item");
      for (var i = 0; i < items.length; i++) api.show(items[i], k > i);
      api.show(api.root.querySelector(".s1-list"), k > 0);
    }
  });

  /* 200. States: a definition (sketch page 7). */
  OB.scene({
    page: 1, key: "states", order: 200, title: "States", beats: 1,
    build: function (root) {
      var box = el("div", "s1-def ob-box");
      box.appendChild(el("div", "word", "State"));
      box.appendChild(el("p", "ob-say", "A state is the situation you are in right now."));
      box.appendChild(el("p", "ob-say", "It holds what you need to know to choose what to do next."));
      root.appendChild(box);
    }
  });

  /* 300. Old Bessie's four states (sketch page 8). */
  OB.scene({
    page: 1, key: "bessie-states", order: 300, title: "Old Bessie's four states", beats: 4,
    build: function (root) {
      root.appendChild(el("p", "ob-say", "Old Bessie's state is how worn the van is."));
      var row = el("div", "s1-vans");
      for (var s = 0; s < 4; s++) row.appendChild(art.van(s, { size: 210 }));
      root.appendChild(row);
    },
    beat: function (k, api) {
      var vans = api.root.querySelectorAll(".ob-van");
      for (var i = 0; i < vans.length; i++) api.show(vans[i], i <= k);
    }
  });
})();

/* Scenes 600 and 700 share the example of WORN and RUN on seeded dice. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, art = OB.art, el = OB.el;
  var S = B.WORN, A = B.RUN, SEED = 80, ROLLS = 100, SHOWN = 6;
  var dice = B.dice(SEED, ROLLS, 1);
  var rolls = [];
  for (var i = 0; i < ROLLS; i++) {
    var u = dice[2 * i + 1];
    rolls.push({ u: u, o: B.step(S, A, u), face: 0 });   /* face 0: the die shows a question mark; the outcome comes from u */
  }
  window.OB.sec1 = { S: S, A: A, SEED: SEED, ROLLS: ROLLS, SHOWN: SHOWN, rolls: rolls };

  function slot(cap, child) {
    var s = el("div", "s1-slot");
    s.appendChild(el("span", "s1-cap", cap));
    s.appendChild(child);
    return s;
  }
  function reward(x) {
    var r = OB.moneyEl(x);
    r.classList.add("s1-reward", "ob-box", "plain");
    return r;
  }
  /* The flow: the state and the action, the box of the transition dynamics with a die, the outcome. */
  function flow(root, o) {
    var f = el("div", "s1-flow");
    var inn = el("div", "s1-in");
    var pair = el("div", "s1-pair");
    pair.appendChild(slot("STATE", art.van(S, { size: 150 })));
    pair.appendChild(slot("ACTION", art.actionChip(A)));
    inn.appendChild(pair);
    var td = el("div", "s1-td ob-box white");
    td.appendChild(el("div", "name", "TRANSITION DYNAMICS"));
    td.appendChild(art.dieEl(0, 5));
    var out = el("div", "s1-out");
    if (o) {
      var p2 = el("div", "s1-pair");
      p2.appendChild(slot("NEW STATE", art.van(o.o.next, { size: 150 })));
      p2.appendChild(slot("REWARD", reward(o.o.reward)));
      out.appendChild(p2);
    }
    f.appendChild(inn);
    f.appendChild(td);
    f.appendChild(out);
    root.appendChild(f);
    return { flow: f, inn: inn, td: td, out: out };
  }

  /* 600. Transition dynamics: a definition, then Old Bessie (sketch page 11). */
  OB.scene({
    page: 1, key: "dynamics", order: 600, title: "Transition dynamics", beats: 3,
    build: function (root) {
      var d = el("div", "s1-defs ob-box");
      d.appendChild(el("p", "ob-say", "Given a state and an action, the transition dynamics decide:"));
      var n = el("div", "s1-num");
      n.appendChild(el("span", "", "(1)"));
      n.appendChild(el("span", "", "the new state"));
      n.appendChild(el("span", "", "(2)"));
      n.appendChild(el("span", "", "the reward"));
      d.appendChild(n);
      root.appendChild(d);
      this.parts = flow(root, rolls[0]);
    },
    beat: function (k, api) {
      var p = this.parts;
      api.show(p.inn, k >= 1);
      api.show(p.td, k >= 1);
      if (k >= 1) api.arrow("in", p.inn, p.td, { delay: k === 1 ? 600 : 0 }); else api.unarrow("in");
      var die = p.td.querySelector(".ob-die");
      if (k >= 2) {
        if (api.forward && !api.instant && api.from === 1) art.setDie(die, rolls[0].face, true);
        api.arrow("out", p.td, p.out, { delay: 1500 });
        api.show(p.out, true, { delay: 1500 });
      } else {
        api.unarrow("out");
        api.show(p.out, false);
      }
    }
  });
})();

/* Scenes 400, 500 and 700. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, art = OB.art, el = OB.el, X = OB.sec1;

  /* 400. Actions: a definition (sketch page 9). */
  OB.scene({
    page: 1, key: "actions", order: 400, title: "Actions", beats: 1,
    build: function (root) {
      var box = el("div", "s1-def ob-box");
      box.appendChild(el("div", "word", "Action"));
      box.appendChild(el("p", "ob-say", "An action is a choice you can make in a state."));
      box.appendChild(el("p", "ob-say", "You choose one action at a time."));
      root.appendChild(box);
    }
  });

  /* 500. Old Bessie's three actions, the arcade's glyphs, colours and glosses (sketch page 9). */
  var GLOSS = ["Drive the route this week.", "A week in the shop.", "Buy a new van."];
  OB.scene({
    page: 1, key: "bessie-actions", order: 500, title: "Old Bessie's three actions", beats: 3,
    build: function (root) {
      root.appendChild(el("p", "ob-say", "In every state, Old Bessie's owner chooses one of three actions:"));
      var row = el("div", "s1-acts");
      for (var a = 0; a < 3; a++) {
        var c = el("div", "s1-act ob-box a" + a);
        c.appendChild(OB.html("span", "big-glyph", art.glyph(a, 80)));
        c.appendChild(el("div", "name", B.ACTIONS[a]));
        c.appendChild(el("div", "gloss", GLOSS[a]));
        row.appendChild(c);
      }
      root.appendChild(row);
    },
    beat: function (k, api) {
      var cards = api.root.querySelectorAll(".s1-act");
      for (var i = 0; i < cards.length; i++) api.show(cards[i], i <= k);
    }
  });

  /* 700. Transition dynamics are usually random (sketch page 12): WORN and RUN, six rolls landing side by side,
     then all the outcomes, counted in 100 rolls of the same dice. */
  var OUTS = B.outcomes(X.S, X.A).slice().sort(function (p, q) { return p.next - q.next || q.reward - p.reward; });
  function kind(o) { for (var j = 0; j < OUTS.length; j++) if (OUTS[j].face === o.face) return j; return -1; }
  var COUNT = OUTS.map(function () { return 0; });
  X.rolls.forEach(function (r) { COUNT[kind(r.o)]++; });

  OB.scene({
    page: 1, key: "random", order: 700, title: "Transition dynamics are usually random", beats: X.SHOWN + 2,
    build: function (root) {
      var P = this.parts = { got: [], slots: [], cards: [], counts: [] };
      root.appendChild(el("p", "ob-say", "For the same state and the same action, the new state and the reward can be different every time."));
      var f = el("div", "s1-rflow");
      var inn = el("div", "s1-pair");
      var s1 = el("div", "s1-slot");
      s1.appendChild(el("span", "s1-cap", "STATE"));
      s1.appendChild(art.van(X.S, { size: 120 }));
      inn.appendChild(s1);
      var s2 = el("div", "s1-slot");
      s2.appendChild(el("span", "s1-cap", "ACTION"));
      s2.appendChild(art.actionChip(X.A));
      inn.appendChild(s2);
      var td = el("div", "s1-td ob-box white");
      td.appendChild(el("div", "name", "TRANSITION DYNAMICS"));
      P.die = art.dieEl(X.rolls[0].face, 4);
      td.appendChild(P.die);
      f.appendChild(inn);
      f.appendChild(td);
      root.appendChild(f);
      P.inn = inn;
      P.td = td;

      var area = el("div", "s1-area");
      var rolls = el("div", "s1-rolls");
      var row = el("div", "s1-row");
      for (var i = 0; i < X.SHOWN; i++) {
        var r = X.rolls[i], sl = el("div", "s1-roll");
        sl.appendChild(el("span", "no", "ROLL " + (i + 1)));
        var got = el("div", "s1-got");
        got.appendChild(art.van(r.o.next, { size: 84, gauge: false }));
        got.appendChild(OB.moneyEl(r.o.reward));
        sl.appendChild(got);
        row.appendChild(sl);
        P.slots.push(sl);
        P.got.push(got);
      }
      rolls.appendChild(row);
      area.appendChild(rolls);
      var outs = el("div", "s1-outs");
      outs.appendChild(el("div", "s1-cap2", "All its outcomes, counted in " + X.ROLLS + " rolls:"));
      var orow = el("div", "s1-row");
      OUTS.forEach(function (o, j) {
        var c = el("div", "s1-out1 ob-box");
        c.appendChild(art.van(o.next, { size: 84, gauge: false }));
        c.appendChild(OB.moneyEl(o.reward));
        var bd = el("span", "bd", " ");
        if (o.face === "breakdown") bd.innerHTML = "BREAKDOWN<br>" + OB.money(B.REV_RUN[X.S]) + " - " + OB.money(B.BREAKDOWN_COST);
        c.appendChild(bd);
        var cnt = el("div", "count");
        var b = el("b", "", String(COUNT[j]));
        cnt.appendChild(b);
        cnt.appendChild(document.createTextNode(" rolls"));
        c.appendChild(cnt);
        orow.appendChild(c);
        P.cards.push(c);
        P.counts.push(b);
      });
      outs.appendChild(orow);
      area.appendChild(outs);
      root.appendChild(area);
      P.rolls = rolls;
      P.outs = outs;
    },
    beat: function (k, api) {
      var P = this.parts, n = X.SHOWN, i;
      if (k < n) api.nextLabel("Roll");
      api.arrow("in", P.inn, P.td);
      var all = k === n + 1;
      api.show(P.rolls, !all);
      api.show(P.outs, all);
      for (i = 0; i < n; i++) api.show(P.got[i], k > i);
      if (k >= 1 && k <= n) {
        var r = X.rolls[k - 1];
        if (api.forward && !api.instant && api.from === k - 1) {
          art.setDie(P.die, r.face, true);
          api.fly(P.die, P.got[k - 1], { delay: 1500, scale: false });
        } else art.setDie(P.die, r.face, false);
      }
      if (all) {
        var shown = OUTS.map(function () { return 0; });
        for (i = 0; i < n; i++) {
          var j = kind(X.rolls[i].o);
          shown[j]++;
          if (api.forward && !api.instant) api.fly(P.got[i], P.cards[j], { scale: false });
        }
        P.counts.forEach(function (b, j) { api.roll(b, COUNT[j], { from: shown[j], delay: api.instant ? 0 : 1700 }); });
      }
    }
  });
})();
</script>
<script>/* fullscreen.js */
/* fullscreen.js: the full-screen button of the AINIT games (2026-11-11; Carlos shows the games from his iPad).
   The same file in every game. The button goes after the light or dark switch (.themebtn) and takes its look; a
   page without that switch marks the place with data-fullscreen. One tap and the page fills the whole screen, with
   no address bar or tabs, in Safari and Chrome on an iPad and on a computer. The button is left out where the
   browser cannot do that (an iPhone, a frame that does not allow it), and hidden on screens under 561 px and while
   the page is full screen. The browser's own exit button, a swipe down on an iPad, or Escape leave full screen. */
(function () {
  var doc = document, root = doc.documentElement;
  var request = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!request || !(doc.fullscreenEnabled || doc.webkitFullscreenEnabled)) return;
  var host = doc.querySelector("[data-fullscreen]"), twin = host ? null : doc.querySelector(".themebtn");
  if (!host && !twin) return;

  var btn = doc.createElement("button");
  btn.type = "button";
  btn.className = twin ? twin.className + " fullbtn" : "fullbtn";
  btn.title = "Full screen";
  btn.setAttribute("aria-label", "Full screen");
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" style="display:block; margin:auto" aria-hidden="true"' +
    ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';

  var narrow = window.matchMedia ? window.matchMedia("(max-width: 560px)") : null;
  function isFull() { return !!(doc.fullscreenElement || doc.webkitFullscreenElement); }
  function sync() { btn.style.display = isFull() || (narrow && narrow.matches) ? "none" : ""; }

  btn.addEventListener("click", function () {
    btn.blur();
    var p = request.call(root);
    if (p && typeof p.catch === "function") p.catch(function () {});
  });
  doc.addEventListener("fullscreenchange", sync);
  doc.addEventListener("webkitfullscreenchange", sync);
  if (narrow && narrow.addEventListener) narrow.addEventListener("change", sync);
  else if (narrow && narrow.addListener) narrow.addListener(sync);

  if (twin) twin.parentNode.insertBefore(btn, twin.nextSibling);
  else host.appendChild(btn);
  sync();
})();
</script>
<script>OB.start({ page: 1, card: { kicker: "OLD BESSIE 1", title: "MDPs" } });</script>
