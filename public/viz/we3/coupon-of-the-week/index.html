<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coupon of the Week: proto-REINFORCE</title>
<style>/* core.css */
/* core.css: the look of "Old Bessie", the engine's stylesheet (agent A2, 2026-11-14). ENGINE.md documents it.

   Since 2026-11-17 the look is Arcade Marquee with the motion layer juice.js and juice.css (Carlos: "Yes, Arcade
   Marquee takes over"), from the design rounds of 2026-11-15 and 2026-11-17 (../../design/arcade-marquee/ and
   ../../design/arcade-marquee-motion/); from 2026-11-16 to 2026-11-17 it was Grand Prix. skin-base.css and skin.css
   load after this file and set the fonts (Rubik, Righteous, Bungee), the colours and the frame. The values below are the retro console look of 2026-11-14 (the arcade's light
   "paper" theme), kept as defaults that the skin overrides. Sizes of words are multiplied by var(--fz) and line
   heights by var(--lh), both set by the skin. Light only: no dark theme and no theme toggle (Carlos, 2026-11-14).

   Larger words on large screens (the rule of weekend 2, w2-cx-private/CLAUDE.md): on a screen of at least 1080 x 740
   px --tx is 1.4. A size of words up to 18 px is written calc(V * var(--tx)); a larger one grows by a share that falls
   to nothing at 44 px: calc(V * (1 + (var(--tx) - 1) * w)) with w = (44 - V) / 26. Boards, tables, sprites, the top
   bar and the Back and Next buttons keep their sizes. */

:root {
  --px: "Rubik", "Helvetica Neue", Arial, sans-serif;
  --bg: #E8E0CC;            /* the NES shell */
  --box: #F8F4E4;           /* dialog boxes */
  --white: #FFFFFF;
  --ink: #181818;
  --ink2: #585858;          /* secondary ink */
  --hi: #404040;            /* the inner line of a dialog box */
  --press: #BBB6A2;         /* the pressed edge of a button */
  --yellow: #F8D028;
  --ring: #E84828;          /* the highlight ring */
  --run: #1666C8;           /* RUN, calm blue */
  --service: #E08A00;       /* SERVICE, amber */
  --replace: #D33A2C;       /* REPLACE, hot red */
  --run-soft: #DCE9FB;
  --service-soft: #FBEED2;
  --replace-soft: #FADBD6;
  --wear0: #2E8B57;         /* HEALTHY */
  --wear1: #C99A33;         /* WORN */
  --wear2: #E07A2A;         /* SHAKY */
  --wear3: #D33A2C;         /* FAILING */
  --wear0-soft: #D5EBDD;
  --wear1-soft: #F3E6C4;
  --wear2-soft: #F8DCC4;
  --wear3-soft: #F6D2CC;
  --gain: #1F7A45;          /* a positive amount of money */
  --loss: #C0302A;          /* a negative amount of money */
  --gut: 16px;
  --tx: 1;
}
@media (min-width: 1080px) and (min-height: 740px) { :root { --tx: 1.4; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--px);
  font-size: calc(calc(12px * var(--tx)) * var(--fz, 1));
  line-height: calc(1.7 * var(--lh, 1));
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button { font-family: var(--px); color: var(--ink); }

/* The frame: top bar, stage, footer. */
.app {
  height: 100vh; height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.topbar {
  display: flex; align-items: center; gap: 12px; min-width: 0;
  padding: 7px var(--gut);
  background: var(--box);
  border-bottom: 4px solid var(--ink);
}
.topbar .brand {
  font-size: calc(11px * var(--fz, 1)); line-height: calc(1.4 * var(--lh, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 0 1 auto; min-width: 0;
}
.pager { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: 0 1 auto; min-width: 0; overflow: hidden; }
.pager button {
  min-width: 26px; height: 26px; padding: 0 4px;
  font-size: calc(9px * var(--fz, 1)); line-height: 1;
  background: var(--box); border: 2px solid var(--ink); border-radius: 0;
  box-shadow: inset -2px -2px 0 0 var(--press);
  cursor: pointer; flex: 0 0 auto;
}
.pager button.card { min-width: 14px; width: 14px; padding: 0; background: var(--ink2); box-shadow: none; }
.pager button.opt { border-style: dashed; }
.pager button[aria-current] { background: var(--yellow); box-shadow: inset 2px 2px 0 0 #B89020; }
.pager .gap { font-size: calc(9px * var(--fz, 1)); color: var(--ink2); flex: 0 0 auto; padding: 0 1px; }
.pager.fold .far { display: none; }
[data-fullscreen] { display: flex; flex: 0 0 auto; }
.fullbtn {
  width: 34px; height: 30px; padding: 0;
  background: var(--box); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 0;
  box-shadow: inset -2px -2px 0 0 var(--press);
  cursor: pointer;
}
.fullbtn:hover { background: var(--yellow); }

.stage { position: relative; overflow: auto; padding: 10px var(--gut) 12px; min-height: 0; }
.scene { display: none; min-height: 100%; flex-direction: column; }
.scene.active { display: flex; }
.scene-head { display: flex; align-items: baseline; gap: 14px; min-width: 0; padding: 2px 0 8px; }
.scene-head .scene-no { font-size: calc(calc(14px * var(--tx)) * var(--fz, 1)); color: var(--ink2); flex: 0 0 auto; }
.scene-head h2 { margin: 0; font-weight: 400; line-height: calc(1.35 * var(--lh, 1)); font-size: calc(calc(18px * var(--tx)) * var(--fz, 1)); min-width: 0; }
.scene-head .opt-tag {
  margin-left: auto; flex: 0 0 auto;
  font-size: calc(calc(9px * var(--tx)) * var(--fz, 1)); line-height: 1; padding: 6px 8px;
  border: 2px dashed var(--ink); background: var(--box);
}
.scene-body { position: relative; flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; }
.scene-inner {
  position: relative; width: 100%; max-width: 1240px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: calc(14px * var(--tx));
}
.scene.card .scene-head { display: none; }

.foot {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
  padding: 8px var(--gut) 10px;
  background: var(--box);
  border-top: 4px solid var(--ink);
}
.navbtn {
  min-width: 132px; padding: 13px 16px 11px;
  font-size: calc(14px * var(--fz, 1)); line-height: 1;
  background: var(--box); border: 4px solid var(--ink); border-radius: 0;
  box-shadow: inset -4px -4px 0 0 var(--press);
  cursor: pointer; touch-action: manipulation;
}
.navbtn.next { background: var(--yellow); box-shadow: inset -4px -4px 0 0 #B89020; }
.navbtn:active:not(:disabled) { box-shadow: inset 4px 4px 0 0 var(--press); }
.navbtn:disabled { opacity: 0.35; cursor: default; }
.navbtn.skip { min-width: 0; font-size: calc(11px * var(--fz, 1)); padding: 11px 12px 9px; border-style: dashed; }
.navbtn.skip[hidden] { display: none; }
.beats { display: flex; justify-content: center; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.beats i { width: 12px; height: 12px; border: 2px solid var(--ink); background: transparent; flex: 0 0 auto; }
.beats i.past { background: var(--ink2); }
.beats i.on { background: var(--yellow); }

/* The stage card at the start of a page (and any scene with card: {...}), in the manner of a console's stage card. */
.ob-card {
  align-self: center; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: calc(18px * var(--tx));
  padding: calc(34px * var(--tx)) calc(56px * var(--tx)) calc(28px * var(--tx));
  min-width: min(100%, 640px); max-width: 100%;
}
.ob-card .kicker { font-size: calc(calc(14px * var(--tx)) * var(--fz, 1)); color: var(--ink2); letter-spacing: 0.08em; }
.ob-card .title { margin: 0; font-weight: 400; line-height: calc(1.3 * var(--lh, 1)); font-size: calc(64px * var(--fz, 1)); }
.ob-card .line { font-size: calc(calc(13px * var(--tx)) * var(--fz, 1)); line-height: calc(1.8 * var(--lh, 1)); max-width: 40ch; color: var(--ink2); }
.ob-card .road { display: flex; align-items: flex-end; justify-content: center; gap: 18px; min-height: 90px; }
.ob-card .press { font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); animation: ob-blink 2s cubic-bezier(.45,.05,.55,.95) infinite; }
.ob-card .drive { animation: ob-drive 1.4s cubic-bezier(.2,.7,.2,1) both; }
@keyframes ob-drive { from { transform: translateX(-240px); } to { transform: none; } }
@keyframes ob-blink { 50% { opacity: 0; } }

/* Dialog boxes and words. */
.ob-box {
  background: var(--box);
  border: 4px solid var(--ink);
  border-radius: 0;
  box-shadow: inset 0 0 0 2px var(--box), inset 0 0 0 4px var(--hi);
  padding: calc(12px * var(--tx)) calc(16px * var(--tx));
}
.ob-box.plain { box-shadow: none; }
.ob-box.white { background: var(--white); box-shadow: inset 0 0 0 2px var(--white), inset 0 0 0 4px var(--hi); }
.ob-say { font-size: calc(calc(15px * var(--tx)) * var(--fz, 1)); line-height: calc(1.75 * var(--lh, 1)); text-align: center; max-width: 52ch; margin: 0; text-wrap: balance; }
.ob-say.left { text-align: left; }
.ob-note { font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: calc(1.8 * var(--lh, 1)); color: var(--ink2); text-align: center; max-width: 60ch; margin: 0; }
.ob-big { font-size: calc(calc(24px * (1 + (var(--tx) - 1) * 0.769)) * var(--fz, 1)); line-height: calc(1.35 * var(--lh, 1)); }
.ob-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(14px * var(--tx)); }
.ob-col { display: flex; flex-direction: column; align-items: center; gap: calc(10px * var(--tx)); }
.ob-hide { visibility: hidden; }
.ob-gone { display: none !important; }
.ob-mark { background: var(--yellow); padding: 0 0.2em; }

/* Buttons inside a scene (Compute, Roll, Done). */
.ob-btn {
  font-size: calc(calc(12px * var(--tx)) * var(--fz, 1)); line-height: 1;
  padding: calc(10px * var(--tx)) calc(14px * var(--tx));
  background: var(--yellow); border: 4px solid var(--ink); border-radius: 0;
  box-shadow: inset -4px -4px 0 0 #B89020;
  cursor: pointer; touch-action: manipulation;
}
.ob-btn.quiet { background: var(--box); box-shadow: inset -4px -4px 0 0 var(--press); }
.ob-btn:active:not(:disabled) { box-shadow: inset 4px 4px 0 0 #B89020; }
.ob-btn:disabled { opacity: 0.35; cursor: default; }

/* Chips: a state (coloured by wear), an action (its lever colour and glyph), an amount of money. */
.ob-chip {
  display: inline-flex; align-items: center; gap: 0.5em; white-space: nowrap;
  font-size: calc(calc(12px * var(--tx)) * var(--fz, 1)); line-height: 1;
  padding: 0.55em 0.7em 0.5em;
  border: 3px solid var(--ink); background: var(--box);
}
.ob-chip svg { flex: 0 0 auto; }
.ob-chip.s0 { background: var(--wear0-soft); } .ob-chip.s0 .dot { background: var(--wear0); }
.ob-chip.s1 { background: var(--wear1-soft); } .ob-chip.s1 .dot { background: var(--wear1); }
.ob-chip.s2 { background: var(--wear2-soft); } .ob-chip.s2 .dot { background: var(--wear2); }
.ob-chip.s3 { background: var(--wear3-soft); } .ob-chip.s3 .dot { background: var(--wear3); }
.ob-chip .dot { width: 0.8em; height: 0.8em; border: 2px solid var(--ink); flex: 0 0 auto; }
.ob-chip.a0 { color: var(--run); background: var(--run-soft); border-color: var(--run); }
.ob-chip.a1 { color: #9A5E00; background: var(--service-soft); border-color: var(--service); }
.ob-chip.a2 { color: var(--replace); background: var(--replace-soft); border-color: var(--replace); }
.ob-money { white-space: nowrap; }
.ob-money.gain { color: var(--gain); }
.ob-money.loss { color: var(--loss); }

/* Pictures from art.js. */
.ob-art { display: inline-block; line-height: 0; flex: 0 0 auto; }
.ob-art svg { display: block; shape-rendering: crispEdges; }
.ob-art svg.smooth { shape-rendering: auto; }
.ob-van { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; }
.ob-van .gauge { display: flex; gap: 3px; padding: 3px 4px; border: 2px solid var(--ink); background: var(--box); line-height: 0; }
.ob-van .gauge i { width: 12px; height: 8px; border: 1px solid var(--ink); opacity: 0.3; }
.ob-van .gauge i.lit { opacity: 1; }
.ob-van .tag { font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: 1.2; white-space: nowrap; }
.ob-van.w0 .tag { color: var(--wear0); } .ob-van.w0 .gauge i.lit { background: var(--wear0); }
.ob-van.w1 .tag { color: #9C7417; }      .ob-van.w1 .gauge i.lit { background: var(--wear1); }
.ob-van.w2 .tag { color: #C25F14; }      .ob-van.w2 .gauge i.lit { background: var(--wear2); }
.ob-van.w3 .tag { color: var(--wear3); } .ob-van.w3 .gauge i.lit { background: var(--wear3); }
.ob-game { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; }
.ob-game .label { font-size: calc(calc(9px * var(--tx)) * var(--fz, 1)); line-height: calc(1.3 * var(--lh, 1)); text-align: center; max-width: 13em; }
.ob-die.tumble { animation: ob-tumble 0.5s linear 3; }
@keyframes ob-tumble { 25% { transform: rotate(90deg) translateY(-6px); } 50% { transform: rotate(180deg); } 75% { transform: rotate(270deg) translateY(-6px); } 100% { transform: rotate(360deg); } }

/* Motion (core.js): ghosts in flight, the highlight ring, arrows, the scene's overlay. */
.ob-ghost { position: fixed; z-index: 40; margin: 0; pointer-events: none; transform-origin: 0 0; }
.ob-ring { outline: 4px solid var(--ring); outline-offset: 4px; animation: ob-ring 0.6s cubic-bezier(.2,.7,.2,1) both; }
@keyframes ob-ring { from { outline-color: transparent; outline-offset: 14px; } }
.ob-overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 5; }
.ob-overlay svg { position: absolute; left: 0; top: 0; overflow: visible; }
.ob-arrow line, .ob-arrow polyline { stroke: var(--ink); stroke-width: 4; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
.ob-arrow polygon { fill: var(--ink); }
.ob-arrow-label {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: 1; padding: 5px 6px 4px;
  background: var(--box); border: 2px solid var(--ink);
}
.scene-error { border: 3px dashed var(--loss); color: var(--loss); padding: 8px 12px; font-size: calc(11px * var(--fz, 1)); }

/* The placeholder of a page whose scenes are not built yet. */
.ob-todo { text-align: center; }

/* Phones and small windows. */
@media (max-height: 700px) and (min-width: 561px) {
  .navbtn { padding: 10px 14px 8px; }
  .stage { padding-top: 6px; }
}
@media (max-width: 560px) {
  :root { --gut: 10px; }
  .topbar { gap: 8px; padding-top: 6px; padding-bottom: 6px; }
  .topbar .brand { font-size: calc(9px * var(--fz, 1)); }
  .pager button { min-width: 22px; height: 22px; font-size: calc(8px * var(--fz, 1)); }
  .foot { grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; }
  .foot .skip { grid-column: 1 / -1; grid-row: 1; justify-self: center; }
  .navbtn { min-width: 96px; font-size: calc(11px * var(--fz, 1)); padding: 11px 10px 9px; }
  .ob-say { font-size: calc(12px * var(--fz, 1)); }
  .ob-note { font-size: calc(10px * var(--fz, 1)); }
  .ob-card .title { font-size: calc(32px * var(--fz, 1)); }
  .ob-card { min-width: 0; }
  .ob-chip { font-size: calc(10px * var(--fz, 1)); }
}
@media (prefers-reduced-motion: reduce) {
  .ob-card .drive, .ob-card .press, .ob-ring, .ob-die.tumble { animation: none; }
}

/* Back and Next carry pixel triangles. */
.navbtn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
#prev::before, #next::after { content: ""; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
#prev::before { border-right: 9px solid currentColor; }
#next::after { border-left: 9px solid currentColor; }

/* Notation: subscripts (S1, a1, $r1, G1), powers (gamma squared), the bar of an average (G1 with a bar), the pixel
   Greek letters of art.js (OB.art.sym). */
sub, sup { font-size: 0.62em; line-height: 0; position: relative; vertical-align: baseline; }
sub { bottom: -0.3em; }
sup { top: -0.55em; }
.ob-bar { display: inline-block; border-top: 0.14em solid currentColor; padding-top: 0.12em; line-height: 1.1; }
.ob-sym { display: inline-block; vertical-align: -0.02em; shape-rendering: crispEdges; }
.ob-symbox { display: inline-block; line-height: 1; }
</style>
<style>/* cw-0kit.css */
/* cw-0kit.css: the kit of the page "Coupon of the Week" (main session, 2026-11-18). Classes start with cw-. Words scale
   with --tx (core.css) and the skin's --fz; tables, the strip, the households, the histogram and the wheel are plain
   px. Every scene fits 1180 x 820 and 1366 x 768 without scrolling; a phone (below 561 px) may scroll. */

.cw-lead { min-height: calc(2 * 1.75em); display: flex; align-items: center; justify-content: center; max-width: 62ch; }
.cw-root { width: 100%; }
/* A formula of a lead stays on one line: KaTeX would break "z_1 = 1.10" after its sign. */
.cw-lead .katex { white-space: nowrap; }
.cw-root .ob-arrow-label { font-size: calc(calc(8px * var(--tx)) * var(--fz, 1)); padding: 4px 6px 3px; font-family: var(--sign); letter-spacing: 0.04em; }
.cw-cap { font-family: var(--sign); font-size: calc(calc(8px * var(--tx)) * var(--fz, 1)); letter-spacing: 0.05em; color: var(--ink2);
  text-align: center; white-space: nowrap; margin-top: 7px; line-height: 1.3; }
.cw-cap .katex { font-size: 1.15em; letter-spacing: 0; }
.cw-key { display: inline-block; width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid var(--ink); vertical-align: -1px; }
.cw-key.pos { background: rgba(47, 107, 255, 0.85); }
.cw-key.neg { background: rgba(242, 56, 111, 0.85); }

/* The symbol of a weight: e or w with the product's icon. */
.cw-wsym { white-space: nowrap; }
.cw-wsym .katex { font-size: 1.12em; }
.cw-wsym sub { font-family: var(--px); font-weight: 700; font-size: 0.62em; vertical-align: -0.35em; margin-left: 1px; }
.cw-subic { font-size: 1.25em; }
.cw-wsym.big { font-size: 1.25em; }

/* The table of the 24 products. */
.cw-tabw { max-width: 100%; overflow-x: auto; overflow-y: visible; padding: 6px 6px 8px; }
.cw-tab { display: grid; grid-template-columns: 94px repeat(24, 40px); background: transparent; }
.cw-tab.x { grid-template-columns: 94px repeat(24, 40px) 70px; }
.cw-tx { position: relative; height: 28px; margin-left: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums lining-nums; }
.cw-tx.k-ic { height: 36px; }
.cw-tx.k-p { height: 34px; }
.cw-tx.gap { margin-top: 8px; }
.cw-tx.on { background: #FFFFFF; border: 3px solid var(--ink); border-radius: 6px; }
.cw-tx.lit { background: var(--yellow); }
.cw-xh { font-size: calc(calc(12px * var(--tx)) * var(--fz, 1)); }
.cw-pad { position: absolute; left: 50%; top: 50%; width: 30px; height: 16px; margin: -8px 0 0 -15px; opacity: 0; pointer-events: none; }
.cw-tl { display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; height: 28px; white-space: nowrap;
  font-size: calc(calc(12px * var(--tx)) * var(--fz, 1)); color: var(--ink); }
.cw-tl .katex { font-size: 1.05em; }
.cw-tc { position: relative; height: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #FFFFFF; border-right: 1.5px solid var(--line, #DCD5EC); border-bottom: 1.5px solid var(--line, #DCD5EC); }
.cw-tc.first { border-left: 3px solid var(--ink); }
.cw-tc.lastc { border-right: 3px solid var(--ink); }
.cw-tc.icon.lastc { border-right-color: transparent; }
.cw-nw { white-space: nowrap; }
.cw-tc.icon { height: 36px; font-size: 22px; line-height: 1; background: transparent; border-right-color: transparent; border-bottom: 3px solid var(--ink); }
.cw-tc.icon.first { border-left-color: transparent; }
.cw-tl.k-ic { height: 36px; }
.cw-tc.gap, .cw-tl.gap { margin-top: 8px; }
.cw-tc.gap { border-top: 3px solid var(--ink); }
.cw-tn { font-family: var(--px); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums lining-nums; color: var(--ink); line-height: 1; }
.cw-tc.blank { background: repeating-linear-gradient(45deg, #F3EFFA 0 4px, #FFFFFF 4px 8px); }
.cw-tc.lit { background: var(--yellow); }
.cw-tc.soft { background: #FFF3C4; }
.cw-tc.mute .cw-tn { color: #B9B2CE; }
.cw-tc.ring { outline: 3px solid var(--pink); outline-offset: -3px; z-index: 2; }
.cw-tc.last { border-bottom: 3px solid var(--ink); }
.cw-tc.prob { height: 34px; justify-content: flex-start; padding-top: 5px; }

.cw-ptag { position: absolute; white-space: nowrap; line-height: 1; pointer-events: none; font-family: var(--px); font-weight: 700;
  font-size: calc(calc(8px * var(--tx)) * var(--fz, 1)); color: var(--ink); }
.cw-mvbar { display: flex; align-items: center; justify-content: center; gap: 12px; }
.cw-mbtn { font-size: calc(calc(8px * var(--tx)) * var(--fz, 1)); padding: calc(6px * var(--tx)) calc(10px * var(--tx)); }

/* The map of E and the circle of tastes. */
.cw-lead.cw-lead3 { min-height: calc(3 * 1.75em); }
.cw-maprow { display: flex; align-items: center; justify-content: center; gap: 36px; margin-top: 2px; }
.cw-mapw, .cw-tcw { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cw-map { display: block; overflow: visible; max-width: 100%; height: auto; }
.cw-mgrid { stroke: var(--ink2); stroke-opacity: 0.16; stroke-width: 1; }
.cw-max { stroke: var(--ink2); stroke-opacity: 0.55; stroke-width: 1.5; }
.cw-mdisc { fill: #FFFFFF; stroke: var(--ink); stroke-width: 2; }
.cw-mic { font-size: 17px; text-anchor: middle; }
.cw-mic.s { font-size: 15px; }
.cw-mp { font-family: var(--px); font-weight: 700; font-size: 15px; fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: #FFFFFF;
  stroke-width: 4px; stroke-linejoin: round; }
.cw-mitem.habit .cw-mdisc { stroke: var(--wear0); stroke-width: 4.5; }
.cw-mitem.top .cw-mdisc { stroke-width: 4.5; }
.cw-mitem.dim { opacity: 0.28; }
.cw-mz line { stroke: var(--pink); stroke-width: 4; stroke-linecap: round; }
.cw-mz polygon { fill: var(--pink); }
.cw-mzl { font-family: KaTeX_Math, "Times New Roman", serif; font-style: italic; font-size: 24px; fill: var(--pink); }
.cw-tcirc { display: block; overflow: visible; max-width: 100%; height: auto; }
.cw-tring { fill: none; stroke: var(--ink2); stroke-width: 2; stroke-dasharray: 5 5; }
.cw-tlab { font-family: var(--sign); font-size: 11px; letter-spacing: 0.06em; fill: var(--ink); }

/* What we learned: the cards of Old Bessie's scene 430 (sec3e.css), without pictures. */
.cw-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 360px)); justify-content: center;
  gap: calc(12px * var(--tx)) calc(16px * var(--tx)); margin-top: calc(8px * var(--tx)); }
.cw-card { display: flex; flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 14px 14px; min-width: 0; }
.cw-card.cw-on { outline: 3px solid var(--red); outline-offset: 4px; }
.cw-cardh { display: flex; align-items: center; gap: 12px; }
.cw-cardn { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 24px; padding: 0 6px;
  transform: skewX(-14deg); background: var(--red); color: #FFFFFF; font-family: var(--disp); font-style: italic; font-weight: 800;
  font-size: 17px; line-height: 1; flex: 0 0 auto; }
.cw-cardt { font-family: var(--disp); font-style: italic; font-weight: 800; letter-spacing: 0.05em; color: var(--ink); white-space: nowrap;
  font-size: calc(calc(11px * var(--tx)) * var(--fz, 1)); line-height: 1; }
.cw-cardc { font-size: calc(calc(12.5px * var(--tx)) * var(--fz, 1)); line-height: 1.45; text-align: center; padding: 6px 0 4px; }

@media (max-width: 1000px) {
  .cw-maprow { flex-direction: column; gap: 14px; }
  .cw-cards { grid-template-columns: repeat(2, minmax(0, 340px)); }
}
@media (max-width: 560px) {
  .cw-up { padding: 8px 10px 10px; }
  .cw-hpg { column-gap: 8px; }
  .cw-upr { flex-wrap: wrap; }
  .cw-hpn { font-size: 14px; min-width: 0; }
  .cw-cards { grid-template-columns: minmax(0, 1fr); }
  .cw-cardt { white-space: normal; }
}

:root {
  --px: "Rubik", "Helvetica Neue", Arial, sans-serif;
  --disp: "Righteous", "Rubik", sans-serif;
  --sign: "Bungee", "Rubik", sans-serif;
  --fz: 1.24; --lh: 0.8;
  --bg: #FFF4DF; --box: #FFFFFF; --white: #FFFFFF; --ink: #1E1442; --ink2: #5A5378; --hi: #1E1442; --press: #D9CFF0;
  --yellow: #FFC736; --orange: #FF8A2A; --pink: #F2386F; --violet: #7A3FE0; --cyan: #19B6E8; --ring: #F2386F;
  --run: #2F6BFF; --service: #FF9E1B; --replace: #F2386F;
  --run-soft: #E1E9FF; --service-soft: #FFEFD6; --replace-soft: #FFE0EA;
  /* Colour-blind safe since 2026-11-19 (COLOR.md): the van's states run cool to hot in the marquee's own hues,
     turquoise, yellow, orange, raspberry, each pair apart under protanopia, deuteranopia and tritanopia (until then
     a traffic light whose green and red merged for a deuteranope); money won petrol, money lost crimson, both dark
     enough for words and for white numbers; --good marks the human and an agreement beside the pink computer. */
  --wear0: #2EC4B6; --wear1: #FFD447; --wear2: #FF7F27; --wear3: #D81B60;
  --wear0-soft: #D2F4F0; --wear1-soft: #FFF4C6; --wear2-soft: #FFE4D1; --wear3-soft: #FBD3E1;
  --wear0-ink: #0B776D; --wear1-ink: #8A6500; --wear2-ink: #B4500E; --wear3-ink: #B3124E;
  --gain: #0E7490; --loss: #C21848; --good: #0B74A6;
  --sunset: linear-gradient(180deg, var(--yellow) 0 25%, var(--orange) 25% 50%, var(--pink) 50% 75%, var(--violet) 75%);
}
body { font-family: var(--px); font-weight: 500; background: var(--bg); color: var(--ink); }
button { font-family: var(--px); color: var(--ink); }

/* The frame: a cabinet's marquee strip on top, the control panel below. */
.topbar { background: var(--bg); border-bottom: 0; position: relative; padding: 10px var(--gut) 14px; }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
  background: linear-gradient(180deg, var(--yellow) 0 2px, transparent 2px 3px, var(--orange) 3px 5px, transparent 5px 6px, var(--pink) 6px 8px); }
.topbar .brand { font-family: var(--disp); font-size: 15px; letter-spacing: 0.02em; color: var(--ink); }
.pager { gap: 6px; padding: 2px; }
.pager button { min-width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2.5px solid var(--ink); background: #FFFFFF;
  box-shadow: 0 2.5px 0 0 var(--ink); font-family: var(--sign); font-size: 11px; color: var(--ink); }
.pager button.card { min-width: 12px; width: 12px; height: 12px; border-radius: 2px; transform: rotate(45deg); background: var(--ink); box-shadow: none; border-width: 0; margin: 0 3px; }
.pager button.opt { border-style: dashed; box-shadow: none; }
.pager button[aria-current] { background: var(--yellow); box-shadow: 0 2.5px 0 0 var(--ink); }
.pager button.card[aria-current] { background: var(--pink); }
.fullbtn { border: 2.5px solid var(--ink); border-radius: 8px; background: #FFFFFF; box-shadow: 0 2.5px 0 0 var(--ink); color: var(--ink); }
.fullbtn:hover { background: var(--yellow); }

.stage { padding-top: 16px; background: radial-gradient(circle at 50% 120%, rgba(255, 199, 54, 0.16), transparent 55%), var(--bg); }
.scene-head { align-items: center; gap: 14px; padding: 0 0 12px; }
.scene-head .scene-no { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%;
  background: var(--yellow); border: 3px solid var(--ink); box-shadow: 0 3px 0 0 var(--ink); font-family: var(--sign); font-size: 18px; color: var(--ink); line-height: 1; }
.scene-head h2 { font-family: var(--disp); font-size: calc(24px * var(--tx)); line-height: 1.1; letter-spacing: 0.01em; color: var(--ink); }
.scene-head .opt-tag { font-family: var(--sign); font-size: 12px; letter-spacing: 0.08em; border: 2.5px dashed var(--ink); border-radius: 999px; background: #FFFFFF; padding: 7px 12px; }

.foot { background: var(--bg); border-top: 0; position: relative; padding: 14px var(--gut) 12px; }
.foot::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px;
  background: linear-gradient(180deg, var(--pink) 0 2px, transparent 2px 3px, var(--orange) 3px 5px, transparent 5px 6px, var(--yellow) 6px 8px); }
.navbtn { border: 3px solid var(--ink); border-radius: 999px; background: #FFFFFF; box-shadow: 0 5px 0 0 var(--ink);
  font-family: var(--sign); font-size: 18px; letter-spacing: 0.04em; padding: 13px 26px 11px; min-width: 150px; color: var(--ink); }
.navbtn.next { background: var(--pink); color: #FFFFFF; box-shadow: 0 5px 0 0 var(--ink); }
.navbtn:active:not(:disabled) { box-shadow: 0 1px 0 0 var(--ink); transform: translateY(4px); }
.navbtn.skip { border-style: dashed; font-size: 13px; box-shadow: none; }
.beats { gap: 7px; }
.beats i { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--ink); background: #FFFFFF; }
.beats i.past { background: var(--ink); }
.beats i.on { background: var(--yellow); }

/* Panels: stickers on the cabinet. */
.ob-box { background: #FFFFFF; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 0 var(--ink); }
.ob-box.plain { box-shadow: 4px 4px 0 0 var(--ink); }
.ob-box.white { background: #FFFFFF; box-shadow: 5px 5px 0 0 var(--ink); }
.ob-say { font-weight: 500; line-height: 1.3; }
.ob-note { color: var(--ink2); line-height: 1.35; }
.ob-big { font-family: var(--disp); }
.ob-mark { background: var(--yellow); padding: 0 0.2em; border-radius: 4px; }
.ob-btn { border: 3px solid var(--ink); border-radius: 999px; background: var(--yellow); box-shadow: 0 4px 0 0 var(--ink); font-family: var(--sign); letter-spacing: 0.03em; color: var(--ink); }
.ob-btn.quiet { background: #FFFFFF; box-shadow: 0 4px 0 0 var(--ink); }
.ob-btn:active:not(:disabled) { box-shadow: 0 1px 0 0 var(--ink); transform: translateY(3px); }

.ob-chip { border: 2.5px solid var(--ink); border-radius: 999px; background: #FFFFFF; font-weight: 700; letter-spacing: 0.02em; padding: 0.42em 0.8em 0.38em; }
.ob-chip .dot { border: 2px solid var(--ink); border-radius: 50%; }
.ob-chip.a0 { background: var(--run); color: #FFFFFF; border-color: var(--ink); }
.ob-chip.a1 { background: var(--service); color: var(--ink); border-color: var(--ink); }
.ob-chip.a2 { background: var(--replace); color: #FFFFFF; border-color: var(--ink); }
.ob-van .gauge { border: 2.5px solid var(--ink); border-radius: 999px; background: #FFFFFF; padding: 3px 6px; gap: 3px; }
.ob-van .gauge i { width: 10px; height: 10px; border-radius: 50%; border: 0; background: #E4DDF2; opacity: 1; }
.ob-van .tag { font-family: var(--sign); letter-spacing: 0.04em; }
.ob-van.w0 .tag { color: var(--wear0-ink); } .ob-van.w1 .tag { color: var(--wear1-ink); } .ob-van.w2 .tag { color: var(--wear2-ink); } .ob-van.w3 .tag { color: var(--wear3-ink); }
.ob-game .label { font-family: var(--sign); font-size: 12px; letter-spacing: 0.03em; }
.ob-ring { outline: 4px solid var(--pink); outline-offset: 5px; border-radius: 6px; }
.ob-arrow line, .ob-arrow polyline { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.ob-arrow polygon { fill: var(--ink); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.ob-arrow-label { border: 2.5px solid var(--ink); border-radius: 999px; background: var(--yellow); font-weight: 700; padding: 5px 9px 4px; }

<style>/* juice.css */
/* juice.css: the motion layer of the look Arcade Marquee (design/arcade-marquee-motion, 2026-11-17), with juice.js.
   Loaded last by the three shells. Only individual transform properties (translate, rotate, scale) and opacity are
   animated here, so that the inline transforms of the engine (a flying copy, a moved element) keep working, and so
   that the compositor does the work on an iPad. html.fx-still (&instant, prefers-reduced-motion, &nojuice) and the
   media query at the end stop every loop; html.fx-live is set while a beat reached with Next is playing. */

/* The particles: one canvas over the page. */
.fx-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* A flying copy runs no animation of its own (the tumble of a die, a van's idle bob). */
.fx-fly, .fx-fly * { animation: none !important; }

/* A number while it counts: lit like a score. */

/* The spark that rides the tip of an arrow while it draws itself. */

.ob-arrow polygon { transform-box: fill-box; transform-origin: 50% 50%; }

.ob-ring { animation: fx-ring 0.72s cubic-bezier(.2,.7,.2,1) both; }
@keyframes fx-ring {
  0% { outline-color: transparent; outline-offset: 18px; }
  55% { outline-color: var(--pink); outline-offset: 1px; }
  78% { outline-offset: 7px; }
  100% { outline-offset: 5px; }
}
.tb .ob-ring { animation-name: fx-ring-in; }
@keyframes fx-ring-in { 0% { outline-color: transparent; outline-offset: 8px; } 60% { outline-offset: -4px; } 100% { outline-offset: -2px; } }

/* The stage card: a lit marquee. Bulbs run along its top and bottom edges and a wave of light chases along them. */
.ob-card .kicker { white-space: nowrap; }
.ob-card.ob-box { padding-bottom: calc(28px * var(--tx) + 18px); }
.ob-card > .fx-bulbs { position: absolute; left: 26px; right: 26px; margin: 0; display: flex; justify-content: space-between;
  pointer-events: none; z-index: 0; }
.ob-card > .fx-bulbs.top { top: 11px; }
.ob-card > .fx-bulbs.bottom { bottom: 11px; }
.fx-bulbs i { position: relative; width: 11px; height: 11px; border-radius: 50%; background: #F6E3AE; border: 2px solid var(--ink); }
.fx-bulbs i::after { content: ""; position: absolute; left: -2px; top: -2px; width: 11px; height: 11px; border-radius: 50%;
  background: var(--yellow); border: 2px solid var(--ink); box-shadow: 0 0 0 3px rgba(255, 199, 54, 0.45), 0 0 10px 3px rgba(255, 199, 54, 0.55);

@media (max-height: 800px) and (min-width: 1080px) { .ob-card > .fx-bulbs.top { top: 7px; } .ob-card > .fx-bulbs.bottom { bottom: 7px; } .fx-bulbs i, .fx-bulbs i::after { width: 9px; height: 9px; } }
@media (max-width: 560px) { .ob-card.ob-box { padding-bottom: 40px; } .ob-card > .fx-bulbs { left: 14px; right: 14px; } .ob-card > .fx-bulbs.top { top: 7px; } .ob-card > .fx-bulbs.bottom { bottom: 7px; }

  80% { translate: 4px 0; rotate: -2.5deg; }

@keyframes fx-press { 0%, 100% { opacity: 1; scale: 1; } 50% { opacity: 0.35; scale: 0.96; } }

/* Idle life: the vans of a few scenes run their engines. HEALTHY hums, WORN sags, SHAKY rattles, FAILING shakes and
   smokes; exhaust puffs leave every one of them. The loops move the picture inside the van, never the van itself. */
.fx-idle .ob-van { position: relative; }
.fx-idle .ob-van > .ob-art { display: inline-block; transform-origin: 50% 100%; animation: fx-hum 1.6s ease-in-out infinite; }
.fx-idle .ob-van.w1 > .ob-art { animation-name: fx-sag; animation-duration: 2.2s; }

.fx-idle .ob-van:nth-child(2) > .ob-art { animation-delay: -0.4s; }
.fx-idle .ob-van:nth-child(3) > .ob-art { animation-delay: -0.8s; }
@keyframes fx-hum { 0%, 100% { translate: 0 0; } 50% { translate: 0 -2.5px; } }

@keyframes fx-rattle { 0%, 100% { translate: 0 0; rotate: 0deg; } 20% { translate: 0 -2px; rotate: -1.6deg; } 45% { translate: 0 0; rotate: 1.2deg; }
  70% { translate: 0 -1px; rotate: -0.8deg; } }
@keyframes fx-shake { 0%, 100% { translate: 0 0; rotate: 0deg; } 15% { translate: -1.5px -1.5px; rotate: -2.4deg; } 35% { translate: 1.5px 0; rotate: 2deg; }
  55% { translate: -1px -2px; rotate: -1.6deg; } 75% { translate: 1px 0; rotate: 1.4deg; } }
.fx-puffs { position: absolute; left: 1%; bottom: 22%; width: 0; height: 0; pointer-events: none; }
.fx-puffs i { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: #CFC9DE;
  border: 2px solid rgba(30, 20, 66, 0.25); opacity: 0; animation: fx-puff 2.1s ease-out infinite; }
.fx-puffs i:nth-child(2) { animation-delay: 0.7s; }

@keyframes fx-puff { 0% { opacity: 0; translate: 0 0; scale: 0.3; } 12% { opacity: 0.9; } 100% { opacity: 0; translate: -10px -26px; scale: 1.5; } }
.fx-idle .ob-van.w2 .fx-puffs i { background: #B5AECB; }
.fx-idle .ob-van.w3 .fx-puffs i { background: #8E86A8; animation-duration: 1.3s; }
.fx-idle .ob-van.w3 .fx-puffs { left: 8%; bottom: 72%; }
@keyframes fx-smoke { 0% { opacity: 0; translate: 0 0; scale: 0.4; } 15% { opacity: 0.95; } 100% { opacity: 0; translate: 4px -34px; scale: 1.9; } }
.fx-idle .ob-van.w3 .fx-puffs i { animation-name: fx-smoke; }
/* The stage card's van idles with puffs once it has arrived. */
.ob-card .road .ob-van { position: relative; }

/* A die is tossed: it crouches, flies up spinning about its centre, lands with a squash and a small hop, and settles.
   The squash is about the centre too, so the translate puts the bottom back on the floor (about 0.1 of the die). At
   1180 x 820 the die sits 24 px under the title of its box: at the top of the toss, smaller and turned by 30 degrees,

.ob-die { display: inline-block; transform-origin: 50% 50%; }
.ob-die.tumble { animation: fx-toss 1.5s linear both; }
@keyframes fx-toss {
  0% { translate: 0 0; rotate: 0deg; scale: 1 1; animation-timing-function: ease-out; }
  8% { translate: 0 4px; rotate: 0deg; scale: 1.12 0.88; animation-timing-function: cubic-bezier(.25,.6,.35,1); }
  40% { translate: 0 -14px; rotate: 300deg; scale: 0.9 0.9; animation-timing-function: cubic-bezier(.55,0,.8,.4); }
  66% { translate: 0 5px; rotate: 540deg; scale: 1.16 0.84; animation-timing-function: cubic-bezier(.3,.7,.4,1); }
  78% { translate: 0 -6px; rotate: 600deg; scale: 0.97 1.03; animation-timing-function: cubic-bezier(.5,0,.7,.5); }
  88% { translate: 0 2px; rotate: 630deg; scale: 1.05 0.95; animation-timing-function: ease-out; }
  100% { translate: 0 0; rotate: 720deg; scale: 1 1; }
}

/* The layer off (&nojuice, OB.fx.off): the CSS motion of cfa9c43 (core.css) comes back, no loop of this file runs. */

<script>/* coupon.js */
/* coupon.js: Coupon of the Week, the MDP of the page "Coupon of the Week" (main session, 2026-11-18).

   A supermarket app sends each household one coupon a week, CHF 3 off one of 24 products that the household does not
   buy yet. In the browser it is window.CW; in node, require('./coupon.js'). node tools/make_data.js --check asserts
   the numbers the page shows. Every number here is invented for teaching (a toy model, no data): the generator is this file.

   The hidden model. Product j has a trait, a point on a circle at 15 j degrees: across, healthy (right) or indulgent
   (left); up, premium (top) or budget (bottom). Its weekly profit is 1 + 0.5 x (its height), CHF 0.50 to 1.50. A
   household has a hidden taste, a direction on the same circle; its fit with product j is the inner product of taste
   and trait, between -1 and 1. It starts with 4 habits (products bought every week): the 4 best fits after a noise of
   up to 0.4 each way. A coupon for product a is used with probability sigmoid(6 (fit - 0.3)); a used coupon becomes a
   habit with probability sigmoid(6 (fit - 0.5)), from the next week on.

   One week: the state s is the basket, 24 numbers, 1 for a habit. The action is the coupon a (a product not in the
   basket). The reward is the profit of every habit, plus (profit of a - 3) when the coupon is used. An episode is one
   quarter, WEEKS = 12 weeks; its return G1 is the sum of the 12 rewards (no discount).

   The policy (the representation): two numbers per household, z = s W, with s a row of 24 numbers and W 24 x 2, one
   row per product (z is the sum of the rows of W of the habits); each product a has two numbers e_a, its column of E,
   2 x 24; its preference is the inner product theta_a = z . e_a, so the row of preferences is theta = z E; softmax
   over the products not in the basket gives the probabilities; the roulette picks. Here W is stored as 2 arrays of 24
   (W[r][j] is row j, column r of the W the page draws) and E as 24 arrays of 2 (E[a][c] is row c, column a of its E).

   Luck. Each household uses exactly PER = 1 + 24 + 3 x 12 = 61 numbers of the luck, in this order: its taste, the 24
   noises of its starting basket, then three per week (the roulette, the use, the habit). Two policies played on the
   same luck meet the same households and the same chances; a change in their average return comes from the policies
   alone. */
(function (root) {
  'use strict';

  const PRODUCTS = [
    ['carrots', '\u{1F955}'], ['wholemeal bread', '\u{1F35E}'], ['strawberries', '\u{1F353}'], ['salad', '\u{1F957}'],
    ['salmon', '\u{1F41F}'], ['avocados', '\u{1F951}'], ['fresh pasta', '\u{1F35D}'], ['gruyère', '\u{1F9C0}'],
    ['craft beer', '\u{1F37A}'], ['chocolates', '\u{1F36B}'], ['tiramisu', '\u{1F370}'], ['bacon', '\u{1F953}'],
    ['fries', '\u{1F35F}'], ['frozen pizza', '\u{1F355}'], ['cola', '\u{1F964}'], ['sweets', '\u{1F36C}'],
    ['instant noodles', '\u{1F35C}'], ['cervelat', '\u{1F32D}'], ['rice', '\u{1F35A}'], ['white bread', '\u{1F956}'],
    ['potatoes', '\u{1F954}'], ['eggs', '\u{1F95A}'], ['oats', '\u{1F963}'], ['apples', '\u{1F34E}'],
  ];
  const NAMES = PRODUCTS.map((p) => p[0]);
  const ICONS = PRODUCTS.map((p) => p[1]);
  const N = 24;
  const WEEKS = 12;
  const DISCOUNT = 3;
  const START_HABITS = 4;
  const NOISE = 0.8;                         // the basket's noise: uniform, width 0.8 (up to 0.4 each way)
  const PER = 1 + N + 3 * WEEKS;             // numbers of luck per household
  const TRAIT = NAMES.map((_, j) => [Math.cos(2 * Math.PI * j / N), Math.sin(2 * Math.PI * j / N)]);
  const PROFIT = TRAIT.map((t) => Math.round((1 + 0.5 * t[1]) * 100) / 100);

  const sig = (x) => 1 / (1 + Math.exp(-x));
  const pUse = (f) => sig(6 * (f - 0.3));
  const pHabit = (f) => sig(6 * (f - 0.5));

  /* Mulberry32, the generator of the arcade and of Old Bessie (bessie.js). */
  function rng(seed) {
    let t = seed >>> 0;

      head.appendChild(h);

      if (s.aside) head.appendChild(el("span", "opt-tag aside-tag", "ASIDE"));

<script>/* art.js */
/* art.js: the pictures of "Old Bessie" (agent A2, 2026-11-14), as inline SVG pixels, crisp at any size. OB.art.

    "..KBBBBBBBBBBBBBBBKKKKKK......",
    "..KBBBBBBBBBBBBBBBKBBBBBK.....",
    "..KBBBBBBBBBBBBBBBKGGGGBBK....",
    "..KBBBBBBBBBBBBBBBKGGGGBBBK...",
    "..KBBBBBBBBBBBBBBBKGGGGBBBK...",
    "..KBBBBBBBBBBBBBBBKBBBBBBLK...",
    "SSKBBBBBBBBBBBBBBBKBBBBBBBKSS.",
    "SSKKKTTTKKKKKKKKKKKKKTTTKKKSS.",
    "...TTTTTTT.........TTTTTTT....",
    "...TTTHTTT.........TTTHTTT....",

  var PX = { ".": null, K: "#0b0b16", W: "#f4f6ff", R: "#ff4d5e", r: "#c0202e", G: "#6be24a", g: "#1f9a52",

  var SPRITES = {
    van: ["...........", "...KKKKKKK.", "..KKWWKbbbK", ".KbbbbbbbbK", ".KbbbbbbbbK",
      ".KbbbbbbbbK", ".KKKKKKKKK.", "..KK...KK..", "..KK...KK..", "..........."],
    robot: [".....R.....", ".....K.....", "..KKKKKKK..", "..KSSSSSK..", "..KSSSSSK..",
      "..KCCSCCK..", "..KSSSSSK..", "..KSKKKSK..", "..KKKKKKK..", "...K...K..."],
    tag: ["..KKKKKKK..", ".KOOOKOOOK.", ".KOOOOOOOK.", ".KOYYYOOOK.", ".KOYOOOOOK.",
      ".KOYYYOOOK.", ".KOOOYOOOK.", ".KOYYYOOOK.", ".KOOOOOOOK.", "..KKKKKKK.."],
    pokeball: ["...KKKKK...", ".KKRRRRRKK.", ".KRRRRRRRK.", "KRRRRRRRRRK", "KRRRWWWRRRK",

  };

    { id: "bessie", sprite: "van", name: "OLD BESSIE" },
    { id: "anymal", sprite: "robot", name: "ANYMAL" },
    { id: "pricing", sprite: "tag", name: "LAST-MINUTE PRICING" },
    { id: "pokemon", sprite: "pokeball", name: "POKEMON" }
  ];
  function sprite(name, px) { return pixels(SPRITES[name], PX, px || 6); }
  /* A game as an element: its sprite on a cartridge-like tile and its name. id: bessie, anymal, pricing, pokemon. */
  function game(id, opts) {

  var FACE = ["..KKKKK..", ".KYYYYYK.", "KYYKYKYYK", "KYYKYKYYK", "KYYYYYYYK", "KYKYYYKYK", "KYYKKKYYK", ".KYYYYYK.", "..KKKKK.."];

  function dieRows(n) {

<script>/* skin-base.js */

<script>/* tex.js */
/* tex.js: the formulas of "Old Bessie" in LaTeX's standard font, Computer Modern (agent T, 2026-11-16). Carlos: "Please
   use the LaTeX standard font whenever you show math formulas." KaTeX 0.16.11 (katex.js, katex.css, MIT) draws every
   formula and math symbol offline, in its two faces KaTeX_Main-Regular (upright: digits, signs, Greek capitals,
   nabla) and KaTeX_Math-Italic (italic letters and lowercase Greek), both in font/ and inlined by tools/build.py.
   Loaded after art.js, the skins and katex.js, before every section. ENGINE.md, section Formulas, has the rules.

   OB.tex(src)          the KaTeX HTML of the TeX src (a string; cached), for markup: "the " + OB.tex("G_1") + " of"
   OB.texEl(src, cls)   the same in an element: span.ob-tex (and cls)
   OB.texNum(s)         a number or an amount as OB.num and OB.money write it, as TeX: "$1,234.56" -> "\$1{,}234.56",
                        "-$243.36" -> "-\$243.36" (KaTeX draws the hyphen as the minus of a formula)
   OB.texArith(s)       arithmetic as the data files write it, as TeX: OB.texNum, and " x " becomes the times sign,
                        " / " a slash spaced like the other operators: "0.01 x 201" -> "0.01 \times 201"
   OB.texIn(markup)     markup whose formulas sit between \( and \): each drawn by KaTeX, the rest left as it is (the
                        text files sec3a-data.js and sec3c-text.js mark their formulas so, for node to check them)
   OB.texText(s)        a number shown outside KaTeX in the face of the formulas (class ob-texn; it rolls or flies):
                        its hyphen becomes the minus sign of the formulas
   OB.texFmt(f)         a formatter for api.roll that writes f(x) as OB.texText does
   OB.texNumEl(s, cls)  a number in the face of the formulas: span.ob-texn with OB.texText(s)
   art.sym(name), art.symEl(name)   gamma, alpha, epsilon (drawn as varepsilon), nabla and Sigma by KaTeX: markup, or
                        span.ob-symbox */
(function () {
  "use strict";
  var OB = window.OB, art = OB.art, K = window.katex;
  var MINUS = String.fromCharCode(8722);
  var OPTS = {
    output: "html", throwOnError: false, strict: false,
    /* \htmlClass only: it lets a formula mark a part of itself for a skin's highlight (scene 370's sign). */
    trust: function (c) { return c.command === "\\htmlClass"; }
  };
  var cache = Object.create(null);

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function tex(src) {
    var s = String(src);
    var h = cache[s];
    if (h === undefined) {
      if (K) {
        try { h = K.renderToString(s, OPTS); } catch (e) { if (window.console) console.error("OB.tex:", s, e); h = esc(s); }
      } else h = esc(s);
      cache[s] = h;
    }
    return h;
  }
  function texEl(src, cls) {
    var e = document.createElement("span");
    e.className = "ob-tex" + (cls ? " " + cls : "");
    e.innerHTML = tex(src);
    return e;
  }
  function texNum(s) { return String(s).replace(/\$/g, "\\$").replace(/,/g, "{,}"); }
  function texArith(s) {
    return texNum(s).replace(/ x /g, " \\times ").replace(/ \/ /g, " \\mathbin{/} ");
  }
  function texIn(markup) {
    return String(markup).replace(/\\\(([\s\S]+?)\\\)/g, function (m, src) { return tex(src); });
  }
  function texText(s) { return String(s).replace(/-/g, MINUS); }
  function texFmt(f) { return function (x) { return texText(f(x)); }; }
  function texNumEl(s, cls) {
    var e = document.createElement("span");
    e.className = "ob-texn" + (cls ? " " + cls : "");
    e.textContent = texText(s);
    return e;
  }

  OB.tex = tex;
  OB.texEl = texEl;
  OB.texNum = texNum;
  OB.texArith = texArith;
  OB.texIn = texIn;
  OB.texText = texText;
  OB.texFmt = texFmt;
  OB.texNumEl = texNumEl;

  /* The Greek letters of art.js, by KaTeX: the names of ENGINE.md, epsilon drawn as the textbooks' varepsilon. */
  var GREEK = { gamma: "\\gamma", alpha: "\\alpha", epsilon: "\\varepsilon", nabla: "\\nabla", Sigma: "\\Sigma" };
  art.sym = function (name) { return tex(GREEK[name] || name); };
  art.symEl = function (name) {
    var s = texEl(GREEK[name] || name, "ob-symbox");
    s.setAttribute("aria-label", name);
    return s;
  };
  art.TEX = GREEK;
})();
</script>
<script>/* cw-0kit.js */
/* cw-0kit.js: the kit of the page "Coupon of the Week" (main session, 2026-11-18), window.OB.cw. Every number comes
   from coupon.js (window.CW, the MDP and the policy) and coupon-data.js (window.CWD, written by tools/make_data.js).

   Words: K.lead(root) and K.say(p, markup, api), the lead line of a scene (formulas between \( and \), drawn by KaTeX);
   K.live(api, k), true when beat k was reached with Next from beat k - 1; K.opt(go, delay).
   Numbers: K.n2(x), K.wf(v) (a weight: two decimals, three when the third is not 0), K.chf(x).
   Weights: K.weightsAt(i), W and E after i rounds of proto-REINFORCE (replayed from CWD.init exactly as
   tools/make_data.js computed them); K.round(i), the numbers of round i (1-based); K.luckOf(i), its luck.
   Pieces: K.Table (the 24 products in columns, rows added by key), K.Strip (the 96 weights as coloured cells),
   K.Dia (the diagram of the forward and backward pass: the strip, the households, their returns, the average),
   K.ba and K.avgBox (boxes Before and After), K.wsym(k) (the symbol of weight k, its product as an icon). */
(function () {
  "use strict";
  var OB = window.OB, CW = window.CW, D = window.CWD, el = OB.el;
  if (!CW || !D) { console.error("cw-0kit: coupon.js or coupon-data.js is missing"); return; }
  var K = OB.cw = {};
  var N = CW.N;

  /* Words. */
  K.lead = function (root, cls) { var p = el("p", "ob-say cw-lead" + (cls ? " " + cls : "")); root.appendChild(p); return p; };
  /* A formula and the punctuation after it stay on one line. */
  K.nowrap = function (markup) { return markup.replace(/\\\(((?:(?!\\\)).)*)\\\)([.,:;!?])/g, "<span class=\"cw-nw\">\\($1\\)$2</span>"); };
  K.say = function (p, markup, api) {
    markup = OB.texIn(K.nowrap(markup));
    if (p.dataset.t === markup) return;
    p.dataset.t = markup;
    p.innerHTML = "<span>" + markup + "</span>";
    if (api && api.forward && !api.instant) api.fade(p, true);
  };
  /* The head of a scene whose title changes between beats (scenes 220 and 320, 2026-11-19); the new title fades in
     when its beat is reached with motion. inside: any element of the scene. */
  K.title = function (inside, text, api) {
    var sec = inside && inside.closest ? inside.closest("section.scene") : null, h = sec ? sec.querySelector(".scene-head h2") : null;
    if (!h || h.textContent === text) return;
    h.textContent = text;
    if (api && api.forward && !api.instant) api.fade(h, true, { dur: 800 });
  };
  K.live = function (api, k) { return api.forward && !api.instant && api.from === k - 1; };
  K.opt = function (go, delay, extra) { var o = extra || {}; if (go && delay) o.delay = delay; return o; };
  K.phone = function () { return window.matchMedia && window.matchMedia("(max-width: 560px)").matches; };
  /* The diagram in its wide layout (cw-0kit.css: two rows from 1120 px on); narrower, one column. */
  K.wide = function () { return !window.matchMedia || window.matchMedia("(min-width: 1120px)").matches; };

  /* Numbers. */
  K.n2 = function (x) { return OB.num(x, 2); };
  K.wf = function (v) { var m = Math.round(Math.abs(v) * 1000); return OB.num(v, m % 10 !== 0 ? 3 : 2); };
  K.chf = function (x, p) { return "CHF " + OB.num(x, p === undefined ? 2 : p); };
  K.icon = function (j) { return CW.ICONS[j]; };
  K.name = function (j) { return CW.NAMES[j]; };
  K.list = function (names) {
    if (names.length < 2) return names.join("");
    return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
  };
  var fix3 = function (x) { return Math.round(x * 1000) / 1000; };

  /* Weights after i rounds, replayed from the start: w = w + ALPHA x nabla, three decimals, as make_data.js. The
     result is shared (a cache): copy it to keep it. */
  var cache = null;
  function fresh() { return { i: 0, W: CW.copyW(D.init.W), E: CW.copyW(D.init.E) }; }
  K.weightsAt = function (i) {
    if (!cache || i < cache.i) cache = fresh();
    while (cache.i < i) {
      var r = D.rounds[cache.i], w = CW.weightOf(r[0]);
      CW.setW(cache.W, cache.E, w, fix3(CW.getW(cache.W, cache.E, w) + D.ALPHA * r[3]));
      cache.i++;
    }
    return { W: cache.W, E: cache.E };
  };
  K.copy = function (X) { return { W: CW.copyW(X.W), E: CW.copyW(X.E) }; };
  K.round = function (i) {
    var r = D.rounds[i - 1], w = CW.weightOf(r[0]);
    var X = K.weightsAt(i - 1), v = CW.getW(X.W, X.E, w);
    return {
      i: i, k: r[0], w: w, v: v, vh: fix3(v + D.HOP), before: r[1], after: r[2],
      change: Math.round((r[2] - r[1]) * 100) / 100, nabla: r[3], vNew: fix3(v + D.ALPHA * r[3]), upd: r[4],
    };
  };
  var guided = null;
  K.luckOf = function (i) {
    if (i <= 2) { if (!guided) guided = CW.luck(D.LUCK_SEED, D.NHH); return guided; }
    return CW.luck(D.MOVIE_BASE + i, D.NHH);
  };
  K.guided = function () { return K.luckOf(1); };
  K.example = function () { return D.EXAMPLE; };

  /* The 1,000 households of a luck under W, E: every return, the outcomes of the first ten (0 ignored, 1 used,
     2 habit, week by week), the average. */
  K.play = function (W, E, L, nDetail) {
    var n = L.n, G = new Array(n), rows = [], sum = 0, nd = nDetail === undefined ? 10 : nDetail;
    for (var i = 0; i < n; i++) {
      if (i < nd) {
        var ep = CW.playEpisode(W, E, L, i, true);
        G[i] = ep.G1;
        rows.push(ep.weeks.map(function (w) { return w.habit ? 2 : w.used ? 1 : 0; }));
      } else G[i] = CW.playEpisode(W, E, L, i, false);
      sum += G[i];
    }
    return { G: G, rows: rows, avg: sum / n };
  };

  /* The symbol of weight k, indexed (row, column) as the page draws the matrices (cw-2policy.js): W is 24 x 2, one
     row per product, so w with the product's icon, then the column; E is 2 x 24, one column per product, so e with
     the row, then the product's icon. */
  K.wsym = function (k, big) {
    var w = CW.weightOf(k);
    var letter = OB.tex(w.m === "W" ? "w" : "e");
    var sub = w.m === "W" ? "<span class=\"cw-subic\">" + CW.ICONS[w.c] + "</span>," + (w.r + 1)
      : (w.c + 1) + ",<span class=\"cw-subic\">" + CW.ICONS[w.r] + "</span>";
    return "<span class=\"cw-wsym" + (big ? " big" : "") + "\">" + letter + "<sub>" + sub + "</sub></span>";
  };
  K.thsym = function (a) {
    return "<span class=\"cw-wsym\">" + OB.tex("\\theta") + "<sub>s,<span class=\"cw-subic\">" + CW.ICONS[a] + "</span></sub></span>";
  };
  K.wname = function (k) {
    var w = CW.weightOf(k);
    return w.m === "W" ? "number " + (w.r + 1) + " of " + CW.NAMES[w.c] + " in W" : "number " + (w.c + 1) + " of " + CW.NAMES[w.r] + " in E";
  };

  /* The table of the 24 products: one column per product, rows by key. rows: [{ key, label (TeX or markup),
     kind: "icon" | "num" | "prob" }]. T.set(key, values, fmt) writes a row (null leaves a cell blank);
     T.cells[key][j], T.nums[key][j]; T.rowEls(key) gives the label and the cells of a row. */
  K.Table = function (rows, o) {
    o = o || {};
    /* On a phone (cw-0kit.css) a table with the extra column is turned: one column per row of the table, one row per
       product; a table without it is cut into blocks of BW products, one under the other, its labels repeated
       (cw-tlb): --pr and --pc place every cell there. */
    var BW = 8, R = rows.length;
    var T = { cells: {}, nums: {}, labs: {}, labx: {}, xcells: {}, rows: rows }, wrap = el("div", "cw-tabw"), g = el("div", "cw-tab" + (o.extra ? " x" : " blk"));
    wrap.appendChild(g);
    T.el = wrap;
    T.grid = g;
    rows.forEach(function (r, ri) {
      var lab = OB.html("div", "cw-tl k-" + r.key, r.label ? OB.texIn(r.label) : "");
      if (r.gap) lab.classList.add("gap");
      lab.style.setProperty("--pr", String(ri + 1));
      g.appendChild(lab);
      T.labs[r.key] = lab;
      T.labx[r.key] = [];
      if (!o.extra) for (var b = 1; b * BW < N; b++) {
        var lb = OB.html("div", "cw-tl cw-tlb k-" + r.key + (r.gap ? " gap" : "") + (ri === 0 ? " btop" : ""), r.label ? OB.texIn(r.label) : "");
        lb.style.setProperty("--pr", String(b * R + ri + 1));
        g.appendChild(lb);
        T.labx[r.key].push(lb);
      }
      T.cells[r.key] = [];
      T.nums[r.key] = [];
      for (var j = 0; j < N; j++) {
        var c = el("div", "cw-tc k-" + r.key + " " + (r.kind || "num"));
        if (r.gap) c.classList.add("gap");
        if (j === 0) c.classList.add("first");
        if (j === N - 1) c.classList.add("lastc");
        if (!o.extra) {
          c.style.setProperty("--pr", String(Math.floor(j / BW) * R + ri + 1));
          c.style.setProperty("--pc", String(j % BW + 2));
          if (j % BW === 0) c.classList.add("bfirst");
          if (j % BW === BW - 1) c.classList.add("blast");
          if (j >= BW && ri === 0) c.classList.add("btop");
        }
        if (r.kind === "icon") { c.textContent = CW.ICONS[j]; c.title = CW.NAMES[j]; }
        else if (r.kind === "prob") {
          var nn = el("span", "cw-tn"), bar = el("i", "cw-pbar");
          c.appendChild(nn); c.appendChild(bar);

    Wh.turn = function (deg) { Wh.angle = deg; rot.setAttribute("transform", "rotate(" + deg.toFixed(2) + " " + Wh.cx + " " + Wh.cy + ")"); };
    /* The wheel at rest with the pointer on u: the wheel turned by -u x 360 degrees. */
    Wh.rest = function (u) { Wh.turn(-u * 360); };
    Wh.spin = function (u, api, o) {
      var to = -u * 360 - 3 * 360, from = 0;
      if (!api || api.instant) { Wh.turn(to); return; }
      api.at((o && o.delay) || 0, function () {
        api.animate((o && o.dur) || 3600, function (p) { Wh.turn(from + (to - from) * p); }, function () { Wh.turn(to); });
      });
    };
    Wh.lit = function (a) { Object.keys(Wh.slices).forEach(function (k) { Wh.slices[k].classList.toggle("cw-wlit", +k === a); }); };
    return Wh;
  };

  /* A coupon ticket: CHF 3 off, the product's icon and name. */
  /* With profit, the ticket also shows the supermarket's profit on one purchase of the product (Carlos, 2026-11-19:
     "show also the price of the tiramisu so it is clear for the calculation of the final profit"; the model has
     profits only, and the reward uses them). */
  K.ticket = function (j, cls, profit) {
    var t = el("div", "cw-ticket" + (cls ? " " + cls : ""));
    t.appendChild(el("div", "cw-tk-off", "CHF 3 OFF"));
    t.appendChild(el("div", "cw-tk-ic", j === undefined || j === null ? "" : CW.ICONS[j]));
    t.appendChild(el("div", "cw-tk-nm", j === undefined || j === null ? "" : CW.NAMES[j]));
    if (profit && j !== undefined && j !== null) {
      var pr = el("div", "cw-tk-pr");
      pr.appendChild(el("span", "cw-tk-prl", "PROFIT "));
      pr.appendChild(el("span", "cw-tk-prn", K.chf(CW.PROFIT[j])));
      t.appendChild(pr);
    }
    return t;
  };
})();
</script>
<script>/* cw-1game.js */
/* cw-1game.js: the game, scenes 0 to 199 of "Coupon of the Week" (main session, 2026-11-18). Scenes 102, 104 and 112,
   the profit on the coupon and the reward lines of 110 and 112 since 2026-11-19, at Carlos's request: "show also the
   price of the tiramisu so it is clear for the calculation of the final profit. Unclear how the reward is calculated.
   So the state is the habit of a household, a coupon may or may not expand this set and yields a reward. Explain this
   and explain also how the reward is calculated after an action. If necessary explain this in a few more slides".

     0 card "Coupon of the Week"
   100 One coupon a week (4 beats): the 24 products; their profits; the habits of the example household; the 20
       products a coupon can go to
   102 The state (2 beats): the habits as the state s, 24 numbers; the habits' profits, made every week
   104 What a coupon does (5 beats): the action, a coupon for tiramisu with its profit; the three outcomes as the columns
       of a table, IGNORED, USED, HABIT: what the household does, what the coupon adds to this week's reward, tiramisu
       in next week's state, what tiramisu adds to every later reward; the household's taste decides
   110 One week (5 beats): week 1 of the example household: the coupon for tiramisu with its profit, used, its profit
       minus CHF 3, a new habit (HABIT), the reward r1 = habits + coupon
   112 Week 2 (4 beats): the state with tiramisu, the coupon for avocados, USED, r2 = habits + coupon, tiramisu's loss in
       week 1 against its profit in every later week
   120 One quarter (4 beats): the 12 weeks of the example household, their rewards, week 4 (IGNORED: the habits alone),
       the return G1

   The state table of 102 and the reward lines of 110 and 112 take the look and the classes of scene 130 (cw-1play.css:
   cw-pytab, cw-pyblk, cw-pycol, cw-pys, cw-pyp; cw-pyrw, cw-pybox, cw-pych, cw-pycn), so the state and r_t = habits +
   coupon look the same wherever they appear. The example household is CWD.EXAMPLE of the guided luck under the starting
   weights (tools/make_data.js has the criteria); the scenes log a console error when its weeks 1, 2 and 4 stop being
   HABIT, USED and IGNORED. */
(function () {
  "use strict";
  var OB = window.OB, CW = window.CW, D = window.CWD, K = OB.cw, el = OB.el;
  if (!K) { console.error("cw-1game: cw-0kit.js is missing"); return; }

  var EP = CW.playEpisode(D.init.W, D.init.E, K.guided(), D.EXAMPLE, true);
  var HH = EP.household, HAB = [];
  HH.basket.forEach(function (b, j) { if (b) HAB.push(j); });
  var W1 = EP.weeks[0], A1 = W1.a, W2 = EP.weeks[1], A2 = W2.a;
  K.EP = EP;
  K.HAB = HAB;
  var habNames = K.list(HAB.map(K.name));

  var OUT = ["IGNORED", "USED", "HABIT"];
  var outOf = function (w) { return w.habit ? 2 : w.used ? 1 : 0; };
  var habOf = function (s) { var h = []; s.forEach(function (b, j) { if (b) h.push(j); }); return h; };
  var sumOf = function (h) { return h.reduce(function (a, j) { return a + CW.PROFIT[j]; }, 0); };
  var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  /* The coupon's part of the reward when it is used: the product's profit minus the CHF 3 of the coupon. */
  var part = function (a) { return CW.PROFIT[a] - CW.DISCOUNT; };
  var partTex = function (a) { return OB.num(CW.PROFIT[a], 2) + " - 3 = " + OB.num(part(a), 2); };
  var IG = -1;
  EP.weeks.some(function (w, t) { if (!w.used) { IG = t; return true; } return false; });
  if (!(W1.used && W1.habit) || !(W2.used && !W2.habit) || IG < 0) {
    console.error("cw-1game: the example household's weeks 1 and 2 must be HABIT and USED, and one week IGNORED");
  }

  /* The state table: the 24 products in three blocks of 8 (one row from 1120 px on), rows icon, state s, profit, as in
     scene 130. */
  function stateTab(s) {
    var tab = el("div", "cw-pytab cw-sttab"), blocks = [], cols = [];
    for (var b = 0; b < 3; b++) {
      var blk = el("div", "cw-pyblk" + (b ? " more" : ""));
      var labs = el("div", "cw-pylabs");
      labs.appendChild(el("div", "cw-pyl ic", ""));
      labs.appendChild(OB.html("div", "cw-pyl s", "STATE " + OB.tex("s")));
      var pl = el("div", "cw-pyl p", "PROFIT");
      labs.appendChild(pl);
      blk.appendChild(labs);
      for (var j = 8 * b; j < 8 * b + 8; j++) {
        var c = el("div", "cw-pycol");
        var ic = el("div", "cw-pyic", CW.ICONS[j]);
        var sv = el("div", "cw-pys" + (s[j] ? " hab" : ""));
        sv.appendChild(el("span", "cw-tn", s[j] ? "1" : "0"));

        var p = el("div", "cw-pyp"), pn = el("span", "cw-ppn", OB.num(CW.PROFIT[j], 2));
        p.appendChild(pn);
        c.appendChild(ic);
        c.appendChild(sv);
        c.appendChild(p);
        c.title = CW.NAMES[j];
        blk.appendChild(c);
        cols.push({ el: c, ic: ic, s: sv, p: p, pn: pn });
      }
      tab.appendChild(blk);
      blocks.push({ el: blk, pl: pl });
    }
    return { el: tab, blocks: blocks, cols: cols };
  }

  /* The view of week t of the example episode (scenes 110 and 112): the habits of its state with their profits (a
     habit the household did not have at the start in turquoise), the coupon with its product's profit and a stamp, the
     coupon's part of the reward, and the reward line r_t = habits + coupon of scene 130. When the coupon makes a habit,
     its tile waits hidden at the end of the habits (newHab). */
  function weekView(root, t) {
    var W = EP.weeks[t], H = habOf(W.s), V = { W: W, H: H };
    var row = el("div", "cw-weekrow");
    var hb = el("div", "ob-box cw-habbox");
    hb.appendChild(el("div", "cw-boxh", "HABITS"));
    var hl = el("div", "cw-habs");
    V.tiles = H.map(function (j) {
      var h = el("div", "cw-hab" + (HH.basket[j] ? "" : " new"));
      h.appendChild(el("span", "cw-hi", CW.ICONS[j]));
      h.appendChild(el("span", "cw-hp", OB.num(CW.PROFIT[j], 2)));
      h.title = CW.NAMES[j];
      hl.appendChild(h);
      return h;
    });
    if (W.habit) {
      /* The new habit: its tile and, under it, the caption, both in one wrapper (the caption is wider than the tile). */
      V.newHab = el("div", "cw-habw");
      var nt = el("div", "cw-hab new");
      nt.appendChild(el("span", "cw-hi", CW.ICONS[W.a]));
      nt.appendChild(el("span", "cw-hp", OB.num(CW.PROFIT[W.a], 2)));
      nt.title = CW.NAMES[W.a];
      V.newHab.appendChild(nt);
      V.newHab.appendChild(el("span", "cw-hfrom", "FROM WEEK " + (t + 2)));
      hl.appendChild(V.newHab);
    }
    hb.appendChild(hl);
    hb.appendChild(el("div", "cw-boxf", "PROFIT PER PURCHASE, CHF"));
    row.appendChild(hb);
    V.ticket = K.ticket(W.a, "big", true);
    V.stamp = el("div", "cw-stamp o1");
    V.stampT = el("span", "", OUT[1]);
    V.stamp.appendChild(V.stampT);
    V.ticket.appendChild(V.stamp);
    row.appendChild(V.ticket);
    var cb = V.cb = el("div", "ob-box cw-coupbox");
    cb.appendChild(el("div", "cw-boxh", "THE COUPON"));
    V.cline = OB.html("div", "cw-cline", OB.tex(W.used ? partTex(W.a) : "0"));
    cb.appendChild(V.cline);
    cb.appendChild(el("div", "cw-boxf", W.used ? "PROFIT MINUS CHF 3" : "NOT USED"));
    row.appendChild(cb);
    root.appendChild(row);

    /* The reward line, as in scene 130. */
    var rw = el("div", "cw-pyrw cw-wkrw");
    var sym = OB.html("span", "cw-pyop", OB.tex("r_{" + (t + 1) + "} ="));
    var hbx = el("div", "ob-box cw-pybox");
    hbx.appendChild(el("div", "cw-bah", H.length + " HABITS"));
    V.hnum = el("div", "cw-bnum", OB.num(sumOf(H), 2));
    hbx.appendChild(V.hnum);
    var cbx = el("div", "ob-box cw-pybox");
    var cbh = el("div", "cw-bah cw-pych");
    cbh.appendChild(document.createTextNode("COUPON "));
    cbh.appendChild(el("span", "cw-pyci", CW.ICONS[W.a]));
    var o = outOf(W);
    cbh.appendChild(el("span", "cw-qout o" + o, OUT[o]));
    cbx.appendChild(cbh);
    V.cnum = OB.html("div", "cw-pycn", OB.tex(W.used ? partTex(W.a) : "0"));
    cbx.appendChild(V.cnum);
    var plus = OB.html("span", "cw-pyop", OB.tex("+"));
    var res = el("span", "cw-pyres");
    res.appendChild(OB.html("span", "cw-pyop", OB.tex("=")));
    V.rnum = el("span", "cw-rnum cw-pyrn", OB.num(W.reward, 2));
    res.appendChild(V.rnum);
    V.rparts = [sym, hbx, plus, cbx, res];
    V.rparts.forEach(function (e) { rw.appendChild(e); });
    root.appendChild(rw);
    V.hps = V.tiles.map(function (h) { return h.querySelector(".cw-hp"); });
    return V;
  }
  /* The reward line of a week (Carlos, 2026-11-19: "when computing the reward, animate the profits of all habits by
     moving them towards the total sum so it is clear where the reward comes from"). With motion: r_t = and the habits'
     box; the habits' profits fly from their tiles into its number, which counts up (juice.js, tally); then the
     coupon's part flies down from the coupon's box; then = and the reward. Without motion, all at once. */
  function rewardIn(api, V, on, go) {
    var R = V.rparts;
    V.hnum.textContent = OB.num(sumOf(V.H), 2);
    if (!on || !go) { R.forEach(function (e) { api.show(e, on); }); return; }
    var n = V.H.length, d0 = 700, st = 220, dur = 700;
    api.show(R[0], true, { delay: 200 });
    api.show(R[1], true, { delay: 200 });
    var tallied = OB.fx && OB.fx.tally && OB.fx.tally(V.hps, V.H.map(function (j) { return CW.PROFIT[j]; }), V.hnum, sumOf(V.H),
      function (x) { return OB.num(x, 2); }, { delay: d0, stagger: st, dur: dur });
    var d1 = tallied ? d0 + st * (n - 1) + dur + 150 : 700, d2 = d1 + 300;
    api.show(R[2], true, { delay: d1 });
    api.show(R[3], true, { delay: d1 });
    if (V.W.used) { api.fly(V.cline, V.cnum, { delay: d2, dur: 900, arc: 30 }); d2 += 1000; }
    api.show(R[4], true, { delay: d2 });
    if (OB.fx && OB.fx.bump) api.at(d2 + 700, function () { OB.fx.bump(V.rnum, 0.34, 460); });
  }
  function setStamp(V, o) {
    V.stamp.className = "cw-stamp o" + o;
    V.stampT.textContent = OUT[o];
  }

  /* 0. The card, with three coupons. */
  OB.scene({
    key: "card", order: 0, title: "Coupon of the Week",
    card: { kicker: "PROTO-REINFORCE", title: "Coupon of the Week", line: "A supermarket app picks one coupon a week for each household. Its policy turns 24 numbers about a household into two.", van: false },
    build: function (root) {
      var road = root.querySelector(".road");
      if (!road) return;
      var fan = el("div", "cw-fan drive");
      [5, 10, 13].forEach(function (j, i) { var t = K.ticket(j, "f" + i); fan.appendChild(t); });
      road.appendChild(fan);
    },
  });

  /* 100. One coupon a week. */
  var L100 = [
    "A supermarket app sends every household one coupon a week: CHF 3 off one of 24 products.",
    "The supermarket's profit on one purchase of each product: from CHF 0.50 to CHF 1.50.",
    "A household buys its habits every week. This household's habits: " + habNames + ".",
    "The coupon goes to a product the household does not buy yet: " + (CW.N - HAB.length) + " choices.",
  ];
  OB.scene({
    key: "shop", order: 100, title: "One coupon a week", beats: L100.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      var shelf = el("div", "cw-shelf");
      P.tiles = [];
      for (var j = 0; j < CW.N; j++) {
        var t = el("div", "cw-tile");
        t.appendChild(el("div", "cw-ti", CW.ICONS[j]));
        t.appendChild(el("div", CW.NAMES[j].length >= 15 ? "cw-tn2 long" : "cw-tn2", CW.NAMES[j]));
        var pr = el("div", "cw-tp", K.chf(CW.PROFIT[j]));
        t.appendChild(pr);
        var tag = el("div", "cw-ttag", "HABIT");

        P.tiles.push({ el: t, pr: pr, tag: tag });
      }
      root.appendChild(shelf);
    },
    beat: function (k, api) {
      var P = this.parts, go = K.live(api, k);
      K.say(P.lead, L100[k], api);
      P.tiles.forEach(function (t, j) {
        var hab = HAB.indexOf(j) >= 0;
        api.show(t.pr, k >= 1, K.opt(go && k === 1, 300 + 40 * j));
        api.show(t.tag, k >= 2 && hab, K.opt(go && k === 2, 600));
        t.el.classList.toggle("hab", k >= 2 && hab);
        t.el.classList.toggle("muted", k >= 3 && hab);
        t.el.classList.toggle("cand", k >= 3 && !hab);
      });
    },
  });

  /* 102. The state: the habits as 24 numbers; the habits' profits, made every week. */
  var HSUM = sumOf(HAB);
  var L102 = [
    "The state \\(s\\): the household's habits as 24 numbers, 1 for a product it buys every week, 0 for the others.",
    "Every week the household buys its habits, and the supermarket makes their profits: CHF " + OB.num(HSUM, 2) + " a week.",
  ];
  OB.scene({
    key: "state", order: 102, title: "The state", beats: L102.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      var box = el("div", "cw-st");
      P.tab = stateTab(HH.basket);
      box.appendChild(P.tab.el);
      var sb = P.sum = el("div", "ob-box cw-stsum");
      sb.appendChild(el("div", "cw-boxh", "THE HABITS, EVERY WEEK"));
      var f = el("div", "cw-stf");
      P.terms = HAB.map(function (j, i) {
        if (i) f.appendChild(OB.html("span", "cw-stop", OB.tex("+")));
        var tm = OB.html("span", "cw-stt", OB.tex(OB.num(CW.PROFIT[j], 2)));
        f.appendChild(tm);
        return tm;
      });
      var res = el("span", "cw-pyres");
      res.appendChild(OB.html("span", "cw-stop", OB.tex("=")));
      res.appendChild(el("span", "cw-rnum cw-sttot", OB.num(HSUM, 2)));
      res.appendChild(el("span", "cw-gunit", "CHF"));
      P.res = res;
      f.appendChild(res);
      sb.appendChild(f);
      box.appendChild(sb);
      root.appendChild(box);
    },
    beat: function (k, api) {
      var P = this.parts, go = K.live(api, k), fly = go && k === 1, n = HAB.length;
      K.say(P.lead, L102[k], api);
      P.tab.cols.forEach(function (c, j) {
        api.show(c.pn, k >= 1, K.opt(fly, 200 + 25 * j));
        c.p.classList.toggle("lit", k >= 1 && !!HH.basket[j]);
      });
      P.tab.blocks.forEach(function (b) { api.show(b.pl, k >= 1, K.opt(fly, 200)); });
      api.show(P.sum, k >= 1, K.opt(fly, 900));
      /* Each habit's profit flies from the table into the sum. */
      P.terms.forEach(function (tm, i) {
        if (k < 1) { tm.classList.add("ob-hide"); tm.style.visibility = ""; return; }
        if (fly) { tm.classList.add("ob-hide"); api.fly(P.tab.cols[HAB[i]].pn, tm, { delay: 1300 + 350 * i, dur: 1200 }); }
        else { tm.classList.remove("ob-hide"); tm.style.visibility = ""; }
      });
      P.sum.querySelectorAll(".cw-stop").forEach(function (e, i) {
        api.show(e, k >= 1, K.opt(fly, i < n - 1 ? 1300 + 350 * (i + 1) + 600 : 1300 + 350 * n + 900));
      });
      api.show(P.res, k >= 1, K.opt(fly, 1300 + 350 * n + 900));
    },
  });

  /* 104. What a coupon does: the action and its three outcomes. The coupon of the example is week 1's, tiramisu. */
  var pA = OB.num(CW.PROFIT[A1], 2);
  var L104 = [
    "The action: a coupon for a product with 0 in the state, here " + K.name(A1) + ". The supermarket makes CHF " + pA + " on one " + K.name(A1) + ".",
    "Ignored: the household does not buy " + K.name(A1) + ". The reward gets nothing, and the state stays the same.",
    "Used: the household buys one " + K.name(A1) + " with CHF 3 off. The supermarket makes \\(" + partTex(A1) + "\\) on it. The state stays the same.",
    "Habit: used, and from next week on the household buys " + K.name(A1) + " every week. Its 0 in the state turns to 1.",
    "Which of the three happens is random. A product that fits the household's taste is used more often, and more often becomes a habit. The app does not see the taste.",
  ];
  OB.scene({
    key: "outcomes", order: 104, title: "What a coupon does", beats: L104.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      var box = el("div", "cw-oc");
      var left = el("div", "cw-ocl");
      left.appendChild(K.ticket(A1, "big", true));
      var now = el("div", "ob-box cw-ocnow");
      now.appendChild(el("div", "cw-boxh", "IN THE STATE NOW"));
      now.appendChild(OB.html("div", "cw-ocs", "<i>" + CW.ICONS[A1] + "</i><b>0</b>"));
      left.appendChild(now);
      box.appendChild(left);

      /* The table: a column per outcome, a row per effect. */
      var wrap = el("div", "cw-ocw ob-hscroll"), g = el("div", "cw-octab");
      var stateCell = function (v) { return "<span class=\"cw-ocs\"><i>" + CW.ICONS[A1] + "</i><b" + (v ? " class=\"hab\"" : "") + ">" + v + "</b></span>"; };
      var used = "<span class=\"cw-ocf\">" + OB.tex(OB.num(CW.PROFIT[A1], 2) + " - 3") + "</span><span class=\"cw-ocf\">" + OB.tex("= " + OB.num(part(A1), 2)) + "</span>";
      var ROWS = [
        { h: "THE HOUSEHOLD", cls: "w", v: ["does not buy it", "buys one", "buys one, then one every week"] },

        { h: "NEXT WEEK'S STATE", cls: "s", v: [stateCell(0), stateCell(0), stateCell(1)] },
        { h: "ADDED TO EVERY LATER REWARD", cls: "p", v: ["0", "0", pA] },
      ];
      P.cols = [[], [], []];
      g.appendChild(el("div", "cw-ocr top", ""));
      P.heads = OUT.map(function (o, i) {
        var h = el("div", "cw-och");
        h.appendChild(el("span", "cw-qout o" + i, o));

      });
