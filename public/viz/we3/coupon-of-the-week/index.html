    "\\(z = s W\\): add up the rows of \\(W\\) of the " + H1.length + " habits, one column at a time. Guess, then press Compute.",
    "The household's two numbers: \\(z_1 = " + K.n2(Z[0]) + "\\) and \\(z_2 = " + K.n2(Z[1]) + "\\). Its 24 numbers became two: its representation.",
    "The household as a point on a map: \\(z_1\\) across, \\(z_2\\) up.",
    "The " + OB.num(D.NHH, 0) + " households of an update, each a point: the two numbers of its week 1, under the starting weights \\(W\\).",
    "\\(E\\) needs only 2 rows now, one per number of \\(z\\): each coupon \\(a\\) has two numbers, its column \\(e_a\\), picked at random to start.",
    "The preference for " + NM + ": the inner product of \\(z\\) and \\(e_a\\), as in weekend 2. Guess, then press Compute.",
    "The preference for " + NM + ": " + K.n2(th1) + ".",
    "\\(\\theta = z E\\): the preferences of the " + NC + " coupons. The habits get none: they get no coupon.",
    "The numbers to learn: " + NW + " in \\(W\\) and " + NE2 + " in \\(E\\), " + (NW + NE2) + " in all, in place of the " + OB.num(N24 * N24, 0) + " of \\(E\\) alone.",
  ];
  var L2 = 6, C2_ARROWS = ["c2-z", "c2-e"];
  /* Beat 6 with motion: layer 1 fades (FADE ms), z glides (GLIDE ms), then E builds from BUILD ms. */
  var FADE = 700, GLIDE = 1600, BUILD = FADE + GLIDE + 200;

  /* Layer 1 at beats 0 to 5. */
  function beat1(P, k, api, go, H) {
    var X = P.X, M = X.M, N = N24, m1 = go && k === 1;
    // Scene 210's cross: E, its coupons' icons, its name and its count at beat 0 (beat 1 closes them into W); the
    // preferences, their caption and 210's rings never (they leave with 210's copy); the rings of beat 0.
    X.rows.forEach(function (r) { r.style.gridTemplateColumns = ""; r.classList.remove("cw-ex-fade"); });
    bare(X.rows.concat([X.icr, X.name, X.cnt]), k === 0 || m1);
    bare([X.thr, X.capT, X.colRing, X.rowRing], false);
    bare([X.sRing, X.icRing], k === 0 || m1);
    bare([X.key, X.S.el], true);
    X.S.el.style.visibility = "";
    // The state of week 1; at beat 0 with motion, tiramisu's 1 of week 2 (210's last frame) goes back to 0.
    var flip = go && k === 0;
    for (var i = 0; i < N; i++) {
      var on = S1[i] || (flip && i === A1) ? 1 : 0;
      X.sn[i].textContent = String(on);
      X.s[i].classList.toggle("lit", !!on);
      X.ric[i].classList.toggle("lit", !!on);
    }
    // W from beat 1, its habits' rows lit from beat 2.
    bare(X.wrows.concat(X.wh, [X.nameW]), k >= 1);
    X.w.forEach(function (row, j) { row.forEach(function (c) { c.classList.toggle("lit", k >= 2 && H1.indexOf(j) >= 0); }); });
    // z and the box of its two inner products from beat 2, z's numbers from beat 3.
    bare([X.zr, X.capZ], k >= 2);
    X.z.forEach(function (z, c) { z.n.textContent = k >= 3 ? K.n2(Z[c]) : "?"; z.x.classList.toggle("lit", k >= 3); z.x.style.visibility = ""; });
    api.show(P.fz, k === 2 || k === 3, K.opt(go && k === 2, 900));
    P.zres.forEach(function (r, c) { r.textContent = k >= 3 ? K.n2(Z[c]) : "?"; r.classList.toggle("done", k >= 3); });
    if (k === 2) api.nextLabel("Compute");
    // The map from beat 4, the households from beat 5.
    bare([M.el, M.lx, M.ly, M.gx, M.gy, M.pt], k >= 4);
    M.lx.style.visibility = "";
    M.ly.style.visibility = "";
    bare([M.dots], k >= 5);
    M.dot.forEach(function (c) { c.style.opacity = ""; });
    if (X.scrolls()) { if (k >= 4) X.focusMap(go && k === 4 ? api : null); else X.el.scrollLeft = 0; }

    if (go && k === 0) {
      if (H) handIn220(P, H, api);
      api.at(900, function () { X.sn[A1].textContent = "0"; X.s[A1].classList.remove("lit"); X.ric[A1].classList.remove("lit"); bump(X.s[A1]); });
      grow(api, X.sRing, 1500, 600);
      grow(api, X.icRing, 1700, 600);
    }
    if (m1) {
      api.fade(X.sRing, false, { dur: 300 });
      api.fade(X.icRing, false, { dur: 300 });
      morph(X, api);
    }
    if (go && k === 2) { grow(api, X.zr, 300); grow(api, X.capZ, 450); }
    // 3, Compute: the lit numbers of each column of W fly down into its number of z, which adds them up.
    if (go && k === 3) {
      X.z.forEach(function (z, c) {
        z.x.classList.remove("lit");
        z.n.textContent = "0.00";
        P.zres[c].textContent = "?";
        P.zres[c].classList.remove("done");
        var sum = 0;
        H1.forEach(function (j, h) {
          var d = 250 + 520 * h + 260 * c;
          sum += IW[c][j];
          var part = sum;
          api.fly(X.wn[j][c], z.pad, { delay: d, arc: 30 });
          api.at(d + OB.DUR.fly, function () { z.n.textContent = K.n2(part); bump(z.n); });
        });
        api.at(250 + 520 * (H1.length - 1) + 260 * c + OB.DUR.fly + 250, function () {
          z.x.classList.add("lit");
          P.zres[c].textContent = K.n2(Z[c]);
          P.zres[c].classList.add("done");
          bump(P.zres[c]);
        });
      });
    }
    // 4: the box goes; the map comes; z1 and z2 fly onto its axes; the guides, then the household's point.
    if (go && k === 4) {
      P.fz.classList.remove("ob-hide");
      api.fade(P.fz, false, { dur: 500 });
      grow(api, M.el, 300, 700);
      K.copyTo(api, X.z[0].n, M.lx, 1000, 1200);
      K.copyTo(api, X.z[1].n, M.ly, 1450, 1200);
      grow(api, M.gx, 2750, 500);
      grow(api, M.gy, 2750, 500);
      grow(api, M.pt, 3000, 500);
    }
    // 5: the 1,000 households come in, slowly, then faster.
    if (go && k === 5) {
      var n = M.dot.length, shown = 0;
      M.dot.forEach(function (c) { c.style.opacity = "0"; });
      api.at(300, function () {
        api.animate(2600, function (p) { var m = Math.round(p * p * n); for (; shown < m; shown++) M.dot[shown].style.opacity = ""; },
          function () { for (; shown < n; shown++) M.dot[shown].style.opacity = ""; });
      });
    }
  }

  /* Layer 2 at beats 6 to 10 (k here 0 to 4). With motion at k = 0, z's label and heads come as z glides, and E builds
     after the glide (from BUILD ms). */
  function beat2(P, k, api, go) {
    var Y = P.Y, N = N24, d = go && k === 0 ? BUILD : 200;
    bare(Y.zEls, true);
    bare(Y.eEls, true);
    bare(Y.p.concat([Y.plab]), false);
    if (go && k === 0) {
      grow(api, Y.zlab, FADE);
      Y.zh.forEach(function (h, c) { grow(api, h, FADE + 150 * c); });
      grow(api, Y.elab, d);
      Y.eh.forEach(function (h, c) { grow(api, h, d + 150 * c); });
      for (var a = 0; a < N; a++) { grow(api, Y.ic[a], d + 100 + 45 * a); grow(api, Y.e[0][a], d + 140 + 45 * a); grow(api, Y.e[1][a], d + 180 + 45 * a); }
    }
    if (k === 0) Y.el.scrollLeft = 0;
    // theta: tiramisu alone at k 1 and 2 (its value from k 2), all of them from k 3.
    Y.th.forEach(function (c, a) { c.classList.toggle("ob-hide", !(k >= 3 || (k >= 1 && a === A1))); c.style.opacity = ""; });
    Y.thlab.classList.toggle("ob-hide", k < 1);
    Y.thn[A1].textContent = k >= 2 ? K.n2(th1) : "?";
    var lit = k >= 1 && k <= 2;
    // z stays lit from layer 1 until the preferences of all coupons.
    Y.z.forEach(function (z) { z.x.classList.toggle("lit", k <= 2); });
    Y.e[0][A1].classList.toggle("lit", lit);
    Y.e[1][A1].classList.toggle("lit", lit);
    Y.ic[A1].classList.toggle("lit", lit);
    Y.th[A1].classList.toggle("lit", k >= 1);
    if (go && k === 1) grow(api, Y.th[A1], 300);
    if (k === 1 || k === 2) Y.focus(A1);
    // The arrows of tiramisu's preference: z straight right into it, its column of E straight down into it.
    if (lit && !Y.scrolls()) {
      var o = function (dl, from, to) { var a = { from: from, to: to, gap: 3, head: 11 }; if (go && k === 1) a.delay = dl; else a.dur = 1; return a; };
      api.arrow("c2-z", Y.z[1].x, Y.th[A1], o(500, "right", "left"));
      api.arrow("c2-e", Y.e[1][A1], Y.th[A1], o(700, "bottom", "top"));
    } else C2_ARROWS.forEach(function (id) { api.unarrow(id); });
    // The box of tiramisu's preference at k 1 to 3; the count of the numbers to learn at k 4, in its place.
    api.show(P.f, k >= 1 && k <= 3, K.opt(go && k === 1, 900));
    if (k === 1) api.nextLabel("Compute");
    P.res.textContent = k >= 2 ? K.n2(th1) : "?";
    P.res.classList.toggle("done", k >= 2);
    if (go && k === 2) api.fly(P.res, Y.thn[A1], { delay: 300 });
    if (go && k === 3) Y.th.forEach(function (c, a) { if (a !== A1) grow(api, c, 200 + 50 * a); });
    var S = P.S2;
    S.el.style.visibility = "";
    [S.wL, S.wN].forEach(function (e) { e.classList.toggle("ob-gone", k < 4); e.style.visibility = ""; });
    bare([P.cnt], k >= 4);
    room(P);
    if (go && k === 4) {
      P.f.classList.remove("ob-hide");
      api.fade(P.f, false, { dur: 400 });
      grow(api, P.cnt, 450, 700);
      grow(api, S.wL, 1400, 600);
      K.copyTo(api, P.cntR, S.wN, 1400, 1300);
    }
  }

  OB.scene({
    key: "household", order: 220, title: "Two numbers per household", beats: L220.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      var pol = el("div", "cw-pol");
      P.L1 = el("div", "cw-ex-stage cw-pol1");
      P.X = crossW();
      P.L1.appendChild(P.X.el);
      P.fz = boxZ(P);
      P.L1.appendChild(P.fz);
      pol.appendChild(P.L1);
      P.two = layer2(P);
      pol.appendChild(P.two);
      root.appendChild(pol);
    },
    beat: function (k, api) {
      var P = this.parts, X = P.X, Y = P.Y, go = K.live(api, k);
      var H = k === 0 ? K.handIn(api, "e-alone", 2600) : null;
      K.say(P.lead, L220[k], H ? null : api);
      K.title(P.lead, k < L2 ? "Two numbers per household" : "Two numbers per product", api);
      P.L1.classList.remove("cw-going");
      P.L1.classList.toggle("ob-hide", k >= L2);
      P.two.classList.toggle("ob-hide", k < L2);
      if (k < L2) {
        C2_ARROWS.forEach(function (id) { api.unarrow(id); });
        beat1(P, k, api, go, H);
        return;
      }
      beat2(P, k - L2, api, go);
      if (!(go && k === L2)) return;
      /* The change of view: layer 1 stays while all of it but z fades (CSS, cw-going); the numbers to learn glide under
         cross 2; z glides to its place on the left of cross 2, still lit; layer 1 goes once z leaves. */
      P.L1.classList.remove("ob-hide");
      P.L1.classList.add("cw-going");
      K.glide(api, X.S.el, P.S2.el, { dur: 1400 });
      X.z.forEach(function (z, c) { api.fly(z.x, Y.z[c].x, { delay: FADE, dur: GLIDE, arc: 40 }); });
      api.at(FADE + 40, function () {
        P.L1.classList.add("ob-hide");
        P.L1.classList.remove("cw-going");
      });
    },
  });

  /* 240. From preferences to probabilities: cross 2 with the probabilities under theta. */
  var best = 0;
  POL1.p.forEach(function (q, a) { if (q > POL1.p[best]) best = a; });
  var L240 = [
    "Softmax turns the preferences of the " + NC + " coupons into probabilities \\(\\pi(a \\mid s)\\), as for Old Bessie.",
    "The higher the preference, the higher the probability. The " + NC + " probabilities add up to 1.",
  ];
  OB.scene({
    key: "probabilities", order: 240, title: "From preferences to probabilities", beats: L240.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      P.Y = cross2(W1.s, POL1);
      root.appendChild(P.Y.el);
      P.sum = el("div", "cw-psum cw-c2-sum", "SUM OF THE " + NC + " PROBABILITIES: 1.00");
      root.appendChild(P.sum);
    },
    beat: function (k, api) {
      var P = this.parts, Y = P.Y, go = K.live(api, k);
      K.say(P.lead, L240[k], api);
      bare(Y.zEls.concat(Y.eEls, Y.th, [Y.thlab], Y.p, [Y.plab]), true);
      Y.e.forEach(function (row) { row.forEach(function (c) { c.classList.add("mute"); }); });
      Y.th.forEach(function (c) { c.classList.remove("lit"); });
      if (go && k === 0) {
        grow(api, Y.plab, 300);
        Y.p.forEach(function (c, a) {
          grow(api, c, 300 + 50 * a, 800);
          if (Y.hab.indexOf(a) >= 0) return;
          var bar = Y.bars[a], w = bar.style.width;
          bar.style.width = "0";
          api.at(300 + 50 * (a + 1), function () { api.animate(1200, function (p) { bar.style.width = (parseFloat(w) * p).toFixed(1) + "%"; }, function () { bar.style.width = w; }); });
        });
      }
      api.show(P.sum, k >= 1, K.opt(go && k === 1, 300));
      Y.p[best].classList.toggle("ring", k >= 1);
      Y.th[best].classList.toggle("ring", k >= 1);
      if (k >= 1) Y.focus(best);
    },
  });

  /* 250. The roulette. */
  var L250 = [
    "The roulette: one slice per coupon, as wide as its probability. Press Spin.",
    "The roulette samples this week's coupon: " + K.name(A1) + ", whose probability is " + K.n2(POL1.p[A1]) + ".",
    "Week 2 starts from a new state: " + K.name(A1) + " is a habit now. New numbers \\(z\\), new preferences, new probabilities.",
  ];
  OB.scene({
    key: "roulette", order: 250, title: "The roulette", beats: L250.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      P.T = K.Table([{ key: "ic", kind: "icon" }, { key: "p", label: "\\(\\pi(a \\mid s)\\)", kind: "prob" }], {});
      root.appendChild(P.T.el);
      var row = el("div", "cw-roulrow");
      P.Wh = K.Wheel(270);
      row.appendChild(P.Wh.el);
      P.ticket = K.ticket(A1, "big");
      row.appendChild(P.ticket);
      root.appendChild(row);
    },
    beat: function (k, api) {
      var P = this.parts, T = P.T, go = K.live(api, k), pol = k >= 2 ? POL2 : POL1, st = k >= 2 ? W2.s : W1.s;
      K.say(P.lead, L250[k], api);
      T.set("p", pol.p.map(function (q, a) { return st[a] ? null : q; }), K.n2);
      var hab = [];
      st.forEach(function (b, j) { if (b) hab.push(j); });
      T.cls("ic", hab, "habit");
      T.cls("p", k === 1 ? [A1] : [], "ring");
      P.Wh.set(pol.p);
      if (k === 1) {
        if (go) { P.Wh.turn(0); P.Wh.spin(W1.u, api, { delay: 200, dur: 3600 }); } else P.Wh.rest(W1.u);
        P.Wh.lit(A1);
      } else { P.Wh.turn(0); P.Wh.lit(-1); }
      api.show(P.ticket, k === 1, K.opt(go && k === 1, 3900));
      if (k !== 1) P.ticket.classList.add("ob-hide");
      if (go && k === 1 && OB.fx && OB.fx.burst) api.at(3900, function () { OB.fx.burst(P.ticket, "sparkle"); });
      if (k === 0) api.nextLabel("Spin");
    },
  });
})();
</script>
<script>/* cw-3proto.js */
/* cw-3proto.js: proto-REINFORCE, scenes 300 to 399 of "Coupon of the Week" (main session, 2026-11-18), in the form
   of Old Bessie page 3 (its scenes 310, 320, 360 and 370, sec3c.js and sec3d.js).

   300 card "Learning W and E"
   310 The forward pass (5 beats): the 96 weights picked at random; the policy picks the coupons of 1,000 households
       for 12 weeks (ten drawn, a stack for the rest); each household's return G1 and their histogram; the average
       return; the loop back to the weights
   320 The backward pass, the triangle of the hop, the update, update 2 (19 beats, one scene since 2026-11-19; scenes
       360, 370 and 380 before). Beats 0 to 4: one weight picked at random (the first number of fresh pasta in E);
       Before; the hop +0.2, After; the same 1,000 households again, with the same luck: the average return After;
       the four boxes. Beat 5, the flow: the rest fades, the strip glides, the four numbers fly from the boxes into a
       table and on to the chart's axes, the two points. Beats 6 to 9: across 0.2; up 0.10; nabla, guessed, then
       computed. Beat 10, the flow: the chart, the table and nabla fade while the strip glides, the weight 0.70 flies
       into its box, 52.48 into the box Before the update and nabla's 0.5 into the update; w = w + alpha nabla with
       alpha = 0.5. Beats 11 to 14: the new weight, guessed, then computed, flies into its place; the average return
       after the update, guessed, then shown. Beat 15, the flow: the update and the box Before fade, a weight of W is
       picked at random (the first number of carrots in W) and takes the weight's box. Beats 16 to 18: its hop (52.63
       flies from the box After the update into the table), a slope below 0, the weight goes down; the loop of every
       update. The head follows the part (K.title): "The backward pass", "The triangle of the hop", "The update",
       "Update 2"

   Every number comes from coupon-data.js through OB.cw.round(i); the households are played here on the guided luck
   (OB.cw.guided()), and their averages are checked against the data when the scenes are built. */
(function () {
  "use strict";
  var OB = window.OB, CW = window.CW, D = window.CWD, K = OB.cw, el = OB.el;
  if (!K || !K.round) { console.error("cw-3proto: cw-0kit.js is missing"); return; }

  var R1 = K.round(1), R2 = K.round(2);
  var HOPS = OB.num(D.HOP, 1), ALPHAS = OB.num(D.ALPHA, 1);
  /* A slope as the scenes write it: two decimals, without a last 0 (0.5, -0.05). */
  var nab = function (x) { var s = K.n2(x); return /\.\d0$/.test(s) ? s.slice(0, -1) : s; };
  /* The symbol of weight k with the punctuation after it, on one line. */
  var ws = function (k, p) { return "<span class=\"cw-nw\">" + K.wsym(k) + (p || "") + "</span>"; };
  var ORD = ["first", "second"];
  var where = function (r) { return r.w.m === "W" ? "the " + ORD[r.w.r] + " number of " + K.name(r.w.c) + " in \\(W\\)" : "the " + ORD[r.w.c] + " number of " + K.name(r.w.r) + " in \\(E\\)"; };

  /* The households of round 1, played once: before the hop, after it, after the update; and how many households
     get other coupons after the hop. */
  var M = null;
  function mem() {
    if (M) return M;
    var L = K.guided();
    var S0 = K.copy(K.weightsAt(0)), SH = K.copy(S0), S1 = K.copy(K.weightsAt(1));
    CW.setW(SH.W, SH.E, R1.w, R1.vh);
    M = { S0: S0, SH: SH, S1: S1, P0: K.play(S0.W, S0.E, L), PH: K.play(SH.W, SH.E, L), PU: K.play(S1.W, S1.E, L) };
    [["P0", R1.before], ["PH", R1.after], ["PU", R1.upd]].forEach(function (c) {
      if (K.n2(M[c[0]].avg) !== K.n2(c[1])) console.error("cw-3proto: the average of " + c[0] + " is " + M[c[0]].avg + ", the data say " + c[1]);
    });
    var n = 0;
    for (var i = 0; i < L.n; i++) {
      var a = CW.playEpisode(S0.W, S0.E, L, i, true).weeks, b = CW.playEpisode(SH.W, SH.E, L, i, true).weeks;
      for (var t = 0; t < a.length; t++) if (a[t].a !== b[t].a) { n++; break; }
    }
    M.nOther = n;
    return M;
  }
  K.mem = mem;

  /* The arrows of the diagram: the ones listed are drawn (with motion when their entry has a delay), the others go. */
  function arrows(api, list) {
    var ids = {};
    list.forEach(function (a) { ids[a[0]] = true; api.arrow(a[0], a[1], a[2], a[3] || {}); });
    ["pol", "m2h", "h2a", "hop", "w2a"].forEach(function (id) { if (!ids[id]) api.unarrow(id); });
  }
  function dia(root) {
    var m = mem(), d = K.Dia();
    root.appendChild(d.el);
    d.S.set(m.S0.W, m.S0.E);
    d.M.set(m.P0);
    d.H.draw(d.H.heights(m.P0.G));
    d.H.markAt(R1.before);
    d.ab.setAvg(R1.before);
    d.aa.setAvg(R1.after);
    [d.wb, d.wa].forEach(function (b) { b.chip.innerHTML = K.wsym(R1.k); b.chip.classList.add("w"); });
    d.wb.set(K.wf(R1.v));
    d.wa.set(K.wf(R1.vh));
    return d;
  }

  /* 300. The card. */
  OB.scene({
    key: "proto-card", order: 300, title: "proto-REINFORCE",
    card: { kicker: "PROTO-REINFORCE", title: "Learning W and\u00a0E", line: "The 96 weights of W and E, picked at random, then changed one at a time, as for Old Bessie.", van: false },
    build: function (root) {
      var road = root.querySelector(".road");
      if (!road) return;
      var s = K.Strip();
      s.set(D.init.W, D.init.E);
      s.cap.remove();
      s.el.classList.add("cw-cardstrip", "drive");
      road.appendChild(s.el);
    }
  });

  /* 310. The forward pass. */
  var L310 = [
    "proto-REINFORCE starts from the 96 weights of \\(W\\) and \\(E\\), picked at random.",
    "The policy picks the coupons of \\(n = 1{,}000\\) households, 12 weeks each.",
    "Each household's quarter has its return \\(G_1\\).",
    "Their average, the average return: \\(\\bar{G}_1 = " + K.n2(R1.before) + "\\) CHF.",
    "Change the weights to raise this number."

  /* The close-up: a table of Before and After, each number in a span (the target of its flight), and the chart of

  function closeTable(r) {

    line({ x1: CX0, y1: CY0 + CYH, x2: CX0 + CXW + 24, y2: CY0 + CYH, "class": "cw-cax" });

     (beats 15 to 18) follow in the same scene, in a third layer of the cell (upView() below). */
  var TRI = 5, UPD = 10, UP2 = 15, TITLES = ["The backward pass", "The triangle of the hop", "The update", "Update 2"];
  var L320 = [
    "Which weight should change? One of the 96, picked at random: " + ws(R1.k, ",") + " " + where(R1) + ".",

    "The update adds \\(\\alpha \\nabla\\) to the weight. \\(\\alpha = " + ALPHAS + "\\) is the step size.",

  /* The strip glides (K.glide); a number moves, its place emptying (K.move), or flies as a copy (K.copyTo). */

  /* Beat 5 reached with Next: the households, the histogram and the arrows fade; the strip glides to the close-up;

  /* Beats 5 to 9 (k from 0): the triangle. */

     2 s. */
  function flowUp1(P, api) {
    var U = P.U, C = P.C;
    P.f.innerHTML = nablaTex(R1, true);
    U.el.classList.remove("ob-hide", "ob-gone");
    [U.wbox.el, U.f, U.ab.el].forEach(function (e) { e.classList.add("ob-hide"); e.style.opacity = ""; });
    move(api, P.tn[0], U.wbox.num, 100, 1200);
    move(api, P.tn[2], U.ab.num, 250, 1200);
    move(api, P.f.querySelector(".cw-nres"), U.nab, 400, 1200);
    api.fade(C.svg, false, { dur: 600 });
    api.fade(P.t, false, { delay: 300, dur: 450 });
    api.fade(P.f, false, { delay: 550, dur: 450 });
    glide(api, P.S.el, U.S.el, { delay: 150, dur: 1000 });
    api.show(U.f, true, { delay: 600, dur: 500 });
    api.show(U.wbox.el, true, { delay: 800, dur: 450 });
    api.show(U.ab.el, true, { delay: 1000, dur: 450 });
    api.at(2000, function () { P.row.classList.add(K.phone() ? "ob-gone" : "ob-hide"); });
  }

  /* Beat 15 reached with Next: the arrow, the update and the box Before the update fade; the box After the update stays,
     since update 2 starts from its 52.63; the mark runs over the strip and stops on the weight of update 2, whose
     symbol and value take the weight's box. About 2.9 s. */
  function flowUp2(P, api) {
    var U = P.U, sec = P.lead.closest("section.scene"), q = P.seq2;
    if (sec) sec.querySelectorAll("svg.ob-arrow, .ob-arrow-label").forEach(function (a) { a.style.transition = "opacity 0.5s"; a.style.opacity = "0"; });
    api.at(550, function () { api.unarrow("u"); });
    api.fade(U.f, false, { dur: 500 });
    api.fade(U.ab.el, false, { dur: 500 });
    U.S.mark(q[0]);
    api.animate(2400, function (p) { U.S.mark(q[Math.min(q.length - 1, Math.floor(p * q.length))]); }, function () { U.S.mark(R2.k); });
    // The weight's box: the weight of update 1 fades as the mark slows down, the new one comes as it stops (one
    // motion after the other, so an early end of the beat cannot leave the box empty).
    var wb = [U.wbox.chip, U.wbox.num];
    api.at(2000, function () {
      api.animate(400, function (p) { wb.forEach(function (e) { e.style.opacity = String(1 - p); }); }, function () {
        U.wbox.chip.innerHTML = K.wsym(R2.k);
        U.wbox.set(K.wf(R2.v));
        api.animate(500, function (p) { wb.forEach(function (e) { e.style.opacity = String(p); }); }, function () { wb.forEach(function (e) { e.style.opacity = ""; }); });
      });
    });
  }

  /* Beats 10 to 14 (k from 0): the update. */
  function u1Beat(P, k, api, go) {
    var U = P.U, m = mem();
    P.d.loopOn(false);
    arrows(api, []);
    if (go && k === 0) flowUp1(P, api);
    else {
      layer(P, 3);
      [U.S.el, U.wbox.num, U.ab.num, U.nab].forEach(function (e) { e.style.visibility = ""; });
      [U.wbox.el, U.f].forEach(function (e) { e.classList.remove("ob-hide"); e.style.opacity = ""; });
      api.show(U.ab.el, true);
    }
    [U.wbox.chip, U.wbox.num].forEach(function (e) { e.classList.remove("ob-hide"); e.style.opacity = ""; });
    U.wbox.chip.innerHTML = K.wsym(R1.k);
    [U.t2, U.n2, U.u2, U.loop].forEach(function (e) { api.show(e, false); });
    U.S.set(m.S0.W, m.S0.E);
    U.S.mark(R1.k);
    // 1: the numbers in the formula, the result to guess. 2: the result, which flies into its place.
    api.show(U.line, k >= 1, K.opt(go && k === 1, 300));
    U.res.textContent = k >= 2 ? K.wf(R1.vNew) : "?";
    U.res.classList.toggle("done", k >= 2);
    if (k === 1) api.nextLabel("Compute");
    var setW = function (v) { U.wbox.set(K.wf(v)); U.S.setOne(R1.k, v); };
    if (go && k === 2) {
      setW(R1.v);
      if (OB.fx && OB.fx.bump) OB.fx.bump(U.res, 0.3, 500);
      K.flyKeep(api, U.res, U.wbox.num, { delay: 900, land: function () { setW(R1.vNew); } });
    } else setW(k >= 2 ? R1.vNew : R1.v);
    U.wbox.el.classList.toggle("cw-lit", k === 2);
    // 3: the average return after the update, to guess. 4: the answer.
    api.show(U.aa.el, k >= 3, K.opt(go && k === 3, 700));
    if (k === 3) { U.aa.num.textContent = "?"; api.nextLabel("Compute"); }
    else {
      U.aa.setAvg(R1.upd);
      if (go && k === 4) {
        api.roll(U.aa.num, R1.upd, { from: R1.before, fmt: K.n2, delay: 200 });
        if (OB.fx && OB.fx.celebrate && R1.upd > R1.before) api.at(200 + OB.DUR.roll, function () { OB.fx.celebrate(U.aa.el); });
      }
    }
    U.aa.el.classList.toggle("cw-lit", k >= 4);
    if (k >= 3) api.arrow("u", U.ab.el, U.aa.el, { delay: go && k === 3 ? 700 : 0, dur: go && k === 3 ? undefined : 1 });
    else api.unarrow("u");
  }

  /* Beats 15 to 18 (k from 0): update 2, on the weights after update 1. */
  function u2Beat(P, k, api, go) {
    var U = P.U, m = mem();
    P.d.loopOn(false);
    arrows(api, []);
    U.S.set(m.S1.W, m.S1.E);
    if (go && k === 0) flowUp2(P, api);
    else {
      layer(P, 3);
      api.unarrow("u");
      [U.S.el, U.wbox.num, U.aa.num].forEach(function (e) { e.style.visibility = ""; });
      [U.wbox.el, U.wbox.chip, U.wbox.num].forEach(function (e) { e.classList.remove("ob-hide"); e.style.opacity = ""; });
      U.wbox.chip.innerHTML = K.wsym(R2.k);
      U.S.mark(R2.k);
      [U.f, U.ab.el].forEach(function (e) { api.show(e, false); });
    }
    U.aa.setAvg(R1.upd);
    U.aa.el.classList.remove("cw-lit");
    // 2: the new weight flies from the update into its place.
    var setW = function (v) { U.wbox.set(K.wf(v)); U.S.setOne(R2.k, v); };
    if (go && k === 2) {
      setW(R2.v);
      K.flyKeep(api, U.res2, U.wbox.num, { delay: 2200, land: function () { setW(R2.vNew); } });
    } else if (!(go && k === 0)) setW(k >= 2 ? R2.vNew : R2.v);
    U.wbox.el.classList.toggle("cw-lit", k === 2);
    // 1: the table of update 2's hop. Its Before: the weight's 0.30 from its box, and 52.63, the average return after
    // update 1, from the box After the update, which then fades; its After comes once they have landed.
    if (go && k === 1) {
      api.show(U.t2, true, { delay: 200, dur: 500 });
      copyTo(api, U.wbox.num, U.tn2[0], 700, 1100);
      move(api, U.aa.num, U.tn2[2], 850, 1100);
      api.fade(U.aa.el, false, { delay: 1050, dur: 500 });
      [[1, 2100], [3, 2350]].forEach(function (c) {
        var e = U.tn2[c[0]];
        e.style.visibility = "hidden";
        api.at(c[1], function () { e.style.visibility = ""; if (OB.fx && OB.fx.bump) OB.fx.bump(e, 0.25, 420); });
      });
    } else {
      api.show(U.t2, k >= 1);
      U.tn2.forEach(function (e) { e.style.visibility = ""; });
      api.show(U.aa.el, k === 0);
    }
    api.show(U.n2, k >= 2, K.opt(go && k === 2, 300));
    api.show(U.u2, k >= 2, K.opt(go && k === 2, 900));
    api.show(U.loop, k >= 3, K.opt(go && k === 3, 300));
  }

  OB.scene({
    key: "proto-backward", order: 320, title: TITLES[0], beats: L320.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {}, m = mem();
      P.lead = K.lead(root);
      var st = el("div", "cw-bt");
      root.appendChild(st);
      P.d = dia(st);
      P.d.el.classList.add("cw-bt1");
      P.d.ab.head.classList.remove("ob-gone");
      P.d.ab.head.textContent = "BEFORE";
      // The pick: fifteen weights light in turn, the last one the weight of round 1.
      var seq = [], r = CW.rng(3201);
      for (var i = 0; i < 14; i++) seq.push(Math.floor(r() * 96));
      seq.push(R1.k);
      P.seq = seq;
      // The close-up: the strip and the table on the left, the chart and nabla on the right.
      var row = el("div", "cw-crow cw-bt2 ob-gone"), left = el("div", "cw-ccol"), right = el("div", "cw-ccol");
      P.S = K.Strip();
      P.S.set(m.S0.W, m.S0.E);
      P.S.mark(R1.k);
      P.S.dim(true);
      left.appendChild(P.S.el);
      P.t = closeTable(R1);
      P.tn = [].slice.call(P.t.querySelectorAll(".cw-ctn"));
      left.appendChild(P.t);
      P.C = chart(R1);
      right.appendChild(P.C.svg);
      P.f = OB.html("div", "ob-box cw-nabla", nablaTex(R1, false));
      right.appendChild(P.f);
      row.appendChild(left);
      row.appendChild(right);
      st.appendChild(row);
      P.row = row;
      // The update view, and the pick of update 2: fifteen weights light in turn, the last one the weight of round 2.
      P.U = upView(st);
      var seq2 = [], r2 = CW.rng(3802);
      for (var i2 = 0; i2 < 14; i2++) seq2.push(Math.floor(r2() * 96));
      seq2.push(R2.k);
      P.seq2 = seq2;
    },
    beat: function (k, api) {
      var P = this.parts, go = K.live(api, k);
      K.say(P.lead, L320[k], api);
      K.title(P.lead, TITLES[k < TRI ? 0 : k < UPD ? 1 : k < UP2 ? 2 : 3], api);
      if (k < TRI) backBeat(P, k, api, go);
      else if (k < UPD) triBeat(P, k - TRI, api, go);
      else if (k < UP2) u1Beat(P, k - UPD, api, go);
      else u2Beat(P, k - UP2, api, go);
    },
    /* Left from the last beat: a copy of the view for scene 410, which takes update 2's table into its panel and the
       strip into its diagram (K.handOut; cw-4learn.js, handIn410). */
    leave: function (api) {
      var P = this.parts, U = P && P.U;
      if (!U || api.beat !== L320.length - 1) { K.hand = null; return; }
      var lab = U.t2.querySelectorAll(".cw-ctl");
      K.handOut("proto-backward", api.root, { lead: P.lead, strip: U.S.el, wbox: U.wbox.el, t2: U.t2, sym: lab[0], n0: U.tn2[0],
        n1: U.tn2[1], n2: U.tn2[2], n3: U.tn2[3], nabla: U.n2, upd: U.u2, loop: U.loop });
    }
  });
})();
</script>
<script>/* cw-4learn.js */
/* cw-4learn.js: the learning, scenes 400 to 499 of "Coupon of the Week" (main session, 2026-11-18), in the form of
   Old Bessie page 3's scenes 410 and 420 (02_old_bessie/source/game/sec3c2.js) and 430 (sec3e.js).

   410 The learning curve (3 beats): the whole diagram after update 2 (the 96 weights, update 2's weight marked; the
       panel of update 2: its weight and the average return Before and After the hop, and the triangle of the hop
       (since 2026-11-19 without nabla and the update); the 1,000 households under the weights after it, their
       histogram and average) and the learning curve beside it: across the updates, up the average return after them.
       Its first three points: 52.48 (the weights at random), 52.63 (flies from the panel's Before) and 52.62 (flies
       from the average)
   420 Many updates (2 beats): the movie of updates 3 to 2,000 on the same view, every part set at once at each update,
       faster and faster, with Pause and Again; the end, 69.59
   430 What the app learned (5 beats): the products' two numbers e_a as points on a map, at the start and after 2,000
       updates (the points glide through the updates); coloured by the circle of tastes of coupon.js, which the app
       never sees, beside that circle; the household of the first scenes: its z after learning, an arrow, and its two
       likeliest coupons, the products farthest along the arrow
   440 What we learned (6 beats): one card per Next, the newest lit

   From update 3 on, each update meets 1,000 new households (OB.cw.luckOf), so the curve goes up and down with their
   luck. Each frame of the movie replays its update from coupon-data.js (OB.cw.round, OB.cw.weightsAt, OB.cw.play) and
   logs a console error when its average differs from the data's. The movie runs on its own requestAnimationFrame loop,
   as Old Bessie's: it stops in beat() and leave(), and a visit that is not live shows its end at once. */
(function () {
  "use strict";
  var OB = window.OB, CW = window.CW, D = window.CWD, K = OB.cw, el = OB.el;
  if (!K || !K.round || !K.EP) { console.error("cw-4learn: cw-0kit.js or cw-1game.js is missing"); return; }
  var N = D.ROUNDS, FIRST = 2;
  /* The average return after update r (r = 0: the weights at random): the points of the learning curve. */
  var avgAt = function (r) { return r === 0 ? D.rounds[0][1] : D.rounds[r - 1][4]; };
  var START = avgAt(0), LAST = avgAt(N);

  /* The panel of an update. Since 2026-11-19 (Carlos: "Only show this quadrant, don't show the other numbers. Plot also
     the triangle of the hop, but don't show the formulas outside of it"): its number; the weight and the average
     return, Before and After the hop; beside them the triangle of the hop (tri() below), without nabla or the update. */
  function Panel() {
    var P = { el: el("div", "ob-box cw-up") };
    P.count = el("div", "cw-hpc", "");
    P.el.appendChild(P.count);
    var row = el("div", "cw-upr"), g = el("div", "cw-hpg");
    function cell(cls, html) { var e = OB.html("div", cls, html || ""); g.appendChild(e); return e; }
    cell("cw-hph"); cell("cw-hph", "BEFORE"); cell("cw-hph", "AFTER");
    P.sym = cell("cw-hpl");
    P.v = cell("cw-hpn"); P.vh = cell("cw-hpn");
    cell("cw-hpl", "<span class=\"cw-bachip\">AVERAGE " + OB.tex("\\bar{G}_1") + "</span>");
    P.b = cell("cw-hpn r2"); P.a = cell("cw-hpn r2");
    row.appendChild(g);
    P.T = tri();
    row.appendChild(P.T.svg);
    P.el.appendChild(row);
    P.set = function (r) {
      P.count.textContent = "UPDATE " + OB.num(r.i, 0) + " OF " + OB.num(N, 0);
      if (P.k !== r.k) { P.k = r.k; P.sym.innerHTML = K.wsym(r.k); }
      P.v.textContent = K.wf(r.v);
      P.vh.textContent = K.wf(r.vh);
      P.b.textContent = K.n2(r.before);
      P.a.textContent = K.n2(r.after);
      P.T.set(r.change);
    };
    return P;
  }

  /* The triangle of the hop, small: across the weight, up the average return, as in scene 320; Before and After as two
     points, across always the hop, 0.2, 92 px; up the change of the average return, 400 px per CHF, drawn at most 42
     px each way (187 of the 2,000 updates change it by more than CHF 0.105; its label keeps the exact number). The
     legs carry the two numbers; no other number and no formula. */
  var UW = 168, UH = 122, UX = 20, UY = 104, BX = 34, BY = 58, ACROSS = 92, PER_CHF = 400, UPMAX = 42;
  function tri() {
    var T = {}, svg = T.svg = OB.svgEl("svg", { viewBox: "0 0 " + UW + " " + UH, width: UW, height: UH, "class": "cw-ut", "aria-hidden": "true" });
    function add(tag, a, txt) { var e = OB.svgEl(tag, a); if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; }
    add("polyline", { points: UX + ",10 " + UX + "," + UY + " " + (UW - 4) + "," + UY, "class": "cw-utax" });
    add("text", { x: UX, y: 4, "class": "cw-utt" }, "AVERAGE RETURN");
    add("text", { x: UW - 4, y: UY + 15, "class": "cw-utt e" }, "THE WEIGHT");
    T.area = add("polygon", { "class": "cw-utri" });
    T.across = add("line", { x1: BX, y1: BY, x2: BX + ACROSS, y2: BY, "class": "cw-utleg" });
    T.up = add("line", { x1: BX + ACROSS, y1: BY, x2: BX + ACROSS, y2: BY, "class": "cw-utleg" });
    T.la = add("text", { x: BX + ACROSS / 2, y: BY + 16, "class": "cw-utl" }, OB.num(D.HOP, 1));
    T.lu = add("text", { x: BX + ACROSS + 8, y: BY, "class": "cw-utl s" }, "");
    add("circle", { cx: BX, cy: BY, r: 5.5, "class": "cw-utpt b" });
    T.pa = add("circle", { cx: BX + ACROSS, cy: BY, r: 5.5, "class": "cw-utpt a" });
    T.set = function (change) {
      var h = Math.max(-UPMAX, Math.min(UPMAX, change * PER_CHF)), xa = BX + ACROSS, ya = BY - h;
      var cls = change > 0 ? " gain" : change < 0 ? " loss" : "";
      T.area.setAttribute("points", BX + "," + BY + " " + xa + "," + BY + " " + xa + "," + ya.toFixed(1));
      T.up.setAttribute("y2", ya.toFixed(1));
      T.up.setAttribute("class", "cw-utleg" + cls);
      T.pa.setAttribute("cy", ya.toFixed(1));
      T.la.setAttribute("y", String(h >= 0 ? BY + 17 : BY - 8));
      T.lu.setAttribute("y", (BY - h / 2 + 5).toFixed(1));
      T.lu.setAttribute("class", "cw-utl s" + cls);
      T.lu.textContent = (change > 0 ? "+" : "") + K.n2(change);
    };
    return T;
  }

  /* The learning curve: the average return after each update, point by point. Across, the updates from 0 to the larger
     of 4 and 1.15 times the newest point's update (at most 2,000): the first points stand apart, and the axis grows
     with the movie. Up, 50 to 72. Three tags (HTML over the plot) carry the numbers of points 0, 1 and 2 in scene 410. */
  var PW = 270, PH = 220, PL = 34, PR = 14, PT = 30, PB = 40, Y0 = 50, Y1 = 72;
  var IW = PW - PL - PR, IH = PH - PT - PB;
  var STEPS = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
  function xmaxOf(n) { return Math.min(N, Math.max(4, Math.ceil(n * 1.15))); }
  var py = function (v) { return PT + (Y1 - v) / (Y1 - Y0) * IH; };
  function Plot() {
    var C = { el: el("div", "cw-plot") }, Y = [];
    for (var r = 0; r <= N; r++) Y.push(py(avgAt(r)));
    C.ylab = OB.html("div", "cw-pylab", "AVERAGE " + OB.tex("\\bar{G}_1"));
    C.el.appendChild(C.ylab);
    var svg = C.svg = OB.svgEl("svg", { viewBox: "0 0 " + PW + " " + PH, width: PW, height: PH, "class": "cw-psvg", "aria-hidden": "true" });
    C.el.appendChild(svg);
    [50, 55, 60, 65, 70].forEach(function (v) {
      svg.appendChild(OB.svgEl("line", { x1: PL, x2: PL + IW, y1: py(v), y2: py(v), "class": "cw-pgrid" }));
      var t = OB.svgEl("text", { x: PL - 7, y: py(v) + 4, "class": "cw-ptl e" });
      t.textContent = String(v);
      svg.appendChild(t);
    });
    svg.appendChild(OB.svgEl("polyline", { "class": "cw-pax", points: PL + "," + (PT - 6) + " " + PL + "," + (PT + IH) + " " + (PL + IW + 6) + "," + (PT + IH) }));
    C.xt = OB.svgEl("g", {});
    svg.appendChild(C.xt);
    var tt = OB.svgEl("text", { x: PL + IW / 2, y: PH - 3, "class": "cw-ptt" });
    tt.textContent = "UPDATES";
    svg.appendChild(tt);
    C.curve = OB.svgEl("polyline", { "class": "cw-pcurve" });
    svg.appendChild(C.curve);
    C.dots = [0, 1].map(function () { var c = OB.svgEl("circle", { r: 5, "class": "cw-pdot cw-pdot0" }); svg.appendChild(c); return c; });
    C.dot = OB.svgEl("circle", { r: 6.5, "class": "cw-pdot" });
    svg.appendChild(C.dot);
    C.tags = [0, 1, 2].map(function (j) {
      var t = el("div", "cw-ptag ob-hide", K.n2(avgAt(j)));
      C.el.appendChild(t);
      return t;
    });
    C.n = -2;
    C.mk = -1;
    /* Points 0 to n (n = -1: none). */
    C.draw = function (n) {
      if (n === C.n) return;
      C.n = n;
      var m = xmaxOf(Math.max(0, n)), x = function (j) { return PL + IW * j / m; };
      if (m !== C.mk) {
        C.mk = m;
        while (C.xt.firstChild) C.xt.removeChild(C.xt.firstChild);
        var st = STEPS[STEPS.length - 1];
        for (var s = 0; s < STEPS.length; s++) if (m / STEPS[s] <= 5) { st = STEPS[s]; break; }
        for (var i = 0; i <= m; i += st) {
          C.xt.appendChild(OB.svgEl("line", { x1: x(i), x2: x(i), y1: PT + IH, y2: PT + IH + 6, "class": "cw-ptick" }));
          var t = OB.svgEl("text", { x: x(i), y: PT + IH + 19, "class": "cw-ptl" });
          t.textContent = OB.num(i, 0);
          C.xt.appendChild(t);
        }
        C.tags.forEach(function (tg, j) {
          tg.style.left = ((x(j) + 5) / PW * 100).toFixed(2) + "%";
          tg.style.top = ((Y[j] - 25) / PH * 100).toFixed(2) + "%";
        });
      }
      var pts = [];
      for (var j = 0; j <= n; j++) pts.push(x(j).toFixed(1) + "," + Y[j].toFixed(1));
      C.curve.setAttribute("points", pts.join(" "));
      /* Thinner as the points crowd: 3 px for the first points, 1.2 px from about 70 on. */
      C.curve.style.strokeWidth = String(Math.max(1.2, 3 - n / 40));
      C.dots[0].style.display = n >= 0 ? "" : "none";
      C.dots[0].setAttribute("cx", x(0).toFixed(1));
      C.dots[0].setAttribute("cy", Y[0].toFixed(1));
      C.dots[1].style.display = n === 2 ? "" : "none";
      C.dots[1].setAttribute("cx", x(1).toFixed(1));
      C.dots[1].setAttribute("cy", Y[1].toFixed(1));
      C.dot.style.display = n >= 1 ? "" : "none";
      if (n >= 1) {
        C.dot.setAttribute("cx", x(n).toFixed(1));
        C.dot.setAttribute("cy", Y[n].toFixed(1));
      }
    };
    return C;
  }

  /* The view of 410 and 420: the diagram of the forward pass with the panel of the update where scene 320 put the
     weight's Before and After, the learning curve where it put the average After, the bar of the movie under the

          var f = p * (F.length - 1), i0 = Math.min(F.length - 2, Math.floor(f)), u = f - i0, E = [];

      "The policy: 96 weights in place of a table of 201,326,592 preferences. \\(W\\) turns the state's 24 numbers into two, \\(E\\) turns them into preferences."],

<script>/* fullscreen.js */
/* fullscreen.js: the full-screen button of the AINIT games (2026-11-11; Carlos shows the games from his iPad).
   The same file in every game. The button goes after the light or dark switch (.themebtn) and takes its look; a
   page without that switch marks the place with data-fullscreen. One tap and the page fills the whole screen, with
   no address bar or tabs, in Safari and Chrome on an iPad and on a computer. The button is left out where the
   browser cannot do that (an iPhone, a frame that does not allow it), and hidden on screens under 561 px and while
   the page is full screen. The browser's own exit button, a swipe down on an iPad, or Escape leave full screen. */
(function () {
  var doc = document, root = doc.documentElement;
  var request = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!request || !(doc.fullscreenEnabled || doc.webkitFullscreenEnabled)) return;
  var host = doc.querySelector("[data-fullscreen]"), twin = host ? null : doc.querySelector(".themebtn");
  if (!host && !twin) return;

  var btn = doc.createElement("button");
  btn.type = "button";
  btn.className = twin ? twin.className + " fullbtn" : "fullbtn";
  btn.title = "Full screen";
  btn.setAttribute("aria-label", "Full screen");
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" style="display:block; margin:auto" aria-hidden="true"' +
    ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';

  var narrow = window.matchMedia ? window.matchMedia("(max-width: 560px)") : null;
  function isFull() { return !!(doc.fullscreenElement || doc.webkitFullscreenElement); }
  function sync() { btn.style.display = isFull() || (narrow && narrow.matches) ? "none" : ""; }

  btn.addEventListener("click", function () {
    btn.blur();
    var p = request.call(root);
    if (p && typeof p.catch === "function") p.catch(function () {});
  });
  doc.addEventListener("fullscreenchange", sync);
  doc.addEventListener("webkitfullscreenchange", sync);
  if (narrow && narrow.addEventListener) narrow.addEventListener("change", sync);
  else if (narrow && narrow.addListener) narrow.addListener(sync);

  if (twin) twin.parentNode.insertBefore(btn, twin.nextSibling);
  else host.appendChild(btn);
  sync();
})();
</script>
<script>/* juice.js */
/* juice.js: the motion layer of the look Arcade Marquee (design/arcade-marquee-motion, 2026-11-17). Loaded last by

   (OB.animate), so that Next, Back, the pager and a deep link end it at once: the particles of a burst die with the
   burst's motion, the transforms that an entrance or a pop sets are cleared in its done. The idle life (the vans bob,
   the marquee's bulbs chase, smoke rises from FAILING) is CSS, off under &instant and prefers-reduced-motion.

   OB.fx.config holds the sizes and the durations. The sections call OB.fx.burst, OB.fx.toss, OB.fx.celebrate and

  var COL = { yellow: "#FFC736", orange: "#FF8A2A", pink: "#F2386F", violet: "#7A3FE0", cyan: "#19B6E8",

      var y = q.y + q.vy * (1 - dragf) / (1 - q.drag + 1e-6) / 60 * (q.drag < 1 ? 1 : 0) + (q.drag >= 1 ? q.vy * age : 0) + 0.5 * q.grav * age * age;

  }

  /* emit(spec, n): n particles of one burst; spec: x, y, kind, colors, speed [min, max] px/s, angle and spread (rad),
     grav px/s2, drag (per frame at 60 fps, < 1), life [min, max] s, size [min, max] px, grow (to size times grow),

      var sp = rnd(spec.speed[0], spec.speed[1]), life = rnd(spec.life[0], spec.life[1]), s0 = rnd(spec.size[0], spec.size[1]);
      longest = Math.max(longest, life + (spec.delay || 0) / 1000);

        y: spec.y + rnd(-1, 1) * (spec.jitterY === undefined ? spec.jitter || 0 : spec.jitterY), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,

        color: pick(spec.colors || PARTY), edge: spec.edge, s0: s0, s1: s0 * (spec.grow || 1), grow: !!spec.grow,

    coins: function (c) {

        life: [0.62, 0.86], size: [5, 7.5], fade: 0.6, jitter: 6 }, 9);
      emit({ x: c.x, y: c.y, kind: "star", colors: [COL.yellow, COL.white], speed: [120, 260], drag: 0.9, life: [0.35, 0.55], size: [3, 6], spin: 6 }, 7);
    },
    zap: function (c) {
      emit({ x: c.x, y: c.y, kind: "star", colors: [COL.pink, COL.orange, COL.white], speed: [140, 300], drag: 0.9, life: [0.35, 0.6], size: [3.5, 7], spin: 8 }, 11);
    },
    confetti: function (c, n) {
      emit({ x: c.x, y: c.y, kind: "bit", speed: [380, 760], angle: -Math.PI / 2, spread: 1.15, grav: 900, drag: 0.965,
        life: [1.2, 1.7], size: [4, 7], spin: 12, fade: 0.7, jitter: Math.min(60, (c.w || 0) / 3) }, n || 46);
      emit({ x: c.x, y: c.y, kind: "star", colors: [COL.yellow, COL.white, COL.pink], speed: [200, 420], drag: 0.9, life: [0.5, 0.8], size: [5, 9], spin: 6 }, 14);
    },

        spread: 0.7, grav: -60, drag: 0.95, life: [0.6, 0.95], size: [4, 7], grow: 2.4, fade: 0.25, alpha: 0.85, stagger: c.stagger || 0 }, n || 4);

        life: [0.3, 0.5], size: [2.2, 4], grow: 1.6, fade: 0.3, jitter: (c.w || 20) / 3, jitterY: 2 }, small ? 5 : 10);

    ["wipe", ".runs-block.compact"],
    ["van", ".s1-vans > .ob-van"],
    ["tile", ".s2-ts, .s2-ta, .s2-tr, .s2-tw, .s2-wk"],
    ["row", ".runs-row, .s2-runwrap, .s3c-face"],
    ["pop", ".ob-chip, .ob-money, .s1-reward, .ob-van, .ob-die, .ob-game, .runs-g1, .s2-avgl, .s2-num, .s2-face, .s2-die, .s2-rsym, " +
      ".tb-zoom, .ob-btn, .s3c-gname, .s3d-gname, .s3d-mtop, .s3c-new, .s1-out1, .s2-rv, .s3a-tav, .s2-sym, .s2-hang, .s1-item, .s2-avg, .s2-res, .s2-res2"],
    ["box", ".ob-box, .s1-act, .s3e-card, .s3h-panel, .s1-out, .s1-in, .s1-td, .s2-formula, .s1-games, .s1-vans .ob-van"],
    ["rise", ".ob-say, .ob-note, .s2-cap, .s2-name2, .s2-with, .s2-here, .runs-legend, .s2-tdname, .s3c-cap, .tb-cap, .s1-cap2"]
  ];
  function kindOf(e) {
    if (!e.matches) return null;
    for (var i = 0; i < KINDS.length; i++) if (e.matches(KINDS[i][1])) return KINDS[i][0];
    return null;
  }
  function enter(e, opts) {
    if (!live()) return null;
    var kind = kindOf(e);
    if (!kind) return null;
    var dur = (opts && opts.dur) || OB.DUR.fade;
    var cs = window.getComputedStyle(e);
    if (cs.display === "inline") return null;
    var big = e.offsetWidth > 520 || e.offsetHeight > 300;
    if (kind === "pop" && big) kind = "box";
    var T = kind === "pop" ? C.pop : kind === "rise" ? C.rise : kind === "box" ? C.box : kind === "tile" ? Math.min(dur, 640) :
      kind === "van" ? Math.max(900, Math.min(dur, 1200)) : kind === "wipe" ? Math.min(dur, 1150) : 620;
    var span = Math.min(1, T / dur);
    var bd = kind === "tile" && e.classList.contains("bd");
    var sent = false;
    function at(p) { return clamp(lin(p) / span); }
    return {
      tick: function (p) {
        var q = at(p);
        if (kind === "pop") {
          e.style.scale = mix(0.35, 1, backOut(q, 2.3)).toFixed(4);
          e.style.opacity = String(clamp(q * 2.6));
        } else if (kind === "box") {
          e.style.scale = mix(0.86, 1, backOut(q, 1.5)).toFixed(4);
          e.style.opacity = String(clamp(q * 2.2));
        } else if (kind === "rise") {
          e.style.translate = "0 " + (14 * (1 - out3(q))).toFixed(2) + "px";
          e.style.opacity = String(out3(q));
        } else if (kind === "tile") {
          var y = q < 0.7 ? -16 * (1 - io3(q / 0.7)) : 3.2 * Math.sin((q - 0.7) / 0.3 * Math.PI);
          e.style.translate = "0 " + y.toFixed(2) + "px";
          e.style.opacity = String(clamp(q * 3));
          if (bd && q >= 0.72 && !sent) { sent = true; shake(e, 3.5, 560); var c = centre(e); if (c) BURST.puff({ x: c.x - c.w * 0.25, y: c.y, dir: Math.PI * 1.15 }, 6); }
        } else if (kind === "van") {
          /* a van drives in from the left, wheels turning, and rocks on its springs as it stops */
          if (!sent) { sent = true; e.classList.add("fx-drive"); var c0 = centre(e); if (c0) BURST.puff({ x: c0.x - c0.w * 0.8, y: c0.y + c0.h * 0.15, dir: Math.PI }, 3); }
          var m = clamp(q / 0.78), x = -70 * (1 - out3(m)), rk = q > 0.7 ? -3.2 * wobble((q - 0.7) / 0.3 * 0.9) : 0;
          e.style.translate = x.toFixed(2) + "px 0";
          e.style.rotate = rk.toFixed(2) + "deg";
          e.style.opacity = String(clamp(q * 3));
        } else if (kind === "wipe") {
          var w = out3(q);
          e.style.clipPath = "inset(0 0 " + (100 * (1 - w)).toFixed(2) + "% 0)";
          e.style.opacity = String(clamp(q * 4));
        } else if (kind === "row") {
          e.style.translate = (-26 * (1 - backOut(q, 1.3))).toFixed(2) + "px 0";
          e.style.opacity = String(clamp(q * 2.2));
        }
      },
      done: function () {
        e.style.scale = ""; e.style.translate = ""; e.style.rotate = ""; e.style.clipPath = "";
        if (kind === "van") e.classList.remove("fx-drive");
      }
    };
  }

  /* ================================================================================================================
     Flights (api.fly in core.js): the copy winds up, travels on its arc tilted into the turn, squashes as it lands,
     and a small copy leaves a trail of sparks; the element it lands on bumps, with sparks (coins for money won). */
  function flight(g, o) {
    if (!live()) return null;
    var w = o.w, h = o.h, small = w * h < 200 * 90 && !o.opts.ghost, dir = o.dx >= 0 ? 1 : -1;
    var a0 = { x: parseFloat(g.style.left) || 0, y: parseFloat(g.style.top) || 0 };
    var lastTrail = 0, color = null;
    if (small) {
      var cs = window.getComputedStyle(o.from);
      color = moneyOf(o.from) > 0 ? COL.gold : moneyOf(o.from) < 0 ? COL.pink : COL.yellow;
      if (cs && cs.color && /rgb/.test(cs.color) && color === COL.yellow) color = COL.yellow;
    }
    g.classList.add("fx-fly");
    return function (p) {
      var t = lin(p);
      var wind = t < 0.14 ? Math.sin(t / 0.14 * Math.PI) : 0;               // the wind-up: back a little, then go
      var u = io3(clamp((t - 0.08) / 0.82));                                // the travel
      var x = o.dx * u - dir * 10 * wind, y = o.dy * u - Math.sin(Math.PI * u) * o.arc;
      var sx = 1 + (o.sx - 1) * u, sy = 1 + (o.sy - 1) * u;
      var lift = 1 + 0.1 * Math.sin(Math.PI * clamp((t - 0.04) / 0.86)) + 0.06 * wind;
      var sq = t > 0.86 ? Math.sin((t - 0.86) / 0.14 * Math.PI) : 0;       // the squash of the landing
      var qx = lift * (1 + 0.16 * sq), qy = lift * (1 - 0.14 * sq);
      var tilt = small ? dir * 7 * Math.sin(Math.PI * u) - dir * 4 * wind : 0;
      var cx = w * sx / 2, cy = h * sy / 2;
      g.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) translate(" + cx.toFixed(2) + "px," + cy.toFixed(2) + "px) rotate(" +
        tilt.toFixed(2) + "deg) scale(" + qx.toFixed(4) + "," + qy.toFixed(4) + ") translate(" + (-cx).toFixed(2) + "px," + (-cy).toFixed(2) + "px) scale(" +
        sx.toFixed(4) + "," + sy.toFixed(4) + ")";
      if (o.fade) g.style.opacity = t > 0.78 ? String(clamp(1 - (t - 0.78) / 0.2)) : "";
      if (small && t > 0.12 && t < 0.86) {
        var now = performance.now();
        if (now - lastTrail > 55) { lastTrail = now; BURST.trail({ x: a0.x + x + cx, y: a0.y + y + cy }, color); }
      }
    };
  }
  function landed(to, opts) {
    if (!live() || !to) return;
    var c = centre(to);
    if (!c) return;
    var big = c.w > 260 || c.h > 160;
    bump(to, big ? 0.04 : Math.min(0.3, 0.22 * 70 / Math.max(30, Math.max(c.w, c.h)) + 0.1));
    if (big || (opts && opts.fxQuiet)) return;
    var m = moneyOf(to);
    if (m > 0) BURST.coins(c); else if (m < 0) BURST.zap(c); else BURST.sparkle(c);
  }

  /* ================================================================================================================
     Rolls (api.roll): the number glows while it counts and bumps when it lands, with sparks for a score (a number
     outside the tables). */
  function roll(e, from, to, opts) {
    if (!live() || !e.classList) return null;
    e.classList.add("fx-rolling");
    var quiet = (opts && opts.fxQuiet) || !!(e.closest && e.closest(".tb"));
    return {
      done: function (natural) {
        e.classList.remove("fx-rolling");
        if (!natural) return;
        bump(e, quiet ? 0.16 : 0.32, C.bump);
        if (quiet) return;
        var c = centre(e);
        if (!c) return;
        if (moneyOf(e) > 0 || (e.classList.contains("gain"))) BURST.coins(c); else BURST.sparkle(c);
      }
    };
  }

  /* ================================================================================================================
     Arrows (api.arrow): a spark rides the tip while the arrow draws itself, and the head snaps on. */
  function arrow(A) {
    if (!live() || !A || !A.svg || !A.line) return null;
    var dot = OB.svgEl("circle", { "class": "fx-tip", r: "5.5" });
    A.svg.appendChild(dot);
    return {
      tick: function (p) {
        var L = 0;
        try { L = A.line.getTotalLength(); } catch (e) { L = 0; }
        if (!L) { dot.style.display = "none"; return; }
        var pt = A.line.getPointAtLength(L * clamp(p));
        dot.style.display = "";
        dot.setAttribute("cx", pt.x.toFixed(1));
        dot.setAttribute("cy", pt.y.toFixed(1));
      },
      done: function (natural) {
        if (dot.parentNode) dot.parentNode.removeChild(dot);
        if (natural && A.head) {
          // No marker class on the head: nothing styles it, and a class left after a natural draw made the arrow
          // differ from its rest state when Back redraws the beat (tools/interrupt.mjs, 2026-11-18).
          OB.animate(380, function (p) { var t = lin(p); A.head.style.scale = (1 + 0.55 * wobble(t) * Math.min(1, t * 10)).toFixed(4); },
            function () { A.head.style.scale = ""; });
        }
      }
    };
  }

  /* ================================================================================================================
     Beats: the scene's head comes in, the stage card lights its marquee and drops its title, the vans of a few
     scenes idle, the pager's coin and the beat's dot pop. cut: what CSS started is stopped. */
  var IDLE = ".s1-vans, .s1-flow, .s1-rflow, .ob-card .road";
  function decorate(sec) {
    if (sec.fxDone) return;
    sec.fxDone = true;
    Array.prototype.slice.call(sec.querySelectorAll(IDLE)).forEach(function (box) { box.classList.add("fx-idle"); });
    Array.prototype.slice.call(sec.querySelectorAll(".fx-idle .ob-van")).forEach(function (v) {
      if (v.querySelector(".fx-puffs")) return;
      var pf = doc.createElement("span");
      pf.className = "fx-puffs";
      pf.setAttribute("aria-hidden", "true");
      for (var i = 0; i < 3; i++) pf.appendChild(doc.createElement("i"));
      v.appendChild(pf);
    });
    var card = sec.querySelector(".ob-card");
    if (card && !card.querySelector(".fx-bulbs")) {
      ["top", "bottom"].forEach(function (side) {
        var b = doc.createElement("div");
        b.className = "fx-bulbs " + side;
        b.setAttribute("aria-hidden", "true");
        for (var i = 0; i < 22; i++) { var s = doc.createElement("i"); s.style.setProperty("--i", String(i)); b.appendChild(s); }
        card.appendChild(b);
      });
    }
  }
  function headIn(sec) {
    var no = sec.querySelector(".scene-head .scene-no"), h2 = sec.querySelector(".scene-head h2");
    if (!h2) return;
    OB.animate(C.head, function (p) {
      var t = lin(p);
      var q = clamp(t / 0.8);
      h2.style.translate = (-34 * (1 - backOut(q, 1.6))).toFixed(2) + "px 0";
      h2.style.opacity = String(clamp(q * 2.4));
      if (no) {
        no.style.scale = mix(0.2, 1, backOut(clamp(t / 0.7), 2.6)).toFixed(4);
        no.style.rotate = (-200 * (1 - out3(clamp(t / 0.75)))).toFixed(1) + "deg";
      }
    }, function () {
      h2.style.translate = ""; h2.style.opacity = "";
      if (no) { no.style.scale = ""; no.style.rotate = ""; }
    });
  }
  function cardIn(sec) {
    var card = sec.querySelector(".ob-card");
    if (!card) return;
    var title = card.querySelector(".title"), kick = card.querySelector(".kicker"), van = card.querySelector(".drive");
    card.classList.remove("fx-in");
    void card.offsetWidth;
    card.classList.add("fx-in");
    OB.animate(1500, function (p) {
      var t = lin(p) * 1.5;   // seconds
      if (title) {
        var q = clamp((t - 0.18) / 0.62);
        var drop = q < 0.62 ? -90 * (1 - io3(q / 0.62)) : 0;
        var sq = q >= 0.62 ? Math.sin((q - 0.62) / 0.38 * Math.PI) * (1 - (q - 0.62) / 0.38 * 0.4) : 0;
        title.style.translate = "0 " + drop.toFixed(2) + "px";
        title.style.scale = (1 + 0.12 * sq).toFixed(4) + " " + (1 - 0.16 * sq).toFixed(4);
        title.style.opacity = String(clamp(q * 3));
      }
      if (kick) {
        var k = clamp(t / 0.6);
        kick.style.letterSpacing = mix(0.9, 0.16, out3(k)).toFixed(3) + "em";
        kick.style.opacity = String(out3(k));
      }
    }, function () {
      if (title) { title.style.translate = ""; title.style.scale = ""; title.style.opacity = ""; }
      if (kick) { kick.style.letterSpacing = ""; kick.style.opacity = ""; }
      card.classList.remove("fx-in");
    });
    if (van) {
      van.classList.add("fx-drive");
      for (var j = 0; j < 6; j++) (function (j) {
        OB.at(120 + j * 210, function () {
          var r = van.getBoundingClientRect();
          if (r.width) BURST.puff({ x: r.left + r.width * 0.06, y: r.top + r.height * 0.72, dir: Math.PI * 1.05 }, 2);
        });
      })(j);
      OB.at(1400, function () { van.classList.remove("fx-drive"); });
    }
  }
  function beat(s, k, api, entering) {
    if (!s || !s.sec) return;
    still();
    if (OFF || OB.fx.off) return;
    decorate(s.sec);
    var go = live() && api.forward && !api.instant;
    html.classList.toggle("fx-live", go);
    if (!go) return;
    if (entering && s.card) cardIn(s.sec);
    else if (entering) headIn(s.sec);
    if (entering) {
      var cur = doc.querySelector(".pager button[aria-current]");
      if (cur) bump(cur, 0.35, 520);
    }
    var dot = doc.querySelector(".beats i.on");
    if (dot) bump(dot, 0.6, 420);
  }
  function cut() {
    html.classList.remove("fx-live");
    Array.prototype.slice.call(doc.querySelectorAll(".fx-in, .fx-drive, .fx-spin")).forEach(function (e) {
      e.classList.remove("fx-in", "fx-drive", "fx-spin");
    });
    /* a die still in the air lands at once (a beat that tosses it again adds the class back) */
    Array.prototype.slice.call(doc.querySelectorAll(".ob-die.tumble")).forEach(function (e) { e.classList.remove("tumble"); });
  }

  /* A die is tossed (art.setDie with roll true, juice.css fx-toss, 1.5 s): dust where it lands, at 66% and 88%. */
  if (OB.art && typeof OB.art.setDie === "function") {
    var setDie0 = OB.art.setDie;
    OB.art.setDie = function (e, n, roll) {
      setDie0(e, n, roll);
      if (!roll || !live()) return;
      [990, 1320].forEach(function (ms, i) {
        OB.at(ms, function () {
          var r = e.getBoundingClientRect();
          if (r.width) BURST.dust({ x: r.left + r.width / 2, y: r.bottom - 2, w: r.width }, i);
        });
      });
    };
  }

  /* tally(froms, values, target, total, fmt, opts): the Compute of a return. A copy of each reward flies from its
     week into the total, one after the other (opts.delay ms, then opts.stagger ms apart, opts.dur ms each), and the
     total counts up by that reward as it lands: the room sees the sum built week by week. Returns false when motion is
     off, and the section then rolls the number as before. The total ends on fmt(total) in every case. */
  function tally(froms, values, target, total, fmt, opts) {
    if (!live() || !target || !froms || !froms.length) return false;
    opts = opts || {};
    var d0 = opts.delay || 0, st = opts.stagger || 80, dur = opts.dur || 640, sum = 0, left = froms.length;
    target.dataset.v = String(total);
    target.textContent = fmt(0);
    function sign(x) {
      var r = Math.round(x * 100) / 100;
      target.classList.toggle("gain", r > 0);
      target.classList.toggle("loss", r < 0);
    }
    sign(0);
    froms.forEach(function (f, i) {
      OB.at(d0 + i * st, function () { bump(f, 0.28, 380); });
      toss(f, target, { delay: d0 + i * st, dur: dur, arc: 46, scale: 0.6, fade: true, land: function (natural) {
        sum += values[i];
        left -= 1;
        var end = left === 0;
        target.textContent = fmt(end ? total : sum);
        sign(end ? total : sum);
        if (!natural) return;
        bump(target, end ? 0.34 : 0.1, end ? C.bump : 260);
        if (end) { var c = centre(target); if (c) (total >= 0 ? BURST.coins : BURST.zap)(c); }
      } });
    });
    return true;
  }

  /* ================================================================================================================
     Calls for the sections. */
  function burst(target, kind) {
    if (!live()) return;
    var c = centre(target);
    if (!c) return;
    (BURST[kind] || BURST.sparkle)(c);
  }
  /* toss(from, to, opts): a copy of from flies to to on the arc of api.fly, without hiding to; opts.dur (ms), opts.delay
     (ms), opts.arc, opts.land (called when it lands, or at once when the beat is cut), opts.scale (end size). */
  function toss(from, to, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      OB.at(opts.delay || 0, function () {
        var a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
        if (!live() || !a.width || !b.width) { if (opts.land) opts.land(false); resolve(); return; }
        var g = from.cloneNode(true);
        g.removeAttribute("id");
        g.classList.remove("ob-hide", "ob-ring");
        g.classList.add("ob-ghost", "fx-fly");
        var cs = window.getComputedStyle(from);
        ["fontSize", "fontFamily", "fontWeight", "color", "letterSpacing", "lineHeight", "whiteSpace"].forEach(function (k) { g.style[k] = cs[k]; });
        g.style.left = a.left + "px"; g.style.top = a.top + "px"; g.style.width = a.width + "px"; g.style.height = a.height + "px";
        g.style.visibility = "visible"; g.style.opacity = "";
        doc.body.appendChild(g);
        var sc = opts.scale || 0.8;
        var path = flight(g, { dx: b.left + b.width / 2 - a.left - a.width * sc / 2, dy: b.top + b.height / 2 - a.top - a.height * sc / 2,
          sx: sc, sy: sc, arc: opts.arc === undefined ? 60 : opts.arc, w: a.width, h: a.height, from: from, to: to, opts: {}, fade: !!opts.fade });
        OB.animate(opts.dur || 800, function (p) { if (path) path(p); }, function () {
          if (g.parentNode) g.parentNode.removeChild(g);
          if (opts.land) opts.land(true);
          resolve();
        });
      });
    });
  }
  function celebrate(target) {
    if (!live()) return;
    var c = centre(target);
    if (!c) return;
    BURST.confetti(c);
    OB.at(260, function () { BURST.confetti({ x: c.x - c.w * 0.35, y: c.y, w: c.w / 3 }, 22); });
    OB.at(420, function () { BURST.confetti({ x: c.x + c.w * 0.35, y: c.y, w: c.w / 3 }, 22); });
  }
  function milestone(target) {
    if (!live()) return;
    var c = centre(target);
    if (c) BURST.milestone(c);
  }

  OB.fx = { off: OFF, config: C, enter: enter, flight: flight, landed: landed, roll: roll, arrow: arrow, beat: beat, cut: cut,
    burst: burst, toss: toss, tally: tally, celebrate: celebrate, milestone: milestone, bump: bump, shake: shake, live: live };
})();
</script>
<script>OB.start({ card: { kicker: "PROTO-REINFORCE", title: "Coupon of the Week" } });</script>
</body>
