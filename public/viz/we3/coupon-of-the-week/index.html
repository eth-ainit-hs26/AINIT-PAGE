        r.v.forEach(function (v, i) {
          var c = OB.html("div", "cw-occ " + r.cls + (ri === ROWS.length - 1 ? " last" : ""), v);
          g.appendChild(c);
          P.cols[i].push(c);
        });
      });
      wrap.appendChild(g);
      box.appendChild(wrap);
      root.appendChild(box);
    },
    beat: function (k, api) {
      var P = this.parts, go = K.live(api, k);
      K.say(P.lead, L104[k], api);
      P.cols.forEach(function (col, i) {
        col.forEach(function (c, r) { api.show(c, k >= i + 1, K.opt(go && k === i + 1, 300 + 260 * r)); });
      });
      P.heads.forEach(function (h) { h.classList.toggle("ring", k >= 4); });
      if (go && k === 4 && OB.fx && OB.fx.bump) P.heads.forEach(function (h, i) { api.at(200 + 200 * i, function () { OB.fx.bump(h, 0.3, 460); }); });
    },
  });

  /* 110. One week: week 1, the coupon for tiramisu, HABIT, the reward r1. */
  var L110 = [
    "Week 1. The state: the household's " + HAB.length + " habits. The app's action: a coupon for " + K.name(A1) + ".",
    "The household uses the coupon: it buys one " + K.name(A1) + " with CHF 3 off.",
    "The coupon's part of the reward: the profit of one " + K.name(A1) + " minus the CHF 3 of the coupon.",
    cap(K.name(A1)) + " becomes a habit: HABIT. From week 2 on, the state has a 1 for " + K.name(A1) + ".",
    "The reward \\(r_1\\): the profits of the " + HAB.length + " habits of week 1 plus the coupon's part. " + cap(K.name(A1)) + " counts from week 2.",
  ];
  OB.scene({
    key: "week", order: 110, title: "One week", beats: L110.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      P.V = weekView(root, 0);
    },
    beat: function (k, api) {
      var P = this.parts, V = P.V, go = K.live(api, k);
      K.say(P.lead, L110[k], api);
      api.show(V.stamp, k >= 1, K.opt(go && k === 1, 500));
      setStamp(V, k >= 3 ? 2 : 1);
      if (go && k === 3 && OB.fx && OB.fx.bump) OB.fx.bump(V.stamp, 0.35, 480);
      api.show(V.cb, k >= 2, K.opt(go && k === 2, 300));
      var nh = V.newHab;
      if (go && k === 3) {
        nh.classList.add("ob-hide");
        api.fly(V.ticket.querySelector(".cw-tk-ic"), nh.querySelector(".cw-hi"), { delay: 300 });
        api.at(300, function () { nh.classList.remove("ob-hide"); nh.querySelector(".cw-hp").classList.add("ob-hide"); nh.querySelector(".cw-hfrom").classList.add("ob-hide"); });
        api.at(300 + OB.DUR.fly, function () { nh.querySelector(".cw-hp").classList.remove("ob-hide"); nh.querySelector(".cw-hfrom").classList.remove("ob-hide"); });
      } else {
        nh.classList.toggle("ob-hide", k < 3);
        nh.querySelectorAll(".cw-hp, .cw-hfrom, .cw-hi").forEach(function (e) { e.classList.remove("ob-hide"); e.style.visibility = ""; });
      }
      rewardIn(api, V, k >= 4, go && k === 4);
    },
  });

  /* 112. Week 2: the state with tiramisu, the coupon for avocados, USED, the reward r2. */
  var H2 = habOf(W2.s);
  var L112 = [
    "Week 2. The state: " + H2.length + " habits, " + K.name(A1) + " among them. The app's action: a coupon for " + K.name(A2) + ".",
    "The household uses the coupon but does not take up " + K.name(A2) + " as a habit: USED. A used coupon becomes a habit only sometimes. The state stays the same for week 3.",
    "The reward \\(r_2\\): the profits of the " + H2.length + " habits, " + K.name(A1) + "'s " + pA + " among them, plus the coupon's part.",
    cap(K.name(A1)) + "'s coupon lost CHF " + OB.num(-part(A1), 2) + " in week 1. As a habit, " + K.name(A1) + " brings CHF " + pA + " in each of the " + (CW.WEEKS - 1) + " weeks after, CHF " + OB.num(CW.PROFIT[A1] * (CW.WEEKS - 1), 2) + " in all.",
  ];
  OB.scene({
    key: "week2", order: 112, title: "Week 2", beats: L112.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      P.V = weekView(root, 1);
      P.tir = P.V.tiles[P.V.H.indexOf(A1)];
    },
    beat: function (k, api) {
      var P = this.parts, V = P.V, go = K.live(api, k);
      K.say(P.lead, L112[k], api);
      api.show(V.stamp, k >= 1, K.opt(go && k === 1, 500));
      api.show(V.cb, k >= 1, K.opt(go && k === 1, 1100));
      rewardIn(api, V, k >= 2, go && k === 2);
      P.tir.classList.toggle("cw-focus", k >= 3);
      if (go && k === 3 && OB.fx && OB.fx.bump) OB.fx.bump(P.tir, 0.35, 480);
    },
  });

  /* 120. One quarter: the episode of the example household. */
  var HCOUNT = [];
  (function () { var n = HAB.length; EP.weeks.forEach(function (w) { HCOUNT.push(n); if (w.habit) n++; }); HCOUNT.push(n); })();
  var WI = EP.weeks[IG];
  var L120 = [
    "One quarter, 12 weeks, one coupon a week: an episode. Its coupons were picked by the app's policy.",
    "Every week has its reward. The habits pay every week: " + HCOUNT[0] + " habits in week 1, " + HCOUNT[CW.WEEKS - 1] + " in week 12.",
    "Week " + (IG + 1) + ": the household ignores the coupon for " + K.name(WI.a) + ". The reward is the habits' profits alone: \\(r_{" + (IG + 1) + "} = " + OB.num(WI.reward, 2) + "\\).",
    "The return \\(G_1\\): the sum of the 12 rewards.",
  ];
  OB.scene({
    key: "quarter", order: 120, title: "One quarter", beats: L120.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      var strip = el("div", "cw-qstrip");
      P.cols = EP.weeks.map(function (w, t) {
        var c = el("div", "cw-qcol");
        c.appendChild(el("div", "cw-qwk", "WEEK " + (t + 1)));
        var tk = el("div", "cw-qtk");
        tk.appendChild(el("span", "cw-qic", CW.ICONS[w.a]));
        tk.title = CW.NAMES[w.a];
        c.appendChild(tk);
        var o = outOf(w);
        c.appendChild(el("div", "cw-qout o" + o, OUT[o]));
        var hn = el("div", "cw-qhab", HCOUNT[t] + " HABITS");
        c.appendChild(hn);
        var r = OB.html("div", "cw-qr", OB.tex("r_{" + (t + 1) + "}") + " <span>" + OB.num(w.reward, 2) + "</span>");
        c.appendChild(r);
        strip.appendChild(c);
        return { el: c, hn: hn, r: r };
      });
      root.appendChild(strip);
      P.g = OB.html("div", "ob-box cw-gbox", OB.tex("G_1 = r_1 + r_2 + \\dots + r_{12} =\\;") + "<span class=\"ob-texn cw-gnum\">" + OB.num(EP.G1, 2) + "</span>" +
        "<span class=\"cw-gunit\">CHF</span>");
      root.appendChild(P.g);
    },
    beat: function (k, api) {
      var P = this.parts, go = K.live(api, k);
      K.say(P.lead, L120[k], api);
      P.cols.forEach(function (c, t) {
        if (go && k === 0) { c.el.classList.add("ob-hide"); api.show(c.el, true, { delay: 300 + 260 * t, dur: 900 }); }
        else c.el.classList.remove("ob-hide");
        api.show(c.hn, k >= 1, K.opt(go && k === 1, 200 + 120 * t, { dur: 900 }));
        api.show(c.r, k >= 1, K.opt(go && k === 1, 200 + 120 * t, { dur: 900 }));
        c.el.classList.toggle("cw-focus", k === 2 && t === IG);
      });
      if (go && k === 2 && OB.fx && OB.fx.bump) OB.fx.bump(P.cols[IG].el, 0.3, 460);
      api.show(P.g, k >= 3, K.opt(go && k === 3, 300));
      if (go && k === 3 && OB.fx && OB.fx.celebrate) api.at(300 + OB.DUR.fade, function () { OB.fx.celebrate(P.g); });
    },
  });
})();
</script>
<script>/* cw-1play.js */
/* cw-1play.js: scene 130 of "Coupon of the Week", Your quarter (main session, 2026-11-18; Carlos: "Include a part
   where the participant can play one quarter on its own. You show the household, and you show the state, you show the
   actions available to the participant, and then the reward after each step").

   The participant is the app for the household of scenes 100 to 120 (CWD.EXAMPLE of the guided luck) and picks its 12
   coupons. Every week the page shows the state s (24 numbers, 1 for a habit), the actions (the products with 0, each
   a button), and after a tap the reward of the week: the habits' profits plus the coupon's profit minus CHF 3 when the
   household uses it. Use and habit come from the same three numbers of luck per week as the app's episode of scene 120
   (coupon.js), so a product picked by both meets the same chances, and the return G1 compares with the app's.
   The picks live on the scene (this.S), so Back and the pager keep the game; AGAIN starts it over. A tap draws the
   week at once with OB.go(index, 0, { forward: true }); this.fx then moves the new week in (the icon flies to its
   week, the outcome, the reward line, the reward flies to its week, a new habit's 0 turns to 1).
   Since 2026-11-19 (Carlos: "when computing the reward, animate the profits of all habits by moving them towards the
   total sum so it is clear where the reward comes from. Why hasn't the milkshake become a habit after the coupon was
   used? This is unclear"): the habits' profits fly from the table into the habits' box of the reward line, which counts
   up (juice.js, tally), a used coupon's profit flies into the coupon's box, and a line under the reward says what the
   household did, with the chance of a habit for a USED week. */
(function () {
  "use strict";
  var OB = window.OB, CW = window.CW, D = window.CWD, K = OB.cw, el = OB.el;
  if (!K || !K.EP) { console.error("cw-1play: cw-0kit.js or cw-1game.js is missing"); return; }
  var N = CW.N, WEEKS = CW.WEEKS, L = K.guided(), I = D.EXAMPLE, EP = K.EP, HH = EP.household;
  var OUT = ["IGNORED", "USED", "HABIT"];

  /* The quarter after the picks so far, computed as CW.playEpisode computes it, with the participant's coupons in place
     of the roulette's: every week's state, coupon, outcome and reward, the state after the last week, the return. */
  function replay(picks) {
    var s = HH.basket.slice(), weeks = [], G = 0;
    for (var t = 0; t < picks.length; t++) {
      var k = I * CW.PER + 1 + N + 3 * t, a = picks[t], reward = 0, nh = 0;
      for (var j = 0; j < N; j++) if (s[j]) { reward += CW.PROFIT[j]; nh++; }
      var hab = reward, f = HH.fits[a];
      var used = L[k + 1] < CW.pUse(f), habit = used && L[k + 2] < CW.pHabit(f);
      if (used) reward += CW.PROFIT[a] - CW.DISCOUNT;
      weeks.push({ a: a, nh: nh, hab: hab, used: used, habit: habit, out: habit ? 2 : used ? 1 : 0, reward: reward });
      if (habit) s[a] = 1;
      G += reward;
    }
    return { weeks: weeks, s: s, G1: G, done: picks.length === WEEKS };
  }
  /* The app's own coupons replayed here give the app's return of scene 120. */
  (function () {
    var R = replay(EP.weeks.map(function (w) { return w.a; }));
    if (Math.abs(R.G1 - EP.G1) > 1e-9) console.error("cw-1play: the app's picks replayed give " + R.G1 + ", its episode " + EP.G1);
  })();
  K.replayQuarter = replay;

  function unfocus(ev) {
    if (ev && ev.type === "click" && ev.detail > 0 && ev.currentTarget && ev.currentTarget.blur) ev.currentTarget.blur();
  }
  /* The line under the reward: what the household did with the last coupon. Product names are singular or plural, so
     no verb takes a name as its subject. */
  function why(W) {
    var nm = K.name(W.a);
    if (W.out === 0) return "The household did not buy " + nm + ". The reward is the habits' profits alone.";
    if (W.out === 1) return "The household bought " + nm + " once, with CHF 3 off, but did not take up " + nm + " as a habit: its 0 stays. " +
      "A used coupon becomes a habit only sometimes, more often for a product that fits the household's taste.";
    return "The household bought " + nm + " with CHF 3 off and buys " + nm + " every week from now on: its 0 turns to 1, and its profit counts from next week.";
  }
  function lead(R) {
    var t = R.weeks.length;
    if (R.done) return "Your episode: 12 states, 12 actions, 12 rewards. Your return \\(G_1\\) is the sum of the 12 rewards.";
    if (t === 0) return "Your turn: one quarter for this household. Your action each week: tap a product with 0 in the state \\(s\\) to send its coupon.";
    return "Week " + (t + 1) + ": tap a product with 0 in the state \\(s\\) to send its coupon.";
  }

  OB.scene({
    key: "play", order: 130, title: "Your quarter",
    build: function (root) {
      var self = this, P = this.parts = {};
      this.S = { picks: [] };
      root.classList.add("cw-root");
      P.lead = K.lead(root);
      var box = el("div", "cw-play");
      P.head = el("div", "cw-pyhead");
      box.appendChild(P.head);

      /* The state and the actions: the 24 products in three blocks of 8 (one row from 1120 px on). */
      var tab = el("div", "cw-pytab");
      P.blocks = [];
      P.cols = [];
      for (var b = 0; b < 3; b++) {
        var blk = el("div", "cw-pyblk" + (b ? " more" : ""));
        var labs = el("div", "cw-pylabs");
        labs.appendChild(el("div", "cw-pyl ic", ""));
        labs.appendChild(OB.html("div", "cw-pyl s", "STATE " + OB.tex("s")));
        labs.appendChild(el("div", "cw-pyl p", "PROFIT"));
        blk.appendChild(labs);
        for (var j = 8 * b; j < 8 * b + 8; j++) {
          var c = el("div", "cw-pycol");
          var ic = el("div", "cw-pyic", CW.ICONS[j]);
          var sv = el("div", "cw-pys"), sn = el("span", "cw-tn");
          sv.appendChild(sn);
          c.appendChild(ic);
          c.appendChild(sv);
          /* The profit's number in a span of its own, which flies into the reward. */
          var pp = el("div", "cw-pyp"), pn = el("span", "cw-ppn", OB.num(CW.PROFIT[j], 2));
          pp.appendChild(pn);
          c.appendChild(pp);
          c.title = CW.NAMES[j];
          c.dataset.j = String(j);
          (function (jj, cc) {
            cc.addEventListener("click", function (ev) { self.tap(jj, ev); });
            cc.addEventListener("keydown", function (ev) {
              if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); ev.stopPropagation(); self.tap(jj, ev); }
            });
          })(j, c);
          blk.appendChild(c);
          P.cols.push({ el: c, ic: ic, s: sv, sn: sn, pn: pn });
        }
        tab.appendChild(blk);
        P.blocks.push(blk);
      }
      box.appendChild(tab);

      /* The reward of the week just played: r_t = habits + coupon. */
      var rw = P.rw = el("div", "cw-pyrw");
      P.rsym = OB.html("span", "cw-pyop", "");
      var hb = P.hb = el("div", "ob-box cw-pybox");
      P.hbh = el("div", "cw-bah", "");
      P.hbn = el("div", "cw-bnum", "");
      hb.appendChild(P.hbh);
      hb.appendChild(P.hbn);
      var cb = P.cb = el("div", "ob-box cw-pybox");
      var cbh = el("div", "cw-bah cw-pych");
      cbh.appendChild(document.createTextNode("COUPON "));
      P.cbi = el("span", "cw-pyci", "");
      cbh.appendChild(P.cbi);
      P.cbo = el("span", "cw-qout", "");
      cbh.appendChild(P.cbo);
      P.cbn = OB.html("div", "cw-pycn", "");
      cb.appendChild(cbh);
      cb.appendChild(P.cbn);
      P.plus = OB.html("span", "cw-pyop", OB.tex("+"));
      P.eq = OB.html("span", "cw-pyop", OB.tex("="));
      P.rnum = el("span", "cw-rnum cw-pyrn", "");
      /* "=" and the reward stay on one line when the line wraps (phones). */
      var res = el("span", "cw-pyres");
      res.appendChild(P.eq);
      res.appendChild(P.rnum);
      [P.rsym, hb, P.plus, cb, res].forEach(function (e) { rw.appendChild(e); });
      box.appendChild(rw);
      var wy = P.why = el("div", "cw-pywhy");
      P.whyChip = el("span", "cw-qout", "");
      P.whyT = el("span", "cw-pywt", "");
      wy.appendChild(P.whyChip);
      wy.appendChild(P.whyT);
      box.appendChild(wy);

      /* The episode so far: one cell per week. */
      var strip = el("div", "cw-qstrip cw-pystrip");
      P.wk = [];
      for (var t = 0; t < WEEKS; t++) {
        var w = el("div", "cw-qcol");
        w.appendChild(el("div", "cw-qwk", "WEEK " + (t + 1)));
        var tk = el("div", "cw-qtk");
        var wic = el("span", "cw-qic", "");
        tk.appendChild(wic);
        w.appendChild(tk);
        var chip = el("div", "cw-qout", "");
        w.appendChild(chip);
        var r = OB.html("div", "cw-qr", OB.tex("r_{" + (t + 1) + "}") + " <span class=\"cw-pyrv\"></span>");
        w.appendChild(r);
        strip.appendChild(w);
        P.wk.push({ el: w, tk: tk, ic: wic, chip: chip, r: r, rn: r.querySelector(".cw-pyrv") });
      }
      box.appendChild(strip);

      /* The end: the return, the app's return with this household, AGAIN. */
      var end = P.end = el("div", "cw-pyend");
      P.g = OB.html("div", "ob-box cw-gbox cw-pyg", OB.tex("G_1 = r_1 + r_2 + \\dots + r_{12} =\\;") + "<span class=\"ob-texn cw-gnum\"></span><span class=\"cw-gunit\">CHF</span>");
      P.gn = P.g.querySelector(".cw-gnum");
      P.app = OB.html("div", "ob-box cw-pyapp", "<div class=\"cw-bah\">THE APP'S POLICY</div><div class=\"cw-bnum\">" + OB.num(EP.G1, 2) + "</div>");
      P.again = el("button", "ob-btn quiet cw-pyagain", "AGAIN");
      P.again.type = "button";
      P.again.addEventListener("click", function (ev) { unfocus(ev); self.again(); });
      end.appendChild(P.g);
      end.appendChild(P.app);
      end.appendChild(P.again);
      box.appendChild(end);
      root.appendChild(box);
    },

    tap: function (a, ev) {
      var S = this.S, R = replay(S.picks);
      if (R.done || R.s[a]) return;
      unfocus(ev);
      S.picks.push(a);
      this.fx = { t: S.picks.length - 1, key: ev && ev.detail === 0 ? a : -1 };
      OB.go(this.index, 0, { forward: true });
    },
    again: function () {
      this.S.picks = [];
      this.fx = null;
      OB.go(this.index, 0);
    },

    beat: function (k, api) {
      var self = this, P = this.parts, S = this.S, R = replay(S.picks), t = R.weeks.length, fx = this.fx;
      this.fx = null;
      var go = K.live(api, 0), move = !!fx && !api.instant;
      K.say(P.lead, lead(R), api);
      P.head.textContent = "";
      P.head.appendChild(el("span", "cw-pyhi", "\u{1F3E0}"));
      P.head.appendChild(document.createTextNode(R.done ? "THIS HOUSEHOLD AFTER WEEK 12" : "THIS HOUSEHOLD IN WEEK " + (t + 1)));

      /* The state now, and the actions: a product with 0 is a button while the quarter runs. */
      var last = t ? R.weeks[t - 1] : null;
      P.cols.forEach(function (c, j) {
        var on = !!R.s[j], fresh = on && !HH.basket[j];
        c.sn.textContent = on ? "1" : "0";
        c.s.classList.toggle("hab", on && !fresh);
        c.s.classList.toggle("new", fresh);
        c.el.classList.toggle("last", !!last && last.a === j);
        var act = !on && !R.done;
        c.el.classList.toggle("act", act);
        if (act) {
          c.el.setAttribute("tabindex", "0");
          c.el.setAttribute("role", "button");
          c.el.setAttribute("aria-label", CW.NAMES[j] + ": send its coupon");
        } else {
          c.el.removeAttribute("tabindex");
          c.el.removeAttribute("role");
          c.el.removeAttribute("aria-label");
        }
      });

      /* The reward of the last week played. */
      if (last) {
        P.rsym.innerHTML = OB.tex("r_{" + t + "} =");
        P.hbh.textContent = last.nh + " HABITS";
        P.hbn.textContent = OB.num(last.hab, 2);
        P.cbi.textContent = CW.ICONS[last.a];
        P.cbo.className = "cw-qout o" + last.out;
        P.cbo.textContent = OUT[last.out];
        P.cbn.innerHTML = last.used ? OB.tex(OB.num(CW.PROFIT[last.a], 2) + " - 3 = " + OB.num(CW.PROFIT[last.a] - CW.DISCOUNT, 2)) : OB.tex("0");
        P.rnum.textContent = OB.num(last.reward, 2);
        P.whyChip.className = "cw-qout o" + last.out;
        P.whyChip.textContent = OUT[last.out];
        P.whyT.textContent = why(last);
      }
      P.rw.classList.toggle("ob-hide", !last);
      P.why.classList.toggle("ob-hide", !last);

      /* The episode so far. */
      P.wk.forEach(function (w, i) {
        var W = R.weeks[i];
        w.el.classList.toggle("now", i === t && !R.done);
        w.el.classList.toggle("todo", i > t || (i === t && R.done));
        w.ic.textContent = W ? CW.ICONS[W.a] : "";
        w.tk.title = W ? CW.NAMES[W.a] : "";
        w.chip.className = "cw-qout" + (W ? " o" + W.out : "");
        w.chip.textContent = W ? OUT[W.out] : "";
        w.chip.classList.toggle("ob-hide", !W);
        w.rn.textContent = W ? OB.num(W.reward, 2) : "";
        w.r.classList.toggle("ob-hide", !W);
      });

      /* The return, once the 12 weeks are played. */
      P.gn.textContent = OB.num(R.G1, 2);
      P.end.classList.toggle("ob-hide", !R.done);

      /* Entering with Next: the table, then the weeks. */
      if (go) {
        P.blocks.forEach(function (b, i) { b.classList.add("ob-hide"); api.show(b, true, { delay: 300 + 250 * i, dur: 900 }); });
        P.wk.forEach(function (w, i) { w.el.classList.add("ob-hide"); api.show(w.el, true, { delay: 1100 + 90 * i, dur: 700 }); });
      }

      /* A tap: the coupon flies to its week, the outcome shows, the reward line builds, the reward flies to its week,
         and a new habit's 0 turns to 1. */
      if (move && fx.t === t - 1) {
        var w = P.wk[fx.t], W = R.weeks[fx.t], col = P.cols[W.a];
        api.fly(col.ic, w.ic, { dur: 900, arc: 50 });
        w.chip.classList.add("ob-hide");
        api.show(w.chip, true, { delay: 900, dur: 450 });
        /* The reward: the habits' profits fly from the table into the habits' box, which counts up; then the coupon's
           part (a used coupon's profit flies from the table into the coupon's box); then = and the reward, which flies
           to its week. The habits are those of the week's state: a new habit counts from the next week. */
        [P.rsym, P.hb, P.plus, P.cb, P.eq, P.rnum, P.why].forEach(function (e) { e.classList.add("ob-hide"); });
        api.show(P.rsym, true, { delay: 1000, dur: 450 });
        api.show(P.hb, true, { delay: 1000, dur: 450 });
        var hs = [];
        R.s.forEach(function (b, j) { if (b && !(W.habit && j === W.a)) hs.push(j); });
        if (hs.length !== W.nh) console.error("cw-1play: week " + (fx.t + 1) + " has " + W.nh + " habits, the table " + hs.length);
        var d0 = 1300, st = 150, dur = 650;
        var tallied = OB.fx && OB.fx.tally && OB.fx.tally(hs.map(function (j) { return P.cols[j].pn; }), hs.map(function (j) { return CW.PROFIT[j]; }),
          P.hbn, W.hab, function (x) { return OB.num(x, 2); }, { delay: d0, stagger: st, dur: dur });
        var t1 = tallied ? d0 + st * (hs.length - 1) + dur + 150 : 1300, t2 = t1 + 350;
        api.show(P.plus, true, { delay: t1, dur: 450 });
        api.show(P.cb, true, { delay: t1, dur: 450 });
        if (W.used) { api.fly(col.pn, P.cbn, { delay: t1 + 300, dur: 800, arc: 40 }); t2 = t1 + 1200; }
        api.show(P.eq, true, { delay: t2, dur: 450 });
        api.show(P.rnum, true, { delay: t2, dur: 450 });
        api.show(P.why, true, { delay: t2 + 200, dur: 600 });
        w.r.classList.remove("ob-hide");
        api.fly(P.rnum, w.rn, { delay: t2 + 500, dur: 800, arc: 30 });
        if (W.habit) {
          col.sn.textContent = "0";
          col.s.classList.remove("new");
          api.at(t2 + 1000, function () {
            col.sn.textContent = "1";
            col.s.classList.add("new");
            if (OB.fx && OB.fx.bump) OB.fx.bump(col.s, 0.35, 480);
          });
        }
        if (R.done) {
          P.end.classList.add("ob-hide");
          api.show(P.end, true, { delay: t2 + 1300, dur: 700 });
          if (OB.fx && OB.fx.celebrate) api.at(t2 + 2000, function () { OB.fx.celebrate(P.g); });
        }
      }
      if (fx && fx.key >= 0) {
        var nx = P.cols[fx.key];
        if (R.done) P.again.focus();
        else if (nx.el.getAttribute("tabindex") === "0") nx.el.focus();
        else { var f = P.cols.filter(function (c) { return c.el.getAttribute("tabindex") === "0"; })[0]; if (f) f.el.focus(); }
      }
    },
  });
})();
</script>
<script>/* cw-2a-table.js */
/* cw-2a-table.js: scene 202 of "Coupon of the Week" (main session, 2026-11-20), stage 1 of the three stages of the
   policy that Carlos asked for that day (source/PLAN.md): "Before we introduce the W and E matrices, I think we should
   explain what would happen if we would try to create a table of bets or probabilities for this MDP, as we did for
   Bessie. This would motivate the use of W and E to compress the representations."

   202 A table of preferences (8 beats; the head reads "Learning the table" from beat 5, K.title):
       0 Old Bessie's table of preferences as on its page 3: 4 states, 3 actions, 12 preferences (BESSIE below).
       1 It glides to a corner, small; the app's table builds: one row per state (the state's 24 numbers on the left of
         its row), one column per coupon, a habit's cell blank. Its rows: the states of week 1 of six households of the
         guided luck, the example household's first.
       2 How many rows? Guess, then Count.
       3 The rows stream by in counting order, faster and faster, while the count of rows rolls to 2^24 = 16,777,216.
         Row r holds the state whose product j is a habit when bit 23 - j of r - 1 is 1; the window ends on the last
         six rows, states of 22 to 24 habits.
       4 The cells, 16,777,216 x 24 = 402,653,184; half of them blank: 201,326,592 preferences.
       5 An update of proto-REINFORCE plays 1,000 households for 12 weeks: at most 12,000 states visited, a square to
         scale inside the square of the 16,777,216 states.
       6 A hop on a preference of a state with no visit changes no episode: the triangle of the hop lies flat, nabla = 0.
         The preference in the ring is in row 16,777,215, a state of 23 habits; a household starts with 4 habits and
         gains at most one a week (coupon.js), so its 12 weeks visit states of 4 to 15 habits.
       7 The numbers to learn: TABLE 201,326,592. Left with Next, the view hands over to scene 210 (leave()).

   The app's preferences are picked as Old Bessie's were (B.randomBets in 02_old_bessie/source/game/bessie.js: one
   decimal between -1 and 1, a quarter of them 5 to 10 in size), from CW.rng seeded with the row's number: a state shows
   the same preferences wherever its row appears. Old Bessie's twelve are B.PROTO.bets = B.randomBets(17, 68). */
(function () {
  "use strict";
  var OB = window.OB, CW = window.CW, D = window.CWD, K = OB.cw, el = OB.el;
  if (!K || !K.EP) { console.error("cw-2a-table: cw-0kit.js or cw-1game.js is missing"); return; }

  var N = CW.N, ROWS = Math.pow(2, N), CELLS = ROWS * N, PREFS = CELLS / 2;
  var VISITS = D.NHH * CW.WEEKS;
  var SHOW = 6, RH = 22, RING_ROW = ROWS - 1, RING_COL = N - 1;
  var BESSIE = [[0.4, -0.6, 0.1], [-0.7, -0.8, -6.9], [-0.4, 0.1, 10], [0.4, 0.6, -0.4]];
  var fmt0 = function (x) { return OB.num(x, 0); };

  /* The state of row r (1 to 2^24) in counting order, and the row of a state. */
  function stateOf(r) {
    var s = new Array(N), x = r - 1;
    for (var j = N - 1; j >= 0; j--) { s[j] = x % 2; x = Math.floor(x / 2); }
    return s;
  }
  function rowOf(s) { var r = 0; for (var j = 0; j < N; j++) r = 2 * r + (s[j] ? 1 : 0); return r + 1; }
  /* The preferences of row r: picked as B.randomBets picks them; a habit's cell blank (null). */
  function prefsOf(s, r) {
    var g = CW.rng(r), out = new Array(N);
    for (var j = 0; j < N; j++) {
      var v = Math.round((g() * 2 - 1) * 10) / 10, u = g(), size = g(), sign = g();
      if (u < 0.25) v = (sign < 0.5 ? -1 : 1) * Math.round((5 + 5 * size) * 10) / 10;
      out[j] = s[j] ? null : v;
    }
    return out;
  }
  /* The rows of beats 1 and 2: the states of week 1 of six households, the example household's first. */
  var HH = (function () {
    var L = K.guided(), ids = [D.EXAMPLE], out = [];
    for (var i = 0; ids.length < SHOW; i++) if (i !== D.EXAMPLE) ids.push(i);
    ids.forEach(function (i) {
      var s = CW.playEpisode(D.init.W, D.init.E, L, i, true).weeks[0].s, r = rowOf(s);
      out.push({ s: s, r: r, p: prefsOf(s, r) });
    });
    return out;
  })();
  (function check() {
    var s = stateOf(RING_ROW), habits = s.reduce(function (a, b) { return a + b; }, 0);
    if (s[RING_COL] || habits <= CW.START_HABITS + CW.WEEKS - 1) console.error("cw-2a-table: the ringed preference is not in a state that no household reaches");
    if (rowOf(stateOf(HH[0].r)) !== HH[0].r) console.error("cw-2a-table: rowOf and stateOf disagree");
  })();

  /* Old Bessie's table of preferences, big (beat 0, as on its page 3) or small (the corner, from beat 1). */
  function bessie(big) {
    var t = el("div", "cw-vt " + (big ? "big" : "small")), g = el("div", "cw-vt-g");
    t.appendChild(g);
    g.appendChild(el("div", ""));
    for (var a = 0; a < 3; a++) {
      var h = el("div", "cw-vt-ah a" + a);
      h.appendChild(OB.html("span", "cw-vt-gl", OB.art.glyph(a, big ? 20 : 13)));
      if (big) h.appendChild(el("span", "cw-vt-an", OB.art.ACTIONS[a]));
      g.appendChild(h);
    }
    for (var s = 0; s < 4; s++) {
      var v = el("div", "cw-vt-sv");
      v.appendChild(OB.art.van(s, { size: big ? 56 : 30, gauge: false, label: big }));
      g.appendChild(v);
      for (var b = 0; b < 3; b++) {
        var c = el("div", "cw-vt-c" + (b === 0 ? " fc" : "") + (b === 2 ? " lc" : "") + (s === 0 ? " fr" : "") + (s === 3 ? " lr" : ""));
        c.appendChild(el("span", "cw-vt-n", K.n2(BESSIE[s][b])));
        g.appendChild(c);
      }
    }
    t.appendChild(OB.html("div", "cw-cap", big ? "PREFERENCES " + OB.tex("\\theta") : "OLD BESSIE<br>12 PREFERENCES"));
    return t;
  }

  /* The app's table: the 24 icons above the states and above the preferences; a window of SHOW rows of RH px over a
     list of rows that V.setTop(top) scrolls: index v from top on, v below 0 a household of HH (HH[SHOW + v]), v from 0
     the row v + 1 in counting order. SHOW + 1 row elements are reused; a cell is written only when its text changes. */
  function appTable() {
    var V = { rows: [] }, wrap = el("div", "cw-ap ob-hscroll"), inn = el("div", "cw-ap-in");
    wrap.appendChild(inn);
    V.el = wrap;
    var head = el("div", "cw-ap-grid cw-ap-head");
    V.hs = []; V.hp = [];
    for (var j = 0; j < N; j++) { var hs = el("div", "cw-ap-hs", CW.ICONS[j]); hs.title = CW.NAMES[j]; head.appendChild(hs); V.hs.push(hs); }
    head.appendChild(el("div", ""));
    for (var j2 = 0; j2 < N; j2++) { var hp = el("div", "cw-ap-hp", CW.ICONS[j2]); hp.title = CW.NAMES[j2]; head.appendChild(hp); V.hp.push(hp); }
    inn.appendChild(head);
    V.head = head;
    var win = el("div", "cw-ap-win");
    V.win = win;
    for (var i = 0; i <= SHOW; i++) {
      var row = { el: el("div", "cw-ap-grid cw-ap-r"), s: [], p: [], v: null, ts: [], tp: [] };
      for (var a = 0; a < N; a++) { var sc = el("div", "cw-ap-s"); row.el.appendChild(sc); row.s.push(sc); }
      row.el.appendChild(el("div", "cw-ap-gap"));
      for (var b = 0; b < N; b++) { var pc = el("div", "cw-ap-p"); row.el.appendChild(pc); row.p.push(pc); }
      win.appendChild(row.el);
      V.rows.push(row);
    }
    V.frS = el("div", "cw-ap-fr s");
    V.frP = el("div", "cw-ap-fr p");
    win.appendChild(V.frS);
    win.appendChild(V.frP);
    inn.appendChild(win);
    var caps = el("div", "cw-ap-grid cw-ap-caps");
    V.capS = OB.html("div", "cw-cap cw-ap-cs", "STATE " + OB.tex("s"));
    V.capP = OB.html("div", "cw-cap cw-ap-cp", "PREFERENCES " + OB.tex("\\theta"));
    caps.appendChild(V.capS);
    caps.appendChild(V.capP);
    inn.appendChild(caps);

    function paint(row, s, p) {
      for (var j = 0; j < N; j++) {
        var ts = s ? String(s[j]) : "", tp = p && p[j] !== null ? K.n2(p[j]) : "";
        if (row.ts[j] !== ts) { row.ts[j] = ts; row.s[j].textContent = ts; row.s[j].classList.toggle("lit", ts === "1"); }
        var bl = !!(s && p && p[j] === null);
        if (row.tp[j] !== tp || row.p[j].classList.contains("blank") !== bl) { row.tp[j] = tp; row.p[j].textContent = tp; row.p[j].classList.toggle("blank", bl); }
      }
    }
    function fill(row, v) {
      if (v < 0) { var h = HH[SHOW + v]; paint(row, h.s, h.p); }
      else if (v < ROWS) { var s = stateOf(v + 1); paint(row, s, prefsOf(s, v + 1)); }
      else paint(row, null, null);
    }
    V.top = null;
    V.setTop = function (top) {
      var i0 = Math.floor(top), frac = top - i0;
      V.top = top;
      V.rows.forEach(function (row, i) {
        row.el.style.transform = "translateY(" + ((i - frac) * RH).toFixed(2) + "px)";
        if (row.v !== i0 + i) { row.v = i0 + i; fill(row, i0 + i); }
      });
    };
    /* The cell of row r, product j, when it shows in the window. */
    V.cell = function (r, j) {
      var hit = null;
      V.rows.forEach(function (row) { if (row.v === r - 1) hit = row.p[j]; });
      return hit;
    };
    V.scrolls = function () { return wrap.scrollWidth > wrap.clientWidth + 1; };
    return V;
  }

  /* The count of rows, the arithmetic of the cells, and the numbers to learn. */
  function counter() {
    var C = { el: el("div", "ob-box cw-at-cnt") };
    C.el.appendChild(el("div", "cw-at-cntl", "ROWS"));
    C.n = el("div", "cw-at-cntn", "?");
    C.el.appendChild(C.n);
    return C;
  }
  function formula() {
    var F = { el: el("div", "cw-at-fm") };
    function line(a, op, r, word) {
      var l = el("div", "cw-at-fl"), na = OB.texNumEl(fmt0(a), "cw-at-fa"), nr = OB.texNumEl(fmt0(r), "cw-at-fr");
      l.appendChild(na);
      l.appendChild(OB.html("span", "cw-at-fo", OB.tex(op)));
      l.appendChild(nr);
      l.appendChild(el("span", "cw-at-fw", word));
      F.el.appendChild(l);
      return { el: l, a: na, r: nr };
    }
    F.l1 = line(ROWS, "{}\\times 24 =", CELLS, "CELLS");
    F.l2 = line(CELLS, "{}\\div 2 =", PREFS, "PREFERENCES");
    return F;
  }
  function scoreboard() {
    var S = { el: el("div", "ob-box cw-sb") };
    S.el.appendChild(el("div", "cw-sb-h", "NUMBERS TO LEARN"));
    var g = el("div", "cw-sb-g");
    g.appendChild(el("div", "cw-sb-l", "TABLE"));
    S.table = el("div", "cw-sb-n", fmt0(PREFS));
    g.appendChild(S.table);
    S.el.appendChild(g);
    S.g = g;
    return S;
  }

  /* The states as a square, the states an update visits as a square inside it, the areas to scale. */
  var SQ = 168, SQV = SQ * Math.sqrt(VISITS / ROWS);
  function squares() {
    var Q = { el: el("div", "cw-sq") };
    var big = el("div", "cw-sq-big");
    big.style.width = big.style.height = SQ + "px";
    Q.small = el("div", "cw-sq-v");
    Q.small.style.width = Q.small.style.height = SQV.toFixed(2) + "px";
    big.appendChild(Q.small);
    Q.lab = el("div", "cw-sq-vl");
    Q.lab.innerHTML = "<i></i><span>AT MOST " + fmt0(VISITS) + "<br>VISITED</span>";
    big.appendChild(Q.lab);
    Q.el.appendChild(big);
    Q.big = big;
    Q.cap = el("div", "cw-cap cw-sq-cap");
    Q.n = el("span", "cw-sq-n", fmt0(ROWS));
    Q.cap.appendChild(Q.n);
    Q.cap.appendChild(document.createTextNode(" STATES, AREAS TO SCALE"));
    Q.el.appendChild(Q.cap);
    return Q;
  }

  /* The triangle of the hop, flat: across the hop, 0.2; up the change of the average return, 0.00. The look of the small
     triangle of scene 410 (cw-4learn.js, tri(); its classes in cw-4learn.css). */
  var UW = 176, UH = 122, UX = 20, UY = 104, BX = 36, BY = 58, ACROSS = 92;
  function flat() {
    var svg = OB.svgEl("svg", { viewBox: "0 0 " + UW + " " + UH, width: UW, height: UH, "class": "cw-ut cw-at-flat", "aria-hidden": "true" });
    function add(tag, a, txt) { var e = OB.svgEl(tag, a); if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; }
    add("polyline", { points: UX + ",10 " + UX + "," + UY + " " + (UW - 4) + "," + UY, "class": "cw-utax" });
    add("text", { x: UX, y: 4, "class": "cw-utt" }, "AVERAGE RETURN");
    add("text", { x: UW - 4, y: UY + 15, "class": "cw-utt e" }, "THE PREFERENCE");
    add("line", { x1: BX, y1: BY, x2: BX + ACROSS, y2: BY, "class": "cw-utleg" });
    add("text", { x: BX + ACROSS / 2, y: BY + 17, "class": "cw-utl" }, OB.num(D.HOP, 1));
    add("text", { x: BX + ACROSS + 9, y: BY + 5, "class": "cw-utl s" }, K.n2(0));
    add("circle", { cx: BX, cy: BY, r: 5.5, "class": "cw-utpt b" });
    add("circle", { cx: BX + ACROSS, cy: BY, r: 5.5, "class": "cw-utpt a" });
    return svg;
  }

  function grow(api, e, d, dur) { e.classList.add("ob-hide"); api.show(e, true, { delay: d, dur: dur || 700 }); }

  var L202 = [
    "For Old Bessie, the policy was a table of preferences: one row per state, one column per action. 4 states and 3 actions: 12 preferences.",
    "The same for the app: one row per state, one column per coupon. A habit gets no coupon, so its cell stays blank.",
    "How many rows does the table need, one per state? Guess, then press Count.",
    "Each of the 24 products is a habit or not: \\(2 \\times 2 \\times \\dots \\times 2 = 2^{24} = 16{,}777{,}216\\) states, one row each.",
    "24 cells per row. A product is a habit in half of the states, so half of the cells stay blank.",
    "proto-REINFORCE learns from episodes. An update plays 1,000 households for 12 weeks: they visit at most 12,000 of the 16,777,216 states.",
    "A hop on a preference of a state that no household visits changes no episode: the average return stays the same, and \\(\\nabla = 0\\).",
    "Too many preferences, almost all in states that no household visits, where an update learns nothing. The app needs fewer numbers.",
  ];
  var STREAM = 8000;

  OB.scene({
    key: "pref-table", order: 202, title: "A table of preferences", beats: L202.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      var at = P.at = el("div", "cw-at");
      P.V = appTable();
      at.appendChild(P.V.el);
      var row = el("div", "cw-at-row");
      P.A = el("div", "cw-at-a");
      P.small = bessie(false);
      P.A.appendChild(P.small);
      row.appendChild(P.A);
      P.B = el("div", "cw-at-b");
      P.C = counter();
      P.F = formula();
      P.S = scoreboard();
      P.B.appendChild(P.C.el);
      P.B.appendChild(P.F.el);
      P.B.appendChild(P.S.el);
      row.appendChild(P.B);
      P.Cc = el("div", "cw-at-c");
      P.Q = squares();
      P.Cc.appendChild(P.Q.el);
      P.flat = flat();
      P.Cc.appendChild(P.flat);
      row.appendChild(P.Cc);
      at.appendChild(row);
      P.bigw = el("div", "cw-at-big");
      P.big = bessie(true);
      P.bigw.appendChild(P.big);
      at.appendChild(P.bigw);
      root.appendChild(at);
    },
    beat: function (k, api) {
      var P = this.parts, V = P.V, go = K.live(api, k);
      K.say(P.lead, L202[k], api);
      K.title(P.lead, k < 5 ? "A table of preferences" : "Learning the table", api);

      // Old Bessie's table: big at beat 0; from beat 1 small in the corner, where the big one glides.
      [P.big, P.small].forEach(function (e) { e.style.visibility = ""; e.style.opacity = ""; });
      P.big.classList.toggle("ob-hide", k !== 0);
      P.small.classList.toggle("ob-hide", k < 1);
      if (go && k === 0) grow(api, P.big, 150, 900);
      if (go && k === 1) K.move(api, P.big, P.small, 150, 1300);

      // The app's table: the household rows at beats 1 and 2, the last rows from beat 3.
      [V.head, V.win, V.capS, V.capP].forEach(function (e) { e.classList.toggle("ob-hide", k < 1); e.style.opacity = ""; });
      V.setTop(k >= 3 ? ROWS - SHOW : -SHOW);
      if (go && k === 1) {
        [V.head, V.capS, V.capP].forEach(function (e) { grow(api, e, 900, 700); });
        grow(api, V.win, 1300, 900);
        V.rows.forEach(function (row, i) {
          if (i >= SHOW) return;
          row.el.style.opacity = "0";
          api.at(1500 + 260 * i, function () { api.animate(500, function (p) { row.el.style.opacity = String(p); }, function () { row.el.style.opacity = ""; }); });
        });
      } else V.rows.forEach(function (row) { row.el.style.opacity = ""; });

      // The count of rows.
      api.show(P.C.el, k >= 2, K.opt(go && k === 2, 200));
      P.C.n.textContent = k >= 3 ? fmt0(ROWS) : "?";
      if (k === 2) api.nextLabel("Count");
      if (go && k === 3) {
        V.setTop(-SHOW);
        P.C.n.textContent = "0";
        api.at(300, function () {
          api.animate(STREAM, function (p) {
            var f = Math.pow(ROWS + 1, p) - 1;
            V.setTop(-SHOW + f);
            P.C.n.textContent = fmt0(Math.min(ROWS, Math.ceil(f - 1e-9)));
          }, function () { V.setTop(ROWS - SHOW); P.C.n.textContent = fmt0(ROWS); });
        });
      }

      // The cells and the preferences.
      var F = P.F;
      api.show(F.l1.el, k >= 4, K.opt(go && k === 4, 200, { dur: 700 }));
      api.show(F.l2.el, k >= 4, K.opt(go && k === 4, 1900, { dur: 700 }));
      if (go && k === 4) {
        K.copyTo(api, P.C.n, F.l1.a, 200, 1300);
        K.copyTo(api, F.l1.r, F.l2.a, 1900, 1300);
      }

      // The states an update visits.
      var Q = P.Q;
      api.show(Q.el, k >= 5, K.opt(go && k === 5, 200, { dur: 900 }));
      [Q.small, Q.lab].forEach(function (e) { api.show(e, k >= 5, K.opt(go && k === 5, 1700, { dur: 800 })); });
      if (go && k === 5) {
        K.copyTo(api, P.C.n, Q.n, 500, 1300);
        api.at(2500, function () { if (OB.fx && OB.fx.bump) OB.fx.bump(Q.small, 0.6, 500); });
      }

      // The hop on a preference of a state with no visit: the ring, the flat triangle.
      var cell = V.cell(RING_ROW, RING_COL);
      V.rows.forEach(function (row) { row.p.forEach(function (c) { c.classList.remove("ring"); }); });
      if (cell) cell.classList.toggle("ring", k >= 6);
      api.show(P.flat, k >= 6, K.opt(go && k === 6, 900, { dur: 800 }));
      if (k >= 6 && cell && !V.scrolls() && !K.phone()) {
        var o = { from: "bottom", to: "top", gap: 4, head: 11 };
        if (go && k === 6) o.delay = 500; else o.dur = 1;
        api.arrow("at-hop", cell, P.flat, o);
      } else api.unarrow("at-hop");
      if (k >= 6 && V.scrolls()) V.el.scrollLeft = V.el.scrollWidth;
      else if (k < 6) V.el.scrollLeft = 0;

      // The numbers to learn.
      api.show(P.S.el, k >= 7, K.opt(go && k === 7, 200, { dur: 700 }));
      if (go && k === 7) K.copyTo(api, F.l2.r, P.S.table, 700, 1300);
    },
    /* Left from the last beat: a copy of the view for scene 210 (stage 2), whose weights E take the coupons' columns
       and whose corner takes the numbers to learn (K.handOut; cw-2b-e24.js, handIn210). */
    leave: function (api) {
      var P = this.parts;
      if (!P || api.beat !== L202.length - 1) { K.hand = null; return; }
      K.handOut("pref-table", api.root, { lead: P.lead, score: P.S.el });
    },
  });
})();
</script>
<script>/* cw-2b-e24.js */
/* cw-2b-e24.js: scene 210 of "Coupon of the Week" (main session, 2026-11-20), stage 2 of the three stages of the
   policy that Carlos asked for that day (source/PLAN.md): "we first introduce only E and say that we will abstract the
   table of bets away by using inner products between households and E. Then explain how this would work and show how
   E has fewer parameters than the entire table of bets."

   210 Preferences as inner products (7 beats), in weekend 2's textbook cross, theta = s E:
       0 Reached with Next from the last beat of scene 202, its view hands over (K.handIn): the table's rows and the
         rest fade, the coupons' icons and the numbers to learn glide to their places, and the weights E grow under the
         icons, row by row: one row per product of the state, one column per coupon, 24 x 24 numbers picked at random,
         in the heat colours of the forward pass (K.heat: blue above 0, pink below), explained here for the first time.
       1 The state s of the example household's week 1 on the left, its icons above it.
       2 Tiramisu's column (ringed), the rows of the 4 habits (their icons lit) and the 4 numbers where they cross (lit);
         tiramisu's preference shows "?", the box under the cross the inner product with the 4 numbers. Guess, Compute.
       3 Compute: the 4 numbers fly down into tiramisu's preference, which adds them up.
       4 The preferences of the 20 coupons; the habits' cells blank.
       5 Week 2: tiramisu is a habit. Its 1 comes into s, its row of E is ringed, the preferences roll to their new
         values (each adds tiramisu's number of its column), tiramisu's own preference goes blank.
       6 The numbers to learn: E, 24 x 24 = 576, under the table's 201,326,592. Left with Next, the view hands over to
         scene 220 (leave()), which builds the same cross (K.ex.cross) and closes E's columns into W (stage 3).

   The cross keeps the columns of scene 202's table, so the coupons' icons stand where the table's stood. These weights
   E24 belong to this scene only (the policy of the page has E with 2 rows, scene 220): picked as CW.randomWeights picks
   weights, one decimal, uniform in [-1, 1], from CW.rng(SEED), row by row. SEED = 25 is the first seed from 1 on (check()
   below asserts it) for which the 4 numbers of tiramisu's column in the rows of week 1's habits are not 0, all differ,
   carry both signs and add up to at least 0.4, a sum that none of them equals, and tiramisu's row has at most one 0
   among week 2's coupons: 0.90 + (-0.30) + 0.70 + (-0.50) = 0.80. */
(function () {
  "use strict";
  var OB = window.OB, CW = window.CW, K = OB.cw, el = OB.el;
  if (!K || !K.EP) { console.error("cw-2b-e24: cw-0kit.js or cw-1game.js is missing"); return; }

  var N = CW.N, EP = K.EP, S1 = EP.weeks[0].s, S2 = EP.weeks[1].s, A1 = EP.weeks[0].a;
  var SEED = 25, NE = N * N, PREFS = Math.pow(2, N) * N / 2;
  var fmt0 = function (x) { return OB.num(x, 0); };
  var r2 = function (x) { return Math.round(x * 100) / 100; };
  /* A number in a sum of a worked line: in parentheses when negative. */
  var par = function (s) { return s.charAt(0) === "-" ? "(" + s + ")" : s; };
  function habitsOf(s) { var h = []; s.forEach(function (b, j) { if (b) h.push(j); }); return h; }
  var H1 = habitsOf(S1), H2 = habitsOf(S2), NC = N - H1.length;

  /* The weights E, 24 x 24: row j for product j of the state, column a for coupon a. */
  function pick(seed) {
    var g = CW.rng(seed), E = [];
    for (var j = 0; j < N; j++) { var row = []; for (var a = 0; a < N; a++) row.push(Math.round((g() * 2 - 1) * 10) / 10 + 0); E.push(row); }
    return E;
  }
  /* theta = s E: for each coupon the inner product of s and its column; a habit's preference blank (null). */
  function thetaOf(E, s) {
    var out = [];
    for (var a = 0; a < N; a++) {
      if (s[a]) { out.push(null); continue; }
      var x = 0;
      for (var j = 0; j < N; j++) if (s[j]) x += E[j][a];
      out.push(r2(x));
    }
    return out;
  }
  /* The criteria of SEED. */
  function fits(E) {
    var col = H1.map(function (j) { return E[j][A1]; }), sum = r2(col.reduce(function (x, y) { return x + y; }, 0));
    var zeros = E[A1].filter(function (v, a) { return !S2[a] && v === 0; }).length;
    return col.every(function (v, i) { return v !== 0 && col.indexOf(v) === i; }) && col.some(function (v) { return v < 0; }) &&
      col.some(function (v) { return v > 0; }) && sum >= 0.4 && col.indexOf(sum) < 0 && zeros <= 1;
  }
  var E24 = pick(SEED), TH1 = thetaOf(E24, S1), TH2 = thetaOf(E24, S2);
  var COL = H1.map(function (j) { return E24[j][A1]; });
  (function check() {
    if (!fits(E24)) console.error("cw-2b-e24: the weights of seed " + SEED + " no longer meet their criteria");
    for (var sd = 1; sd < SEED; sd++) if (fits(pick(sd))) { console.error("cw-2b-e24: seed " + sd + " meets the criteria before seed " + SEED); break; }
    if (S2[A1] !== 1 || H2.length !== H1.length + 1) console.error("cw-2b-e24: week 2's state is not week 1's with " + K.name(A1));
  })();

  function placer(g) {
    return function (e, row, col, rows, cols) {
      e.style.gridRow = row + (rows ? " / span " + rows : "");
      e.style.gridColumn = col + (cols ? " / span " + cols : "");
      g.appendChild(e);
      return e;
    };
  }

  /* The numbers to learn, as in scene 202 (cw-2a-table.js, scoreboard()), with a row for E that shows from beat 6. */
  function scoreboard() {
    var S = { el: el("div", "ob-box cw-sb cw-ex-sb") };
    S.el.appendChild(el("div", "cw-sb-h", "NUMBERS TO LEARN"));
    var g = el("div", "cw-sb-g");
    g.appendChild(el("div", "cw-sb-l", "TABLE"));
    g.appendChild(el("div", "cw-sb-n", fmt0(PREFS)));

    S.eN = el("div", "cw-sb-n", fmt0(NE));

    g.appendChild(S.eN);
    S.el.appendChild(g);

  /* The cross theta = s E. Columns: the state's 24 (11 px), E's row icons (14 px), E's and theta's 24 (34 px), as in the

     captions. The corner left of E (rows 1 to 25, columns 1 to 24) holds E's name and its colours, the count of its
     numbers (beat 6) and the numbers to learn. */
  var R_E = 2, R_SIC = 27, R_S = 28, R_CAP = 29, C_RIC = 25, C_E = 26;
  function cross() {
    var X = { ic: [], ric: [], rows: [], e: [], en: [], sic: [], s: [], sn: [], th: [], thn: [] };
    var wrap = el("div", "cw-exw ob-hscroll"), g = el("div", "cw-ex"), put = placer(g);
    wrap.appendChild(g);
    X.el = wrap;
    X.g = g;
    X.put = put;
    X.icr = put(el("div", "cw-ex-sub cw-ex-icr"), 1, C_E, 1, N);
    for (var a = 0; a < N; a++) { var ic = el("div", "cw-ex-ic", CW.ICONS[a]); ic.title = CW.NAMES[a]; X.icr.appendChild(ic); X.ic.push(ic); }
    for (var j = 0; j < N; j++) {
      var ri = put(el("div", "cw-ex-ric", CW.ICONS[j]), R_E + j, C_RIC);
      ri.title = CW.NAMES[j];
      X.ric.push(ri);
      var row = put(el("div", "cw-ex-sub cw-ex-row" + (j === 0 ? " top" : "") + (j === N - 1 ? " bot" : "")), R_E + j, C_E, 1, N);
      var cells = [], nums = [];
      for (var b = 0; b < N; b++) {
        var c = el("div", "cw-ex-e"), n = el("span", "cw-tn", K.wf(E24[j][b]));
        c.style.background = K.heat(E24[j][b]);
        c.appendChild(n);
        row.appendChild(c);
        cells.push(c);
        nums.push(n);
      }
      X.rows.push(row);
      X.e.push(cells);
      X.en.push(nums);
    }
    X.sicr = put(el("div", "cw-ex-sub s cw-ex-sicr"), R_SIC, 1, 1, N);
    X.sr = put(el("div", "cw-ex-sub s"), R_S, 1, 1, N);
    X.thr = put(el("div", "cw-ex-sub"), R_S, C_E, 1, N);
    for (var i = 0; i < N; i++) {
      var si = el("div", "cw-ex-sic", CW.ICONS[i]);
      si.title = CW.NAMES[i];
      X.sicr.appendChild(si);
      X.sic.push(si);
      var ends = (i === 0 ? " first" : "") + (i === N - 1 ? " last" : "");
      var sc = el("div", "cw-ex-s" + ends), sn = el("span", "", "0");
      sc.appendChild(sn);
      X.sr.appendChild(sc);
      X.s.push(sc);
      X.sn.push(sn);
      var tc = el("div", "cw-ex-th" + ends), tn = el("span", "cw-tn", "");
      tc.appendChild(tn);
      X.thr.appendChild(tc);
      X.th.push(tc);
      X.thn.push(tn);
    }
    X.pad = el("span", "cw-pad");
    X.th[A1].appendChild(X.pad);
    X.capS = put(OB.html("div", "cw-cap cw-ex-cap", "STATE " + OB.tex("s")), R_CAP, 1, 1, N);
    X.capT = put(OB.html("div", "cw-cap cw-ex-cap", "PREFERENCES " + OB.tex("\\theta = s E")), R_CAP, C_E, 1, N);
    // The rings: tiramisu's column with its icon (beats 2 and 3), tiramisu's row with its icon (beat 5).
    X.colRing = put(el("div", "cw-ex-ring"), 1, C_E + A1, R_E + N - 1, 1);
    X.rowRing = put(el("div", "cw-ex-ring"), R_E + A1, C_RIC, 1, N + 1);
    // The corner: E's name, its colours from -1 to 1, the count of its numbers; at the bottom the numbers to learn.
    var corner = put(el("div", "cw-ex-corner"), 1, 1, R_E + N - 1, N), top = el("div", "cw-ex-ctop");
    X.top = top;
    X.name = OB.html("div", "cw-ex-name", OB.tex("E"));
    top.appendChild(X.name);
    X.key = el("div", "cw-ex-key");
    var bar = el("div", "cw-ex-bar");
    bar.style.background = "linear-gradient(to right, " + K.heat(-1) + ", " + K.heat(0) + ", " + K.heat(1) + "), #FFFFFF";
    X.key.appendChild(bar);
    var ticks = el("div", "cw-ex-ticks");
    [-1, 0, 1].forEach(function (v) { ticks.appendChild(el("span", "", OB.num(v, 0))); });
    X.key.appendChild(ticks);
    top.appendChild(X.key);
    X.cnt = el("div", "cw-at-fl cw-ex-cnt");
    X.cnt.appendChild(OB.html("span", "cw-at-fo", OB.tex("24 \\times 24 =")));
    X.cntR = OB.texNumEl(fmt0(NE), "cw-at-fr");
    X.cnt.appendChild(X.cntR);
    X.cnt.appendChild(el("span", "cw-at-fw", "NUMBERS"));
    top.appendChild(X.cnt);
    corner.appendChild(top);
    X.S = scoreboard();
    corner.appendChild(X.S.el);
    X.scrolls = function () { return wrap.scrollWidth > wrap.clientWidth + 1; };
    /* On a phone: the column of coupon a in view, near the right edge (as cross2 of cw-2policy.js). */
    X.focus = function (a) {
      if (!X.scrolls()) return;

      wrap.scrollLeft = Math.max(0, wrap.scrollLeft + cr.right - wr.right + 24);
    };
    return X;
  }
  /* For scene 220 (cw-2policy.js, stage 3): the same cross, so that this scene's last frame is 220's first. */
  K.ex = { cross: cross, R_E: R_E, R_SIC: R_SIC, R_S: R_S, R_CAP: R_CAP, C_RIC: C_RIC, C_E: C_E };

  /* The box under the cross: the inner product in general, then tiramisu's with its 4 numbers. */
  function box(P) {
    var f = el("div", "ob-box cw-fbox cw-ex-f");
    f.appendChild(OB.html("div", "cw-fgen", OB.tex("\\theta_{s,a} = s_1\\, e_{1,a} + s_2\\, e_{2,a} + \\dots + s_{24}\\, e_{24,a}")));
    var terms = COL.map(function (v, i) { return (i ? "+ " : "") + par(K.wf(v)); }).join(" ");
    var line = OB.html("div", "cw-fnum", K.thsym(A1) + " " + OB.tex("= " + terms + " =\\;"));
    P.res = el("span", "ob-texn cw-fres", "?");

    f.appendChild(line);

  }

  function grow(api, e, d, dur) { e.classList.add("ob-hide"); api.show(e, true, { delay: d, dur: dur || 700 }); }
  function bare(list, on) { list.forEach(function (e) { e.classList.toggle("ob-hide", !on); e.style.opacity = ""; }); }
  function bump(e) { if (OB.fx && OB.fx.bump) OB.fx.bump(e, 0.3, 360); }

  /* 210 reached with Next from the last beat of scene 202: 202's view, laid over this one by K.handIn, hands over. Its
     lead line fades first (as in scene 410), its coupons' icons glide to E's columns and its numbers to learn to the
     corner; the rest of it fades while the new lead line comes; then E grows row by row (beat(), from 700 ms). */
  function handIn210(X, P, H, api) {
    api.fade(H.part("lead"), false, { dur: 250 });
    var icons = H.el.querySelectorAll(".cw-ap-head .cw-ap-hp");
    for (var a = 0; a < icons.length && a < N; a++) K.glide(api, icons[a], X.ic[a], { dur: 1100 });

  var NM = K.name(A1);
  var L210 = [
    "The weights \\(E\\) replace the table: a row per product, a column per coupon, \\(24 \\times 24\\) numbers picked at random. Blue above 0, pink below 0.",
    "The state \\(s\\) of week 1 comes on the left of \\(E\\), as in weekend 2's cross. Its preferences come out under \\(E\\): \\(\\theta = s E\\).",
    "The preference for " + NM + ": the inner product of \\(s\\) and " + NM + "'s column. Only the " + H1.length + " habits count, where \\(s\\) has a 1. Guess, then press Compute.",
    "The " + H1.length + " lit numbers add up to the preference for " + NM + ": " + K.n2(TH1[A1]) + ".",
    "\\(\\theta = s E\\): the preferences of the " + NC + " coupons, each the sum of its column's numbers in the habits' rows. A habit gets no coupon.",
    "Week 2: " + NM + " is a habit now, so its row of \\(E\\) counts too. The same \\(E\\) gives every state its preferences, also states no household visits.",
    "The numbers to learn: \\(24 \\times 24 = 576\\) in \\(E\\), in place of the table's 201,326,592 preferences.",
  ];
  var ARROWS = ["ex-s", "ex-e"];

  OB.scene({
    key: "e-alone", order: 210, title: "Preferences as inner products", beats: L210.length,
    build: function (root) {
      root.classList.add("cw-root");
      var P = this.parts = {};
      P.lead = K.lead(root);
      var st = el("div", "cw-ex-stage");
      P.X = cross();
      st.appendChild(P.X.el);
      P.f = box(P);
      st.appendChild(P.f);
      root.appendChild(st);
    },
    beat: function (k, api) {
      var P = this.parts, X = P.X, go = K.live(api, k);
      var H = k === 0 ? K.handIn(api, "pref-table", 2600) : null;
      K.say(P.lead, L210[k], H ? null : api);
      var wk2 = k >= 5, st = wk2 ? S2 : S1, th = wk2 ? TH2 : TH1, hab = wk2 ? H2 : H1, tir = k === 2 || k === 3;

      // E, its icons, its corner and the numbers to learn, from beat 0.
      X.ic.concat([X.S.el]).forEach(function (e) { e.style.visibility = ""; });
      bare([X.icr, X.name, X.key, X.S.el].concat(X.ric, X.rows), true);
      if (go && k === 0) {
        var d = H ? 700 : 300;
        if (!H) { grow(api, X.icr, 150); grow(api, X.S.el, 200); }
        grow(api, X.name, d);
        grow(api, X.key, d + 200);
        for (var j = 0; j < N; j++) { grow(api, X.ric[j], d + 60 * j, 600); grow(api, X.rows[j], d + 60 * j, 600); }
        if (H) handIn210(X, P, H, api);
      }

      // The state s and its icons from beat 1; the caption of theta with them, where the preferences will come.
      bare(X.sic.concat(X.s, [X.capS, X.capT]), k >= 1);
      for (var i = 0; i < N; i++) { X.sn[i].textContent = String(st[i]); X.s[i].classList.toggle("lit", !!st[i]); }
      if (go && k === 1) {
        grow(api, X.capS, 200);
        grow(api, X.capT, 1300);
        for (var i2 = 0; i2 < N; i2++) { grow(api, X.sic[i2], 200 + 40 * i2); grow(api, X.s[i2], 260 + 40 * i2); }
      }

      // theta: tiramisu's alone at beats 2 and 3 ("?" at 2), every coupon's from beat 4; week 2's from beat 5.
      X.th.forEach(function (c, a) {
        c.classList.toggle("ob-hide", !(k >= 4 || (tir && a === A1)));
        c.style.opacity = "";
        c.classList.toggle("blank", th[a] === null);
        X.thn[a].textContent = th[a] === null ? "" : k === 2 && a === A1 ? "?" : K.n2(th[a]);
      });
      X.th[A1].classList.toggle("solo", tir);
      X.th[A1].classList.toggle("lit", tir);
      if (go && k === 2) grow(api, X.th[A1], 300);
      if (go && k === 4) X.th.forEach(function (c, a) { if (a !== A1) grow(api, c, 200 + 50 * a); });

      // The lights: tiramisu's column and the habits' rows from beat 2, their crossings at beats 2 and 3.

      if (go && k === 2) grow(api, X.colRing, 200);
      X.ic.forEach(function (e, a) { e.classList.toggle("lit", tir && a === A1); });
      X.ric.forEach(function (e, j2) { e.classList.toggle("lit", k >= 2 && hab.indexOf(j2) >= 0); });
      X.e.forEach(function (row, j3) { row[A1].classList.toggle("lit", tir && H1.indexOf(j3) >= 0); });
      if (tir && !X.scrolls()) {
        var o = function (dl, from, to) { var a = { from: from, to: to, gap: 3, head: 11 }; if (go && k === 2) a.delay = dl; else a.dur = 1; return a; };
        api.arrow("ex-s", X.s[N - 1], X.th[A1], o(500, "right", "left"));
        api.arrow("ex-e", X.e[N - 1][A1], X.th[A1], o(700, "bottom", "top"));
      } else ARROWS.forEach(function (id) { api.unarrow(id); });
      if (X.scrolls()) { if (tir) X.focus(A1); else X.el.scrollLeft = 0; }

      // The box: tiramisu's inner product, beats 2 to 4.
      api.show(P.f, k >= 2 && k <= 4, K.opt(go && k === 2, 900));
      P.res.textContent = k >= 3 ? K.n2(TH1[A1]) : "?";
      P.res.classList.toggle("done", k >= 3);
      if (k === 2) api.nextLabel("Compute");

      // 3, Compute: the lit numbers fly down one after the other into tiramisu's preference, which adds them up.
      if (go && k === 3) {
        X.thn[A1].textContent = "0.00";
        P.res.textContent = "?";
        P.res.classList.remove("done");
        var sum = 0;
        H1.forEach(function (j4, h) {
          var dl = 250 + 520 * h;
          sum = r2(sum + E24[j4][A1]);
          var part = sum;
          api.fly(X.en[j4][A1], X.pad, { delay: dl, arc: 30 });
          api.at(dl + OB.DUR.fly, function () { X.thn[A1].textContent = K.n2(part); bump(X.thn[A1]); });
        });
        api.at(250 + 520 * (H1.length - 1) + OB.DUR.fly + 250, function () { P.res.textContent = K.n2(TH1[A1]); P.res.classList.add("done"); bump(P.res); });
      }

      // 5, week 2: tiramisu's 1 comes into s, its row is ringed, the preferences roll; tiramisu's goes blank.
      bare([X.rowRing], k === 5);
      if (go && k === 5) {
        X.sn[A1].textContent = "0";
        X.s[A1].classList.remove("lit");
        X.ric[A1].classList.remove("lit");
        api.at(300, function () { X.sn[A1].textContent = "1"; X.s[A1].classList.add("lit"); bump(X.s[A1]); });
        api.at(700, function () { X.ric[A1].classList.add("lit"); bump(X.ric[A1]); });
        grow(api, X.rowRing, 700, 600);
        X.th[A1].classList.remove("blank");
        X.thn[A1].textContent = K.n2(TH1[A1]);
        api.at(1300, function () { X.th[A1].classList.add("blank"); X.thn[A1].textContent = ""; });
        X.th.forEach(function (c, a) {
          if (TH2[a] !== null) api.roll(X.thn[a], TH2[a], { from: TH1[a], fmt: K.n2, delay: 1400, dur: 1500 });
        });
        P.f.classList.remove("ob-hide");
        api.fade(P.f, false, { dur: 600 });
      }

      // 6: the count of E's numbers, which flies into the numbers to learn.
      bare([X.cnt], k >= 6);
      [X.S.eL, X.S.eN].forEach(function (e) { e.classList.toggle("ob-gone", k < 6); });
      if (go && k === 6) {
        grow(api, X.cnt, 200, 700);
        grow(api, X.S.eL, 1300, 600);
        K.copyTo(api, X.cntR, X.S.eN, 1300, 1300);
      }
    },

       cw-2policy.js); its lead line is named, to fade first. */
    leave: function (api) {

      K.handOut("e-alone", api.root, { lead: P.lead });
    },
  });
})();

<script>/* cw-2policy.js */
/* cw-2policy.js: the policy, scenes 200 to 299 of "Coupon of the Week" (main session, 2026-11-18). The policy is a
   chain, drawn in weekend 2's textbook cross (Carlos, 2026-11-18: "The row describing the household, then the matrix
   W, then the matrix E. In that way, the household representation becomes a two-dimensional representation, and then
   that two-dimensional representation becomes then a vector of bets over the products. And then the softmax converts
   that into a probability table"): the state s, a row of 24 numbers; z = s W with W 24 x 2, one row per product; the
   preferences theta = z E with E 2 x 24, one column e_a per product (the items' matrix of weekend 2: one row per
   dimension, one column per item); softmax gives the probabilities. coupon.js stores W as 2 rows and E as 24 rows, so
   the page shows W[r][j] in row j, column r and E[a][c] in row c, column a.
