     a column per week. opts.names (the rows' names at the left), opts.head (the weeks' numbers above),
     opts.weights (the row of weights GAMMA to the power t - 1). On a phone the table turns: a row per week.
     Returns { grid, s: [], a: [], r: [], w: [], head: [], loop } (loop: the orange ring around the rewards). */
  var ROW = { head: 1, s: 2, a: 3, r: 4, w: 5 };
  var NAMES = { head: "WEEK", s: "STATE", a: "ACTION", r: "REWARD", w: "WEIGHT" };
  function runTable(run, opts) {
    opts = opts || {};
    var g = el("div", "s2-tab" + (opts.names ? " named" : "") + (opts.cls ? " " + opts.cls : ""));
    var T = { grid: g, s: [], a: [], r: [], w: [], head: [] };

      });

  OB.s2 = { phone: phone, place: place, num: num, face: face, hang: hang, seq: seq, grow: grow, sketchRun: sketchRun,
    stepParts: stepParts, runTable: runTable, sweep: sweep };

  /* 100. Episodes (sketch page 18): the sequence S1, a1, S2, $r1, a2, S3, $r2, ... built in the four numbered, coloured
     steps, one step a beat. Symbols and formulas by KaTeX (tex.js), in LaTeX's standard font. */
  var CAP100 = [
    "An episode starts in a state, " + OB.tex("S_1") + ".",
    "<span class=\"s2-c1\">1.</span> You choose an action, " + OB.tex("a_1") + ".",
    "<span class=\"s2-c2\">2.</span> The transition dynamics give the new state " + OB.tex("S_2") + " and the reward " + OB.tex("\\$r_1") + ".",
    "<span class=\"s2-c3\">3.</span> You choose the next action, " + OB.tex("a_2") + ".",
    "<span class=\"s2-c4\">4.</span> The transition dynamics give " + OB.tex("S_3") + " and " + OB.tex("\\$r_2") + ".",
    "And so on. The whole sequence is an episode."
  ];
  OB.scene({
    page: 2, key: "runs", order: 100, title: "Episodes", beats: 6,
    build: function (root) {
      root.appendChild(el("p", "ob-say s2-lead", "When you act on an MDP, you generate an episode."));
      var q = this.q = sketchRun("s2-big");
      var td = el("span", "s2-tdname", "TRANSITION DYNAMICS");
      q.cols[3].val.appendChild(td);
      q.cols[3].val.classList.add("s2-span2");

    },
    beat: function (k, api) {

      for (var n = 1; n <= 4; n++) {
        var parts = stepParts(q, n), on = k >= n, fresh = on && k === n && api.forward && api.from === n - 1;
        parts.forEach(function (e, j) {
          if (!on) { api.show(e, false); return; }
          if (!fresh) { api.show(e, true); return; }
          // the arrow grows, then the marks around it, then its target
          if (j === 1) { api.show(e, true, { dur: 10 }); grow(api, q.cols[2 * n - 1].arr); }
          else api.show(e, true, { delay: j === 3 ? 1200 : 500 });
        });
      }
      api.show(this.td, k >= 2, k === 2 && api.forward ? { delay: 1400 } : undefined);
      api.show(q.cols[9].cell, k >= 5);
      this.cap.innerHTML = CAP100[k];
      if (api.forward && !api.instant && api.from === k - 1) api.fade(self.cap, true, { dur: 900 });
    }
  });

  /* 200. An episode of Old Bessie: the same notation with the values of episode 0 (D.run) beneath the symbols, the
     first two weeks slowly, step by step; then the whole quarter, 13 weeks, quickly, as a table of weeks. */
  var R = D.run;
  function cap200(k) {
    var st = B.STATES, ac = B.ACTIONS;
    return [
      "Old Bessie starts the quarter " + st[R.states[0]] + ".",
      "<span class=\"s2-c1\">1.</span> You choose " + ac[R.actions[0]] + ".",
      "<span class=\"s2-c2\">2.</span> The transition dynamics give " + st[R.states[1]] + " and " + OB.money(R.rewards[0]) + ".",
      "<span class=\"s2-c3\">3.</span> You choose " + ac[R.actions[1]] + ".",
      "<span class=\"s2-c4\">4.</span> The transition dynamics give " + st[R.states[2]] + " and " + OB.money(R.rewards[1]) + ".",
      "And so on, week after week. One quarter, 13 weeks: one episode."
    ][k];
  }
  OB.scene({
    page: 2, key: "bessie-run", order: 200, title: "An episode of Old Bessie", beats: 6,
    build: function (root) {
      var q = this.q = sketchRun("s2-vals");
      function vanOf(s) { return art.van(s, { size: 72, gauge: false, label: true }); }
      function reward(x) { var m = OB.moneyEl(x); m.classList.add("s2-rv"); return m; }
      this.v = [
        vanOf(R.states[0]), art.actionChip(R.actions[0]), reward(R.rewards[0]), vanOf(R.states[1]),
        art.actionChip(R.actions[1]), reward(R.rewards[1]), vanOf(R.states[2])
      ];
      // values beneath S1, a1, $r1, S2, a2, $r2, S3 (columns 0, 2, 3, 4, 6, 7, 8)
      [0, 2, 3, 4, 6, 7, 8].forEach(function (c, j) { q.cols[c].val.appendChild(this.v[j]); }, this);
      root.appendChild(q.grid);
      this.T = runTable(R, { names: true, head: true });
      this.T.grid.classList.add("s2-quarter");
      root.appendChild(this.T.grid);
      this.cap = OB.html("p", "ob-say s2-cap", cap200(0));
      root.appendChild(this.cap);
    },
    beat: function (k, api) {
      var self = this, fwd = api.forward && !api.instant && api.from === k - 1;
      // which values each beat shows: 0 S1; 1 a1; 2 $r1 and S2; 3 a2; 4 $r2 and S3
      var at = [0, 1, 2, 2, 3, 4, 4];
      this.v.forEach(function (e, j) {
        var on = k >= at[j];
        api.show(e, on, on && fwd && k === at[j] ? { delay: j === 3 || j === 6 ? 900 : 300 } : undefined);
        if (on && fwd && k === at[j]) api.at(j === 3 || j === 6 ? 900 : 300, function () { api.ring(e, true); });
        else api.ring(e, false);
      });
      var all = k >= 5;
      if (!all) sweep(api, this.T, false);
      else if (fwd) sweep(api, this.T, true, { stagger: 140, delay: 200 });
      else sweep(api, this.T, true);
      ["head", "s", "a", "r"].forEach(function (kd) { api.show(self.T["name_" + kd], all); });
      this.cap.innerHTML = cap200(k);
      if (fwd) api.fade(this.cap, true, { dur: 900 });
    }
  });

  /* 300. Episodes are random (sketch page 19): the deterministic policy B.EXAMPLE (RUN until it fails) as a column;
     three episodes generated by following the same policy, each different; then they fold into the episode symbol
     (runs.js); then ten episodes. */
  var CAP300 = [
    "A deterministic policy gives one action for each state. Press Play.",
    "Episode 1.",
    "Episode 2: the same policy, a different episode.",
    "Episode 3: different again.",
    "One row per episode: a cell per week, coloured by the van's state, with the action inside.",
    "Ten episodes of the same policy: ten different episodes."
  ];
  OB.scene({
    page: 2, key: "random", order: 300, title: "Episodes are random!", beats: 6,
    build: function (root) {
      root.appendChild(el("p", "ob-say s2-lead", "Even when you follow a deterministic policy, you get different episodes."));
      var main = el("div", "s2-random");
      var col = el("div", "s2-strat ob-box");
      col.appendChild(el("div", "s2-strat-h", "POLICY"));
      for (var s = 0; s < 4; s++) {
        var r = el("div", "s2-strat-r");
        r.appendChild(art.stateChip(s));
        r.appendChild(art.actionChip(B.EXAMPLE[s]));
        col.appendChild(r);
      }
      main.appendChild(col);
      var area = el("div", "s2-area");
      var tabs = el("div", "s2-tabs");
      this.tabs = [];
      for (var i = 0; i < 3; i++) {
        var wrap = el("div", "s2-runwrap");
        wrap.appendChild(el("div", "s2-runlab", "EPISODE " + (i + 1)));
        var T = runTable(D.runs[i], { head: i === 0, cls: "s2-small" });
        wrap.appendChild(T.grid);
        T.wrap = wrap;
        tabs.appendChild(wrap);
        this.tabs.push(T);
      }
      area.appendChild(tabs);
      var sym = el("div", "s2-symwrap");
      this.block = OB.runs.block(D.runs, { g1: false });
      sym.appendChild(this.block);
      this.legend = OB.runs.legend();
      sym.appendChild(this.legend);
      area.appendChild(sym);
      main.appendChild(area);
      root.appendChild(main);
      this.sym = sym;
      this.cap = OB.html("p", "ob-say s2-cap", CAP300[0]);
      root.appendChild(this.cap);
    },
    beat: function (k, api) {
      var self = this, fwd = api.forward && !api.instant && api.from === k - 1;
      if (k <= 2) api.nextLabel("Play");
      var folded = k >= 4;
      this.tabs.forEach(function (T, i) {
        var on = !folded && k >= i + 1;
        if (!on) { T.wrap.classList.add("ob-hide"); return; }
        T.wrap.classList.remove("ob-hide");
        T.wrap.style.opacity = "";
        if (fwd && k === i + 1) { sweep(api, T, false); sweep(api, T, true, { stagger: 110 }); }
        else sweep(api, T, true);
      });
      // the episode symbol: hidden before the fold, three rows at the fold, ten rows after
      this.sym.classList.toggle("ob-hide", !folded);
      var head = this.block.querySelector(".runs-head");
      api.show(head, folded);
      api.show(this.legend, folded, folded && fwd && k === 4 ? { delay: 1600 } : undefined);
      this.block.rows.forEach(function (r, i) {
        var on = i < 3 ? folded : k >= 5;
        if (!on) { r.classList.add("ob-hide"); r.style.visibility = ""; return; }
        if (fwd && k === 4 && i < 3) {
          // the table of episode i shrinks into its row of the symbol
          r.classList.remove("ob-hide");
          api.fly(self.tabs[i].grid, r, { arc: 0, dur: 1600 });
        } else if (fwd && k === 5 && i >= 3) {
          api.show(r, true, { delay: (i - 3) * 220 });
        } else {
          r.classList.remove("ob-hide");
          r.style.visibility = "";
        }
      });
      this.cap.innerHTML = CAP300[k];
      if (fwd) api.fade(this.cap, true, { dur: 900 });
    }
  });
})();
</script>
<script>/* sec2b.js */
/* sec2b.js: page 2, scenes 500 "Return" and 600 "Discounted return" (agent A3, 2026-11-14), from Carlos's sketch
   pages 20 and 21. Until 2026-11-17 the page said "cumulative reward" ("Cumulative reward in practice" for 600) and
   one small line added the textbooks' name, the return; since then it says return, the official term (TERMINOLOGY.md).
   The worked episode is episode 0 of sec2-data.js (D.run). */
(function () {
  "use strict";
  var OB = window.OB, art = OB.art, el = OB.el, D = OB.sec2, S2 = OB.s2;
  var R = D.run;
  /* Formulas by KaTeX (tex.js); an amount inside a formula as TeX. */
  var tex = OB.tex, G1 = tex("G_1");
  function tm(x) { return OB.texNum(OB.money(x)); }
  /* The sums of an episode: their result rolls in the face of the formulas (OB.texFmt). */
  var moneyT = OB.texFmt(function (x) { return OB.money(x); });

  /* The sketch's episode of page 20, in ink: S1, a1, S2, a2, S3, a3, ... with $r1 and $r2 below their arrows. */
  function inkRun() {
    function L(bot) { return { link: true, top: null, bot: bot }; }
    return S2.seq([
      { sym: tex("S_1") }, L(null), { sym: tex("a_1") }, L(S2.hang(1)),
      { sym: tex("S_2") }, L(null), { sym: tex("a_2") }, L(S2.hang(2)),
      { sym: tex("S_3") }, L(null), { sym: tex("a_3") }, L(null), { sym: tex("\\dots"), cls: "s2-dots" }
    ], "s2-ink");
  }
  function bigDown() { return el("div", "s2-bigdown"); }

  /* 500. Return (sketch page 20). */
  var CAP500 = [
    "An episode, and the rewards it collects on the way.",
    "Gather all the rewards of the episode.",
    "Add them up: the episode's return, " + G1 + ".",
    "Old Bessie's episode of 13 weeks. What is its " + G1 + "? Guess, then press Compute.",
    "Its return: " + tex("G_1 = " + tm(D.sum)) + "."
  ];
  OB.scene({
    page: 2, key: "cumulative", order: 500, title: "Return", beats: 5,
    build: function (root) {
      var area = el("div", "s2-area s2-cumarea");
      var q = this.q = inkRun();
      this.qloop = S2.place(el("div", "s2-loop ob-hide"), 3, "4 / span 10");
      q.grid.appendChild(this.qloop);
      area.appendChild(q.grid);
      this.T = S2.runTable(R, { names: true, head: true });
      area.appendChild(this.T.grid);
      root.appendChild(area);
      this.down = bigDown();
      root.appendChild(this.down);
      var f = this.f = el("div", "s2-formula");
      f.appendChild(OB.html("span", "", tex("G_1 = \\$r_1 + \\$r_2 + \\dots + \\$r_{13}")));
      this.res = el("span", "s2-res");
      this.res.appendChild(OB.texEl("\\;=\\;"));
      this.sum = OB.moneyEl(D.sum);
      this.sum.classList.add("ob-texn");
      this.sum.textContent = moneyT(D.sum);
      this.res.appendChild(this.sum);
      f.appendChild(this.res);
      root.appendChild(f);
      this.name = OB.html("p", "ob-note s2-name2", "the return of the episode");
      root.appendChild(this.name);
      this.cap = OB.html("p", "ob-say s2-cap", CAP500[0]);
      root.appendChild(this.cap);
    },
    beat: function (k, api) {
      var fwd = api.forward && !api.instant && api.from === k - 1, T = this.T, q = this.q;
      var bessie = k >= 3;
      q.grid.classList.toggle("ob-hide", bessie);
      if (bessie) {
        T.grid.classList.remove("ob-hide");
        if (fwd && k === 3) { S2.sweep(api, T, false); S2.sweep(api, T, true, { stagger: 120, delay: 300 }); }
        else S2.sweep(api, T, true);
      } else T.grid.classList.add("ob-hide");
      api.show(this.qloop, !bessie && k >= 1);
      api.show(T.loop, k >= 4);
      api.show(this.down, k >= 2, fwd && k === 2 ? { delay: 200 } : undefined);
      api.show(this.f, k >= 2, fwd && k === 2 ? { delay: 900 } : undefined);
      api.show(this.name, k >= 2, fwd && k === 2 ? { delay: 1800 } : undefined);
      if (k === 3) api.nextLabel("Compute");
      api.show(this.res, k >= 4, fwd && k === 4 ? { delay: 900 } : undefined);
      /* Compute: with motion, each week's reward flies into the total, which counts up as it lands (juice.js, tally;
         design/arcade-marquee-motion); without it the total rolls as before. */
      var tallied = k === 4 && fwd && OB.fx && OB.fx.tally && OB.fx.tally(T.r.map(function (c) { return c.querySelector(".ob-money") || c; }),
        R.rewards, this.sum, D.sum, moneyT, { delay: 900, stagger: 90, dur: 600 });
      if (k >= 4 && !tallied) api.roll(this.sum, D.sum, fwd && k === 4 ? { from: 0, delay: 900, fmt: moneyT } : { fmt: moneyT });
      this.cap.innerHTML = CAP500[k];
      /* with the tally, the sentence that gives the return waits until the total has counted up (2.6 s), so that the
         room's guesses meet the count first (design/arcade-marquee-motion) */
      if (tallied) { this.cap.style.opacity = "0"; api.fade(this.cap, true, { delay: 2600, dur: 600 }); }
      else if (fwd) api.fade(this.cap, true, { dur: 900 });
    }
  });

  /* 600. Discounted return (sketch page 21): the rewards weighted by gamma, the discount factor, to the power of their
     delay. */
  var CAP600 = [
    "In practice, later rewards count a little less.",
    "Here " + tex("\\gamma = 0.9") + ": the weights 1, 0.9, 0.81, ... under the same episode's rewards. Guess " + G1 + ", then press Compute.",
    tex("G_1 = " + tm(D.G1)) + ". Without the weights, " + OB.money(D.sum) + "."
  ];
  OB.scene({
    page: 2, key: "in-practice", order: 600, title: "Discounted return", beats: 3,
    build: function (root) {
      var f = el("div", "s2-formula s2-formula-g");
      f.appendChild(OB.html("span", "", tex("G_1 = \\$r_1 + \\gamma\\,\\$r_2 + \\gamma^2\\,\\$r_3 + \\dots + \\gamma^{12}\\,\\$r_{13}")));
      root.appendChild(f);
      root.appendChild(OB.html("p", "s2-with", "with " + tex("0 < \\gamma < 1")));
      this.here = OB.html("p", "s2-here", "Here " + tex("\\gamma = 0.9"));
      root.appendChild(this.here);
      this.T = S2.runTable(R, { names: true, head: true, weights: true });
      root.appendChild(this.T.grid);
      var r = this.res = el("div", "s2-formula s2-res2");
      r.appendChild(OB.html("span", "", tex("G_1 =\\;")));
      this.g = OB.moneyEl(D.G1);
      this.g.classList.add("ob-texn");
      this.g.textContent = moneyT(D.G1);
      r.appendChild(this.g);
      root.appendChild(r);
      this.cap = OB.html("p", "ob-say s2-cap", CAP600[0]);
      root.appendChild(this.cap);
    },
    beat: function (k, api) {
      var fwd = api.forward && !api.instant && api.from === k - 1, T = this.T;
      api.show(this.here, k >= 1);
      var names = ["head", "s", "a", "r", "w"];
      names.forEach(function (n) { api.show(T["name_" + n], k >= 1); });
      if (k >= 1) {
        if (fwd && k === 1) {
          S2.sweep(api, T, false);
          S2.sweep(api, T, true, { stagger: 90, delay: 300, kinds: ["head", "s", "a", "r"] });
          S2.sweep(api, T, true, { stagger: 140, delay: 2000, kinds: ["w"] });
        } else S2.sweep(api, T, true);
      } else S2.sweep(api, T, false);
      if (k === 1) api.nextLabel("Compute");
      api.show(this.res, k >= 2);
      if (k >= 2) api.roll(this.g, D.G1, fwd && k === 2 ? { from: 0, delay: 300, fmt: moneyT } : { fmt: moneyT });
      this.cap.innerHTML = CAP600[k];
      if (fwd) api.fade(this.cap, true, { dur: 900 });
    }
  });
})();
</script>
<script>/* sec2c.js */
/* sec2c.js: page 2, scene 700 "The goal of RL" (agent A3, 2026-11-14), from Carlos's sketch page 22: four
   deterministic policies, each followed for the same 100 episodes of dice (sec2-data.js, GOAL_SEED), each episode's
   return G1 a dot on one axis, each policy's average return a bar, the highest average lit at the end. */
(function () {
  "use strict";
  var OB = window.OB, B = window.B, el = OB.el, D = OB.sec2;
  /* Formulas by KaTeX (tex.js): G1, and the average return of a policy as an equation. */
  var G1 = OB.tex("G_1");
  function avgEq(x) { return OB.tex("\\bar{G}_1 = " + OB.texNum(OB.money(x))); }
  var N = D.GOAL_N, A = D.AXIS;

  function xPct(g) { return ((g - A.lo) / (A.hi - A.lo) * 100).toFixed(3) + "%"; }
  /* A dot's height in its lane, spread by the episode's number (no randomness): 10% to 90% of the lane. */
  function yPct(i) { return (10 + ((i * 53) % 97) / 96 * 80).toFixed(2) + "%"; }

  var CAP700 = [
    "Four deterministic policies. Each is followed for " + N + " episodes, with the same luck for all four.",
    null, null, null, null,
    null
  ];
  function capLane(k) {
    var s = D.STRATS[k];
    return s.name + ": each dot is the " + G1 + " of one episode; the bar is their average, " + avgEq(s.avg) + ".";
  }
  CAP700[5] = D.STRATS[D.best].name + " yields the highest expected return. Discovering such a policy is the goal of RL.";

  OB.scene({
    page: 2, key: "goal", order: 700, title: "The goal of RL", beats: 6,
    build: function (root) {
      root.appendChild(OB.html("p", "ob-say s2-goalsay s2-lead", "Discover a policy with the highest expected return (the return on average)!"));
      var g = el("div", "s2-goal");
      this.lanes = [];
      var self = this;
      D.STRATS.forEach(function (s, k) {
        var lab = el("div", "s2-glab");
        var cells = el("div", "s2-gcells");
        for (var st = 0; st < 4; st++) cells.appendChild(OB.runs.cell(st, s.policy[st], false));
        lab.appendChild(cells);
        lab.appendChild(el("div", "s2-gname", s.name));
        g.appendChild(lab);
        var bw = el("div", "s2-gblock");
        var block = OB.runs.block(s.runs, { compact: true, g1: false, height: 84, width: 13 * 6 });
        bw.appendChild(block);
        g.appendChild(bw);
        var dots = el("div", "s2-gdots");
        var zero = el("span", "s2-zero");
        zero.style.left = xPct(0);
        dots.appendChild(zero);
        var box = el("div", "s2-dl");
        var dl = el("div", "s2-dw");
        box.appendChild(dl);
        var ds = [];
        s.g1.forEach(function (v, i) {
          var d = el("span", "s2-dot");
          d.style.left = xPct(v);
          d.style.top = yPct(i);
          dl.appendChild(d);
          ds.push(d);
        });
        dots.appendChild(box);
        var bar = el("span", "s2-avg");
        bar.style.left = xPct(s.avg);
        dots.appendChild(bar);
        var lbl = OB.html("span", "s2-avgl", avgEq(s.avg));
        lbl.style.left = xPct(s.avg);
        dots.appendChild(lbl);
        g.appendChild(dots);
        self.lanes.push({ lab: lab, bw: bw, block: block, dots: dots, dl: dl, ds: ds, bar: bar, lbl: lbl });
      });
      // the axis of G1, under the lanes
      g.appendChild(el("div", "s2-gaxl"));
      g.appendChild(OB.html("div", "s2-gaxb", G1));
      var ax = el("div", "s2-gaxis");
      A.ticks.forEach(function (t) {
        var tk = el("span", "s2-tick", OB.money(t));
        tk.style.left = xPct(t);
        ax.appendChild(tk);
      });
      g.appendChild(ax);
      root.appendChild(g);
      this.cap = OB.html("p", "ob-say s2-cap", CAP700[0]);
      root.appendChild(this.cap);
    },
    beat: function (k, api) {
      var fwd = api.forward && !api.instant && api.from === k - 1;
      this.lanes.forEach(function (L, j) {
        var on = k >= j + 1, fresh = fwd && k === j + 1;
        L.lab.classList.toggle("s2-win", k >= 5 && j === D.best);
        api.ring(L.lbl, false);
        if (!on) {
          api.show(L.block, false);
          api.show(L.dl, false);
          api.show(L.bar, false);
          api.show(L.lbl, false);
          return;
        }
        if (!fresh) {
          api.show(L.block, true);
          L.ds.forEach(function (d) { d.style.transform = ""; d.style.opacity = ""; });
          api.show(L.dl, true);
          api.show(L.bar, true);
          api.show(L.lbl, true);
          return;
        }
        // the episodes appear, each episode's G1 flies from its row to the axis, then the average's bar
        api.show(L.block, true);
        api.show(L.dl, false);
        api.show(L.bar, false);
        api.show(L.lbl, false);
        api.at(1300, function () {
          var cv = L.block.canvas.getBoundingClientRect(), box = L.dl.getBoundingClientRect();
          L.dl.classList.remove("ob-hide");
          var start = L.ds.map(function (d, i) {
            var fx = box.left + parseFloat(d.style.left) / 100 * box.width;
            var fy = box.top + parseFloat(d.style.top) / 100 * box.height;
            var sx = cv.right + 6, sy = cv.top + (i + 0.5) / N * cv.height;
            return [sx - fx, sy - fy];
          });
          L.ds.forEach(function (d, i) {
            d.style.opacity = "0";
            d.style.transform = "translate(" + start[i][0] + "px," + start[i][1] + "px)";
          });
          api.animate(2000, function (p) {
            L.ds.forEach(function (d, i) {
              var s0 = i / N * 0.55, q = Math.max(0, Math.min(1, (p - s0) / 0.45));
              d.style.opacity = q > 0 ? "1" : "0";
              d.style.transform = "translate(" + (start[i][0] * (1 - q)).toFixed(1) + "px," + (start[i][1] * (1 - q)).toFixed(1) + "px)";
            });
          }, function () {
            L.ds.forEach(function (d) { d.style.transform = ""; d.style.opacity = ""; });
          });
        });
        api.show(L.bar, true, { delay: 3500 });
        api.show(L.lbl, true, { delay: 3500 });
      });
      if (k >= 5) {
        var W = this.lanes[D.best];
        if (fwd) api.at(300, function () { api.ring(W.lbl, true); }); else api.ring(W.lbl, true);
        /* the winner's average: confetti once the ring has closed (juice.js; design/arcade-marquee-motion) */
        if (fwd && OB.fx && OB.fx.celebrate) api.at(700, function () { OB.fx.celebrate(W.lbl); });
      }
      this.cap.innerHTML = k >= 1 && k <= 4 ? capLane(k - 1) : CAP700[k];
      if (fwd) api.fade(this.cap, true, { dur: 900 });
    }
  });
})();
</script>
<script>/* fullscreen.js */
/* fullscreen.js: the full-screen button of the AINIT games (2026-11-11; Carlos shows the games from his iPad).
   The same file in every game. The button goes after the light or dark switch (.themebtn) and takes its look; a
   page without that switch marks the place with data-fullscreen. One tap and the page fills the whole screen, with
   no address bar or tabs, in Safari and Chrome on an iPad and on a computer. The button is left out where the
   browser cannot do that (an iPhone, a frame that does not allow it), and hidden on screens under 561 px and while
   the page is full screen. The browser's own exit button, a swipe down on an iPad, or Escape leave full screen. */

      var sx = 1 + (o.sx - 1) * u, sy = 1 + (o.sy - 1) * u;
      var lift = 1 + 0.1 * Math.sin(Math.PI * clamp((t - 0.04) / 0.86)) + 0.06 * wind;
      var sq = t > 0.86 ? Math.sin((t - 0.86) / 0.14 * Math.PI) : 0;       // the squash of the landing
      var qx = lift * (1 + 0.16 * sq), qy = lift * (1 - 0.14 * sq);
      var tilt = small ? dir * 7 * Math.sin(Math.PI * u) - dir * 4 * wind : 0;
      var cx = w * sx / 2, cy = h * sy / 2;
      g.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) translate(" + cx.toFixed(2) + "px," + cy.toFixed(2) + "px) rotate(" +
        tilt.toFixed(2) + "deg) scale(" + qx.toFixed(4) + "," + qy.toFixed(4) + ") translate(" + (-cx).toFixed(2) + "px," + (-cy).toFixed(2) + "px) scale(" +
        sx.toFixed(4) + "," + sy.toFixed(4) + ")";
      if (o.fade) g.style.opacity = t > 0.78 ? String(clamp(1 - (t - 0.78) / 0.2)) : "";
      if (small && t > 0.12 && t < 0.86) {
        var now = performance.now();
        if (now - lastTrail > 55) { lastTrail = now; BURST.trail({ x: a0.x + x + cx, y: a0.y + y + cy }, color); }
      }
    };
  }
  function landed(to, opts) {
    if (!live() || !to) return;
    var c = centre(to);
    if (!c) return;
    var big = c.w > 260 || c.h > 160;
    bump(to, big ? 0.04 : Math.min(0.3, 0.22 * 70 / Math.max(30, Math.max(c.w, c.h)) + 0.1));
    if (big || (opts && opts.fxQuiet)) return;
    var m = moneyOf(to);
    if (m > 0) BURST.coins(c); else if (m < 0) BURST.zap(c); else BURST.sparkle(c);
  }

  /* ================================================================================================================
     Rolls (api.roll): the number glows while it counts and bumps when it lands, with sparks for a score (a number
     outside the tables). */
  function roll(e, from, to, opts) {
    if (!live() || !e.classList) return null;
    e.classList.add("fx-rolling");
    var quiet = (opts && opts.fxQuiet) || !!(e.closest && e.closest(".tb"));
    return {
      done: function (natural) {
        e.classList.remove("fx-rolling");
        if (!natural) return;
        bump(e, quiet ? 0.16 : 0.32, C.bump);
        if (quiet) return;
        var c = centre(e);
        if (!c) return;
        if (moneyOf(e) > 0 || (e.classList.contains("gain"))) BURST.coins(c); else BURST.sparkle(c);
      }
    };
  }

  /* ================================================================================================================
     Arrows (api.arrow): a spark rides the tip while the arrow draws itself, and the head snaps on. */
  function arrow(A) {
    if (!live() || !A || !A.svg || !A.line) return null;
    var dot = OB.svgEl("circle", { "class": "fx-tip", r: "5.5" });
    A.svg.appendChild(dot);
    return {
      tick: function (p) {
        var L = 0;
        try { L = A.line.getTotalLength(); } catch (e) { L = 0; }
        if (!L) { dot.style.display = "none"; return; }
        var pt = A.line.getPointAtLength(L * clamp(p));
        dot.style.display = "";
        dot.setAttribute("cx", pt.x.toFixed(1));
        dot.setAttribute("cy", pt.y.toFixed(1));
      },
      done: function (natural) {
        if (dot.parentNode) dot.parentNode.removeChild(dot);
        if (natural && A.head) {
          A.head.classList.add("fx-head");
          OB.animate(380, function (p) { var t = lin(p); A.head.style.scale = (1 + 0.55 * wobble(t) * Math.min(1, t * 10)).toFixed(4); },
            function () { A.head.style.scale = ""; });
        }
      }
    };
  }

  /* ================================================================================================================
     Beats: the scene's head comes in, the stage card lights its marquee and drops its title, the vans of a few
     scenes idle, the pager's coin and the beat's dot pop. cut: what CSS started is stopped. */
  var IDLE = ".s1-vans, .s1-flow, .s1-rflow, .ob-card .road";
  function decorate(sec) {
    if (sec.fxDone) return;
    sec.fxDone = true;
    Array.prototype.slice.call(sec.querySelectorAll(IDLE)).forEach(function (box) { box.classList.add("fx-idle"); });
    Array.prototype.slice.call(sec.querySelectorAll(".fx-idle .ob-van")).forEach(function (v) {
      if (v.querySelector(".fx-puffs")) return;
      var pf = doc.createElement("span");
      pf.className = "fx-puffs";
      pf.setAttribute("aria-hidden", "true");
      for (var i = 0; i < 3; i++) pf.appendChild(doc.createElement("i"));
      v.appendChild(pf);
    });
    var card = sec.querySelector(".ob-card");
    if (card && !card.querySelector(".fx-bulbs")) {
      ["top", "bottom"].forEach(function (side) {
        var b = doc.createElement("div");
        b.className = "fx-bulbs " + side;
        b.setAttribute("aria-hidden", "true");
        for (var i = 0; i < 22; i++) { var s = doc.createElement("i"); s.style.setProperty("--i", String(i)); b.appendChild(s); }
        card.appendChild(b);
      });
    }
  }
  function headIn(sec) {
    var no = sec.querySelector(".scene-head .scene-no"), h2 = sec.querySelector(".scene-head h2");
    if (!h2) return;
    OB.animate(C.head, function (p) {
      var t = lin(p);
      var q = clamp(t / 0.8);
      h2.style.translate = (-34 * (1 - backOut(q, 1.6))).toFixed(2) + "px 0";
      h2.style.opacity = String(clamp(q * 2.4));
      if (no) {
        no.style.scale = mix(0.2, 1, backOut(clamp(t / 0.7), 2.6)).toFixed(4);
        no.style.rotate = (-200 * (1 - out3(clamp(t / 0.75)))).toFixed(1) + "deg";
      }
    }, function () {
      h2.style.translate = ""; h2.style.opacity = "";
      if (no) { no.style.scale = ""; no.style.rotate = ""; }
    });
  }
  function cardIn(sec) {
    var card = sec.querySelector(".ob-card");
    if (!card) return;
    var title = card.querySelector(".title"), kick = card.querySelector(".kicker"), van = card.querySelector(".drive");
    card.classList.remove("fx-in");
    void card.offsetWidth;
    card.classList.add("fx-in");
    OB.animate(1500, function (p) {
      var t = lin(p) * 1.5;   // seconds
      if (title) {
        var q = clamp((t - 0.18) / 0.62);
        var drop = q < 0.62 ? -90 * (1 - io3(q / 0.62)) : 0;
        var sq = q >= 0.62 ? Math.sin((q - 0.62) / 0.38 * Math.PI) * (1 - (q - 0.62) / 0.38 * 0.4) : 0;
        title.style.translate = "0 " + drop.toFixed(2) + "px";
        title.style.scale = (1 + 0.12 * sq).toFixed(4) + " " + (1 - 0.16 * sq).toFixed(4);
        title.style.opacity = String(clamp(q * 3));
      }
      if (kick) {
        var k = clamp(t / 0.6);
        kick.style.letterSpacing = mix(0.9, 0.16, out3(k)).toFixed(3) + "em";
        kick.style.opacity = String(out3(k));
      }
    }, function () {
      if (title) { title.style.translate = ""; title.style.scale = ""; title.style.opacity = ""; }
      if (kick) { kick.style.letterSpacing = ""; kick.style.opacity = ""; }
      card.classList.remove("fx-in");
    });
    if (van) {
      van.classList.add("fx-drive");
      for (var j = 0; j < 6; j++) (function (j) {
        OB.at(120 + j * 210, function () {
          var r = van.getBoundingClientRect();
          if (r.width) BURST.puff({ x: r.left + r.width * 0.06, y: r.top + r.height * 0.72, dir: Math.PI * 1.05 }, 2);
        });
      })(j);
      OB.at(1400, function () { van.classList.remove("fx-drive"); });
    }
  }
  function beat(s, k, api, entering) {
    if (!s || !s.sec) return;
    still();
    if (OFF || OB.fx.off) return;
    decorate(s.sec);
    var go = live() && api.forward && !api.instant;
    html.classList.toggle("fx-live", go);
    if (!go) return;
    if (entering && s.card) cardIn(s.sec);
    else if (entering) headIn(s.sec);
    if (entering) {
      var cur = doc.querySelector(".pager button[aria-current]");
      if (cur) bump(cur, 0.35, 520);
    }
    var dot = doc.querySelector(".beats i.on");
    if (dot) bump(dot, 0.6, 420);
  }
  function cut() {
    html.classList.remove("fx-live");
    Array.prototype.slice.call(doc.querySelectorAll(".fx-in, .fx-drive, .fx-spin")).forEach(function (e) {
      e.classList.remove("fx-in", "fx-drive", "fx-spin");
    });
    /* a die still in the air lands at once (a beat that tosses it again adds the class back) */
    Array.prototype.slice.call(doc.querySelectorAll(".ob-die.tumble")).forEach(function (e) { e.classList.remove("tumble"); });
  }

  /* A die is tossed (art.setDie with roll true, juice.css fx-toss, 1.5 s): dust where it lands, at 66% and 88%. */
  if (OB.art && typeof OB.art.setDie === "function") {
    var setDie0 = OB.art.setDie;
    OB.art.setDie = function (e, n, roll) {
      setDie0(e, n, roll);
      if (!roll || !live()) return;
      [990, 1320].forEach(function (ms, i) {
        OB.at(ms, function () {
          var r = e.getBoundingClientRect();
          if (r.width) BURST.dust({ x: r.left + r.width / 2, y: r.bottom - 2, w: r.width }, i);
        });
      });
    };
  }

  /* tally(froms, values, target, total, fmt, opts): the Compute of a return. A copy of each reward flies from its
     week into the total, one after the other (opts.delay ms, then opts.stagger ms apart, opts.dur ms each), and the
     total counts up by that reward as it lands: the room sees the sum built week by week. Returns false when motion is
     off, and the section then rolls the number as before. The total ends on fmt(total) in every case. */
  function tally(froms, values, target, total, fmt, opts) {
    if (!live() || !target || !froms || !froms.length) return false;
    opts = opts || {};
    var d0 = opts.delay || 0, st = opts.stagger || 80, dur = opts.dur || 640, sum = 0, left = froms.length;
    target.dataset.v = String(total);
    target.textContent = fmt(0);
    function sign(x) {
      var r = Math.round(x * 100) / 100;
      target.classList.toggle("gain", r > 0);
      target.classList.toggle("loss", r < 0);
    }
    sign(0);
    froms.forEach(function (f, i) {
      OB.at(d0 + i * st, function () { bump(f, 0.28, 380); });
      toss(f, target, { delay: d0 + i * st, dur: dur, arc: 46, scale: 0.6, fade: true, land: function (natural) {
        sum += values[i];
        left -= 1;
        var end = left === 0;
        target.textContent = fmt(end ? total : sum);
        sign(end ? total : sum);
        if (!natural) return;
        bump(target, end ? 0.34 : 0.1, end ? C.bump : 260);
        if (end) { var c = centre(target); if (c) (total >= 0 ? BURST.coins : BURST.zap)(c); }
      } });
    });
    return true;
  }

  /* ================================================================================================================
     Calls for the sections. */
  function burst(target, kind) {
    if (!live()) return;
    var c = centre(target);
    if (!c) return;
    (BURST[kind] || BURST.sparkle)(c);
  }
  /* toss(from, to, opts): a copy of from flies to to on the arc of api.fly, without hiding to; opts.dur (ms), opts.delay
     (ms), opts.arc, opts.land (called when it lands, or at once when the beat is cut), opts.scale (end size). */
  function toss(from, to, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      OB.at(opts.delay || 0, function () {
        var a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
        if (!live() || !a.width || !b.width) { if (opts.land) opts.land(false); resolve(); return; }
        var g = from.cloneNode(true);
        g.removeAttribute("id");
        g.classList.remove("ob-hide", "ob-ring");
        g.classList.add("ob-ghost", "fx-fly");
        var cs = window.getComputedStyle(from);
        ["fontSize", "fontFamily", "fontWeight", "color", "letterSpacing", "lineHeight", "whiteSpace"].forEach(function (k) { g.style[k] = cs[k]; });
        g.style.left = a.left + "px"; g.style.top = a.top + "px"; g.style.width = a.width + "px"; g.style.height = a.height + "px";
        g.style.visibility = "visible"; g.style.opacity = "";
        doc.body.appendChild(g);
        var sc = opts.scale || 0.8;
        var path = flight(g, { dx: b.left + b.width / 2 - a.left - a.width * sc / 2, dy: b.top + b.height / 2 - a.top - a.height * sc / 2,
          sx: sc, sy: sc, arc: opts.arc === undefined ? 60 : opts.arc, w: a.width, h: a.height, from: from, to: to, opts: {}, fade: !!opts.fade });
        OB.animate(opts.dur || 800, function (p) { if (path) path(p); }, function () {
          if (g.parentNode) g.parentNode.removeChild(g);
          if (opts.land) opts.land(true);
          resolve();
        });
      });
    });
  }
  function celebrate(target) {
    if (!live()) return;
    var c = centre(target);
    if (!c) return;
    BURST.confetti(c);
    OB.at(260, function () { BURST.confetti({ x: c.x - c.w * 0.35, y: c.y, w: c.w / 3 }, 22); });
    OB.at(420, function () { BURST.confetti({ x: c.x + c.w * 0.35, y: c.y, w: c.w / 3 }, 22); });
  }
  function milestone(target) {
    if (!live()) return;
    var c = centre(target);
    if (c) BURST.milestone(c);
  }

  OB.fx = { off: OFF, config: C, enter: enter, flight: flight, landed: landed, roll: roll, arrow: arrow, beat: beat, cut: cut,
    burst: burst, toss: toss, tally: tally, celebrate: celebrate, milestone: milestone, bump: bump, shake: shake, live: live };
})();
</script>
<script>OB.start({ page: 2, card: { kicker: "OLD BESSIE 2", title: "Episodes and returns" } });</script>
</body>
