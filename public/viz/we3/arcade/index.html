<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRESS START</title>
  <link rel="stylesheet" href="css/arcade.css">
</head>
<body>
  <header class="top">
    <span class="fs-host" data-fullscreen></span>
  </header>

  <main class="arcade">
    <h1 class="logo">PRESS START</h1>
    <p class="prompt"><span class="blink">&#9654;</span> CHOOSE A GAME</p>

    <nav class="carts" aria-label="Games">
      <a class="cart" href="repair-or-replace/index.html" data-sprite="van" style="--acc:#9aa7ff">
        <span class="cart-label"></span>
        <span class="cart-sprite"></span>
        <span class="cart-text">
          <span class="cart-name">OLD BESSIE</span>
          <span class="cart-sub">REPAIR OR REPLACE</span>
          <span class="cart-blurb">One van, four states of wear. Run it, shop it, or buy new.</span>
        </span>
      </a>
      <a class="cart" href="anymal/index.html" data-sprite="robot" style="--acc:#60a5fa">
        <span class="cart-label"></span>
        <span class="cart-sprite"></span>
        <span class="cart-text">
          <span class="cart-name">ANYMAL</span>
          <span class="cart-sub"></span>
          <span class="cart-blurb">A robot dog roams a grid chasing treats.</span>
        </span>
      </a>
      <a class="cart" href="last-minute-pricing/index.html" data-sprite="tag" style="--acc:#ff8a3c">
        <span class="cart-label"></span>
        <span class="cart-sprite"></span>
        <span class="cart-text">
          <span class="cart-name">LAST-MINUTE PRICING</span>
          <span class="cart-sub"></span>
          <span class="cart-blurb">Perishable stock, a midnight deadline. Set a price each day.</span>
        </span>
      </a>
      <a class="cart" href="pokemon-battle/index.html" data-sprite="pokeball" style="--acc:#ffe000">
        <span class="cart-label"></span>
        <span class="cart-sprite"></span>
        <span class="cart-text">
          <span class="cart-name">POKEMON BATTLE</span>
          <span class="cart-sub"></span>
          <span class="cart-blurb">A wild CHARMANDER appeared!</span>
        </span>
      </a>
    </nav>
  </main>

  <script src="js/arcade.js"></script>
  <script src="js/fullscreen.js"></script>
</body>
</html>
